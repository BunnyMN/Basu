# What `npm run verify` does on a laptop, on every push.
#
# One step on purpose: verify already runs the stages in the order that makes a
# failure easy to read — arithmetic, then a whole simulated service, then the
# real database, then a live server over HTTP — and starts and stops the API
# itself. Splitting it here would only mean two places to keep in step.
#
# The iOS half is not here. It needs a macOS runner and a booted simulator,
# which is minutes of billed time on every push for a suite that only breaks
# when somebody touches Swift. Run `npm run ios:test` before opening a PR that
# does; CONTRIBUTING.md says so too.
#
# When verify passes on main, the same run deploys that commit to the pilot
# server (basu.burzai.cloud): one SSH login with a key that can do nothing
# but run scripts/deploy-entry.sh there. A PR never deploys; a push to main
# that fails verify never deploys. `workflow_dispatch` is the redeploy button.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        # The major version the pilot runs. Three of the guarantees live in the
        # schema — a gist exclusion constraint on table holds, a partial unique
        # index on fire jobs, a deferred trigger on the ledger — and none of
        # them exist on a lighter stand-in.
        image: postgres:16
        env:
          POSTGRES_USER: basu
          POSTGRES_PASSWORD: basu
          POSTGRES_DB: basu_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://basu:basu@localhost:5432/basu_dev
      TEST_DATABASE_URL: postgres://basu:basu@localhost:5432/basu_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tests own their own database so a broken run can never touch the demo
      # data the smoke test walks through.
      - name: Create the test database
        run: PGPASSWORD=basu createdb -h localhost -U basu basu_test

      - run: npm ci

      - run: npm run verify

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Two pushes in quick succession deploy one after the other, never over
    # each other.
    concurrency:
      group: deploy-pilot
      cancel-in-progress: false

    steps:
      - name: Deploy ${{ github.sha }} to the pilot
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The command is the commit; the server's forced command reads it
          # and refuses anything that is not on main.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes "root@$DEPLOY_HOST" "${{ github.sha }}"
