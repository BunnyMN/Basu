# The iOS app, described rather than clicked together.
#
# An .xcodeproj is a generated artefact: it churns on every file added and
# resolves conflicts badly. This file is the source, `xcodegen generate` makes
# the project, and the project itself is not in git.
name: Basu
options:
  bundleIdPrefix: mn.basu
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  Basu:
    type: application
    platform: iOS
    sources:
      - path: Basu
    info:
      path: Basu/Info.plist
      properties:
        CFBundleDisplayName: Basu
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The whole product is "the kitchen starts cooking as you approach", so
        # the app has to be able to tell how close the guest is. Foreground
        # only for now: the bands are reported while the status screen is up.
        NSLocationWhenInUseUsageDescription: >-
          Хэр ойрхон байгааг тань мэдвэл гал тогоо хоолыг чинь яг таарах цагт
          нь тавина. Байршлыг зөвхөн захиалга явж байх үед асууна.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # The demo API runs on the developer's own machine over http. The
          # exception is localhost and nothing else.
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.basu.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BasuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BasuUITests
    dependencies:
      - target: Basu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.basu.app.uitests
        GENERATE_INFOPLIST_FILE: YES

  BasuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BasuTests
    dependencies:
      - target: Basu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.basu.app.tests
        GENERATE_INFOPLIST_FILE: YES
