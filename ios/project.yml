# The iOS app, described rather than clicked together.
#
# An .xcodeproj is a generated artefact: it churns on every file added and
# resolves conflicts badly. This file is the source, `xcodegen generate` makes
# the project, and the project itself is not in git.
name: Basu
options:
  bundleIdPrefix: mn.basu
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  # The developer's own settings live in Developer.xcconfig, which git does
  # not see. Made from the example on first generate so the project never
  # points at a file that is not there.
  preGenCommand: "[ -f Developer.xcconfig ] || cp Developer.example.xcconfig Developer.xcconfig"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    # Defaults for what Developer.xcconfig may override. They sit at the
    # project level on purpose: a target's own settings outrank its xcconfig,
    # and these have to lose to it.
    #
    # BASU_ID_SUFFIX — appended to every identifier: mn.basu.app, its
    # extensions, and the App Group. Identifiers are unique across all Apple
    # teams; a personal team cannot sign for ones another team registered,
    # so it builds as mn.basu.app.yourname instead.
    BASU_ID_SUFFIX: ""
    # BASU_API — where a debug build on a real phone finds the API.
    BASU_API: ""
    # BASU_DEBUG_ENTITLEMENTS — which entitlements a debug build signs with.
    # The default has no push, so a free personal team can build; a team in
    # the Developer Program sets Basu/Basu.entitlements in Developer.xcconfig
    # and gets push tokens on a debug build too, which is how the server's
    # push is tested from a phone without a release build.
    BASU_DEBUG_ENTITLEMENTS: Basu/Basu.debug.entitlements

# Shared by the app and the widget extension: tokens, the activity attributes,
# the order snapshot both read. It imports nothing from the app.
packages:
  BasuKit:
    path: BasuKit
  # Google's WebRTC, built for iOS: calls between a guest and a supplier
  # (Basu/Calls). A binary framework; pinned, because a WebRTC that moves
  # under a release is a call that stops connecting.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: "154.0.0"

# Manrope (static 400 / 500 / 600 / 700) for words and Noto Sans Display
# Condensed (700 / 800) for headings, money, times and codes — the web's own
# two faces since «Тансаг хар». Every target that draws text bundles them and
# lists them under UIAppFonts; the names match BasuFont.files.
fonts: &fonts
  - Manrope-Regular.ttf
  - Manrope-Medium.ttf
  - Manrope-SemiBold.ttf
  - Manrope-Bold.ttf
  - NotoSansDisplay-CondensedBold.ttf
  - NotoSansDisplay-CondensedExtraBold.ttf

targets:
  Basu:
    type: application
    platform: iOS
    sources:
      - path: Basu
      - path: Fonts
        buildPhase: resources
        excludes: ["*.txt"]
    dependencies:
      - package: BasuKit
      - package: WebRTC
      - target: BasuWidgets
        embed: true
    configFiles:
      Debug: Developer.xcconfig
      Release: Developer.xcconfig
    # Entitlements are two committed files rather than one generated here,
    # because a personal (free) development team cannot sign for Push
    # Notifications and a debug build gets no push token anywhere it runs:
    #   Basu/Basu.entitlements        App Group + push   — Release
    #   Basu/Basu.debug.entitlements  App Group only     — Debug
    # `entitlements:` would write one path into every configuration.
    info:
      path: Basu/Info.plist
      properties:
        CFBundleDisplayName: Basu
        CFBundleShortVersionString: "1.0.7"
        CFBundleVersion: "13"
        UIAppFonts: *fonts
        # Dark whatever the phone's own setting: «Тансаг хар» has no light
        # palette, so sheets, alerts and the keyboard are dark too.
        UIUserInterfaceStyle: Dark
        # The order's progress on the lock screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        # Profile → Тохиргоо: the app lock (AppLock.swift).
        NSFaceIDUsageDescription: Basu-г зөвхөн та нээх боломжтой байлгахын тулд Face ID ашиглана.
        # A call about an order (Basu/Calls): the voice, and the camera that
        # shows the animal. Asked the first time either is used, never before.
        NSMicrophoneUsageDescription: Захиалгынхаа талаар нийлүүлэгч эсвэл захиалагчтайгаа ярихад микрофон хэрэгтэй.
        NSCameraUsageDescription: Дуудлагын үеэр малаа, махаа харуулахад камер хэрэгтэй.
        # A ring wakes the app through PushKit (voip), and the call keeps
        # talking with the screen off (audio).
        UIBackgroundModes:
          - audio
          - voip
        # basu://order/{id}, basu://wallet, basu://notifications
        CFBundleURLTypes:
          - CFBundleURLName: mn.basu.app$(BASU_ID_SUFFIX)
            CFBundleURLSchemes: [basu]
        # The bank apps a QPay invoice opens (QPaySheet), asked about so the
        # sheet can put the ones on this phone first. Wire's list of
        # 2026-10-05; a bank not named here is still offered, only not first.
        LSApplicationQueriesSchemes:
          - qpaywallet
          - khanbank
          - statebankmongolia
          - xacbank
          - tdbbank
          - tdbwallet
          - socialpay-payment
          - most
          - nibank
          - ckbank
          - capitronbank
          - bogdbank
          - transbank
          - mbank
          - ard
          - toki
          - arig
          - monpay
          - hipay
          - sono
          - payon
          - tino
          - pass
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The whole product is "the kitchen starts cooking as you approach", so
        # the food app has to be able to tell how close the guest is. That app
        # is a web page inside the shell, and its `navigator.geolocation` asks
        # through this string. Foreground only: the bands are reported while
        # the page is up.
        # One register throughout: «тань», never «чинь».
        NSLocationWhenInUseUsageDescription: >-
          Хэр ойрхон байгааг тань мэдвэл гал тогоо хоолыг тань яг ирэх цагт тань
          бэлэн болгоно. Байршлыг зөвхөн захиалга явж байх үед асууна.
        ITSAppUsesNonExemptEncryption: false
        # A developer's override for a debug build on a real phone: the app
        # talks to the pilot unless this says otherwise, and a phone launched
        # from its own Home Screen has no environment to read it from, so it
        # is baked in at build time: `xcodebuild … BASU_API=http://192.168.x.x:3000`
        # (the Mac's LAN address; `localhost` on a phone is the phone). Empty
        # by default, and ignored by release builds.
        BasuAPI: $(BASU_API)
        # The App Group the widget shares, read by BasuKit at run time so the
        # suffix reaches the code as well as the entitlements.
        BasuAppGroup: group.mn.basu.shared$(BASU_ID_SUFFIX)
        NSAppTransportSecurity:
          # The demo API runs on the developer's own machine over http, and
          # the apps inside the shell are pages from it. The exception is
          # localhost (and, for a phone, the Mac's LAN address) and nothing
          # else; the pilot is https.
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.basu.app$(BASU_ID_SUFFIX)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: $(BASU_DEBUG_ENTITLEMENTS)
        Release:
          CODE_SIGN_ENTITLEMENTS: Basu/Basu.entitlements

  # WidgetKit + ActivityKit UI. Renders whatever the timeline or the activity
  # hands it; never touches the network.
  BasuWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BasuWidgets
      - path: Fonts
        buildPhase: resources
        excludes: ["*.txt"]
    dependencies:
      - package: BasuKit
    configFiles:
      Debug: Developer.xcconfig
      Release: Developer.xcconfig
    entitlements:
      path: BasuWidgets/BasuWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.mn.basu.shared$(BASU_ID_SUFFIX)
    info:
      path: BasuWidgets/Info.plist
      properties:
        CFBundleDisplayName: Basu
        CFBundleShortVersionString: "1.0.7"
        CFBundleVersion: "13"
        BasuAppGroup: group.mn.basu.shared$(BASU_ID_SUFFIX)
        UIAppFonts: *fonts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.basu.app$(BASU_ID_SUFFIX).widgets
        TARGETED_DEVICE_FAMILY: "1"

  BasuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BasuUITests
    dependencies:
      - target: Basu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.basu.app$(BASU_ID_SUFFIX).uitests
        GENERATE_INFOPLIST_FILE: YES

  BasuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BasuTests
    dependencies:
      - target: Basu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.basu.app$(BASU_ID_SUFFIX).tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Basu:
    build:
      targets:
        Basu: all
        BasuWidgets: [run, test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BasuTests
        - package: BasuKit/BasuKitTests
        - BasuUITests
