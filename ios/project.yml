# The iOS app, described rather than clicked together.
#
# An .xcodeproj is a generated artefact: it churns on every file added and
# resolves conflicts badly. This file is the source, `xcodegen generate` makes
# the project, and the project itself is not in git.
name: Basu
options:
  bundleIdPrefix: mn.basu
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

# Shared by the app and the widget extension: tokens, the activity attributes,
# the order snapshot both read. It imports nothing from the app.
packages:
  BasuKit:
    path: BasuKit

# Golos Text and JetBrains Mono, static 400 / 500 / 600. Every target that
# draws text bundles them and lists them under UIAppFonts.
fonts: &fonts
  - GolosText-Regular.ttf
  - GolosText-Medium.ttf
  - GolosText-SemiBold.ttf
  - JetBrainsMono-Regular.ttf
  - JetBrainsMono-Medium.ttf
  - JetBrainsMono-SemiBold.ttf

targets:
  Basu:
    type: application
    platform: iOS
    sources:
      - path: Basu
      - path: Fonts
        buildPhase: resources
        excludes: ["*.txt"]
    dependencies:
      - package: BasuKit
      - target: BasuWidgets
        embed: true
    # Entitlements are two committed files rather than one generated here,
    # because a personal (free) development team cannot sign for Push
    # Notifications and a debug build gets no push token anywhere it runs:
    #   Basu/Basu.entitlements        App Group + push   — Release
    #   Basu/Basu.debug.entitlements  App Group only     — Debug
    # `entitlements:` would write one path into every configuration.
    info:
      path: Basu/Info.plist
      properties:
        CFBundleDisplayName: Basu
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIAppFonts: *fonts
        # The order's progress on the lock screen and in the Dynamic Island.
        NSSupportsLiveActivities: true
        # basu://order/{id}, basu://wallet, basu://notifications
        CFBundleURLTypes:
          - CFBundleURLName: mn.basu.app
            CFBundleURLSchemes: [basu]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # The whole product is "the kitchen starts cooking as you approach", so
        # the food app has to be able to tell how close the guest is. That app
        # is a web page inside the shell, and its `navigator.geolocation` asks
        # through this string. Foreground only: the bands are reported while
        # the page is up.
        NSLocationWhenInUseUsageDescription: >-
          Хэр ойрхон байгааг тань мэдвэл гал тогоо хоолыг чинь яг таарах цагт
          нь тавина. Байршлыг зөвхөн захиалга явж байх үед асууна.
        ITSAppUsesNonExemptEncryption: false
        # A developer's override for a debug build on a real phone: the app
        # talks to the pilot unless this says otherwise, and a phone launched
        # from its own Home Screen has no environment to read it from, so it
        # is baked in at build time: `xcodebuild … BASU_API=http://192.168.x.x:3000`
        # (the Mac's LAN address; `localhost` on a phone is the phone). Empty
        # by default, and ignored by release builds.
        BasuAPI: $(BASU_API)
        NSAppTransportSecurity:
          # The demo API runs on the developer's own machine over http, and
          # the apps inside the shell are pages from it. The exception is
          # localhost (and, for a phone, the Mac's LAN address) and nothing
          # else; the pilot is https.
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.basu.app
        BASU_API: ""
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Basu/Basu.debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Basu/Basu.entitlements

  # WidgetKit + ActivityKit UI. Renders whatever the timeline or the activity
  # hands it; never touches the network.
  BasuWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BasuWidgets
      - path: Fonts
        buildPhase: resources
        excludes: ["*.txt"]
    dependencies:
      - package: BasuKit
    entitlements:
      path: BasuWidgets/BasuWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.mn.basu.shared
    info:
      path: BasuWidgets/Info.plist
      properties:
        CFBundleDisplayName: Basu
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UIAppFonts: *fonts
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.basu.app.widgets
        TARGETED_DEVICE_FAMILY: "1"

  BasuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BasuUITests
    dependencies:
      - target: Basu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.basu.app.uitests
        GENERATE_INFOPLIST_FILE: YES

  BasuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BasuTests
    dependencies:
      - target: Basu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mn.basu.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Basu:
    build:
      targets:
        Basu: all
        BasuWidgets: [run, test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BasuTests
        - package: BasuKit/BasuKitTests
        - BasuUITests
