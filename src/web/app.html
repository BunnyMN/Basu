<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<script>
/* The launcher is the phone app's. A browser gets the website's own home,
   with the same tiles. */
if (!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.basu)) {
  location.replace('/home');
}
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100D0C">
<title>Basu · Миний апп</title>
<link rel="icon" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<style>
/* The home screen. Basu is one app with several things inside it, and this is
   the page that says which ones exist. It owns no domain logic: everything
   here is a name, its art and a link — plus whatever of the guest's is
   currently running, because a launcher that cannot tell you your lunch is on
   the fire is just a menu of links.

   «Тансаг хар»: a greeting in the display face, Идэш as the one big tile
   (the season is winter meat), the other apps as smaller tiles under it, and
   each order that is running as one card: what it is, its state in one word
   with the four-bar meter under it, and its day big in the corner with a
   gold word under that. Colours, faces, the meter and the state words come
   from app.css; the tiles and the order card are drawn here, as no other page
   has them. */

/* ── the column ───────────────────────────────────────────────────── */
/* One phone column on the charcoal. A flex column, so the foot rests at the
   bottom of a short screen. The shell runs the page edge to edge: the top
   inset is the status bar's. */
main.wrap{
  display:flex;flex-direction:column;min-height:100dvh;
  padding:calc(var(--safe-t) + 20px) 16px calc(16px + var(--safe-b));
}

/* ── the greeting ─────────────────────────────────────────────────── */
.hello-head{padding:0 4px}
.today{margin:0 0 10px;font-size:.875rem;font-weight:600;line-height:1.2;color:var(--ink-3)}
.today:empty{display:none}
.hello{margin:0;font-family:var(--display);font-size:2.75rem;font-weight:800;line-height:.9;letter-spacing:-.004em;color:var(--ink)}

/* ── the apps ─────────────────────────────────────────────────────── */
/* Each app is a tile of warm charcoal with its own art in a porcelain square
   — the same renders the iPhone launcher shows, never redrawn. Идэш is the
   big one; the rest stand two to a row, and one left alone takes the row as
   a wide tile with its art beside its name. */
.apps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:26px 0 0;padding:0;list-style:none}
.apps > li{display:block;min-width:0;margin:0}
.apps > li[data-big]{grid-column:1 / -1}
.app{
  position:relative;display:block;height:190px;padding:18px;overflow:hidden;
  border-radius:var(--r-lg);border:1px solid rgba(255,244,236,.06);
  background:linear-gradient(160deg,#2A2321 0%,#1D1817 60%);box-shadow:var(--shadow-1);
  color:var(--ink);text-decoration:none;
  transition:transform 120ms var(--ease),border-color var(--dur) var(--ease);
}
.app:active{transform:scale(.985)}
@media (hover:hover){.app:hover{border-color:rgba(255,244,236,.14)}}
.app .tile{
  display:block;width:72px;height:72px;overflow:hidden;border-radius:18px;background:var(--surface-2);
  box-shadow:0 14px 28px -12px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);
}
.app .tile > img{display:block;width:100%;height:100%;object-fit:cover}
.app .name{position:absolute;left:16px;right:16px;bottom:42px;font-family:var(--display);font-size:1.75rem;font-weight:800;line-height:.9;letter-spacing:-.004em}
.app .tag{position:absolute;left:16px;right:12px;bottom:18px;font-size:.8125rem;font-weight:600;line-height:1.1;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .go{position:absolute;right:16px;top:16px;width:20px;height:20px;fill:none;stroke:var(--ink-3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app .over{display:none}

/* the big one: the season's eyebrow in gold, its name huge, its art large on the right */
.app[data-size="lg"]{height:204px;padding:26px 24px}
.app[data-size="lg"] .over{display:block;margin:0;font-size:.75rem;font-weight:700;line-height:1;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.app[data-size="lg"] .name{position:static;display:block;margin-top:8px;font-size:4rem;line-height:.86}
.app[data-size="lg"] .tag{position:static;display:block;max-width:170px;margin-top:12px;font-size:.9375rem;line-height:1.35;white-space:normal}
.app[data-size="lg"] .tile{position:absolute;right:22px;top:50%;width:132px;height:132px;margin-top:-66px;border-radius:30px}
.app[data-size="lg"] .go{display:none}

/* one small app alone in its row: wide and short, its art beside its name */
.apps > li[data-big] + li:last-child{grid-column:1 / -1}
.apps > li[data-big] + li:last-child .app{display:grid;grid-template-columns:72px minmax(0,1fr);column-gap:16px;align-content:center;height:auto;min-height:108px}
.apps > li[data-big] + li:last-child .tile{grid-row:1 / span 2}
.apps > li[data-big] + li:last-child .name{position:static;align-self:end;padding-right:28px}
.apps > li[data-big] + li:last-child .tag{position:static;align-self:start;margin-top:8px}
.apps > li[data-big] + li:last-child .go{top:50%;margin-top:-10px}

/* ── what of the guest's is running ───────────────────────────────── */
.live{margin-top:30px}
.live:not([data-any]){display:none}
/* A token means cards are coming: hold their place instead of letting the page jump. */
.live[data-loading]{display:block}
.live .section-label{margin:0 4px 12px}
#live-list{display:flex;flex-direction:column;gap:10px}
/* One card per order: the picture, what it is, its word and its meter, and
   its day big in the corner with a gold word under it. */
.oc{
  display:flex;align-items:stretch;gap:14px;min-height:94px;padding:14px;
  border-radius:var(--r-md);color:inherit;text-decoration:none;
  transition:background-color 120ms var(--ease),transform 120ms var(--ease);
}
.oc:active{background:var(--surface-2)}
@media (hover:hover){a.oc:hover{background:var(--surface-2)}}
.oc .ph{flex:none;align-self:center;width:64px;height:64px;overflow:hidden;border-radius:14px;background:var(--surface-2)}
.oc .ph img{display:block;width:100%;height:100%;object-fit:cover;filter:sepia(.1) saturate(1.12) contrast(1.08)}
.oc .main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
/* the name on one line, or two when it is long — its count is never cut off */
.oc .title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:1.0625rem;font-weight:700;line-height:1.2;color:var(--ink);overflow-wrap:anywhere}
/* the state is one word, no dot: the meter under it says how far */
.oc .st{display:block;margin-top:6px;line-height:1.2}
#live-list .chip{min-height:0;font-size:.875rem;font-weight:600;color:var(--ink-2)}
#live-list .chip::before{display:none}
/* a word that waits on the guest (an account for a refund) or a refund sent says it in its colour */
#live-list .chip[data-strong]{color:var(--tone-ink)}
#live-list .chip[data-tone="hold"]:not([data-strong]){color:var(--gold)}
.oc .meter{margin-top:10px;min-width:0}
/* the corner is one width on every card, so the dividing hairlines stand in one column; a sum takes what it needs */
.oc .end{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:84px;padding-left:12px;border-left:1px solid var(--line)}
.oc .end:has(> [data-money]){width:auto;min-width:84px}
.oc .end:empty{display:none}
.oc .when{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.oc .when b{display:block;font-family:var(--display);font-size:2rem;font-weight:800;line-height:.9;letter-spacing:-.004em;font-variant-numeric:tabular-nums lining-nums;color:var(--ink);white-space:nowrap}
.oc .when[data-money] b{font-size:1.375rem;line-height:1}
.oc .when b .money{font-weight:inherit;letter-spacing:inherit}
.oc .when small{display:block;font-size:.6875rem;font-weight:800;line-height:1;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
/* the shape of a card while the orders are on their way */
.oc[data-skel]{border:1px solid var(--line);background:var(--surface)}
.oc[data-skel] .ph{background:var(--surface-2)}
.oc[data-skel] .main{gap:10px}
.oc[data-skel] .main .skel{height:14px;min-height:0;width:62%}
.oc[data-skel] .main .skel + .skel{height:12px;width:40%}
.oc[data-skel] .main .skel + .skel + .skel{height:4px;width:100%;border-radius:2px}
.oc[data-skel] .end .skel{width:44px;height:30px}

/* ── the quiet bottom of the page ─────────────────────────────────── */
.foot{
  margin-top:auto;padding-top:36px;display:flex;flex-wrap:wrap;align-items:center;gap:0 var(--s-6);
}
.foot a{display:inline-flex;align-items:center;min-height:var(--target);padding:0 4px;font-size:var(--t-cap);font-weight:600;color:var(--ink-3)}
@media (hover:hover){.foot a:hover{color:var(--ink)}}
/* The kitchen display is a staff door: it shows only where the demo strip does. */
.foot .staff{display:none}
.clockbar ~ .wrap .staff{display:inline-flex}
</style>
</head>
<body>

<main class="wrap">
  <header class="hello-head">
    <p class="today" id="today"></p>
    <h1 class="hello" id="hello">Сайн байна уу</h1>
  </header>

  <ul class="apps" id="apps" aria-label="Аппууд"></ul>

  <section class="live" id="live" aria-labelledby="live-title">
    <h2 class="section-label" id="live-title">Идэвхтэй захиалга</h2>
    <div id="live-list" aria-busy="true">
      <div class="oc" data-skel aria-hidden="true"><span class="ph skel"></span><span class="main"><span class="skel"></span><span class="skel"></span><span class="skel"></span></span><span class="end"><span class="skel"></span></span></div>
    </div>
  </section>

  <footer class="foot">
    <a href="/terms">Үйлчилгээний нөхцөл</a>
    <a href="/privacy">Нууцлалын бодлого</a>
    <a class="staff" href="/kds">Гал тогооны дэлгэц →</a>
  </footer>
</main>

<script type="module">
import { api, photoOf, store, hhmm, mountClock, money, meter, IDESH_STATE, IDESH_STEP, headlineWord, dayLabel, dayShort, ubParts } from '/api.js';

/** Text into markup, never the other way: a supplier's name is a name. Quotes too, so nothing inside an attribute can end it. */
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

const $ = (id) => document.getElementById(id);
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};

/* ── the greeting ─────────────────────────────────────────────────── */

/** The days of the week as a calendar says them, Sunday first (getUTCDay). */
const WEEKDAY = ['Ням', 'Даваа', 'Мягмар', 'Лхагва', 'Пүрэв', 'Баасан', 'Бямба'];

/**
 * «Мягмар, 10-р сарын 13» over «Өглөөний мэнд» — today and the time of day
 * as Ulaanbaatar has them, whatever zone the phone is set to.
 */
function greet() {
  const { day, clock } = ubParts();
  const hour = Number(clock.slice(0, 2));
  $('today').textContent = `${WEEKDAY[new Date(`${day}T12:00:00Z`).getUTCDay()]}, ${dayLabel(day)}`;
  $('hello').textContent = hour >= 5 && hour < 12 ? 'Өглөөний мэнд' : hour >= 12 && hour < 18 ? 'Өдрийн мэнд' : 'Оройн мэнд';
}
greet();

/* ── the apps ─────────────────────────────────────────────────────── */

/** The arrow in a small tile's corner: the tile is a way in. */
const GO = '<svg class="go" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

/**
 * Everything inside Basu, in the order it appears on the home screen.
 *
 * A list rather than markup because this is the file that will grow: the
 * next app is a new entry here and nothing else. Every tile is the app's own
 * art — the render the iPhone launcher shows — sized in the markup, so the
 * grid never jumps while it loads. Идэш is the big one: it is the season.
 */
const APPS = [
  {
    id: 'idesh',
    name: 'Идэш',
    over: 'Энэ улирал',
    tag: 'Бүтэн мал, кг-аар мах',
    href: '/idesh',
    size: 'lg',
    // A box of cuts beside a phone.
    art: '/brand/idesh-tile.webp',
  },
  {
    id: 'dine',
    name: 'Хоол',
    tag: 'Урьдчилан захиалах',
    href: '/dine',
    // The cloche on a waiter's hand.
    art: '/brand/food-tile.webp',
  },
];

/** The supplier's own side of the second app — on the launcher only for the few who are one. */
const SUPPLIER_APP = {
  id: 'supplier',
  name: 'Нийлүүлэгч',
  tag: 'Зараа удирдах',
  href: '/supplier',
  // A ger with a sheep by its door: where the meat comes from.
  art: '/brand/supplier-tile.svg',
};

function tileOf(app) {
  const big = app.size === 'lg';
  return el(`
    <li${big ? ' data-big' : ''}>
      <a class="app" href="${app.href}" data-app="${app.id}"${big ? ' data-size="lg"' : ''}>
        <span class="tile"><img src="${app.art}" alt="" width="${big ? 132 : 72}" height="${big ? 132 : 72}"></span>
        ${app.over ? `<span class="over">${app.over}</span>` : ''}
        <span class="name">${app.name}</span>
        <span class="tag">${app.tag}</span>
        ${big ? '' : GO}
      </a>
    </li>`);
}
for (const app of APPS) $('apps').append(tileOf(app));

/** Draw the supplier's tile when this guest is one; take it away when they are not. */
async function loadSupplierTile() {
  const token = store.guestToken;
  const shown = $('apps').querySelector('[data-app="supplier"]');
  if (!token) {
    shown?.closest('li').remove();
    return;
  }
  let mine = null;
  try {
    ({ supplier: mine } = await api('/v1/supplier/me', { token }));
  } catch {
    return;
  }
  // Asked again after the wait: two refreshes in flight at once must not
  // both find the tile missing and both draw it.
  const drawn = $('apps').querySelector('[data-app="supplier"]');
  const isOne = mine?.state === 'contracted';
  if (isOne && !drawn) $('apps').append(tileOf(SUPPLIER_APP));
  if (!isOne && drawn) drawn.closest('li').remove();
}

/* ── what is already running ──────────────────────────────────────── */

/**
 * The states that carry a time worth putting in the corner of the card, and
 * what that time is called. Anything else gets the slot it was booked for:
 * the time the guest comes, «ирэх» — as the iOS launcher, lock screen and
 * widgets call it, and as a delivery's day is called here.
 */
function moment(order) {
  if (['FIRED', 'COOKING'].includes(order.state) && order.ready_at) {
    return [hhmm(order.ready_at), 'бэлэн'];
  }
  if (order.fire_at && !['READY', 'SERVED'].includes(order.state)) {
    return [hhmm(order.fire_at), 'гал'];
  }
  return [hhmm(order.slot_starts_at), 'ирэх'];
}

/**
 * How far a lunch has come, on the same four bars as an идэш: paid, taken by
 * the kitchen, on the fire, ready. A lunch that ended badly has no meter: its
 * word says it.
 */
const LUNCH_STEP = { PLACED: 1, ACCEPTED: 2, SCHEDULED: 2, ARMED: 2, RESLOTTED: 2, HELD: 2, FIRED: 3, COOKING: 3, READY: 4, SERVED: 4, CLOSED: 4 };

/** The picture on a card: the animal's own photo for an идэш, a steamer of buuz for a lunch. */
const PHOTO = (of) => `/idesh/${photoOf(of)}.jpg`;
const LUNCH_PHOTO = '/brand/meat/buuz-828.webp';

/*
 * The card's word is the state's one word, the same as on every other page:
 * a lunch's from headlineWord() (LUNCH_WORD — «Хүлээн авсан», never
 * «SCHEDULED»), an идэш's from IDESH_STATE («Бэлтгэж байна»); the meter under
 * it says how far along that is.
 */

/**
 * One card of «Идэвхтэй захиалга», whichever app it came from.
 *
 * The section is deliberately not "your lunches": cards are ordered by the
 * moment that matters, so a sheep arriving Tuesday sits under today's lunch
 * and above nothing else. Each vertical maps into this shape and the section
 * does not know the difference.
 */
function dineRow(order) {
  const [time, label] = moment(order);
  return {
    at: new Date(order.ready_at ?? order.fire_at ?? order.slot_starts_at),
    href: `/dine?order=${order.id}`,
    source: 'Хоол',
    photo: LUNCH_PHOTO,
    title: order.restaurant.name,
    state: order.state,
    word: headlineWord(order.state),
    step: LUNCH_STEP[order.state],
    time,
    label,
  };
}

/** An идэш's own states that are past its day: handed over, or given back. */
const IDESH_PAST = ['HANDED', 'CLOSED', 'CANCELLED', 'REFUNDED'];

/**
 * A cancelled order's refund in a word, as the идэш page and the website say
 * it: the guest's step in the tone that asks for one, Basu's transfer in the
 * tone of waiting on the other side; once sent, the state's own word.
 */
const REFUND_WORD = {
  needs_account: ['Данс оруулна уу', ' data-tone="hold" data-strong'],
  due: ['Буцаалт хүлээгдэж байна', ' data-tone="route"'],
  paid: [IDESH_STATE.REFUNDED, ' data-tone="hold"'],
};

/**
 * `seen` is the order itself, for one past its day (loadLive): its card says
 * what became of it — a cancelled one what its money waits for and how much
 * comes back, a handed-over one the day it was received — never the day it
 * was coming.
 */
function ideshRow(order, seen) {
  const delivery = order.receive === 'delivery';
  const row = {
    // Noon on the day, in the restaurant's zone: a day, not an instant.
    at: new Date(`${order.receive_on}T12:00:00+08:00`),
    href: `/idesh?order=${order.id}`,
    source: 'Идэш',
    photo: PHOTO(order),
    title: `${order.title} ×${order.qty}`,
    state: order.state,
    word: IDESH_STATE[order.state] ?? '',
    step: IDESH_STEP[order.state],
    time: dayShort(order.receive_on),
    label: delivery ? 'ирэх' : 'авах',
  };
  if (order.state === 'CANCELLED' || order.state === 'REFUNDED') {
    // Still here for its refund, not for a day: the word says what the money waits for, the corner how much it is.
    const refund = seen?.refund?.state ?? (order.state === 'REFUNDED' ? 'paid' : 'due');
    const amount = seen?.refund?.amount_mnt ?? seen?.refund_mnt ?? null;
    [row.word, row.tone] = REFUND_WORD[refund] ?? REFUND_WORD.due;
    row.step = 0;
    row.corner = `<span class="when" data-money><b>${amount === null ? '—' : money(amount)}</b><small>${refund === 'paid' ? 'буцаасан' : 'буцаалт'}</small></span>`;
  } else if (IDESH_PAST.includes(order.state)) {
    // Received: the day it was, or no day rather than a wrong one.
    const at = seen?.handed_at;
    row.corner = at ? `<span class="when"><b>${dayShort(ubParts(at).day)}</b><small>${delivery ? 'ирсэн' : 'авсан'}</small></span>` : '';
  }
  return row;
}

/**
 * The guest's live orders, if there is a guest.
 *
 * No session is created here: signing in is the dine-in app's business, and a
 * launcher that quietly makes an account for anyone who opens it would be
 * lying about what a visit costs. No token simply means nothing to show.
 *
 * Two calls, one per vertical, merged here: the launcher is the one place
 * that knows there are two, and each app's list stays its own.
 */
/**
 * What an идэш past its day became, as last looked at: `id|state` → { at, order }.
 * A handover's day never changes, so a handed or closed order is looked at
 * once while the launcher is open; a refund still on its way at most every
 * half minute — not on every 4-second tick. A look that fails keeps what was
 * known.
 */
const afterLooks = new Map();
const AFTER_FRESH = 30000;
/** Looks on their way, by `id|state`: two loads at once (the clock's and the first) ask once. */
const afterAsking = new Map();
async function lookAfter(o, token) {
  const key = `${o.id}|${o.state}`;
  const had = afterLooks.get(key);
  if (had && (o.state === 'HANDED' || o.state === 'CLOSED' || Date.now() - had.at < AFTER_FRESH)) return had.order;
  if (!afterAsking.has(key)) {
    afterAsking.set(
      key,
      api(`/v1/idesh/${o.id}`, { token })
        .then((order) => {
          if (order) afterLooks.set(key, { at: Date.now(), order });
          return order;
        })
        .catch(() => null)
        .finally(() => afterAsking.delete(key)),
    );
  }
  const order = await afterAsking.get(key);
  return order ?? had?.order ?? null;
}
// Shown again from the back-forward cache (back from «Идэш», where a refund's account may have just been given): look afresh.
addEventListener('pageshow', (e) => {
  if (!e.persisted) return;
  afterLooks.clear();
  greet();
  void loadLive();
});

async function loadLive() {
  const token = store.guestToken;
  if (!token) return paint([]);
  const ask = (path, key) =>
    api(path, { token }).then(
      (body) => body[key],
      (error) => {
        // A token from a reseeded database is dead, not a reason to shout at
        // somebody who has only just opened the app.
        if (error.status === 401) store.guestToken = null;
        return [];
      },
    );
  const [lunches, provisions] = await Promise.all([
    ask('/v1/orders', 'orders'),
    ask('/v1/idesh', 'orders'),
    loadSupplierTile(),
  ]);
  // An идэш past its day is looked at for what became of it (ideshRow); one that cannot be, keeps a calm corner.
  const past = provisions.filter((o) => IDESH_PAST.includes(o.state));
  const seen = new Map(await Promise.all(past.map(async (o) => [o.id, await lookAfter(o, token)])));
  const rows = [...lunches.map(dineRow), ...provisions.map((o) => ideshRow(o, seen.get(o.id)))];
  rows.sort((a, b) => a.at - b.at);
  paint(rows);
}

/** One card as markup: all it says is in here, so the same markup is the same card. */
function liveRow(row) {
  return `
      <a class="card oc" href="${row.href}" data-source="${row.source}">
        <span class="ph"><img src="${row.photo}" alt="" width="64" height="64" loading="lazy"></span>
        <span class="main">
          <span class="title">${esc(row.title)}</span>
          ${row.word ? `<span class="st"><span class="chip"${row.tone ?? ` data-s="${esc(row.state)}"`}>${esc(row.word)}</span></span>` : ''}
          ${row.step ? meter(row.step) : ''}
        </span>
        <span class="end">${row.corner ?? `<span class="when"><b>${esc(row.time)}</b><small>${row.label}</small></span>`}</span>
      </a>`;
}

/** «Идэвхтэй захиалга» as it stands on the screen: the order's link → { node, html }, the card and the markup it was drawn from. */
const liveDrawn = new Map();

function paint(rows) {
  const list = $('live-list');
  // Each order is its link: one card per order, and a lunch's never an идэш's.
  drawRows(list, liveDrawn, rows.map((row) => [row.href, liveRow(row)]));
  list.removeAttribute('aria-busy');
  delete $('live').dataset.loading;
  if (!rows.length) $('live').removeAttribute('data-any');
  else if ($('live').dataset.any !== String(rows.length)) $('live').dataset.any = String(rows.length);
}

/**
 * Cards drawn over the cards already on the screen, matched by key — the list
 * is asked for every 4 seconds, and the answer is nearly always the one
 * already drawn. A card whose markup is the same is not touched; a card whose
 * words moved on keeps its element and gets new insides; only a card that
 * came or went is added or taken out. Drawn afresh every tick, the focus fell
 * to the page and VoiceOver went back to the top every 4 seconds. Now it
 * stays on its card; and if that card had to move, it is given the focus
 * again, without a scroll — or, with its order gone, the card now in its place.
 * `wire` readies a card that is new to the list; `drawn` is the list's memory;
 * the cards go after `after` when there is one, and anything below them goes.
 */
function drawRows(list, drawn, rows, wire, after = null) {
  const keys = [...drawn.keys()];
  const focused = keys.find((key) => drawn.get(key).node.contains(document.activeElement));
  const next = new Map();
  for (const [key, html] of rows) {
    const was = drawn.get(key);
    if (was?.html === html) {
      next.set(key, was);
      continue;
    }
    const fresh = el(html);
    if (was && was.node.cloneNode(false).outerHTML === fresh.cloneNode(false).outerHTML) {
      was.node.replaceChildren(...fresh.childNodes);
      next.set(key, { node: was.node, html });
    } else {
      wire?.(fresh);
      next.set(key, { node: fresh, html });
    }
  }
  // Cards that went, out first: a card that stays is then never moved past them.
  for (const [key, { node }] of drawn) if (next.get(key)?.node !== node) node.remove();
  // In order; a card already in its place stays where it is.
  let at = after ? after.nextElementSibling : list.firstElementChild;
  for (const { node } of next.values()) {
    if (node === at) at = at.nextElementSibling;
    else list.insertBefore(node, at);
  }
  // Anything else under the cards (the skeleton) has had its turn.
  while (at) {
    const extra = at;
    at = at.nextElementSibling;
    extra.remove();
  }
  drawn.clear();
  for (const [key, value] of next) drawn.set(key, value);
  if (focused === undefined || list.contains(document.activeElement)) return;
  const shown = [...next.values()];
  (next.get(focused) ?? shown[Math.min(keys.indexOf(focused), shown.length - 1)])?.node.focus({ preventScroll: true });
}

/* ── boot ─────────────────────────────────────────────────────────── */

// A guest with a token has cards on the way: show the skeleton, not a jump.
if (store.guestToken) $('live').dataset.loading = '';
mountClock(() => void loadLive());
void loadLive();

/**
 * The kitchen accepts and fires without anybody touching this page, so the
 * list has to keep asking. It stops when the page is hidden and when it goes
 * away — a launcher left open in a background tab should cost nothing.
 */
const poll = setInterval(() => {
  if (!document.hidden) void loadLive();
}, 4000);
addEventListener('pagehide', () => clearInterval(poll));
</script>
</body>
</html>
