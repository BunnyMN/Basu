<!doctype html>
<html lang="mn" data-site>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100D0C">
<title>Миний захиалга — Basu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/site.css">
<style>
/* A person's orders, on the website, «Тансаг хар»: every one they paid for,
   a raised row each — the meat's photo, the title, the code, the money in the
   display and its state in one word with the four bars under it — then one
   of them in full: where it stands, the handover code large, who to ring,
   and, when one was cancelled, where the money goes. The page shows; the one
   thing it asks for (the refund's bank account) is asked in a popup. */

.so-tabs{margin:0 0 24px}
.so-list{display:grid;gap:12px}
.so-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:18px;align-items:center;min-height:100px;padding:14px 20px 14px 14px;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);text-decoration:none;transition:border-color var(--dur)}
@media (hover:hover){.so-row:hover{border-color:var(--line-2)}}
.so-row:active{background:var(--surface-2)}
.so-row img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:var(--surface-2)}
.so-row b{display:block;font-size:1.0625rem;font-weight:700;line-height:1.3}
/* something said about the order that has not been seen yet: there until the order is opened */
.new-dot{display:inline-block;width:9px;height:9px;margin:0 8px 2px 0;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px rgba(210,31,60,.2);vertical-align:middle}
.so-row small{display:block;margin-top:4px;font-size:.875rem;font-weight:500;color:var(--ink-2)}
.so-row small .code{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-3)}
.so-row .end{display:flex;flex-direction:column;align-items:flex-end;gap:10px;text-align:right}
.so-row .end .s-money{font-size:1.75rem;line-height:1}
.so-row .end .stage{align-items:flex-end;width:132px}
.so-row .end .stage > b{text-align:right}
.so-skel{display:grid;grid-template-columns:72px minmax(0,1fr) 120px;gap:18px;align-items:center;min-height:100px;padding:14px 20px 14px 14px;border:1px solid var(--line);border-radius:22px;background:var(--surface)}
.so-skel .s-skel:nth-child(1){height:72px;border-radius:14px}
.so-skel .s-skel:nth-child(2){height:40px}
.so-skel .s-skel:nth-child(3){height:44px}
@media (max-width:620px){
  .so-row{grid-template-columns:56px minmax(0,1fr);align-items:start;gap:14px;padding:14px}
  .so-row img{width:56px;height:56px;border-radius:12px}
  .so-row .end{grid-column:2;flex-direction:row;justify-content:space-between;align-items:center;text-align:left}
  .so-row .end .s-money{font-size:1.5rem}
  .so-skel{grid-template-columns:56px minmax(0,1fr);padding:14px}
  .so-skel .s-skel:nth-child(1){height:56px}
  .so-skel .s-skel:nth-child(3){display:none}
}

/* one order, and its shape while it loads */
.od-wait{padding-top:12px}
.od-wait .t{height:56px;width:min(420px,70%)}
.od-wait .w{height:20px;width:min(300px,55%);margin-top:18px}
.od-wait .g{display:grid;grid-template-columns:minmax(0,7fr) minmax(340px,5fr);gap:32px;margin-top:32px}
.od-wait .a{height:380px;border-radius:22px}
.od-wait .b{height:260px;border-radius:22px}
@media (max-width:960px){.od-wait .g{grid-template-columns:1fr;gap:20px}.od-wait .a{height:300px}}
.od{display:grid;grid-template-columns:minmax(0,7fr) minmax(340px,5fr);gap:20px 32px;align-items:start;margin-top:28px}
/* One column on a phone; once the meat is ready or on its way, the handover code comes first. */
@media (max-width:960px){
  .od{display:flex;flex-direction:column;gap:16px}
  .od-main,.od-side{display:contents}
  .od[data-state="READY"] .od-code,.od[data-state="DISPATCHED"] .od-code{order:-1}
}
.od-top{padding-top:12px;padding-bottom:0}
.od-top + .s-card{margin-top:28px}
.od-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px}
.od-head h1{margin:0;font-family:var(--display);font-size:clamp(2.75rem,5.4vw,4.5rem);font-weight:800;line-height:.9;letter-spacing:-.004em}
.od-head .stage{min-width:180px;max-width:240px;margin-bottom:6px}
.od-head .stage > b{font-size:1rem}
.od-sub{margin:14px 0 0;font-size:1.0625rem;font-weight:500;color:var(--ink-2)}
.od-new{display:flex;gap:14px;align-items:flex-start;margin:24px 0 0;padding:18px 20px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink)}
.od-new svg{flex:none;width:24px;height:24px;color:var(--ink)}
.od-new b{display:block;font-size:1.0625rem;font-weight:700}
.od-new span{display:block;margin-top:2px;color:var(--ink-2)}
.od-main{display:grid;gap:20px}
.od-state{padding:28px}
.od-state .big{font-family:var(--display);font-size:clamp(2rem,3vw,2.5rem);font-weight:800;line-height:.95;letter-spacing:-.004em}
.od-state .cap{margin:10px 0 0;max-width:60ch;font-size:1rem;line-height:1.55;color:var(--ink-2)}
/* back from QPay, not paid yet: the way back to its page, and to look again */
.od-pay-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
/* how it goes: done in the ink with a check, the step it waits on ringed in the crimson, the rest a quiet ring */
.od-steps{list-style:none;margin:28px 0 0;padding:0}
.od-steps li{position:relative;display:grid;grid-template-columns:28px 1fr auto;gap:16px;padding:0 0 24px}
.od-steps li:last-child{padding-bottom:0}
.od-steps li::before{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;border-radius:1px;background:var(--line)}
.od-steps li:last-child::before{display:none}
.od-steps li[data-done]::before{background:var(--ink)}
.od-steps i{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--on-light)}
.od-steps li[data-done] i{border-color:var(--ink);background:var(--ink)}
.od-steps li[data-next] i{border-color:var(--accent)}
.od-steps li[data-next] i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.od-steps i svg{width:14px;height:14px}
.od-steps b{display:block;font-weight:700;line-height:1.3;color:var(--ink-3)}
.od-steps li[data-done] b,.od-steps li[data-next] b{color:var(--ink)}
.od-steps span{display:block;margin-top:2px;font-size:.875rem;color:var(--ink-2)}
.od-steps time{font-size:.8125rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-3);white-space:nowrap}
/* the handover code: what the person says at the door, big and plain */
.od-code{padding:24px;text-align:center}
.od-code > span{display:block;font-size:.75rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.od-code b{display:block;margin:16px 0;padding:18px 0;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);font-family:var(--display);font-size:3.5rem;font-weight:800;letter-spacing:.12em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.od-code small{display:block;font-size:.875rem;line-height:1.5;color:var(--ink-2)}
.od-side{display:grid;gap:16px}
.od-box{padding:24px}
.od-box h2{margin:0 0 14px;font-family:var(--sans);font-size:.75rem;font-weight:700;line-height:1;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.od-box dl{margin:0}
.od-box dl div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:.9375rem}
.od-box dl div:first-child{border-top:0;padding-top:0}
.od-box dt{color:var(--ink-3);font-weight:600}
.od-box dd{margin:0;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.od-box dd .s-money{font-size:1.5rem;line-height:1}
.od-box dd small{display:block;margin-top:3px;font-family:var(--sans);font-weight:500;color:var(--ink-2)}
/* the courier's number is read in one go: never broken over two lines */
.od-box dd small .digits{white-space:nowrap}
.od-box .digits,.od-refund .digits{font-variant-numeric:tabular-nums}
.od-box .s-btn{margin-top:16px}
.od-note{margin:14px 0 0;font-size:.875rem;line-height:1.55;color:var(--ink-2)}
.od-refund{padding:28px}
.od-refund h2{margin:0;font-family:var(--display);font-size:1.8125rem;font-weight:800;line-height:.95}
.od-refund h2:focus{outline:none}
.od-refund > p{margin:10px 0 0;max-width:60ch;color:var(--ink-2);line-height:1.55}
.od-refund > p .s-money{font-size:1.25rem}
.od-refund .s-note{margin-top:18px}
.od-refund .s-btn{margin-top:20px}
.od-refund dl{margin:16px 0 0}
.od-refund dl div{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:.9375rem}
.od-refund dt{color:var(--ink-3);font-weight:600}
.od-refund dd{margin:0;font-weight:600;overflow-wrap:anywhere}
@media (max-width:520px){.od-box dl div,.od-refund dl div{grid-template-columns:1fr;gap:2px}.od-state,.od-refund{padding:22px 20px}}
</style>
</head>
<body>
<header class="s-bar" data-static><div class="s-wrap"><a class="s-word" href="/">Basu</a><nav class="s-nav" aria-label="Цэс"><a href="/home">Нүүр</a><a href="/shop">Идэш</a><a href="/orders" aria-current="page">Миний захиалга</a><a href="/dashboard">Бизнес</a></nav><div class="s-right"></div></div></header>
<main class="s-main">
  <div class="s-wrap" id="page"></div>
</main>

<script type="module">
import { store, mnt, dayLabel, dayShort, ubParts, IDESH_LIVE, BANK_NAMES, popup, passwordPopup, whatWentWrong } from '/api.js';
import { mountFrame, requireSignIn, authed, esc, el, say, me, siteEmpty, howToBuy, statePill, tugrik, phoneShown, meatPhoto, stillGoing, refundPill } from '/site.js';
import { callButton, listenForCalls } from '/call.js';

/**
 * Back from QPay's page (`?paying=1`, the address Wire sends a person to once
 * they have paid). A browser with nobody signed in is one the Basu app sent
 * there — the app's purchase, and the app's session, are not this browser's:
 * it is told to go back to the app rather than asked to sign in.
 */
const payingBack = new URLSearchParams(location.search).has('paying');
const token = payingBack && !store.guestToken ? null : requireSignIn();
void mountFrame('orders');
// While this page is open, the supplier ringing about an order rings here.
if (token) listenForCalls();
const page = document.getElementById('page');

const unitWord = (o) => (o.unit === 'whole' ? 'толгой' : 'кг');
/** Paid for and not yet handed over: an order whose page looks again now and then, and shows its handover code. */
const LIVE = IDESH_LIVE;
/** A state in its one word and the four bars under it, the same on every page: «Бэлтгэж байна», «Цуцлагдсан». */
const pill = (state) => statePill(state);
const MARK = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  done: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 10"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 12l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M16 7l2 2M14 9l2 2"/></svg>',
};

/* ── every order ───────────────────────────────────────────────────── */

async function drawList() {
  page.replaceChildren(
    el('<section class="s-head"><h1>Миний захиалга</h1><p>Төлсөн захиалга бүр энд, явцтайгаа.</p></section>'),
    el('<div class="so-tabs s-chips" id="tabs" role="group" aria-label="Захиалга" hidden></div>'),
    el(`<div id="list" role="status" aria-busy="true"><div class="so-list">${'<div class="so-skel" aria-hidden="true"><span class="s-skel"></span><span class="s-skel"></span><span class="s-skel"></span></div>'.repeat(3)}</div></div>`),
  );
  // Every order, and which of them are still going on — the same «Идэвхтэй» /home keeps (site.js stillGoing):
  // by id, null, or what a cancelled one's money waits for.
  const [{ orders }, live] = await Promise.all([authed('/v1/idesh?scope=all'), stillGoing()]);
  const going = new Map(live.map((o) => [o.id, o.refund]));
  const list = document.getElementById('list');
  list.removeAttribute('aria-busy');
  list.removeAttribute('role');
  // Nobody has ordered yet: no tabs of nothing — what will be here, and the way to the market.
  if (!orders.length) {
    list.replaceChildren(
      siteEmpty({
        icon: 'orders',
        title: 'Та одоохондоо захиалга өгөөгүй байна',
        text: 'Захиалсан идэш тань энд явцтайгаа гарна.',
        actions: [['Зар үзэх', '/shop', 'dark']],
        card: true,
      }),
      howToBuy(),
    );
    return;
  }
  // A cancelled order whose money is still on its way back stays here too, saying what it waits for.
  // Paid and not yet handed over is going on even when the server could not be asked which are.
  const isLive = (o) => going.has(o.id) || LIVE.includes(o.state);
  const groups = { live: orders.filter(isLive), done: orders.filter((o) => !isLive(o)) };
  let tab = groups.live.length || !groups.done.length ? 'live' : 'done';
  const tabs = document.getElementById('tabs');
  tabs.hidden = false;
  const paint = () => {
    tabs.replaceChildren();
    for (const [key, label] of [['live', 'Идэвхтэй'], ['done', 'Дууссан']]) {
      const b = el(`<button type="button" data-tab="${key}" aria-pressed="${tab === key}">${label}<small>${groups[key].length}</small></button>`);
      b.addEventListener('click', () => {
        tab = key;
        paint();
        // The tabs were drawn anew: the focus stays on the one pressed, not lost to the page's top.
        tabs.querySelector(`[data-tab="${key}"]`)?.focus();
      });
      tabs.append(b);
    }
    const rows = groups[tab];
    if (!rows.length) {
      list.replaceChildren(
        tab === 'live'
          ? siteEmpty({ icon: 'orders', title: 'Идэвхтэй захиалга алга', text: 'Дууссан захиалгууд «Дууссан» хэсэгт бий.', actions: [['Зар үзэх', '/shop', 'dark']], card: true })
          : siteEmpty({ icon: 'orders', title: 'Дууссан захиалга алга', text: 'Хүлээж авсан, цуцлагдсан захиалга энд гарна.', card: true }),
      );
      return;
    }
    const box = el('<div class="so-list"></div>');
    for (const o of rows) {
      box.append(
        el(`<a class="so-row" href="/orders/${o.id}" data-order="${o.id}">
              <img src="${meatPhoto(o)}" alt="" loading="lazy" width="72" height="72">
              <span><b>${o.unseen ? '<i class="new-dot" role="img" aria-label="Шинэ мэдээтэй"></i>' : ''}${esc(o.title)} × ${o.qty} ${unitWord(o)}</b><small>${esc(o.supplier.name)} · ${o.receive === 'delivery' ? 'хүргэлт' : 'очиж авна'} ${dayLabel(o.receive_on)}</small><small><span class="code">№${esc(o.code)}</span></small></span>
              <span class="end"><span class="s-money">${tugrik(o.total_mnt)}</span>${going.get(o.id) ? refundPill(going.get(o.id)) : pill(o.state)}</span>
            </a>`),
      );
    }
    list.replaceChildren(box);
  };
  paint();
}

/* ── one order ─────────────────────────────────────────────────────── */

/**
 * How an order goes, step by step: [key, its word, the line once it is done,
 * the line while it is ahead]. A word can depend on where the order stands —
 * the preparing step is «Бэлтгэл» until the supplier starts, «Бэлтгэж байна»
 * while they do and «Бэлтгэсэн» after, as the app says it: right after
 * paying, the ringed step must not say the meat is being prepared before
 * anybody has touched it.
 */
const STEPS = [
  ['paid', 'Төлсөн', () => 'Төлбөр хүлээн авсан', () => 'Төлбөр хүлээгдэж байна'],
  ['preparing', (o, done) => (!done ? 'Бэлтгэл' : o.state === 'PREPARING' ? 'Бэлтгэж байна' : 'Бэлтгэсэн'), () => 'Нийлүүлэгч эхэлсэн', () => 'Нийлүүлэгч бэлтгэхийг хүлээж байна'],
  ['ready', 'Бэлэн', () => 'Мах бэлэн болсон', (o) => `${dayLabel(o.receive_on)}-нд бэлэн болно`],
  ['dispatched', 'Замд', () => 'Хүргэлтэнд гарсан', () => 'Хүргэгч ирэхийн өмнө танд залгана'],
  ['handed', 'Хүлээлгэн өгсөн', () => 'Мах гарт орсон', () => 'Кодоо хэлээд махаа авна'],
];
const FACE = {
  PAID: ['Захиалга баталгаажлаа', (o) => (o.receive === 'delivery' ? `Нийлүүлэгч ${dayLabel(o.receive_on)}-нд хаягаар тань хүргэнэ.` : `Нийлүүлэгч ${dayLabel(o.receive_on)}-нд махыг авах цэг дээр бэлэн байлгана.`)],
  PREPARING: ['Мах бэлтгэгдэж байна', () => 'Нийлүүлэгч малыг нядалж, махыг бэлтгэж байна. Бэлэн болмогц мэдэгдэнэ.'],
  READY: ['Мах бэлэн боллоо', (o) => (o.receive === 'delivery' ? 'Удахгүй замд гарна. Хүргэгч ирэхийн өмнө танд залгана.' : `Авах цэг дээр очоод ${esc(o.code)} кодоо хэлээд авна уу.`)],
  DISPATCHED: ['Мах замд гарлаа', (o) => `Хүргэгч хаягаар тань очиж, ирэхдээ залгана. ${esc(o.code)} кодоо хэлээд хүлээн авна уу.`],
  HANDED: ['Хүлээлгэн өгсөн', () => 'Мах гарт орлоо. Сайхан өвөлжөөрэй.'],
  CLOSED: ['Захиалга дууссан', () => 'Энэ захиалга хаагдсан.'],
  CANCELLED: ['Цуцлагдсан', (o) => (o.refund_mnt ? `Захиалга цуцлагдлаа.${o.forfeit_mnt ? ` Мал нядалсны дараа тул ${mnt(o.forfeit_mnt)} суутгав.` : ''} ${mnt(o.refund_mnt)} таны банкны данс руу буцна.` : 'Захиалга цуцлагдлаа.')],
  REFUNDED: ['Мөнгө буцаасан', (o) => `${mnt(o.refund?.amount_mnt ?? o.refund_mnt ?? 0)} данс руу тань шилжүүлсэн.`],
};
/** «10/2 06:30»: a moment's day and clock as Ulaanbaatar reads them, whatever zone the computer is set to. */
const clockOf = (iso) => {
  const { day, clock } = ubParts(iso);
  return `${dayShort(day)} ${clock}`;
};
/** «Бусад банк»: a bank not on the list, its name typed in the field under it. */
const OTHER_BANK = '__other';

let drawn = null;
async function drawOrder(id, fresh) {
  const o = await authed(`/v1/idesh/${id}`);
  const signature = `${o.state}|${o.refund?.state ?? ''}|${o.receipt ? 1 : 0}`;
  if (drawn === signature) return o;
  drawn = signature;
  // On the screen, so seen: what was said about it no longer counts as news, here or in the app.
  if (document.visibilityState === 'visible') {
    authed('/v1/notifications/read', { method: 'POST', body: { subject: 'idesh', subject_id: o.id } }).catch(() => {});
  }
  document.title = `№${o.code} — Basu`;
  const delivery = o.receive === 'delivery';
  const live = LIVE.includes(o.state);
  const [word, cap] = FACE[o.state] ?? [o.state, () => ''];

  const at = { paid: o.paid_at, preparing: o.preparing_at, ready: o.ready_at, dispatched: o.dispatched_at, handed: o.handed_at };
  let nextFound = false;
  const steps = o.state === 'CANCELLED' || o.state === 'REFUNDED' ? '' : `<ol class="od-steps">${STEPS.filter(([k]) => delivery || k !== 'dispatched')
    .map(([k, label, done, ahead]) => {
      const when = at[k];
      const isNext = !when && !nextFound && o.state !== 'CLOSED';
      if (isNext) nextFound = true;
      const word = typeof label === 'function' ? label(o, Boolean(when)) : label;
      return `<li${when ? ' data-done' : ''}${isNext ? ' data-next aria-current="step"' : ''}><i>${when ? MARK.check : ''}</i><div><b>${word}</b><span>${when ? done(o) : ahead(o)}</span></div>${when ? `<time datetime="${esc(when)}">${clockOf(when)}</time>` : '<span></span>'}</li>`;
    })
    .join('')}</ol>`;

  page.replaceChildren(
    el(`<a class="s-crumb" href="/orders">${MARK.back}Миний захиалга</a>`),
    el(`<div class="s-head od-top">
          <div class="od-head"><h1>Захиалга №${esc(o.code)}</h1>${pill(o.state)}</div>
          <p class="od-sub">${esc(o.title)} × ${o.qty} ${unitWord(o)} · ${esc(o.supplier.name)}</p>
        </div>`),
  );
  if (fresh === 'earlier' && o.state === 'PAID') {
    // The stall bought the order as it was before the person changed it (a
    // press whose answer was slow or lost had paid for it), and they looked
    // over another one a moment ago: this says why it is this one.
    page.append(el(`<div class="od-new" role="status">${MARK.done}<div><b>Өмнөх захиалга тань төлөгдсөн байна</b><span>Өөрчилсөн захиалга үүсээгүй, төлбөр нэг л удаа гарсан.</span></div></div>`));
  } else if (fresh && o.state === 'PAID') {
    page.append(el(`<div class="od-new" role="status">${MARK.done}<div><b>Төлбөр амжилттай</b><span>Захиалга нийлүүлэгчид очлоо. Явцыг эндээс, мэдэгдлээр харна.</span></div></div>`));
  }
  const main = el(`<div class="od" data-state="${esc(o.state)}"><div class="od-main" id="od-main"></div><div class="od-side" id="od-side"></div></div>`);
  page.append(main);
  const left = main.querySelector('#od-main');
  const side = main.querySelector('#od-side');

  left.append(el(`<div class="s-card od-state"><div class="big">${esc(word)}</div><p class="cap">${cap(o)}</p>${steps}</div>`));
  if (o.refund) left.append(await refundBox(o));

  if (live) {
    side.append(
      el(`<div class="s-card od-code"><span>${delivery ? 'Хүргэгчид энэ кодыг хэлнэ' : 'Мах авахдаа энэ кодыг хэлнэ'}</span><b>${esc(o.code)}</b><small>Кодоо сонссон нийлүүлэгч махыг өгнө. Өөр хүн очих бол кодыг хэлээд явуулж болно.</small></div>`),
    );
  }
  side.append(
    el(`<div class="s-card od-box">
          <h2>Захиалга</h2>
          <dl>
            <div><dt>${delivery ? 'Хүргэх өдөр' : 'Очиж авах өдөр'}</dt><dd>${dayLabel(o.receive_on)}</dd></div>
            <div><dt>${delivery ? 'Хүргэх хаяг' : 'Авах цэг'}</dt><dd>${esc(delivery ? o.address : o.pickup_address)}${delivery && o.address_phone ? `<small>Залгах утас: <span class="digits">${esc(phoneShown(o.address_phone))}</span></small>` : ''}</dd></div>
            ${o.breakdown ? `<div id="order-breakdown"><dt>Задаргаа</dt><dd>${esc(o.breakdown.label)}<small>${esc(o.breakdown.detail)}</small>${o.breakdown.note ? `<small>«${esc(o.breakdown.note)}»</small>` : ''}</dd></div>` : ''}
            <div><dt>Төлсөн</dt><dd><span class="s-money">${tugrik(o.total_mnt)}</span>${o.breakdown?.fee_mnt ? `<small>Жижиглэх ${mnt(o.breakdown.fee_mnt)} орсон</small>` : ''}${o.delivery_fee_mnt ? `<small>Хүргэлт ${mnt(o.delivery_fee_mnt)} орсон</small>` : ''}</dd></div>
            ${o.receipt ? `<div><dt>Е-баримт</dt><dd>Сугалаа <span class="digits">${esc(o.receipt.lottery ?? '')}</span></dd></div>` : ''}
          </dl>
        </div>`),
    el(`<div class="s-card od-box" id="od-supplier">
          <h2>Нийлүүлэгч</h2>
          <dl><div><dt>Нэр</dt><dd>${esc(o.supplier.name)}<small>Basu шалгаж, гэрээ байгуулсан</small></dd></div>${
            o.certificate && !o.cancel_reason
              ? `<div><dt>Мал эмнэлгийн гэрчилгээ</dt><dd><span class="digits">№${esc(o.certificate.number)}</span>${o.certificate.origin ? `<small>Гарал үүсэл: ${esc(o.certificate.origin)}</small>` : ''}${
                  o.certificate.tests?.length ? `<small>Шинжилгээ сөрөг: ${esc(o.certificate.tests.join(', '))}</small>` : ''
                }<small>${esc(o.certificate.issuer)} · ${dayLabel(o.certificate.issued_on)} · ${o.certificate.checked ? 'Basu шалгасан' : 'нийлүүлэгчийн оруулсан'}</small></dd></div>`
              : ''
          }</dl>
          ${o.supplier_phone ? `<a class="s-btn s-btn-line s-btn-block" href="tel:${esc(o.supplier_phone)}" aria-label="Нийлүүлэгч рүү залгах: ${esc(phoneShown(o.supplier_phone))}">${MARK.phone}<span class="digits">${esc(phoneShown(o.supplier_phone))}</span></a>` : ''}
          ${live ? '<p class="od-note">Өөрчлөх, цуцлах бол нийлүүлэгчтэй ярина уу — цуцлахыг тэр хийнэ.</p>' : ''}
        </div>`),
  );
  // A call without either number changing hands, while the order is one to ask about.
  void callButton('idesh', o.id).then((button) => {
    const box = document.getElementById('od-supplier');
    if (!button || !box || box.querySelector('[data-call]')) return;
    const tel = box.querySelector('a[href^="tel:"]');
    if (tel) tel.after(button);
    else box.querySelector('dl')?.after(button);
  });
  return o;
}

/**
 * A cancelled order asks one thing of its guest: the bank account the money
 * goes to — in a popup, confirmed with the account's password. An account
 * made by Google or an email code has no password yet: the same button sets
 * one first (a code to the address on the account, then the password), and
 * the account's popup follows at once with the password just chosen in hand
 * — never a trip to another page and back.
 */
async function refundBox(o) {
  const r = o.refund;
  if (r.state !== 'needs_account') {
    return el(`<div class="s-card od-refund"><h2>${r.state === 'paid' ? 'Буцаалт шилжүүлсэн' : 'Буцаалт'}</h2>
      <p>${r.state === 'paid' ? 'Данс руу тань шилжүүлсэн.' : 'Basu ажлын өдөрт шилжүүлээд мэдэгдэл илгээнэ.'}</p>
      <dl>
        <div><dt>Дүн</dt><dd><span class="s-money">${tugrik(r.amount_mnt)}</span></dd></div>
        <div><dt>Данс</dt><dd>${esc(r.bank_name ?? '')} <span class="digits">${esc(r.bank_account ?? '')}</span></dd></div>
        <div><dt>Эзэмшигч</dt><dd>${esc(r.bank_holder ?? '')}</dd></div>
      </dl></div>`);
  }
  const person = await me();
  const needsPassword = Boolean(person && !person.has_password);
  // The way there, said before the press: a password's code comes by email, so an account with no address links one first.
  const way = person?.email
    ? 'Дансаа нууц үгээр баталгаажуулдаг. Таны бүртгэлд нууц үг алга — имэйлээр ирэх кодоор энд тохируулаад дансаа шууд оруулна.'
    : 'Дансаа нууц үгээр баталгаажуулдаг. Таны бүртгэлд нууц үг ч, түүний код очих имэйл ч алга — энд имэйлээ холбож, нууц үгээ тохируулаад дансаа шууд оруулна.';
  const box = el(`<div class="s-card od-refund">
      <h2>Буцаалт авах данс</h2>
      <p><span class="s-money">${tugrik(r.amount_mnt)}</span> аль банкны ямар данс руу шилжүүлэхийг оруулна уу. Basu шилжүүлмэгц мэдэгдэл ирнэ.</p>
      ${needsPassword ? `<div class="s-note">${MARK.key}<span><b>Эхлээд нууц үг тохируулна</b>${way}</span></div>` : ''}
      <button class="s-btn s-btn-dark" type="button" data-account>Данс оруулах</button>
    </div>`);
  const press = box.querySelector('[data-account]');
  press.addEventListener('click', async () => {
    if (press.hasAttribute('aria-busy')) return;
    // The account as it is now, not as the page first found it: a password (or an address) set a moment
    // ago — in this popup, closed before the bank step; in another tab — changes the way. Asked from the
    // page's first look, the next press began again at «Имэйл холбох» and was refused it.
    press.setAttribute('aria-busy', 'true');
    const now = needsPassword ? await authed('/v1/me').catch(() => person) : person;
    press.removeAttribute('aria-busy');
    if (!now || now.has_password) return void askAccount(o);
    void passwordPopup({
      token: store.guestToken,
      email: now.email,
      why: 'Мөнгө тань руу очих дансыг нууц үгээр баталгаажуулдаг. Нууц үгээ тохируулмагц дансаа оруулна.',
      // One word at the end, from the account's popup, for the password and the account both.
      quiet: true,
      // Set just now, or already set in another tab (null): either way the account is next.
      then: ({ password }) => askAccount(o, password),
    });
  });
  return box;
}

/**
 * The refund's bank account, in a popup. `password` is one the person has
 * just chosen (passwordPopup): it confirms the account without being asked
 * for again, and the word at the end says both were kept. Without it, the
 * popup asks, and a wrong one is said under its field. Resolves to true once
 * the account is in, null when the popup was closed.
 */
function askAccount(o, password = null) {
  const r = o.refund;
  return popup({
    title: 'Буцаалт авах данс',
    sub: `<b>${esc(mnt(r.amount_mnt))}</b> энэ данс руу шилжинэ.${password ? '' : ' Мөнгө тань руу очиж байгаа тул нууц үгээрээ баталгаажуулна.'}`,
    width: 520,
    submit: 'Данс илгээх',
    // One column, top to bottom: an IBAN with its spaces is 24 characters, more than half this popup holds.
    fields: [
      // «Бусад банк» opens the field for its name; any bank on the list needs none.
      { name: 'bank', label: 'Банк', type: 'select', options: [['', 'Банкаа сонгоно уу'], ...BANK_NAMES.map((b) => [b, b]), [OTHER_BANK, 'Бусад банк']], required: true, wide: true, onChange: (bank, form) => form.show('other', bank === OTHER_BANK) },
      { name: 'other', label: 'Банкны нэр', placeholder: 'Жагсаалтад байхгүй банк', required: true, wide: true },
      // An IBAN starts with MN, so the keyboard is the one with letters; the spaces a bank prints it with are fine.
      { name: 'account', label: 'Дансны дугаар', inputmode: 'text', autocomplete: 'off', placeholder: 'MN12 0005 0050 1234 5678', hint: 'IBAN (MN + 18 орон) эсвэл дансны дугаар (6–20 орон).', required: true, wide: true, attrs: { autocapitalize: 'characters', spellcheck: 'false' } },
      { name: 'holder', label: 'Данс эзэмшигчийн нэр', autocomplete: 'name', placeholder: 'Банкинд бүртгэлтэй нэр', required: true, wide: true },
      ...(password ? [] : [{ name: 'password', label: 'Нууц үг', type: 'password', autocomplete: 'current-password', required: true, wide: true }]),
    ],
    onSubmit: async (v) => {
      // The rule the server keeps: the spaces out, the letters up, then MN and 18 digits — or 6 to 20 digits.
      const account = v.account.replace(/\s+/g, '').toUpperCase();
      if (!/^(MN\d{18}|\d{6,20})$/.test(account)) throw Object.assign(new Error('IBAN бол MN + 18 орон, дансны дугаар бол 6–20 оронтой тоо байна.'), { field: 'account' });
      if (v.holder.length < 2) throw Object.assign(new Error('Данс эзэмшигчийн нэрээ бичнэ үү.'), { field: 'holder' });
      const bank = v.bank === OTHER_BANK ? v.other : v.bank;
      if (!bank) throw Object.assign(new Error('Банкныхаа нэрийг бичнэ үү.'), { field: v.bank === OTHER_BANK ? 'other' : 'bank' });
      try {
        await authed(`/v1/idesh/${o.id}/refund-account`, {
          method: 'POST',
          body: { bank_name: bank, bank_account: account, bank_holder: v.holder, password: password ?? v.password },
        });
      } catch (e) {
        if (e.code === 'BAD_PASSWORD') throw Object.assign(new Error('Нууц үг буруу байна.'), { field: 'password' });
        throw new Error(whatWentWrong(e));
      }
      say(password ? 'Нууц үг, данс хоёулаа хадгалагдлаа. Шилжүүлмэгц мэдэгдэл ирнэ.' : 'Данс бүртгэгдлээ. Шилжүүлмэгц мэдэгдэл ирнэ.', 'good');
      drawn = null;
      await drawOrder(o.id);
    },
  }).then((given) => {
    // «Данс оруулах» is gone with the account given: once the popup has closed (and the page woken), the
    // focus goes to the refund's heading, not lost to the page's top.
    const head = given && document.querySelector('.od-refund h2');
    if (head) {
      head.tabIndex = -1;
      head.focus();
    }
    return given;
  });
}

/* ── back from QPay ────────────────────────────────────────────────── */

/**
 * The purchase, asked again until it goes through: the money can take a few
 * seconds to be confirmed after QPay's page says it is paid. Then the order
 * as a fresh purchase («Төлбөр амжилттай»). Not paid after a while — QPay
 * closed without paying, or slow — the way back to the same invoice, and to
 * look again; a payment confirmed later buys the order on its own (Basu asks
 * QPay every minute), so nothing is lost by leaving.
 */
async function drawPaying(id) {
  const card = el(`<div class="s-card od-state" role="status" aria-live="polite">
      <div class="big">Төлбөр шалгаж байна…</div>
      <p class="cap">QPay-ээс баталгаа ирмэгц захиалга тань энд гарна.</p>
      <div class="od-pay-acts" hidden></div>
    </div>`);
  page.replaceChildren(el(`<a class="s-crumb" href="/orders">${MARK.back}Миний захиалга</a>`), el('<div class="s-head od-top"><div class="od-head"><h1>Төлбөр</h1></div></div>'), card);
  let invoice = null;
  let lapsed = false;
  for (let round = 0; round < 30; round++) {
    let answer;
    try {
      // Only asks (`check=1`): never a new invoice. 202s are never kept as the answer to a key, so one key
      // serves every ask; the 200 is kept.
      answer = await authed(`/v1/idesh/${id}/pay?check=1`, { method: 'POST', idempotencyKey: `pay-back-${id}` });
    } catch (error) {
      // Not a draft any more: bought by another ask (QPay's callback, Basu's own check) or given back — the order says.
      if (error.code === 'WRONG_STATE') break;
      throw error;
    }
    if (answer?.state === 'PAID') break;
    // Its invoice let go (QPay's page left past its time): nothing to wait for — a fresh one on a press.
    if (answer?.invoice === null) {
      lapsed = true;
      break;
    }
    invoice = answer?.invoice ?? invoice;
    await new Promise((done) => setTimeout(done, 3000));
  }
  const o = await authed(`/v1/idesh/${id}`);
  if (o.state !== 'DRAFT') {
    // Bought: the stall's attempt is over — a next press there is a next animal.
    try {
      sessionStorage.removeItem('basu.shop.attempt');
    } catch {
      // nothing kept
    }
    drawn = null;
    await drawOrder(id, o.paid_at ? 'new' : false);
    // Given back unpaid while QPay was open: a payment made all the same waits in the Basu wallet.
    if (!o.paid_at) {
      const held = await authed('/v1/wallet').then((w) => w.balance_mnt).catch(() => 0);
      if (held > 0) {
        page.append(el(`<div class="od-new" role="status">${MARK.done}<div><b>Таны Basu түрийвчинд ${esc(mnt(held))} байна</b><span>Төлбөр захиалга цуцлагдсаны дараа орж ирсэн бол энд хадгалагдсан — дараагийн захиалгад ашиглана, эсвэл буцаалт хүсвэл basuappmn@gmail.com.</span></div></div>`));
      }
    }
    return o;
  }
  const acts = card.querySelector('.od-pay-acts');
  acts.hidden = false;
  if (lapsed || !invoice?.action_url) {
    card.querySelector('.big').textContent = 'QPay-ийн нэхэмжлэлийн хугацаа дууслаа';
    card.querySelector('.cap').textContent = 'Төлөөгүй бол шинэ нэхэмжлэлээр дахин төлнө үү. Захиалга тань хэвээр хүлээж байна.';
    const again = el('<button class="s-btn s-btn-dark" type="button">Дахин төлөх</button>');
    again.addEventListener('click', async () => {
      if (again.hasAttribute('data-busy')) return;
      again.setAttribute('data-busy', '');
      try {
        const answer = await authed(`/v1/idesh/${id}/pay`, { method: 'POST', idempotencyKey: `pay-again-${id}-${Date.now()}` });
        if (answer?.state === 'PAID') return location.replace(`/orders/${id}?new=1`);
        if (answer?.invoice?.action_url) return location.assign(answer.invoice.action_url);
        throw new Error('QPay-ийн нэхэмжлэл үүсгэж чадсангүй. Дахин оролдоно уу.');
      } catch (error) {
        again.removeAttribute('data-busy');
        say(whatWentWrong(error), 'bad');
      }
    });
    acts.append(again);
    return o;
  }
  card.querySelector('.big').textContent = 'Төлбөр хараахан ороогүй байна';
  card.querySelector('.cap').textContent = 'QPay-ээр төлсөн бол хэдэн минутын дотор өөрөө баталгаажна — энэ хуудсыг хааж болно. Төлөөгүй бол доорх товчоор төлнө үү.';
  acts.append(
    el(`<a class="s-btn s-btn-dark" href="${esc(invoice.action_url)}">QPay-ээр төлөх</a>`),
    el(`<a class="s-btn s-btn-line" href="${esc(`/orders/${id}?paying=1`)}">Дахин шалгах</a>`),
  );
  return o;
}

/* ── which page this is ────────────────────────────────────────────── */

const orderId = location.pathname.match(/^\/orders\/([0-9a-f-]{36})$/)?.[1];
if (!token && payingBack) {
  page.replaceChildren(
    siteEmpty({
      icon: 'orders',
      title: 'Төлбөрөө шалгахын тулд нэвтэрнэ үү',
      text: 'Энэ хөтөч дээр нэвтрээгүй байна. Basu аппаар захиалсан бол аппаа нээнэ үү — төлбөр орж ирмэгц «Миний идэш»-д баталгаажна. Вэбээр захиалсан бол нэвтэрч захиалгаа харна уу.',
      actions: [
        ['Basu апп нээх', orderId ? `basu://order/${orderId}` : 'basu://', 'dark'],
        ['Нэвтрэх', `/login?next=${encodeURIComponent(location.pathname + location.search)}`, 'line'],
      ],
      card: true,
      heading: 1,
    }),
  );
}
if (token) {
  try {
    if (orderId) {
      // Sent here by the stall just now (shop.html): bought, or `earlier`, the
      // order from before a change. Said once; the address forgets it.
      const sent = new URLSearchParams(location.search);
      const fresh = sent.has('new') && (sent.has('earlier') ? 'earlier' : 'new');
      if (fresh || payingBack) history.replaceState(null, '', location.pathname);
      // While it comes: blocks in the shape of the order, so nothing jumps when it lands.
      page.replaceChildren(el(`<a class="s-crumb" href="/orders">${MARK.back}Миний захиалга</a>`), el('<div class="od-wait" role="status" aria-busy="true" aria-label="Захиалга ачаалж байна"><span class="s-skel t"></span><span class="s-skel w"></span><div class="g"><span class="s-skel a"></span><span class="s-skel b"></span></div></div>'));
      const o = payingBack ? await drawPaying(orderId) : await drawOrder(orderId, fresh);
      // Still going: look again now and then, so a supplier starting shows here.
      if (LIVE.includes(o.state)) {
        const poll = setInterval(() => {
          if (document.hidden) return;
          drawOrder(orderId).catch(() => clearInterval(poll));
        }, 20000);
        addEventListener('pagehide', () => clearInterval(poll));
      }
    } else {
      await drawList();
    }
  } catch (error) {
    if (error.status === 404) {
      page.replaceChildren(
        el(`<a class="s-crumb" href="/orders">${MARK.back}Миний захиалга</a>`),
        siteEmpty({ icon: 'orders', title: 'Захиалга олдсонгүй', text: 'Энэ захиалга таны бүртгэлд алга. Өөр бүртгэлээр нэвтэрсэн байж магадгүй.', actions: [['Миний захиалга', '/orders', 'dark']], card: true, heading: 1 }),
      );
    } else if (error.status !== 401) {
      page.replaceChildren(
        siteEmpty({ icon: 'alert', title: 'Ачаалж чадсангүй', text: whatWentWrong(error), actions: [['Дахин ачаалах', location.pathname, 'dark']], card: true, heading: 1 }),
      );
    }
  }
}
</script>
</body>
</html>
