<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<script>
/* Ordering ahead at a restaurant is the phone app's for now; a browser
   gets the front page's word on it. */
if (!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.basu)) {
  location.replace('/#dine');
}
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100D0C">
<title>Basu — үдийн хоол</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.css" integrity="sha512-KIMsMWIdnoG9OwZa+oaIafmbDonqck1UCmq+/zcUi2aaZ97N9QE6TqpTM+n36EO40HGh64hU/375zxtjx7WTyQ==" crossorigin="anonymous">
<link rel="stylesheet" href="/app.css">
<style>
/* Layout only. Colour, type, radius, buttons, chips, rows, the sheet and the
   stepper come from /app.css; what is left here is where things sit.

   «Тансаг хар»: the city at night under a glass bar, the restaurants as
   crimson pins; a restaurant's sheet on the raised charcoal — its name in
   the display face, today's times as pills, every dish with its picture in a
   porcelain square and its price in the display face — and what is in the
   basket as one floating bar with the crimson «Захиалах». */
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column}

/* The map is the page: the product is "which lunch is five minutes away",
   and that is a question about a place before it is one about a menu.
   MapLibre sets its own 12px Helvetica on the container; the chrome inside
   it takes the page's face back. */
#map{flex:1;min-height:0;position:relative;background:var(--bg);font:inherit}

/* The bar floats over the map. Absolute in the map's box rather than fixed
   in the viewport, so the demo clock strip above the map keeps its own row;
   the map fills the rest of the screen, so the two read the same. It owns
   the top inset: the bar reaches under the status bar and the map runs
   beneath both. */
#map > .topbar[data-fixed]{position:absolute;top:0;left:0;right:0}
#badge span:empty{display:none}

/* Nobody is cooking: said under the bar, over the map. The page's notes are
   a bold line over a sentence with no icon, so they stack. */
#map > .note{position:absolute;top:calc(var(--bar-h) + var(--safe-t) + 12px);left:12px;right:12px;z-index:5;box-shadow:var(--shadow-2)}
.note[data-k]{flex-direction:column;gap:2px}

/* The server could not be reached on a later look: one line under the bar,
   while the map and the order stay as they were. */
#map > .stale-strip{position:absolute;top:calc(var(--bar-h) + var(--safe-t));left:0;right:0;z-index:6}

/* MapLibre's controls in the charcoal, clear of the home indicator and of
   the order's floating bar. */
#map .maplibregl-ctrl-bottom-right,#map .maplibregl-ctrl-bottom-left{bottom:var(--safe-b)}
body:has(#orderbar[data-open]) #map .maplibregl-ctrl-bottom-right,
body:has(#orderbar[data-open]) #map .maplibregl-ctrl-bottom-left{bottom:calc(88px + var(--safe-b))}
#map .maplibregl-ctrl-group{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill);overflow:hidden}
#map .maplibregl-ctrl-group:not(:empty){box-shadow:var(--shadow-2)}
/* every control the thumb's 44 (4.5) */
#map .maplibregl-ctrl-group button{width:44px;height:44px}
/* the attribution's «i» keeps its 24px look; the box around it is the 44 a thumb needs */
#map .maplibregl-ctrl-attrib-button{width:44px;height:44px;top:-10px;right:-10px;background-color:transparent;background-position:center;background-repeat:no-repeat}
#map .maplibregl-ctrl-group button+button{border-top:1px solid var(--line-2)}
#map .maplibregl-ctrl-group button:focus{border-radius:var(--r-pill)}
#map .maplibregl-ctrl button:not(:disabled):hover,#map .maplibregl-ctrl button:not(:disabled):active{background-color:var(--surface-3)}
#map .maplibregl-ctrl-attrib{background:var(--glass);color:var(--ink-2);font-size:var(--t-eyebrow);border-radius:var(--r-sm)}
#map .maplibregl-ctrl-attrib.maplibregl-compact{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-pill)}
#map .maplibregl-ctrl-attrib.maplibregl-compact-show{border-radius:var(--r-sm)}
#map .maplibregl-ctrl-attrib a{color:var(--ink-2)}
/* MapLibre draws its control glyphs dark; on the charcoal they are lifted to the ink. */
#map :is(.maplibregl-ctrl-icon,.maplibregl-ctrl-attrib-button){filter:invert(.9)}
/* On a desk the sheet docks on the right; the controls step out from under
   it, and the dock starts below the demo clock strip when there is one. */
@media (min-width:900px){
  body:has(.sheet[data-dock][data-open]) #map .maplibregl-ctrl-bottom-right{right:440px}
  body:has(> .clockbar) .sheet[data-dock]{top:32px}
}

/* ── nothing to show, or no way to ask ───────────────────────────── */
/* No restaurant, or the server out of reach: one calm block in place of
   the map — what happened in a few words, the way on. With no restaurant
   yet, a steamer of buuz over it, fading into the charcoal. Never a map
   with nothing of ours on it, and never a dead end. */
.blank{
  position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
  padding:calc(var(--bar-h) + var(--safe-t) + 24px) 24px calc(40px + var(--safe-b));
  text-align:center;background:var(--bg);
}
.blank > *{position:relative;z-index:1}
.blank[data-kind="none"]{justify-content:flex-end}
.blank[data-kind="none"]::before{
  content:"";position:absolute;z-index:0;top:0;left:0;right:0;height:62%;
  background:url("/brand/meat/buuz-828.webp") 50% 40% / cover no-repeat;filter:saturate(1.05) contrast(1.05) brightness(.92);
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.55) 0%,#000 24%,#000 52%,transparent 100%);mask-image:linear-gradient(180deg,rgba(0,0,0,.55) 0%,#000 24%,#000 52%,transparent 100%);
}
.blank .plate{width:72px;height:72px;margin:0 0 22px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);color:var(--ink-2);box-shadow:var(--shadow-1)}
.blank[data-kind="none"] .plate{display:none}
.blank .plate svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.blank h2{font-size:var(--t-title);line-height:.92;max-width:14ch}
.blank[data-kind="none"] h2{font-size:3rem;line-height:.88}
.blank p{margin:12px 0 0;font-size:var(--t-body-lg);line-height:var(--lh-body);color:var(--ink-2);max-width:32ch}
.blank .acts{display:flex;flex-direction:column;gap:8px;width:100%;max-width:340px;margin-top:28px}
.blank .acts .btn{width:100%}

/* The walk, when a venue is open and we know where the guest is. */
.walk{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:var(--t-cap);font-weight:600;line-height:1.4;color:var(--ink-2)}
.walk:empty{display:none}
.walk svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-3)}
.walk b{font-family:var(--sans);font-weight:700;color:var(--ink)}
.walk .guess{color:var(--ink-3)}

/* ── inside the sheet ─────────────────────────────────────────────── */
/* The sheet's name takes the focus as the sheet opens, so a screen reader starts there; it is not a control, and draws no ring. */
#sheet-name:focus{outline:none}
#sheet > header h2{font-size:var(--t-title);line-height:.92}
#sheet > header .sub{margin-top:10px;font-size:var(--t-cap);font-weight:600;color:var(--ink-2)}
/* Never over the bar: with the status bar's inset the bar is 111pt tall,
   and 88% of the screen reached into it. */
@media (max-width:899px){#sheet{max-height:min(88dvh,calc(100dvh - var(--bar-h) - var(--safe-t) - 12px))}}
/* Closed, the sheet waits below the screen — and its upward shadow did not:
   it lay along the bottom edge of every page as a dark band. */
#sheet:not([data-open]){box-shadow:none}
.sheet > .body > .empty{border-top:0;padding:20px 24px}
.sheet > .body > .empty .btn{margin-top:12px}
.sheet .note{margin:16px 20px}
/* the menu on its way: rows in the shape of a dish */
.menu-skel .skel-row{min-height:100px;padding:14px 20px}
.menu-skel .skel-row > .skel:first-child{width:72px;height:72px;border-radius:16px}
.menu-skel .skel-row > .skel:last-child{width:44px;height:44px;border-radius:50%}

/* When, first and always in view: the strip sticks under the header while
   the menu scrolls beneath it. One row of pills, scrolling sideways. Opaque,
   not glass: a backdrop filter nested inside the sheet's own is not painted
   everywhere, and rows showing through the strip read as a mistake. */
.when-strip{position:sticky;top:0;z-index:2;padding:6px 20px 14px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.when-strip .section-title{margin:10px 0 12px;font-size:var(--t-body);font-weight:600;color:var(--ink-2)}
.when-strip .none-left{margin:0;font-size:var(--t-body);line-height:1.45;color:var(--ink-2)}
.slots{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:1px 20px 3px}
.slots::-webkit-scrollbar{display:none}
.slot{
  flex:none;min-height:44px;padding:0 18px;border-radius:var(--r-pill);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-family:var(--display);font-size:1.25rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums lining-nums;letter-spacing:.01em;
  transition:background var(--dur),border-color var(--dur),color var(--dur),transform 120ms var(--ease);
}
.slot[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-light)}
.slot[disabled]{background:transparent;border-color:var(--line);color:var(--ink-3);text-decoration:line-through;cursor:not-allowed}
.slot:not([disabled]):active{transform:scale(.985)}
@media (hover:hover){.slot:not([disabled]):not([aria-pressed="true"]):hover{border-color:var(--ink-3)}}

/* The menu: full-bleed rows in the sheet, so the sheet is the card. Each
   dish's picture sits in a porcelain square; its price is the display face. */
.sheet .menu{border-left:0;border-right:0;border-radius:0;box-shadow:none;background:none;border-color:var(--line)}
.sheet .menu > .item.row{align-items:center;gap:16px;min-height:100px;padding:14px 20px}
.item .lead img{width:72px;height:72px;border-radius:16px;background:var(--surface);box-shadow:0 12px 24px -12px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06)}
.item .name{font-size:var(--t-row);font-weight:700;line-height:var(--lh-snug);color:var(--ink)}
.item .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink-3)}
.item .line{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px;margin-top:8px}
.item .price .money{font-family:var(--display);font-size:1.375rem;font-weight:800;line-height:1;letter-spacing:-.004em}
.item .meta{margin:0;font-variant-numeric:tabular-nums}
.item .meta svg{width:12px;height:12px;vertical-align:-1px;fill:var(--gold);stroke:none}
.item > .end{gap:8px;align-self:center}
.item[data-off] .money{color:var(--ink-3)}
.item[data-off] .lead img{opacity:.55;filter:grayscale(1)}
.item .chip{color:var(--ink-3)}
/* The stepper: a pill of the surface with two round buttons, the count in
   the display between them. 44 × 44 per press, the target the thumb needs. */
.qty{display:inline-flex;align-items:center;gap:2px;height:48px;padding:1px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line)}
.qty button{width:44px;height:44px;padding:0;border:0;border-radius:50%;background:var(--surface-3);color:var(--ink);display:grid;place-items:center}
.qty button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.qty button:active{background:var(--line-2)}
@media (hover:hover){.qty button:hover{background:var(--line-2)}}
.qty span{min-width:30px;display:grid;place-items:center;font-family:var(--display);font-size:1.375rem;font-weight:800;line-height:1;color:var(--ink)}
/* Nothing of this dish in the basket yet: one «+», not «− 0 +» on every row. */
.qty[data-zero]{background:none;border-color:transparent;padding:0;height:44px}
.qty[data-zero] [data-d="-1"],.qty[data-zero] span{display:none}

/* The foot of the sheet. A basket floats there as one bar: how many dishes
   and at what time over the total in the display, and the one crimson
   «Захиалах». The cancellation terms sit over it, the reason a press did not
   go through over that. */
#sheet > footer{padding:10px 12px calc(12px + var(--safe-b));background:var(--surface-2);border-top:0}
#sheet > footer:has(.basket){background:linear-gradient(180deg,rgba(37,31,29,0) 0%,var(--surface-2) 32%)}
.sheet > footer .terms{margin:0 8px 2px;text-align:center;font-size:var(--t-cap);line-height:1.45;color:var(--ink-3)}
.sheet > footer .terms b{color:var(--ink-2);font-weight:700}
.basket{
  display:flex;align-items:center;gap:12px;min-height:72px;padding:8px 8px 8px 22px;
  border-radius:var(--r-pill);background:var(--surface-3);border:1px solid rgba(255,244,236,.08);box-shadow:var(--shadow-2);
}
.basket .sum{flex:1;min-width:0}
.basket .sum > span{display:block;font-size:var(--t-cap);font-weight:600;line-height:1.2;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.basket .sum b{display:block;margin-top:6px;font-family:var(--display);font-size:1.625rem;font-weight:800;line-height:1;letter-spacing:-.004em;white-space:nowrap}
.basket .sum .money{font-weight:800}
.basket .btn{flex:none;width:auto;min-height:56px;padding:0 26px;font-size:1.0625rem}
/* why the last press did not go through, next to the button it is about */
.sheet > footer .trouble{display:flex;align-items:flex-start;gap:6px;margin:0 8px 4px;font-size:var(--t-cap);font-weight:600;line-height:1.4;color:var(--stop)}
.sheet > footer .trouble svg{width:16px;height:16px;flex:none;margin-top:1px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ── status, once an order exists ────────────────────────────────── */
/* A guest walking to the restaurant wants the progress and the route at the
   same time, so this is a sheet over the map rather than a page instead of
   it. The state is one word (or the time it fires) in the display face with
   the four-bar meter under it; the steps follow. Dismissing it leaves a
   floating bar at the bottom to bring it back. */
.status{padding:22px 24px 8px;text-align:left}
.status .big{font-family:var(--display);font-size:var(--t-display);font-weight:800;line-height:.9;letter-spacing:-.004em;color:var(--ink);text-wrap:balance}
.status .big.mono{font-variant-numeric:tabular-nums lining-nums}
.status:is([data-s="CANCELLED"],[data-s="REJECTED"]) .big{color:var(--accent-ink)}
.status[data-s="REFUNDED"] .big{color:var(--gold)}
.status > .meter{margin-top:16px}
.status > .meter > i{height:5px;border-radius:3px}
.status .cap{margin-top:12px;font-size:var(--t-body);line-height:1.45;color:var(--ink-2)}
.status .cap:empty{display:none}
.status .timeline{margin-top:18px;padding-top:8px;border-top:1px solid var(--line)}

.orderbar{
  position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:var(--z-bar);
  display:none;align-items:center;gap:14px;min-height:64px;padding:10px 20px 10px 22px;
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-line);border-radius:var(--r-pill);box-shadow:var(--shadow-2);
  color:inherit;text-align:left;
}
.orderbar[data-open]{display:flex}
.orderbar > span{display:flex;flex-direction:column;flex:1;min-width:0}
.orderbar .code{font-family:var(--display);font-size:1.375rem;font-weight:800;line-height:1;color:var(--ink)}
.orderbar .what{margin-top:4px;font-size:var(--t-cap);font-weight:600;line-height:1.3;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orderbar .what:empty{display:none}
.orderbar .when{margin-left:auto;flex:none;font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1;color:var(--ink)}
.orderbar .when:not(.mono){font-family:var(--sans);font-size:var(--t-body);font-weight:700}
.orderbar::after{content:"";flex:none;width:16px;height:16px;background:var(--ink-3);-webkit-mask:var(--mask-chev) center/contain no-repeat;mask:var(--mask-chev) center/contain no-repeat;transform:rotate(-90deg)}
@media (min-width:640px){
  .orderbar{left:50%;right:auto;width:520px;max-width:calc(100% - 40px);transform:translateX(-50%)}
}

/* ── the review ───────────────────────────────────────────────────── */
/* A row of five buttons rather than a slider or a select: the whole gesture
   is one tap, and the answer is visible without opening anything. */
.stars{display:flex}
.stars button{width:44px;height:44px;padding:0;border:0;background:none;color:var(--ink-3);display:grid;place-items:center}
.stars button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.stars button[data-on]{color:var(--gold)}
.stars button[data-on] svg{fill:currentColor}
/* the small stars are small to look at, not to hit: each is the thumb's 44 (4.5), as the big ones are */
.stars[data-size="sm"] button{width:44px;height:44px}
.stars[data-size="sm"] button svg{width:18px;height:18px}
.rating{display:inline-flex;align-items:center;gap:3px;color:var(--ink-2)}
.rating i{display:inline-flex;color:var(--gold)}
.rating i svg{width:13px;height:13px;fill:currentColor;stroke:none}
.rating em{font-style:normal;color:var(--ink-3)}

.review{padding:20px 24px 24px;border-top:1px solid var(--line)}
.review h3{font-family:var(--display);font-size:var(--t-title-2);font-weight:800;line-height:.95;letter-spacing:-.004em}
.review p.lead{margin:8px 0 12px;font-size:var(--t-cap);line-height:1.4;color:var(--ink-2)}
.review > .stars{margin:0 -10px}
/* A dish keeps room to say its name (7em) beside its picture; where the line has no room for its five
   stars as well (a phone), they go under the name, to the right — still a thumb's 44 each, never over the
   words — and every row of the review the same way. */
.review .row{display:flex;align-items:center;flex-wrap:wrap;gap:0 12px;min-height:56px;padding:6px 0;border-top:1px solid var(--line)}
.review > .stars + .row{margin-top:10px}
.review .row img{width:40px;height:40px;border-radius:var(--r-sm);background:var(--surface);object-fit:cover;flex:none}
.review .row .n{flex:1 1 7em;min-width:0;font-size:var(--t-body-lg);font-weight:600;color:var(--ink)}
.review .row .stars{margin-left:auto;margin-right:-13px}
.review textarea{margin-top:14px}
/* The timing question is the product's own metric and is asked separately:
   a four-star lunch that came late is a success by one measure and a failure
   by the other, and one score would hide exactly that. */
.ontime{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:44px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.ontime > span{flex:1;min-width:140px;font-size:var(--t-body-lg);font-weight:600;color:var(--ink)}

.said{padding:8px 24px 24px;border-top:1px solid var(--line)}
.said .section-title{margin:18px 0 12px}
/* The average and the timing share sit together, because they answer
   different questions and a guest weighs both. */
.said .summary{
  display:flex;align-items:baseline;justify-content:flex-start;gap:12px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1px solid var(--line);font-size:var(--t-cap);font-weight:600;color:var(--ink-2);
}
.said .summary .big{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:var(--t-title);font-weight:800;line-height:1;color:var(--ink)}
.said .summary .big .mono{font-weight:800}
.said .summary .big i{display:inline-flex;color:var(--gold)}
.said .summary .big i svg{width:22px;height:22px;fill:currentColor;stroke:none}
.said .summary .pct{color:var(--gold)}
.said .summary .pct[data-good="true"]{color:var(--ink)}
.said .none{padding:12px 0 0;font-size:var(--t-body);color:var(--ink-2)}
.said .one{padding:14px 0;border-top:1px solid var(--line)}
.said .summary + .one{border-top:0}
.said .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;font-size:var(--t-cap);color:var(--ink-2)}
.said .who b{font-weight:700;color:var(--ink)}
.said .txt{font-size:var(--t-body-lg);line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
</style>
</head>
<body>
<main id="map">
  <header class="topbar" data-fixed>
    <a class="home" href="/app" id="home" aria-label="Basu нүүр"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Basu</a>
    <div class="title" id="badge"><h1>Үдийн хоол</h1><span>Ирэхээс тань өмнө гал тавина</span></div>
    <span class="act"></span>
  </header>
  <section class="blank" id="blank" aria-live="polite" hidden></section>
</main>

<div class="scrim" id="scrim" data-dock></div>

<section class="sheet" id="sheet" aria-label="Ресторан" data-dock>
  <header>
    <div>
      <h2 id="sheet-name" tabindex="-1">—</h2>
      <div class="sub" id="sheet-sub"></div>
      <div class="walk" id="sheet-walk"></div>
    </div>
    <button class="x" type="button" id="sheet-close" aria-label="Хаах"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="body" id="sheet-body"></div>
  <footer id="sheet-foot"></footer>
  <!-- A lunch that moves on while its sheet is open is said aloud: accepted, on the fire, ready. -->
  <p class="sr-only" id="sheet-said" role="status"></p>
</section>

<!-- Named by what it shows — the order's number, what is happening, when — as a screen reader should say it. -->
<button class="orderbar" id="orderbar" type="button">
  <span>
    <span class="code mono" id="ob-code">—</span>
    <span class="what" id="ob-what"></span>
  </span>
  <span class="when mono" id="ob-when"></span>
</button>

<!-- MapLibre from cdnjs, held to cdnjs's own hash of the file: bytes that ever differ do not run. A new version takes its new hash, here and on the stylesheet. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.js" integrity="sha512-hoXlvOdSmh58mppUyZHZsscHkR/yXl6zLpTMTNwA6IZ61DpeaCNjosRu1WJ2DeIpkfW5MsJJ9H89zjV4IBGqRw==" crossorigin="anonymous"></script>
<script type="module">
import { api, store, shell, toast, mountClock, mnt, money, meter, hhmm, HEADLINE, signInSheet, confirmPopup, whatWentWrong } from '/api.js';
import { mapStyle, pinImage, ULAANBAATAR, isCovered, metresBetween, walkMinutes, MAP_LOCALE } from '/mapStyle.js';

const $ = (id) => document.getElementById(id);
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};

const SOURCE = 'venues';
const LAYER = 'venue-pin';
const ROUTE = 'walk';

const emptyLine = () => ({ type: 'FeatureCollection', features: [] });

/* The page's own glyphs: 24-unit strokes in currentColor, so they take the
   colour of whatever they sit in and never a glyph from the text font. */
const ICON = {
  star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg>',
  minus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>',
  plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>',
  walk: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="4.2" r="1.7"/><path d="M13 7.6l-2.4 4.6 2.6 2.4-2 6.4M13 7.6l3.2 1.9 1.8 3.3M10.6 12.2l-2.6 3.2M13.2 14.6l3.2 2.6 1.4 3.8"/></svg>',
  bowl: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5h17c-.4 4.4-3.9 7.5-8.5 7.5s-8.1-3.1-8.5-7.5z"/><path d="M9 21h6M12 8.5c-1.2-.9 1.2-2.1 0-3.5"/></svg>',
  offline: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 8.8a14 14 0 0 1 5-2.9M21.5 8.8A14 14 0 0 0 12 5c-.7 0-1.4 0-2 .1M5.5 12.4a9 9 0 0 1 3.4-2M18.5 12.4a9 9 0 0 0-3.2-1.9M9 15.9a4.5 4.5 0 0 1 6 0M12 19.5h.01M3 3l18 18"/></svg>',
  alert: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5h.01"/></svg>',
};

/**
 * Five tappable stars that keep their own state.
 *
 * They redraw themselves rather than asking the form to rebuild: rebuilding
 * the block would take the caret out of the comment box somebody was typing in.
 * To a screen reader they are one choice of five (`label` names what is
 * rated), the chosen one said as chosen; the star just pressed keeps the focus.
 */
function starPicker(value, onPick, size, label = 'Үнэлгээ') {
  const box = el(`<div class="stars" role="radiogroup" aria-label="${escapeHtml(label)}"${size ? ` data-size="${size}"` : ''}></div>`);
  let picked = value;

  const paint = (focus = 0) => {
    box.replaceChildren();
    for (let n = 1; n <= 5; n++) {
      const star = el(
        `<button type="button" role="radio" aria-checked="${n === picked}" aria-label="${n} од"${n <= picked ? ' data-on' : ''}>${ICON.star}</button>`,
      );
      star.addEventListener('click', () => {
        picked = n;
        paint(n);
        onPick(n);
      });
      box.append(star);
    }
    if (focus) box.children[focus - 1]?.focus();
  };

  paint();
  return box;
}

/** A rating as one line: [star] 4.6 (12). Null reads as "nobody has said yet". */
function ratingLine(rating) {
  if (!rating?.count) return el('<span class="rating"><em>үнэлгээ алга</em></span>');
  return el(
    `<span class="rating"><i>${ICON.star}</i>${rating.stars.toFixed(1)}<em>(${rating.count})</em></span>`,
  );
}

const state = {
  venues: [],
  venue: null,
  menu: [],
  slots: [],
  cart: new Map(),
  slot: null,
  orderId: null,
  here: null,
  route: null,
  /** Geofence bands already reported for the current order. */
  sent: new Set(),
  /** Why the last Pay did not go through, said above the button until the next try. */
  trouble: null,
  /** The server's clock as last read, and the phone's at that moment. */
  clock: { server: Date.now(), local: Date.now() },
  /** Minutes on foot to the open restaurant, for the line under its name. */
  walk: null,
};

/**
 * The page is on its way out. A request already in flight still lands after
 * `pagehide`, and drawing its answer into a document that is being torn down
 * is an error in a test and wasted work in a browser — so every path that
 * awaits the server and then touches the page checks this first.
 */
let gone = false;

/** Back to the shell's launcher — or, in a browser, the web one. */
function goHome() {
  if (shell.present) shell.post({ type: 'home' });
  else location.href = '/app';
}

/**
 * The time on the server's clock, now: what it said with the slots, moved on
 * by what has passed on the phone since. The server's, not the phone's: the
 * demo keeps a lunch hour whatever the hour is, and a phone's clock can be
 * wrong. A server that does not say keeps the phone's.
 */
const clockNow = () => state.clock.server + (Date.now() - state.clock.local);

/** Today's times a guest can still come at: one that has begun is gone. */
const openSlots = () => state.slots.filter((s) => Date.parse(s.starts_at) > clockNow());

/* ── signing in ──────────────────────────────────────────────────── */

async function signIn() {
  // Inside the phone app the sheet is the shell's, and so is the token.
  if (shell.present) return shell.signIn();
  // A developer's machine answers this; the real server does not have it.
  try {
    const { token } = await api('/dev/login', { method: 'POST', body: {} });
    store.guestToken = token;
    return token;
  } catch (error) {
    if (error.status !== 404) throw error;
  }
  return signInSheet();
}

/**
 * Every call that needs a guest goes through here.
 *
 * A stored token outlives the thing it points at: sessions expire, get
 * revoked, or vanish when the demo database is reseeded. So a 401 means sign
 * in again and retry — once — rather than a dead end.
 */
async function guestApi(path, options = {}) {
  const token = store.guestToken ?? (await signIn());
  try {
    return await api(path, { ...options, token });
  } catch (error) {
    if (error.status !== 401) throw error;
    store.guestToken = null;
    return api(path, { ...options, token: await signIn() });
  }
}

/* ── the map ─────────────────────────────────────────────────────── */

/**
 * The camera the map is meant to look like.
 *
 * Kept as values rather than left implicit because several things move the
 * camera and one of them flattens it: MapLibre's GeolocateControl frames the
 * accuracy circle with a fitBounds, and fitBounds resets pitch to zero unless
 * told otherwise. The tilt is not decoration — the buildings are how somebody
 * recognises where they are — so it is restored after anything that drops it.
 */
const CAMERA = { zoom: 15.4, pitch: 55, bearing: -17 };

// Named for the same reason as __map below: the tile URLs are a thing worth
// asserting about from outside, and a relative one silently blanks the map.
window.__style = mapStyle();

/**
 * The map, once there is something of ours to put on it. It is not drawn
 * before: with no restaurant there is no reason to download a city, and a
 * map of other people's cafés with none of ours on it is what this page
 * used to show the first person to open it.
 */
let map = null;
let geolocate = null;
let ready = false;

function mountMap() {
  if (map) return map;
  // The night palette, whatever the phone's own appearance: every Basu page is dark.
  const style = mapStyle();
  window.__style = style;
  map = new maplibregl.Map({
    container: 'map',
    style,
    center: [ULAANBAATAR.lon, ULAANBAATAR.lat],
    // Tilted, because the buildings are the landmark. A guest deciding between
    // two lunches five minutes apart recognises the tower they work in long
    // before they recognise a street name, and the tiles carry building heights.
    zoom: CAMERA.zoom,
    pitch: CAMERA.pitch,
    bearing: CAMERA.bearing,
    attributionControl: { compact: true, customAttribution: '© OpenStreetMap' },
    // What a screen reader says for the map and its buttons, in Mongolian.
    locale: MAP_LOCALE,
  });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

  // Named so scripts/inspect.mjs can ask the map what it thinks happened. A
  // tile can be byte-perfect at the proxy and still never be requested, and
  // nothing outside the browser can see that.
  window.__map = map;

  map.on('error', (event) => {
    // MapLibre reports a missing tile, a bad style and a dead source the same
    // way — quietly, on this channel. Left unhandled it is a blank map with no
    // explanation anywhere.
    console.error('[map]', event?.error?.message ?? event?.error ?? event);
  });

  /**
   * Where the guest is, and what that means for the order.
   *
   * The ETA model already reasons about 800m and 300m bands, but nothing could
   * ever emit them because nothing knew where anybody was. This closes that
   * loop: crossing a band reports it once and the planner moves the fire time.
   */
  geolocate = new maplibregl.GeolocateControl({
    positionOptions: { enableHighAccuracy: true },
    trackUserLocation: true,
    showUserLocation: true,
    // Without this it fits the accuracy circle, which on a good fix means
    // street level and on a poor one means the whole district.
    fitBoundsOptions: { maxZoom: 16.4, pitch: CAMERA.pitch, bearing: CAMERA.bearing },
  });
  map.addControl(geolocate, 'bottom-right');

  geolocate.on('geolocate', (position) => {
    const { latitude: lat, longitude: lon } = position.coords;
    if (!isCovered(lat, lon)) return; // outside the tiles, and outside the pilot
    state.here = { lat, lon };
    void reportProximity();
    // A venue may already be open; the walk to it is now answerable.
    if (state.venue) void drawWalk(state.venue);
    // The control has just moved the camera; make sure it left the tilt alone.
    setTimeout(keepTilt, 600);
  });

  map.on('load', () => {
    // The map draws in the page's own tokens, read when it is ready: an open
    // pin is the crimson, a shut one the third ink, both ringed with the
    // surface; the walk is the second ink cased in the surface.
    const palette = tokens();
    map.addImage('pin-open', pinImage(palette.accent, false, palette.surface, palette.onAccent), { pixelRatio: 2 });
    map.addImage('pin-shut', pinImage(palette.ink3, true, palette.surface, palette.onAccent), { pixelRatio: 2 });

    // The walk, under the pins so a pin is never hidden by its own route.
    map.addSource(ROUTE, { type: 'geojson', data: emptyLine() });
    map.addLayer({
      id: 'route-casing',
      type: 'line',
      source: ROUTE,
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': palette.surface, 'line-width': 9, 'line-opacity': 0.9 },
    });
    // Two layers, not one with a data-driven dash.
    //
    // `line-dasharray` accepts zoom expressions and nothing else: a `case` on a
    // feature property is invalid, and MapLibre answers by not drawing the layer
    // at all — no thrown error, no console message, just an empty map with the
    // distance label sitting there saying the route had been found. A filter is
    // the supported way to say the same thing.
    map.addLayer({
      id: 'route-line',
      type: 'line',
      source: ROUTE,
      filter: ['!', ['get', 'direct']],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': palette.route, 'line-width': 5 },
    });
    map.addLayer({
      id: 'route-guess',
      type: 'line',
      source: ROUTE,
      // A straight line drawn dashed, so a guess never looks surveyed.
      filter: ['get', 'direct'],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': palette.route, 'line-width': 5, 'line-dasharray': [1.4, 1.2] },
    });

    map.addSource(SOURCE, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: LAYER,
      type: 'symbol',
      source: SOURCE,
      layout: {
        'icon-image': ['case', ['get', 'open'], 'pin-open', 'pin-shut'],
        // A little larger than the drawing's half: a pin is a thing to tap.
        'icon-size': 0.6,
        'icon-anchor': 'bottom',
        'icon-allow-overlap': true,
        'text-field': ['get', 'label'],
        'text-font': ['Noto Sans Regular'],
        'text-size': 12,
        'text-offset': [0, 0.6],
        'text-anchor': 'top',
        'text-allow-overlap': true,
      },
      paint: {
        'text-color': ['case', ['get', 'open'], palette.ink, palette.ink3],
        'text-halo-color': palette.surface,
        'text-halo-width': 1.6,
      },
    });

    map.on('mouseenter', LAYER, () => (map.getCanvas().style.cursor = 'pointer'));
    map.on('mouseleave', LAYER, () => (map.getCanvas().style.cursor = ''));
    map.on('click', LAYER, (event) => {
      const id = event.features?.[0]?.properties?.id;
      const venue = state.venues.find((v) => v.id === id);
      if (venue) void openVenue(venue);
    });

    ready = true;
    paintVenues();
  });
  return map;
}

/** The page's tokens, as the map needs them: the one thing CSS cannot paint. */
function tokens() {
  const token = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return {
    accent: token('--accent'),
    ink: token('--ink'),
    ink3: token('--ink-3'),
    surface: token('--surface'),
    onAccent: token('--on-accent'),
    route: token('--route'),
  };
}

/** Put the tilt back if something flattened it. */
function keepTilt() {
  if (!map || Math.abs(map.getPitch() - CAMERA.pitch) < 2) return;
  map.easeTo({ pitch: CAMERA.pitch, bearing: CAMERA.bearing, duration: 500 });
}

/**
 * Ask for the guest's position, once.
 *
 * Deliberately not on page load: a permission prompt before anybody has
 * chosen anything is a prompt most people refuse. Asked here it has an
 * obvious answer to give — the way to the food they just bought.
 */
let asked = false;
function askWhereYouAre() {
  if (asked || state.here || !geolocate) return;
  asked = true;
  try {
    geolocate.trigger();
  } catch {
    // Denied, unavailable, or not yet ready. The order works without it;
    // only the route is missing, and the walk estimate falls back to the
    // restaurant's own on-foot minutes.
  }
}

/**
 * The walk from here to a restaurant: the road somebody would take, how far it
 * is, and how long it takes on foot.
 *
 * The straight line between two points in a city is short by about a third —
 * buildings are in the way — so this asks the server, which has the road
 * geometry. When the router cannot be reached it answers with a straight line
 * marked `direct`, and the layer above draws that dashed.
 */
async function drawWalk(venue) {
  const walk = document.getElementById('sheet-walk');
  if (!state.here || !venue?.lat) {
    map?.getSource(ROUTE)?.setData(emptyLine());
    if (walk) walk.textContent = '';
    return;
  }

  // Six places is about eleven centimetres, which is finer than any phone
  // knows and keeps the URL — and the cache key — from churning on noise.
  const at = (lon, lat) => `${lon.toFixed(6)},${lat.toFixed(6)}`;
  const from = at(state.here.lon, state.here.lat);
  const to = at(venue.lon, venue.lat);

  let route;
  try {
    route = await api(`/v1/route?from=${from}&to=${to}`);
  } catch (error) {
    // Silence here hid a real failure for a whole round of debugging: the
    // endpoint was refusing genuine GPS precision and the map simply drew
    // nothing, with no way to tell that from "no position yet".
    console.warn('[route]', error.message);
    if (walk) walk.textContent = '';
    return;
  }
  // The guest may have closed the sheet or opened another one meanwhile.
  if (state.venue?.id !== venue.id || !map) return;
  state.route = route;

  map.getSource(ROUTE)?.setData({
    type: 'FeatureCollection',
    features: [
      {
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: route.line },
        properties: { direct: route.kind === 'direct' },
      },
    ],
  });

  const km = route.metres >= 1000 ? `${(route.metres / 1000).toFixed(1)} км` : `${route.metres} м`;
  const sub = document.getElementById('sheet-walk');
  if (sub) {
    sub.innerHTML =
      `<span>${ICON.walk}</span><b class="mono">${km}</b><span>·</span><b class="mono">${route.minutes} мин</b>` +
      (route.kind === 'direct' ? '<span class="guess">ойролцоогоор</span>' : '');
  }

  // Pan, do not reframe.
  //
  // Fitting both ends of a 1.2 km walk means zooming out until the tilt
  // flattens and the buildings — the thing that makes this map legible — turn
  // back into a plan. The distance and the time are already written above; the
  // camera's job is to keep the guest and the road in front of them in view.
  const middle = route.line[Math.floor(route.line.length / 2)] ?? route.line[0];
  map.easeTo({
    center: middle,
    zoom: Math.max(map.getZoom(), CAMERA.zoom),
    pitch: CAMERA.pitch,
    bearing: CAMERA.bearing,
    duration: 700,
  });
}

async function reportProximity() {
  if (!state.orderId || !state.here || !state.venue?.lat) return;

  const metres = metresBetween(state.here, { lat: state.venue.lat, lon: state.venue.lon });
  const band = metres <= 300 ? 'geofence_300' : metres <= 800 ? 'geofence_800' : null;
  if (!band || state.sent.has(band)) return;

  state.sent.add(band);
  try {
    await guestApi(`/v1/orders/${state.orderId}/signal`, { method: 'POST', body: { type: band } });
    toast(`${Math.round(metres)}м зайд ирлээ — гал тавих цаг шинэчлэгдэнэ.`);
    await api('/dev/tick', { method: 'POST' }).catch(() => {});
    void showStatus(true).catch(() => {});
  } catch {
    state.sent.delete(band); // let the next fix try again
  }
}

function paintVenues() {
  if (!ready || !map) return;
  const features = state.venues
    .filter((v) => Number.isFinite(v.lat) && Number.isFinite(v.lon))
    .map((v) => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [v.lon, v.lat] },
      properties: { id: v.id, open: v.accepting_orders, label: v.name },
    }));
  map.getSource(SOURCE)?.setData({ type: 'FeatureCollection', features });
}

/* ── nothing to show, or no way to ask ──────────────────────────── */

/**
 * The block that stands where the map would be. `none`: Basu has no
 * restaurant taking orders yet — said plainly, with what this place is for
 * and the one thing worth doing instead. `offline`: the server could not be
 * reached — said in words, with a retry and the way home. Never the kitchen's
 * sign-in: that is a member of staff's door, not a guest's.
 */
const BLANK = {
  none: {
    plate: ICON.bowl,
    title: 'Одоогоор ресторан алга',
    text: 'Ресторан нэгдмэгц газрын зураг дээр гарна.',
    act: '<a class="btn" data-v="primary" data-size="lg" href="/idesh">Өвлийн идэш үзэх</a>',
  },
  offline: {
    plate: ICON.offline,
    title: 'Холболт тасарлаа',
    text: 'Интернэтээ шалгаад дахин оролдоно уу.',
    act: '<button class="btn" data-v="primary" data-size="lg" type="button" data-retry>Дахин оролдох</button>',
  },
};

function showBlank(kind) {
  const what = BLANK[kind];
  const box = $('blank');
  if (box.dataset.kind === kind && !box.hidden) return;
  box.dataset.kind = kind;
  box.innerHTML = `
    <div class="plate" aria-hidden="true">${what.plate}</div>
    <h2>${what.title}</h2>
    <p>${what.text}</p>
    <div class="acts">${what.act}<button class="btn" data-v="quiet" data-size="lg" type="button" data-home>Нүүр рүү буцах</button></div>`;
  box.querySelector('[data-home]').addEventListener('click', goHome);
  box.querySelector('[data-retry]')?.addEventListener('click', (event) => {
    event.currentTarget.dataset.busy = '1';
    void loadVenues().then(() => {
      if (state.orderId) void showStatus(true).catch(() => {});
    });
  });
  box.hidden = false;
  $('map').querySelector(':scope > .note')?.remove();
}

function hideBlank() {
  $('blank').hidden = true;
  delete $('blank').dataset.kind;
}

/** The server stopped answering a page that is already drawn: one line under the bar until it does again. */
function showStale(on) {
  const strip = $('map').querySelector(':scope > .stale-strip');
  if (!on) {
    strip?.remove();
    return;
  }
  if (!strip) {
    $('map').append(el('<div class="stale-strip" role="status">Холболт тасарлаа — дахин холбогдож байна…</div>'));
  }
}

/* ── loading venues ─────────────────────────────────────────────── */

async function loadVenues() {
  let restaurants;
  try {
    ({ restaurants } = await api('/v1/restaurants'));
  } catch {
    if (gone) return;
    // Nothing drawn yet: the page says so in its middle. A map already
    // drawn keeps its pins, with the strip saying they may be out of date.
    if (!map) {
      $('badge').querySelector('span').textContent = '';
      showBlank('offline');
    } else {
      showStale(true);
    }
    return;
  }
  if (gone) return;
  showStale(false);
  state.venues = restaurants;

  // No restaurant at all — what production had for its first weeks. No map
  // for nobody: an honest page, and the way on.
  if (!restaurants.length && !state.orderId) {
    $('badge').querySelector('span').textContent = '';
    showBlank('none');
    return;
  }
  hideBlank();
  mountMap();
  paintVenues();
  if (state.venue) {
    // Keep the open sheet's copy fresh; a kitchen can go dark while it is open.
    const fresh = restaurants.find((r) => r.id === state.venue.id);
    if (fresh) state.venue = { ...state.venue, ...fresh };
  }

  const open = restaurants.filter((r) => r.accepting_orders).length;
  $('badge').querySelector('span').textContent =
    open > 0
      ? `${open}/${restaurants.length} ресторан захиалга авч байна`
      : 'Нэг ч гал тогоо нээлттэй биш';

  // A map of grey pins with no explanation is a dead end. A kitchen goes dark
  // ninety seconds after its tablet stops checking in — the guard working, but
  // the guest still deserves to be told what that means: in a guest's words,
  // and with no door to the kitchen's own screen, which is staff's.
  const existing = $('map').querySelector(':scope > .note');
  if (open === 0 && !existing) {
    $('map').append(
      el(`<div class="note" data-k="warn" role="status">
            <b>Одоогоор нэг ч гал тогоо нээлттэй биш</b>
            <span>Саарал тэмдэгтэй ресторанууд одоо захиалга авахгүй байна.</span>
          </div>`),
    );
  } else if (open > 0 && existing) {
    existing.remove();
  }
}

/* ── the sheet ──────────────────────────────────────────────────── */

/**
 * The sheet's name is where reading starts as the sheet comes up — a screen
 * reader is not left on the map behind it — unless the focus is in the sheet
 * already (a poll redrawing it). Closing gives the focus back: to the bar
 * that brings the order back, or to what opened the sheet.
 */
let sheetOpener = null;
function sheetOpened() {
  const now = document.activeElement;
  if (now && $('sheet').contains(now)) return;
  sheetOpener = now instanceof HTMLElement && now !== document.body ? now : null;
  $('sheet-name').focus({ preventScroll: true });
}
function sheetClosed() {
  const inside = $('sheet').contains(document.activeElement);
  const back = $('orderbar').dataset.open ? $('orderbar') : sheetOpener;
  sheetOpener = null;
  if (inside && back?.isConnected) back.focus({ preventScroll: true });
}

function closeSheet() {
  $('sheet').removeAttribute('data-open');
  $('scrim').removeAttribute('data-open');

  if (state.orderId) {
    // The order is still live: keep its route on the map and leave a bar to
    // bring the detail back. Someone walking there wants to see both.
    $('orderbar').dataset.open = '1';
    sheetClosed();
    return;
  }
  sheetClosed();
  // No order — the route belonged to a venue nobody chose.
  map?.getSource(ROUTE)?.setData(emptyLine());
  state.venue = null;
  state.route = null;
}
$('sheet-close').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);
// Esc closes the sheet, as it closes every popup — unless a popup over it took the key first.
addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && !event.defaultPrevented && $('sheet').dataset.open) closeSheet();
});
$('orderbar').addEventListener('click', () => {
  $('orderbar').removeAttribute('data-open');
  void showStatus(true).catch((error) => toast(whatWentWrong(error), 'bad'));
});

/**
 * The line under a restaurant's name: the walk, whether it is taking orders
 * — and, once today's last time has begun, that today's are over rather
 * than «захиалга авч байна» over a menu nobody can order from.
 */
function venueSub(venue, { over = false } = {}) {
  const said = !venue.accepting_orders ? 'хаалттай' : over ? 'өнөөдрийн захиалга дууссан' : 'захиалга авч байна';
  $('sheet-sub').replaceChildren(
    document.createTextNode(`${state.walk} мин алхаад · ${said} · `),
    ratingLine(venue.rating),
  );
}

/** Three rows in the shape of a dish, while the menu is on its way. */
const MENU_LOADING = `
  <div class="menu-skel" role="status" aria-busy="true"><span class="sr-only">Цэс ачаалж байна…</span>${
    '<div class="skel-row" aria-hidden="true"><span class="skel"></span><span class="skel-lines"><span class="skel"></span><span class="skel"></span></span><span class="skel"></span></div>'.repeat(4)
  }</div>`;

async function openVenue(venue) {
  $('orderbar').removeAttribute('data-open');
  state.venue = venue;
  state.cart = new Map();
  state.slot = null;
  state.trouble = null;

  const walk = state.here
    ? walkMinutes(metresBetween(state.here, { lat: venue.lat, lon: venue.lon }))
    : venue.walk_minutes;

  $('sheet-name').textContent = venue.name;
  $('sheet-name').classList.remove('mono'); // a name, not a code
  $('sheet-said').textContent = '';
  delete $('sheet').dataset.busy;
  state.walk = walk;
  venueSub(venue);
  $('sheet-body').replaceChildren(el(MENU_LOADING));
  $('sheet-foot').replaceChildren();
  $('sheet').dataset.open = '1';
  $('scrim').dataset.open = '1';
  sheetOpened();

  document.getElementById('sheet-walk').textContent = '';
  if (state.here) {
    // The walk answers "is this worth it" before the menu does.
    void drawWalk(venue);
  } else {
    // Lift the pin above the sheet rather than leaving it hidden behind it.
    map?.easeTo({ center: [venue.lon, venue.lat], zoom: 16.6, offset: [0, -120], duration: 500 });
  }

  if (!venue.accepting_orders) {
    $('sheet-body').replaceChildren(
      el(`<div class="note" data-k="warn"><b>Одоогоор захиалга авахгүй байна</b>
            <span>Гал тогоо нь нээгдмэгц захиалга авна.</span></div>`),
    );
    return;
  }

  let items;
  let slots;
  let now;
  try {
    [{ items }, { slots, now }] = await Promise.all([
      api(`/v1/restaurants/${venue.id}/menu`),
      api(`/v1/restaurants/${venue.id}/slots`),
    ]);
  } catch (error) {
    if (gone || state.venue?.id !== venue.id) return;
    // Said where the menu would be, with the way to ask again.
    const trouble = el(`<div class="empty" role="alert"><b>Цэс ачаалагдсангүй</b><span></span><br><button class="btn" type="button">Дахин оролдох</button></div>`);
    trouble.querySelector('span').textContent = whatWentWrong(error);
    trouble.querySelector('button').addEventListener('click', () => void openVenue(venue));
    $('sheet-body').replaceChildren(trouble);
    return;
  }
  // Somebody tapped another pin while this menu was on its way. (A guest
  // with a lunch already running may still open a menu and order another.)
  if (gone || state.venue?.id !== venue.id) return;
  state.menu = items;
  state.slots = slots;
  state.clock = { server: Date.parse(now) || Date.now(), local: Date.now() };
  renderSheet();
}

function renderSheet() {
  const body = $('sheet-body');
  // A redraw keeps the reader where they were: one tap on a dish redraws
  // the whole menu, and a jump back to the top for each is a menu nobody
  // can order from.
  const scrolled = body.scrollTop;
  body.replaceChildren();

  // When, first and always in view: the strip sticks under the header while
  // the menu scrolls beneath it, so the time is never a scroll away.
  const strip = el(
    '<div class="when-strip"><h3 class="slothead section-title">Хэдэн цагт ирэх вэ?</h3></div>',
  );
  // Only the times still ahead: 11:30 offered at a quarter to twelve is a
  // lunch nobody can arrive for. A time chosen a while ago that has since
  // begun is let go, and the button asks for another.
  const ahead = openSlots();
  if (state.slot && !ahead.some((s) => s.starts_at === state.slot)) state.slot = null;
  // No time left today: the menu is still worth reading, but it is not a
  // basket — no steppers, nothing to pay for, and the line under the name
  // says the day is over.
  const readOnly = !ahead.length;
  if (readOnly) {
    state.cart.clear();
    venueSub(state.venue, { over: true });
  }
  const grid = el('<div class="slots" role="group" aria-label="Ирэх цаг"></div>');
  if (readOnly) {
    strip.append(el('<p class="none-left">Өнөөдрийн захиалах цаг дууссан. Маргааш дахин ирээрэй.</p>'));
  }
  for (const slot of ahead) {
    const button = el(
      `<button class="slot mono" type="button" aria-pressed="${state.slot === slot.starts_at}"${
        slot.available ? '' : ' disabled'
      }>${escapeHtml(slot.label)}</button>`,
    );
    button.addEventListener('click', () => {
      state.slot = slot.starts_at;
      state.trouble = null;
      renderSheet();
    });
    grid.append(button);
  }
  if (ahead.length) strip.append(grid);
  body.append(strip);

  const menu = el('<div class="menu" data-rows></div>');
  for (const item of state.menu) {
    const qty = state.cart.get(item.id) ?? 0;
    // The dish's picture in a porcelain square; its name, a line of what is in
    // it, and its price in the display face beside how long it takes.
    const row = el(`
      <div class="item row"${item.sold_out ? ' data-sold data-off' : ''}>
        <span class="lead"><img class="thumb" src="${escapeHtml(dishPicture(item.image_url))}" alt="" loading="lazy" width="72" height="72"></span>
        <span class="main">
          <span class="name title">${escapeHtml(item.name)}</span>
          ${item.description ? `<span class="sub desc">${escapeHtml(item.description)}</span>` : ''}
          <span class="line"><span class="price">${money(item.price_mnt)}</span><span class="meta" data-sans>${item.prep_minutes} мин${
            item.rating?.count ? ` · ${ICON.star} ${item.rating.stars.toFixed(1)}` : ''
          }</span></span>
        </span>
        <span class="end"></span>
      </div>`);
    const end = row.querySelector('.end');

    if (item.sold_out) {
      end.append(el('<span class="chip">Дууссан</span>'));
    } else if (!readOnly) {
      const stepper = el(`
        <div class="qty"${qty ? '' : ' data-zero'}>
          <button type="button" data-d="-1" aria-label="Хасах">${ICON.minus}</button>
          <span class="mono">${qty}</span>
          <button type="button" data-d="1" aria-label="${qty ? 'Нэмэх' : `${escapeHtml(item.name)} нэмэх`}">${ICON.plus}</button>
        </div>`);
      stepper.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        const next = Math.max(0, (state.cart.get(item.id) ?? 0) + Number(button.dataset.d));
        if (next === 0) state.cart.delete(item.id);
        else state.cart.set(item.id, next);
        state.trouble = null;
        renderSheet();
      });
      end.append(stepper);
    }
    menu.append(row);
  }
  body.append(menu);
  body.scrollTop = scrolled;
  renderFoot();
  void appendComments(state.venue.id);
}

/**
 * What people who ate here said.
 *
 * Loaded after the menu rather than with it: the menu is what somebody came
 * for, and it should not wait on a second query to appear.
 */
async function appendComments(venueId) {
  let data;
  try {
    data = await api(`/v1/restaurants/${venueId}/reviews`);
  } catch {
    return;
  }
  if (state.venue?.id !== venueId || !data.rating?.count) return;
  // A redraw of the menu asked again; one block of reviews is enough.
  $('sheet-body').querySelector(':scope > .said')?.remove();

  const rating = data.rating;
  const said = el(`
    <div class="said">
      <h3 class="section-title">Хоолтой хүмүүс юу гэсэн бэ</h3>
      <div class="summary">
        <span class="big"><i>${ICON.star}</i><span class="mono">${rating.stars.toFixed(1)}</span></span>
        <span>${rating.count} үнэлгээ</span>
        ${
          rating.onTimeShare === null
            ? ''
            : `<span class="pct" data-good="${rating.onTimeShare >= 0.8}">${Math.round(
                rating.onTimeShare * 100,
              )}% цагтаа ирсэн</span>`
        }
      </div>
    </div>`);
  if (!data.comments.length) {
    said.append(el('<div class="none">Одоогоор бичсэн сэтгэгдэл алга.</div>'));
  }
  for (const c of data.comments) {
    said.append(
      el(`<div class="one">
            <div class="who">
              <b>${escapeHtml(c.by)}</b>
              <span class="rating" role="img" aria-label="${c.stars} од"><i>${ICON.star.repeat(c.stars)}</i></span>
              ${c.onTime === false ? '<span class="late chip" data-tone="hold" data-inline>цагтаа ирээгүй</span>' : ''}
            </div>
            <div class="txt">${escapeHtml(c.comment)}</div>
          </div>`),
    );
  }
  $('sheet-body').append(said);
}

/**
 * Guest text goes into the DOM as text, never as markup — a comment, a name,
 * a dish. Quotes too, for whatever sits inside an attribute.
 */
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}

/**
 * A dish's picture: a file of ours or an https address, else the drawing that
 * stands in for a missing one. Whatever writes `image_url` one day — a
 * restaurant's own menu page — writes into every guest's page.
 */
function dishPicture(url) {
  return typeof url === 'string' && /^(\/(?![/\\])|https:\/\/)[^\s"'<>\\`]*$/.test(url) ? url : '/dishes/unknown.svg';
}

function renderFoot() {
  // A POST is in flight: the footer it came from stays put until the server
  // answers, and the sheet is not taking taps meanwhile.
  if ($('sheet').hasAttribute('data-busy')) return;

  const lines = [...state.cart]
    .map(([id, qty]) => ({ item: state.menu.find((m) => m.id === id), qty }))
    .filter((line) => line.item);
  const total = lines.reduce((sum, { item, qty }) => sum + item.price_mnt * qty, 0);
  const foot = $('sheet-foot');
  foot.replaceChildren();
  if (total === 0) return;

  const chosen = Boolean(state.slot);
  const slot = state.slots.find((s) => s.starts_at === state.slot);
  const noneLeft = !chosen && !openSlots().length;
  // The basket floats at the foot as one bar: how many dishes and at what
  // time over the total, and the one crimson «Захиалах» — which pays from
  // the wallet as it orders. The terms sit over it; why the last press did
  // not go through, over that.
  const count = lines.reduce((sum, { qty }) => sum + qty, 0);
  foot.append(el('<p class="terms">Хоол <b>гал дээр гарахаас өмнө</b> үнэгүй цуцална.</p>'));
  if (state.trouble) {
    const trouble = el(`<p class="trouble" role="alert">${ICON.alert}<span></span></p>`);
    trouble.querySelector('span').textContent = state.trouble;
    foot.append(trouble);
  }
  const basket = el(`
    <div class="basket">
      <div class="sum"><span>${count} хоол${slot ? ` · ${escapeHtml(slot.label)}-д ирнэ` : ''}</span><b>${money(total)}</b></div>
      <button class="btn" data-v="primary" type="button"${chosen ? '' : ' disabled'}>${chosen ? 'Захиалах' : noneLeft ? 'Өнөөдөр цаг алга' : 'Цагаа сонгоно уу'}</button>
    </div>`);
  basket.querySelector('button').addEventListener('click', placeOrder);
  foot.append(basket);
}

/**
 * One attempt at a lunch: this venue, slot and cart, and a random nonce its
 * two calls go under — placing the order, then paying for it. Tapping again
 * after the network lost an answer is the same attempt, sends the same keys,
 * and gets the same order and the same payment back — never a second lunch.
 * The nonce is made for the attempt, not the venue, slot and dishes spelled
 * out, which anybody could guess. Another cart or slot is another attempt.
 *
 * An attempt is over when its lunch is on the screen (showStatus ends it),
 * not when the payment goes through: the look at the lunch can fail after
 * the money has gone, and until the guest has seen it, a tap is a retry of
 * it. After that, the same cart and slot again is a second lunch somebody
 * meant.
 */
let attempt = null;

function currentAttempt() {
  const what = `${state.venue.id}|${state.slot}|${[...state.cart].join(',')}`;
  if (attempt?.what !== what) {
    const nonce = [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, '0')).join('');
    attempt = { what, nonce, order: null };
  }
  return attempt;
}

async function placeOrder() {
  const sheet = $('sheet');
  const button = $('sheet-foot').querySelector('button');
  // Busy, not disabled: the sheet stops taking taps and the button shows a
  // spinner over its text, so nothing reads as switched off.
  sheet.dataset.busy = '1';
  button.dataset.busy = '1';
  button.textContent = 'Түр хүлээнэ үү…';
  $('sheet-foot').querySelector('.trouble')?.remove();
  state.trouble = null;
  let paid = false;
  try {
    const current = currentAttempt();
    const order = await guestApi('/v1/orders', {
      method: 'POST',
      // A phone on a patchy connection retries; the same key must not buy lunch twice.
      idempotencyKey: `order-${current.nonce}`,
      body: {
        restaurant_id: state.venue.id,
        slot_starts_at: state.slot,
        party_size: 2,
        items: [...state.cart].map(([menu_item_id, qty]) => ({ menu_item_id, qty })),
      },
    });
    current.order = order.id;
    // Paying can lose its answer too. Under the attempt's own key the retry
    // is handed the payment already made, rather than told the lunch is paid
    // for and left in front of a Pay button for it.
    await guestApi(`/v1/orders/${order.id}/pay`, { method: 'POST', idempotencyKey: `pay-${current.nonce}` });
    paid = true;
    state.orderId = order.id;
    state.sent = new Set();
    rendered = null;
    shell.ordersChanged();
    await showStatus(true);
  } catch (error) {
    // In words the guest reads: the server's own, or plain ones when the
    // network never let it answer — never the browser's «Failed to fetch».
    const said = whatWentWrong(error);
    // Paid for, and only the look at it failed: a bought lunch never offers
    // its Pay button again. The sheet stays busy, and the next poll draws
    // the lunch as soon as the network lets it; the toast is the only place
    // to say so.
    if (paid) {
      toast(said, 'bad');
      return;
    }
    // Not paid: said above the button, until the next press — not in a
    // toast, which lay over the button and swallowed the tap to try again.
    state.trouble = said;
    delete sheet.dataset.busy;
    renderFoot();
  }
}

/* ── status ─────────────────────────────────────────────────────── */

const STEPS = [
  ['placed', 'Захиалга баталгаажлаа'],
  ['accepted', 'Ресторан хүлээн авлаа'],
  ['fired', 'Гал дээр гарлаа'],
  ['ready', 'Хоол бэлэн'],
  ['served', 'Ширээн дээр'],
];

/**
 * The states with a walk in front of them.
 *
 * From the moment the kitchen accepts until the food is on the table, the
 * guest's job is to get there — so that is when the map carries a route.
 */
const WALKING = ['ACCEPTED', 'SCHEDULED', 'ARMED', 'HELD', 'FIRED', 'COOKING', 'READY'];

/**
 * What the last render was of, so a poll that found no news changes nothing.
 *
 * The status sheet refreshes every few seconds to catch the kitchen accepting
 * or firing. Rebuilding it unconditionally destroyed whatever the guest was
 * doing inside it — a comment being typed vanished a word or two in, which is
 * the sort of thing that makes an app feel broken rather than busy.
 */
let rendered = null;

/**
 * How far a lunch has come, on the four bars every order has (api.js
 * meter): paid, taken by the kitchen, on the fire, ready — the launcher's
 * card says the same. A lunch that ended badly has no meter: its word says it.
 */
const LUNCH_STEP = { PLACED: 1, ACCEPTED: 2, SCHEDULED: 2, ARMED: 2, RESLOTTED: 2, HELD: 2, FIRED: 3, COOKING: 3, READY: 4, SERVED: 4, CLOSED: 4 };
const NEGATIVE = ['CANCELLED', 'REFUNDED', 'NO_SHOW', 'REJECTED'];
const OVER = ['SERVED', 'CLOSED', ...NEGATIVE];

async function showStatus(force) {
  if (!state.orderId) return;
  const order = await guestApi(`/v1/orders/${state.orderId}`);
  if (gone) return;
  showStale(false);
  // The attempt that made this lunch is over: the lunch is on the screen.
  if (attempt?.order === order.id) attempt = null;

  // Everything the sheet draws. Same signature, same picture — so leave it.
  const signature = [
    order.state,
    order.fire_at,
    order.ready_at,
    order.table,
    order.review ? 'reviewed' : '',
  ].join('|');
  // A poll that found no news changes nothing — including a sheet the guest
  // has just closed, which used to come back four seconds later. News
  // reopens it: the kitchen accepting or firing is worth interrupting for.
  if (!force && signature === rendered) return;
  const moved = rendered !== null && signature !== rendered;
  if (moved) shell.ordersChanged();
  rendered = signature;

  // The order's place on the map, even when the list of venues has not come
  // (or no longer lists it): the route and the walk need somewhere to stand.
  hideBlank();
  mountMap();

  // The states that carry a time say it; the rest carry a word.
  const [word, cap] = HEADLINE[order.state] ?? [null, ''];
  const big = word ?? hhmm(order.fire_at);
  const sub =
    cap ||
    (order.state === 'SCHEDULED'
      ? 'Энэ цагт гал дээр гарна'
      : order.state === 'ARMED'
        ? 'Та замд гарсан уу?'
        : order.state === 'COOKING'
          ? `${hhmm(order.ready_at)}-д бэлэн болно`
          : '');

  // The collapsed bar carries the same answer in one line.
  $('ob-code').textContent = `№${order.code}`;
  $('ob-what').textContent = sub; // the word is already the bar's right-hand answer
  $('ob-when').textContent = HEADLINE[order.state]?.[0] ?? hhmm(order.fire_at);
  $('ob-when').classList.toggle('mono', !word); // a time is a number; a word is not

  $('orderbar').removeAttribute('data-open');
  const sheet = $('sheet');
  delete sheet.dataset.busy;
  sheet.dataset.open = '1';
  $('scrim').dataset.open = '1';
  $('sheet-name').textContent = `№${order.code}`;
  sheetOpened();
  $('sheet-name').classList.add('mono'); // a code, not a name
  // Where, when to be there, and which table: the arrival time is the
  // guest's half of the plan, so it is said here as what it is — while the
  // lunch is still ahead, and not on one served, closed or cancelled.
  $('sheet-sub').textContent = [
    order.restaurant?.name ?? state.venue?.name,
    order.slot_starts_at && !OVER.includes(order.state) && `${hhmm(order.slot_starts_at)}-д ирнэ`,
    order.table && `Ширээ ${order.table}`,
  ]
    .filter(Boolean)
    .join(' · ');
  $('sheet-walk').textContent = '';

  const body = $('sheet-body');
  body.replaceChildren();

  const done = {
    placed: true,
    accepted: order.state !== 'PLACED',
    fired: ['FIRED', 'COOKING', 'READY', 'SERVED', 'CLOSED'].includes(order.state),
    ready: ['READY', 'SERVED', 'CLOSED'].includes(order.state),
    served: ['SERVED', 'CLOSED'].includes(order.state),
  };
  // A time stands only beside the step it is the time of. The arrival slot
  // used to stand beside «Захиалга баталгаажлаа», which read as the moment
  // the order was confirmed.
  const when = { fired: order.fire_at, ready: order.ready_at };

  // The state in one word — or the time it goes on the fire — big in the
  // display face, the four-bar meter under it and one sentence under that.
  // A finished negative outcome is its word alone, and the sentence is then
  // what happens to the money — the thing the guest wants to know.
  const negative = NEGATIVE.includes(order.state);
  const lastStep = STEPS.filter(([key]) => done[key]).at(-1)?.[1] ?? '';
  const step = negative ? 0 : LUNCH_STEP[order.state];
  const card = el(`
    <div class="status" data-s="${escapeHtml(order.state)}">
      <div class="big${word ? '' : ' mono'}">${escapeHtml(big)}</div>
      ${step ? meter(step) : ''}
      <div class="cap">${escapeHtml(sub)}</div>
    </div>`);

  const next = negative ? null : STEPS.find(([key]) => !done[key])?.[0];
  const timeline = el('<ul class="timeline stepper"></ul>');
  for (const [key, wordFor] of STEPS) {
    timeline.append(
      el(`<li${done[key] ? ' data-done' : ''}${key === next ? ' data-next' : ''}>
            <span class="t">${when[key] ? hhmm(when[key]) : ''}</span>
            <span class="w">${wordFor}</span>
          </li>`),
    );
  }
  card.append(timeline);
  body.append(card);
  // News found by a look in the background is said, not only drawn.
  // The step it reached and the sentence under it («Гал дээр гарлаа. Хоол хийгдэж эхэллээ»), or a cancel's word and what becomes of the money.
  $('sheet-said').textContent = moved ? (negative ? [word, cap] : [lastStep, sub || big]).filter(Boolean).join('. ') : '';

  // Once the kitchen has taken the order there is a walk to make, so the map
  // shows it — and this is the moment to ask where the guest is, rather than
  // on page load when the answer is not yet useful for anything.
  if (WALKING.includes(order.state)) {
    if (state.here && state.venue?.lat) void drawWalk(state.venue);
    else askWhereYouAre();
  }

  const foot = $('sheet-foot');
  foot.replaceChildren();

  // One primary: the walk, while it is the guest's move. Cancelling is the
  // outlined red beneath it, never a second filled button.
  if (order.state === 'ARMED' || order.state === 'SCHEDULED') {
    const otw = el(
      '<button class="btn" data-v="primary" data-size="lg" type="button">Хөдөллөө</button>',
    );
    otw.addEventListener('click', async () => {
      if (otw.hasAttribute('data-busy')) return;
      otw.dataset.busy = '1';
      try {
        await guestApi(`/v1/orders/${state.orderId}/signal`, {
          method: 'POST',
          body: { type: 'on_my_way' },
        });
        toast('Мэдэгдлээ. Гал тавих цаг шинэчлэгдэнэ.');
        await api('/dev/tick', { method: 'POST' }).catch(() => {});
        void showStatus(true).catch(() => {});
      } catch (error) {
        delete otw.dataset.busy;
        toast(whatWentWrong(error), 'bad');
      }
    });
    foot.append(otw);
  }

  if (order.can_cancel) {
    const until = order.free_cancel_until ? hhmm(order.free_cancel_until) : null;
    const cancel = el(
      `<button class="btn" data-v="danger" data-size="lg" type="button">
         Үнэгүй цуцлах${until ? ` — ${until} хүртэл` : ''}
       </button>`,
    );
    // One tap used to cancel a paid lunch outright. It asks first now, and
    // says what happens to the money.
    cancel.addEventListener('click', () => {
      void confirmPopup({
        title: 'Захиалгаа цуцлах уу?',
        text: `<p>Хоол гал дээр гараагүй тул <b>${mnt(order.total_mnt)}</b> бүтнээрээ буцаагдана.${
          until ? ` ${until} цагаас хойш цуцлах боломжгүй.` : ''
        }</p>`,
        ok: 'Цуцлах',
        cancel: 'Болих',
        danger: true,
        onConfirm: async () => {
          try {
            await guestApi(`/v1/orders/${state.orderId}/cancel`, { method: 'POST' });
          } catch (error) {
            throw new Error(whatWentWrong(error));
          }
          toast('Цуцлагдлаа. Мөнгө тань буцаагдана.');
          void showStatus(true).catch(() => {});
          return true;
        },
      });
    });
    foot.append(cancel);
  }

  if (order.receipt) {
    body.append(
      el(
        `<div class="note" data-k="info"><b>Е-баримт</b><span>Сугалаа <span class="mono">${escapeHtml(order.receipt.lottery)}</span></span></div>`,
      ),
    );
  }

  if (order.can_review) appendReview(body, foot, order);

  // Once there is nothing left to watch, let go of the order and the route.
  if (OVER.includes(order.state)) {
    const again = el('<button class="btn" data-size="lg" type="button">Шинэ захиалга</button>');
    again.addEventListener('click', () => {
      state.orderId = null;
      state.route = null;
      map?.getSource(ROUTE)?.setData(emptyLine());
      closeSheet();
      void loadVenues();
    });
    foot.append(again);
  }
}

/**
 * The review, once the food has been handed over.
 *
 * Two questions, deliberately not merged. Stars are for the next guest — was
 * it good. `on_time` is for us: a four-star lunch that arrived ten minutes
 * late is a success by one measure and a failure by the other, and one score
 * would hide exactly the thing this product is judged on.
 *
 * Nothing is required. A guest who taps three stars and closes the sheet has
 * told us something useful, and demanding a comment first would lose it.
 *
 * The form goes in the body; its one button goes in the footer, where a
 * sheet's primary lives.
 */
function appendReview(body, foot, order) {
  const existing = order.review;
  const draft = {
    stars: existing?.stars ?? 0,
    onTime: existing?.onTime ?? null,
    comment: existing?.comment ?? '',
    dishes: new Map((existing?.dishes ?? []).map((d) => [d.menuItemId, d.stars])),
  };

  const box = el(`
    <div class="review">
      <h3>${existing ? 'Таны үнэлгээ' : 'Хоол ямар байв?'}</h3>
      <p class="lead">${
        existing ? 'Өөрчилж болно.' : 'Дараагийн хүнд тусална. Заавал биш.'
      }</p>
    </div>`);

  const send = el(
    `<button class="btn" data-v="primary" data-size="lg" type="button"${
      draft.stars ? '' : ' disabled'
    }>${existing ? 'Шинэчлэх' : 'Илгээх'}</button>`,
  );

  box.append(
    starPicker(draft.stars, (n) => {
      draft.stars = n;
      send.disabled = false;
    }),
  );

  for (const line of order.lines ?? []) {
    const row = el(`
      <div class="row">
        ${line.image_url ? `<img src="${escapeHtml(dishPicture(line.image_url))}" alt="">` : ''}
        <div class="n">${escapeHtml(line.name)}${line.qty > 1 ? ` ×${line.qty}` : ''}</div>
      </div>`);
    row.append(
      starPicker(
        draft.dishes.get(line.menu_item_id) ?? 0,
        (n) => draft.dishes.set(line.menu_item_id, n),
        'sm',
        `${line.name} — үнэлгээ`,
      ),
    );
    box.append(row);
  }

  const timing = el(`
    <div class="ontime">
      <span>Хоол цагтаа ирсэн үү?</span>
      <div class="seg">
        <button type="button" data-a="yes">Тийм</button>
        <button type="button" data-a="no">Үгүй</button>
      </div>
    </div>`);
  const paintTiming = () => {
    for (const button of timing.querySelectorAll('button')) {
      const chosen =
        (button.dataset.a === 'yes' && draft.onTime === true) ||
        (button.dataset.a === 'no' && draft.onTime === false);
      if (chosen) button.dataset.on = button.dataset.a;
      else delete button.dataset.on;
    }
  };
  timing.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    draft.onTime = button.dataset.a === 'yes';
    paintTiming();
  });
  paintTiming();
  box.append(timing);

  const note = el(
    `<textarea class="input" maxlength="500" placeholder="Сэтгэгдэл (заавал биш)" aria-label="Сэтгэгдэл">${escapeHtml(draft.comment)}</textarea>`,
  );
  note.addEventListener('input', () => (draft.comment = note.value));
  box.append(note);

  send.addEventListener('click', async () => {
    send.dataset.busy = '1';
    send.textContent = 'Илгээж байна…';
    try {
      await guestApi(`/v1/orders/${state.orderId}/review`, {
        method: 'POST',
        body: {
          stars: draft.stars,
          on_time: draft.onTime ?? undefined,
          comment: draft.comment,
          dishes: [...draft.dishes].map(([menu_item_id, stars]) => ({ menu_item_id, stars })),
        },
      });
      toast('Баярлалаа. Үнэлгээ хадгалагдлаа.');
      void showStatus(true).catch(() => {});
    } catch (error) {
      toast(whatWentWrong(error), 'bad');
      delete send.dataset.busy;
      send.textContent = existing ? 'Шинэчлэх' : 'Илгээх';
    }
  });
  body.append(box);
  foot.append(send);
}

/* ── boot ───────────────────────────────────────────────────────── */

/**
 * Pick up an order that already exists.
 *
 * Two ways in: the Basu home screen deep-links one (`/dine?order=…`), or the
 * page was reloaded mid-lunch and the guest expects their status back rather
 * than an empty map. Which order that is comes from the server — an id kept
 * on the phone would go on pointing at a lunch that finished yesterday.
 *
 * Nobody is signed in on the way through: a visitor who has never ordered
 * gets the map, not an account.
 */
async function resumeOrder() {
  if (!store.guestToken) return;
  const wanted = new URLSearchParams(location.search).get('order');
  let orders;
  try {
    ({ orders } = await guestApi('/v1/orders'));
  } catch {
    return;
  }
  if (gone) return;
  // Live orders arrive in the order they will happen, so the first is the next.
  const order = wanted ? orders.find((o) => o.id === wanted) : orders[0];
  if (!order) return;

  state.orderId = order.id;
  // The venue object, not just its name: the route and the walk need its
  // coordinates, and the sheet needs to know whether it is still accepting.
  state.venue = state.venues.find((v) => v.id === order.restaurant.id) ?? state.venue;
  state.sent = new Set();
  await showStatus(true).catch((error) => toast(whatWentWrong(error), 'bad'));
}

mountClock(() => {
  void loadVenues();
  if (state.orderId) void showStatus(true).catch(() => {});
});

void loadVenues().then(resumeOrder);

/**
 * The status screen changes without the guest touching anything, so it polls.
 *
 * It stops when the page goes away. A browser tearing a page down makes this
 * moot, but a page kept alive in the background — or embedded in a test — that
 * keeps asking the server for orders it will never draw is doing work for
 * nobody. A look that fails says so under the bar and is simply asked again.
 */
const poll = setInterval(() => {
  if (document.hidden) return;
  if (state.orderId) void showStatus().catch(() => showStale(true));
  else void loadVenues();
}, 4000);
// The phone found its network again: ask now rather than at the next tick.
addEventListener('online', () => {
  if (state.orderId) void showStatus(true).catch(() => showStale(true));
  else void loadVenues();
});
addEventListener('pagehide', () => {
  clearInterval(poll);
  gone = true;
});
</script>
</body>
</html>
