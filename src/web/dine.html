<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#E9EBEC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1315">
<title>Basu — үдийн хоол</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.css">
<link rel="stylesheet" href="/app.css">
<style>
/* Layout only. Colour, type, radius, buttons, chips, rows, the sheet and the
   stepper come from /app.css; what is left here is where things sit. */
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column}

/* The map is the page: the product is "which lunch is five minutes away",
   and that is a question about a place before it is one about a menu.
   MapLibre sets its own 12px Helvetica on the container; the chrome inside
   it takes the page's face back. */
#map{flex:1;min-height:0;position:relative;background:var(--bg);font:inherit}

/* The bar floats over the map. Absolute in the map's box rather than fixed
   in the viewport, so the demo clock strip above the map keeps its own row;
   the map fills the rest of the screen, so the two read the same. */
#map > .topbar[data-fixed]{position:absolute;top:0;left:0;right:0}

/* Nobody is cooking: said under the bar, over the map. The page's notes are
   a bold line over a sentence with no icon, so they stack. */
#map > .note{position:absolute;top:calc(var(--bar-h) + var(--safe-t) + 12px);left:12px;right:12px;z-index:5}
.note[data-k]{flex-direction:column;gap:2px}

/* MapLibre's controls in the system's material. */
#map .maplibregl-ctrl-group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl)}
#map .maplibregl-ctrl-group:not(:empty){box-shadow:var(--shadow)}
#map .maplibregl-ctrl-group button{width:40px;height:40px}
#map .maplibregl-ctrl-group button+button{border-top:1px solid var(--line)}
#map .maplibregl-ctrl-group button:focus:first-child{border-radius:var(--r-ctl) var(--r-ctl) 0 0}
#map .maplibregl-ctrl-group button:focus:last-child{border-radius:0 0 var(--r-ctl) var(--r-ctl)}
#map .maplibregl-ctrl button:not(:disabled):hover,#map .maplibregl-ctrl button:not(:disabled):active{background-color:var(--surface-2)}
#map .maplibregl-ctrl-attrib{background:var(--glass);color:var(--ink-2);font-size:var(--t-eyebrow);border-radius:var(--r-sm)}
#map .maplibregl-ctrl-attrib.maplibregl-compact{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-pill)}
#map .maplibregl-ctrl-attrib.maplibregl-compact-show{border-radius:var(--r-sm)}
#map .maplibregl-ctrl-attrib a{color:var(--accent-ink)}
/* Until the map has a dark palette of its own, the daylight tiles sit under
   a 35% wash of the ground, and the control glyphs are lifted. Both dark
   blocks, like app.css, so an explicit theme wins either way. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) #map::after{content:"";position:absolute;inset:0;z-index:1;background:var(--bg);opacity:.35;pointer-events:none}
  :root:not([data-theme="light"]) #map .maplibregl-ctrl-icon{filter:invert(.88)}
}
:root[data-theme="dark"] #map::after{content:"";position:absolute;inset:0;z-index:1;background:var(--bg);opacity:.35;pointer-events:none}
:root[data-theme="dark"] #map .maplibregl-ctrl-icon{filter:invert(.88)}
/* On a desk the sheet docks on the right; the controls step out from under
   it, and the dock starts below the demo clock strip when there is one. */
@media (min-width:900px){
  body:has(.sheet[data-dock][data-open]) #map .maplibregl-ctrl-bottom-right{right:440px}
  body:has(> .clockbar) .sheet[data-dock]{top:32px}
}

/* The walk, when a venue is open and we know where the guest is. */
.walk{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:var(--t-cap);line-height:1.4;color:var(--ink-2)}
.walk:empty{display:none}
.walk svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-3)}
.walk b{font-weight:500;color:var(--ink)}
.walk .guess{color:var(--ink-3)}

/* ── inside the sheet ─────────────────────────────────────────────── */
.sheet > .body > .empty{border-top:0;padding:20px}
.sheet .note{margin:16px 20px}

/* When, first and always in view: the strip sticks under the header while
   the menu scrolls beneath it. One row of pills, scrolling sideways. Opaque,
   not glass: a backdrop filter nested inside the sheet's own is not painted
   everywhere, and rows showing through the strip read as a mistake. */
.when-strip{position:sticky;top:0;z-index:2;padding:4px 20px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.when-strip .section-title{margin:8px 0 10px}
.slots{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:1px 20px 3px}
.slots::-webkit-scrollbar{display:none}
.slot{
  flex:none;min-height:44px;padding:0 16px;border-radius:var(--r-pill);
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-size:var(--t-body-lg);font-weight:500;font-variant-numeric:tabular-nums;
  transition:background var(--dur),border-color var(--dur),color var(--dur),transform 120ms var(--ease);
}
.slot[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink);font-weight:600}
.slot[disabled]{background:var(--surface-2);border-color:var(--line);color:var(--ink-3);text-decoration:line-through;cursor:not-allowed}
.slot:not([disabled]):active{transform:scale(.985)}
@media (hover:hover){.slot:not([disabled]):not([aria-pressed="true"]):hover{border-color:var(--ink-3)}}

/* The menu: full-bleed rows in the sheet, so the sheet is the card. */
.sheet .menu{border-left:0;border-right:0;border-radius:0;box-shadow:none;background:none}
.item .lead img{width:56px;height:56px}
.item .name{font-size:var(--t-row);font-weight:500;line-height:var(--lh-snug);color:var(--ink)}
.item .meta{font-size:var(--t-cap);color:var(--ink-2)}
.item .meta svg{width:12px;height:12px;vertical-align:-1px;fill:var(--star);stroke:none}
.item > .end{gap:8px}
.item[data-off] .money{color:var(--ink-3)}
.item[data-off] .lead img{opacity:.6}
.qty{display:inline-flex;align-items:stretch;height:40px;border:1px solid var(--line-2);border-radius:var(--r-ctl);background:var(--surface);overflow:hidden}
.qty button{width:40px;padding:0;border:0;background:none;color:var(--ink-2);display:grid;place-items:center}
.qty button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.qty button:active{background:var(--surface-2);color:var(--ink)}
@media (hover:hover){.qty button:hover{background:var(--surface-2);color:var(--ink)}}
.qty span{min-width:28px;display:grid;place-items:center;font-weight:600;color:var(--ink)}

/* The footer: what is in the basket, the time, the total, then one button. */
.sheet > footer .terms{margin:0;text-align:center;font-size:var(--t-cap);line-height:1.45;color:var(--ink-2)}
.sheet > footer .terms b{color:var(--ink)}

/* ── status, once an order exists ────────────────────────────────── */
/* A guest walking to the restaurant wants the progress and the route at the
   same time, so this is a sheet over the map rather than a page instead of it.
   Dismissing it leaves a bar at the bottom to bring it back. */
.status{padding:20px 20px 8px;text-align:center}
.status .lab{display:inline-flex;align-items:center;gap:6px}
.status .lab .dot{margin:0}
.status .big{margin-top:10px;font-size:1.5rem;font-weight:600;line-height:1.15;letter-spacing:-.015em;color:var(--ink);text-wrap:balance}
.status .big.mono{font-size:var(--t-display);line-height:1.1;letter-spacing:-.01em}
.status .cap{margin-top:6px}
.status .cap:empty{display:none}
.status .timeline{margin-top:16px;padding-top:8px;border-top:1px solid var(--line)}

.orderbar{
  position:fixed;left:0;right:0;bottom:0;z-index:var(--z-bar);
  display:none;align-items:center;gap:12px;width:100%;
  min-height:calc(var(--tabbar-h) + var(--safe-b));padding:10px 20px calc(10px + var(--safe-b));
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:0;border-top:1px solid var(--line);border-radius:var(--r-md) var(--r-md) 0 0;box-shadow:var(--shadow-sheet);
  color:inherit;text-align:left;
}
.orderbar[data-open]{display:flex}
.orderbar > span{display:flex;flex-direction:column;flex:1;min-width:0}
.orderbar .code{font-weight:600;line-height:1.3;color:var(--ink)}
.orderbar .what{font-size:var(--t-cap);line-height:1.3;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orderbar .what:empty{display:none}
.orderbar .when{margin-left:auto;flex:none;font-size:1.25rem;font-weight:600;line-height:1;color:var(--ink)}
.orderbar .when:not(.mono){font-size:var(--t-body-lg)}
@media (min-width:640px){
  .orderbar{left:50%;right:auto;width:520px;max-width:calc(100% - 40px);transform:translateX(-50%);border:1px solid var(--line);border-bottom:0}
}

/* ── the review ───────────────────────────────────────────────────── */
/* A row of five buttons rather than a slider or a select: the whole gesture
   is one tap, and the answer is visible without opening anything. */
.stars{display:flex}
.stars button{width:44px;height:44px;padding:0;border:0;background:none;color:var(--ink-3);display:grid;place-items:center}
.stars button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
.stars button[data-on]{color:var(--star)}
.stars button[data-on] svg{fill:currentColor}
.stars[data-size="sm"] button{width:32px;height:36px}
.stars[data-size="sm"] button svg{width:18px;height:18px}
.rating{display:inline-flex;align-items:center;gap:3px;color:var(--ink-2)}
.rating i{display:inline-flex;color:var(--star)}
.rating i svg{width:13px;height:13px;fill:currentColor;stroke:none}
.rating em{font-style:normal;color:var(--ink-3)}

.review{padding:16px 20px 20px;border-top:1px solid var(--line)}
.review p.lead{margin:2px 0 10px;font-size:var(--t-cap);line-height:1.4;color:var(--ink-2)}
.review > .stars{margin:0 -10px}
.review .row{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;border-top:1px solid var(--line)}
.review > .stars + .row{margin-top:8px}
.review .row img{width:40px;height:40px;border-radius:var(--r-sm);background:var(--surface-2);object-fit:cover;flex:none}
.review .row .n{flex:1;min-width:0;font-size:var(--t-body-lg);color:var(--ink)}
.review .row .stars{margin-right:-7px}
.review textarea{margin-top:12px}
/* The timing question is the product's own metric and is asked separately:
   a four-star lunch that came late is a success by one measure and a failure
   by the other, and one score would hide exactly that. */
.ontime{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-height:44px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.ontime > span{flex:1;min-width:140px;font-size:var(--t-body-lg);color:var(--ink)}

.said{padding:8px 20px 20px;border-top:1px solid var(--line)}
.said .section-title{margin:16px 0 10px}
/* The average and the timing share sit together, because they answer
   different questions and a guest weighs both. */
.said .summary{
  display:flex;align-items:baseline;justify-content:flex-start;gap:12px;flex-wrap:wrap;
  padding-bottom:12px;border-bottom:1px solid var(--line);font-size:var(--t-cap);color:var(--ink-2);
}
.said .summary .big{display:inline-flex;align-items:center;gap:6px;font-size:var(--t-title-2);font-weight:600;line-height:1;letter-spacing:-.015em;color:var(--ink)}
.said .summary .big i{display:inline-flex;color:var(--star)}
.said .summary .big i svg{width:18px;height:18px;fill:currentColor;stroke:none}
.said .summary .pct{color:var(--hold)}
.said .summary .pct[data-good="true"]{color:var(--ready)}
.said .none{padding:12px 0 0;font-size:var(--t-body);color:var(--ink-2)}
.said .one{padding:12px 0;border-top:1px solid var(--line)}
.said .summary + .one{border-top:0}
.said .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;font-size:var(--t-cap);color:var(--ink-2)}
.said .who b{font-weight:500;color:var(--ink)}
.said .txt{font-size:var(--t-body-lg);line-height:1.5;color:var(--ink);overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="map">
  <div class="topbar" data-fixed>
    <a class="home" href="/app" id="home" aria-label="Basu нүүр"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>Basu</a>
    <div class="title" id="badge"><b>Үдийн хоол</b><span>Ирэхээс чинь өмнө гал тавина</span></div>
    <span class="act"></span>
  </div>
</div>

<div class="scrim" id="scrim" data-dock></div>

<section class="sheet" id="sheet" aria-label="Ресторан" data-dock>
  <header>
    <div>
      <h2 id="sheet-name">—</h2>
      <div class="sub" id="sheet-sub"></div>
      <div class="walk" id="sheet-walk"></div>
    </div>
    <button class="x" type="button" id="sheet-close" aria-label="Хаах"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div class="body" id="sheet-body"></div>
  <footer id="sheet-foot"></footer>
</section>

<button class="orderbar" id="orderbar" type="button">
  <span>
    <span class="code mono" id="ob-code">—</span>
    <span class="what" id="ob-what"></span>
  </span>
  <span class="when mono" id="ob-when"></span>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.js"></script>
<script type="module">
import { api, store, shell, toast, mountClock, mnt, money, hhmm, HEADLINE, signInSheet } from '/api.js';
import { mapStyle, pinImage, ULAANBAATAR, isCovered, metresBetween, walkMinutes } from '/mapStyle.js';

const $ = (id) => document.getElementById(id);
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};

const SOURCE = 'venues';
const LAYER = 'venue-pin';
const ROUTE = 'walk';

const emptyLine = () => ({ type: 'FeatureCollection', features: [] });

/* The page's own glyphs: 24-unit strokes in currentColor, so they take the
   colour of whatever they sit in and never a glyph from the text font. */
const ICON = {
  star: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg>',
  minus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg>',
  plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>',
  walk: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="13.5" cy="4.2" r="1.7"/><path d="M13 7.6l-2.4 4.6 2.6 2.4-2 6.4M13 7.6l3.2 1.9 1.8 3.3M10.6 12.2l-2.6 3.2M13.2 14.6l3.2 2.6 1.4 3.8"/></svg>',
};

/**
 * Five tappable stars that keep their own state.
 *
 * They redraw themselves rather than asking the form to rebuild: rebuilding
 * the block would take the caret out of the comment box somebody was typing in.
 */
function starPicker(value, onPick, size) {
  const box = el(`<div class="stars"${size ? ` data-size="${size}"` : ''}></div>`);
  let picked = value;

  const paint = () => {
    box.replaceChildren();
    for (let n = 1; n <= 5; n++) {
      const star = el(
        `<button type="button" aria-label="${n} од"${n <= picked ? ' data-on' : ''}>${ICON.star}</button>`,
      );
      star.addEventListener('click', () => {
        picked = n;
        paint();
        onPick(n);
      });
      box.append(star);
    }
  };

  paint();
  return box;
}

/** A rating as one line: [star] 4.6 (12). Null reads as "nobody has said yet". */
function ratingLine(rating) {
  if (!rating?.count) return el('<span class="rating"><em>үнэлгээ алга</em></span>');
  return el(
    `<span class="rating"><i>${ICON.star}</i>${rating.stars.toFixed(1)}<em>(${rating.count})</em></span>`,
  );
}

const state = {
  venues: [],
  venue: null,
  menu: [],
  slots: [],
  cart: new Map(),
  slot: null,
  orderId: null,
  here: null,
  route: null,
  /** Geofence bands already reported for the current order. */
  sent: new Set(),
};

/**
 * The page is on its way out. A request already in flight still lands after
 * `pagehide`, and drawing its answer into a document that is being torn down
 * is an error in a test and wasted work in a browser — so every path that
 * awaits the server and then touches the page checks this first.
 */
let gone = false;

/* ── signing in ──────────────────────────────────────────────────── */

async function signIn() {
  // Inside the phone app the sheet is the shell's, and so is the token.
  if (shell.present) return shell.signIn();
  // A developer's machine answers this; the real server does not have it.
  try {
    const { token } = await api('/dev/login', { method: 'POST', body: {} });
    store.guestToken = token;
    return token;
  } catch (error) {
    if (error.status !== 404) throw error;
  }
  return signInSheet();
}

/**
 * Every call that needs a guest goes through here.
 *
 * A stored token outlives the thing it points at: sessions expire, get
 * revoked, or vanish when the demo database is reseeded. So a 401 means sign
 * in again and retry — once — rather than a dead end.
 */
async function guestApi(path, options = {}) {
  const token = store.guestToken ?? (await signIn());
  try {
    return await api(path, { ...options, token });
  } catch (error) {
    if (error.status !== 401) throw error;
    store.guestToken = null;
    return api(path, { ...options, token: await signIn() });
  }
}

/* ── the map ─────────────────────────────────────────────────────── */

/**
 * The camera the map is meant to look like.
 *
 * Kept as values rather than left implicit because several things move the
 * camera and one of them flattens it: MapLibre's GeolocateControl frames the
 * accuracy circle with a fitBounds, and fitBounds resets pitch to zero unless
 * told otherwise. The tilt is not decoration — the buildings are how somebody
 * recognises where they are — so it is restored after anything that drops it.
 */
const CAMERA = { zoom: 15.4, pitch: 55, bearing: -17 };

const style = mapStyle();
// Named for the same reason as __map below: the tile URLs are a thing worth
// asserting about from outside, and a relative one silently blanks the map.
window.__style = style;

const map = new maplibregl.Map({
  container: 'map',
  style,
  center: [ULAANBAATAR.lon, ULAANBAATAR.lat],
  // Tilted, because the buildings are the landmark. A guest deciding between
  // two lunches five minutes apart recognises the tower they work in long
  // before they recognise a street name, and the tiles carry building heights.
  zoom: CAMERA.zoom,
  pitch: CAMERA.pitch,
  bearing: CAMERA.bearing,
  attributionControl: { compact: true, customAttribution: '© OpenStreetMap' },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

// Named so scripts/inspect.mjs can ask the map what it thinks happened. A
// tile can be byte-perfect at the proxy and still never be requested, and
// nothing outside the browser can see that.
window.__map = map;

map.on('error', (event) => {
  // MapLibre reports a missing tile, a bad style and a dead source the same
  // way — quietly, on this channel. Left unhandled it is a blank map with no
  // explanation anywhere.
  console.error('[map]', event?.error?.message ?? event?.error ?? event);
});

/**
 * Where the guest is, and what that means for the order.
 *
 * The ETA model already reasons about 800m and 300m bands, but nothing could
 * ever emit them because nothing knew where anybody was. This closes that
 * loop: crossing a band reports it once and the planner moves the fire time.
 */
const geolocate = new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true },
  trackUserLocation: true,
  showUserLocation: true,
  // Without this it fits the accuracy circle, which on a good fix means
  // street level and on a poor one means the whole district.
  fitBoundsOptions: { maxZoom: 16.4, pitch: CAMERA.pitch, bearing: CAMERA.bearing },
});
map.addControl(geolocate, 'bottom-right');

/** Put the tilt back if something flattened it. */
function keepTilt() {
  if (Math.abs(map.getPitch() - CAMERA.pitch) < 2) return;
  map.easeTo({ pitch: CAMERA.pitch, bearing: CAMERA.bearing, duration: 500 });
}

geolocate.on('geolocate', (position) => {
  const { latitude: lat, longitude: lon } = position.coords;
  if (!isCovered(lat, lon)) return; // outside the tiles, and outside the pilot
  const first = !state.here;
  state.here = { lat, lon };
  void reportProximity();
  // A venue may already be open; the walk to it is now answerable.
  if (state.venue) void drawWalk(state.venue);
  // The control has just moved the camera; make sure it left the tilt alone.
  setTimeout(keepTilt, 600);
  void first;
});

/**
 * The walk from here to a restaurant: the road somebody would take, how far it
 * is, and how long it takes on foot.
 *
 * The straight line between two points in a city is short by about a third —
 * buildings are in the way — so this asks the server, which has the road
 * geometry. When the router cannot be reached it answers with a straight line
 * marked `direct`, and the layer above draws that dashed.
 */
/**
 * Ask for the guest's position, once.
 *
 * Deliberately not on page load: a permission prompt before anybody has
 * chosen anything is a prompt most people refuse. Asked here it has an
 * obvious answer to give — the way to the food they just bought.
 */
let asked = false;
function askWhereYouAre() {
  if (asked || state.here) return;
  asked = true;
  try {
    geolocate.trigger();
  } catch {
    // Denied, unavailable, or not yet ready. The order works without it;
    // only the route is missing, and the walk estimate falls back to the
    // restaurant's own on-foot minutes.
  }
}

async function drawWalk(venue) {
  const walk = document.getElementById('sheet-walk');
  if (!state.here || !venue?.lat) {
    map.getSource(ROUTE)?.setData(emptyLine());
    if (walk) walk.textContent = '';
    return;
  }

  // Six places is about eleven centimetres, which is finer than any phone
  // knows and keeps the URL — and the cache key — from churning on noise.
  const at = (lon, lat) => `${lon.toFixed(6)},${lat.toFixed(6)}`;
  const from = at(state.here.lon, state.here.lat);
  const to = at(venue.lon, venue.lat);

  let route;
  try {
    route = await api(`/v1/route?from=${from}&to=${to}`);
  } catch (error) {
    // Silence here hid a real failure for a whole round of debugging: the
    // endpoint was refusing genuine GPS precision and the map simply drew
    // nothing, with no way to tell that from "no position yet".
    console.warn('[route]', error.message);
    if (walk) walk.textContent = '';
    return;
  }
  // The guest may have closed the sheet or opened another one meanwhile.
  if (state.venue?.id !== venue.id) return;
  state.route = route;

  map.getSource(ROUTE)?.setData({
    type: 'FeatureCollection',
    features: [
      {
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: route.line },
        properties: { direct: route.kind === 'direct' },
      },
    ],
  });

  const km = route.metres >= 1000 ? `${(route.metres / 1000).toFixed(1)} км` : `${route.metres} м`;
  const sub = document.getElementById('sheet-walk');
  if (sub) {
    sub.innerHTML =
      `<span>${ICON.walk}</span><b class="mono">${km}</b><span>·</span><b class="mono">${route.minutes} мин</b>` +
      (route.kind === 'direct' ? '<span class="guess">ойролцоогоор</span>' : '');
  }

  // Pan, do not reframe.
  //
  // Fitting both ends of a 1.2 km walk means zooming out until the tilt
  // flattens and the buildings — the thing that makes this map legible — turn
  // back into a plan. The distance and the time are already written above; the
  // camera's job is to keep the guest and the road in front of them in view.
  const middle = route.line[Math.floor(route.line.length / 2)] ?? route.line[0];
  map.easeTo({
    center: middle,
    zoom: Math.max(map.getZoom(), CAMERA.zoom),
    pitch: CAMERA.pitch,
    bearing: CAMERA.bearing,
    duration: 700,
  });
}

async function reportProximity() {
  if (!state.orderId || !state.here || !state.venue?.lat) return;

  const metres = metresBetween(state.here, { lat: state.venue.lat, lon: state.venue.lon });
  const band = metres <= 300 ? 'geofence_300' : metres <= 800 ? 'geofence_800' : null;
  if (!band || state.sent.has(band)) return;

  state.sent.add(band);
  try {
    await guestApi(`/v1/orders/${state.orderId}/signal`, { method: 'POST', body: { type: band } });
    toast(`${Math.round(metres)}м зайд ирлээ — гал тавих цаг шинэчлэгдэнэ.`);
    await api('/dev/tick', { method: 'POST' }).catch(() => {});
    void showStatus(true);
  } catch {
    state.sent.delete(band); // let the next fix try again
  }
}

let ready = false;
map.on('load', () => {
  // The map draws in the page's own tokens, read once when it is ready: an
  // open pin is the accent, a shut one the third ink, both ringed with the
  // surface; the walk is the route blue cased in surface.
  const token = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const palette = {
    accent: token('--accent'),
    ink: token('--ink'),
    ink3: token('--ink-3'),
    surface: token('--surface'),
    onAccent: token('--on-accent'),
    route: token('--route'),
  };
  map.addImage('pin-open', pinImage(palette.accent, false, palette.surface, palette.onAccent), { pixelRatio: 2 });
  map.addImage('pin-shut', pinImage(palette.ink3, true, palette.surface, palette.onAccent), { pixelRatio: 2 });

  // The walk, under the pins so a pin is never hidden by its own route.
  map.addSource(ROUTE, { type: 'geojson', data: emptyLine() });
  map.addLayer({
    id: 'route-casing',
    type: 'line',
    source: ROUTE,
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': palette.surface, 'line-width': 9, 'line-opacity': 0.9 },
  });
  // Two layers, not one with a data-driven dash.
  //
  // `line-dasharray` accepts zoom expressions and nothing else: a `case` on a
  // feature property is invalid, and MapLibre answers by not drawing the layer
  // at all — no thrown error, no console message, just an empty map with the
  // distance label sitting there saying the route had been found. A filter is
  // the supported way to say the same thing.
  map.addLayer({
    id: 'route-line',
    type: 'line',
    source: ROUTE,
    filter: ['!', ['get', 'direct']],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': palette.route, 'line-width': 5 },
  });
  map.addLayer({
    id: 'route-guess',
    type: 'line',
    source: ROUTE,
    // A straight line drawn dashed, so a guess never looks surveyed.
    filter: ['get', 'direct'],
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': palette.route, 'line-width': 5, 'line-dasharray': [1.4, 1.2] },
  });

  map.addSource(SOURCE, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: LAYER,
    type: 'symbol',
    source: SOURCE,
    layout: {
      'icon-image': ['case', ['get', 'open'], 'pin-open', 'pin-shut'],
      'icon-size': 0.5,
      'icon-anchor': 'bottom',
      'icon-allow-overlap': true,
      'text-field': ['get', 'label'],
      'text-font': ['Noto Sans Regular'],
      'text-size': 11,
      'text-offset': [0, 0.7],
      'text-anchor': 'top',
      'text-allow-overlap': true,
    },
    paint: {
      'text-color': ['case', ['get', 'open'], palette.ink, palette.ink3],
      'text-halo-color': palette.surface,
      'text-halo-width': 1.8,
    },
  });

  map.on('mouseenter', LAYER, () => (map.getCanvas().style.cursor = 'pointer'));
  map.on('mouseleave', LAYER, () => (map.getCanvas().style.cursor = ''));
  map.on('click', LAYER, (event) => {
    const id = event.features?.[0]?.properties?.id;
    const venue = state.venues.find((v) => v.id === id);
    if (venue) void openVenue(venue);
  });

  ready = true;
  paintVenues();
});

function paintVenues() {
  if (!ready) return;
  const features = state.venues
    .filter((v) => Number.isFinite(v.lat) && Number.isFinite(v.lon))
    .map((v) => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [v.lon, v.lat] },
      properties: { id: v.id, open: v.accepting_orders, label: v.name },
    }));
  map.getSource(SOURCE)?.setData({ type: 'FeatureCollection', features });
}

/* ── loading venues ─────────────────────────────────────────────── */

async function loadVenues() {
  const { restaurants } = await api('/v1/restaurants');
  if (gone) return;
  state.venues = restaurants;
  paintVenues();
  if (state.venue) {
    // Keep the open sheet's copy fresh; a kitchen can go dark while it is open.
    const fresh = restaurants.find((r) => r.id === state.venue.id);
    if (fresh) state.venue = { ...state.venue, ...fresh };
  }

  const open = restaurants.filter((r) => r.accepting_orders).length;
  $('badge').querySelector('span').textContent =
    open > 0
      ? `${open}/${restaurants.length} ресторан захиалга авч байна`
      : 'Нэг ч гал тогоо холбогдоогүй';

  // A map of grey pins with no explanation is a dead end. A kitchen goes dark
  // ninety seconds after its tablet stops checking in — the guard working, but
  // the guest still deserves to be told what that means.
  const existing = $('map').querySelector('.note');
  if (open === 0 && !existing) {
    $('map').append(
      el(`<div class="note" data-k="warn">
            <b>Одоогоор нэг ч гал тогоо холбогдоогүй</b>
            <span>Ресторанууд <a href="/kds">гал тогооны дэлгэцээ</a> нээмэгц энд захиалга авч эхэлнэ.</span>
          </div>`),
    );
  } else if (open > 0 && existing) {
    existing.remove();
  }
}

/* ── the sheet ──────────────────────────────────────────────────── */

function closeSheet() {
  $('sheet').removeAttribute('data-open');
  $('scrim').removeAttribute('data-open');

  if (state.orderId) {
    // The order is still live: keep its route on the map and leave a bar to
    // bring the detail back. Someone walking there wants to see both.
    $('orderbar').dataset.open = '1';
    return;
  }
  // No order — the route belonged to a venue nobody chose.
  map.getSource(ROUTE)?.setData(emptyLine());
  state.venue = null;
  state.route = null;
}
$('sheet-close').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);
$('orderbar').addEventListener('click', () => {
  $('orderbar').removeAttribute('data-open');
  void showStatus(true);
});

async function openVenue(venue) {
  $('orderbar').removeAttribute('data-open');
  state.venue = venue;
  state.cart = new Map();
  state.slot = null;

  const walk = state.here
    ? walkMinutes(metresBetween(state.here, { lat: venue.lat, lon: venue.lon }))
    : venue.walk_minutes;

  $('sheet-name').textContent = venue.name;
  $('sheet-name').classList.remove('mono'); // a name, not a code
  delete $('sheet').dataset.busy;
  const sub = $('sheet-sub');
  sub.replaceChildren(
    document.createTextNode(
      `${walk} мин алхаад · ${venue.accepting_orders ? 'захиалга авч байна' : 'хаалттай'} · `,
    ),
    ratingLine(venue.rating),
  );
  $('sheet-body').replaceChildren(el('<p class="empty">Цэс ачаалж байна…</p>'));
  $('sheet-foot').replaceChildren();
  $('sheet').dataset.open = '1';
  $('scrim').dataset.open = '1';

  document.getElementById('sheet-walk').textContent = '';
  if (state.here) {
    // The walk answers "is this worth it" before the menu does.
    void drawWalk(venue);
  } else {
    // Lift the pin above the sheet rather than leaving it hidden behind it.
    map.easeTo({ center: [venue.lon, venue.lat], zoom: 16.6, offset: [0, -120], duration: 500 });
  }

  if (!venue.accepting_orders) {
    $('sheet-body').replaceChildren(
      el(`<div class="note" data-k="warn"><b>Одоогоор захиалга авахгүй байна</b>
            <span>Гал тогооны дэлгэц холбогдоогүй тул хоол хийх хүн байхгүй.</span></div>`),
    );
    return;
  }

  const [{ items }, { slots }] = await Promise.all([
    api(`/v1/restaurants/${venue.id}/menu`),
    api(`/v1/restaurants/${venue.id}/slots`),
  ]);
  state.menu = items;
  state.slots = slots;
  renderSheet();
}

function renderSheet() {
  const body = $('sheet-body');
  body.replaceChildren();

  // When, first and always in view: the strip sticks under the header while
  // the menu scrolls beneath it, so the time is never a scroll away.
  const strip = el(
    '<div class="when-strip"><h3 class="slothead section-title">Хэдэн цагт ирэх вэ?</h3></div>',
  );
  const grid = el('<div class="slots"></div>');
  for (const slot of state.slots) {
    const button = el(
      `<button class="slot mono" type="button" aria-pressed="${state.slot === slot.starts_at}"${
        slot.available ? '' : ' disabled'
      }>${slot.label}</button>`,
    );
    button.addEventListener('click', () => {
      state.slot = slot.starts_at;
      renderSheet();
    });
    grid.append(button);
  }
  strip.append(grid);
  body.append(strip);

  const menu = el('<div class="menu" data-rows></div>');
  for (const item of state.menu) {
    const qty = state.cart.get(item.id) ?? 0;
    const row = el(`
      <div class="item row"${item.sold_out ? ' data-sold data-off' : ''}>
        <span class="lead"><img class="thumb" src="${item.image_url ?? '/dishes/unknown.svg'}" alt="" loading="lazy" width="56" height="56"></span>
        <span class="main">
          <span class="name title">${escapeHtml(item.name)}</span>
          ${item.description ? `<span class="sub desc">${escapeHtml(item.description)}</span>` : ''}
          <span class="meta">${item.prep_minutes} мин${
            item.rating?.count ? ` · ${ICON.star} ${item.rating.stars.toFixed(1)}` : ''
          }</span>
        </span>
        <span class="end"><span class="price">${money(item.price_mnt)}</span></span>
      </div>`);
    const end = row.querySelector('.end');

    if (item.sold_out) {
      end.append(el('<span class="chip">Дууссан</span>'));
    } else {
      const stepper = el(`
        <div class="qty">
          <button type="button" data-d="-1" aria-label="Хасах">${ICON.minus}</button>
          <span class="mono">${qty}</span>
          <button type="button" data-d="1" aria-label="Нэмэх">${ICON.plus}</button>
        </div>`);
      stepper.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        const next = Math.max(0, (state.cart.get(item.id) ?? 0) + Number(button.dataset.d));
        if (next === 0) state.cart.delete(item.id);
        else state.cart.set(item.id, next);
        renderSheet();
      });
      end.append(stepper);
    }
    menu.append(row);
  }
  body.append(menu);
  renderFoot();
  void appendComments(state.venue.id);
}

/**
 * What people who ate here said.
 *
 * Loaded after the menu rather than with it: the menu is what somebody came
 * for, and it should not wait on a second query to appear.
 */
async function appendComments(venueId) {
  let data;
  try {
    data = await api(`/v1/restaurants/${venueId}/reviews`);
  } catch {
    return;
  }
  if (state.venue?.id !== venueId || !data.rating?.count) return;

  const rating = data.rating;
  const said = el(`
    <div class="said">
      <h3 class="section-title">Хоолтой хүмүүс юу гэсэн бэ</h3>
      <div class="summary">
        <span class="big"><i>${ICON.star}</i><span class="mono">${rating.stars.toFixed(1)}</span></span>
        <span>${rating.count} үнэлгээ</span>
        ${
          rating.onTimeShare === null
            ? ''
            : `<span class="pct" data-good="${rating.onTimeShare >= 0.8}">${Math.round(
                rating.onTimeShare * 100,
              )}% цагтаа ирсэн</span>`
        }
      </div>
    </div>`);
  if (!data.comments.length) {
    said.append(el('<div class="none">Одоогоор бичсэн сэтгэгдэл алга.</div>'));
  }
  for (const c of data.comments) {
    said.append(
      el(`<div class="one">
            <div class="who">
              <b>${escapeHtml(c.by)}</b>
              <span class="rating"><i>${ICON.star.repeat(c.stars)}</i></span>
              ${c.onTime === false ? '<span class="late chip" data-tone="hold" data-inline>цагтаа ирээгүй</span>' : ''}
            </div>
            <div class="txt">${escapeHtml(c.comment)}</div>
          </div>`),
    );
  }
  $('sheet-body').append(said);
}

/** Guest text goes into the DOM as text, never as markup. */
function escapeHtml(value) {
  const node = document.createElement('span');
  node.textContent = value;
  return node.innerHTML;
}

function renderFoot() {
  // A POST is in flight: the footer it came from stays put until the server
  // answers, and the sheet is not taking taps meanwhile.
  if ($('sheet').hasAttribute('data-busy')) return;

  const lines = [...state.cart]
    .map(([id, qty]) => ({ item: state.menu.find((m) => m.id === id), qty }))
    .filter((line) => line.item);
  const total = lines.reduce((sum, { item, qty }) => sum + item.price_mnt * qty, 0);
  const foot = $('sheet-foot');
  foot.replaceChildren();
  if (total === 0) return;

  const chosen = Boolean(state.slot);
  const slot = state.slots.find((s) => s.starts_at === state.slot);
  // What the button is about to charge for, line by line, above it.
  for (const { item, qty } of lines) {
    foot.append(
      el(
        `<div class="summary"><span>${escapeHtml(item.name)} ×${qty}</span>${money(item.price_mnt * qty)}</div>`,
      ),
    );
  }
  if (slot) {
    foot.append(
      el(`<div class="summary"><span>Ирэх цаг</span><span class="mono">${slot.label}</span></div>`),
    );
  }
  foot.append(el(`<div class="summary" data-total><span>Нийт</span>${money(total)}</div>`));
  foot.append(el('<p class="terms">Хоол <b>гал дээр гарахаас өмнө</b> үнэгүй цуцална.</p>'));
  const button = el(
    `<button class="btn" data-v="primary" data-size="lg" type="button"${chosen ? '' : ' disabled'}>
       ${chosen ? `${mnt(total)} төлөх` : 'Цагаа сонгоно уу'}
     </button>`,
  );
  button.addEventListener('click', placeOrder);
  foot.append(button);
}

async function placeOrder() {
  const sheet = $('sheet');
  const button = $('sheet-foot').querySelector('button');
  // Busy, not disabled: the sheet stops taking taps and the button shows a
  // spinner over its text, so nothing reads as switched off.
  sheet.dataset.busy = '1';
  button.dataset.busy = '1';
  button.textContent = 'Түр хүлээнэ үү…';
  try {
    const order = await guestApi('/v1/orders', {
      method: 'POST',
      // A phone on a patchy connection retries; the same key must not buy lunch twice.
      idempotencyKey: `order-${state.venue.id}-${state.slot}-${[...state.cart].join(',')}`,
      body: {
        restaurant_id: state.venue.id,
        slot_starts_at: state.slot,
        party_size: 2,
        items: [...state.cart].map(([menu_item_id, qty]) => ({ menu_item_id, qty })),
      },
    });
    await guestApi(`/v1/orders/${order.id}/pay`, { method: 'POST' });
    state.orderId = order.id;
    state.sent = new Set();
    rendered = null;
    shell.ordersChanged();
    await showStatus(true);
  } catch (error) {
    delete sheet.dataset.busy;
    toast(error.message, 'bad');
    renderFoot();
  }
}

/* ── status ─────────────────────────────────────────────────────── */

const STEPS = [
  ['placed', 'Захиалга баталгаажлаа'],
  ['accepted', 'Ресторан хүлээн авлаа'],
  ['fired', 'Гал дээр гарлаа'],
  ['ready', 'Хоол бэлэн'],
  ['served', 'Ширээн дээр'],
];

/**
 * The states with a walk in front of them.
 *
 * From the moment the kitchen accepts until the food is on the table, the
 * guest's job is to get there — so that is when the map carries a route.
 */
const WALKING = ['ACCEPTED', 'SCHEDULED', 'ARMED', 'HELD', 'FIRED', 'COOKING', 'READY'];

/**
 * What the last render was of, so a poll that found no news changes nothing.
 *
 * The status sheet refreshes every few seconds to catch the kitchen accepting
 * or firing. Rebuilding it unconditionally destroyed whatever the guest was
 * doing inside it — a comment being typed vanished a word or two in, which is
 * the sort of thing that makes an app feel broken rather than busy.
 */
let rendered = null;

/**
 * The dot beside the eyebrow: route is waiting on the system, hold on the
 * guest, stop needs attention, accent is on the fire, ready is done. A
 * finished negative outcome has no tone — it is not an alarm.
 */
const TONE = {
  PLACED: 'route',
  ACCEPTED: 'route',
  SCHEDULED: 'route',
  ARMED: 'hold',
  HELD: 'stop',
  FIRED: 'accent',
  COOKING: 'accent',
  READY: 'ready',
  SERVED: 'ready',
  CLOSED: 'ready',
};
const NEGATIVE = ['CANCELLED', 'REFUNDED', 'NO_SHOW', 'REJECTED'];
const OVER = ['SERVED', 'CLOSED', ...NEGATIVE];

async function showStatus(force) {
  if (!state.orderId) return;
  const order = await guestApi(`/v1/orders/${state.orderId}`);
  if (gone) return;

  // Everything the sheet draws. Same signature, same picture — so leave it.
  const signature = [
    order.state,
    order.fire_at,
    order.ready_at,
    order.table,
    order.review ? 'reviewed' : '',
  ].join('|');
  // A poll that found no news changes nothing — including a sheet the guest
  // has just closed, which used to come back four seconds later. News
  // reopens it: the kitchen accepting or firing is worth interrupting for.
  if (!force && signature === rendered) return;
  if (rendered !== null && signature !== rendered) shell.ordersChanged();
  rendered = signature;

  // The states that carry a time say it; the rest carry a word.
  const [word, cap] = HEADLINE[order.state] ?? [null, ''];
  const big = word ?? hhmm(order.fire_at);
  const sub =
    cap ||
    (order.state === 'SCHEDULED'
      ? 'Энэ цагт гал дээр гарна'
      : order.state === 'ARMED'
        ? 'Та замд гарсан уу?'
        : order.state === 'COOKING'
          ? `${hhmm(order.ready_at)}-д бэлэн болно`
          : '');

  // The collapsed bar carries the same answer in one line.
  $('ob-code').textContent = `№${order.code}`;
  $('ob-what').textContent = sub; // the word is already the bar's right-hand answer
  $('ob-when').textContent = HEADLINE[order.state]?.[0] ?? hhmm(order.fire_at);
  $('ob-when').classList.toggle('mono', !word); // a time is a number; a word is not

  $('orderbar').removeAttribute('data-open');
  const sheet = $('sheet');
  delete sheet.dataset.busy;
  sheet.dataset.open = '1';
  $('scrim').dataset.open = '1';
  $('sheet-name').textContent = `№${order.code}`;
  $('sheet-name').classList.add('mono'); // a code, not a name
  $('sheet-sub').textContent = [order.restaurant?.name ?? state.venue?.name, order.table && `Ширээ ${order.table}`]
    .filter(Boolean)
    .join(' · ');

  const body = $('sheet-body');
  body.replaceChildren();

  const done = {
    placed: true,
    accepted: order.state !== 'PLACED',
    fired: ['FIRED', 'COOKING', 'READY', 'SERVED', 'CLOSED'].includes(order.state),
    ready: ['READY', 'SERVED', 'CLOSED'].includes(order.state),
    served: ['SERVED', 'CLOSED'].includes(order.state),
  };
  const when = { placed: order.slot_starts_at, fired: order.fire_at, ready: order.ready_at };

  // The eyebrow says where the order stands, in the timeline's own words. A
  // finished negative outcome names itself, and the big line is then what
  // happens to the money — the thing the guest wants to know.
  const negative = NEGATIVE.includes(order.state);
  const lastStep = STEPS.filter(([key]) => done[key]).at(-1)?.[1] ?? '';
  const tone = TONE[order.state];
  const card = el(`
    <div class="status" data-s="${order.state}">
      <div class="lab"><span class="dot"${tone ? ` data-tone="${tone}"` : ''}></span>${negative ? word : lastStep}</div>
      <div class="big${word ? '' : ' mono'}">${negative ? cap : big}</div>
      <div class="cap">${negative ? '' : sub}</div>
    </div>`);

  const next = negative ? null : STEPS.find(([key]) => !done[key])?.[0];
  const timeline = el('<ul class="timeline stepper"></ul>');
  for (const [key, wordFor] of STEPS) {
    timeline.append(
      el(`<li${done[key] ? ' data-done' : ''}${key === next ? ' data-next' : ''}>
            <span class="t">${when[key] ? hhmm(when[key]) : ''}</span>
            <span class="w">${wordFor}</span>
          </li>`),
    );
  }
  card.append(timeline);
  body.append(card);

  // Once the kitchen has taken the order there is a walk to make, so the map
  // shows it — and this is the moment to ask where the guest is, rather than
  // on page load when the answer is not yet useful for anything.
  if (WALKING.includes(order.state)) {
    if (state.here && state.venue?.lat) void drawWalk(state.venue);
    else askWhereYouAre();
  }

  const foot = $('sheet-foot');
  foot.replaceChildren();

  // One primary: the walk, while it is the guest's move. Cancelling is the
  // outlined red beneath it, never a second filled button.
  if (order.state === 'ARMED' || order.state === 'SCHEDULED') {
    const otw = el(
      '<button class="btn" data-v="primary" data-size="lg" type="button">Хөдөллөө</button>',
    );
    otw.addEventListener('click', async () => {
      await guestApi(`/v1/orders/${state.orderId}/signal`, {
        method: 'POST',
        body: { type: 'on_my_way' },
      });
      toast('Мэдэгдлээ. Гал тавих цаг шинэчлэгдэнэ.');
      await api('/dev/tick', { method: 'POST' }).catch(() => {});
      void showStatus(true);
    });
    foot.append(otw);
  }

  if (order.can_cancel) {
    const cancel = el(
      `<button class="btn" data-v="danger" data-size="lg" type="button">
         Үнэгүй цуцлах${order.free_cancel_until ? ` — ${hhmm(order.free_cancel_until)} хүртэл` : ''}
       </button>`,
    );
    cancel.addEventListener('click', async () => {
      try {
        await guestApi(`/v1/orders/${state.orderId}/cancel`, { method: 'POST' });
        toast('Цуцлагдлаа. Мөнгө буцаагдана.');
      } catch (error) {
        toast(error.message, 'bad');
      }
      void showStatus(true);
    });
    foot.append(cancel);
  }

  if (order.receipt) {
    body.append(
      el(
        `<div class="note" data-k="info"><b>Е-баримт</b><span>Сугалаа <span class="mono">${escapeHtml(order.receipt.lottery)}</span></span></div>`,
      ),
    );
  }

  if (order.can_review) appendReview(body, foot, order);

  // Once there is nothing left to watch, let go of the order and the route.
  if (OVER.includes(order.state)) {
    const again = el('<button class="btn" data-size="lg" type="button">Шинэ захиалга</button>');
    again.addEventListener('click', () => {
      state.orderId = null;
      state.route = null;
      map.getSource(ROUTE)?.setData(emptyLine());
      closeSheet();
      void loadVenues();
    });
    foot.append(again);
  }
}

/**
 * The review, once the food has been handed over.
 *
 * Two questions, deliberately not merged. Stars are for the next guest — was
 * it good. `on_time` is for us: a four-star lunch that arrived ten minutes
 * late is a success by one measure and a failure by the other, and one score
 * would hide exactly the thing this product is judged on.
 *
 * Nothing is required. A guest who taps three stars and closes the sheet has
 * told us something useful, and demanding a comment first would lose it.
 *
 * The form goes in the body; its one button goes in the footer, where a
 * sheet's primary lives.
 */
function appendReview(body, foot, order) {
  const existing = order.review;
  const draft = {
    stars: existing?.stars ?? 0,
    onTime: existing?.onTime ?? null,
    comment: existing?.comment ?? '',
    dishes: new Map((existing?.dishes ?? []).map((d) => [d.menuItemId, d.stars])),
  };

  const box = el(`
    <div class="review">
      <h3>${existing ? 'Таны үнэлгээ' : 'Хоол ямар байв?'}</h3>
      <p class="lead">${
        existing ? 'Өөрчилж болно.' : 'Дараагийн хүнд тусална. Заавал биш.'
      }</p>
    </div>`);

  const send = el(
    `<button class="btn" data-v="primary" data-size="lg" type="button"${
      draft.stars ? '' : ' disabled'
    }>${existing ? 'Шинэчлэх' : 'Илгээх'}</button>`,
  );

  box.append(
    starPicker(draft.stars, (n) => {
      draft.stars = n;
      send.disabled = false;
    }),
  );

  for (const line of order.lines ?? []) {
    const row = el(`
      <div class="row">
        ${line.image_url ? `<img src="${line.image_url}" alt="">` : ''}
        <div class="n">${escapeHtml(line.name)}${line.qty > 1 ? ` ×${line.qty}` : ''}</div>
      </div>`);
    row.append(
      starPicker(
        draft.dishes.get(line.menu_item_id) ?? 0,
        (n) => draft.dishes.set(line.menu_item_id, n),
        'sm',
      ),
    );
    box.append(row);
  }

  const timing = el(`
    <div class="ontime">
      <span>Хоол цагтаа ирсэн үү?</span>
      <div class="seg">
        <button type="button" data-a="yes">Тийм</button>
        <button type="button" data-a="no">Үгүй</button>
      </div>
    </div>`);
  const paintTiming = () => {
    for (const button of timing.querySelectorAll('button')) {
      const chosen =
        (button.dataset.a === 'yes' && draft.onTime === true) ||
        (button.dataset.a === 'no' && draft.onTime === false);
      if (chosen) button.dataset.on = button.dataset.a;
      else delete button.dataset.on;
    }
  };
  timing.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    draft.onTime = button.dataset.a === 'yes';
    paintTiming();
  });
  paintTiming();
  box.append(timing);

  const note = el(
    `<textarea class="input" maxlength="500" placeholder="Сэтгэгдэл (заавал биш)">${escapeHtml(draft.comment)}</textarea>`,
  );
  note.addEventListener('input', () => (draft.comment = note.value));
  box.append(note);

  send.addEventListener('click', async () => {
    send.dataset.busy = '1';
    send.textContent = 'Илгээж байна…';
    try {
      await guestApi(`/v1/orders/${state.orderId}/review`, {
        method: 'POST',
        body: {
          stars: draft.stars,
          on_time: draft.onTime ?? undefined,
          comment: draft.comment,
          dishes: [...draft.dishes].map(([menu_item_id, stars]) => ({ menu_item_id, stars })),
        },
      });
      toast('Баярлалаа. Үнэлгээ хадгалагдлаа.');
      void showStatus(true);
    } catch (error) {
      toast(error.message, 'bad');
      void showStatus(true);
    }
  });
  body.append(box);
  foot.append(send);
}

/* ── boot ───────────────────────────────────────────────────────── */

/**
 * Pick up an order that already exists.
 *
 * Two ways in: the Basu home screen deep-links one (`/dine?order=…`), or the
 * page was reloaded mid-lunch and the guest expects their status back rather
 * than an empty map. Which order that is comes from the server — an id kept
 * on the phone would go on pointing at a lunch that finished yesterday.
 *
 * Nobody is signed in on the way through: a visitor who has never ordered
 * gets the map, not an account.
 */
async function resumeOrder() {
  if (!store.guestToken) return;
  const wanted = new URLSearchParams(location.search).get('order');
  let orders;
  try {
    ({ orders } = await guestApi('/v1/orders'));
  } catch {
    return;
  }
  if (gone) return;
  // Live orders arrive in the order they will happen, so the first is the next.
  const order = wanted ? orders.find((o) => o.id === wanted) : orders[0];
  if (!order) return;

  state.orderId = order.id;
  // The venue object, not just its name: the route and the walk need its
  // coordinates, and the sheet needs to know whether it is still accepting.
  state.venue = state.venues.find((v) => v.id === order.restaurant.id) ?? state.venue;
  state.sent = new Set();
  await showStatus(true);
}

mountClock(() => {
  void loadVenues();
  if (state.orderId) void showStatus(true);
});

void loadVenues().then(resumeOrder);

/**
 * The status screen changes without the guest touching anything, so it polls.
 *
 * It stops when the page goes away. A browser tearing a page down makes this
 * moot, but a page kept alive in the background — or embedded in a test — that
 * keeps asking the server for orders it will never draw is doing work for
 * nobody.
 */
const poll = setInterval(() => {
  if (document.hidden) return;
  if (state.orderId) void showStatus();
  else void loadVenues();
}, 4000);
addEventListener('pagehide', () => {
  clearInterval(poll);
  gone = true;
});
</script>
</body>
</html>
