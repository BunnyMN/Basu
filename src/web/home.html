<!doctype html>
<html lang="mn" data-theme="light" data-site>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Миний Basu</title>
<link rel="icon" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/site.css">
<style>
/* Home, on the website: the apps inside Basu as the tiles the phone shows —
   the same art, larger — and, for somebody signed in, what of theirs is
   going on right now. The phone's launcher is /app; this is the browser's. */

.h-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;margin:0;padding:0;list-style:none}
.h-apps li{display:flex}
.h-apps .h-app{flex:1}
.h-app{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 22px;border:1px solid var(--line);border-radius:22px;background:#fff;color:inherit;text-decoration:none;text-align:center;transition:border-color var(--dur),transform 140ms var(--ease),box-shadow var(--dur)}
@media (hover:hover){.h-app:hover{border-color:var(--line-2);box-shadow:0 18px 36px -24px rgba(18,58,44,.28)}}
.h-app:active{transform:scale(.985)}
.h-app .tile{width:120px;height:120px;border-radius:28px;overflow:hidden;box-shadow:0 10px 24px -14px rgba(22,21,20,.45),0 0 0 1px rgba(22,21,20,.06)}
.h-app .tile img{width:100%;height:100%;object-fit:cover;display:block}
.h-app b{display:block;font-size:1.0625rem;font-weight:600}
.h-app small{display:block;margin-top:2px;font-size:.875rem;color:var(--ink-3)}
.h-app .s-pill{margin-top:2px}
@media (max-width:520px){.h-apps{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.h-app .tile{width:92px;height:92px;border-radius:22px}.h-app{padding:22px 10px 18px}}

.h-sec{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin:44px 0 14px}
.h-sec h2{margin:0;font-size:1.25rem;letter-spacing:-.015em}
.h-sec a{font-size:.9375rem;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:.2em}
.h-live{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.h-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 18px;background:#fff;color:inherit;text-decoration:none}
.h-row + .h-row{border-top:1px solid var(--line)}
@media (hover:hover){a.h-row:hover{background:var(--surface-2)}}
.h-row img{width:64px;height:48px;border-radius:10px;object-fit:cover}
.h-row b{display:block;font-weight:600;line-height:1.35}
.h-row small{display:block;margin-top:2px;font-size:.875rem;color:var(--ink-2)}
.h-row .end{text-align:right}
.h-row .end .when{display:block;font-family:var(--mono);font-weight:600}
.h-row .end .s-pill{margin-top:6px}
.h-hello{margin:0}
@media (max-width:560px){.h-row{grid-template-columns:56px minmax(0,1fr)}.h-row img{width:56px;height:44px}.h-row .end{grid-column:2;display:flex;align-items:center;gap:10px;text-align:left}.h-row .end .s-pill{margin-top:0}}
</style>
</head>
<body>
<main class="s-main">
  <div class="s-wrap">
    <section class="s-head"><h1 id="hi">Миний Basu</h1><p class="h-hello">Өнөөдөр юу хийх вэ?</p></section>
    <ul class="h-apps" id="apps" aria-label="Аппууд"></ul>
    <section id="live" hidden>
      <div class="h-sec"><h2>Идэвхтэй захиалга</h2><a href="/orders">Бүгд</a></div>
      <div class="h-live" id="live-list"></div>
    </section>
  </div>
</main>

<script type="module">
import { api, store, dayShort, IDESH_HEADLINE } from '/api.js';
import { mountFrame, esc, el } from '/site.js';

const person = await mountFrame('home');
const $ = (id) => document.getElementById(id);
if (person?.display_name) $('hi').textContent = `Сайн байна уу, ${person.display_name}`;

/**
 * The apps, as the phone's launcher has them — the same art. On the website
 * each goes where a browser can use it: the market, the front page's word on
 * ordering ahead (the phone's for now), the supplier's own side.
 */
const TILES = [
  { id: 'idesh', name: 'Идэш', tag: 'өвлийн', href: '/shop', art: '/brand/idesh-tile.webp' },
  { id: 'dine', name: 'Хоол', tag: 'урьдчилсан', href: '/#dine', art: '/brand/food-tile.webp', soon: true },
];
const SUPPLIER = { id: 'supplier', name: 'Нийлүүлэгч', tag: 'миний зар', href: '/supplier', art: '/brand/supplier-tile.svg' };

const tile = (t) =>
  el(`<li><a class="h-app" href="${t.href}" data-app="${t.id}">
        <span class="tile"><img src="${t.art}" alt="" width="120" height="120"></span>
        <span><b>${t.name}</b><small>${t.tag}</small></span>
        ${t.soon ? '<span class="s-pill" data-tone="hi">Удахгүй вэбэд</span>' : ''}
      </a></li>`);
for (const t of TILES) $('apps').append(tile(t));

const token = store.guestToken;
if (token) {
  // The supplier's tile, for the few who are one.
  api('/v1/supplier/me', { token })
    .then(({ supplier }) => {
      if (supplier?.state === 'contracted') $('apps').append(tile(SUPPLIER));
    })
    .catch(() => {});

  // What of theirs is going on: the meat still on its way.
  try {
    const { orders } = await api('/v1/idesh', { token });
    const going = orders.filter((o) => o.state !== 'DRAFT');
    if (going.length) {
      const PHOTO = (kind) => `/brand/meat/${['sheep', 'goat', 'beef', 'horse'].includes(kind) ? kind : 'sheep'}.webp`;
      $('live-list').replaceChildren(
        ...going.map((o) =>
          el(`<a class="h-row" href="/orders/${o.id}" data-order="${o.id}">
                <img src="${PHOTO(o.kind)}" alt="" loading="lazy" width="64" height="48">
                <span><b>${esc(o.title)} × ${o.qty}</b><small>№${esc(o.code)} · ${esc(o.supplier.name)} · ${IDESH_HEADLINE[o.state]?.[1] ?? ''}</small></span>
                <span class="end"><span class="when">${o.state === 'CANCELLED' ? '—' : dayShort(o.receive_on)}</span><span class="s-pill">${IDESH_HEADLINE[o.state]?.[0] ?? o.state}</span></span>
              </a>`),
        ),
      );
      $('live').hidden = false;
    }
  } catch {
    // Nothing to show is not an error on a home page.
  }
}
</script>
</body>
</html>
