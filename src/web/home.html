<!doctype html>
<html lang="mn" data-theme="light" data-site>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Миний Basu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/site.css">
<style>
/* Home, on the website: the apps inside Basu as the tiles the phone shows —
   the same art, larger — and, for somebody signed in, what of theirs is
   going on right now. With nothing going on, it says what to do next. The
   phone's launcher is /app; this is the browser's. */

.h-apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:20px;margin:0;padding:0;list-style:none}
.h-apps li{display:flex}
.h-apps .h-app{flex:1}
.h-app{display:flex;flex-direction:column;align-items:center;gap:14px;padding:28px 16px 22px;border:1px solid var(--line);border-radius:22px;background:var(--surface);box-shadow:var(--shadow);color:inherit;text-decoration:none;text-align:center;-webkit-tap-highlight-color:transparent;transition:border-color var(--dur),transform 140ms var(--ease),box-shadow var(--dur)}
@media (hover:hover){.h-app:hover{border-color:var(--line-2);box-shadow:0 18px 36px -24px rgba(18,58,44,.28)}}
.h-app:active{transform:scale(.985)}
.h-app .tile{width:120px;height:120px;border-radius:28px;overflow:hidden;box-shadow:0 10px 24px -14px rgba(22,21,20,.45),0 0 0 1px rgba(22,21,20,.06)}
.h-app .tile img{width:100%;height:100%;object-fit:cover;display:block}
.h-app b{display:block;font-size:1.0625rem;font-weight:600}
.h-app small{display:block;margin-top:2px;font-size:.875rem;color:var(--ink-3)}
.h-app .s-pill{margin-top:2px}
@media (max-width:520px){.h-apps{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.h-app .tile{width:92px;height:92px;border-radius:22px}.h-app{padding:22px 10px 18px}}

.h-live{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.h-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;min-height:76px;padding:14px 18px;color:inherit;text-decoration:none}
.h-row + .h-row{border-top:1px solid var(--line)}
/* the list clips what is outside it (its round corners): the focus ring goes inside the row */
.h-row:focus-visible{outline-offset:-3px}
@media (hover:hover){a.h-row:hover{background:var(--surface-2)}}
a.h-row:active{background:var(--surface-2)}
.h-row img{width:64px;height:48px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.h-row b{display:block;font-weight:600;line-height:1.35}
.h-row small{display:block;margin-top:2px;font-size:.875rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-row small .mono{font-size:.8125rem;color:var(--ink-3)}
.h-row .end{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.h-when{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}
.h-when small{display:inline;margin:0 0 0 6px;font-family:var(--sans);font-size:.75rem;font-weight:500;color:var(--ink-3)}
@media (max-width:560px){
  .h-row{grid-template-columns:56px minmax(0,1fr);align-items:start}
  .h-row img{width:56px;height:44px}
  .h-row .end{grid-column:2;flex-direction:row-reverse;flex-wrap:wrap-reverse;justify-content:flex-end;align-items:center;gap:6px 10px}
}
/* While the orders come: two rows in the shape of the live list's, so the page has its shape at once. */
.h-wait .h-row{grid-template-columns:64px minmax(0,1fr) 96px}
.h-wait .s-skel:nth-child(1){height:48px;border-radius:10px}
.h-wait .s-skel:nth-child(2){height:38px;width:min(320px,90%)}
.h-wait .s-skel:nth-child(3){height:38px}
@media (max-width:560px){.h-wait .h-row{grid-template-columns:56px minmax(0,1fr)}.h-wait .s-skel:nth-child(1){height:44px}.h-wait .s-skel:nth-child(3){display:none}}
.h-next{margin-top:32px}
.h-hello{margin:0}
</style>
</head>
<body>
<header class="s-bar" data-static><div class="s-wrap"><a class="s-word" href="/">Basu</a><nav class="s-nav" aria-label="Цэс"><a href="/home" aria-current="page">Нүүр</a><a href="/shop">Зах</a><a href="/orders">Миний захиалга</a><a href="/dashboard">Бизнест</a></nav><div class="s-right"></div></div></header>
<main class="s-main">
  <div class="s-wrap">
    <section class="s-head"><h1 id="hi">Миний Basu</h1><p class="h-hello">Өнөөдөр юу хийх вэ?</p></section>
    <ul class="h-apps" id="apps" aria-label="Аппууд"></ul>
    <section id="live" hidden aria-labelledby="live-title">
      <div class="s-sec"><h2 id="live-title">Идэвхтэй захиалга</h2><a href="/orders">Бүх захиалга</a></div>
      <div class="h-live" id="live-list"></div>
    </section>
    <div class="h-next" id="home-next"></div>
  </div>
</main>

<script type="module">
import { api, store, dayShort, IDESH_STATE } from '/api.js';
import { mountFrame, esc, el, loginUrl, siteEmpty, howToBuy, statePill, refundPill, meatPhoto, stillGoing } from '/site.js';

// The header and the foot are drawn at once; who is signed in comes after — the tiles do not wait for it.
const framed = mountFrame('home');
const $ = (id) => document.getElementById(id);

/**
 * The apps, as the phone's launcher has them — the same art. On the website
 * each goes where a browser can use it: the market, the front page's word on
 * ordering ahead (the phone's for now), the supplier's own side.
 */
const TILES = [
  { id: 'idesh', name: 'Идэш', tag: 'өвлийн', href: '/shop', art: '/brand/idesh-tile.webp' },
  { id: 'dine', name: 'Хоол', tag: 'урьдчилсан', href: '/#dine', art: '/brand/food-tile.webp', soon: true },
];
const SUPPLIER = { id: 'supplier', name: 'Нийлүүлэгч', tag: 'миний зар', href: '/supplier', art: '/brand/supplier-tile.svg' };

const tile = (t) =>
  el(`<li><a class="h-app" href="${t.href}" data-app="${t.id}">
        <span class="tile"><img src="${t.art}" alt="" width="120" height="120"></span>
        <span><b>${t.name}</b><small>${t.tag}</small></span>
        ${t.soon ? '<span class="s-pill" data-tone="hi">Удахгүй вэбэд</span>' : ''}
      </a></li>`);
for (const t of TILES) $('apps').append(tile(t));

/** What comes after the tiles when nothing of theirs is going on: one next step, and how ordering goes. */
function nothingGoing(signedIn) {
  $('home-next').replaceChildren(
    signedIn
      ? siteEmpty({
          icon: 'orders',
          title: 'Идэвхтэй захиалга алга',
          text: 'Өвлийн идшээ захиалахад явц нь энд харагдана: төлсөн, бэлтгэж байна, бэлэн, хүлээлгэн өгсөн. Өмнөх захиалгууд «Миний захиалга»-д бий.',
          actions: [['Зар үзэх', '/shop', 'dark'], ['Миний захиалга', '/orders']],
          card: true,
        })
      : siteEmpty({
          icon: 'person',
          title: 'Нэвтэрвэл захиалгаа эндээс хянана',
          text: 'Зар үзэхэд нэвтрэх шаардлагагүй. Захиалга төлөх үед л нэвтэрнэ.',
          actions: [['Зар үзэх', '/shop', 'dark'], ['Нэвтрэх', loginUrl('/home')]],
          card: true,
        }),
    howToBuy(),
  );
}

const token = store.guestToken;
if (token) {
  // Somebody signed in has orders on the way, or the first step: either way the place holds its shape until they come.
  $('home-next').replaceChildren(
    el(`<div class="h-live h-wait" role="status" aria-busy="true" aria-label="Захиалга ачаалж байна">${'<div class="h-row" aria-hidden="true"><span class="s-skel"></span><span class="s-skel"></span><span class="s-skel"></span></div>'.repeat(2)}</div>`),
  );
}
// Asked beside who it is, not after: the orders do not wait for the name either.
const asked = token ? stillGoing() : null;
const person = await framed;
if (person?.display_name) $('hi').textContent = `Сайн байна уу, ${person.display_name}`;

if (!token || !person) {
  nothingGoing(false);
} else {
  // The supplier's tile, for the few who are one.
  api('/v1/supplier/me', { token })
    .then(({ supplier }) => {
      if (supplier?.state === 'contracted') $('apps').append(tile(SUPPLIER));
    })
    .catch(() => {});

  // What of theirs is going on — what «Миний захиалга» calls «Идэвхтэй»: the meat paid for and not yet in
  // their hands, and a cancelled order whose money is still on its way back, saying what it waits for.
  // Handed over, and refunded, are done; they are on «Миний захиалга» under «Дууссан».
  const going = await asked;
  if (going.length) {
    // The day in the corner says what it is the day of.
    const dayWord = (o) => (o.receive === 'delivery' ? 'хүргэх' : 'авах');
    $('live-list').replaceChildren(
      ...going.map((o) =>
        el(`<a class="h-row" href="/orders/${o.id}" data-order="${o.id}">
              <img src="${meatPhoto(o.kind)}" alt="" loading="lazy" width="64" height="48">
              <span><b>${esc(o.title)} × ${o.qty}</b><small><span class="mono">№${esc(o.code)}</span> · ${esc(o.supplier.name)}</small></span>
              <span class="end"><span class="h-when">${dayShort(o.receive_on)}<small>${dayWord(o)}</small></span>${o.refund ? refundPill(o.refund) : statePill(o.state, IDESH_STATE[o.state] ?? o.state)}</span>
            </a>`),
      ),
    );
    $('home-next').replaceChildren();
    $('live').hidden = false;
  } else {
    // Nothing going on — or nothing could be asked: not an error on a home page; the next step still is.
    nothingGoing(true);
  }
}
</script>
</body>
</html>
