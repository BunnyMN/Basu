<!doctype html>
<html lang="mn" data-site>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100D0C">
<title>Миний Basu</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/site.css">
<style>
/* Home, on the website, «Тансаг хар»: the apps inside Basu as the phone's
   launcher has them — the same art, unchanged, set in dark porcelain squares
   on raised tiles, Идэш the big one — and, for somebody signed in, what of
   theirs is going on right now: a row each, its state in one word with the
   four bars under it, the day in the display with a gold word for what the
   day is. With nothing going on, one line and one button. The phone's
   launcher is /app; this is the browser's. */

/* a row of tiles whatever their number: Идэш twice as wide as the others */
.h-apps{display:flex;gap:16px;margin:0;padding:0;list-style:none}
.h-apps li{display:flex;flex:1 1 0;min-width:0}
.h-apps li:first-child{flex-grow:2}
.h-apps .h-app{flex:1}
.h-app{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:220px;padding:24px;border:1px solid rgba(255,244,236,.06);border-radius:28px;background:linear-gradient(160deg,#2A2321 0%,#1D1817 60%);box-shadow:var(--shadow-1);color:var(--ink);text-decoration:none;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:border-color var(--dur),transform 140ms var(--ease)}
@media (hover:hover){.h-app:hover{border-color:var(--line-2)}}
.h-app:active{transform:scale(.985)}
.h-app .tile{position:absolute;left:24px;top:24px;width:72px;height:72px;border-radius:18px;overflow:hidden;box-shadow:0 14px 28px -12px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06)}
.h-app .tile img{width:100%;height:100%;object-fit:cover;display:block}
.h-app b{display:block;font-family:var(--display);font-size:2.25rem;font-weight:800;line-height:.9}
.h-app small{display:block;margin-top:10px;font-size:.9375rem;font-weight:600;color:var(--ink-2)}
.h-app .arrow{position:absolute;right:20px;top:20px;width:20px;height:20px;color:var(--ink-3)}
/* Идэш, the season's, is the big tile: its art large on the right, its name in the display */
.h-app[data-app="idesh"] .tile{left:auto;right:28px;top:50%;width:132px;height:132px;margin-top:-66px;border-radius:30px}
.h-app[data-app="idesh"] b{font-size:4rem;line-height:.86}
.h-app[data-app="idesh"] .over{position:absolute;left:24px;top:26px;font-size:.6875rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.h-app[data-app="idesh"] .arrow{display:none}
@media (max-width:900px){.h-apps{flex-wrap:wrap;gap:12px}.h-apps li{flex-basis:calc(50% - 6px)}.h-apps li:first-child{flex-basis:100%}}
@media (max-width:520px){
  .h-app{min-height:190px;padding:18px}
  .h-app .tile{left:18px;top:18px}
  .h-app b{font-size:1.75rem}
  .h-app small{margin-top:8px;font-size:.8125rem}
  .h-app[data-app="idesh"]{min-height:204px}
  .h-app[data-app="idesh"] .tile{width:112px;height:112px;margin-top:-56px;right:20px;border-radius:26px}
  .h-app[data-app="idesh"] b{font-size:3.5rem}
  .h-app[data-app="idesh"] small{max-width:150px}
}

/* what is going on: a row each, as the app's own order card */
.h-live{display:grid;gap:12px}
.h-row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:18px;align-items:stretch;padding:14px;border:1px solid var(--line);border-radius:22px;background:var(--surface);color:var(--ink);text-decoration:none;transition:border-color var(--dur)}
.h-row:focus-visible{outline-offset:2px}
@media (hover:hover){a.h-row:hover{border-color:var(--line-2)}}
a.h-row:active{background:var(--surface-2)}
.h-row img{width:72px;height:72px;border-radius:14px;object-fit:cover;background:var(--surface-2);align-self:center}
.h-row .mid{display:flex;flex-direction:column;justify-content:center;gap:4px;min-width:0}
.h-row b{display:block;font-size:1.0625rem;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-row .mid > small{display:block;font-size:.875rem;font-weight:500;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-row .code{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:600}
.h-row .stage{margin-top:6px;max-width:220px}
/* the day, large, and what it is the day of in a gold word: as the app's card says it */
.h-when{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:88px;padding-left:16px;border-left:1px solid var(--line);font-family:var(--display);font-size:2rem;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums;color:var(--ink)}
.h-when small{display:block;font-family:var(--sans);font-size:.75rem;font-weight:800;line-height:1;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
@media (max-width:560px){
  .h-row{grid-template-columns:56px minmax(0,1fr) auto;gap:12px;padding:12px}
  .h-row img{width:56px;height:56px;border-radius:12px}
  .h-when{min-width:64px;padding-left:12px;font-size:1.625rem}
}
/* While the orders come: two rows in the shape of the live list's, so the page has its shape at once. */
.h-wait .h-row{grid-template-columns:72px minmax(0,1fr) 88px}
.h-wait .s-skel:nth-child(1){height:72px;border-radius:14px}
.h-wait .s-skel:nth-child(2){height:44px;align-self:center;width:min(320px,90%)}
.h-wait .s-skel:nth-child(3){height:56px;align-self:center}
@media (max-width:560px){.h-wait .h-row{grid-template-columns:56px minmax(0,1fr) 64px}.h-wait .s-skel:nth-child(1){height:56px}}
.h-next{margin-top:48px}
.h-hello{margin:0}
</style>
</head>
<body>
<header class="s-bar" data-static><div class="s-wrap"><a class="s-word" href="/">Basu</a><nav class="s-nav" aria-label="Цэс"><a href="/home" aria-current="page">Нүүр</a><a href="/shop">Идэш</a><a href="/orders">Миний захиалга</a><a href="/dashboard">Бизнес</a></nav><div class="s-right"></div></div></header>
<main class="s-main">
  <div class="s-wrap">
    <section class="s-head"><h1 id="hi">Миний Basu</h1><p class="h-hello">Өнөөдөр юу хийх вэ?</p></section>
    <ul class="h-apps" id="apps" aria-label="Аппууд"></ul>
    <section id="live" hidden aria-labelledby="live-title">
      <div class="s-sec"><h2 id="live-title">Идэвхтэй захиалга</h2><a href="/orders">Бүх захиалга</a></div>
      <div class="h-live" id="live-list"></div>
    </section>
    <div class="h-next" id="home-next"></div>
  </div>
</main>

<script type="module">
import { api, store, dayShort } from '/api.js';
import { mountFrame, esc, el, loginUrl, siteEmpty, howToBuy, statePill, refundPill, meatPhoto, stillGoing } from '/site.js';

// The header and the foot are drawn at once; who is signed in comes after — the tiles do not wait for it.
const framed = mountFrame('home');
const $ = (id) => document.getElementById(id);

/**
 * The apps, as the phone's launcher has them — the same art. On the website
 * each goes where a browser can use it: the market, the front page's word on
 * ordering ahead (the phone's for now), the supplier's own side.
 */
const TILES = [
  { id: 'idesh', name: 'Идэш', tag: 'Бүтэн мал, кг-аар мах', href: '/shop', art: '/brand/idesh-tile.webp', over: 'Энэ улирал' },
  // Lunch is ordered in the iPhone app: its tile goes to the App Store, and says so.
  { id: 'dine', name: 'Хоол', tag: 'iPhone апп-д', href: 'https://apps.apple.com/app/id6810541939', art: '/brand/food-tile.webp' },
];
const SUPPLIER = { id: 'supplier', name: 'Нийлүүлэгч', tag: 'Зараа удирдах', href: '/supplier', art: '/brand/supplier-tile.svg' };
const ARROW = '<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const tile = (t) =>
  el(`<li><a class="h-app" href="${t.href}" data-app="${t.id}">
        ${t.over ? `<span class="over">${t.over}</span>` : ''}
        <span class="tile"><img src="${t.art}" alt="" width="132" height="132"></span>${ARROW}
        <span><b>${t.name}</b><small>${t.tag}</small></span>
      </a></li>`);
for (const t of TILES) $('apps').append(tile(t));

/** What comes after the tiles when nothing of theirs is going on: one next step, and how ordering goes. */
function nothingGoing(signedIn) {
  $('home-next').replaceChildren(
    signedIn
      ? siteEmpty({
          icon: 'orders',
          title: 'Идэвхтэй захиалга алга',
          text: 'Захиалсан идэш тань энд явцтайгаа харагдана.',
          actions: [['Зар үзэх', '/shop', 'dark']],
          card: true,
        })
      : siteEmpty({
          icon: 'person',
          title: 'Захиалгаа эндээс хянана',
          text: 'Зар үзэхэд нэвтрэх шаардлагагүй.',
          actions: [['Нэвтрэх', loginUrl('/home'), 'dark']],
          card: true,
        }),
    howToBuy(),
  );
}

const token = store.guestToken;
if (token) {
  // Somebody signed in has orders on the way, or the first step: either way the place holds its shape until they come.
  $('home-next').replaceChildren(
    el(`<div class="h-live h-wait" role="status" aria-busy="true" aria-label="Захиалга ачаалж байна">${'<div class="h-row" aria-hidden="true"><span class="s-skel"></span><span class="s-skel"></span><span class="s-skel"></span></div>'.repeat(2)}</div>`),
  );
}
// Asked beside who it is, not after: the orders do not wait for the name either.
const asked = token ? stillGoing() : null;
const person = await framed;
if (person?.display_name) $('hi').textContent = `Сайн байна уу, ${person.display_name}`;

if (!token || !person) {
  nothingGoing(false);
} else {
  // The supplier's tile, for the few who are one.
  api('/v1/supplier/me', { token })
    .then(({ supplier }) => {
      if (supplier?.state === 'contracted') $('apps').append(tile(SUPPLIER));
    })
    .catch(() => {});

  // What of theirs is going on — what «Миний захиалга» calls «Идэвхтэй»: the meat paid for and not yet in
  // their hands, and a cancelled order whose money is still on its way back, saying what it waits for.
  // Handed over, and refunded, are done; they are on «Миний захиалга» under «Дууссан».
  const going = await asked;
  if (going.length) {
    // The day in the corner says what it is the day of.
    const dayWord = (o) => (o.receive === 'delivery' ? 'хүргэх' : 'авах');
    $('live-list').replaceChildren(
      ...going.map((o) =>
        el(`<a class="h-row" href="/orders/${o.id}" data-order="${o.id}">
              <img src="${meatPhoto(o.kind)}" alt="" loading="lazy" width="72" height="72">
              <span class="mid"><b>${esc(o.title)} × ${o.qty}</b><small><span class="code">№${esc(o.code)}</span> · ${esc(o.supplier.name)}</small>${o.refund ? refundPill(o.refund) : statePill(o.state)}</span>
              <span class="h-when">${dayShort(o.receive_on)}<small>${dayWord(o)}</small></span>
            </a>`),
      ),
    );
    $('home-next').replaceChildren();
    $('live').hidden = false;
  } else {
    // Nothing going on — or nothing could be asked: not an error on a home page; the next step still is.
    nothingGoing(true);
  }
}
</script>
</body>
</html>
