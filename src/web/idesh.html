<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#E9EBEC">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1315">
<title>Basu — өвлийн идэш</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.css">
<link rel="stylesheet" href="/app.css">
<style>
/* A list, not a map: the question here is "which animal, from whom, at what
   price", and that is answered by reading down, not by looking around.
   Everything after a tap is a full screen that slides in from the right, the
   way a phone does it — one question per step, a bar on top that says where
   back goes, and the price pinned to the bottom.

   Layout only. Colour, type, radius, buttons, chips, rows, fields and cards
   all come from app.css; this sheet says where things sit. */

/* ── the list ────────────────────────────────────────────────────── */
.home{
  display:inline-flex;align-items:center;gap:2px;min-height:var(--target);margin-left:-4px;padding:0 8px 0 4px;
  color:var(--accent-ink);font-size:var(--t-body-lg);font-weight:500;text-decoration:none;
}
.home svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{padding-top:0;margin-bottom:20px}
.top .sub{margin-bottom:0}

/* the three promises: one card, hairline rows; three columns on a wide screen */
.trust{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;padding:0;margin:0 0 24px;overflow:hidden;background:var(--line)}
.trust div{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:12px;align-items:start;padding:12px 16px;background:var(--surface)}
.trust svg{width:20px;height:20px;grid-row:1 / span 2;margin-top:1px;fill:none;stroke:var(--ink-3);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.trust b{font-size:var(--t-row);font-weight:600;line-height:var(--lh-snug)}
.trust span{font-size:var(--t-cap);line-height:1.4;color:var(--ink-2);margin-top:2px}
@media (min-width:640px){.trust{grid-template-columns:repeat(3,minmax(0,1fr))}}

/* ── what of mine is running ─────────────────────────────────────── */
.mine{margin:0 0 24px}
.mine:not([data-any]){display:none}
.mine .sec{margin:0 0 8px}

/* ── the filter and the stalls ───────────────────────────────────── */
/* «14 зар · 4 гэрээт нийлүүлэгч» is a sentence, not a section eyebrow: sans, 13, ink-2 */
.market > .section-label{min-height:0;margin:0 0 10px}
.market .tally{font-family:var(--sans);font-size:var(--t-cap);line-height:1.4;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.kinds{margin:0 0 12px}
/* the pill stays 36px to look at; the thumb gets the full 44px (4.5) */
.kinds > button{position:relative}
.kinds > button::after{content:"";position:absolute;inset:-4px -3px}
.listings{margin:0}
/* three rows of the shape that is coming, until the stalls arrive */
.listings .skel-row{align-items:flex-start;padding:14px 16px}
.listings .skel-row > .skel:first-child{width:64px;height:64px}
.listings .skel-row .skel-lines{gap:8px;padding-top:4px}
.listings .skel-row .skel-lines .skel:nth-child(3){width:30%;height:10px}
.listings[aria-busy="true"] .skel-row > .skel:last-child{align-self:flex-end}
.listing .art{
  width:64px;height:64px;flex:none;display:grid;place-items:center;overflow:hidden;
  border-radius:var(--r-sm);background:var(--surface-2);color:var(--ink-3);
}
.listing .art img{width:100%;height:100%;object-fit:cover;display:block}
.listing .art svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.listing .who{display:flex;flex-direction:column;gap:3px;min-width:0}
.listing .from{display:block;font-size:var(--t-cap);line-height:1.4;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verified{font-style:normal}
/* Every stall here is under contract — the tally above the list says so once
   (5.5); the row keeps its mark in the DOM and not on the screen. */
.listing .from .verified{display:none}
/* one meta line: place · day · delivery. The dot trails each item, so a
   wrapped run never starts a line with a lone «·». */
.bits{display:block;font-size:var(--t-pill);line-height:1.4;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bits span{white-space:nowrap}
.bits span:not(:last-child)::after{content:"·";margin:0 6px;color:var(--ink-3)}
.bits svg{display:none}
/* A stall's row is two lines: the picture and the words, then stock and
   price under both. On a phone the words' column is 220px and the price's
   caption alone is 150 of it, so the second line takes the whole width;
   from 640 up it sits under the words, in line with them. The chevron is
   centred on the whole row, not on its first line. */
[data-rows] > li > .listing{flex-wrap:wrap;row-gap:8px;position:relative;padding-right:44px}
.listing[data-chev]::after{position:absolute;right:16px;top:50%;margin-top:-8px}
.listing .row{flex:0 0 100%;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0}
.listing .left{flex:none}
.listing .price{flex:1 1 auto;min-width:0;margin-left:auto;text-align:right}
@media (min-width:640px){.listing .row{flex-basis:calc(100% - 76px);margin-left:76px}}
.listing .price b{display:block;font-weight:600;line-height:1.2}
.listing .price .money{font-size:var(--t-title-3)}
.listing .price small{display:block;font-size:var(--t-cap);color:var(--ink-2);margin-top:2px;white-space:normal}
.listing[data-gone] .title{color:var(--ink-2)}
.listing[data-gone] .money{color:var(--ink-3)}
.listing[data-gone] .art img{filter:grayscale(1)}

/* two columns on a desk: the promises and my orders stay put, the stalls scroll */
@media (min-width:900px){
  .wrap{max-width:960px;display:grid;grid-template-columns:minmax(280px,5fr) minmax(0,7fr);column-gap:32px;align-items:start}
  /* pinned only while it is short: a column of thirteen orders scrolls with the page instead */
  .intro:has(.mine:not([data-any])){position:sticky;top:24px}
  .market{padding-top:44px}
  .trust{grid-template-columns:minmax(0,1fr)}
}

/* ── the screen ──────────────────────────────────────────────────── */
/* Full screen, not a sheet. A sheet says "a moment"; buying a winter's meat
   is not a moment, and somebody new to apps needs the whole screen to say
   one thing at a time. It slides in from the right and the bar on top says
   where back goes, which is what the phone taught them. */
.screen{
  position:fixed;inset:0;z-index:var(--z-sheet);display:flex;flex-direction:column;
  background:var(--bg);background-image:var(--ground);background-repeat:no-repeat;background-size:100% 100%;
  transform:translateX(100%);visibility:hidden;
  transition:transform var(--dur-sheet) var(--ease),visibility 0s linear var(--dur-sheet);
}
.screen[data-open]{transform:none;visibility:visible;transition:transform var(--dur-sheet) var(--ease)}
@media (min-width:640px){
  .screen{
    left:50%;right:auto;width:560px;border-left:1px solid var(--line);border-right:1px solid var(--line);
    transform:translate(-50%,0) translateX(120%);
  }
  .screen[data-open]{transform:translate(-50%,0);box-shadow:0 0 0 100vmax var(--scrim)}
}
/* the title sits on the screen's centre line while it fits and takes the
   room to the right when it does not; the side columns can never shrink
   under «‹ Буцах», so a long sub line is cut, never run under the button */
.screen .topbar{flex:none;grid-template-columns:minmax(max-content,1fr) minmax(0,auto) minmax(max-content,1fr)}
.bar .bar-title{padding:6px 0}
.screen-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:24px}
.screen-foot{
  flex:none;padding:12px var(--s-5) calc(12px + var(--safe-b));border-top:1px solid var(--line);
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
}
.screen-foot:empty{display:none}
.screen-foot .btn + .btn{margin-top:8px}
.foot-row{display:flex;align-items:center;gap:14px}
.foot-row .sum{flex:1;min-width:0}
.foot-row .sum b{display:block;line-height:1.1}
.foot-row .sum .money{font-size:var(--t-title-2)}
.foot-row .sum > span{display:block;font-size:var(--t-cap);color:var(--ink-2);margin-bottom:2px}
.foot-row .btn{flex:none;min-width:46%;min-height:var(--h-lg)}
.why{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:var(--t-cap);line-height:1.4;color:var(--ink-3)}
.why svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* the stall */
.hero{height:220px;background:var(--surface-2);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.head{padding:20px var(--s-5) 0}
.head .from{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:var(--t-body-lg);color:var(--ink-2)}
.head .bits{margin-top:6px;font-size:var(--t-cap)}
.about{margin:12px var(--s-5) 0;font-size:var(--t-body-lg);line-height:var(--lh-body);color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin:16px var(--s-5) 0;padding:0;overflow:hidden;background:var(--line)}
.facts div{background:var(--surface);padding:12px 16px}
.facts .lab{display:block;margin-bottom:6px}
.facts b{display:block;font-size:var(--t-body-lg);font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.facts b small{font-size:var(--t-cap);font-weight:400;color:var(--ink-2)}
.note{margin:16px var(--s-5) 0}

/* one question per step, numbered, hairline between them */
.step{margin:24px var(--s-5) 0;padding-top:20px;border-top:1px solid var(--line)}
.step .q{margin:0 0 12px}
.step .help{font-size:var(--t-cap);line-height:1.4;color:var(--ink-3);margin-top:10px}
.step .help b{color:var(--ink-2);font-weight:500}
.step > .input{margin-top:4px}
.step .field:last-child{margin-bottom:0}
.field .opt{font-weight:400;color:var(--ink-3)}

.qty{display:flex;align-items:center;gap:12px}
.qty output{flex:1;text-align:center;font-size:var(--t-title-2);font-weight:600;line-height:1.1;color:var(--ink)}
.qty output small{display:block;font-size:var(--t-cap);font-weight:400;color:var(--ink-3);margin-top:3px}
.sumline{margin-top:10px;text-align:center;font-size:var(--t-cap);color:var(--ink-2)}

.choice{
  display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:12px 0;margin:0;
  border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-align:left;
}
.choice:first-of-type{border-top:0;padding-top:4px}
.choice .dot{
  width:20px;height:20px;margin:0;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);
  display:grid;place-items:center;transition:background var(--dur),border-color var(--dur);
}
.choice .dot svg{display:none}
.choice .txt{flex:1;min-width:0}
.choice .txt b{display:block;font-size:var(--t-row);font-weight:600;line-height:var(--lh-snug)}
.choice .txt small{display:block;font-size:var(--t-cap);color:var(--ink-2);margin-top:2px;line-height:1.4}
.choice .tag{flex:none;font-size:var(--t-body-lg);font-weight:500;color:var(--ink-2)}
.choice[aria-checked="true"] .dot{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}
.choice[disabled]{cursor:not-allowed}
.choice[disabled] .txt b,.choice[disabled] .tag{color:var(--ink-3)}
.choice[disabled] .dot{background:var(--surface-2)}

.mapbox{position:relative;height:190px;margin-top:4px;border:1px solid var(--line-2);border-radius:var(--r-ctl);overflow:hidden;background:var(--surface-2)}
/* until mapStyle.js has a dark palette, the light tiles are dimmed under a dark theme (3.4) */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mapbox::after{content:"";position:absolute;inset:0;z-index:1;background:var(--bg);opacity:.35;pointer-events:none}}
:root[data-theme="dark"] .mapbox::after{content:"";position:absolute;inset:0;z-index:1;background:var(--bg);opacity:.35;pointer-events:none}
.mapbox .tip{
  position:absolute;left:10px;bottom:10px;z-index:2;padding:5px 10px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:var(--t-cap);color:var(--ink-2);
}

/* ── the review ──────────────────────────────────────────────────── */
.review{margin:16px var(--s-5) 0;overflow:hidden}
.review + .review{margin-top:12px}
.review .r{display:flex;justify-content:space-between;gap:14px;padding:12px 16px;border-top:1px solid var(--line);font-size:var(--t-body-lg);line-height:1.4}
.review .r:first-child{border-top:0}
.review .r > span{flex:none;color:var(--ink-2)}
.review .r b{font-weight:500;text-align:right;min-width:0;overflow-wrap:break-word}
.review .r b small{display:block;font-weight:400;font-size:var(--t-cap);color:var(--ink-2);margin-top:2px}
.review .r.total{background:var(--surface-2)}
.review .r.total > span{color:var(--ink);font-weight:500}
.review .r.total .money{font-size:var(--t-title-2)}
.promise{margin:20px var(--s-5) 0;display:flex;flex-direction:column;gap:10px}
.promise div{display:flex;gap:10px;align-items:flex-start;font-size:var(--t-body);line-height:1.5;color:var(--ink-2)}
.promise svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--ink-3);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.promise b{color:var(--ink)}
.terms{margin:16px var(--s-5) 0;font-size:var(--t-cap);color:var(--ink-3);text-align:center}
.terms a{font-weight:500}

/* ── the order, after paying: one calm page that says what happens next ── */
.status{margin:16px var(--s-5) 0;padding:24px 20px 20px;text-align:center}
.status .mark{width:48px;height:48px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--ready-soft);color:var(--ready)}
.status .mark svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.status[data-s="PAID"] .mark,.status[data-s="DISPATCHED"] .mark{background:var(--route-soft);color:var(--route)}
.status[data-s="PREPARING"] .mark{background:var(--accent-soft);color:var(--accent-ink)}
/* a finished negative outcome is not an alarm: neutral, not red */
.status[data-s="CLOSED"] .mark,.status[data-s="CANCELLED"] .mark,.status[data-s="REFUNDED"] .mark{background:var(--surface-2);color:var(--ink-3)}
.status .big{font-size:var(--t-headline);font-weight:600;line-height:var(--lh-tight);letter-spacing:-.015em;text-wrap:balance}
.status .cap{font-size:var(--t-body);color:var(--ink-2);margin:8px auto 0;line-height:var(--lh-body);max-width:32ch}
.status .cap b{color:var(--ink)}
.timeline{margin:20px 0 0}
.handcode{margin:12px var(--s-5) 0}
/* «Хүргэгчид энэ кодыг хэлнэ» is four words: a caption, not an eyebrow (5.8) */
.handcode .lab{font-family:var(--sans);font-size:var(--t-cap);font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-2)}
/* the three fact panels read as one card: joined edges, a hairline between */
.panel{margin:12px var(--s-5) 0;overflow:hidden}
.panel + .panel{margin-top:0;border-top:0;border-top-left-radius:0;border-top-right-radius:0}
.panel:has(+ .panel){border-bottom-left-radius:0;border-bottom-right-radius:0}
.panel + .panel > .line:first-child{border-top:1px solid var(--line)}
.panel .line{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:12px;align-items:start;padding:14px 16px;border-top:1px solid var(--line)}
.panel .line:first-child{border-top:0}
.panel .line > svg{width:20px;height:20px;margin-top:1px;fill:none;stroke:var(--ink-3);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.panel .lab{display:block;margin-bottom:6px}
.panel .v{font-size:var(--t-body-lg);font-weight:500;line-height:1.4;color:var(--ink);min-width:0;overflow-wrap:break-word}
.panel .v small{display:block;font-weight:400;font-size:var(--t-cap);color:var(--ink-2);margin-top:4px;line-height:1.4}
.panel .v .badge{margin-left:6px}
.panel .v a.tel{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-weight:500;vertical-align:baseline}
.panel .v a.tel svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#refund .field{margin:12px 0 0;font-weight:400}
#refund .why{margin:12px 0 0}
#refund .btn{margin-top:12px}
.assure{display:none}
</style>
</head>
<body>

<main class="wrap" id="list">
  <div class="intro">
  <a class="home" href="/app" id="home" aria-label="Basu нүүр"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Basu</a>
  <div class="top page-head" data-large>
    <h1>Өвлийн идэш</h1>
    <p class="sub">Гэрээт малчин, махны газраас. Үнэ нь зар дээр бичсэнээрээ эцсийнх.</p>
  </div>

  <!-- The three things a buyer is trusting. All three are true by
       construction: contract, fixed price, a supplier they can ring. -->
  <div class="trust card" aria-label="Баталгаа">
    <div>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
      <b>Гэрээт нийлүүлэгч</b>
      <span>Basu шалгаж, гэрээ байгуулсан</span>
    </div>
    <div>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12l-8 8-8-8V4h8l8 8z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg>
      <b>Үнэ эцсийнх</b>
      <span>Зар дээр бичсэнээс өөрчлөгдөхгүй</span>
    </div>
    <div>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 12l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"/></svg>
      <b>Утсаар холбоотой</b>
      <span>Төлсний дараа нийлүүлэгчийн утас гарна</span>
    </div>
  </div>

  <section class="mine" id="mine">
    <h2 class="sec section-label">Миний идэш</h2>
    <div id="mine-list" data-rows></div>
  </section>
  </div>

  <div class="market">
  <div class="section-label"><span class="n tally" id="tally"></span></div>
  <div class="kinds filter" id="kinds" role="group" aria-label="Малын төрөл"></div>
  <ul class="listings" id="listings" data-rows aria-busy="true">
    <li><span class="skel-row" aria-hidden="true"><span class="skel"></span><span class="skel-lines"><span class="skel"></span><span class="skel"></span><span class="skel"></span></span><span class="skel"></span></span></li>
    <li><span class="skel-row" aria-hidden="true"><span class="skel"></span><span class="skel-lines"><span class="skel"></span><span class="skel"></span><span class="skel"></span></span><span class="skel"></span></span></li>
    <li><span class="skel-row" aria-hidden="true"><span class="skel"></span><span class="skel-lines"><span class="skel"></span><span class="skel"></span><span class="skel"></span></span><span class="skel"></span></span></li>
  </ul>
  </div>
</main>

<section class="screen" id="screen" aria-label="Зар">
  <header class="bar topbar">
    <button class="back" type="button" id="screen-back" aria-label="Буцах">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Буцах
    </button>
    <div class="bar-title title"><b id="screen-title">—</b><span id="screen-sub"></span></div>
    <span class="act"></span>
  </header>
  <div class="screen-body" id="screen-body"></div>
  <footer class="screen-foot" id="screen-foot"></footer>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.js"></script>
<script type="module">
import { api, store, shell, toast, mnt, money, IDESH_HEADLINE, KIND, dayLabel, dayShort, signInSheet } from '/api.js';
import { mapStyle, ULAANBAATAR } from '/mapStyle.js';

const $ = (id) => document.getElementById(id);
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};

/** Guest text goes into the DOM as text, never as markup. */
function escapeHtml(value) {
  const node = document.createElement('span');
  node.textContent = value ?? '';
  return node.innerHTML;
}

/**
 * A photograph of the cut, per kind of animal — Basu's own four, served from
 * /idesh/<kind>.jpg. Not a supplier's picture: uploads, storage and
 * moderation are a second release. Below it, one drawing per kind in the
 * launcher's stroke, which is what shows if a picture fails to arrive — a
 * list with holes in it sells nothing.
 */
const PHOTO = (kind) => `/idesh/${kind}.jpg`;

const ART = {
  sheep: `<svg viewBox="0 0 24 24" aria-hidden="true">

const state = {
  today: null,
  listings: [],
  kind: 'all',
  listing: null,
  /** The form the guest is filling in. */
  form: null,
  mine: [],
  orderId: null,
  map: null,
  /** Which screen is up: null, 'detail', 'review' or 'status'. */
  screen: null,
};

/**
 * The page is on its way out. A request already in flight still lands after
 * `pagehide`, and drawing its answer into a document that is being torn down
 * is an error in a test and wasted work in a browser — so every path that
 * awaits the server and then touches the page checks this first.
 */
let gone = false;

/* ── signing in ──────────────────────────────────────────────────── */

async function signIn() {
  // Inside the phone app the sheet is the shell's, and so is the token.
  if (shell.present) return shell.signIn();
  // A developer's machine answers this; the real server does not have it.
  try {
    const { token } = await api('/dev/login', { method: 'POST', body: {} });
    store.guestToken = token;
    return token;
  } catch (error) {
    if (error.status !== 404) throw error;
  }
  return signInSheet();
}

/** Every call that needs a guest. A dead token means sign in again — once. */
async function guestApi(path, options = {}) {
  const token = store.guestToken ?? (await signIn());
  try {
    return await api(path, { ...options, token });
  } catch (error) {
    if (error.status !== 401) throw error;
    store.guestToken = null;
    return api(path, { ...options, token: await signIn() });
  }
}

/* ── the stalls ──────────────────────────────────────────────────── */

async function loadListings() {
  const { today, listings } = await api('/v1/idesh/listings');
  if (gone) return;
  state.today = today;
  state.listings = listings;
  paintKinds();
  paintListings();
}

function paintKinds() {
  const box = $('kinds');
  box.replaceChildren();
  const present = new Set(state.listings.map((l) => l.kind));
  const options = [['all', 'Бүгд'], ...Object.entries(KIND).filter(([k]) => present.has(k))];
  for (const [key, label] of options) {
    const button = el(
      `<button type="button" aria-pressed="${state.kind === key}" data-kind="${key}">${label}</button>`,
    );
    button.addEventListener('click', () => {
      state.kind = key;
      paintKinds();
      paintListings();
    });
    box.append(button);
  }
}

const unitWord = (l) => (l.unit === 'whole' ? 'толгой' : 'кг');

/** «бүтэн · ~38 кг» / «1 кг · доод тал нь 20 кг» — what the price is for. */
function priceFor(l) {
  return l.unit === 'whole' ? `бүтэн · ~${l.approx_kg} кг` : `1 кг · доод тал нь ${l.min_qty} кг`;
}

/** «Улаанбаатар · 9-р сарын 20-нөөс · Хүргэлттэй» — one run, no whitespace between the items so the dots space evenly. */
function bits(l, day) {
  return [
    `<span>${MARK.pin}${escapeHtml(l.origin)}</span>`,
    `<span>${MARK.day}${day}</span>`,
    l.delivers ? `<span>${MARK.truck}Хүргэлттэй</span>` : '',
  ].join('');
}

function paintListings() {
  const list = $('listings');
  list.replaceChildren();
  list.removeAttribute('aria-busy');
  const shown = state.listings.filter((l) => state.kind === 'all' || l.kind === state.kind);

  const suppliers = new Set(state.listings.map((l) => l.supplier.id)).size;
  $('tally').textContent = state.listings.length
    ? `${state.listings.length} зар · ${suppliers} гэрээт нийлүүлэгч`
    : '';

  if (!shown.length) {
    list.append(
      el(`<li class="empty">Одоогоор зар алга.<br>Өвлийн идэшний зар 10–11-р сард гарна.</li>`),
    );
    return;
  }
  for (const l of shown) {
    const gone_ = l.remaining === 0;
    // Three left of twenty is worth saying louder than seventeen of twenty.
    const low = !gone_ && l.remaining <= Math.max(2, Math.ceil(l.quantity * 0.15));
    const item = el(`
      <li>
        <button class="listing row" type="button" data-kind="${l.kind}" data-id="${l.id}"${gone_ ? ' data-gone' : ''} data-chev>
          <span class="art lead"><img src="${PHOTO(l.kind)}" alt="" loading="lazy" width="64" height="64"></span>
          <span class="who main">
            <span class="name title">${escapeHtml(l.title)}</span>
            <span class="from">${
              l.supplier.contracted ? `<i class="verified badge">${MARK.check}Гэрээт</i>` : ''
            }${escapeHtml(l.supplier.name)}</span>
            <span class="bits">${bits(l, `${dayLabel(l.ready_from)}-нөөс`)}</span>
          </span>
          <span class="row">
            <span class="left chip"${gone_ ? ' data-gone' : low ? ' data-low data-tone="hold" data-strong' : ''}>${
              gone_ ? 'Дууссан' : `${l.remaining} ${unitWord(l)} үлдсэн`
            }</span>
            <span class="price"><b>${money(l.price_mnt)}</b><small>${priceFor(l)}</small></span>
          </span>
        </button>
      </li>`);
    item.querySelector('button').addEventListener('click', () => openListing(l));
    // The picture did not come: the drawn mark stands in, and the row stays whole.
    const picture = item.querySelector('.art img');
    picture.addEventListener('error', () => {
      picture.parentElement.innerHTML = ART[l.kind] ?? '';
    });
    list.append(item);
  }
}

/* ── the screen ──────────────────────────────────────────────────── */

/**
 * One screen, three faces: the stall with its form, the review, the status.
 * Each face is a history entry, so the phone's own back — and the bar's
 * «Буцах» — walk out the way the person walked in.
 */
function showScreen(name, title, sub, { replace = false } = {}) {
  $('screen-title').textContent = title;
  // An order number is a number: mono only when the title is one.
  $('screen-title').classList.toggle('mono', /^№\d{4}$/.test(title));
  $('screen-sub').textContent = sub;
  $('screen-body').replaceChildren();
  $('screen-foot').replaceChildren();
  $('screen-body').scrollTop = 0;
  const first = state.screen === null;
  state.screen = name;
  $('screen').dataset.open = '1';
  document.body.style.overflow = 'hidden';
  if (replace && !first) history.replaceState({ screen: name }, '');
  else history.pushState({ screen: name }, '');
}

function closeScreen() {
  $('screen').removeAttribute('data-open');
  document.body.style.overflow = '';
  state.screen = null;
  state.listing = null;
  state.form = null;
  state.orderId = null;
  dropMap();
  const url = new URL(location.href);
  if (url.searchParams.has('order')) {
    url.searchParams.delete('order');
    history.replaceState(null, '', url);
  }
}

function dropMap() {
  if (state.map) {
    state.map.remove?.();
    state.map = null;
  }
}

/** «Буцах» is history: the face underneath, or the list. */
$('screen-back').addEventListener('click', () => history.back());

addEventListener('popstate', (event) => {
  const face = event.state?.screen ?? null;
  if (!face) {
    closeScreen();
    return;
  }
  // Walking back onto a face that is still meaningful redraws it in place.
  if (face === 'detail' && state.listing) renderDetail({ replace: true });
  else if (face === 'review' && state.listing) renderReview({ replace: true });
  else if (face === 'status' && state.orderId) void showStatus(true, { replace: true });
  else closeScreen();
});

/** The soonest day the guest may ask for: when the meat exists, and not the past. */
const earliest = (l) => (l.ready_from > state.today ? l.ready_from : state.today);

function openListing(l) {
  state.listing = l;
  state.orderId = null;
  state.form = {
    qty: l.min_qty,
    receive: 'pickup',
    receiveOn: earliest(l),
    address: '',
    phone: '',
    lat: null,
    lon: null,
  };
  renderDetail();
}

/** The same picture, larger, at the top of the screen. */
function hero(kind) {
  const box = el(`<div class="hero"><img src="${PHOTO(kind)}" alt="" width="560" height="220"></div>`);
  box.querySelector('img').addEventListener('error', () => box.remove());
  return box;
}

function total() {
  const l = state.listing;
  const f = state.form;
  return l.price_mnt * f.qty + (f.receive === 'delivery' ? l.delivery_fee_mnt : 0);
}

/** What still has to be answered before the order can be looked at. */
function missing() {
  const f = state.form;
  if (f.receive === 'delivery' && (!f.address.trim() || !f.phone.trim())) return 'Хаяг, залгах утсаа оруулна уу';
  if (!f.receiveOn) return 'Өдрөө сонгоно уу';
  return null;
}

/* ── the stall, and the four questions ───────────────────────────── */

function renderDetail({ replace = false } = {}) {
  const l = state.listing;
  const f = state.form;
  showScreen('detail', l.title, l.supplier.name, { replace });
  const body = $('screen-body');

  body.append(hero(l.kind));
  body.append(
    el(`<div class="head">
          <h2>${escapeHtml(l.title)}</h2>
          <div class="from">${l.supplier.contracted ? `<i class="verified badge">${MARK.check}Гэрээт нийлүүлэгч</i>` : ''}${escapeHtml(l.supplier.name)}</div>
          <div class="bits">${bits(l, `${dayLabel(l.ready_from)}-нөөс бэлэн`)}</div>
        </div>`),
  );
  if (l.note) body.append(el(`<div class="about">${escapeHtml(l.note)}</div>`));
  body.append(
    el(`<div class="facts card">
          <div><span class="lab">Үнэ</span><b>${money(l.price_mnt)}<small> / ${unitWord(l)}</small></b></div>
          <div><span class="lab">${l.unit === 'whole' ? 'Ойролцоо жин' : 'Доод захиалга'}</span><b class="mn">${
            l.unit === 'whole' ? `~${l.approx_kg} кг` : `${l.min_qty} кг`
          }</b></div>
          <div><span class="lab">Бэлэн болох</span><b>${dayLabel(l.ready_from)}</b></div>
          <div><span class="lab">Үлдсэн</span><b class="mn">${l.remaining} ${unitWord(l)}</b></div>
        </div>`),
  );

  if (l.remaining === 0) {
    body.append(el(`<div class="note callout"><b>Энэ зар дууссан</b><span>Нийлүүлэгч дахин нэмбэл энд гарна.</span></div>`));
    return;
  }

  /* 1 · how much */
  const step = l.unit === 'whole' ? 1 : 5;
  const qty = el(`
    <div class="step" id="step-qty">
      <div class="q section-title"><span class="n">1</span><b>${l.unit === 'whole' ? 'Хэдэн толгой авах вэ?' : 'Хэдэн кг авах вэ?'}</b></div>
      <div class="qty">
        <button class="btn" data-icon type="button" data-d="-1" aria-label="Хасах">${MARK.minus}</button>
        <output id="qty"><span class="mn">${f.qty}</span><small>${unitWord(l)}</small></output>
        <button class="btn" data-icon type="button" data-d="1" aria-label="Нэмэх">${MARK.plus}</button>
      </div>
      <div class="sumline" id="sumline"></div>
      <div class="help">${
        l.unit === 'whole'
          ? `Нэг толгой ойролцоогоор <b>${l.approx_kg} кг</b>. Хоёр айл нэг мал хувааж авч болно.`
          : `Доод тал нь <b>${l.min_qty} кг</b>. ${step} кг-аар нэмэгдэнэ.`
      }</div>
    </div>`);
  const paintQty = () => {
    qty.querySelector('#qty').innerHTML = `<span class="mn">${f.qty}</span><small>${unitWord(l)}</small>`;
    qty.querySelector('#sumline').innerHTML =
      `${f.qty} ${unitWord(l)} × ${money(l.price_mnt)} = ${money(l.price_mnt * f.qty)}`;
    qty.querySelector('[data-d="-1"]').disabled = f.qty <= l.min_qty;
    qty.querySelector('[data-d="1"]').disabled = f.qty >= l.remaining;
  };
  qty.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    f.qty = Math.min(l.remaining, Math.max(l.min_qty, f.qty + Number(button.dataset.d) * step));
    paintQty();
    renderFoot();
  });
  paintQty();
  body.append(qty);

  /* 2 · how to receive it */
  const pick = el(`
    <div class="step" id="step-receive">
      <div class="q section-title"><span class="n">2</span><b>Хэрхэн авах вэ?</b></div>
      <div role="radiogroup" aria-label="Хэрхэн авах">
        <button class="choice" type="button" role="radio" data-r="pickup" aria-checked="${f.receive === 'pickup'}">
          <span class="dot">${MARK.check}</span>
          <span class="txt"><b>Өөрөө очиж авна</b><small>${escapeHtml(l.supplier.pickup_address)}</small></span>
          <span class="tag">үнэгүй</span>
        </button>
        <button class="choice" type="button" role="radio" data-r="delivery" aria-checked="${f.receive === 'delivery'}"${l.delivers ? '' : ' disabled'}>
          <span class="dot">${MARK.check}</span>
          <span class="txt"><b>Гэрт хүргүүлнэ</b><small>${l.delivers ? 'Нийлүүлэгч таны хаяг руу хүргэнэ' : 'Энэ нийлүүлэгч хүргэлт хийдэггүй'}</small></span>
          <span class="tag">${l.delivers ? `+${money(l.delivery_fee_mnt)}` : ''}</span>
        </button>
      </div>
    </div>`);
  body.append(pick);

  /* 3 · when */
  const when = el(`
    <div class="step" id="step-when">
      <div class="q section-title"><span class="n">3</span><b></b></div>
      <input type="date" class="input" id="when" min="${earliest(l)}" value="${f.receiveOn}" aria-label="Өдөр">
      <div class="help">Хамгийн эрт <b>${dayLabel(earliest(l))}</b> — мах тэр өдрөөс бэлэн. Дараа нь нийлүүлэгч утсаар цагийг тохирно.</div>
    </div>`);
  when.querySelector('input').addEventListener('change', (event) => {
    f.receiveOn = event.target.value;
    renderFoot();
  });
  body.append(when);

  /**
   * Changing how the meat arrives changes the page in place — the check,
   * the third question's wording, the fourth question coming or going —
   * and nothing else moves. Redrawing the screen here threw the person back
   * to the top with the choice they had just made out of sight; scrolling
   * to the new question instead was a jump the other way. Nothing scrolls.
   */
  const settle = () => {
    for (const choice of pick.querySelectorAll('.choice')) {
      choice.setAttribute('aria-checked', String(choice.dataset.r === f.receive));
    }
    when.querySelector('.q b').textContent = f.receive === 'delivery' ? 'Хэзээ хүргүүлэх вэ?' : 'Хэзээ очиж авах вэ?';
    let where = body.querySelector('#step-where');
    if (f.receive === 'delivery' && !where) {
      where = whereStep(f);
      when.insertAdjacentElement('afterend', where);
      mountMap(where.querySelector('#mapbox'));
    } else if (f.receive !== 'delivery' && where) {
      dropMap();
      where.remove();
    }
    renderFoot();
  };
  pick.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button || button.disabled || button.dataset.r === f.receive) return;
    f.receive = button.dataset.r;
    settle();
  });
  settle();
}

/** 4 · where, for a delivery. Built only when asked for, dropped when not. */
function whereStep(f) {
  const where = el(`
    <div class="step" id="step-where">
      <div class="q section-title"><span class="n">4</span><b>Хаана хүргэх вэ?</b></div>
      <div class="field">
        <label for="address">Хаяг</label>
        <textarea id="address" placeholder="Дүүрэг, хороолол, байр, орц, тоот">${escapeHtml(f.address)}</textarea>
      </div>
      <div class="field">
        <label for="phone">Хүргэгчийн залгах утас</label>
        <input type="tel" id="phone" inputmode="tel" placeholder="+976 XXXX XXXX" value="${escapeHtml(f.phone)}">
      </div>
      <div class="field">
        <label>Газрын зураг дээр цэг <span class="opt">— заавал биш, хүргэгчид тусална</span></label>
        <div class="mapbox" id="mapbox"><span class="tip" id="maptip">Байшингаа дарж цэг тавина уу</span></div>
      </div>
    </div>`);
  where.querySelector('#address').addEventListener('input', (e) => {
    f.address = e.target.value;
    renderFoot();
  });
  where.querySelector('#phone').addEventListener('input', (e) => {
    f.phone = e.target.value;
    renderFoot();
  });
  return where;
}

/**
 * A small map for one pin. The address in words is what the courier reads;
 * the pin is what they navigate by, and it is the one thing a text field
 * cannot carry. Lazily built, because most orders are collected and a map
 * nobody asked for is the slowest thing on the page.
 */
/** A token's current value, for the one thing CSS cannot paint: the map. */
const tone = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

function mountMap(container) {
  dropMap();
  if (typeof maplibregl === 'undefined') return;
  const f = state.form;
  const map = new maplibregl.Map({
    container,
    style: mapStyle(),
    center: f.lon ? [f.lon, f.lat] : [ULAANBAATAR.lon, ULAANBAATAR.lat],
    zoom: 13.2,
    attributionControl: false,
  });
  state.map = map;
  const PIN = 'drop';
  map.on('load', () => {
    map.addSource(PIN, { type: 'geojson', data: pinData() });
    map.addLayer({
      id: 'drop-pin',
      type: 'circle',
      source: PIN,
      paint: { 'circle-radius': 8, 'circle-color': tone('--accent'), 'circle-stroke-color': tone('--surface'), 'circle-stroke-width': 2 },
    });
  });
  map.on('click', (event) => {
    f.lat = Number(event.lngLat.lat.toFixed(6));
    f.lon = Number(event.lngLat.lng.toFixed(6));
    map.getSource(PIN)?.setData(pinData());
    const tip = document.getElementById('maptip');
    if (tip) tip.textContent = 'Цэг тавигдлаа ✓';
  });
  function pinData() {
    return {
      type: 'FeatureCollection',
      features: f.lat
        ? [{ type: 'Feature', geometry: { type: 'Point', coordinates: [f.lon, f.lat] }, properties: {} }]
        : [],
    };
  }
}

/** The bottom of the stall screen: the total so far, and the way on. */
function renderFoot() {
  const l = state.listing;
  const f = state.form;
  const foot = $('screen-foot');
  foot.replaceChildren();
  if (!l || !f || l.remaining === 0 || state.screen !== 'detail') return;

  const needs = missing();
  if (needs) foot.append(el(`<p class="why">${MARK.warn}${needs}</p>`));
  const row = el(`
    <div class="foot-row">
      <div class="sum"><span>${f.qty} ${unitWord(l)}${f.receive === 'delivery' ? ' + хүргэлт' : ''} · нийт</span><b>${money(total())}</b></div>
      <button class="btn" data-v="primary" type="button" id="next"${needs ? ' disabled' : ''}>Үргэлжлүүлэх${MARK.next}</button>
    </div>`);
  row.querySelector('#next').addEventListener('click', () => renderReview());
  foot.append(row);
}

/* ── the review, before any money moves ──────────────────────────── */

function renderReview({ replace = false } = {}) {
  const l = state.listing;
  const f = state.form;
  showScreen('review', 'Захиалгаа шалгана уу', 'Төлөхөөс өмнө нэг харна уу', { replace });
  const body = $('screen-body');
  const delivery = f.receive === 'delivery';

  body.append(
    el(`<div class="review card">
          <div class="r"><span>Зар</span><b>${escapeHtml(l.title)}<small>${escapeHtml(l.supplier.name)}</small></b></div>
          <div class="r"><span>Хэд</span><b class="mono">${f.qty} ${unitWord(l)}</b></div>
          <div class="r"><span>Авах арга</span><b>${delivery ? 'Гэрт хүргүүлнэ' : 'Өөрөө очиж авна'}<small>${
            delivery ? `${escapeHtml(f.address)} · ${escapeHtml(f.phone)}` : escapeHtml(l.supplier.pickup_address)
          }</small></b></div>
          <div class="r"><span>Өдөр</span><b>${dayLabel(f.receiveOn)}</b></div>
        </div>`),
  );
  body.append(
    el(`<div class="review card">
          <div class="r"><span>${f.qty} ${unitWord(l)} × ${mnt(l.price_mnt)}</span><b>${money(l.price_mnt * f.qty)}</b></div>
          ${delivery ? `<div class="r"><span>Хүргэлт</span><b>${money(l.delivery_fee_mnt)}</b></div>` : ''}
          <div class="r total"><span>Нийт төлөх</span><b>${money(total())}</b></div>
        </div>`),
  );
  body.append(
    el(`<div class="promise">
          <div>${MARK.tag}<span><b>Үнэ эцсийнх.</b> Бодит жин зөрсөн ч нэмж төлөхгүй.</span></div>
          <div>${MARK.phone}<span><b>Төлсний дараа</b> нийлүүлэгчийн утас гарна; та ч, тэр ч залгаж чадна.</span></div>
          <div>${MARK.undo}<span><b>Санал зөрвөл</b> нийлүүлэгчтэй ярина; тэр цуцалбал мөнгө банкны данс руу тань буцна — мал нядалсны дараа таны буруугаас бол ${FORFEIT_PCT}% суутгана.</span></div>
        </div>`),
    el(`<p class="terms">Төлснөөр <a href="/terms" id="terms">үйлчилгээний нөхцөл</a>-ийг зөвшөөрнө.</p>`),
  );

  const foot = $('screen-foot');
  foot.replaceChildren();
  const row = el(`
    <div class="foot-row">
      <div class="sum"><span>Түрийвчнээс · дутвал QPay</span><b>${money(total())}</b></div>
      <button class="btn" data-v="primary" type="button" id="pay">Төлөх</button>
    </div>`);
  row.querySelector('#pay').addEventListener('click', placeOrder);
  foot.append(row);
}

async function placeOrder() {
  const l = state.listing;
  const f = state.form;
  const button = $('pay');
  button.disabled = true;
  button.textContent = 'Түр хүлээнэ үү…';
  try {
    const order = await guestApi('/v1/idesh', {
      method: 'POST',
      // One key per tap of «Төлөх»: a retry buys one sheep, a new tap is a
      // new intention rather than yesterday's cancelled order handed back.
      idempotencyKey: `idesh-${l.id}-${Date.now().toString(36)}`,
      body: {
        listing_id: l.id,
        qty: f.qty,
        receive: f.receive,
        receive_on: f.receiveOn,
        ...(f.receive === 'delivery'
          ? {
              address: f.address,
              address_phone: f.phone,
              ...(f.lat ? { address_lat: f.lat, address_lon: f.lon } : {}),
            }
          : {}),
      },
    });
    await guestApi(`/v1/idesh/${order.id}/pay`, { method: 'POST' });
    if (gone) return;
    // The card outside the page, on a phone, should say so now.
    shell.ordersChanged();
    state.listing = null;
    state.form = null;
    dropMap();
    state.orderId = order.id;
    rendered = null;
    // Paid: back from here goes to the list, not to a form for a sheep
    // that is already bought.
    await Promise.all([showStatus(true, { replace: true }), loadMine(), loadListings()]);
  } catch (error) {
    toast(error.message, 'bad');
    button.disabled = false;
    button.textContent = 'Төлөх';
  }
}

/* ── the status ──────────────────────────────────────────────────── */

/**
 * The steps, as a person expects them: what has happened, what comes next.
 * Each has a line for when it is done and a line for while it is still to
 * come, because «Бэлэн» on its own does not say where or when.
 */
const STEPS = [
  {
    key: 'paid',
    word: 'Төлсөн',
    done: () => 'Төлбөр хүлээн авсан',
    /** The clock stands in the right-hand column, not in the sentence. */
    aside: true,
    next: () => 'Төлбөр хүлээгдэж байна',
  },
  {
    key: 'preparing',
    word: 'Бэлтгэж байна',
    done: (o, at) => `Нийлүүлэгч ${at}-д эхэлсэн`,
    next: () => 'Нийлүүлэгч мал нядалж, махыг бэлтгэнэ',
  },
  {
    key: 'ready',
    word: 'Бэлэн',
    done: (o, at) => `${at}-д бэлэн болсон`,
    next: (o) =>
      o.receive === 'delivery'
        ? `${dayLabel(o.receive_on)}-нд хүргэлтэнд бэлэн болно`
        : `${dayLabel(o.receive_on)}-нд авах цэг дээр бэлэн болно`,
  },
  {
    key: 'dispatched',
    word: 'Замд',
    done: (o, at) => `${at}-д замд гарсан`,
    next: () => 'Хүргэгч ирэхийн өмнө танд залгана',
  },
  {
    key: 'handed',
    word: 'Хүлээлгэн өгсөн',
    done: (o, at) => `${at}-д гарт орсон`,
    next: (o) => (o.receive === 'delivery' ? 'Кодоо хэлээд махаа хүлээн авна' : 'Кодоо хэлээд махаа авна'),
  },
];

const DONE = ['HANDED', 'CLOSED', 'CANCELLED', 'REFUNDED'];

/**
 * The headline and the one sentence under it, per state. Written for a
 * person seeing a screen like this for the first time: what just happened,
 * and what happens next — not the name of a state.
 */
const FACE = {
  PAID: {
    mark: 'check',
    word: 'Захиалга баталгаажлаа',
    cap: (o) =>
      o.receive === 'delivery'
        ? `Төлбөр хүлээн авлаа. Нийлүүлэгч <b>${dayLabel(o.receive_on)}</b>-нд хаягаар тань хүргэнэ.`
        : `Төлбөр хүлээн авлаа. Нийлүүлэгч <b>${dayLabel(o.receive_on)}</b>-нд махыг авах цэг дээр бэлэн байлгана.`,
  },
  PREPARING: {
    mark: 'work',
    word: 'Мах бэлтгэгдэж байна',
    cap: () => 'Нийлүүлэгч малыг нядалж, махыг бэлтгэж байна. Бэлэн болмогц мэдэгдэнэ.',
  },
  READY: {
    mark: 'box',
    word: 'Мах бэлэн боллоо',
    cap: (o) =>
      o.receive === 'delivery'
        ? 'Удахгүй замд гарна. Хүргэгч ирэхийн өмнө танд залгана.'
        : `Авах цэг дээр очоод <b>${o.code}</b> кодоо хэлээд авна уу.`,
  },
  DISPATCHED: {
    mark: 'truck',
    word: 'Мах замд гарлаа',
    cap: (o) => `Хүргэгч хаягаар тань очиж, ирэхдээ залгана. <b>${o.code}</b> кодоо хэлээд хүлээн авна уу.`,
  },
  HANDED: { mark: 'hand', word: 'Хүлээлгэн өгсөн', cap: () => 'Мах гарт орлоо. Амтархан хэрэглээрэй.' },
  CLOSED: { mark: 'check', word: 'Захиалга дууссан', cap: () => 'Энэ захиалга хаагдсан.' },
  CANCELLED: {
    mark: 'cross',
    word: 'Цуцлагдсан',
    cap: (o) => {
      const why = REASON_WORDS[o.cancel_reason] ?? 'нийлүүлэгч цуцалсан';
      if (!o.refund_mnt) return `Захиалга цуцлагдлаа (${why}).`;
      const cut = o.forfeit_mnt ? ` Мал нядалсны дараа тул <b>${mnt(o.forfeit_mnt)}</b> (${FORFEIT_PCT}%) суутгав.` : '';
      return `Захиалга цуцлагдлаа (${why}).${cut} <b>${mnt(o.refund_mnt)}</b> таны банкны данс руу буцна.`;
    },
  },
  REFUNDED: {
    mark: 'undo',
    word: 'Мөнгө буцаасан',
    cap: (o) => `<b>${mnt(o.refund?.amount_mnt ?? o.refund_mnt ?? 0)}</b> ${o.refund?.bank_name ? `${escapeHtml(o.refund.bank_name)} дахь ` : ''}данс руу тань шилжүүлсэн.`,
  },
};

const REASON_WORDS = {
  guest_asked: 'таны хүсэлтээр',
  vet: 'мал эмнэлгийн шалгалт',
  cannot_fulfil: 'нийлүүлэгч биелүүлж чадаагүй',
  no_show: 'та ирээгүй',
  unreachable: 'хаяг дээр холбогдоогүй',
  draft_expired: 'төлөгдөөгүй',
};
const FORFEIT_PCT = 10;
const BANKS = ['Хаан банк', 'Голомт банк', 'Худалдаа хөгжлийн банк', 'Хас банк', 'Төрийн банк', 'Капитрон банк', 'Ариг банк', 'Богд банк', 'М банк'];

/** «14:05», the local clock, for a step that is done. */
function clockOf(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

/**
 * A refund does not go to a wallet: the guest names their own bank account
 * here, once, and ops sends the money there. Until then the order waits on
 * this one form; after, the panel says what was sent and when.
 */
function refundPanel(order) {
  const r = order.refund;
  const panel = el('<div class="panel card" id="refund"></div>');
  if (r.state === 'needs_account') {
    panel.append(
      el(`<div class="line">${MARK.wallet}<div>
            <span class="lab">Буцаалт авах данс</span>
            <div class="v"><span class="mono">${money(r.amount_mnt)}</span><small>Аль банкны ямар данс руу шилжүүлэхийг бичнэ үү. Basu шилжүүлмэгц SMS ирнэ.</small></div>
            <div class="field"><label for="bank">Банк</label>
              <input id="bank" list="banks" placeholder="Хаан банк" autocomplete="off">
              <datalist id="banks">${BANKS.map((b) => `<option value="${b}">`).join('')}</datalist></div>
            <div class="field"><label for="account">Дансны дугаар</label>
              <input id="account" inputmode="numeric" placeholder="5012345678"></div>
            <div class="field"><label for="holder">Данс эзэмшигчийн нэр</label>
              <input id="holder" placeholder="Банкинд бүртгэлтэй нэр"></div>
            <div class="field" id="otp-step" hidden><label for="otp">Нууц үгээ оруулж баталгаажуулна уу</label>
              <input id="otp" type="password" autocomplete="current-password" placeholder="Нууц үг"></div>
            <p class="why" data-calm id="refund-why">${MARK.warn}Гурвууланг нь бичнэ үү.</p>
            <button class="btn" data-v="primary" data-size="lg" type="button" id="send-account" disabled>Данс илгээх</button>
          </div></div>`),
    );
    const bank = panel.querySelector('#bank');
    const account = panel.querySelector('#account');
    const holder = panel.querySelector('#holder');
    const send = panel.querySelector('#send-account');
    const why = panel.querySelector('#refund-why');
    const check = () => {
      const digits = account.value.replace(/\s+/g, '');
      const problem = !bank.value.trim()
        ? 'Банкаа сонгоно уу.'
        : !/^\d{6,20}$/.test(digits)
          ? 'Дансны дугаар 6–20 оронтой тоо.'
          : holder.value.trim().length < 2
            ? 'Данс эзэмшигчийн нэрээ бичнэ үү.'
            : null;
      why.hidden = !problem;
      if (problem) why.innerHTML = `${MARK.warn}${problem}`;
      send.disabled = Boolean(problem);
    };
    for (const input of [bank, account, holder]) input.addEventListener('input', check);
    send.addEventListener('click', async () => {
      send.disabled = true;
      try {
        const password = panel.querySelector('#otp').value;
        await guestApi(`/v1/idesh/${state.orderId}/refund-account`, {
          method: 'POST',
          body: { bank_name: bank.value, bank_account: account.value, bank_holder: holder.value, password: password || undefined },
        });
        toast('Данс бүртгэгдлээ. Шилжүүлмэгц SMS ирнэ.');
        shell.ordersChanged();
        if (!gone) await Promise.all([showStatus(true), loadMine()]);
      } catch (error) {
        if (error.code === 'PASSWORD_REQUIRED' || error.code === 'BAD_PASSWORD') {
          // Money is about to be sent to this account: prove it is still you.
          panel.querySelector('#otp-step').hidden = false;
          panel.querySelector('#otp').focus();
          why.hidden = false;
          why.innerHTML = `${MARK.warn}${error.code === 'BAD_PASSWORD' ? 'Нууц үг буруу байна.' : 'Нууц үгээ оруулаад дахин дарна уу.'}`;
          send.disabled = false;
          return;
        }
        toast(error.message, 'bad');
        send.disabled = false;
      }
    });
    return panel;
  }
  panel.append(
    el(`<div class="line">${r.state === 'paid' ? MARK.check : MARK.wallet}<div>
          <span class="lab">${r.state === 'paid' ? 'Буцаалт шилжүүлсэн' : 'Буцаалт'}</span>
          <div class="v"><span class="mono">${money(r.amount_mnt)}</span><small>${escapeHtml(r.bank_name ?? '')} · ${escapeHtml(r.bank_account ?? '')} · ${escapeHtml(r.bank_holder ?? '')}${
            r.state === 'paid' ? `<br>Шилжүүлсэн ${r.paid_at ? `${dayShort(r.paid_at.slice(0, 10))} ${clockOf(r.paid_at)}` : ''}` : '<br>Basu ажлын өдөрт шилжүүлж, SMS илгээнэ.'
          }</small></div>
        </div></div>`),
  );
  return panel;
}

/** What the last render was of, so a poll that found no news changes nothing. */
let rendered = null;

async function showStatus(force, { replace = false } = {}) {
  if (!state.orderId) return;
  const order = await guestApi(`/v1/idesh/${state.orderId}`);
  if (gone || !state.orderId) return;

  const signature = [order.state, order.receipt ? 'receipt' : '', order.refund?.state ?? ''].join('|');
  // A poll that found no news changes nothing. News redraws: the supplier
  // starting is worth it.
  if (!force && signature === rendered) return;
  if (rendered !== null && signature !== rendered) shell.ordersChanged();
  rendered = signature;

  const face = FACE[order.state] ?? { mark: 'check', word: order.state, cap: () => '' };
  const live = !DONE.includes(order.state);
  const delivery = order.receive === 'delivery';
  showScreen('status', `№${order.code}`, `${order.supplier.name} · ${order.title} ×${order.qty}`, {
    replace: replace || state.screen === 'status',
  });

  const body = $('screen-body');
  const card = el(`
    <div class="status card" data-s="${order.state}">
      <div class="mark">${MARK[face.mark]}</div>
      <div class="big">${face.word}</div>
      <div class="cap">${face.cap(order)}</div>
    </div>`);

  // The steps: done ones ticked with the time, the next one ringed with what
  // it will take. A cancelled order has no road ahead to draw.
  if (order.state !== 'CANCELLED' && order.state !== 'REFUNDED') {
    const at = {
      paid: order.paid_at,
      preparing: order.preparing_at,
      ready: order.ready_at,
      dispatched: order.dispatched_at,
      handed: order.handed_at,
    };
    const timeline = el('<ul class="timeline stepper"></ul>');
    let nextFound = false;
    for (const step of STEPS) {
      // A pickup never goes on the road, so that step is not shown as missing.
      if (step.key === 'dispatched' && !delivery) continue;
      const when = at[step.key];
      const isNext = !when && !nextFound && order.state !== 'CLOSED';
      if (isNext) nextFound = true;
      const clock = when ? clockOf(when) : '';
      timeline.append(
        el(`<li${when ? ' data-done' : ''}${isNext ? ' data-next' : ''}>
              <span class="d">${MARK.check}<i></i></span>
              <span class="w">${step.word}<span class="s">${when ? step.done(order, clock) : step.next(order)}</span></span>
              ${when && step.aside ? `<span class="t">${clock}</span>` : ''}
            </li>`),
      );
    }
    card.append(timeline);
  }
  body.append(card);

  // A cancelled order asks one thing of the guest — where the money goes —
  // so that comes before anything they already know.
  if (order.refund) body.append(refundPanel(order));

  // The code is what the guest shows at the handover: big, because it will be
  // read across a counter or a courtyard.
  if (live) {
    body.append(
      el(`<div class="handcode codebox">
            <span class="lab">${delivery ? 'Хүргэгчид энэ кодыг хэлнэ' : 'Мах авахдаа энэ кодыг хэлнэ'}</span>
            <b>${order.code}</b>
            <small>Кодоо сонссон нийлүүлэгч махыг өгнө. Өөр хүн очих бол кодыг хэлээд явуулж болно.</small>
          </div>`),
    );
  }

  /* where and when */
  const plan = el('<div class="panel card"></div>');
  plan.append(
    el(`<div class="line">${MARK.day}<div>
          <span class="lab">${delivery ? 'Хүргэх өдөр' : 'Очиж авах өдөр'}</span>
          <div class="v">${dayLabel(order.receive_on)}<small>${
            delivery ? 'Хүргэгч ирэхийн өмнө утсаар залгана.' : 'Нийлүүлэгч тэр өдөр утсаар цагаа тохирно.'
          }</small></div>
        </div></div>`),
  );
  plan.append(
    el(`<div class="line">${MARK.pin}<div>
          <span class="lab">${delivery ? 'Хүргэх хаяг' : 'Авах цэг'}</span>
          <div class="v">${escapeHtml(delivery ? order.address : order.pickup_address)}${
            delivery ? `<small>Залгах утас: <span class="mono">${escapeHtml(order.address_phone)}</span></small>` : ''
          }</div>
        </div></div>`),
  );
  body.append(plan);

  /* the supplier: who they are, and that they can be rung */
  const who = el('<div class="panel card"></div>');
  who.append(
    el(`<div class="line">${MARK.shield}<div>
          <span class="lab">Нийлүүлэгч</span>
          <div class="v">${escapeHtml(order.supplier.name)}<span class="badge">${MARK.check}Гэрээт</span>
            <small>Basu шалгаж, гэрээ байгуулсан.${
              order.supplier_phone
                ? ` Асуух зүйл байвал шууд залгаарай: <a class="tel mn" href="tel:${order.supplier_phone}">${MARK.phone}${order.supplier_phone}</a>`
                : ''
            }</small>
          </div>
        </div></div>`),
  );
  body.append(who);

  /* the money */
  const pay = el('<div class="panel card"></div>');
  pay.append(
    el(`<div class="line">${MARK.wallet}<div>
          <span class="lab">Төлсөн дүн</span>
          <div class="v"><span class="mono">${money(order.total_mnt)}</span><small>Түрийвчнээс · ${
            order.delivery_fee_mnt ? `хүргэлт ${mnt(order.delivery_fee_mnt)} орсон` : 'нэмэлт төлбөр гарахгүй'
          }</small></div>
        </div></div>`),
  );
  if (order.receipt) {
    pay.append(
      el(`<div class="line">${MARK.receipt}<div>
            <span class="lab">Е-баримт</span>
            <div class="v">Сугалаа <span class="mono">${escapeHtml(order.receipt.lottery ?? '')}</span><small>Татварын баримт бүртгэгдсэн.</small></div>
          </div></div>`),
    );
  }
  body.append(pay);

  /* what the guest is holding on to */
  if (live) {
    body.append(
      el(`<div class="assure">
            <div class="t">Таны баталгаа</div>
            <div>${MARK.check}<span><b>Үнэ эцсийнх.</b> Бодит жин зөрсөн ч нэмж төлөхгүй.</span></div>
            <div>${MARK.check}<span><b>Гэрээт нийлүүлэгч.</b> Basu шалгаж, гэрээ байгуулсан.</span></div>
            <div>${MARK.check}<span><b>Санал зөрвөл</b> нийлүүлэгчтэй ярина; тэр цуцалбал мөнгө түрийвчинд бүтнээр буцна.</span></div>
          </div>`),
    );
  }

  // No cancel button, on purpose: money that has moved does not come back at
  // a press. The one thing a guest can do about an order is talk to the
  // person who has it, so that is the button.
  const foot = $('screen-foot');
  foot.replaceChildren();
  if (live && order.supplier_phone) {
    foot.append(
      el(`<p class="why" data-calm>${MARK.warn}Өөрчлөх, цуцлах бол нийлүүлэгчтэй ярина уу — цуцлахыг тэр хийнэ.</p>`),
      el(`<a class="btn" data-size="lg" href="tel:${order.supplier_phone}">${MARK.phone}Нийлүүлэгч рүү залгах</a>`),
    );
  }
  if (!live) {
    const again = el('<button class="btn" data-size="lg" type="button">Зар үзэх</button>');
    again.addEventListener('click', () => history.back());
    foot.append(again);
  }
}

/* ── what of mine is running ─────────────────────────────────────── */

async function loadMine() {
  if (!store.guestToken) return paintMine([]);
  try {
    const { orders } = await guestApi('/v1/idesh');
    if (gone) return;
    paintMine(orders);
  } catch {
    if (!gone) paintMine([]);
  }
}

function paintMine(orders) {
  state.mine = orders;
  const list = $('mine-list');
  list.replaceChildren();
  if (!orders.length) {
    $('mine').removeAttribute('data-any');
    return;
  }
  $('mine').dataset.any = String(orders.length);
  for (const order of orders) {
    const [word, cap] = IDESH_HEADLINE[order.state] ?? [order.state, ''];
    const card = el(`
      <button class="card row" type="button" data-order="${order.id}" data-chev>
        <span class="who main">
          <span class="venue title">${escapeHtml(order.supplier.name)}</span>
          <span class="what sub">${escapeHtml(order.title)} ×${order.qty} · ${cap}</span>
          <span class="code meta">№${order.code}<span class="chip" data-s="${order.state}" data-inline>${word}</span></span>
        </span>
        <span class="end"><span class="when val">${dayShort(order.receive_on)}<small>${order.receive === 'delivery' ? 'ирэх' : 'авах'}</small></span></span>
      </button>`);
    card.addEventListener('click', () => {
      state.listing = null;
      state.form = null;
      state.orderId = order.id;
      rendered = null;
      void showStatus(true);
    });
    list.append(card);
  }
}

/* ── boot ────────────────────────────────────────────────────────── */

/**
 * Two ways in: the Basu home screen deep-links an order (`/idesh?order=…`),
 * or the page is simply opened, in which case the guest's own orders sit at
 * the top and the stalls below. Nobody is signed in on the way through — a
 * stranger gets the stalls, not an account.
 */
async function resume() {
  const wanted = new URLSearchParams(location.search).get('order');
  if (!wanted || !store.guestToken) return;
  state.orderId = wanted;
  rendered = null;
  await showStatus(true);
}

// No demo clock strip here. Its buttons are the lunch service's — arm at
// 12:14, fire at 12:21 — and an идэш is measured in days, not minutes. The
// strip stays on the food pages, where it is the whole demo.
void Promise.all([loadListings(), loadMine()]).then(resume);

const poll = setInterval(() => {
  if (document.hidden) return;
  if (state.orderId && state.screen === 'status') void showStatus();
  else if (!state.screen) void loadMine();
}, 4000);
addEventListener('pagehide', () => {
  clearInterval(poll);
  gone = true;
});
</script>
</body>
</html>
