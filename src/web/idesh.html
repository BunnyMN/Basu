<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Basu — өвлийн идэш</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.css">
<link rel="stylesheet" href="/app.css">
<style>
/* A list, not a map: the question here is "which animal, from whom, at what
   price", and that is answered by reading down, not by looking around. */
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.top h1{font-size:1.45rem;font-weight:900;letter-spacing:-.03em}
.top .sub{font-size:.84rem;color:var(--ink-2);margin:4px 0 0;line-height:1.45;max-width:36ch}
.home{
  flex:none;margin-top:3px;background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:7px 11px;box-shadow:var(--shadow);text-decoration:none;
  font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:600;
  letter-spacing:.02em;color:var(--accent-ink);
}
.home:hover{border-color:var(--accent-line)}

/* ── what of mine is running ─────────────────────────────────────── */
.mine{margin-bottom:18px}
.mine:not([data-any]){display:none}
.mine .sec{margin-bottom:8px}
.sec{
  font-family:"IBM Plex Mono",monospace;font-size:.66rem;text-transform:uppercase;
  letter-spacing:.14em;color:var(--ink-3);
}
.card{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:4px;padding:11px 14px;margin-bottom:8px;color:inherit;box-shadow:var(--shadow);
}
.card:hover{border-color:var(--line-2);border-left-color:var(--accent)}
.card .who{min-width:0;flex:1}
.card .venue{display:block;font-weight:700;font-size:.92rem;letter-spacing:-.02em;overflow-wrap:anywhere}
.card .what{display:block;font-size:.78rem;color:var(--ink-2);margin-top:2px}
.card .code{display:flex;align-items:center;gap:6px;margin-top:5px;font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--ink-3)}
.card .when{font-family:"IBM Plex Mono",monospace;font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums;flex:none;color:var(--accent-ink)}
.card .when small{display:block;font-size:.56rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:right;margin-top:2px}

/* ── the filter ──────────────────────────────────────────────────── */
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.kinds button{
  font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.04em;padding:6px 11px;
  border-radius:99px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
}
.kinds button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ── the stalls ──────────────────────────────────────────────────── */
.listings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.listing{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 12px;
  box-shadow:var(--shadow);
}
.listing:hover{border-color:var(--accent-line)}
.listing[data-gone]{opacity:.55}
.listing .art{
  width:52px;height:52px;flex:none;border-radius:4px;border:1px solid var(--line);
  background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-ink);
  overflow:hidden;
}
.listing .art img{width:100%;height:100%;object-fit:cover;display:block}
.listing .art svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.listing .who{min-width:0;flex:1}
.listing .name{font-weight:700;font-size:.94rem;letter-spacing:-.01em;overflow-wrap:anywhere}
.listing .from{font-size:.78rem;color:var(--ink-2);margin-top:1px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.listing .meta{font-family:"IBM Plex Mono",monospace;font-size:.64rem;color:var(--ink-3);margin-top:4px;overflow-wrap:anywhere}
.listing .price{font-family:"IBM Plex Mono",monospace;font-size:.86rem;font-weight:600;font-variant-numeric:tabular-nums;flex:none;text-align:right}
.listing .price small{display:block;font-size:.58rem;font-weight:400;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.verified{
  font-family:"IBM Plex Mono",monospace;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ready);border:1px solid var(--ready-line);border-radius:2px;padding:1px 5px;font-style:normal;
}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:.86rem;line-height:1.5}

/* ── the sheet ───────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,14,16,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim[data-open]{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);
  border-top:1px solid var(--line);border-radius:10px 10px 0 0;
  box-shadow:0 -12px 34px -18px rgba(0,0,0,.5);max-height:90vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.25,1);
}
.sheet[data-open]{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
@media(min-width:640px){
  .sheet{left:50%;right:auto;width:520px;transform:translate(-50%,100%)}
  .sheet[data-open]{transform:translate(-50%,0)}
}
.grip{display:flex;justify-content:center;padding:8px 0 2px;flex:none}
.grip i{width:38px;height:4px;border-radius:99px;background:var(--line-2)}
.sheet header{display:flex;align-items:flex-start;gap:12px;padding:6px 18px 14px;border-bottom:1px solid var(--line);flex:none}
.sheet header h2{font-size:1.15rem;font-weight:800;letter-spacing:-.03em}
.sheet header .sub{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-3);margin-top:3px;overflow-wrap:anywhere}
.sheet header .x{margin-left:auto;background:none;border:none;color:var(--ink-3);font-size:1.2rem;line-height:1;padding:4px 2px;flex:none}
.sheet .body{overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.sheet footer{border-top:1px solid var(--line);padding:12px 18px calc(14px + env(safe-area-inset-bottom));flex:none}
.sheet footer:empty{display:none}
.sheet footer .terms{font-size:.74rem;color:var(--ink-2);text-align:center;margin:0 0 9px;line-height:1.45}
.sheet footer .terms b{color:var(--accent-ink)}

.note{
  background:var(--hold-soft);border:1px solid var(--hold-line);border-left:3px solid var(--hold);
  border-radius:3px;padding:12px 14px;margin:14px 18px;
}
.note b{display:block;font-size:.88rem;color:var(--ink);margin-bottom:3px}
.note span{font-size:.8rem;color:var(--ink-2);line-height:1.5}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.facts div{background:var(--surface);padding:10px 18px}
.facts .lab{display:block;margin-bottom:3px}
.facts b{font-family:"IBM Plex Mono",monospace;font-size:.86rem;font-weight:600;font-variant-numeric:tabular-nums}
.about{padding:12px 18px;font-size:.86rem;color:var(--ink-2);line-height:1.5;border-bottom:1px solid var(--line)}

.field{padding:12px 18px;border-bottom:1px solid var(--line)}
.field .lab{display:block;margin-bottom:8px}
.qty{display:inline-flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;vertical-align:middle}
.qty button{width:38px;height:38px;background:var(--surface);border:none;color:var(--ink-2);font-size:1.15rem;line-height:1}
.qty button:hover{background:var(--surface-2);color:var(--ink)}
.qty span{min-width:56px;line-height:38px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:.9rem;font-variant-numeric:tabular-nums}
.field .hint{font-size:.76rem;color:var(--ink-3);margin-left:10px}

.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick button{
  text-align:left;padding:10px 12px;border-radius:3px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-family:"Golos Text",sans-serif;font-size:.86rem;
}
.pick button b{display:block;color:var(--ink);font-weight:700}
.pick button small{display:block;font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink-3);margin-top:3px;line-height:1.4}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick button[aria-pressed="true"] b{color:var(--accent-ink)}
.pick button[disabled]{opacity:.4;cursor:not-allowed}

input[type="date"],input[type="text"],input[type="tel"],textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line-2);border-radius:3px;
  background:var(--surface-2);color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:.9rem;
}
textarea{font-family:inherit;min-height:64px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mapbox{height:180px;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;background:#f5f3ef;position:relative;margin-top:8px}
.mapbox .tip{
  position:absolute;left:8px;bottom:8px;z-index:2;background:var(--surface);border:1px solid var(--line);
  border-radius:2px;padding:3px 8px;font-family:"IBM Plex Mono",monospace;font-size:.64rem;color:var(--ink-2);
}

/* ── status ──────────────────────────────────────────────────────── */
.status{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px 18px;text-align:center;margin:14px 18px 0}
.status .big{font-size:1.9rem;font-weight:900;letter-spacing:-.04em;line-height:1.05}
.status .cap{font-size:.8rem;color:var(--ink-3);margin-top:6px}
.status[data-s="PREPARING"] .big{color:var(--accent-ink)}
.status[data-s="READY"] .big,.status[data-s="HANDED"] .big{color:var(--ready)}
.status[data-s="DISPATCHED"] .big{color:var(--route)}
.timeline{list-style:none;margin:14px 0 0;padding:0;text-align:left}
.timeline li{display:grid;grid-template-columns:1.2rem 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.86rem}
.timeline .d{width:10px;height:10px;border-radius:99px;border:1px solid var(--line-2);margin-top:5px}
.timeline li[data-done] .d{background:var(--ready);border-color:var(--ready)}
.timeline li[data-done] .w{color:var(--ink)}
.timeline li:not([data-done]) .w{color:var(--ink-3)}
.handcode{
  margin:14px 18px 0;padding:14px;border:1px dashed var(--line-2);border-radius:4px;text-align:center;
}
.handcode .lab{display:block;margin-bottom:4px}
.handcode b{font-family:"IBM Plex Mono",monospace;font-size:2.2rem;font-weight:600;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.where{padding:12px 18px;border-top:1px solid var(--line);margin-top:14px;font-size:.86rem;line-height:1.5}
.where .lab{display:block;margin-bottom:4px}
.where a{color:var(--accent-ink);font-family:"IBM Plex Mono",monospace}
</style>
</head>
<body>

<main class="wrap">
  <div class="top">
    <div>
      <h1>Өвлийн идэш</h1>
      <p class="sub">Гэрээт малчин, махны газраас. Үнэ нь зар дээр бичсэнээрээ эцсийнх.</p>
    </div>
    <a class="home" href="/" id="home" aria-label="Basu нүүр">‹ Basu</a>
  </div>

  <section class="mine" id="mine">
    <h2 class="sec">Миний идэш</h2>
    <div id="mine-list"></div>
  </section>

  <div class="kinds" id="kinds" role="group" aria-label="Малын төрөл"></div>
  <ul class="listings" id="listings"><li class="empty">Зар ачаалж байна…</li></ul>
</main>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="sheet" aria-label="Зар">
  <div class="grip"><i></i></div>
  <header>
    <div>
      <h2 id="sheet-name">—</h2>
      <div class="sub" id="sheet-sub"></div>
    </div>
    <button class="x" type="button" id="sheet-close" aria-label="Хаах">✕</button>
  </header>
  <div class="body" id="sheet-body"></div>
  <footer id="sheet-foot"></footer>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.js"></script>
<script type="module">
import { api, store, shell, toast, mnt, IDESH_HEADLINE, KIND, dayLabel, dayShort } from '/api.js';
import { mapStyle, ULAANBAATAR } from '/mapStyle.js';

const $ = (id) => document.getElementById(id);
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};

/** Guest text goes into the DOM as text, never as markup. */
function escapeHtml(value) {
  const node = document.createElement('span');
  node.textContent = value ?? '';
  return node.innerHTML;
}

/**
 * A photograph of the cut, per kind of animal — Basu's own four, served from
 * /idesh/<kind>.jpg. Not a supplier's picture: uploads, storage and
 * moderation are a second release. Below it, one drawing per kind in the
 * launcher's stroke, which is what shows if a picture fails to arrive — a
 * list with holes in it sells nothing.
 */
const PHOTO = (kind) => `/idesh/${kind}.jpg`;

const ART = {
  sheep: `<svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 9.5a3 3 0 0 1 3-3.8 3.2 3.2 0 0 1 5.6 0 3 3 0 0 1 3.4 3.4 3 3 0 0 1-.4 5.6H7.3a3 3 0 0 1-.8-5.2Z"/>
            <path d="M8.5 15v4M15.5 15v4"/>
            <path d="M3.5 10.5h3"/>
          </svg>`,
  goat: `<svg viewBox="0 0 24 24" aria-hidden="true">
           <path d="M6 11.5h10.5a3 3 0 0 1 0 6H8a2.5 2.5 0 0 1 0-5"/>
           <path d="M6 11.5 4 8M7.5 11.5l.5-4"/>
           <path d="M9 17.5v3M15 17.5v3"/>
         </svg>`,
  beef: `<svg viewBox="0 0 24 24" aria-hidden="true">
           <path d="M7 9.5v8a5 5 0 0 0 10 0v-8"/>
           <path d="M7 9.5C5 9 3.5 7 4 4.5M17 9.5c2-.5 3.5-2.5 3-5"/>
           <path d="M9.5 15h1M13.5 15h1"/>
         </svg>`,
  horse: `<svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 20V11l4-6 3 2v3l4 3-1.5 2-3-1.5V20"/>
            <path d="M12 5 10.5 3M14.5 7.5l1.6-1.4"/>
          </svg>`,
};

const state = {
  today: null,
  listings: [],
  kind: 'all',
  listing: null,
  /** The form the guest is filling in. */
  form: null,
  mine: [],
  orderId: null,
  map: null,
};

/**
 * The page is on its way out. A request already in flight still lands after
 * `pagehide`, and drawing its answer into a document that is being torn down
 * is an error in a test and wasted work in a browser — so every path that
 * awaits the server and then touches the page checks this first.
 */
let gone = false;

/* ── signing in ──────────────────────────────────────────────────── */

async function signIn() {
  // Inside the phone app the sheet is the shell's, and so is the token.
  if (shell.present) return shell.signIn();
  const { token } = await api('/dev/login', { method: 'POST', body: {} });
  store.guestToken = token;
  return token;
}

/** Every call that needs a guest. A dead token means sign in again — once. */
async function guestApi(path, options = {}) {
  const token = store.guestToken ?? (await signIn());
  try {
    return await api(path, { ...options, token });
  } catch (error) {
    if (error.status !== 401) throw error;
    store.guestToken = null;
    return api(path, { ...options, token: await signIn() });
  }
}

/* ── the stalls ──────────────────────────────────────────────────── */

async function loadListings() {
  const { today, listings } = await api('/v1/idesh/listings');
  if (gone) return;
  state.today = today;
  state.listings = listings;
  paintKinds();
  paintListings();
}

function paintKinds() {
  const box = $('kinds');
  box.replaceChildren();
  const present = new Set(state.listings.map((l) => l.kind));
  const options = [['all', 'Бүгд'], ...Object.entries(KIND).filter(([k]) => present.has(k))];
  for (const [key, label] of options) {
    const button = el(
      `<button type="button" aria-pressed="${state.kind === key}" data-kind="${key}">${label}</button>`,
    );
    button.addEventListener('click', () => {
      state.kind = key;
      paintKinds();
      paintListings();
    });
    box.append(button);
  }
}

/** «460,000₮ / бүтэн, ~38 кг» or «13,500₮ / кг, доод тал нь 20 кг». */
function unitLine(l) {
  return l.unit === 'whole'
    ? `бүтэн · ~${l.approx_kg} кг`
    : `кг · доод тал нь ${l.min_qty} кг`;
}

function paintListings() {
  const list = $('listings');
  list.replaceChildren();
  const shown = state.listings.filter((l) => state.kind === 'all' || l.kind === state.kind);
  if (!shown.length) {
    list.append(
      el(`<li class="empty">Одоогоор зар алга.<br>Өвлийн идэшний зар 10–11-р сард гарна.</li>`),
    );
    return;
  }
  for (const l of shown) {
    const item = el(`
      <li>
        <button class="listing" type="button" data-kind="${l.kind}" data-id="${l.id}"${
          l.remaining === 0 ? ' data-gone' : ''
        }>
          <span class="art"><img src="${PHOTO(l.kind)}" alt="" loading="lazy" width="52" height="52"></span>
          <span class="who">
            <span class="name">${escapeHtml(l.title)}</span>
            <span class="from">${escapeHtml(l.supplier.name)}${
              l.supplier.contracted ? '<i class="verified">гэрээт</i>' : ''
            }</span>
            <span class="meta">${escapeHtml(l.origin)} · ${dayLabel(l.ready_from)}-нөөс · ${
              l.remaining === 0 ? 'дууссан' : `${l.remaining} ${l.unit === 'whole' ? 'толгой' : 'кг'} үлдсэн`
            }${l.delivers ? ' · хүргэнэ' : ''}</span>
          </span>
          <span class="price">${mnt(l.price_mnt)}<small>${l.unit === 'whole' ? 'бүтэн' : '1 кг'}</small></span>
        </button>
      </li>`);
    item.querySelector('button').addEventListener('click', () => openListing(l));
    // The picture did not come: the drawn mark stands in, and the row stays whole.
    const picture = item.querySelector('.art img');
    picture.addEventListener('error', () => {
      picture.parentElement.innerHTML = ART[l.kind] ?? '';
    });
    list.append(item);
  }
}

/* ── the sheet ───────────────────────────────────────────────────── */

function openSheet(name, sub) {
  $('sheet-name').textContent = name;
  $('sheet-sub').textContent = sub;
  $('sheet-body').replaceChildren();
  $('sheet-foot').replaceChildren();
  $('sheet').dataset.open = '1';
  $('scrim').dataset.open = '1';
}

function closeSheet() {
  $('sheet').removeAttribute('data-open');
  $('scrim').removeAttribute('data-open');
  state.listing = null;
  state.form = null;
  state.orderId = null;
  if (state.map) {
    state.map.remove?.();
    state.map = null;
  }
  const url = new URL(location.href);
  if (url.searchParams.has('order')) {
    url.searchParams.delete('order');
    history.replaceState(null, '', url);
  }
}
$('sheet-close').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);

/** The soonest day the guest may ask for: when the meat exists, and not the past. */
const earliest = (l) => (l.ready_from > state.today ? l.ready_from : state.today);

function openListing(l) {
  state.listing = l;
  state.orderId = null;
  state.form = {
    qty: l.min_qty,
    receive: 'pickup',
    receiveOn: earliest(l),
    address: '',
    phone: '',
    lat: null,
    lon: null,
  };
  openSheet(l.title, `${l.supplier.name} · ${l.origin}`);
  renderForm();
}

function total() {
  const l = state.listing;
  const f = state.form;
  return l.price_mnt * f.qty + (f.receive === 'delivery' ? l.delivery_fee_mnt : 0);
}

function renderForm() {
  const l = state.listing;
  const f = state.form;
  const body = $('sheet-body');
  body.replaceChildren();

  if (l.note) body.append(el(`<div class="about">${escapeHtml(l.note)}</div>`));

  body.append(
    el(`<div class="facts">
          <div><span class="lab">Үнэ</span><b>${mnt(l.price_mnt)} / ${l.unit === 'whole' ? 'толгой' : 'кг'}</b></div>
          <div><span class="lab">${l.unit === 'whole' ? 'Ойролцоо жин' : 'Доод захиалга'}</span><b>${
            l.unit === 'whole' ? `~${l.approx_kg} кг` : `${l.min_qty} кг`
          }</b></div>
          <div><span class="lab">Бэлэн болох</span><b>${dayLabel(l.ready_from)}</b></div>
          <div><span class="lab">Үлдсэн</span><b>${l.remaining} ${l.unit === 'whole' ? 'толгой' : 'кг'}</b></div>
        </div>`),
  );

  if (l.remaining === 0) {
    body.append(
      el(`<div class="note"><b>Энэ зар дууссан</b><span>Нийлүүлэгч дахин нэмбэл энд гарна.</span></div>`),
    );
    return;
  }

  /* how much */
  const qty = el(`
    <div class="field">
      <span class="lab">${l.unit === 'whole' ? 'Хэдэн толгой' : 'Хэдэн кг'}</span>
      <div class="qty">
        <button type="button" data-d="-1" aria-label="Хасах">−</button>
        <span id="qty">${f.qty}</span>
        <button type="button" data-d="1" aria-label="Нэмэх">+</button>
      </div>
      <span class="hint">${l.unit === 'whole' ? 'Хоёр айл нэг мал хувааж болно' : `Доод тал нь ${l.min_qty} кг`}</span>
    </div>`);
  qty.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button) return;
    const step = l.unit === 'whole' ? 1 : 5;
    const next = f.qty + Number(button.dataset.d) * step;
    f.qty = Math.min(l.remaining, Math.max(l.min_qty, next));
    qty.querySelector('#qty').textContent = String(f.qty);
    renderFoot();
  });
  body.append(qty);

  /* how to receive it */
  const pick = el(`
    <div class="field">
      <span class="lab">Хэрхэн авах</span>
      <div class="pick">
        <button type="button" data-r="pickup" aria-pressed="${f.receive === 'pickup'}">
          <b>Өөрөө очиж</b><small>${escapeHtml(l.supplier.pickup_address)}</small>
        </button>
        <button type="button" data-r="delivery" aria-pressed="${f.receive === 'delivery'}"${l.delivers ? '' : ' disabled'}>
          <b>Хүргүүлэх</b><small>${l.delivers ? `+${mnt(l.delivery_fee_mnt)} · нийлүүлэгч хүргэнэ` : 'энэ нийлүүлэгч хүргэдэггүй'}</small>
        </button>
      </div>
    </div>`);
  pick.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    f.receive = button.dataset.r;
    renderForm();
  });
  body.append(pick);

  /* when */
  const when = el(`
    <div class="field">
      <label class="lab" for="when">${f.receive === 'delivery' ? 'Хүргүүлэх өдөр' : 'Очиж авах өдөр'}</label>
      <input type="date" id="when" min="${earliest(l)}" value="${f.receiveOn}">
    </div>`);
  when.querySelector('input').addEventListener('change', (event) => {
    f.receiveOn = event.target.value;
    renderFoot();
  });
  body.append(when);

  /* where, for a delivery */
  if (f.receive === 'delivery') {
    const where = el(`
      <div class="field">
        <span class="lab">Хаяг</span>
        <textarea id="address" placeholder="Дүүрэг, хороолол, байр, орц, тоот">${escapeHtml(f.address)}</textarea>
        <div class="two" style="margin-top:8px">
          <input type="tel" id="phone" placeholder="Залгах утас +976…" value="${escapeHtml(f.phone)}">
          <span class="hint" style="margin:0;align-self:center;font-size:.72rem">Хүргэгч энэ дугаарт залгана</span>
        </div>
        <div class="mapbox" id="mapbox"><span class="tip" id="maptip">Газрын зураг дээр цэг тавина уу</span></div>
      </div>`);
    where.querySelector('#address').addEventListener('input', (e) => {
      f.address = e.target.value;
      renderFoot();
    });
    where.querySelector('#phone').addEventListener('input', (e) => {
      f.phone = e.target.value;
      renderFoot();
    });
    body.append(where);
    mountMap(where.querySelector('#mapbox'));
  }

  renderFoot();
}

/**
 * A small map for one pin. The address in words is what the courier reads;
 * the pin is what they navigate by, and it is the one thing a text field
 * cannot carry. Lazily built, because most orders are collected and a map
 * nobody asked for is the slowest thing on the page.
 */
function mountMap(container) {
  if (typeof maplibregl === 'undefined') return;
  const f = state.form;
  const map = new maplibregl.Map({
    container,
    style: mapStyle(),
    center: f.lon ? [f.lon, f.lat] : [ULAANBAATAR.lon, ULAANBAATAR.lat],
    zoom: 13.2,
    attributionControl: false,
  });
  state.map = map;
  const PIN = 'drop';
  map.on('load', () => {
    map.addSource(PIN, { type: 'geojson', data: pinData() });
    map.addLayer({
      id: 'drop-pin',
      type: 'circle',
      source: PIN,
      paint: { 'circle-radius': 8, 'circle-color': '#C64E08', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 },
    });
  });
  map.on('click', (event) => {
    f.lat = Number(event.lngLat.lat.toFixed(6));
    f.lon = Number(event.lngLat.lng.toFixed(6));
    map.getSource(PIN)?.setData(pinData());
    const tip = document.getElementById('maptip');
    if (tip) tip.textContent = 'Цэг тавигдлаа';
    renderFoot();
  });
  function pinData() {
    return {
      type: 'FeatureCollection',
      features: f.lat
        ? [{ type: 'Feature', geometry: { type: 'Point', coordinates: [f.lon, f.lat] }, properties: {} }]
        : [],
    };
  }
}

function renderFoot() {
  const l = state.listing;
  const f = state.form;
  const foot = $('sheet-foot');
  foot.replaceChildren();
  if (!l || !f || l.remaining === 0) return;

  const needs =
    f.receive === 'delivery' && (!f.address.trim() || !f.phone.trim())
      ? 'Хаяг, утсаа оруулна уу'
      : !f.receiveOn
        ? 'Өдрөө сонгоно уу'
        : null;

  foot.append(el('<p class="terms">Нийлүүлэгч <b>бэлтгэж эхлэхээс өмнө</b> үнэгүй цуцална. Үнэ бүтэн, нэг удаа.</p>'));
  const button = el(
    `<button class="btn" data-v="primary" data-size="lg" type="button" id="pay"${needs ? ' disabled' : ''}>
       ${needs ?? `${mnt(total())} төлөх`}
     </button>`,
  );
  button.addEventListener('click', placeOrder);
  foot.append(button);
}

async function placeOrder() {
  const l = state.listing;
  const f = state.form;
  const button = $('pay');
  button.disabled = true;
  button.textContent = 'Түр хүлээнэ үү…';
  try {
    const order = await guestApi('/v1/idesh', {
      method: 'POST',
      // One key per tap of «төлөх»: a retry buys one sheep, a new tap is a
      // new intention rather than yesterday's cancelled order handed back.
      idempotencyKey: `idesh-${l.id}-${Date.now().toString(36)}`,
      body: {
        listing_id: l.id,
        qty: f.qty,
        receive: f.receive,
        receive_on: f.receiveOn,
        ...(f.receive === 'delivery'
          ? {
              address: f.address,
              address_phone: f.phone,
              ...(f.lat ? { address_lat: f.lat, address_lon: f.lon } : {}),
            }
          : {}),
      },
    });
    await guestApi(`/v1/idesh/${order.id}/pay`, { method: 'POST' });
    if (gone) return;
    // The card outside the page, on a phone, should say so now.
    shell.ordersChanged();
    state.listing = null;
    state.form = null;
    if (state.map) {
      state.map.remove?.();
      state.map = null;
    }
    state.orderId = order.id;
    rendered = null;
    await Promise.all([showStatus(true), loadMine(), loadListings()]);
  } catch (error) {
    toast(error.message, 'bad');
    renderFoot();
  }
}

/* ── status ──────────────────────────────────────────────────────── */

const STEPS = [
  ['paid', 'Төлсөн'],
  ['preparing', 'Бэлтгэж байна'],
  ['ready', 'Бэлэн'],
  ['dispatched', 'Замд'],
  ['handed', 'Хүлээлгэн өгсөн'],
];

const DONE = ['HANDED', 'CLOSED', 'CANCELLED', 'REFUNDED'];

/** What the last render was of, so a poll that found no news changes nothing. */
let rendered = null;

async function showStatus(force) {
  if (!state.orderId) return;
  const order = await guestApi(`/v1/idesh/${state.orderId}`);
  if (gone) return;

  const signature = [order.state, order.receipt ? 'receipt' : ''].join('|');
  // A poll that found no news changes nothing — including a sheet the guest
  // has just closed. News reopens it: the supplier starting is worth it.
  if (!force && signature === rendered) return;
  if (rendered !== null && signature !== rendered) shell.ordersChanged();
  rendered = signature;

  const [word, cap] = IDESH_HEADLINE[order.state] ?? [order.state, ''];
  openSheet(`№${order.code}`, `${order.supplier.name} · ${order.title} ×${order.qty}`);

  const body = $('sheet-body');
  const card = el(`
    <div class="status" data-s="${order.state}">
      <div class="lab">${order.state}</div>
      <div class="big">${word}</div>
      <div class="cap">${cap}</div>
    </div>`);

  const done = {
    paid: Boolean(order.paid_at),
    preparing: Boolean(order.preparing_at),
    ready: Boolean(order.ready_at),
    dispatched: Boolean(order.dispatched_at),
    handed: Boolean(order.handed_at),
  };
  const timeline = el('<ul class="timeline"></ul>');
  for (const [key, label] of STEPS) {
    // A pickup never goes on the road, so that step is not shown as missing.
    if (key === 'dispatched' && order.receive !== 'delivery') continue;
    timeline.append(el(`<li${done[key] ? ' data-done' : ''}><i class="d"></i><span class="w">${label}</span></li>`));
  }
  card.append(timeline);
  body.append(card);

  // The code is what the guest shows at the handover: big, because it will be
  // read across a counter or a courtyard.
  if (['PAID', 'PREPARING', 'READY', 'DISPATCHED'].includes(order.state)) {
    body.append(
      el(`<div class="handcode"><span class="lab">Авахдаа энэ кодыг хэлнэ</span><b>${order.code}</b></div>`),
    );
  }

  const where = el(`<div class="where"></div>`);
  if (order.receive === 'delivery') {
    where.append(
      el(`<div><span class="lab">Хүргэлт · ${dayLabel(order.receive_on)}</span>${escapeHtml(order.address)}<br>
          <span style="color:var(--ink-3)">Залгах: ${escapeHtml(order.address_phone)}</span></div>`),
    );
  } else {
    where.append(
      el(`<div><span class="lab">Очиж авах · ${dayLabel(order.receive_on)}</span>${escapeHtml(order.pickup_address)}</div>`),
    );
  }
  if (order.supplier_phone) {
    where.append(
      el(`<div style="margin-top:10px"><span class="lab">Нийлүүлэгч</span>${escapeHtml(order.supplier.name)} ·
          <a href="tel:${order.supplier_phone}">${order.supplier_phone}</a></div>`),
    );
  }
  where.append(
    el(`<div style="margin-top:10px"><span class="lab">Төлбөр</span>${mnt(order.total_mnt)}${
      order.delivery_fee_mnt ? ` <span style="color:var(--ink-3)">(хүргэлт ${mnt(order.delivery_fee_mnt)} орсон)</span>` : ''
    }</div>`),
  );
  body.append(where);

  if (order.receipt) {
    body.append(el(`<div class="note"><b>Е-баримт</b><span>Сугалаа ${order.receipt.lottery}</span></div>`));
  }

  const foot = $('sheet-foot');
  foot.replaceChildren();
  if (order.can_cancel) {
    const cancel = el(
      `<button class="btn" data-v="danger" data-size="lg" type="button">Үнэгүй цуцлах — бэлтгэж эхлэх хүртэл</button>`,
    );
    cancel.addEventListener('click', async () => {
      try {
        await guestApi(`/v1/idesh/${state.orderId}/cancel`, { method: 'POST' });
        toast('Цуцлагдлаа. Мөнгө түрийвчинд буцна.');
        shell.ordersChanged();
      } catch (error) {
        toast(error.message, 'bad');
      }
      if (gone) return;
      await Promise.all([showStatus(true), loadMine(), loadListings()]);
    });
    foot.append(cancel);
  }
  if (DONE.includes(order.state)) {
    const again = el('<button class="btn" data-size="lg" type="button">Зар үзэх</button>');
    again.addEventListener('click', closeSheet);
    foot.append(again);
  }
}

/* ── what of mine is running ─────────────────────────────────────── */

async function loadMine() {
  if (!store.guestToken) return paintMine([]);
  try {
    const { orders } = await guestApi('/v1/idesh');
    if (gone) return;
    paintMine(orders);
  } catch {
    if (!gone) paintMine([]);
  }
}

function paintMine(orders) {
  state.mine = orders;
  const list = $('mine-list');
  list.replaceChildren();
  if (!orders.length) {
    $('mine').removeAttribute('data-any');
    return;
  }
  $('mine').dataset.any = String(orders.length);
  for (const order of orders) {
    const [word, cap] = IDESH_HEADLINE[order.state] ?? [order.state, ''];
    const card = el(`
      <button class="card" type="button" data-order="${order.id}">
        <span class="who">
          <span class="venue">${escapeHtml(order.supplier.name)}</span>
          <span class="what">${escapeHtml(order.title)} ×${order.qty} · ${cap}</span>
          <span class="code">№${order.code}<span class="chip" data-s="${order.state}">${word}</span></span>
        </span>
        <span class="when">${dayShort(order.receive_on)}<small>${order.receive === 'delivery' ? 'ирэх' : 'авах'}</small></span>
      </button>`);
    card.addEventListener('click', () => {
      state.orderId = order.id;
      rendered = null;
      void showStatus(true);
    });
    list.append(card);
  }
}

/* ── boot ────────────────────────────────────────────────────────── */

/**
 * Two ways in: the Basu home screen deep-links an order (`/idesh?order=…`),
 * or the page is simply opened, in which case the guest's own orders sit at
 * the top and the stalls below. Nobody is signed in on the way through — a
 * stranger gets the stalls, not an account.
 */
async function resume() {
  const wanted = new URLSearchParams(location.search).get('order');
  if (!wanted || !store.guestToken) return;
  state.orderId = wanted;
  rendered = null;
  await showStatus(true);
}

// No demo clock strip here. Its buttons are the lunch service's — arm at
// 12:14, fire at 12:21 — and an идэш is measured in days, not minutes. The
// strip stays on the food pages, where it is the whole demo.
void Promise.all([loadListings(), loadMine()]).then(resume);

const poll = setInterval(() => {
  if (document.hidden) return;
  if (state.orderId) void showStatus();
  else void loadMine();
}, 4000);
addEventListener('pagehide', () => {
  clearInterval(poll);
  gone = true;
});
</script>
</body>
