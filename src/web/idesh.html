<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Basu — өвлийн идэш</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.css">
<link rel="stylesheet" href="/app.css">
<style>
/* A list, not a map: the question here is "which animal, from whom, at what
   price", and that is answered by reading down, not by looking around.
   Everything after a tap is a full screen that slides in from the right, the
   way a phone does it — one question per step, a bar on top that says where
   back goes, and the price pinned to the bottom. */
html{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.top h1{font-size:1.45rem;font-weight:900;letter-spacing:-.03em}
.top .sub{font-size:.84rem;color:var(--ink-2);margin:4px 0 0;line-height:1.45;max-width:36ch}
.home{
  flex:none;margin-top:3px;background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:7px 11px;box-shadow:var(--shadow);text-decoration:none;
  font-family:"IBM Plex Mono",monospace;font-size:.7rem;font-weight:600;
  letter-spacing:.02em;color:var(--accent-ink);
}
.home:hover{border-color:var(--accent-line)}

/* ── what of mine is running ─────────────────────────────────────── */
.mine{margin-bottom:18px}
.mine:not([data-any]){display:none}
.mine .sec{margin-bottom:8px}
.sec{
  font-family:"IBM Plex Mono",monospace;font-size:.66rem;text-transform:uppercase;
  letter-spacing:.14em;color:var(--ink-3);
}
.card{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:12px;padding:12px 14px;margin-bottom:8px;color:inherit;box-shadow:var(--shadow);
}
.card:hover{border-color:var(--line-2);border-left-color:var(--accent)}
.card .who{min-width:0;flex:1}
.card .venue{display:block;font-weight:700;font-size:.92rem;letter-spacing:-.02em;overflow-wrap:anywhere}
.card .what{display:block;font-size:.78rem;color:var(--ink-2);margin-top:2px}
.card .code{display:flex;align-items:center;gap:6px;margin-top:5px;font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--ink-3)}
.card .when{font-family:"IBM Plex Mono",monospace;font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums;flex:none;color:var(--accent-ink)}
.card .when small{display:block;font-size:.56rem;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);text-align:right;margin-top:2px}

/* ── the filter ──────────────────────────────────────────────────── */
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.kinds button{
  font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.04em;padding:8px 13px;
  border-radius:99px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
}
.kinds button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* ── the stalls ──────────────────────────────────────────────────── */
/* A stall is chosen with the eyes and bought on trust, so the card leads
   with the cut and says who stands behind it before it says the price. Sans
   for everything a person reads; mono only for the numbers. */
.tally{font-size:.8rem;color:var(--ink-3);margin:-6px 0 12px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.trust div{
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;
  display:flex;flex-direction:column;gap:5px;
}
.trust svg{width:18px;height:18px;fill:none;stroke:var(--ready);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.trust b{font-size:.76rem;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.trust span{font-size:.68rem;color:var(--ink-3);line-height:1.35}
@media(max-width:380px){.trust{grid-template-columns:1fr 1fr}.trust div:last-child{grid-column:1 / -1}}

.listings{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.listing{
  display:flex;align-items:stretch;gap:14px;width:100%;text-align:left;color:inherit;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;
  box-shadow:var(--shadow);transition:border-color .15s,transform .15s;
}
.listing:hover{border-color:var(--accent-line)}
.listing:active{transform:scale(.995)}
.listing[data-gone]{opacity:.55}
.listing .art{
  width:88px;height:88px;flex:none;border-radius:8px;border:1px solid var(--line);
  background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-ink);
  overflow:hidden;align-self:center;
}
.listing .art img{width:100%;height:100%;object-fit:cover;display:block}
.listing .art svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.listing .who{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
.listing .name{font-weight:800;font-size:1.02rem;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.listing .from{font-size:.8rem;color:var(--ink-2);line-height:1.35;overflow-wrap:anywhere}
.listing .from .verified{margin-right:6px}
.bits{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.76rem;color:var(--ink-2);line-height:1.4}
.bits span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.bits svg{width:13px;height:13px;flex:none;fill:none;stroke:var(--ink-3);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.listing .row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:2px}
.listing .left{font-size:.74rem;color:var(--ink-3)}
.listing .left[data-low]{color:var(--hold);font-weight:600}
.listing .left[data-gone]{color:var(--stop);font-weight:600}
.listing .price{text-align:right;flex:none}
.listing .price b{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:1.02rem;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--ink);
}
.listing .price small{display:block;font-size:.68rem;color:var(--ink-3);margin-top:1px}
.verified{
  display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:.72rem;font-weight:600;
  color:var(--ready);background:var(--ready-soft);border:1px solid var(--ready-line);
  border-radius:99px;padding:2px 8px 2px 6px;vertical-align:middle;
}
.verified svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:.86rem;line-height:1.5}

/* ── the screen ──────────────────────────────────────────────────── */
/* Full screen, not a sheet. A sheet says "a moment"; buying a winter's meat
   is not a moment, and somebody new to apps needs the whole screen to say
   one thing at a time. It slides in from the right and the bar on top says
   where back goes, which is what the phone taught them. */
.screen{
  position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  transform:translateX(100%);visibility:hidden;
  transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;
}
.screen[data-open]{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){.screen{transition:none}}
@media(min-width:640px){
  .screen{left:50%;right:auto;width:560px;transform:translate(-50%,0) translateX(120%)}
  .screen[data-open]{transform:translate(-50%,0)}
}
.bar{
  flex:none;position:relative;display:flex;align-items:center;justify-content:center;
  min-height:52px;padding:env(safe-area-inset-top) 56px 0;
  background:color-mix(in srgb,var(--surface) 82%,transparent);
  -webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1);
  border-bottom:1px solid var(--line);
}
.bar .back{
  position:absolute;left:4px;bottom:0;height:52px;padding:0 10px 0 6px;display:inline-flex;align-items:center;gap:2px;
  background:none;border:none;color:var(--accent-ink);font-family:"Golos Text",sans-serif;font-size:1rem;font-weight:600;
}
.bar .back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bar .bar-title{text-align:center;min-width:0;padding:8px 0}
.bar .bar-title b{display:block;font-size:1rem;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .bar-title span{display:block;font-size:.72rem;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:16px}
.screen-foot{
  flex:none;border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.screen-foot:empty{display:none}
.foot-row{display:flex;align-items:center;gap:14px}
.foot-row .sum{flex:1;min-width:0}
.foot-row .sum b{display:block;font-family:"IBM Plex Mono",monospace;font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.foot-row .sum span{display:block;font-size:.72rem;color:var(--ink-3)}
.foot-row .btn{flex:none;min-width:46%;padding:14px 18px;font-size:.92rem;border-radius:12px;font-family:"Golos Text",sans-serif;font-weight:700;letter-spacing:0}
.why{font-size:.78rem;color:var(--hold);margin:0 0 8px;display:flex;align-items:center;gap:6px}
.why svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.screen .btn[data-size="lg"]{border-radius:12px;padding:15px;font-family:"Golos Text",sans-serif;font-weight:700;font-size:.95rem;letter-spacing:0}

.hero{height:220px;background:var(--accent-soft);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.head{padding:16px 16px 6px}
.head h2{font-size:1.4rem;font-weight:900;letter-spacing:-.03em;line-height:1.15}
.head .from{font-size:.9rem;color:var(--ink-2);margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.head .bits{margin-top:8px;font-size:.82rem}
.about{
  margin:12px 16px 0;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  font-size:.9rem;color:var(--ink-2);line-height:1.5;
}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 16px 0}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.facts .lab{display:block;margin-bottom:3px}
.facts b{font-family:"IBM Plex Mono",monospace;font-size:.92rem;font-weight:600;font-variant-numeric:tabular-nums}

/* one question per step, numbered, so nobody wonders what to do next */
.step{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.step .q{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.step .n{
  width:26px;height:26px;border-radius:99px;background:var(--ink);color:var(--bg);flex:none;
  display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:.78rem;font-weight:600;
}
.step .q b{font-size:1rem;font-weight:700;letter-spacing:-.01em}
.step .help{font-size:.8rem;color:var(--ink-3);line-height:1.45;margin-top:8px}
.step .help b{color:var(--ink-2);font-weight:600}

.qty{display:flex;align-items:center;gap:10px}
.qty button{
  width:48px;height:48px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface-2);
  color:var(--ink);font-size:1.5rem;line-height:1;flex:none;
}
.qty button:active{background:var(--sunk)}
.qty button[disabled]{opacity:.35}
.qty output{
  flex:1;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:1.5rem;font-weight:600;
  font-variant-numeric:tabular-nums;
}
.qty output small{display:block;font-family:"Golos Text",sans-serif;font-size:.74rem;font-weight:500;color:var(--ink-3);margin-top:2px}
.sumline{margin-top:10px;font-family:"IBM Plex Mono",monospace;font-size:.82rem;color:var(--ink-2);font-variant-numeric:tabular-nums;text-align:center}

.choice{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;margin-top:8px;
  border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);color:var(--ink);
  font-family:"Golos Text",sans-serif;min-height:64px;
}
.choice:first-of-type{margin-top:0}
.choice .dot{
  width:22px;height:22px;border-radius:99px;border:2px solid var(--line-2);flex:none;display:grid;place-items:center;
}
.choice .dot svg{width:12px;height:12px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.choice .txt{flex:1;min-width:0}
.choice .txt b{display:block;font-size:.98rem;font-weight:700}
.choice .txt small{display:block;font-size:.8rem;color:var(--ink-2);margin-top:2px;line-height:1.4}
.choice .tag{flex:none;font-family:"IBM Plex Mono",monospace;font-size:.82rem;font-weight:600;color:var(--ink-2)}
.choice[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice[aria-checked="true"] .dot{border-color:var(--accent);background:var(--accent)}
.choice[aria-checked="true"] .dot svg{opacity:1}
.choice[aria-checked="true"] .txt b{color:var(--accent-ink)}
.choice[disabled]{opacity:.45}

input[type="date"],input[type="text"],input[type="tel"],textarea{
  width:100%;padding:13px 12px;border:1.5px solid var(--line-2);border-radius:12px;
  background:var(--surface-2);color:var(--ink);font-family:"Golos Text",sans-serif;font-size:1.02rem;
  -webkit-appearance:none;appearance:none;
}
input[type="date"]{font-family:"IBM Plex Mono",monospace;min-height:50px}
textarea{min-height:76px;resize:vertical;line-height:1.45}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.field+.field{margin-top:10px}
.field label{display:block;font-size:.8rem;color:var(--ink-2);margin-bottom:6px;font-weight:600}
.mapbox{height:190px;border:1.5px solid var(--line-2);border-radius:12px;overflow:hidden;background:#f5f3ef;position:relative;margin-top:10px}
.mapbox .tip{
  position:absolute;left:10px;bottom:10px;z-index:2;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:5px 10px;font-size:.76rem;color:var(--ink-2);
}

.note{
  background:var(--hold-soft);border:1px solid var(--hold-line);border-left:3px solid var(--hold);
  border-radius:8px;padding:12px 14px;margin:14px 16px 0;
}
.note b{display:block;font-size:.9rem;color:var(--ink);margin-bottom:3px}
.note span{font-size:.82rem;color:var(--ink-2);line-height:1.5}

/* ── the review ──────────────────────────────────────────────────── */
.review{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.review .r{display:flex;justify-content:space-between;gap:14px;padding:12px 14px;border-top:1px solid var(--line);font-size:.92rem;line-height:1.4}
.review .r:first-child{border-top:none}
.review .r span{color:var(--ink-3);flex:none}
.review .r b{font-weight:600;text-align:right;overflow-wrap:anywhere}
.review .r b small{display:block;font-weight:400;color:var(--ink-2);font-size:.82rem}
.review .r.total{background:var(--surface-2)}
.review .r.total b{font-family:"IBM Plex Mono",monospace;font-size:1.1rem;font-variant-numeric:tabular-nums}
.review .r .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.promise{margin:14px 16px 0;display:flex;flex-direction:column;gap:10px}
.promise div{display:flex;gap:10px;align-items:flex-start;font-size:.86rem;color:var(--ink-2);line-height:1.45}
.promise svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--ready);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.promise b{color:var(--ink)}

/* ── the status ──────────────────────────────────────────────────── */
.status{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 18px;text-align:center;margin:14px 16px 0}
.status .big{font-size:1.9rem;font-weight:900;letter-spacing:-.04em;line-height:1.05}
.status .cap{font-size:.86rem;color:var(--ink-2);margin-top:8px;line-height:1.45}
.status[data-s="PREPARING"] .big{color:var(--accent-ink)}
.status[data-s="READY"] .big,.status[data-s="HANDED"] .big{color:var(--ready)}
.status[data-s="DISPATCHED"] .big{color:var(--route)}
.timeline{list-style:none;margin:16px 0 0;padding:0;text-align:left}
.timeline li{display:grid;grid-template-columns:1.2rem 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:.92rem}
.timeline .d{width:12px;height:12px;border-radius:99px;border:2px solid var(--line-2);margin-top:4px}
.timeline li[data-done] .d{background:var(--ready);border-color:var(--ready)}
.timeline li[data-done] .w{color:var(--ink)}
.timeline li:not([data-done]) .w{color:var(--ink-3)}
.handcode{margin:14px 16px 0;padding:16px;border:1.5px dashed var(--line-2);border-radius:12px;text-align:center;background:var(--surface)}
.handcode .lab{display:block;margin-bottom:4px}
.handcode b{font-family:"IBM Plex Mono",monospace;font-size:2.4rem;font-weight:600;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.where{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px;font-size:.92rem;line-height:1.5}
.where > div{padding:10px 0;border-top:1px solid var(--line)}
.where > div:first-child{border-top:none}
.where .lab{display:block;margin-bottom:3px}
.where a{color:var(--accent-ink);font-family:"IBM Plex Mono",monospace;font-weight:600}
</style>
</head>
<body>

<main class="wrap" id="list">
  <div class="top">
    <div>
      <h1>Өвлийн идэш</h1>
      <p class="sub">Гэрээт малчин, махны газраас. Үнэ нь зар дээр бичсэнээрээ эцсийнх.</p>
    </div>
    <a class="home" href="/" id="home" aria-label="Basu нүүр">‹ Basu</a>
  </div>

  <p class="tally" id="tally"></p>

  <!-- The three things a buyer is trusting. All three are true by
       construction: contract, fixed price, refund before PREPARING. -->
  <div class="trust" aria-label="Баталгаа">
    <div>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
      <b>Гэрээт нийлүүлэгч</b>
      <span>Basu шалгаж, гэрээ байгуулсан</span>
    </div>
    <div>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12l-8 8-8-8V4h8l8 8z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg>
      <b>Үнэ эцсийнх</b>
      <span>Зар дээр бичсэнээс өөрчлөгдөхгүй</span>
    </div>
    <div>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg>
      <b>Үнэгүй цуцлалт</b>
      <span>Нийлүүлэгч бэлтгэж эхлэх хүртэл</span>
    </div>
  </div>

  <section class="mine" id="mine">
    <h2 class="sec">Миний идэш</h2>
    <div id="mine-list"></div>
  </section>

  <div class="kinds" id="kinds" role="group" aria-label="Малын төрөл"></div>
  <ul class="listings" id="listings"><li class="empty">Зар ачаалж байна…</li></ul>
</main>

<section class="screen" id="screen" aria-label="Зар">
  <header class="bar">
    <button class="back" type="button" id="screen-back" aria-label="Буцах">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Буцах
    </button>
    <div class="bar-title"><b id="screen-title">—</b><span id="screen-sub"></span></div>
  </header>
  <div class="screen-body" id="screen-body"></div>
  <footer class="screen-foot" id="screen-foot"></footer>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.js"></script>
<script type="module">
import { api, store, shell, toast, mnt, IDESH_HEADLINE, KIND, dayLabel, dayShort } from '/api.js';
import { mapStyle, ULAANBAATAR } from '/mapStyle.js';

const $ = (id) => document.getElementById(id);
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};

/** Guest text goes into the DOM as text, never as markup. */
function escapeHtml(value) {
  const node = document.createElement('span');
  node.textContent = value ?? '';
  return node.innerHTML;
}

/**
 * A photograph of the cut, per kind of animal — Basu's own four, served from
 * /idesh/<kind>.jpg. Not a supplier's picture: uploads, storage and
 * moderation are a second release. Below it, one drawing per kind in the
 * launcher's stroke, which is what shows if a picture fails to arrive — a
 * list with holes in it sells nothing.
 */
const PHOTO = (kind) => `/idesh/${kind}.jpg`;

const ART = {
  sheep: `<svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 9.5a3 3 0 0 1 3-3.8 3.2 3.2 0 0 1 5.6 0 3 3 0 0 1 3.4 3.4 3 3 0 0 1-.4 5.6H7.3a3 3 0 0 1-.8-5.2Z"/>
            <path d="M8.5 15v4M15.5 15v4"/>
            <path d="M3.5 10.5h3"/>
          </svg>`,
  goat: `<svg viewBox="0 0 24 24" aria-hidden="true">
           <path d="M6 11.5h10.5a3 3 0 0 1 0 6H8a2.5 2.5 0 0 1 0-5"/>
           <path d="M6 11.5 4 8M7.5 11.5l.5-4"/>
           <path d="M9 17.5v3M15 17.5v3"/>
         </svg>`,
  beef: `<svg viewBox="0 0 24 24" aria-hidden="true">
           <path d="M7 9.5v8a5 5 0 0 0 10 0v-8"/>
           <path d="M7 9.5C5 9 3.5 7 4 4.5M17 9.5c2-.5 3.5-2.5 3-5"/>
           <path d="M9.5 15h1M13.5 15h1"/>
         </svg>`,
  horse: `<svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 20V11l4-6 3 2v3l4 3-1.5 2-3-1.5V20"/>
            <path d="M12 5 10.5 3M14.5 7.5l1.6-1.4"/>
          </svg>`,
};

/** The little marks on a row. Same stroke as the launcher's, one colour. */
const MARK = {
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  pin: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>',
  day: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg>',
  truck: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg>',
  shield: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>',
  tag: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12l-8 8-8-8V4h8l8 8z"/><circle cx="8.5" cy="8.5" r="1.3"/></svg>',
  undo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg>',
  phone: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h4l2 5-2.5 1.5a11 11 0 0 0 5 5L16 12l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"/></svg>',
  warn: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>',
};

const state = {
  today: null,
  listings: [],
  kind: 'all',
  listing: null,
  /** The form the guest is filling in. */
  form: null,
  mine: [],
  orderId: null,
  map: null,
  /** Which screen is up: null, 'detail', 'review' or 'status'. */
  screen: null,
};

/**
 * The page is on its way out. A request already in flight still lands after
 * `pagehide`, and drawing its answer into a document that is being torn down
 * is an error in a test and wasted work in a browser — so every path that
 * awaits the server and then touches the page checks this first.
 */
let gone = false;

/* ── signing in ──────────────────────────────────────────────────── */

async function signIn() {
  // Inside the phone app the sheet is the shell's, and so is the token.
  if (shell.present) return shell.signIn();
  const { token } = await api('/dev/login', { method: 'POST', body: {} });
  store.guestToken = token;
  return token;
}

/** Every call that needs a guest. A dead token means sign in again — once. */
async function guestApi(path, options = {}) {
  const token = store.guestToken ?? (await signIn());
  try {
    return await api(path, { ...options, token });
  } catch (error) {
    if (error.status !== 401) throw error;
    store.guestToken = null;
    return api(path, { ...options, token: await signIn() });
  }
}

/* ── the stalls ──────────────────────────────────────────────────── */

async function loadListings() {
  const { today, listings } = await api('/v1/idesh/listings');
  if (gone) return;
  state.today = today;
  state.listings = listings;
  paintKinds();
  paintListings();
}

function paintKinds() {
  const box = $('kinds');
  box.replaceChildren();
  const present = new Set(state.listings.map((l) => l.kind));
  const options = [['all', 'Бүгд'], ...Object.entries(KIND).filter(([k]) => present.has(k))];
  for (const [key, label] of options) {
    const button = el(
      `<button type="button" aria-pressed="${state.kind === key}" data-kind="${key}">${label}</button>`,
    );
    button.addEventListener('click', () => {
      state.kind = key;
      paintKinds();
      paintListings();
    });
    box.append(button);
  }
}

const unitWord = (l) => (l.unit === 'whole' ? 'толгой' : 'кг');

/** «бүтэн · ~38 кг» / «1 кг · доод тал нь 20 кг» — what the price is for. */
function priceFor(l) {
  return l.unit === 'whole' ? `бүтэн · ~${l.approx_kg} кг` : `1 кг · доод тал нь ${l.min_qty} кг`;
}

function paintListings() {
  const list = $('listings');
  list.replaceChildren();
  const shown = state.listings.filter((l) => state.kind === 'all' || l.kind === state.kind);

  const suppliers = new Set(state.listings.map((l) => l.supplier.id)).size;
  $('tally').textContent = state.listings.length
    ? `${state.listings.length} зар · ${suppliers} гэрээт нийлүүлэгч`
    : '';

  if (!shown.length) {
    list.append(
      el(`<li class="empty">Одоогоор зар алга.<br>Өвлийн идэшний зар 10–11-р сард гарна.</li>`),
    );
    return;
  }
  for (const l of shown) {
    const gone_ = l.remaining === 0;
    // Three left of twenty is worth saying louder than seventeen of twenty.
    const low = !gone_ && l.remaining <= Math.max(2, Math.ceil(l.quantity * 0.15));
    const item = el(`
      <li>
        <button class="listing" type="button" data-kind="${l.kind}" data-id="${l.id}"${gone_ ? ' data-gone' : ''}>
          <span class="art"><img src="${PHOTO(l.kind)}" alt="" loading="lazy" width="88" height="88"></span>
          <span class="who">
            <span class="name">${escapeHtml(l.title)}</span>
            <span class="from">${
              l.supplier.contracted ? `<i class="verified">${MARK.check}Гэрээт</i>` : ''
            }${escapeHtml(l.supplier.name)}</span>
            <span class="bits">
              <span>${MARK.pin}${escapeHtml(l.origin)}</span>
              <span>${MARK.day}${dayLabel(l.ready_from)}-нөөс</span>
              ${l.delivers ? `<span>${MARK.truck}Хүргэлттэй</span>` : ''}
            </span>
            <span class="row">
              <span class="left"${gone_ ? ' data-gone' : low ? ' data-low' : ''}>${
                gone_ ? 'Дууссан' : `${l.remaining} ${unitWord(l)} үлдсэн`
              }</span>
              <span class="price"><b>${mnt(l.price_mnt)}</b><small>${priceFor(l)}</small></span>
            </span>
          </span>
        </button>
      </li>`);
    item.querySelector('button').addEventListener('click', () => openListing(l));
    // The picture did not come: the drawn mark stands in, and the row stays whole.
    const picture = item.querySelector('.art img');
    picture.addEventListener('error', () => {
      picture.parentElement.innerHTML = ART[l.kind] ?? '';
    });
    list.append(item);
  }
}

/* ── the screen ──────────────────────────────────────────────────── */

/**
 * One screen, three faces: the stall with its form, the review, the status.
 * Each face is a history entry, so the phone's own back — and the bar's
 * «Буцах» — walk out the way the person walked in.
 */
function showScreen(name, title, sub, { replace = false } = {}) {
  $('screen-title').textContent = title;
  $('screen-sub').textContent = sub;
  $('screen-body').replaceChildren();
  $('screen-foot').replaceChildren();
  $('screen-body').scrollTop = 0;
  const first = state.screen === null;
  state.screen = name;
  $('screen').dataset.open = '1';
  document.body.style.overflow = 'hidden';
  if (replace && !first) history.replaceState({ screen: name }, '');
  else history.pushState({ screen: name }, '');
}

function closeScreen() {
  $('screen').removeAttribute('data-open');
  document.body.style.overflow = '';
  state.screen = null;
  state.listing = null;
  state.form = null;
  state.orderId = null;
  dropMap();
  const url = new URL(location.href);
  if (url.searchParams.has('order')) {
    url.searchParams.delete('order');
    history.replaceState(null, '', url);
  }
}

function dropMap() {
  if (state.map) {
    state.map.remove?.();
    state.map = null;
  }
}

/** «Буцах» is history: the face underneath, or the list. */
$('screen-back').addEventListener('click', () => history.back());

addEventListener('popstate', (event) => {
  const face = event.state?.screen ?? null;
  if (!face) {
    closeScreen();
    return;
  }
  // Walking back onto a face that is still meaningful redraws it in place.
  if (face === 'detail' && state.listing) renderDetail({ replace: true });
  else if (face === 'review' && state.listing) renderReview({ replace: true });
  else if (face === 'status' && state.orderId) void showStatus(true, { replace: true });
  else closeScreen();
});

/** The soonest day the guest may ask for: when the meat exists, and not the past. */
const earliest = (l) => (l.ready_from > state.today ? l.ready_from : state.today);

function openListing(l) {
  state.listing = l;
  state.orderId = null;
  state.form = {
    qty: l.min_qty,
    receive: 'pickup',
    receiveOn: earliest(l),
    address: '',
    phone: '',
    lat: null,
    lon: null,
  };
  renderDetail();
}

/** The same picture, larger, at the top of the screen. */
function hero(kind) {
  const box = el(`<div class="hero"><img src="${PHOTO(kind)}" alt="" width="560" height="220"></div>`);
  box.querySelector('img').addEventListener('error', () => box.remove());
  return box;
}

function total() {
  const l = state.listing;
  const f = state.form;
  return l.price_mnt * f.qty + (f.receive === 'delivery' ? l.delivery_fee_mnt : 0);
}

/** What still has to be answered before the order can be looked at. */
function missing() {
  const f = state.form;
  if (f.receive === 'delivery' && (!f.address.trim() || !f.phone.trim())) return 'Хаяг, залгах утсаа оруулна уу';
  if (!f.receiveOn) return 'Өдрөө сонгоно уу';
  return null;
}

/* ── the stall, and the four questions ───────────────────────────── */

function renderDetail({ replace = false } = {}) {
  const l = state.listing;
  const f = state.form;
  showScreen('detail', l.title, l.supplier.name, { replace });
  const body = $('screen-body');

  body.append(hero(l.kind));
  body.append(
    el(`<div class="head">
          <h2>${escapeHtml(l.title)}</h2>
          <div class="from">${l.supplier.contracted ? `<i class="verified">${MARK.check}Гэрээт нийлүүлэгч</i>` : ''}${escapeHtml(l.supplier.name)}</div>
          <div class="bits">
            <span>${MARK.pin}${escapeHtml(l.origin)}</span>
            <span>${MARK.day}${dayLabel(l.ready_from)}-нөөс бэлэн</span>
            ${l.delivers ? `<span>${MARK.truck}Хүргэлттэй</span>` : ''}
          </div>
        </div>`),
  );
  if (l.note) body.append(el(`<div class="about">${escapeHtml(l.note)}</div>`));
  body.append(
    el(`<div class="facts">
          <div><span class="lab">Үнэ</span><b>${mnt(l.price_mnt)} / ${unitWord(l)}</b></div>
          <div><span class="lab">${l.unit === 'whole' ? 'Ойролцоо жин' : 'Доод захиалга'}</span><b>${
            l.unit === 'whole' ? `~${l.approx_kg} кг` : `${l.min_qty} кг`
          }</b></div>
          <div><span class="lab">Бэлэн болох</span><b>${dayLabel(l.ready_from)}</b></div>
          <div><span class="lab">Үлдсэн</span><b>${l.remaining} ${unitWord(l)}</b></div>
        </div>`),
  );

  if (l.remaining === 0) {
    body.append(el(`<div class="note"><b>Энэ зар дууссан</b><span>Нийлүүлэгч дахин нэмбэл энд гарна.</span></div>`));
    return;
  }

  /* 1 · how much */
  const step = l.unit === 'whole' ? 1 : 5;
  const qty = el(`
    <div class="step" id="step-qty">
      <div class="q"><span class="n">1</span><b>${l.unit === 'whole' ? 'Хэдэн толгой авах вэ?' : 'Хэдэн кг авах вэ?'}</b></div>
      <div class="qty">
        <button type="button" data-d="-1" aria-label="Хасах">−</button>
        <output id="qty">${f.qty}<small>${unitWord(l)}</small></output>
        <button type="button" data-d="1" aria-label="Нэмэх">+</button>
      </div>
      <div class="sumline" id="sumline"></div>
      <div class="help">${
        l.unit === 'whole'
          ? `Нэг толгой ойролцоогоор <b>${l.approx_kg} кг</b>. Хоёр айл нэг мал хувааж авч болно.`
          : `Доод тал нь <b>${l.min_qty} кг</b>. ${step} кг-аар нэмэгдэнэ.`
      }</div>
    </div>`);
  const paintQty = () => {
    qty.querySelector('#qty').innerHTML = `${f.qty}<small>${unitWord(l)}</small>`;
    qty.querySelector('#sumline').textContent = `${f.qty} ${unitWord(l)} × ${mnt(l.price_mnt)} = ${mnt(l.price_mnt * f.qty)}`;
    qty.querySelector('[data-d="-1"]').disabled = f.qty <= l.min_qty;
    qty.querySelector('[data-d="1"]').disabled = f.qty >= l.remaining;
  };
  qty.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button || button.disabled) return;
    f.qty = Math.min(l.remaining, Math.max(l.min_qty, f.qty + Number(button.dataset.d) * step));
    paintQty();
    renderFoot();
  });
  paintQty();
  body.append(qty);

  /* 2 · how to receive it */
  const pick = el(`
    <div class="step" id="step-receive">
      <div class="q"><span class="n">2</span><b>Хэрхэн авах вэ?</b></div>
      <div role="radiogroup" aria-label="Хэрхэн авах">
        <button class="choice" type="button" role="radio" data-r="pickup" aria-checked="${f.receive === 'pickup'}">
          <span class="dot">${MARK.check}</span>
          <span class="txt"><b>Өөрөө очиж авна</b><small>${escapeHtml(l.supplier.pickup_address)}</small></span>
          <span class="tag">үнэгүй</span>
        </button>
        <button class="choice" type="button" role="radio" data-r="delivery" aria-checked="${f.receive === 'delivery'}"${l.delivers ? '' : ' disabled'}>
          <span class="dot">${MARK.check}</span>
          <span class="txt"><b>Гэрт хүргүүлнэ</b><small>${l.delivers ? 'Нийлүүлэгч таны хаяг руу хүргэнэ' : 'Энэ нийлүүлэгч хүргэлт хийдэггүй'}</small></span>
          <span class="tag">${l.delivers ? `+${mnt(l.delivery_fee_mnt)}` : ''}</span>
        </button>
      </div>
    </div>`);
  body.append(pick);

  /* 3 · when */
  const when = el(`
    <div class="step" id="step-when">
      <div class="q"><span class="n">3</span><b></b></div>
      <input type="date" id="when" min="${earliest(l)}" value="${f.receiveOn}" aria-label="Өдөр">
      <div class="help">Хамгийн эрт <b>${dayLabel(earliest(l))}</b> — мах тэр өдрөөс бэлэн. Дараа нь нийлүүлэгч утсаар цагийг тохирно.</div>
    </div>`);
  when.querySelector('input').addEventListener('change', (event) => {
    f.receiveOn = event.target.value;
    renderFoot();
  });
  body.append(when);

  /**
   * Changing how the meat arrives changes the page in place — the check,
   * the third question's wording, the fourth question coming or going —
   * and nothing else moves. Redrawing the screen here threw the person back
   * to the top with the choice they had just made out of sight; scrolling
   * to the new question instead was a jump the other way. Nothing scrolls.
   */
  const settle = () => {
    for (const choice of pick.querySelectorAll('.choice')) {
      choice.setAttribute('aria-checked', String(choice.dataset.r === f.receive));
    }
    when.querySelector('.q b').textContent = f.receive === 'delivery' ? 'Хэзээ хүргүүлэх вэ?' : 'Хэзээ очиж авах вэ?';
    let where = body.querySelector('#step-where');
    if (f.receive === 'delivery' && !where) {
      where = whereStep(f);
      when.insertAdjacentElement('afterend', where);
      mountMap(where.querySelector('#mapbox'));
    } else if (f.receive !== 'delivery' && where) {
      dropMap();
      where.remove();
    }
    renderFoot();
  };
  pick.addEventListener('click', (event) => {
    const button = event.target.closest('button');
    if (!button || button.disabled || button.dataset.r === f.receive) return;
    f.receive = button.dataset.r;
    settle();
  });
  settle();
}

/** 4 · where, for a delivery. Built only when asked for, dropped when not. */
function whereStep(f) {
  const where = el(`
    <div class="step" id="step-where">
      <div class="q"><span class="n">4</span><b>Хаана хүргэх вэ?</b></div>
      <div class="field">
        <label for="address">Хаяг</label>
        <textarea id="address" placeholder="Дүүрэг, хороолол, байр, орц, тоот">${escapeHtml(f.address)}</textarea>
      </div>
      <div class="field">
        <label for="phone">Хүргэгчийн залгах утас</label>
        <input type="tel" id="phone" inputmode="tel" placeholder="+976 XXXX XXXX" value="${escapeHtml(f.phone)}">
      </div>
      <div class="field">
        <label>Газрын зураг дээр цэг <span style="font-weight:400;color:var(--ink-3)">— заавал биш, хүргэгчид тусална</span></label>
        <div class="mapbox" id="mapbox"><span class="tip" id="maptip">Байшингаа дарж цэг тавина уу</span></div>
      </div>
    </div>`);
  where.querySelector('#address').addEventListener('input', (e) => {
    f.address = e.target.value;
    renderFoot();
  });
  where.querySelector('#phone').addEventListener('input', (e) => {
    f.phone = e.target.value;
    renderFoot();
  });
  return where;
}

/**
 * A small map for one pin. The address in words is what the courier reads;
 * the pin is what they navigate by, and it is the one thing a text field
 * cannot carry. Lazily built, because most orders are collected and a map
 * nobody asked for is the slowest thing on the page.
 */
function mountMap(container) {
  dropMap();
  if (typeof maplibregl === 'undefined') return;
  const f = state.form;
  const map = new maplibregl.Map({
    container,
    style: mapStyle(),
    center: f.lon ? [f.lon, f.lat] : [ULAANBAATAR.lon, ULAANBAATAR.lat],
    zoom: 13.2,
    attributionControl: false,
  });
  state.map = map;
  const PIN = 'drop';
  map.on('load', () => {
    map.addSource(PIN, { type: 'geojson', data: pinData() });
    map.addLayer({
      id: 'drop-pin',
      type: 'circle',
      source: PIN,
      paint: { 'circle-radius': 8, 'circle-color': '#C64E08', 'circle-stroke-color': '#fff', 'circle-stroke-width': 2 },
    });
  });
  map.on('click', (event) => {
    f.lat = Number(event.lngLat.lat.toFixed(6));
    f.lon = Number(event.lngLat.lng.toFixed(6));
    map.getSource(PIN)?.setData(pinData());
    const tip = document.getElementById('maptip');
    if (tip) tip.textContent = 'Цэг тавигдлаа ✓';
  });
  function pinData() {
    return {
      type: 'FeatureCollection',
      features: f.lat
        ? [{ type: 'Feature', geometry: { type: 'Point', coordinates: [f.lon, f.lat] }, properties: {} }]
        : [],
    };
  }
}

/** The bottom of the stall screen: the total so far, and the way on. */
function renderFoot() {
  const l = state.listing;
  const f = state.form;
  const foot = $('screen-foot');
  foot.replaceChildren();
  if (!l || !f || l.remaining === 0 || state.screen !== 'detail') return;

  const needs = missing();
  if (needs) foot.append(el(`<p class="why">${MARK.warn}${needs}</p>`));
  const row = el(`
    <div class="foot-row">
      <div class="sum"><b>${mnt(total())}</b><span>${f.qty} ${unitWord(l)}${f.receive === 'delivery' ? ' + хүргэлт' : ''} · нийт</span></div>
      <button class="btn" data-v="primary" type="button" id="next"${needs ? ' disabled' : ''}>Үргэлжлүүлэх ›</button>
    </div>`);
  row.querySelector('#next').addEventListener('click', () => renderReview());
  foot.append(row);
}

/* ── the review, before any money moves ──────────────────────────── */

function renderReview({ replace = false } = {}) {
  const l = state.listing;
  const f = state.form;
  showScreen('review', 'Захиалгаа шалгана уу', 'Төлөхөөс өмнө нэг харна уу', { replace });
  const body = $('screen-body');
  const delivery = f.receive === 'delivery';

  body.append(
    el(`<div class="review">
          <div class="r"><span>Зар</span><b>${escapeHtml(l.title)}<small>${escapeHtml(l.supplier.name)}</small></b></div>
          <div class="r"><span>Хэд</span><b class="mono">${f.qty} ${unitWord(l)}</b></div>
          <div class="r"><span>Авах арга</span><b>${delivery ? 'Гэрт хүргүүлнэ' : 'Өөрөө очиж авна'}<small>${
            delivery ? `${escapeHtml(f.address)} · ${escapeHtml(f.phone)}` : escapeHtml(l.supplier.pickup_address)
          }</small></b></div>
          <div class="r"><span>Өдөр</span><b>${dayLabel(f.receiveOn)}</b></div>
        </div>`),
  );
  body.append(
    el(`<div class="review">
          <div class="r"><span>${f.qty} ${unitWord(l)} × ${mnt(l.price_mnt)}</span><b class="mono">${mnt(l.price_mnt * f.qty)}</b></div>
          ${delivery ? `<div class="r"><span>Хүргэлт</span><b class="mono">${mnt(l.delivery_fee_mnt)}</b></div>` : ''}
          <div class="r total"><span>Нийт төлөх</span><b>${mnt(total())}</b></div>
        </div>`),
  );
  body.append(
    el(`<div class="promise">
          <div>${MARK.tag}<span><b>Үнэ эцсийнх.</b> Бодит жин зөрсөн ч нэмж төлөхгүй.</span></div>
          <div>${MARK.undo}<span><b>Үнэгүй цуцална</b> — нийлүүлэгч бэлтгэж эхлэх хүртэл. Мөнгө түрийвчинд буцна.</span></div>
          <div>${MARK.phone}<span><b>Төлсний дараа</b> нийлүүлэгчийн утас гарна; та ч, тэр ч залгаж чадна.</span></div>
        </div>`),
  );

  const foot = $('screen-foot');
  foot.replaceChildren();
  const row = el(`
    <div class="foot-row">
      <div class="sum"><b>${mnt(total())}</b><span>Түрийвчнээс · дутвал QPay</span></div>
      <button class="btn" data-v="primary" type="button" id="pay">Төлөх</button>
    </div>`);
  row.querySelector('#pay').addEventListener('click', placeOrder);
  foot.append(row);
}

async function placeOrder() {
  const l = state.listing;
  const f = state.form;
  const button = $('pay');
  button.disabled = true;
  button.textContent = 'Түр хүлээнэ үү…';
  try {
    const order = await guestApi('/v1/idesh', {
      method: 'POST',
      // One key per tap of «Төлөх»: a retry buys one sheep, a new tap is a
      // new intention rather than yesterday's cancelled order handed back.
      idempotencyKey: `idesh-${l.id}-${Date.now().toString(36)}`,
      body: {
        listing_id: l.id,
        qty: f.qty,
        receive: f.receive,
        receive_on: f.receiveOn,
        ...(f.receive === 'delivery'
          ? {
              address: f.address,
              address_phone: f.phone,
              ...(f.lat ? { address_lat: f.lat, address_lon: f.lon } : {}),
            }
          : {}),
      },
    });
    await guestApi(`/v1/idesh/${order.id}/pay`, { method: 'POST' });
    if (gone) return;
    // The card outside the page, on a phone, should say so now.
    shell.ordersChanged();
    state.listing = null;
    state.form = null;
    dropMap();
    state.orderId = order.id;
    rendered = null;
    // Paid: back from here goes to the list, not to a form for a sheep
    // that is already bought.
    await Promise.all([showStatus(true, { replace: true }), loadMine(), loadListings()]);
  } catch (error) {
    toast(error.message, 'bad');
    button.disabled = false;
    button.textContent = 'Төлөх';
  }
}

/* ── the status ──────────────────────────────────────────────────── */

const STEPS = [
  ['paid', 'Төлсөн'],
  ['preparing', 'Бэлтгэж байна'],
  ['ready', 'Бэлэн'],
  ['dispatched', 'Замд'],
  ['handed', 'Хүлээлгэн өгсөн'],
];

const DONE = ['HANDED', 'CLOSED', 'CANCELLED', 'REFUNDED'];

/** What the last render was of, so a poll that found no news changes nothing. */
let rendered = null;

async function showStatus(force, { replace = false } = {}) {
  if (!state.orderId) return;
  const order = await guestApi(`/v1/idesh/${state.orderId}`);
  if (gone || !state.orderId) return;

  const signature = [order.state, order.receipt ? 'receipt' : ''].join('|');
  // A poll that found no news changes nothing. News redraws: the supplier
  // starting is worth it.
  if (!force && signature === rendered) return;
  if (rendered !== null && signature !== rendered) shell.ordersChanged();
  rendered = signature;

  const [word, cap] = IDESH_HEADLINE[order.state] ?? [order.state, ''];
  showScreen('status', `№${order.code}`, `${order.supplier.name} · ${order.title} ×${order.qty}`, {
    replace: replace || state.screen === 'status',
  });

  const body = $('screen-body');
  const card = el(`
    <div class="status" data-s="${order.state}">
      <div class="lab">${order.state}</div>
      <div class="big">${word}</div>
      <div class="cap">${cap}</div>
    </div>`);

  const done = {
    paid: Boolean(order.paid_at),
    preparing: Boolean(order.preparing_at),
    ready: Boolean(order.ready_at),
    dispatched: Boolean(order.dispatched_at),
    handed: Boolean(order.handed_at),
  };
  const timeline = el('<ul class="timeline"></ul>');
  for (const [key, label] of STEPS) {
    // A pickup never goes on the road, so that step is not shown as missing.
    if (key === 'dispatched' && order.receive !== 'delivery') continue;
    timeline.append(el(`<li${done[key] ? ' data-done' : ''}><i class="d"></i><span class="w">${label}</span></li>`));
  }
  card.append(timeline);
  body.append(card);

  // The code is what the guest shows at the handover: big, because it will be
  // read across a counter or a courtyard.
  if (['PAID', 'PREPARING', 'READY', 'DISPATCHED'].includes(order.state)) {
    body.append(
      el(`<div class="handcode"><span class="lab">Авахдаа энэ кодыг хэлнэ</span><b>${order.code}</b></div>`),
    );
  }

  const where = el(`<div class="where"></div>`);
  if (order.receive === 'delivery') {
    where.append(
      el(`<div><span class="lab">Хүргэлт · ${dayLabel(order.receive_on)}</span>${escapeHtml(order.address)}<br>
          <span style="color:var(--ink-3)">Залгах: ${escapeHtml(order.address_phone)}</span></div>`),
    );
  } else {
    where.append(
      el(`<div><span class="lab">Очиж авах · ${dayLabel(order.receive_on)}</span>${escapeHtml(order.pickup_address)}</div>`),
    );
  }
  if (order.supplier_phone) {
    where.append(
      el(`<div><span class="lab">Нийлүүлэгч</span>${escapeHtml(order.supplier.name)}<br>
          <a href="tel:${order.supplier_phone}">${order.supplier_phone}</a></div>`),
    );
  }
  where.append(
    el(`<div><span class="lab">Төлбөр</span>${mnt(order.total_mnt)}${
      order.delivery_fee_mnt ? ` <span style="color:var(--ink-3)">(хүргэлт ${mnt(order.delivery_fee_mnt)} орсон)</span>` : ''
    }</div>`),
  );
  body.append(where);

  if (order.receipt) {
    body.append(el(`<div class="note"><b>Е-баримт</b><span>Сугалаа ${order.receipt.lottery}</span></div>`));
  }

  const foot = $('screen-foot');
  foot.replaceChildren();
  if (order.can_cancel) {
    const cancel = el(
      `<button class="btn" data-v="danger" data-size="lg" type="button">Үнэгүй цуцлах — бэлтгэж эхлэх хүртэл</button>`,
    );
    cancel.addEventListener('click', async () => {
      try {
        await guestApi(`/v1/idesh/${state.orderId}/cancel`, { method: 'POST' });
        toast('Цуцлагдлаа. Мөнгө түрийвчинд буцна.');
        shell.ordersChanged();
      } catch (error) {
        toast(error.message, 'bad');
      }
      if (gone) return;
      await Promise.all([showStatus(true), loadMine(), loadListings()]);
    });
    foot.append(cancel);
  }
  if (DONE.includes(order.state)) {
    const again = el('<button class="btn" data-size="lg" type="button">Зар үзэх</button>');
    again.addEventListener('click', () => history.back());
    foot.append(again);
  }
}

/* ── what of mine is running ─────────────────────────────────────── */

async function loadMine() {
  if (!store.guestToken) return paintMine([]);
  try {
    const { orders } = await guestApi('/v1/idesh');
    if (gone) return;
    paintMine(orders);
  } catch {
    if (!gone) paintMine([]);
  }
}

function paintMine(orders) {
  state.mine = orders;
  const list = $('mine-list');
  list.replaceChildren();
  if (!orders.length) {
    $('mine').removeAttribute('data-any');
    return;
  }
  $('mine').dataset.any = String(orders.length);
  for (const order of orders) {
    const [word, cap] = IDESH_HEADLINE[order.state] ?? [order.state, ''];
    const card = el(`
      <button class="card" type="button" data-order="${order.id}">
        <span class="who">
          <span class="venue">${escapeHtml(order.supplier.name)}</span>
          <span class="what">${escapeHtml(order.title)} ×${order.qty} · ${cap}</span>
          <span class="code">№${order.code}<span class="chip" data-s="${order.state}">${word}</span></span>
        </span>
        <span class="when">${dayShort(order.receive_on)}<small>${order.receive === 'delivery' ? 'ирэх' : 'авах'}</small></span>
      </button>`);
    card.addEventListener('click', () => {
      state.listing = null;
      state.form = null;
      state.orderId = order.id;
      rendered = null;
      void showStatus(true);
    });
    list.append(card);
  }
}

/* ── boot ────────────────────────────────────────────────────────── */

/**
 * Two ways in: the Basu home screen deep-links an order (`/idesh?order=…`),
 * or the page is simply opened, in which case the guest's own orders sit at
 * the top and the stalls below. Nobody is signed in on the way through — a
 * stranger gets the stalls, not an account.
 */
async function resume() {
  const wanted = new URLSearchParams(location.search).get('order');
  if (!wanted || !store.guestToken) return;
  state.orderId = wanted;
  rendered = null;
  await showStatus(true);
}

// No demo clock strip here. Its buttons are the lunch service's — arm at
// 12:14, fire at 12:21 — and an идэш is measured in days, not minutes. The
// strip stays on the food pages, where it is the whole demo.
void Promise.all([loadListings(), loadMine()]).then(resume);

const poll = setInterval(() => {
  if (document.hidden) return;
  if (state.orderId && state.screen === 'status') void showStatus();
  else if (!state.screen) void loadMine();
}, 4000);
addEventListener('pagehide', () => {
  clearInterval(poll);
  gone = true;
});
</script>
</body>
</html>
