function renderOrders(view) {
  const suppliers = cache.suppliers.filter((s) => s.state === 'contracted');
  view.append(head('Захиалгууд', 'Бүх нийлүүлэгчийн идэшний захиалга нэг дор.'));
  const day = el(`<input class="input dt-date" type="date" id="day" value="${esc(orderFilter.day)}" title="Авах, хүргэх өдөр" aria-label="Авах, хүргэх өдөр">`);
  const table = dataTable({
    columns: [
      { key: 'code', label: 'Захиалга', render: (o) => dtCell.twoHtml(`<span class="mono">№${esc(o.code)}</span>`, esc(`${o.title} ×${o.qty}${o.unit === 'kg' ? ' кг' : ''}`)) },
      { key: 'supplier', label: 'Нийлүүлэгч', value: (o) => o.supplier.name },
      {
        key: 'guest',
        label: 'Зочин',
        value: (o) => `${o.guest ?? ''} ${o.guest_email ?? ''} ${o.guest_phone ?? ''} ${o.address_phone ?? ''}`,
        // With no name, the address they signed in with; with no number of their own, the one given for the delivery.
        render: (o) => {
          const ring = o.guest_phone ?? (o.receive === 'delivery' ? o.address_phone : null);
          return dtCell.twoHtml(guestWho(o.guest, o.guest_email), ring ? dtCell.phone(ring) : '');
        },
      },
      {
        key: 'receive_on',
        label: 'Өдөр',
        render: (o) => dtCell.twoHtml(`<span class="mono">${dayLabel(o.receive_on)}</span>`, o.receive === 'delivery' ? 'хүргэлт' : 'өөрөө авна'),
      },
      { key: 'state', label: 'Төлөв', value: (o) => STATE_WORD[o.state] ?? o.state, render: (o) => dtCell.pill(o.state, STATE_WORD[o.state] ?? o.state) },
      { key: 'total_mnt', label: 'Дүн', align: 'end', numeric: true, render: (o) => dtCell.money(o.total_mnt) },
    ],
    search: { placeholder: 'Код, утас, зочин, нийлүүлэгч, мах…' },
    onSearch: (q) => {
      orderFilter.q = q;
      // Somebody on the phone about their order: it may have ended, and «Идэвхтэй» would hide it. While a search
      // is typed it looks through every order; cleared, the list goes back to the scope it was on.
      const seg = (v) => table.el.querySelector(`.dt-seg button[data-v="${v}"]`);
      if (q && orderFilter.scope !== 'all' && seg('all')) {
        const was = orderFilter.scope;
        movingScope = true;
        seg('all').click();
        movingScope = false;
        scopeBeforeSearch = was;
        return;
      }
      if (!q && scopeBeforeSearch && orderFilter.scope === 'all' && seg(scopeBeforeSearch)) {
        const back = scopeBeforeSearch;
        scopeBeforeSearch = null;
        movingScope = true;
        seg(back).click();
        movingScope = false;
        return;
      }
      void loadOrders(table);
    },
    filters: [
      { key: 'scope', label: 'Хамрах хүрээ', options: [['live', 'Идэвхтэй'], ['done', 'Дууссан'], ['all', 'Бүгд']], initial: orderFilter.scope },
      {
        key: 'supplier',
        label: 'Нийлүүлэгч',
        kind: 'select',
        options: [['', 'Бүх нийлүүлэгч'], ...suppliers.map((s) => [s.id, s.name])],
        initial: orderFilter.supplier,
      },
    ],
    onFilter: (f) => {
      // A scope chosen by hand is the person's: the search no longer moves it back.
      if (!movingScope) scopeBeforeSearch = null;
      orderFilter.scope = f.scope;
      orderFilter.supplier = f.supplier;
      void loadOrders(table);
    },
    tools: [day],
    sort: { key: 'receive_on', desc: false },
    onRow: (o) => openOrder(o.id),
    rowAttrs: (o) => ({ 'data-order': o.id }),
    noun: 'захиалга',
    empty: { title: 'Захиалга алга', text: 'Шүүлтэд тохирох захиалга байхгүй.' },
  });
  table.el.id = 'orders';
  table.el.querySelector('.dt-search input').value = orderFilter.q;
  day.addEventListener('change', () => {
    orderFilter.day = day.value;
    void loadOrders(table);
  });
  view.append(table.el);
  void loadOrders(table);
}

async function loadOrders(table) {
  const qs = new URLSearchParams({ scope: orderFilter.scope, q: orderFilter.q });
  if (orderFilter.supplier) qs.set('supplier', orderFilter.supplier);
  if (orderFilter.day) qs.set('day', orderFilter.day);
  try {
    table.setRows((await ops(`/v1/ops/orders?${qs}`)).orders);
  } catch (error) {
    toast(error.message, 'bad');
    table.setRows([]);
  }
}

/** One order, its money, its story — and the three things ops may do to it. */
async function openOrder(id, from = { label: 'Захиалгууд', go: () => show('orders') }) {
  const view = document.getElementById('view');
  const wanted = opening(view, from);
  let d;
  try {
    d = await ops(`/v1/ops/orders/${id}`);
  } catch (error) {
    toast(error.message, 'bad');
    if (wanted()) from.go();
    return;
  }
  if (!wanted()) return;
  const o = d.order;
  const live = IDESH_LIVE.includes(o.state);
  const manage = can('desk.orders:manage');
  view.replaceChildren();
  backTo(view, from);
  view.append(head(`№${esc(o.code)} <span class="pill" data-s="${esc(o.state)}">${esc(STATE_WORD[o.state] ?? o.state)}</span>`, `${esc(o.title)} ×${esc(o.qty)}${o.unit === 'kg' ? ' кг' : ''} · ${esc(o.supplier.name)}`));
  const here = { label: `№${o.code}`, go: () => openOrder(id, from) };
  // Who bought it: the order says (the story's first line is the guest's own, by their account, as before).
  const guestId = o.guest_id ?? d.events.map((e) => /^guest:([0-9a-f-]{36})$/.exec(e.actor ?? '')?.[1]).find(Boolean) ?? null;
  const acts = live && manage
    ? `<h2 class="section-label">Үйлдэл</h2><div class="card" id="acts">
        <div class="card-body acts">
          ${['READY', 'DISPATCHED'].includes(o.state) ? '<button class="btn" data-v="primary" type="button" data-a="hand">Хүлээлгэн өгсөн гэж тэмдэглэх</button><div class="hint">Нийлүүлэгч тэмдэглэж амжаагүй бол.</div>' : ''}
          <button class="btn" type="button" data-a="resend">Мэдэгдэл дахин илгээх</button>
          <div class="sep"></div>
          <button class="btn" data-v="danger" type="button" data-a="cancel">Нийлүүлэгчийн өмнөөс цуцлах</button>
          <div class="hint">Хэдийг буцаахыг шалтгаан ба дүрэм тогтооно; хүн сонгохгүй.</div>
        </div>
      </div>`
    : `<h2 class="section-label">Үйлдэл</h2><p class="rail-note" id="acts">${live ? 'Захиалгад үйлдэл хийх нь таны үүрэгт нээлттэй биш.' : 'Дууссан захиалга — хийх үйлдэл алга.'}</p>`;
  const page = el(`
    <div class="detail">
      <div class="card detail-facts"><div class="facts">
        <div><span class="lab">Зочин</span><b>${guestWho(o.guest, o.guest_email)}</b><span class="fact-sub">${o.guest_phone ? tel(o.guest_phone) : ''}</span></div>
        <div><span class="lab">${o.receive === 'delivery' ? 'Хүргэлтээр' : 'Өөрөө очиж авна'}</span><b class="nowrap">${dayLabel(o.receive_on)}</b><span class="fact-sub">${o.receive === 'delivery' ? `${esc(o.address)} · <span class="mono nowrap">${esc(phoneText(o.address_phone))}</span>` : 'нийлүүлэгчийн авах цэгээс'}</span></div>
        <div><span class="lab">Зочин төлсөн</span><b>${money(o.total_mnt)}</b><span class="fact-sub">${o.delivery_fee_mnt ? `хүргэлт ${mnt(o.delivery_fee_mnt)} орсон` : 'хүргэлтгүй'}</span></div>
        <div><span class="lab">Нийлүүлэгчид очих</span><b>${money(o.payout_mnt)}</b><span class="fact-sub">шимтгэл хассан</span></div>
        ${o.cancel_reason ? `<div><span class="lab">Цуцлалт</span><b>${esc(REASON[o.cancel_reason] ?? o.cancel_reason)}</b><span class="fact-sub">буцаалт ${mnt(o.refund_mnt ?? 0)}${o.forfeit_mnt ? ` · суутгал ${mnt(o.forfeit_mnt)}` : ''}</span></div>` : ''}
      </div></div>
      ${d.settlements.length ? '<section class="section detail-wide"><h2 class="section-label">Мөнгө</h2><div id="money"></div></section>' : ''}
      <aside class="detail-rail">${acts}</aside>
      <div class="detail-main">
        ${d.settlements.length ? '' : '<section class="section"><h2 class="section-label">Мөнгө</h2><div id="money"></div></section>'}
        <section class="section"><h2 class="section-label">Явц</h2><div class="card card-body"><ol class="story stepper" data-stepper>${d.events
          .map((e) => step(e.type, EVENT_WORD[e.type] ?? e.type, `${actorWord(e.actor)}${e.payload?.reason ? ` · ${REASON[e.payload.reason] ?? e.payload.reason}` : ''}${e.payload?.state ? ` · ${STATE_WORD[e.payload.state] ?? ''}` : ''}`, e.at))
          .join('')}</ol></div></section>
      </div>
    </div>`);
  const moneyBox = page.querySelector('#money');
  // The order's own payouts and refunds across the file's whole width, above its story and its actions: six
  // columns and the button to release them never squeezed beside the rail. The order column would only say this order.
  if (d.settlements.length) moneyBox.append(settlementTable(d.settlements, false, 'open', { hide: ['order_code'] }).el);
  else moneyBox.append(el(`<div class="card empty">${o.state === 'CANCELLED' || o.state === 'REFUNDED' ? 'Буцаалт үүсээгүй байна.' : 'Олголт хүлээлгэн өгснөөс хойш нэг хоногийн дараа үүснэ.'}</div>`));
  const links = related([
    guestId && hasPage('guests') ? { label: realName(o.guest) ?? o.guest_email ?? 'Зочин', sub: 'Зочны хуудас: түрийвч, захиалгууд', go: () => openGuest(guestId, here) } : null,
    hasPage('suppliers') && cache.suppliers.some((s) => s.id === o.supplier.id) ? { label: o.supplier.name, sub: 'Нийлүүлэгчийн хуудас: гэрээ, данс, зар', go: () => openSupplier(o.supplier.id, here) } : null,
  ]);
  if (links) page.querySelector('.detail-rail').append(links);
  const acted = page.querySelector('#acts');
  const done = async () => {
    await refresh();
    await openOrder(id, from);
  };
  const ASK = {
    hand: { title: 'Хүлээлгэн өгсөн гэж тэмдэглэх', text: `№${esc(o.code)}-г зочинд хүлээлгэн өгсөн гэж тэмдэглэнэ. Нийлүүлэгчийн олголт нэг хоногийн дараа үүснэ.`, ok: 'Тэмдэглэх' },
    resend: { title: 'Мэдэгдэл дахин илгээх', text: `№${esc(o.code)}-ийн сүүлийн мэдэгдлийг зочинд дахин илгээнэ.`, ok: 'Илгээх' },
  };
  acted.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    const action = b.dataset.a;
    if (action === 'cancel') {
      void popup({
        title: 'Нийлүүлэгчийн өмнөөс цуцлах',
        sub: `№${esc(o.code)} · ${esc(o.title)} · ${mnt(o.total_mnt)}`,
        width: 520,
        danger: true,
        submit: 'Цуцлах',
        fields: [
          {
            type: 'note',
            html: 'Буцаалтыг шалтгаан ба дүрэм тогтооно: нийлүүлэгчийн буруу эсвэл мал нядлахаас өмнө бол <b>бүтнээрээ</b>; мал нядалсны дараа зочны буруугаас бол <b>суутгалтай</b>.',
          },
          { name: 'reason', label: 'Шалтгаан', type: 'select', required: true, wide: true, options: [['', 'Сонгох…'], ...Object.entries(REASON).filter(([k]) => k !== 'draft_expired')] },
          { name: 'note', label: 'Тэмдэглэл', type: 'textarea', placeholder: 'Бүртгэлд үлдэнэ' },
        ],
        onSubmit: async (v) => {
          await ops(`/v1/ops/orders/${id}/cancel`, { method: 'POST', body: { reason: v.reason, note: v.note } });
          toast(`№${o.code} цуцлагдлаа.`, 'good');
          await done();
        },
      });
      return;
    }
    const ask = ASK[action];
    void confirmPopup({
      ...ask,
      reason: { label: 'Тэмдэглэл', placeholder: 'Бүртгэлд үлдэнэ (заавал биш)' },
      onConfirm: async (note) => {
        await ops(`/v1/ops/orders/${id}/${action}`, { method: 'POST', body: { note } });
        toast('Болсон, бүртгэгдлээ.', 'good');
        await done();
      },
    });
  });
  view.append(page);
}

/* ── suppliers ── */

/** A supplier's word and tone: an application, under contract (or paused), or declined. */
const supplierState = (s) => (s.state === 'contracted' ? (s.active ? ['contracted', 'гэрээт'] : ['off', 'түр зогссон']) : [s.state, STATE[s.state] ?? s.state]);

/** Yes to an application, after one look at who it is. */
const approveSupplier = (s, done) =>
  confirmPopup({
    title: 'Нийлүүлэгчийг батлах',
    text: `<b>${esc(s.name)}</b> гэрээт нийлүүлэгч болно. Хүсэлт гаргасан хүн эзэн нь болж, өөрийн бүртгэлээр /supplier-д нэвтэрнэ — түүнд Basu-д мэдэгдэл очно.`,
    ok: 'Батлах',
    onConfirm: async () => {
      await ops(`/v1/ops/suppliers/${s.id}/approve`, { method: 'POST', body: {} });
      toast(`«${s.name}» батлагдлаа.`, 'good');
      await done();
    },

/** No to an application, with the reason the applicant will read. */
const declineSupplier = (s, done) =>
  confirmPopup({
    title: 'Хүсэлтийг татгалзах',
    text: `<b>${esc(s.name)}</b>-ийн хүсэлтийг татгалзана. Шалтгааныг нь хүсэлт гаргагчид мэдэгдлээр илгээнэ; засаад дахин хүсэж болно.`,
    ok: 'Татгалзах',
    danger: true,
    reason: { label: 'Шалтгаан', placeholder: 'ТТД баталгаажаагүй, хаяг тодорхойгүй…', required: true },
    onConfirm: async (reason) => {
      await ops(`/v1/ops/suppliers/${s.id}/decline`, { method: 'POST', body: { reason } });
      toast('Татгалзлаа.', 'good');
      await done();
    },
  });

/**
 * A payout account as the server takes it: an IBAN — MN and 18 digits — or a
 * plain account number of 6–20 digits, spaces aside, either case. Checked
 * before anything is sent, so a wrong one is said under its own field and not
 * as the server's word about something else.
 */
const BANK_RULE = /^(MN\d{18}|\d{6,20})$/;
const BANK_SAID = 'IBAN бол MN-ээр эхэлсэн 20 тэмдэгт, эсвэл 6–20 оронтой дансны дугаар бичнэ үү.';
const bankOk = (value) => BANK_RULE.test(String(value ?? '').replace(/\s+/g, '').toUpperCase());
/** The account field, the same in both popups that take one: letters allowed (an IBAN starts MN), read in capitals. */
const bankField = (value, hint) => ({
  name: 'bank_account',
  label: 'Данс',
  value: value ?? '',
  placeholder: '5012345678 эсвэл MN…',
  autocomplete: 'off',
  hint,
  attrs: { autocapitalize: 'characters', spellcheck: 'false', maxlength: 40 },
});
/**
 * The bank, picked from Basu's one list (BANK_NAMES, as the refund on /orders
 * and the supplier's own account popup pick it); a bank that is not on it is
 * typed under «Бусад банк». A saved name that is not on the list comes back
 * as «Бусад банк» with the name filled in. Two fields, the same in both
 * popups; `bankOf(v)` is the name they hold.
 */
const OTHER_BANK = '__other';
const bankFields = (saved) => {
  const picked = !saved ? '' : BANK_NAMES.includes(saved) ? saved : OTHER_BANK;
  return [
    { name: 'bank_name', label: 'Банк', type: 'select', options: [['', 'Сонгоогүй'], ...BANK_NAMES.map((b) => [b, b]), [OTHER_BANK, 'Бусад банк']], value: picked, onChange: (v, form) => form.show('bank_other', v === OTHER_BANK) },
    { name: 'bank_other', label: 'Банкны нэр', placeholder: 'Жагсаалтад байхгүй банк', value: picked === OTHER_BANK ? saved : '' },
  ];
};
const bankOf = (v) => (v.bank_name === OTHER_BANK ? String(v.bank_other ?? '').trim() : v.bank_name ?? '');

/** A supplier the desk writes in straight away: the contract is signed, the owner has a Basu account. */
const registerSupplier = () =>
  popup({
    title: 'Нийлүүлэгч бүртгэх',
    sub: 'Гэрээ байгуулсан нийлүүлэгчийг шууд бүртгэнэ. Эзэмшигч нь Basu-д өмнө нь нэвтэрсэн байх ёстой — бүртгэмэгц өөрийн бүртгэлээр /supplier-д орно.',
    width: 640,
    id: 'new-supplier',
    fields: [
      { name: 'name', label: 'Нэр', placeholder: 'Хэнтий · «Хэрлэн» хоршоо', required: true, wide: true, hint: 'Зочдод харагдах нэр: аймаг, газар, айл эсвэл газрын нэр.' },
      { name: 'phone', label: 'Утас', type: 'tel', inputmode: 'tel', placeholder: '+976 9911 2233', required: true, hint: 'Зочид, Basu энэ дугаар руу залгана.' },
      { name: 'owner', label: 'Эзэмшигчийн Basu бүртгэл', inputmode: 'email', placeholder: 'Утас эсвэл имэйл', hint: 'Хоосон бол дээрх утсаар хайна.' },
      { name: 'address', label: 'Мах авах цэг', placeholder: 'Дүүрэг, зах, хаалга', required: true, wide: true, hint: 'Зочин «өөрөө очиж авах» үед ирэх газар.' },
      { name: 'lat', label: 'Өргөрөг', inputmode: 'decimal', placeholder: '47.9…', hint: 'Газрын зураг дээрх цэг. Заавал биш.' },
      { name: 'lon', label: 'Уртраг', inputmode: 'decimal', placeholder: '106.9…' },
      { name: 'tin', label: 'ТТД', inputmode: 'numeric', placeholder: '7–10 орон', hint: 'Е-баримт энэ ТТД-аар гарна.' },
      { type: 'note', html: '<b>Олголт очих данс</b> — гэрээнд байгаа данс. Basu баталгаажуулсны дараа олголт энэ данс руу явна.' },
      ...bankFields(''),
      bankField('', '6–20 оронтой дансны дугаар, эсвэл MN-ээр эхэлсэн IBAN.'),
      { name: 'bank_holder', label: 'Данс эзэмшигч', placeholder: 'Гэрээн дээрх нэр', wide: true },
    ],
    submit: 'Бүртгэх',
    onSubmit: async (v, p) => {
      if (v.bank_account && !bankOk(v.bank_account)) {
        p.fieldError('bank_account', BANK_SAID);
        return false;
      }
      if (v.bank_name === OTHER_BANK && !bankOf(v)) {
        p.fieldError('bank_other', 'Банкны нэрийг бичнэ үү.');
        return false;
      }
      const body = { name: v.name, phone: v.phone, owner: v.owner || undefined, tin: v.tin, address: v.address, bank_name: bankOf(v), bank_account: v.bank_account, bank_holder: v.bank_holder };
      if (v.lat) body.lat = Number(v.lat);
      if (v.lon) body.lon = Number(v.lon);
      const { owner } = await ops('/v1/ops/suppliers', { method: 'POST', body });
      toast(`Бүртгэгдлээ. Эзэмшигч: ${owner.name ?? owner.email ?? phoneText(owner.phone)} — өөрийн бүртгэлээр /supplier-д орно.`, 'good');
      await refresh();
    },
  });

/**
 * The suppliers: the applications waiting for an answer — only while there
 * are some — then everybody under contract, paused or said no to. A supplier
 * is registered, approved, declined in a popup; a row opens its file.
 */
function renderSuppliers(view) {
  const applied = cache.suppliers.filter((s) => s.state === 'applied');
  const rest = cache.suppliers.filter((s) => s.state !== 'applied');
  const runs = can('desk.suppliers:manage');
  view.append(
    headActs(
      head('Нийлүүлэгчид', 'Гэрээт нийлүүлэгчид, ирсэн хүсэлтүүд.'),
      runs && button(`${NAV_ICON.plus}Нийлүүлэгч бүртгэх`, registerSupplier, 'data-v="primary" id="add-supplier"'),
    ),
  );

  if (applied.length) {
    const asked = dataTable({
      columns: [
        { key: 'name', label: 'Хүсэлт гаргагч', render: (s) => dtCell.two(s.name, s.about ?? '') },
        { key: 'phone', label: 'Утас', render: (s) => dtCell.phone(s.phone) },
        { key: 'merchant_tin', label: 'ТТД', render: (s) => dtCell.mono(s.merchant_tin), phone: false },
        { key: 'pickup_address', label: 'Авах цэг', phone: false },
        { key: 'applied_at', label: 'Ирсэн', render: (s) => whenCell(s.applied_at) },
      ],
      search: false,
      actions: runs
        ? (s) => [
            button('Батлах', () => approveSupplier(s, refresh), 'data-v="primary" data-size="sm" data-a="approve"'),
            button('Татгалзах', () => declineSupplier(s, refresh), 'data-v="quiet" data-size="sm" data-a="decline"'),
          ]
        : null,
      sort: { key: 'applied_at', desc: true },
      onRow: (s) => openSupplier(s.id),
      rowAttrs: (s) => ({ 'data-supplier': s.id, 'data-state': s.state }),
      noun: 'хүсэлт',
      empty: { title: 'Хүлээгдэж буй хүсэлт алга', text: '' },
      rows: applied,
    });
    asked.el.id = 'applied';
    const section = el(`<section class="section"><h2 class="section-label">Хариу хүлээж буй хүсэлт<span class="n">${applied.length}</span></h2><p class="section-note">Батлахад хүсэлт гаргасан хүн эзэн нь болж, зараа тавьж эхэлнэ. Татгалзвал шалтгааныг нь хүсэлт гаргагч харж, засаад дахин хүсэж болно.</p></section>`);
    section.append(asked.el);
    view.append(section);
  }

  const all = dataTable({
    columns: [
      { key: 'name', label: 'Нийлүүлэгч', render: (s) => dtCell.two(s.name, s.pickup_address) },
      { key: 'phone', label: 'Утас', value: (s) => `${s.phone ?? ''} ${phoneText(s.phone ?? '')}`, render: (s) => dtCell.phone(s.phone) },
      { key: 'merchant_tin', label: 'ТТД', render: (s) => (s.merchant_tin ? dtCell.mono(s.merchant_tin) : '<span class="ink-stop">алга</span>'), phone: false },
      { key: 'commission_pct', label: 'Шимтгэл', align: 'end', numeric: true, render: (s) => (s.state === 'declined' ? dtCell.none() : `<span class="dt-num">${s.commission_pct}%</span>`) },
      {
        key: 'bank',
        label: 'Данс',
        value: (s) => (s.bank_account ? (s.bank_verified ? 2 : 1) : 0),
        numeric: true,
        render: (s) =>
          s.bank_account
            ? dtCell.twoHtml(`${esc(s.bank_name)} <span class="mono">${esc(s.bank_account)}</span>`, s.bank_verified ? esc(s.bank_holder ?? '') : dtCell.pill('warn', 'баталгаажаагүй'))
            : dtCell.none(),
        phone: false,
      },
      { key: 'listings', label: 'Зар', align: 'end', numeric: true, render: (s) => (s.state === 'contracted' ? dtCell.num(s.listings) : dtCell.none()) },
      { key: 'contracted_at', label: 'Гэрээ', render: (s) => (s.state === 'declined' ? `<small class="muted">татгалзсан</small>` : whenCell(s.contracted_at)), phone: false },
      { key: 'state', label: 'Төлөв', value: (s) => supplierState(s)[1], render: (s) => dtCell.pill(...supplierState(s)) },
    ],
    search: { placeholder: 'Нэр, утас, ТТД, хаяг…' },
    filters: [
      {
        key: 'state',
        label: 'Төлөв',
        options: [['all', 'Бүгд'], ['on', 'Гэрээт'], ['off', 'Түр зогссон'], ['declined', 'Татгалзсан']],
        test: (s, v) => v === 'all' || (v === 'on' ? s.state === 'contracted' && s.active : v === 'off' ? s.state === 'contracted' && !s.active : s.state === v),
      },
    ],
    sort: { key: 'name' },
    onRow: (s) => openSupplier(s.id),
    rowAttrs: (s) => ({ 'data-supplier': s.id, 'data-state': s.state }),
    noun: 'нийлүүлэгч',
    empty: { title: 'Нийлүүлэгч алга', text: 'Гэрээ байгуулсан нийлүүлэгчийг «Нийлүүлэгч бүртгэх»-ээр нэмнэ.' },
    stateKey: 'basu.dt.suppliers',
    rows: rest,
  });
  all.el.id = 'all';
  const section = el(`<section class="section">${applied.length ? '<h2 class="section-label">Нийлүүлэгчид</h2>' : ''}</section>`);
  section.append(all.el);
  view.append(section);
}

/**
 * One supplier, whole: who, the contract's terms, the money's account, the
 * listings, its orders and payouts — and what ops may do, each in a popup.
 */
async function openSupplier(id, from = { label: 'Нийлүүлэгчид', go: () => show('suppliers') }) {
  const view = document.getElementById('view');
  const s = cache.suppliers.find((x) => x.id === id);
  if (!s) return show('suppliers');
  const runs = can('desk.suppliers:manage');
  const signs = can('desk.suppliers:terms');
  const again = async () => {
    try {
      cache.suppliers = (await ops('/v1/ops/suppliers')).suppliers;
      badges();
    } catch (error) {
      toast(error.message, 'bad');
    }
    await openSupplier(id, from);
  };
  const here = { label: s.name, go: () => openSupplier(id, from) };
  view.replaceChildren();
  window.scrollTo(0, 0);
  const [tone, word] = supplierState(s);
  backTo(view, from);
  view.append(head(`${esc(s.name)} ${dtCell.pill(tone, word)}`, `${tel(s.phone)} · ${esc(s.pickup_address)}`));

  /** Off the guests' pages, or back on them: a reason for the record either way. */
  const toggle = () =>
    confirmPopup({
      title: s.active ? 'Нийлүүлэгчийг түр зогсоох' : 'Нийлүүлэгчийг идэвхжүүлэх',
      text: s.active ? `<b>${esc(s.name)}</b>-ийн зарууд зочдод харагдахаа болино. Авсан захиалга хэвээр үргэлжилнэ.` : `<b>${esc(s.name)}</b>-ийн зарууд дахин зочдод харагдана.`,
      ok: s.active ? 'Түр зогсоох' : 'Идэвхжүүлэх',
      danger: s.active,
      reason: { label: s.active ? 'Шалтгаан' : 'Тэмдэглэл', placeholder: 'Бүртгэлд үлдэнэ', required: s.active },
      onConfirm: async (note) => {
        await ops(`/v1/ops/suppliers/${s.id}/active`, { method: 'POST', body: { active: !s.active, note } });
        toast(s.active ? 'Түр зогсоолоо.' : 'Идэвхжлээ.', 'good');
        await again();
      },
    });
  /** A changed account pays out nothing until somebody holds it up against the contract. */
  const verifyBank = () =>
    confirmPopup({
      title: 'Данс баталгаажуулах',
      text: `<b>${esc(s.bank_name ?? '')} <span class="mono">${esc(s.bank_account)}</span></b> · ${esc(s.bank_holder ?? '')}<br>Гэрээний данстай таарч байна уу? Баталгаажсаны дараа олголт энэ данс руу явна.`,
      ok: 'Таарч байна',
      onConfirm: async () => {
        await ops(`/v1/ops/suppliers/${s.id}/bank-verify`, { method: 'POST', body: { note: 'гэрээтэй тулгасан' } });
        toast('Данс баталгаажлаа.', 'good');
        await again();
      },
    });
  /** The contract's terms: written in once it is signed, corrected here. */
  const editTerms = () =>
    popup({
      title: 'Гэрээ, данс',
      sub: esc(s.name),
      width: 600,
      fields: [
        { name: 'commission_pct', label: 'Шимтгэл, %', inputmode: 'decimal', value: s.commission_pct },
        { name: 'tin', label: 'ТТД', inputmode: 'numeric', placeholder: '7–14 орон', value: s.merchant_tin ?? '' },
        ...bankFields(s.bank_name ?? ''),
        bankField(s.bank_account, '6–20 оронтой дугаар, эсвэл MN-ээр эхэлсэн IBAN. Данс өөрчлөгдвөл дахин баталгаажуулах хүртэл олголт гарахгүй.'),
        { name: 'bank_holder', label: 'Данс эзэмшигч', value: s.bank_holder ?? '', wide: true },
      ],
      onSubmit: async (v, p) => {
        if (v.bank_account && !bankOk(v.bank_account)) {
          p.fieldError('bank_account', BANK_SAID);
          return false;
        }
        if (v.bank_name === OTHER_BANK && !bankOf(v)) {
          p.fieldError('bank_other', 'Банкны нэрийг бичнэ үү.');
          return false;
        }
        const body = { tin: v.tin, bank_name: bankOf(v), bank_account: v.bank_account, bank_holder: v.bank_holder };
        if (v.commission_pct !== '') body.commission_pct = Number(v.commission_pct);
        await ops(`/v1/ops/suppliers/${s.id}`, { method: 'PATCH', body });
        toast('Хадгалагдлаа.', 'good');
        await again();
      },
    });

  // The file's shape, as a guest's or an order's: the contract's facts across, its stall and its orders down the
  // left, and on the right what may be done to it and the files around it.
  const page = el(`
    <div class="detail">
      <div class="card detail-facts"><div class="facts">
        <div><span class="lab">${s.state === 'applied' ? 'Хүсэлт ирсэн' : s.state === 'declined' ? 'Татгалзсан' : 'Гэрээ'}</span><b class="nowrap">${when(s.state === 'applied' ? s.applied_at : s.state === 'declined' ? s.decided_at : s.contracted_at)}</b>${s.state === 'declined' && s.decline_reason ? `<span class="fact-sub">${esc(s.decline_reason)}</span>` : ''}</div>
        <div><span class="lab">Шимтгэл</span><b>${s.state === 'declined' ? '—' : `${s.commission_pct}%`}</b><span class="fact-sub">хүлээлгэн өгсөн захиалгаас</span></div>
        <div><span class="lab">ТТД</span><b class="mono">${s.merchant_tin ? esc(s.merchant_tin) : '—'}</b><span class="fact-sub">${s.merchant_tin ? 'е-баримт гарна' : '<span class="ink-stop">е-баримт гарахгүй</span>'}</span></div>
        <div><span class="lab">Олголт очих данс</span><b>${s.bank_account ? `${esc(s.bank_name ?? '')} <span class="mono">${esc(s.bank_account)}</span>` : '—'}</b><span class="fact-sub">${s.bank_account ? `${esc(s.bank_holder ?? '')} ${s.bank_verified ? dtCell.pill('verified', 'баталгаажсан') : dtCell.pill('warn', 'баталгаажаагүй')}` : 'данс оруулаагүй'}</span></div>
      </div></div>
      <aside class="detail-rail"></aside>
      <div class="detail-main"></div>
    </div>`);
  const rail = page.querySelector('.detail-rail');
  const main = page.querySelector('.detail-main');
  const asked = s.state === 'applied';
  const contracted = s.state === 'contracted';
  const unverified = contracted && Boolean(s.bank_account) && !s.bank_verified && signs;
  rail.append(
    railActs(
      [
        asked && runs && { label: 'Батлах', attrs: 'data-v="primary" data-a="approve"', onClick: () => approveSupplier(s, again), hint: 'Хүсэлт гаргасан хүн эзэн нь болж, өөрийн бүртгэлээр зараа тавьж эхэлнэ.' },
        asked && runs && { label: 'Татгалзах', attrs: 'data-a="decline"', onClick: () => declineSupplier(s, again), hint: 'Шалтгааныг нь хүсэлт гаргагч харж, засаад дахин хүсэж болно.' },
        unverified && { label: 'Данс баталгаажуулах', attrs: 'data-v="primary" data-a="bank-verify"', onClick: verifyBank, hint: 'Гэрээний данстай тулгасны дараа олголт энэ данс руу явна.' },
        s.state !== 'declined' && signs && { label: 'Гэрээ, данс засах', attrs: 'data-a="terms"', onClick: editTerms, hint: 'Шимтгэл, ТТД, олголт очих данс.' },
        'sep',
        contracted && runs && {
          label: s.active ? 'Түр зогсоох' : 'Идэвхжүүлэх',
          attrs: `data-a="active"${!s.active && !unverified ? ' data-v="primary"' : ''}`,
          onClick: toggle,
          hint: s.active ? 'Зарууд нь зочдод харагдахаа болино; авсан захиалга хэвээр үргэлжилнэ.' : 'Зарууд нь дахин зочдод харагдана.',
        },
      ],
      s.state === 'declined' ? 'Татгалзсан хүсэлт — хийх үйлдэл алга.' : 'Нийлүүлэгчид үйлдэл хийх нь таны үүрэгт нээлттэй биш.',
    ),
  );
  // The business this supplier is the идэш side of: its people and their roles are kept there.
  const links = related([s.org_id && hasPage('orgs') ? { label: 'Байгууллагын хуудас', sub: 'Хүмүүс, тэдний үүрэг, бүртгэлийн мэдээлэл', go: () => openOrgAccess(s.org_id, here) } : null]);
  if (links) rail.append(links);
  if (s.about) main.append(el(`<section class="section"><h2 class="section-label">Тухай</h2><div class="card"><div class="card-body">${esc(s.about)}</div></div></section>`));
  view.append(page);

  if (s.state === 'contracted') {
    const listings = dataTable({
      columns: [
        { key: 'title', label: 'Зар', render: (l) => `<b>${esc(l.title)}</b>` },
        { key: 'price_mnt', label: 'Үнэ', align: 'end', numeric: true, render: (l) => `${dtCell.money(l.price_mnt)}<small class="muted">/${l.unit === 'kg' ? 'кг' : 'толгой'}</small>` },
        { key: 'sold', label: 'Зарагдсан', align: 'end', numeric: true, render: (l) => `<span class="dt-num">${l.sold}/${l.quantity}</span>` },
        { key: 'active', label: 'Төлөв', value: (l) => (l.active ? 'зарагдаж байна' : 'нуусан'), render: (l) => (l.active ? dtCell.pill('contracted', 'зарагдаж байна') : dtCell.pill('off', 'нуусан')) },
      ],
      search: false,
      actions: runs
        ? (l) =>
            l.active
              ? button(
                  'Нуух',
                  () =>
                    confirmPopup({
                      title: 'Зарыг нуух',
                      text: `<b>${esc(l.title)}</b> зочдод харагдахаа болино. Авсан захиалгад нөлөөлөхгүй.`,
                      ok: 'Нуух',
                      danger: true,
                      reason: { label: 'Шалтгаан', placeholder: 'Бүртгэлд үлдэнэ', required: true },
                      onConfirm: async (note) => {
                        await ops(`/v1/ops/listings/${l.id}/hide`, { method: 'POST', body: { note } });
                        toast('Зар нуугдлаа.', 'good');
                        await again();
                      },
                    }),
                  'data-v="quiet" data-size="sm" data-a="hide"',
                )
              : null
        : null,
      rowAttrs: (l) => ({ 'data-listing': l.id }),
      noun: 'зар',
      empty: { title: 'Зар алга', text: 'Нийлүүлэгч одоогоор зар тавиагүй.' },
    });
    listings.el.id = 'listings';
    const section = el('<section class="section"><h2 class="section-label">Зарууд</h2></section>');
    section.append(listings.el);
    main.append(section);

    // What it sold: its orders, newest first, each opening its file — the same list the orders page asks for, for this supplier.
    let orders = null;
    if (hasPage('orders')) {
      orders = dataTable({
        columns: [
          { key: 'code', label: 'Захиалга', render: (o) => dtCell.twoHtml(`<span class="mono">№${esc(o.code)}</span>`, esc(`${o.title} ×${o.qty}${o.unit === 'kg' ? ' кг' : ''}`)) },
          { key: 'guest', label: 'Зочин', value: (o) => `${o.guest ?? ''} ${o.guest_email ?? ''} ${o.guest_phone ?? ''}`, render: (o) => dtCell.twoHtml(guestWho(o.guest, o.guest_email), o.guest_phone ? dtCell.phone(o.guest_phone) : '') },
          { key: 'receive_on', label: 'Өдөр', render: (o) => dtCell.twoHtml(`<span class="mono nowrap">${dayLabel(o.receive_on)}</span>`, o.receive === 'delivery' ? 'хүргэлт' : 'өөрөө авна'), phone: false },
          { key: 'state', label: 'Төлөв', value: (o) => STATE_WORD[o.state] ?? o.state, render: (o) => dtCell.pill(o.state, STATE_WORD[o.state] ?? o.state) },
          { key: 'total_mnt', label: 'Дүн', align: 'end', numeric: true, render: (o) => dtCell.money(o.total_mnt) },
        ],
        search: false,
        sort: { key: 'receive_on', desc: true },
        onRow: (o) => openOrder(o.id, here),
        rowAttrs: (o) => ({ 'data-order': o.id }),
        noun: 'захиалга',
        empty: { title: 'Захиалга алга', text: 'Энэ нийлүүлэгчээс одоогоор захиалга ирээгүй.' },
      });
      orders.el.id = 'supplier-orders';
      const box = el('<section class="section"><h2 class="section-label">Захиалгууд</h2></section>');
      box.append(orders.el);
      main.append(box);
    }

    // What Basu owes it: the payouts the desk already holds, when there are any.
    const payouts = hasPage('pay') ? cache.settlements.filter((t) => t.kind === 'payout' && t.supplier?.id === s.id) : [];
    if (payouts.length) {
      const box = el('<section class="section"><h2 class="section-label">Олголт</h2></section>');
      box.append(settlementTable(payouts, false, 'open', { hide: ['who'] }).el);
      main.append(box);
    }

    try {
      listings.setRows((await ops(`/v1/ops/suppliers/${s.id}/listings`)).listings);
    } catch (error) {
      toast(error.message, 'bad');
      listings.setRows([]);
    }
    if (orders) {
      try {
        orders.setRows((await ops(`/v1/ops/orders?${new URLSearchParams({ scope: 'all', supplier: s.id, q: '' })}`)).orders);
      } catch (error) {
        toast(error.message, 'bad');
        orders.setRows([]);
      }
    }
  }
}

/* ── the money ── */

/** Where a payout or a refund stands, in the word and tone the desk reads it by. */
const settlementState = (t) =>
  t.state === 'paid'
    ? ['paid', 'шилжүүлсэн']
    : t.state === 'needs_account'
      ? ['needs_account', 'данс хүлээж байна']
      : !t.bank_verified
        ? ['warn', 'данс баталгаажаагүй']
        : t.approved_at
          ? ['due', 'шилжүүлэх']
          : ['hold', 'батлах хүлээж байна'];

/**
 * Payouts and refunds as one table: who, for which order, to which account,
 * where it stands — and on a row that is due, the one half of the two-person
 * release this member may press. The whole list on «Олголт», one order's on its page.
 */
function settlementTable(rows, withFilters = true, opensOn = 'open', { hide = [] } = {}) {
  return dataTable({
    // In a file, the column that would only name the file itself — its order, its supplier — is left out.
    columns: [
      {
        key: 'who',
        label: 'Хэнд',
        value: (t) => (t.kind === 'payout' ? t.supplier?.name ?? '' : `${realName(t.guest?.name) ?? ''} ${t.guest_email ?? ''} ${t.guest_phone ?? ''} ${phoneText(t.guest_phone ?? '')}`),
        // A refund to somebody who gave no name says the address or the number they sign in with, as Зочид does:
        // two refunds to two such people are two different lines, not «Нэр оруулаагүй» twice.
        render: (t) =>
          dtCell.twoHtml(
            t.kind === 'payout' ? esc(t.supplier?.name ?? '') : guestWho(t.guest?.name, t.guest_email, t.guest_phone),
            t.kind === 'payout' ? 'олголт · нийлүүлэгч' : 'буцаалт · зочин',
          ),
      },
      { key: 'order_code', label: 'Захиалга', render: (t) => dtCell.twoHtml(`<span class="mono">№${esc(t.order_code)}</span>`, esc(t.memo ?? '')) },
      {
        key: 'bank',
        label: 'Данс',
        value: (t) => `${t.bank_name ?? ''} ${t.bank_account ?? ''} ${t.bank_holder ?? ''}`,
        render: (t) => (t.bank_account ? dtCell.twoHtml(`${esc(t.bank_name)} <span class="mono">${esc(t.bank_account)}</span>`, esc(t.bank_holder ?? '')) : '<span class="muted">данс алга</span>'),
        phone: false,
      },
      {
        key: 'state',
        label: 'Төлөв',
        value: (t) => settlementState(t)[1],
        render: (t) =>
          dtCell.twoHtml(
            dtCell.pill(...settlementState(t)),
            t.state === 'paid'
              ? `${when(t.paid_at)}${t.reference ? ` · <span class="mono">${esc(t.reference)}</span>` : ''}`
              : t.approved_by
                ? `${esc(t.approved_by.replace('ops:', ''))} баталсан`
                : '',
          ),
      },
      { key: 'created_at', label: 'Үүссэн', render: (t) => whenCell(t.created_at), phone: false },
      { key: 'amount_mnt', label: 'Дүн', align: 'end', numeric: true, render: (t) => dtCell.money(t.amount_mnt) },
    ].filter((c) => !hide.includes(c.key)),
    search: withFilters ? { placeholder: 'Нэр, захиалга, данс…' } : false,
    filters: withFilters ? [
      {
        key: 'state',
        label: 'Төлөв',
        options: [['open', 'Хийх'], ['needs_account', 'Данс хүлээж буй'], ['paid', 'Шилжүүлсэн'], ['all', 'Бүгд']],
        initial: opensOn,
        test: (t, v) => v === 'all' || (v === 'open' ? t.state === 'due' : t.state === v),
      },
      {
        key: 'kind',
        label: 'Төрөл',
        kind: 'select',
        options: [['', 'Олголт ба буцаалт'], ['payout', 'Олголт'], ['refund', 'Буцаалт']],
        test: (t, v) => !v || t.kind === v,
      },
    ] : [],
    actions: (t) => {
      if (t.state !== 'due' || !t.bank_verified || !can('desk.pay:approve')) return null;
      const who = t.kind === 'payout' ? t.supplier?.name ?? 'Нийлүүлэгч' : realName(t.guest?.name) ?? t.guest_email ?? (t.guest_phone ? phoneText(t.guest_phone) : 'Зочин');
      const line = `<b>${mnt(t.amount_mnt)}</b> → ${esc(who)}<br>${esc(t.bank_name ?? '')} · <span class="mono">${esc(t.bank_account ?? '')}</span> · ${esc(t.bank_holder ?? '')}<br><small class="muted">№${esc(t.order_code)} · ${t.kind === 'payout' ? 'олголт' : 'буцаалт'}</small>`;

function renderPay(view) {
  const due = cache.settlements.filter((t) => t.state === 'due');
  // Only a line with an account checked against the contract can be sent; the rest of what is due waits as a
  // refund waits for the guest's account — counted there, not here.
  const ready = due.filter((t) => t.bank_account && t.bank_verified);
  const unchecked = due.filter((t) => !(t.bank_account && t.bank_verified));
  const waiting = cache.settlements.filter((t) => t.state === 'needs_account');
  const paid = cache.settlements.filter((t) => t.state === 'paid');
  const sum = (rows) => rows.reduce((s, t) => s + t.amount_mnt, 0);
  const held = [
    waiting.length ? `${waiting.length} буцаалт — зочин дансаа оруулаагүй` : '',
    unchecked.length ? `${unchecked.length} олголт — данс баталгаажаагүй` : '',
  ].filter(Boolean);
  view.append(head('Олголт, буцаалт', 'Нийлүүлэгчийн олголт, зочны буцаалт. Нэг хүн батлаж, өөр хүн шилжүүлнэ.'));
  // Money is never coloured: the figures stay ink, whatever waits behind them.
  view.append(el(`<div class="kpis kpi-band" id="pay-sum">
    <div class="card kpi"><div class="lab">Шилжүүлэх</div><b>${money(sum(ready))}</b><span>${ready.length ? `${ready.length} олголт, буцаалт — данс бэлэн` : 'одоо шилжүүлэх зүйл алга'}</span></div>
    <div class="card kpi"><div class="lab">Данс хүлээж буй</div><b>${money(sum(waiting) + sum(unchecked))}</b><span>${held.length ? held.join(' · ') : 'данс хүлээж буй мөр алга'}</span></div>
    <div class="card kpi"><div class="lab">Шилжүүлсэн, 30 хоног</div><b>${money(sum(paid))}</b><span>${paid.length ? `${paid.length} удаа` : 'сүүлийн 30 хоногт шилжүүлээгүй'}</span></div>
  </div>`));
  // The table opens on what is to be done; with nothing to send, on what waits, else on everything —
  // unless this person chose a view before, which the table remembers.
  const table = settlementTable(cache.settlements, true, due.length ? 'open' : waiting.length ? 'needs_account' : 'all');
  table.el.id = 'pay';
  // The band above says once whether anything is due and what waits; the table opens on it.
  const section = el('<section class="section"></section>');
  section.append(table.el);
  view.append(section);
}

  order: 'Идэш', listing: 'Идэш', supplier: 'Нийлүүлэгч', settlement: 'Мөнгө', ledger: 'Мөнгө', receipt: 'Мөнгө', guest: 'Зочин',

  message: 'Мэдэгдэл', setting: 'Систем', promotion: 'Онцлох зар',

/**
 * Who did it: the member's name, as the record has always said, and under
 * it the account, the device its session was signed in on, and when — two
 * people may share a name, a browser left signed in acts in its owner's,
 * and every sign-in to the dashboard calls itself «Ops», so the time is
 * what tells one of somebody's sessions from another. It is on the line,
 * where a phone and a screen reader find it too. Hovered, the account's own
 * name as well, and the day in words. A line from before the record kept
 * these, or from the demo's shared key, has the name alone.
 *
 * Every part is one line: a name or a device may carry a line break, and
 * the hover must not gain a line nobody wrote. The cell is built as a node,
 * so the hover is set as text and never parsed.
 */
function auditWho(a) {
  const line = (text) => String(text ?? '').replace(/\s+/g, ' ').trim();
  const name = a.account ? line(a.account.name) : '';
  const contact = a.account ? line(a.account.email ?? phoneText(a.account.phone)) : '';
  const label = a.session ? line(a.session.label) : '';
  const iso = a.session?.signed_in_at;
  const at = iso && ubParts(iso);
  const account = a.account && (contact || (a.account.closed ? 'хаагдсан бүртгэл' : 'бүртгэл'));
  const device = a.session && (label || 'нэргүй төхөөрөмж');
  const signedIn = at && `${dayShort(at.day)} ${at.clock}-д нэвтэрсэн`;
  const cell = el(dtCell.two(a.who.replace(/^ops:/, ''), [account, device, signedIn].filter(Boolean).join(' · ')));
  const hover = [
    a.account && `Бүртгэл: ${[name, contact].filter(Boolean).join(', ') || (a.account.closed ? 'хаагдсан' : '—')}`,
    a.session && `Нэвтрэлт: ${[label, at && `${dayLabel(at.day)} ${at.clock}-д нэвтэрсэн`].filter(Boolean).join(', ') || '—'}`,
  ].filter(Boolean).join('\n');
  if (hover) cell.title = hover;
  return cell;
}

              { name: 'role', label: 'Үүрэг', type: 'select', options: roleOptions, value: 'ops', wide: true, hint: roleList.find((r) => r.key === 'ops')?.description || ' ' },
            ],
            submit: 'Гишүүн нэмэх',
            onSubmit: async (v) => {
              if (!v.guest_id) throw new Error('Хэрэглэгчээ жагсаалтаас сонгоно уу.');
              const added = await ops('/v1/ops/members', { method: 'POST', body: { guest_id: v.guest_id, role: v.role } });
              toast(`${added.name}: ${roleNames.get(added.role) ?? added.role} үүрэгтэй нэмэгдлээ.`, 'good');
              show('members');
            },
          });
          roleHint(document.getElementById('member-new'), roleList);
        },
        'data-v="primary" id="add-member"',
      ),
    ),
  );
  const memberState = (m) => (!m.active ? ['off', 'хаасан'] : m.joined ? ['contracted', 'идэвхтэй'] : ['applied', 'ороогүй']);
  const table = dataTable({
    columns: [
      { key: 'name', label: 'Нэр', render: (m) => `<b>${esc(m.name)}</b>${m.id === me?.id ? ' <small class="muted">(та)</small>' : ''}` },
      {
        key: 'contact',
        label: 'Утас, имэйл',
        value: (m) => `${m.phone ?? ''} ${m.email ?? ''} ${m.account_phone ?? ''} ${m.account_phone ? phoneText(m.account_phone) : ''}`,
        // A seat keeps only a number or an address its account proved. With neither — somebody who signed up with a
        // phone and a password — the number their account typed, marked as unproved: to know them by, never to trust.
        render: (m) =>
          m.phone || m.email || !m.account_phone
            ? dtCell.twoHtml(
                m.phone ? dtCell.phone(m.phone) : m.email ? emailHtml(m.email) : '<span class="dt-unnamed">Баталгаажсан утас, имэйл алга</span>',
                m.phone && m.email ? emailHtml(m.email) : '',
              )
            : dtCell.twoHtml(dtCell.phone(m.account_phone), m.account_phone_verified ? '' : dtCell.pill('hold', 'баталгаагүй')),
      },
      { key: 'role', label: 'Үүрэг', value: (m) => roleNames.get(m.role) ?? m.role },
      { key: 'state', label: 'Төлөв', value: (m) => memberState(m)[1], render: (m) => dtCell.pill(...memberState(m)) },
    ],
    search: { placeholder: 'Нэр, утас, имэйл…' },
    actions: (m) => {
      // Your own seat is another admin's to change.
      if (m.id === me?.id) return null;
      return [
        button(
          'Үүрэг солих',
          () => {
            void popup({
              title: 'Үүрэг солих',
              // The seat's name and what it is known by — never a «·» left hanging after a name with nothing proved.
              sub: [
                m.name,
                m.email ?? (m.phone ? phoneText(m.phone) : m.account_phone ? `${phoneText(m.account_phone)}${m.account_phone_verified ? '' : ' (баталгаагүй)'}` : null),
              ].filter(Boolean).map(esc).join(' · '),
              width: 520,
              id: 'member-role',
              fields: [{ name: 'role', label: 'Үүрэг', type: 'select', options: roleOptions, value: m.role, wide: true, hint: roleList.find((r) => r.key === m.role)?.description || ' ' }],
              onSubmit: async (v) => {
                if (v.role === m.role) return true;
                await ops(`/v1/ops/members/${m.id}/role`, { method: 'POST', body: { role: v.role } });
                toast(`${m.name}: ${roleNames.get(v.role) ?? v.role} үүрэгтэй боллоо.`, 'good');
                show('members');
              },
            });
            roleHint(document.getElementById('member-role'), roleList);
          },
          'data-v="quiet" data-size="sm" data-a="role"',
        ),
        // Said as what it does — the desk closes to them — not «Хаах», which every popup's corner says too.
        button(
          m.active ? 'Ширээнээс гаргах' : 'Ширээнд буцаах',
          () =>
            confirmPopup({
              title: m.active ? 'Ширээнээс гаргах' : 'Ширээнд буцаах',
              // Off closes the desk to them at once, and only the desk: an open dashboard drops to their own
              // corner at its next step, and their account and sign-ins are theirs.
              text: m.active
                ? `<b>${esc(m.name)}</b> Basu-гийн ширээнд шууд орохоо болино — нээлттэй байгаа ширээ нь ч дараагийн алхамд хаагдана. Бүртгэл нь хэвээр, Basu-гийн вэб, апп-д нэвтэрсэн хэвээр үлдэнэ. Дараа нь дахин нээж болно.`
                : `<b>${esc(m.name)}</b> ${esc(roleNames.get(m.role) ?? m.role)} үүргээрээ ширээнд дахин орно.`,
              ok: m.active ? 'Ширээнээс гаргах' : 'Ширээнд буцаах',
              danger: m.active,
              onConfirm: async () => {
                await ops(`/v1/ops/members/${m.id}/active`, { method: 'POST', body: { active: !m.active } });
                toast(m.active ? `${m.name} ширээнээс гарлаа.` : `${m.name} ширээнд буцаж орлоо.`, 'good');
                show('members');
              },
            }),
          'data-v="quiet" data-size="sm" data-a="active"',
        ),
      ];
    },
    sort: { key: 'name' },
    rowAttrs: (m) => ({ 'data-member': m.id, 'data-off': !m.active }),
    noun: 'гишүүн',
    empty: { title: 'Гишүүн алга', text: '«Гишүүн нэмэх» товчоор хэрэглэгчдээс сонгож нэмнэ.' },
  });
  table.el.id = 'members';
  const section = el('<section class="section"></section>');
  section.append(table.el);
  view.append(section);
  try {
    table.setRows((await ops('/v1/ops/members')).members);
  } catch (error) {
    toast(error.message, 'bad');
    table.setRows([]);
  }
  // What each role opens, before a role is handed to anybody: made and changed on the roles page.
  if (hasPage('roles')) {
    const go = el('<p class="page-note" id="desk-roles">Үүрэг бүр ямар хуудас, үйлдэл нээхийг <a href="#desk/roles">«Үүрэг, эрх»</a> хуудсанд үүсгэж, засна.</p>');
    go.querySelector('a').addEventListener('click', (e) => {
      e.preventDefault();
      show('roles');
    });
    view.append(go);
    return;
  }
  try {
    const matrix = await ops('/v1/access/roles?scope=desk');
    if (tab !== 'members') return;
    const roles = matrixTable(matrix);
    roles.prepend(el('<h2 class="section-label">Эрх бүр юу хийдэг</h2>'));
    roles.id = 'desk-roles';
    view.append(roles);
  } catch {
    /* the page stands without the table */
  }
}

/* ── boot ─────────────────────────────────────────────────────────── */

/** The session this page last drew — to notice when the browser has moved on to somebody else. */
let bootedAs = null;

/**
 * Signed in or not; and if so, where this person works. The server says
 * which places and which pages; the page opens the one the address names,
 * or the one used last.
 */
async function boot() {
  // The shape of what is coming, drawn before anything is asked: the frame for somebody signed in on this
  // browser, the door's card for anybody else — never a blank page while the first answer is on its way. The
  // page's own first paint of the door (its brand, title and line, in the HTML before this script) stays up
  // until the door itself replaces it.
  // Back from Google counts as signed in already: the code in the address becomes the session in a moment.
  if (token() || /[#&]auth_code=/.test(location.hash)) root.replaceChildren(frameSkeleton());
  else {
    document.documentElement.removeAttribute('data-signed');
    root.replaceChildren(root.querySelector(':scope > .door-shell') ?? doorSkeleton());
  }
  // Back from Google, the code in the address is claimed first, and the
  // session it becomes is this browser's person, whoever was signed in here
  // before (api.js, authReturn).
  await authReturn;
  bootedAs = token();
  if (!bootedAs) {
    access = ws = nav = me = null;
    showToken();
    return;
  }
  if (!root.querySelector(':scope > .boot')) root.replaceChildren(frameSkeleton());
  try {
    access = await ops('/v1/access');
  } catch (error) {
    if (error.status === 401 || error.status === 503) return signedOut(error);
    // The desk wants a fresh sign-in: its door is up already (`refused`).
    if (error.code === 'SIGN_IN_AGAIN') return;
    bootFailed(error);
    return;
  }
  // Somebody is signed in and the server took it: whatever the door last said is past.
  doorWhy = null;
  // Came to register a business: their own corner, the registration popup open on it, «Идэшний нийлүүлэгч» ticked.
  if (joining()) {
    joined();
    const corner = access.workspaces.find((x) => x.kind === 'me');
    if (corner) {
      wanted = 'join-business';
      open(corner, 'home');
      return;
    }
  }
  const { w, page } = choose(location.hash);
  open(w, page);
}

// Another tab signed somebody else in, or signed out; or the back button
// brought this page out of the cache after that. This one follows, rather
// than keep drawing a person the browser no longer holds.
addEventListener('storage', (event) => {
  if ((event.key === 'basu.guest' || event.key === null) && token() !== bootedAs) void boot();
});
addEventListener('pageshow', (event) => {
  if (event.persisted && token() !== bootedAs) void boot();
});

// A link from the supplier's screen, or the back button: the address names another place or page.
addEventListener('hashchange', () => {
  if (!access) return;
  const { w, page } = choose(location.hash);
  if (w && (w.id !== ws?.id || (page && page !== tab))) open(w, page);
});

boot();
</script>
