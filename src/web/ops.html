<!doctype html>
<html lang="mn" data-theme="light" data-desk>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F3EE">
<title>Dashboard — Basu</title>
<link rel="stylesheet" href="/app.css">
<script src="/vendor/table-core.js"></script>
<style>
/* ── The desk ──────────────────────────────────────────────────────
   Two or three people, all day, at a computer. Tokens, type, buttons,
   chips, cards, rows, tables and the sidebar all come from /app.css;
   what is left here is where things sit. */
p{margin:0}

/* the door */
.door{min-height:100dvh;display:grid;place-items:center;padding:var(--s-6) var(--gutter)}
.pair{width:100%;max-width:420px;padding:28px}
.pair .brand{margin-bottom:20px}
.pair h2{margin-bottom:6px}
.pair p{color:var(--ink-2);margin-bottom:20px}
.pair .callout{margin:12px 0 16px}
.pair .input{margin-bottom:10px}

/* the frame: the grid, the sidebar and the drawer are /app.css's .desk-frame */
.main{min-width:0}
.page{max-width:var(--col-desk);margin:0 auto;padding:var(--s-7) var(--gutter) 64px}
.page > .back{margin-bottom:4px}
.page-head + .section{margin-top:0}
.page-head + .kpi-band{margin-bottom:8px}
.org-row{cursor:pointer}
.pair-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 16px;align-items:start}
/* a business's front page: a door to each of its parts */
.org-doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.org-door h3{font-size:var(--t-row);margin:0 0 10px}
.org-door .links{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.door-link{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 8px;border-radius:var(--r-sm);font-size:var(--t-body);font-weight:500;color:var(--ink-2)}
.door-link svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-3)}
@media (hover:hover){.door-link:hover{background:var(--surface-2);color:var(--ink)}}
/* who may do what: permissions down, roles across, the reader's own column marked */
.table.roles th.role-col,.table.roles td.role-col{width:96px;text-align:center}
.table.roles th.yours{color:var(--ink)}
.table.roles th.role-col small{display:block;font-family:var(--mono);font-size:var(--t-meta);font-weight:500;color:var(--accent-ink);text-transform:none;letter-spacing:0}
.table.roles td.yours{background:var(--surface-2)}
.table.roles .yes svg{width:18px;height:18px;fill:none;stroke:var(--ready);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.table.roles .no{color:var(--ink-3)}
.table.roles tr.role-sec td{padding-top:18px;font-family:var(--mono);font-size:var(--t-eyebrow);font-weight:500;letter-spacing:var(--track-eyebrow);text-transform:uppercase;color:var(--ink-3);background:none}
/* the roles page: every role in one table; a role is made and changed in a popup, module by module */
.roles-tools{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.roles-tools .section-title{flex:1;min-width:0;margin:0}
.roles-tools .section-title .n{margin:0 0 0 8px}
.roles-table .who{display:flex;align-items:flex-start;gap:12px;min-width:260px}
.roles-table .who b{font-size:var(--t-row);font-weight:600}
.roles-table .who .tags{display:inline-flex;gap:6px;margin-left:8px;vertical-align:1px}
.roles-table .who small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:52ch;margin-top:2px;font-size:var(--t-cap);font-weight:400;line-height:1.4;color:var(--ink-2)}
.roles-table tr[data-on] td{background:var(--accent-soft)}
.role-mark{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);font-size:var(--t-cap);font-weight:600;color:var(--ink-2)}
.role-mark svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.role-mark[data-locked]{background:var(--ink);border-color:var(--ink);color:var(--ink-inverse)}
/* a role's fingerprint: every module in menu order, lit where the role opens it */
.role-strip{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.role-strip span{display:grid}
.role-strip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.role-strip [data-off]{color:var(--line-2)}
/* the popup: who the role is on top, its name and its modules in the middle, the buttons at the foot */
.role-sheet{--sheet-w:780px}
.role-sheet > header{padding:16px 20px}
.role-top{display:flex;align-items:flex-start;gap:14px;min-width:0}
.role-top .role-mark{width:44px;height:44px;border-radius:var(--r-ctl);font-size:var(--t-body-lg)}
.role-top .role-mark svg{width:22px;height:22px}
.role-id{flex:1;min-width:0}
.role-id h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap;overflow-wrap:anywhere}
.role-id .sub{max-width:62ch}
.role-id .sub:empty{display:none}
.role-stats{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:var(--t-cap);color:var(--ink-3)}
.role-stats b{margin-right:4px;font-family:var(--mono);font-weight:600;color:var(--ink)}
.role-sheet > .body{padding-bottom:4px}
.role-sheet .callout{margin:18px 20px 0}
.role-sec{padding:18px 20px}
.role-sec + .role-sec{border-top:1px solid var(--line)}
.role-sec-head{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.role-sec-head h3{flex:1;min-width:0;display:flex;align-items:center;font-size:var(--t-title-3);font-weight:600}
.role-sec-head .meta{font-family:var(--mono);font-size:var(--t-meta);color:var(--ink-3)}
.role-step{display:inline-grid;place-items:center;width:22px;height:22px;flex:none;margin-right:10px;border-radius:50%;background:var(--ink);color:var(--ink-inverse);font-family:var(--mono);font-size:var(--t-meta);font-weight:600}
@media (min-width:640px){.role-sheet .fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
.role-flags{display:flex;flex-direction:column;margin-top:4px;border-top:1px solid var(--line)}
.role-flag{display:flex;align-items:flex-start;gap:12px;padding:12px 0 0;cursor:pointer}
.role-flag b{display:block;font-size:var(--t-body);font-weight:600;color:var(--ink)}
.role-flag small{display:block;margin-top:2px;font-size:var(--t-cap);color:var(--ink-3);line-height:1.4}
.role-hint{margin:-4px 0 14px;font-size:var(--t-cap);line-height:1.5;color:var(--ink-2)}
.role-hint b{font-weight:600;color:var(--ink)}
/* one module a row: its level on the right, its pages and actions unfolded below */
.role-mod-list{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.role-mod + .role-mod{border-top:1px solid var(--line)}
.role-mod-head{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 6px;flex-wrap:wrap}
.role-fold{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:12px;padding:6px 8px;border:0;border-radius:var(--r-sm);background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
@media (hover:hover){.role-fold:hover{background:var(--surface-2)}}
.role-fold .ic{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.role-fold .ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.role-fold .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.role-fold .t b{font-size:var(--t-body-lg);font-weight:600}
.role-fold .t small{font-size:var(--t-cap);color:var(--ink-3)}
.role-fold .fold{display:grid;color:var(--ink-3)}
.role-fold .fold svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--dur)}
.role-fold[aria-expanded="false"] .fold svg{transform:rotate(-90deg)}
.role-mod[data-level="none"] .role-fold .ic{color:var(--ink-3)}
.role-mod[data-level="none"] .role-fold .t b{color:var(--ink-2)}
.role-mod[data-level="full"] .role-fold .ic{background:var(--ink);border-color:var(--ink);color:var(--ink-inverse)}
.role-mod[data-level="view"] .role-fold .ic,.role-mod[data-level="some"] .role-fold .ic{background:var(--accent-soft);border-color:var(--line-2)}
.role-level{flex:none}
.role-level button{min-height:30px;padding:0 12px}
.role-level button[disabled]{cursor:default}
.role-pages{padding:0 14px 6px 60px}
.role-page{display:grid;grid-template-columns:minmax(140px,200px) minmax(0,1fr);gap:8px 20px;padding:12px 0;border-top:1px solid var(--line)}
.role-view{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.role-view b{display:block;font-size:var(--t-body);font-weight:600;line-height:20px}
.role-view small{display:block;font-size:var(--t-meta);color:var(--ink-3);margin-top:2px}
.role-acts{display:flex;flex-direction:column;gap:10px}
.role-acts label{display:flex;align-items:flex-start;gap:10px;font-size:var(--t-cap);line-height:20px;color:var(--ink-2);cursor:pointer}
.role-acts .none{font-size:var(--t-cap);line-height:20px;color:var(--ink-3)}
.role-page:not(:has([data-view]:checked)) .role-acts label{color:var(--ink-3)}
.role-sheet > footer{flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px}
.role-sheet > footer .sum{flex:1 1 200px;min-width:0;font-size:var(--t-cap);color:var(--ink-2)}
.role-sheet > footer .sum b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.role-sheet > footer[data-dirty] .sum::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--hold);vertical-align:1px}
@media (max-width:640px){
  .role-sheet > header,.role-sec{padding-left:16px;padding-right:16px}
  .role-sec-head .meta{display:none}
  .role-mod-head{padding:8px 10px 12px 2px}
  .role-level{display:flex;width:100%;margin-left:8px}
  .role-level button{flex:1;min-height:36px}
  .role-pages{padding-left:14px}
  .role-page{grid-template-columns:1fr}
  .role-acts{padding-left:30px}
  .role-sheet > footer .sum{flex-basis:100%}
  .role-sheet > footer .sum:empty{display:none}
  .role-sheet > footer .btn{flex:1 1 0;padding:0 10px}
}
.sec-mod{display:inline-flex;align-items:center;gap:8px}
.sec-mod svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-3)}
.table.roles tr.perm-act td:first-child{padding-left:28px;font-size:var(--t-cap);color:var(--ink-2)}
.table.roles tr.perm-page td:first-child{font-weight:500}
/* the menu page: each module a card, its pages rows under it, read as the sidebar draws them;
   every change is a popup, the arrows reorder */
.menu-board{display:flex;flex-direction:column;gap:12px}
.menu-mod-head,.menu-page{display:flex;align-items:center;gap:12px;padding:10px 16px}
.menu-mod-head{padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--r-md) var(--r-md) 0 0}
.menu-page{border-top:1px solid var(--line)}
.menu-page:first-child{border-top:0}
.menu-mod-head .t,.menu-page .t{flex:1;min-width:0}
.menu-mod-head .t b{display:block;font-size:var(--t-row);font-weight:600}
.menu-page .t b{display:block;font-size:var(--t-body);font-weight:500}
.menu-mod-head .t small,.menu-page .t small{display:block;margin-top:2px;font-size:var(--t-meta);color:var(--ink-3);overflow-wrap:anywhere}
.menu-page[data-off] .t b{color:var(--ink-3)}
.menu-page[data-off] .menu-ico{opacity:.45}
.menu-ico{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.menu-ico svg{width:18px;height:18px;fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.menu-acts{display:flex;align-items:center;gap:6px;flex:none}
.menu-moves{display:flex;align-items:center;gap:2px;margin-right:4px}
.menu-moves .btn:disabled{visibility:hidden}   /* the first cannot go up, the last cannot go down: nothing to press, nothing drawn */
.menu-pages > .empty{padding:12px 16px}
@media (max-width:600px){
  .menu-mod-head,.menu-page{gap:8px;padding-left:12px;padding-right:12px}
  .menu-mod-head .t small{display:none}
}

/* rows in one card (settings, a business's roles, the businesses): a hairline between each */
[data-rows] > .row + .row{border-top:1px solid var(--line)}
/* a setting's value, at the right of its row: a long one wraps rather than pushing the row wide */
.setting-value{max-width:45%;text-align:right;overflow-wrap:anywhere;font-size:var(--t-body)}
/* a page whose part of Basu is not joined up yet */
.soon{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 24px}
.soon-mark{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);margin-bottom:12px}
.soon-mark svg{width:22px;height:22px;fill:none;stroke:var(--ink-3);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.soon h3{margin:0 0 6px}
.soon .cap{max-width:52ch;margin:0}
@media (max-width:900px){
  .page{padding:var(--s-5) var(--s-5) var(--s-8)}
}

/* tables that are not data tables (a few facts), KPI rows */
.card > .table-wrap{border-radius:inherit}
.card-foot{padding:12px 20px;border-top:1px solid var(--line)}
.table:has(tr[data-link]) th:last-child{padding-right:32px}
.table td.end{text-align:right}
.run-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
/* Until app.css scopes `.kpi-band .kpi span` to `> span`: money() inside a
   KPI value keeps the value's size, weight and tone instead of the caption's. */
.kpi-band .kpi b span{display:inline;font-size:inherit;color:inherit;line-height:inherit}
.kpi-band .kpi b .cur{font-size:.65em;font-weight:500}

/* rows: suppliers, kitchens, settlements — hairline rows in one container */
.rows[data-rows]{overflow:visible}
/* a list with nothing in it is a hairline and one line, not a boxed card */
.rows[data-rows]:has(> .empty:only-child){background:none;border:0;border-radius:0;box-shadow:none}
.rows[data-rows] > .empty:only-child{border-top:1px solid var(--line);padding-left:0;padding-right:0}
.rows[data-rows] > .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:14px 20px}
.row .name{font-size:var(--t-row);font-weight:600;line-height:var(--lh-snug);min-width:0}
.row .name .pill{margin-left:6px}
.row .name small{display:block;font-size:var(--t-cap);font-weight:400;line-height:1.5;color:var(--ink-2);margin-top:3px}
.row .right{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.row .btns{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row .amount{font-size:var(--t-title-3)}
.row[data-paid] .name{color:var(--ink-2)}
.row[data-paid] .amount .money{color:var(--ink-3)}
.row .about{grid-column:1 / -1;font-size:var(--t-cap);line-height:1.5;color:var(--ink-2)}
.row .about b{font-weight:500;color:var(--ink)}
.row .drawer{grid-column:1 / -1;padding-top:12px;border-top:1px solid var(--line)}
.row .drawer .table th:first-child,.row .drawer .table td:first-child{padding-left:0}
.row .drawer .table th:last-child,.row .drawer .table td:last-child{padding-right:0}
.row .code{grid-column:1 / -1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r-ctl);background:var(--ready-soft);border:1px solid var(--ready-line);color:var(--ready);font-size:var(--t-cap)}
.row .code b{font-size:var(--t-title-3);font-weight:600;letter-spacing:.12em;color:inherit}
.sess{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:var(--t-body)}
.sess small{display:block;font-size:var(--t-cap);color:var(--ink-3)}
@media (max-width:720px){
  .rows[data-rows] > .row{grid-template-columns:1fr}
  .row .right,.row .btns{justify-content:flex-start}
  /* a wide table scrolls inside its wrap instead of squeezing every cell */
  .table:has(th:nth-child(4)){min-width:640px}
  .table:has(th:nth-child(4)) td:first-child,.table:has(th:nth-child(4)) .sub{white-space:nowrap}
}

/* the overflow menu: every action stays in the DOM, one is in view */
.more{position:relative;display:inline-flex}
.more > summary{list-style:none}
.more > summary::-webkit-details-marker{display:none}
.more > summary svg{fill:currentColor;stroke:none}
.more > .menu{position:absolute;right:0;top:calc(100% + 4px);z-index:var(--z-bar);min-width:220px;display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);box-shadow:var(--shadow-float)}
.more > .menu .btn{width:100%;justify-content:flex-start}
.more > .menu .btn.ink-stop{color:var(--stop)}

/* one order, one guest */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1000px){.detail{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px 20px;padding:20px;font-size:var(--t-body);line-height:1.45;color:var(--ink-2)}
.facts .lab{display:block;margin-bottom:4px}
.facts b{font-size:var(--t-row);font-weight:600;color:var(--ink)}
.section-label .btn{margin-left:auto}
.section-label:has(.btn){align-items:center}
.section-label .label-acts{display:flex;gap:6px;margin-left:auto}
.section-label .label-acts .btn{margin-left:0}
/* a page's own buttons: at the right of its head, the one that adds a thing inked */
.head-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
a.tel{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:500}
a.tel svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;flex-direction:column;gap:10px}
.acts .hint{font-size:var(--t-cap);line-height:1.45;color:var(--ink-3)}
.acts .sep{height:1px;background:var(--line);margin:4px 0}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{width:14px;height:14px;fill:var(--star)}
.stars svg[data-off]{fill:var(--line-2)}

/* the log: who, what, when */
.log li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 20px;font-size:var(--t-body)}
.log li.empty{display:block}
.log .who{font-weight:500;color:var(--ink-2);white-space:nowrap}
.log .when{white-space:nowrap;text-align:right}
.log small{display:block;font-size:var(--t-cap);line-height:1.4;color:var(--ink-2)}
.log .when .pill{margin-top:4px}

/* one toned word inside a sentence */
.ink-stop{color:var(--stop)}
.ink-hold{color:var(--hold)}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { api, ApiError, store, toast, mnt, money, KIND, HEADLINE, dayLabel, signInDoors, accountWays, takeSession, dropSession, popup, confirmPopup } from '/api.js';
import { NAV_ICON, deskFrame } from '/sidenav.js';
import { dataTable, dtCell } from '/datatable.js';

const root = document.getElementById('root');
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
const esc = (value) => {
  const node = document.createElement('span');
  node.textContent = value ?? '';
  return node.innerHTML;
};
const when = (iso) => (iso ? dayLabel(iso.slice(0, 10)) : '—');
const clockOf = (iso) => {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};
/** A date with its time, as one mono run: the table's "өнөөдөр 11:16". */
const stamp = (iso) => `<span class="mono">${when(iso)} ${clockOf(iso)}</span>`;
const CHEV = '<svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>';
const PHONE = '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>';
const tel = (phone) => `<a class="tel mono" href="tel:${esc(phone)}">${PHONE}${esc(phone)}</a>`;
/** Three rows of the shape that is coming, while it loads. */

/**
 * Why the door is up, when the server said: the desk wants a sign-in more
 * recent than the one this browser held. Kept until somebody is signed in
 * again, so a second reason to show the door does not wipe the first.
 */
let doorWhy = null;
/** The latest drawing of the door: two calls noticing at once draw it once. */
let doorDrawn = 0;

async function showToken() {
  const drawing = ++doorDrawn;
  root.replaceChildren();
  // The demo hands its secret out; anywhere else a member signs in by phone.
  const demo = await api('/dev/ops-token').catch(() => null);
  if (drawing !== doorDrawn) return;
  const door = el('<div class="door"></div>');
  const why = doorWhy ? `<div class="callout" data-k="info" role="status" id="door-why"><span>${esc(doorWhy)}</span></div>` : '';
  if (demo?.token) {
    const card = el(`
      <div class="card pair">
        <div class="brand wordmark">Basu<small>Ops</small></div>
        <h2>Демо горим</h2>
        ${why}
        <p>Нууц үг автоматаар орлоо. Нэвтрэхэд л болно.</p>
        <input class="input" type="password" placeholder="OPS_TOKEN" aria-label="Ops нууц" autocomplete="off">
        <button class="btn" data-v="primary" data-size="lg" type="button">Нэвтрэх</button>
      </div>`);
    const input = card.querySelector('input');
    input.value = demo.token;
    const submit = async () => {
      takeSession(input.value.trim());
      try {
        ({ member: me } = await api('/v1/ops/me', { token: token() }));
        boot();
      } catch (error) {
        store.guestToken = null;
        toast(error.message, 'bad');
      }
    };
    card.querySelector('button').addEventListener('click', submit);
    input.addEventListener('keydown', (e) => e.key === 'Enter' && submit());
    door.append(card);
    root.append(door);
    return;
  }
  const card = el(`
    <div class="card pair">
      <div class="brand wordmark">Basu<small>Ops</small></div>
      <h2>Нэвтрэх</h2>
      ${why}
      <p id="door-lead">Нэвтэрнэ үү.</p>
      <div data-doors></div>
    </div>`);
  // Every way in — Google, a code by email, a password and its reset — is
  // the shared block, and the session it makes is the browser's one person,
  // the same as on the website. What the account may do is its roles',
  // which it asks for once inside.
  const doors = signInDoors({ device: 'Ops', returnTo: '/dashboard', onToken: () => boot() });
  card.querySelector('[data-doors]').append(doors);
  // Say only the ways that are really on the card.
  doors.ready.then((open) => {
    const others = [open.google && 'Google', open.email && 'имэйл'].filter(Boolean);
    const ways = others.length ? `${others.join(', ')} эсвэл нууц үгээрээ` : 'нууц үгээрээ';
    card.querySelector('#door-lead').textContent = `${ways[0].toUpperCase()}${ways.slice(1)} нэвтэрнэ үү.`;
  });
  door.append(card);
  root.append(door);
}

          `<div class="card kpi"><div class="lab">Улирал</div><b>${h.season.handed}</b><span>хүлээлгэн өгсөн</span></div>`,

  view.append(grid);

    e.preventDefault();
    show('roles');
  });

  notify: 'Хонх', system: 'Дэлгэц', venues: 'Ресторан', lunches: 'Таваг', reviews: 'Од', stats: 'График', orders: 'Баримт',
  suppliers: 'Дэлгүүр', audit: 'Цаг', shield: 'Бамбай', today: 'Хуанли', menu: 'Цэс', kitchen: 'Гал тогоо', truck: 'Машин',
  tag: 'Шошго', file: 'Файл',
};
const SCOPE_WORD = { desk: 'Basu ops', org: 'Байгууллага' };
let accessScope = localStorage.getItem('basu.ops.access') === 'org' ? 'org' : 'desk';
/** The role the roles page opens on next: the one just made or saved. */
let rolePick = null;

/** The desk's roles, for the pickers that seat somebody: asked once a page, and again after the roles change. */
let deskRoles = null;

/** Desk or business: the switch the roles and menu pages share. */
function scopeSeg(onChange) {

}

/**
 * Who may do what, read-only: each module's pages and what can be done on
 * each, a mark under every role that may, the reader's own column lit.
 */
function matrixTable(table) {
  const roles = table.roles;
  const opens = (r, p) => r.locked || (r.permissions ?? []).includes(p);
  const lit = (r) => (r.key === table.yours ? ' yours' : '');
  const cols = (p) => roles.map((r) => `<td class="role-col${lit(r)}">${opens(r, p) ? `<span class="yes" aria-label="тийм">${NAV_ICON.check}</span>` : '<span class="no" aria-label="үгүй">—</span>'}</td>`).join('');
  const thead = `<tr><th>Хуудас, үйлдэл</th>${roles.map((r) => `<th class="role-col${lit(r)}">${esc(r.name)}${r.key === table.yours ? '<small>та</small>' : ''}</th>`).join('')}</tr>`;
  const body = table.modules
    .map((m) => {
      const pages = table.pages.filter((p) => p.module === m.key && !p.hidden);
      if (!pages.length) return '';
      return `<tr class="role-sec"><td colspan="${roles.length + 1}"><span class="sec-mod">${NAV_ICON[m.icon] ?? ''}${esc(m.name)}</span></td></tr>${pages
        .map((p) => `<tr class="perm-page"><td>${esc(p.name)}</td>${cols(p.permission)}</tr>${p.actions.map((a) => `<tr class="perm-act"><td>${esc(a.label)}</td>${cols(a.permission)}</tr>`).join('')}`)
        .join('')}`;
    })
    .join('');
  return el(`<section class="section"><div class="card"><div class="table-wrap"><table class="table roles"><thead>${thead}</thead><tbody>${body}</tbody></table></div></div></section>`);
}

/** Text for an attribute: esc() leaves quotes as they are. */
const attr = (value) => esc(value).replace(/"/g, '&quot;');

/** A scope's modules in menu order, each with its pages and every permission in it. */
const moduleTree = (data) =>
  data.modules
    .map((m) => {
      const pages = data.pages.filter((p) => p.module === m.key);
      const kinds = new Set(pages.map((p) => p.kind ?? ''));
      return {
        ...m,
        pages,
        views: pages.map((p) => p.permission),
        acts: pages.flatMap((p) => p.actions.map((a) => a.permission)),
        // A module whose pages all run at one kind of business says so once, not on every page.
        kind: kinds.size === 1 ? [...kinds][0] || null : null,
      };
    })
    .filter((m) => m.pages.length > 0);

/** What a role opens, as a set: the admin role every page and action there is. */
const opensOf = (data, role) =>
  new Set(role.locked ? data.pages.flatMap((p) => [p.permission, ...p.actions.map((a) => a.permission)]) : role.permissions ?? []);

/** How far a role opens a module: not at all, every page to read, every page and action, or something in between. */
function levelOf(m, held) {
  const views = m.views.filter((p) => held.has(p)).length;
  const acts = m.acts.filter((p) => held.has(p)).length;
  if (!views && !acts) return 'none';
  if (views === m.views.length && acts === m.acts.length) return 'full';
  if (views === m.views.length && !acts) return 'view';
  return 'some';
}

/** Open a module to a level: its pages to read unless shut, its actions only when whole. */
function setLevel(m, held, level) {
  for (const p of m.views) {
    if (level === 'none') held.delete(p);
    else held.add(p);
  }
  for (const p of m.acts) {
    if (level === 'full') held.add(p);
    else held.delete(p);
  }
}

/** A role's mark: the admin role's shield, else the first letters of its name. */
function roleMark(role) {
  if (role.locked) return `<span class="role-mark" data-locked>${NAV_ICON.shield}</span>`;
  const words = (role.name ?? '').trim().split(/\s+/).filter(Boolean).map((w) => [...w]);
  const letters = words.length > 1 ? words.slice(0, 2).map((w) => w[0].toUpperCase()).join('') : words.length ? words[0][0].toUpperCase() + (words[0][1] ?? '') : '';
  return `<span class="role-mark">${letters ? esc(letters) : NAV_ICON.plus}</span>`;
}

/** A role not made yet: empty, or a copy of another role's pages and actions. */
const draftRole = (data, from) => ({
  key: null,
  name: from ? `${from.name} (хуулбар)`.slice(0, 40) : '',
  description: from?.description ?? '',
  permissions: from ? [...opensOf(data, from)] : [],
  locked: false,
  head: false,
  everyone: from ? from.everyone !== false : true,
  builtin: false,
});

/**
 * The roles page: every role of the desk or of businesses in one table —
 * what it opens, module by module, and who holds it. A role is made and
 * changed in a popup: a name, then each module shut, open to read or open
 * whole, and unfolded for anything in between. The admin role opens
 * everything and stays as it is.
 */
async function renderRoles(view) {
  const lit = rolePick;
  rolePick = null;
  const manage = can('desk.roles:manage');
  view.append(head('Үүрэг, эрх', 'Үүрэг бүр ямар модуль, хуудас, үйлдэл нээхийг энд тохируулна. Хүн бүрийн цэс, эрх үүнээс шууд гарна.', '<div data-seg></div>'));
  view.querySelector('[data-seg]').replaceWith(scopeSeg(() => show('roles')));
  const box = el(`
    <section class="roles-page">
      <div class="roles-tools"><h2 class="section-title">Үүргүүд<span class="n" data-count></span></h2></div>
      <div class="card"><div class="table-wrap"><table class="table roles-table" id="roles-table">
        <thead><tr><th>Үүрэг</th><th>Модуль</th><th class="num">Хуудас</th><th class="num">Үйлдэл</th><th class="num">Хүн</th></tr></thead>
        <tbody></tbody>
      </table></div></div>
    </section>`);
  view.append(box);
  let data;
  try {
    data = await ops(`/v1/ops/access/${accessScope}`);
  } catch (error) {
    box.replaceWith(el(`<p class="empty">${esc(error.message)}</p>`));
    return;
  }
  if (tab !== 'roles') return;
  const mods = moduleTree(data);
  const actsTotal = data.pages.reduce((n, p) => n + p.actions.length, 0);
  const open = (role, from = null) => openRoleSheet(data, mods, role, { manage, from, onCopy: (r) => open(draftRole(data, r), r) });
  box.querySelector('[data-count]').textContent = String(data.roles.length);
  if (manage) {
    const add = el(`<button class="btn" data-v="primary" type="button" id="role-new">${NAV_ICON.plus}Шинэ үүрэг</button>`);
    add.addEventListener('click', () => open(draftRole(data, null)));
    box.querySelector('.roles-tools').append(add);
  }
  const body = box.querySelector('tbody');
  for (const r of data.roles) {
    const held = opensOf(data, r);
    const tags = [
      r.locked && '<span class="badge" data-tone="neutral">бүгдийг нээнэ</span>',
      r.head && '<span class="badge" data-tone="neutral">эзэн</span>',
      accessScope === 'org' && !r.everyone && '<span class="badge" data-tone="hold">сонгосон байгууллагад</span>',
    ].filter(Boolean).join('');
    const strip = mods.map((m) => `<span title="${attr(m.name)}"${levelOf(m, held) === 'none' ? ' data-off' : ''}>${NAV_ICON[m.icon] ?? ''}</span>`).join('');
    const acts = data.pages.reduce((n, p) => n + p.actions.filter((a) => held.has(a.permission)).length, 0);
    const row = el(`
      <tr data-role="${attr(r.key)}" data-link tabindex="0"${r.key === lit ? ' data-on' : ''}>
        <td><div class="who">${roleMark(r)}<div><b>${esc(r.name)}</b>${tags ? `<span class="tags">${tags}</span>` : ''}<small>${esc(r.description ?? '')}</small></div></div></td>
        <td><span class="role-strip">${strip}</span></td>
        <td class="num">${data.pages.filter((p) => held.has(p.permission)).length}/${data.pages.length}</td>
        <td class="num">${acts}/${actsTotal}</td>
        <td class="num">${data.usage[r.key] ?? 0}</td>
      </tr>`);
    row.addEventListener('click', () => open(r));
    row.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      open(r);
    });
    body.append(row);
  }
}

/**
 * The popup a role is made or changed in, over the page. It closes on its
 * cross, on Esc and on the dim around it — asking first when something typed
 * would be lost — keeps the keyboard inside while open, and gives the focus
 * back to whatever opened it.
 */
function openRoleSheet(data, mods, role, { manage, from = null, onCopy }) {
  const opener = document.activeElement;
  const scrim = el('<div class="scrim"></div>');
  let editor = null;
  let closed = false;
  /** Close, or — with something typed and not saved — ask first, and do `after` once it is closed. */
  const close = (force = false, after = null) => {
    if (closed) return true;
    if (!force && editor.dirty()) {
      void confirmPopup({
        title: 'Хадгалаагүй өөрчлөлт',
        text: 'Энэ үүрэгт хийсэн өөрчлөлт хадгалагдаагүй байна. Хаавал алга болно.',
        ok: 'Хадгалахгүй хаах',
        cancel: 'Үргэлжлүүлэх',
        danger: true,
        onConfirm: () => {
          close(true);
          after?.();
          return true;
        },
      });
      return false;
    }
    closed = true;
    document.removeEventListener('keydown', onKey, true);
    const sheet = editor.root;
    // The next popup may open before this one has faded: only one answers to the name.
    sheet.removeAttribute('id');
    sheet.removeAttribute('data-open');
    scrim.removeAttribute('data-open');
    document.documentElement.removeAttribute('data-modal-open');
    setTimeout(() => {
      sheet.remove();
      scrim.remove();
    }, 260);
    if (opener?.isConnected) opener.focus();
    return true;
  };
  const onKey = (e) => {
    // A question asked over this popup answers the keys itself.
    if (document.querySelector('.sheet.popup[data-open]')) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      close();
      return;
    }
    if (e.key !== 'Tab') return;
    const stops = [...editor.root.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled])')].filter((n) => n.getClientRects().length > 0);
    if (!stops.length) return;
    const [first, last] = [stops[0], stops[stops.length - 1]];
    const inside = editor.root.contains(document.activeElement);
    if (e.shiftKey && (!inside || document.activeElement === first)) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && (!inside || document.activeElement === last)) {
      e.preventDefault();
      first.focus();
    }
  };
  editor = roleEditor(data, mods, role, {
    manage,
    from,
    close,
    copy: () => {
      if (close(false, () => onCopy(role))) onCopy(role);
    },
  });
  scrim.addEventListener('click', () => close());
  document.addEventListener('keydown', onKey, true);
  document.body.append(scrim, editor.root);
  document.documentElement.setAttribute('data-modal-open', '');
  void editor.root.offsetWidth; // the closed state is drawn once, so opening is a movement rather than a jump
  scrim.setAttribute('data-open', '');
  editor.root.setAttribute('data-open', '');
  (role.key ? editor.root : editor.root.querySelector('[name="name"]') ?? editor.root).focus();
}

/**
 * One role in the popup, module by module. `held` is what the role opens as
 * it is being edited, and every box, level and count is drawn from it, so a
 * module's level, a page's box and an action's box never disagree. An action
 * brings its page along; a page taken away takes its actions with it.
 */
function roleEditor(data, mods, role, { manage, from, close, copy }) {
  const fresh = !role.key;
  const fixed = role.locked || !manage;
  const org = data.scope === 'org';
  const all = data.pages.flatMap((p) => [p.permission, ...p.actions.map((a) => a.permission)]);
  const actsTotal = all.length - data.pages.length;
  let held = opensOf(data, role);
  const kindWord = { supplier: 'нийлүүлэгчид', restaurant: 'ресторанд' };
  const step = (n) => (fresh ? `<span class="role-step">${n}</span>` : '');
  const badges = [
    role.locked && '<span class="badge" data-tone="neutral">бүгдийг нээнэ</span>',
    role.builtin && !role.locked && '<span class="badge" data-tone="neutral">үндсэн</span>',
    role.head && '<span class="badge" data-tone="neutral">эзэн</span>',
    org && !fresh && !role.everyone && '<span class="badge" data-tone="hold">сонгосон байгууллагад</span>',
  ].filter(Boolean).join('');
  const root = el(`
    <div class="sheet role-sheet" data-center id="role-edit" role="dialog" aria-modal="true" aria-labelledby="role-edit-title" tabindex="-1">
      <header>
        <div class="role-top">
          ${roleMark(role)}
          <div class="role-id">
            <h2 id="role-edit-title"><span data-title></span>${badges}</h2>
            <div class="sub" data-desc></div>
            <div class="role-stats" data-stats></div>
          </div>
        </div>
        <button class="x" type="button" aria-label="Хаах" data-close>${NAV_ICON.close}</button>
      </header>
      <div class="body">
        ${role.locked
          ? '<div class="callout"><b>Бүх модуль, бүх хуудас, бүх үйлдэл</b><span>Админ үүрэг бүгдийг нээдэг, засагдахгүй — ингэснээр Basu өөрийгөө хэзээ ч түгжихгүй. Шинэ хуудас нэмэгдэхэд ч өөрөө нээгдэнэ.</span></div>'
          : `<section class="role-sec">
          <div class="role-sec-head"><h3>${step(1)}${fresh ? 'Нэр өгөх' : 'Нэр, тайлбар'}</h3></div>
          <div class="fields">
            <label class="field"><span>Үүргийн нэр</span><input name="name" maxlength="40" autocomplete="off" placeholder="Кассир, Тогооч, Нягтлан…"></label>
            <label class="field"><span>Тайлбар</span><input name="description" maxlength="200" autocomplete="off" placeholder="Юу хийдэг вэ, нэг өгүүлбэр"></label>
            ${fresh ? `<label class="field wide"><span>Эхлэх цэг</span><select name="from"><option value="">Хоосноос — бүх модуль хаалттай</option>${data.roles.map((r) => `<option value="${attr(r.key)}">«${esc(r.name)}» үүргээс хуулах</option>`).join('')}</select></label>` : ''}
          </div>
          ${org ? `<div class="role-flags">
            <label class="role-flag"><input type="checkbox" name="everyone"><span><b>Бүх байгууллагад нээлттэй</b><small>Унтраавал Basu сонгосон байгууллагад л энэ үүргийг олгоно.</small></span></label>
            <label class="role-flag"><input type="checkbox" name="head"><span><b>Эзэн — байгууллагын тэргүүн</b><small>Байгууллага бүрт дор хаяж нэг эзэн байна. Эзэн төрлийн үүргийг зөвхөн эзэн томилох эрхтэй хүн олгоно.</small></span></label>
          </div>` : ''}
        </section>`}
        <section class="role-sec">
          <div class="role-sec-head"><h3>${step(2)}${fresh ? 'Модуль сонгох' : 'Модуль, хуудас'}</h3><span class="meta" data-open></span><button class="btn" data-v="link" type="button" data-unfold>Бүгдийг дэлгэх</button></div>
          ${fresh ? '<p class="role-hint">Модуль бүрт: <b>Хаах</b> — цэсэнд харагдахгүй; <b>Харах</b> — хуудсууд нь нээгдэнэ, үйлдэл хийхгүй; <b>Бүрэн</b> — бүх үйлдэлтэй. Дэлгээд хуудас, үйлдэл тус бүрээр сонгож болно.</p>' : ''}
          <div class="role-mod-list" data-mods></div>
        </section>
      </div>
      ${manage ? `<footer>
        <span class="sum" data-foot-sum></span>
        ${!fresh && !role.builtin ? '<button class="btn" data-v="danger" type="button" data-drop>Устгах</button>' : ''}
        ${fresh ? '' : '<button class="btn" type="button" data-copy>Хуулах</button>'}
        <button class="btn" data-v="quiet" type="button" data-cancel>${fixed ? 'Хаах' : 'Болих'}</button>
        ${fixed ? '' : `<button class="btn" data-v="primary" type="button" data-save>${fresh ? 'Үүрэг үүсгэх' : 'Хадгалах'}</button>`}
      </footer>` : ''}
    </div>`);

  const rows = new Map();
  const modBox = root.querySelector('[data-mods]');
  for (const m of mods) {
    const id = `role-mod-${data.scope}-${m.key}`;
    const levels = m.acts.length ? [['none', 'Хаах'], ['view', 'Харах'], ['full', 'Бүрэн']] : [['none', 'Хаах'], ['full', 'Нээх']];
    const mod = el(`
      <div class="role-mod" data-module="${attr(m.key)}">
        <div class="role-mod-head">
          <button class="role-fold" type="button" aria-expanded="false" aria-controls="${attr(id)}">
            <span class="ic">${NAV_ICON[m.icon] ?? ''}</span>
            <span class="t"><b>${esc(m.name)}</b><small data-sum></small></span>
            <span class="fold">${NAV_ICON.chev}</span>
          </button>
          <div class="seg role-level" role="group" aria-label="${attr(m.name)}">${levels.map(([k, l]) => `<button type="button" data-level="${k}" aria-pressed="false"${fixed ? ' disabled' : ''}>${l}</button>`).join('')}</div>
        </div>
        <div class="role-pages" id="${attr(id)}" hidden></div>
      </div>`);
    for (const p of m.pages) {
      const note = [p.hidden && 'цэснээс нуусан', !m.kind && p.kind && `зөвхөн ${kindWord[p.kind]}`, p.link && 'холбоос'].filter(Boolean).join(' · ');
      mod.querySelector('.role-pages').append(el(`
        <div class="role-page" data-page="${attr(p.key)}">
          <label class="role-view"><input type="checkbox" value="${attr(p.permission)}" data-view><span><b>${esc(p.name)}</b>${note ? `<small>${esc(note)}</small>` : ''}</span></label>
          <div class="role-acts">${p.actions.length
            ? p.actions.map((a) => `<label><input type="checkbox" value="${attr(a.permission)}" data-act><span>${esc(a.label)}</span></label>`).join('')
            : '<span class="none">Зөвхөн харна, үйлдэлгүй хуудас</span>'}</div>
        </div>`));
    }
    rows.set(m, mod);
    modBox.append(mod);
  }

  const name = root.querySelector('[name="name"]');
  const desc = root.querySelector('[name="description"]');
  const everyone = root.querySelector('[name="everyone"]');
  const headBox = root.querySelector('[name="head"]');
  const fromPick = root.querySelector('[name="from"]');
  const foot = root.querySelector('footer');
  const save = root.querySelector('[data-save]');
  if (name) {
    name.value = role.name ?? '';
    desc.value = role.description ?? '';
  }
  if (everyone) {
    everyone.checked = role.everyone !== false;
    headBox.checked = Boolean(role.head);
  }
  if (fromPick && from) fromPick.value = from.key;
  if (fixed) root.querySelectorAll('.body input, .body select').forEach((i) => (i.disabled = true));

  // What there is to lose: everything typed and ticked, against the role as it was opened (a new one against nothing at all).
  const state = () => JSON.stringify([name?.value.trim() ?? '', desc?.value.trim() ?? '', all.filter((p) => held.has(p)), everyone?.checked ?? null, headBox?.checked ?? null]);
  const start = fresh ? JSON.stringify(['', '', [], everyone ? true : null, headBox ? false : null]) : state();
  const dirty = () => !fixed && state() !== start;

  const sync = () => {
    for (const b of root.querySelectorAll('[data-view],[data-act]')) b.checked = held.has(b.value);
    let open = 0;
    for (const [m, mod] of rows) {
      const level = levelOf(m, held);
      const views = m.views.filter((p) => held.has(p)).length;
      const acts = m.acts.filter((p) => held.has(p)).length;
      if (level !== 'none') open += 1;
      mod.dataset.level = level;
      for (const b of mod.querySelectorAll('.role-level button')) b.setAttribute('aria-pressed', String(b.dataset.level === level));
      mod.querySelector('[data-sum]').textContent = [
        `${views}/${m.views.length} хуудас`,
        m.acts.length ? `${acts}/${m.acts.length} үйлдэл` : null,
        level === 'some' ? 'хэсэгчлэн' : null,
        m.kind ? `зөвхөн ${kindWord[m.kind]}` : null,
      ].filter(Boolean).join(' · ');
    }
    const pages = data.pages.filter((p) => held.has(p.permission)).length;
    const acts = all.filter((p) => p.includes(':') && held.has(p)).length;
    root.querySelector('[data-title]').textContent = name?.value.trim() || (fresh ? 'Шинэ үүрэг' : role.name);
    root.querySelector('[data-desc]').textContent = desc?.value.trim() || (fresh ? 'Нэр өгөөд, ямар модуль нээхийг сонгоно.' : role.locked ? role.description ?? '' : '');
    root.querySelector('[data-stats]').innerHTML = [
      fresh ? '' : `<span><b>${data.usage[role.key] ?? 0}</b>хүн</span>`,
      `<span><b>${open}/${mods.length}</b>модуль</span>`,
      `<span><b>${pages}/${data.pages.length}</b>хуудас</span>`,
      `<span><b>${acts}/${actsTotal}</b>үйлдэл</span>`,
    ].join('');
    root.querySelector('[data-open]').textContent = `${open}/${mods.length} нээлттэй`;
    if (foot) {
      const changed = dirty();
      foot.toggleAttribute('data-dirty', changed);
      foot.querySelector('[data-foot-sum]').innerHTML = fresh
        ? `Сонгосон: <b>${open}</b> модуль · <b>${pages}</b> хуудас · <b>${acts}</b> үйлдэл`
        : changed ? 'Хадгалаагүй өөрчлөлт бий' : '';
      if (save && !fresh) save.disabled = !changed;
    }
  };

  const unfoldAll = root.querySelector('[data-unfold]');
  const unfold = (mod, open) => {
    mod.querySelector('.role-fold').setAttribute('aria-expanded', String(open));
    mod.querySelector('.role-pages').hidden = !open;
    unfoldAll.textContent = [...rows.values()].some((m) => m.querySelector('.role-pages').hidden) ? 'Бүгдийг дэлгэх' : 'Бүгдийг хураах';
  };
  modBox.addEventListener('click', (e) => {
    const level = e.target.closest('.role-level button');
    if (level) {
      if (fixed) return;
      const m = [...rows].find(([, mod]) => mod.contains(level))[0];
      setLevel(m, held, level.dataset.level);
      sync();
      return;
    }
    const fold = e.target.closest('.role-fold');
    if (fold) unfold(fold.closest('.role-mod'), fold.getAttribute('aria-expanded') !== 'true');
  });
  modBox.addEventListener('change', (e) => {
    const b = e.target;
    if (!b.matches('[data-view],[data-act]')) return;
    const page = b.closest('.role-page');
    if (b.checked) {
      held.add(b.value);
      if (b.matches('[data-act]')) held.add(page.querySelector('[data-view]').value);
    } else {
      held.delete(b.value);
      if (b.matches('[data-view]')) for (const a of page.querySelectorAll('[data-act]')) held.delete(a.value);
    }
    sync();
  });
  unfoldAll.addEventListener('click', () => {
    const open = [...rows.values()].some((mod) => mod.querySelector('.role-pages').hidden);
    for (const mod of rows.values()) unfold(mod, open);
  });
  name?.addEventListener('input', () => {
    name.removeAttribute('aria-invalid');
    root.querySelector('.role-top .role-mark').replaceWith(el(roleMark({ name: name.value })));
    sync();
  });
  desc?.addEventListener('input', sync);
  everyone?.addEventListener('change', sync);
  headBox?.addEventListener('change', sync);
  fromPick?.addEventListener('change', () => {
    const source = data.roles.find((r) => r.key === fromPick.value);
    held = source ? opensOf(data, source) : new Set();
    sync();
  });

  root.querySelector('[data-close]').addEventListener('click', () => close());
  root.querySelector('[data-cancel]')?.addEventListener('click', () => close());
  root.querySelector('[data-copy]')?.addEventListener('click', copy);
  root.querySelector('[data-drop]')?.addEventListener('click', async () => {
    const people = data.usage[role.key] ?? 0;
    if (people > 0) {
      toast(`${people} хүн энэ үүрэгтэй байна. Эхлээд тэдэнд өөр үүрэг өгөөд дараа нь устгана.`, 'bad');
      return;
    }
    await confirmPopup({
      title: 'Үүрэг устгах',
      text: `<b>${esc(role.name)}</b> үүрэг устгагдана. Энэ үүрэгтэй хүн алга; буцаах боломжгүй.`,
      ok: 'Устгах',
      danger: true,
      onConfirm: async () => {
        await ops(`/v1/ops/roles/${data.scope}/${role.key}`, { method: 'DELETE' });
        close(true);
        toast('Устгалаа.', 'good');
        deskRoles = null;
        await reload();
      },
    });
  });
  save?.addEventListener('click', async () => {
    const wanted = name.value.trim();
    if (wanted.length < 2) {
      name.setAttribute('aria-invalid', 'true');
      name.focus();
      toast('Үүргийн нэрийг хоёроос доошгүй үсгээр бичнэ үү.', 'bad');
      return;
    }
    if (fresh && !all.some((p) => held.has(p))) {
      toast('Дор хаяж нэг модуль, эсвэл нэг хуудас нээнэ үү.', 'bad');
      return;
    }
    const body = {
      name: wanted,
      description: desc.value.trim(),
      // Only what the page draws: a page a release took away is dropped here rather than refused by the server.
      permissions: all.filter((p) => held.has(p)),
      ...(org ? { everyone: everyone.checked, head: headBox.checked } : {}),
    };
    save.setAttribute('data-busy', '');
    try {
      const saved = fresh
        ? await ops(`/v1/ops/roles/${data.scope}`, { method: 'POST', body })
        : await ops(`/v1/ops/roles/${data.scope}/${role.key}`, { method: 'PATCH', body });
      close(true);
      toast(fresh ? 'Үүрэг үүслээ.' : 'Хадгалагдлаа.', 'good');
      deskRoles = null;
      rolePick = saved.key;
      await reload();
    } catch (error) {
      toast(error.message, 'bad');
    } finally {
      save.removeAttribute('data-busy');
    }
  });
  sync();
  return { root, dirty };
}

/**
 * The menu page: every module of the desk or of businesses, in order, with
 * its pages under it, read as the sidebar will draw them. A module or a page
 * is renamed, given another icon, moved or hidden in a popup; a module or a
 * link is added in one too; the arrows reorder. Each change is saved the
 * moment it is made, and the sidebar follows.
 */
async function renderMenus(view) {
  const manage = can('desk.menus:manage');
  const h = head('Цэс', 'Зүүн цэсний модуль, хуудсыг нэрлэж, эрэмбэлж, зөөж, нууна. Хэн юу харах нь «Үүрэг, эрх»-ээр.', '<div data-seg></div>');
  view.append(h);
  h.querySelector('[data-seg]').replaceWith(scopeSeg(() => show('menus')));
  let data;
  try {
    data = await ops(`/v1/ops/access/${accessScope}`);
  } catch (error) {
    view.append(el(`<p class="empty">${esc(error.message)}</p>`));
    return;
  }
  if (tab !== 'menus') return;
  const TOP = 'main';
  const modules = data.all_modules;
  const custom = modules.filter((m) => m.key !== TOP);
  const pagesIn = (key) => data.pages.filter((p) => p.module === key);
  const iconField = (value) => ({ name: 'icon', label: 'Дүрс', type: 'icons', value, options: data.icons.map((k) => [k, NAV_ICON[k] ?? '', ICON_WORD[k] ?? k]) });
  const moduleWord = (m) => (m.key === TOP ? 'Дээд хэсэг' : m.name);

  /** Save a part of the menu, then draw everything again from what the server now has. */
  const save = async (body, said) => {
    await ops(`/v1/ops/menus/${accessScope}`, { method: 'PUT', body });
    if (said) toast(said, 'good');
    await reload();
  };
  /** One step up or down among its neighbours: every neighbour's order written again, so ties never stick. */
  const move = async (list, i, by, kind) => {
    const next = [...list];
    [next[i], next[i + by]] = [next[i + by], next[i]];
    try {
      await save({ [kind]: next.map((x, n) => ({ key: x.key, sort: (n + 1) * 10 })) });
    } catch (error) {
      toast(error.message, 'bad');
    }
  };

  const editModule = (m) =>
    popup({
      title: 'Модуль засах',
      width: 520,
      fields: [{ name: 'name', label: 'Нэр', value: m.name ?? '', required: true, wide: true }, iconField(m.icon)],
      onSubmit: (v) => save({ modules: [{ key: m.key, name: v.name, icon: v.icon ?? m.icon }] }, 'Хадгалагдлаа.'),
    });
  const dropModule = (m) =>
    confirmPopup({
      title: 'Модуль устгах',
      text: `<b>${esc(m.name)}</b> модуль цэснээс алга болно. Хуудастай модулийг устгахгүй — эхлээд хуудсыг нь өөр модуль руу зөөнө.`,
      ok: 'Устгах',
      danger: true,
      onConfirm: async () => {
        await ops(`/v1/ops/menus/${accessScope}/modules/${m.key}`, { method: 'DELETE' });
        toast('Модуль устлаа.', 'good');
        await reload();
      },
    });
  const editPage = (p) =>
    popup({
      title: p.link ? 'Холбоос засах' : 'Хуудас засах',
      sub: p.link ? `<span class="mono">${esc(p.link)}</span>` : '',
      width: 560,
      fields: [
        { name: 'name', label: 'Цэсэнд харагдах нэр', value: p.name, required: true, wide: true },
        { name: 'module', label: 'Модуль', type: 'select', options: modules.map((m) => [m.key, moduleWord(m)]), value: p.module },
        { name: 'shown', label: 'Цэсэнд', type: 'select', options: [['1', 'Харагдана'], ['0', 'Нуусан']], value: p.hidden ? '0' : '1' },
        iconField(p.icon),
      ],
      onSubmit: (v) => {
        const page = { key: p.key, name: v.name, icon: v.icon ?? p.icon, hidden: v.shown === '0' };
        if (v.module !== p.module) {
          // Into another module: at its end.
          page.module = v.module;
          page.sort = Math.max(0, ...pagesIn(v.module).map((x) => x.sort ?? 0)) + 10;
        }
        return save({ pages: [page] }, 'Хадгалагдлаа.');
      },
    });
  const dropLink = (p) =>
    confirmPopup({
      title: 'Холбоос устгах',
      text: `<b>${esc(p.name)}</b> холбоос цэснээс алга болно.<br><span class="mono">${esc(p.link)}</span>`,
      ok: 'Устгах',
      danger: true,
      onConfirm: async () => {
        await ops(`/v1/ops/menus/${accessScope}/links/${p.key}`, { method: 'DELETE' });
        toast('Холбоос устлаа.', 'good');
        await reload();
      },
    });
  const addModule = () =>
    popup({
      title: 'Модуль нэмэх',
      sub: 'Шинэ модуль цэсний доод талд гарна. Дараа нь хуудсуудаа түүн рүү зөөнө.',
      width: 520,
      fields: [{ name: 'name', label: 'Нэр', placeholder: 'Тайлан', required: true, wide: true }, iconField('layers')],
      submit: 'Нэмэх',
      onSubmit: async (v) => {
        await ops(`/v1/ops/menus/${accessScope}/modules`, { method: 'POST', body: { name: v.name, icon: v.icon } });
        toast('Модуль нэмэгдлээ.', 'good');
        await reload();
      },
    });
  const addLink = () =>
    popup({
      title: 'Холбоос нэмэх',
      sub: 'Basu-гийн өөр хуудас, эсвэл гадны https хаяг. Хэн харахыг «Үүрэг, эрх»-ээс сонгоно.',
      width: 560,
      fields: [
        { name: 'name', label: 'Цэсэнд харагдах нэр', placeholder: 'Гарын авлага', required: true, wide: true },
        { name: 'href', label: 'Хаяг', placeholder: '/kds эсвэл https://…', inputmode: 'url', required: true, wide: true },
        { name: 'module', label: 'Модуль', type: 'select', options: modules.map((m) => [m.key, moduleWord(m)]), value: TOP, wide: true },
      ],
      submit: 'Нэмэх',
      onSubmit: async (v) => {
        await ops(`/v1/ops/menus/${accessScope}/links`, { method: 'POST', body: { name: v.name, href: v.href, module: v.module } });
        toast('Холбоос нэмэгдлээ. Хэн харахыг «Үүрэг, эрх»-ээс сонгоно.', 'good');
        await reload();
      },
    });

  if (manage) {
    headActs(
      h,
      button(`${NAV_ICON.plus}Холбоос`, addLink, 'id="add-link"'),
      button(`${NAV_ICON.plus}Модуль`, addModule, 'data-v="primary" id="add-module"'),
    );
  }

  const arrows = (list, i, kind) => {
    const box = el('<span class="menu-moves"></span>');
    const up = button('↑', () => move(list, i, -1, kind), `data-size="sm" data-v="quiet" data-icon data-up aria-label="Дээш"${i === 0 ? ' disabled' : ''}`);
    const down = button('↓', () => move(list, i, 1, kind), `data-size="sm" data-v="quiet" data-icon data-down aria-label="Доош"${i === list.length - 1 ? ' disabled' : ''}`);
    box.append(up, down);
    return box;
  };

  const board = el('<div class="menu-board" id="menu-board"></div>');
  for (const m of modules) {
    const top = m.key === TOP;
    const pages = pagesIn(m.key);
    const card = el(`
      <section class="card menu-mod" data-module="${esc(m.key)}">
        <div class="menu-mod-head">
          <span class="menu-ico">${top ? NAV_ICON.home : NAV_ICON[m.icon] ?? ''}</span>
          <div class="t"><b>${esc(top ? 'Дээд хэсэг' : m.name)}</b><small>${top ? 'Модульгүй хуудсууд, цэсний хамгийн дээр' : `${pages.length} хуудас`}</small></div>
          <span class="menu-acts"></span>
        </div>
        <div class="menu-pages"></div>
      </section>`);
    const acts = card.querySelector('.menu-acts');
    if (manage && !top) {
      acts.append(arrows(custom, custom.indexOf(m), 'modules'));
      acts.append(button('Засах', () => editModule(m), 'data-size="sm" data-edit-mod'));
      if (m.key.startsWith('m-')) acts.append(button('Устгах', () => dropModule(m), 'data-size="sm" data-v="quiet" data-drop-mod'));
    }
    const list = card.querySelector('.menu-pages');
    if (!pages.length) list.append(el('<div class="empty">Хоосон — хуудсыг «Засах»-аар энэ модуль руу зөөнө.</div>'));
    pages.forEach((p, i) => {
      const row = el(`
        <div class="menu-page" data-page="${esc(p.key)}"${p.hidden ? ' data-off' : ''}>
          <span class="menu-ico">${NAV_ICON[p.icon] ?? ''}</span>
          <div class="t"><b>${esc(p.name)}</b>${p.link ? `<small class="mono">${esc(p.link)}</small>` : ''}</div>
          ${p.hidden ? '<span class="pill" data-s="off">нуусан</span>' : ''}
          <span class="menu-acts"></span>
        </div>`);
      const acts = row.querySelector('.menu-acts');
      if (manage) {
        acts.append(arrows(pages, i, 'pages'));
        acts.append(button('Засах', () => editPage(p), 'data-size="sm" data-edit-page'));
        if (p.link) acts.append(button('Устгах', () => dropLink(p), 'data-size="sm" data-v="quiet" data-drop-link'));
      }
      list.append(row);
    });
    board.append(card);
  }
  view.append(board);
}

/**
 * One business, from the desk: the people in it and their roles — any of
 * them the desk may change, its head too — and which roles, beyond those
 * open to every business, it may hand out. Both read here, changed in a popup.
 */
async function openOrgAccess(orgId) {
  const view = nav.view;
  view.replaceChildren();
  window.scrollTo(0, 0);
  let data;
  try {
    data = await ops(`/v1/ops/orgs/${orgId}/access`);
  } catch (error) {
    toast(error.message, 'bad');
    return show('orgs');
  }
  const deciding = can('desk.orgs:access');
  const back = el(`<button class="back link" type="button" id="back">${CHEV}Байгууллагууд</button>`);
  back.addEventListener('click', () => show('orgs'));
  view.append(back, head(esc(data.org.name), `${kinds(data.org).join(' · ')} · ${ORG_STATE[data.org.state]?.[1] ?? data.org.state}`));
  const open = data.roles.filter((r) => r.open);
  const nameOf = (key) => data.roles.find((r) => r.key === key)?.name ?? key;

  const people = dataTable({
    columns: [
      { key: 'name', label: 'Нэр', value: (m) => m.name ?? '', render: (m) => `<b>${esc(m.name ?? '—')}</b>` },
      { key: 'contact', label: 'Утас, имэйл', render: (m) => dtCell.mono(m.contact) },
      { key: 'role', label: 'Үүрэг', value: (m) => m.role_name ?? nameOf(m.role) },
    ],
    search: data.members.length > 8 ? { placeholder: 'Нэр, утас, имэйл…' } : false,
    actions: deciding
      ? (m) =>
          button(
            'Үүрэг солих',
            () =>
              popup({
                title: 'Үүрэг солих',
                sub: `${esc(m.name ?? '')} · ${esc(data.org.name)}`,
                width: 480,
                fields: [{ name: 'role', label: 'Үүрэг', type: 'select', options: open.map((r) => [r.key, r.name]), value: m.role, wide: true }],
                onSubmit: async (v) => {
                  if (v.role === m.role) return true;
                  await ops(`/v1/ops/orgs/${orgId}/members/${m.guest_id}`, { method: 'PATCH', body: { role: v.role } });
                  toast(`${m.name ?? 'Хүн'}: ${nameOf(v.role)}`, 'good');
                  await openOrgAccess(orgId);
                },
              }),
            'data-v="quiet" data-size="sm" data-a="role"',
          )
      : null,
    rowAttrs: (m) => ({ 'data-member': m.guest_id }),
    noun: 'хүн',
    empty: { title: 'Хүн алга', text: '' },
    rows: data.members,
  });
  people.el.setAttribute('data-people', '');
  const who = el('<section class="section"><h2 class="section-label">Хүмүүс, үүрэг</h2></section>');
  who.append(people.el);
  view.append(who);

  const roles = el(`
    <section class="section"><h2 class="section-label">Энэ байгууллагад нээлттэй үүрэг</h2>
      <div class="card" data-rows data-org-roles>${open
        .map(
          (r) => `
        <div class="row" data-role="${esc(r.key)}">
          <div class="main"><span class="title">${esc(r.name)}${r.head ? ' <span class="pill" data-size="sm">эзэн</span>' : ''}</span>${r.description ? `<span class="sub">${esc(r.description)}</span>` : ''}</div>
          <div class="end"><span class="cap">${r.everyone ? 'бүх байгууллагад' : 'зөвхөн энд'}</span></div>
        </div>`,
        )
        .join('')}</div>
      <p class="cap" style="margin-top:10px">«Бүх байгууллагад» үүргийг хүн бүр ашиглана; бусдыг зөвхөн сонгосон байгууллага ажилтандаа өгнө. Үүрэг бүр юу нээхийг «Үүрэг, эрх»-ээр засна.</p>
    </section>`);
  const choosable = data.roles.filter((r) => !r.everyone);
  if (deciding && choosable.length) {
    roles.querySelector('.section-label').append(
      button(
        'Засах',
        () =>
          popup({
            title: 'Нээлттэй үүрэг',
            sub: `«Бүх байгууллагад» үүргээс гадна <b>${esc(data.org.name)}</b> юуг ажилтандаа өгч болох вэ.`,
            width: 560,
            fields: [
              {
                type: 'checks',
                label: 'Сонгосон байгууллагад өгөх үүрэг',
                list: true,
                options: choosable.map((r) => [r.key, r.name, r.open, { hint: r.description ?? '' }]),
              },
            ],
            onSubmit: async (v) => {
              const keys = choosable.filter((r) => v[r.key]).map((r) => r.key);
              await ops(`/v1/ops/orgs/${orgId}/roles`, { method: 'PUT', body: { keys } });
              toast('Хадгалагдлаа.', 'good');
              await openOrgAccess(orgId);
            },
          }),
        'data-size="sm" id="edit-org-roles"',
      ),
    );
  }
  view.append(roles);
}

/* ── the frame: one sidebar for every place a person works ─────────── */

/**
 * The person signed in on this browser — the website's sign-in, the same
 * one; in the demo, the desk's shared secret. The dashboard once kept a
 * sign-in of its own under another key, which nothing on the website ever
 * replaced or cleared: whoever signed in next in that browser was shown the
 * desk of whoever had opened it before. One browser holds one person now,
 * and what they see is what the server says that person sits in.
 */
const token = () => store.guestToken;
/**
 * A call as this browser's person. A desk seat's sign-in is good for the
 * desk for twelve hours; past that the server answers SIGN_IN_AGAIN to
 * whichever call comes first, and that call brings up the door, saying why,
 * whatever page it came from. The caller still hears of the refusal.
 */
const ops = (path, options = {}) => {
  const sent = token();
  return api(path, { ...options, token: sent }).catch((error) => {
    throw refused(error, sent);
  });
};

/**
 * A refusal, marked with the session the call carried: what the server
 * said is about that one. The browser may have moved on while the call was
 * out — another tab signed somebody in — and the sign-in it holds now is
 * not ended for an answer about the one before.
 */
function refused(error, sent) {
  error.sent = sent;
  if (error.code === 'SIGN_IN_AGAIN') signedOut(error);
  return error;
}

/** What /v1/access said: the person, and every place they work, each with its menu. */
let access = null;
/** The place open now. */
let ws = null;
/** The frame's handles. */
let nav = null;
/** The page open now. */
let tab = null;
/** The desk seat, when the place open is the desk. */
let me = null;
let cache = { suppliers: [], settlements: [], orgs: [] };

/** Whether the place open now lets this person do that. The server asks again; this only decides what to draw. */
const can = (permission) => Boolean(ws?.permissions?.includes(permission));
const deskSeat = () => access?.workspaces.find((w) => w.kind === 'desk') ?? null;
const pagesOf = (w) => w.menu.flatMap((g) => g.items);
/** Whether the place open now has that page — what a link inside a page asks before it is drawn. */
const hasPage = (key) => Boolean(ws && pagesOf(ws).some((i) => i.key === key && !i.href));
const lastPageKey = (w) => (w.kind === 'desk' ? 'basu.ops.tab' : `basu.dash.page.${w.id}`);
const firstPage = (w) => pagesOf(w).find((i) => !i.href)?.key ?? 'home';
const remembered = (w) => {
  const saved = localStorage.getItem(lastPageKey(w));
  return saved && pagesOf(w).some((i) => i.key === saved && !i.href) ? saved : firstPage(w);
};

const DESK_PAGES = {
  overview: renderOverview, guests: renderGuests, money: renderMoney, notify: renderNotify, system: renderSystem,
  venues: renderVenues, lunches: renderLunches, reviews: renderReviews,
  stats: renderStats, orders: renderOrders, suppliers: renderSuppliers, pay: renderPay, promotions: renderPromotions,
  orgs: renderOrgsDesk, members: renderMembers, roles: renderRoles, menus: renderMenus, audit: renderAudit,
};
const ORG_PAGES = { home: renderOrgHome, team: renderOrgTeam, profile: renderOrgProfile, roles: renderOrgRoles, log: renderOrgLog };
const ME_PAGES = { home: renderMeHome, profile: renderMeProfile };

/**
 * The place to open: the one the address names, else the last one used,
 * else the desk, else the first business that is running, else the
 * person's own corner.
 */
function choose(hash) {
  const [id, page] = decodeURIComponent((hash ?? '').replace(/^#/, '')).split('/');
  const all = access.workspaces;
  const named = all.find((w) => w.id === id);
  if (named) return { w: named, page };
  const last = all.find((w) => w.id === localStorage.getItem('basu.dash.ws'));
  return { w: last ?? all.find((w) => w.kind === 'desk') ?? all.find((w) => w.kind === 'org' && w.state === 'active') ?? all[0], page: null };
}

/** Open a place — the frame is built afresh for it — on the page asked for, or the one last open there. */
function open(w, page) {
  if (!w) return;
  ws = w;
  localStorage.setItem('basu.dash.ws', w.id);
  me = w.kind === 'desk' ? { id: w.seat?.id, name: w.seat?.name, role: w.role } : null;
  frame();
  tab = hasPage(page) ? page : remembered(w);
  nav.select(tab);
  if (w.kind === 'desk') refresh();
  else show(tab);
}

function frame() {
  const actions = [];
  if (access.account) actions.push({ key: 'new-org', label: 'Байгууллага бүртгүүлэх', icon: 'plus' });
  nav = deskFrame({
    workspaces: access.workspaces,
    current: ws,
    account: access.account,
    onPage: (item) => (item.href ? false : show(item.key)),
    onWorkspace: (w) => open(w),
    onSignOut: signOut,
    actions,
    onAction: (key) => {
      wanted = key;
      open(access.workspaces.find((w) => w.kind === 'me'), 'home');
    },
  });
  root.replaceChildren(nav.root);
}

/** Ask again who the person is and where they work — after they changed it — and open `id` (or stay). */
async function reload(id) {
  try {
    access = await ops('/v1/access');
  } catch (error) {
    if (error.status === 401) return signedOut(error);
    toast(error.message, 'bad');
    return;
  }
  const w = access.workspaces.find((x) => x.id === (id ?? ws?.id)) ?? access.workspaces.find((x) => x.id === ws?.id);
  open(w ?? choose('').w, w?.id === ws?.id ? tab : null);
}

/** «Гарах»: out of the website too — it is the same person — and the session ended on the server, not only forgotten here. */
function signOut() {
  dropSession();
  access = ws = nav = me = null;
  showToken();
}

/**
 * The server no longer takes this session: forget it and show the door.
 * When it is the desk that wants a fresh sign-in (SIGN_IN_AGAIN) the
 * session still opens the website, so it is ended on the server as well —
 * the door means nobody is signed in here — and the door says why. An
 * answer about a session this browser has let go since changes nothing
 * here: the storage event (below, by `boot`) brings the page to the one the
 * browser holds now.
 */
function signedOut(error) {
  if (error && 'sent' in error && error.sent !== token()) return;
  if (error?.code === 'SIGN_IN_AGAIN') {
    doorWhy = error.message;
    dropSession();
  } else {
    store.guestToken = null;
  }
  access = ws = nav = me = null;
  showToken();
}

/** The desk's lists the badges and three pages read, then the page again. A business or the corner has none. */
async function refresh() {
  if (ws?.kind === 'desk') {
    try {
      const [suppliers, settlements, orgs] = await Promise.all([
        (can('desk.suppliers') || can('desk.orders')) ? ops('/v1/ops/suppliers').then((r) => r.suppliers) : [],
        can('desk.pay') ? ops('/v1/ops/settlements').then((r) => r.settlements) : [],
        can('desk.orgs') ? ops('/v1/ops/orgs').then((r) => r.orgs) : [],
      ]);
      cache = { suppliers, settlements, orgs };
    } catch (error) {
      // The desk wants a fresh sign-in: the refusal has brought its door up already (`refused`).
      if (error.code === 'SIGN_IN_AGAIN') return;
      // The seat went while the page was open: ask again where this person works rather than throw them out.
      if (error.status === 401) return reload();
      if (error.status === 503) return signedOut();
      toast(error.message, 'bad');
      return;
    }
  }
  badges();
  show(tab);
}

/** What waits, in the sidebar: applications to answer, money to send, businesses asking in. */
function badges() {
  if (ws?.kind !== 'desk' || !nav) return;
  const applied = cache.suppliers.filter((s) => s.state === 'applied').length;
  const due = cache.settlements.filter((t) => t.state === 'due').length;
  const waitingOrgs = cache.orgs.filter((o) => o.state === 'applied').length;
  nav.badge('suppliers', applied, applied > 0);
  nav.badge('pay', due, due > 0);
  nav.badge('orgs', waitingOrgs, waitingOrgs > 0);
}

function show(key) {
  if (!ws || !nav) return;
  tab = key;
  localStorage.setItem(lastPageKey(ws), key);
  history.replaceState(null, '', `#${ws.id}/${key}`);
  nav.select(key);
  const view = nav.view;
  view.replaceChildren();
  window.scrollTo(0, 0);
  const pages = ws.kind === 'desk' ? DESK_PAGES : ws.kind === 'org' ? ORG_PAGES : ME_PAGES;
  const draw = hasPage(key) ? pages[key] ?? (key.startsWith('dine.') ? renderDineSoon : null) : null;
  if (draw) draw(view);
  else view.append(head('Олдсонгүй', 'Энэ хуудас танд нээлттэй биш байна.'));
}

const head = (title, sub, right = '') =>
  el(`<div class="page-head"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${right}</div>`);

/**
 * A button and the one thing it does — on this page that is almost always
 * opening a popup. `attrs` is the rest of the tag: data-v, data-size, an id.
 */
const button = (label, onClick, attrs = '') => {
  const b = el(`<button class="btn" type="button" ${attrs}>${label}</button>`);
  b.addEventListener('click', onClick);
  return b;
};

/** A page's own buttons, at the right of its head: where adding a thing always is. */
const headActs = (h, ...buttons) => {
  const box = el('<div class="head-acts"></div>');
  box.append(...buttons.filter(Boolean));
  if (box.childElementCount) h.append(box);
  return h;
};

const PERIODS = [['today', 'Өнөөдөр'], ['week', '7 хоног'], ['season', 'Улирал']];
let period = localStorage.getItem('basu.ops.period') ?? 'today';

/** The period switch every numbers page shares; `draw` is called again on each change. */
function periodSeg(draw) {
  const seg = el(`<div class="seg">${PERIODS.map(([k, l]) => `<button type="button" data-p="${k}"${period === k ? ' data-on' : ''}>${l}</button>`).join('')}</div>`);
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-p]');
    if (!b) return;
    period = b.dataset.p;
    localStorage.setItem('basu.ops.period', period);
    for (const c of seg.querySelectorAll('button')) c.toggleAttribute('data-on', c === b);
    draw();
  });
  return seg;
}

const periodWord = () => PERIODS.find(([k]) => k === period)?.[1] ?? '';

const DINE_LIVE = ['PLACED', 'ACCEPTED', 'SCHEDULED', 'ARMED', 'HELD', 'FIRED', 'COOKING', 'READY', 'SERVED'];
const DINE_FREE = ['PLACED', 'ACCEPTED', 'SCHEDULED', 'ARMED', 'HELD', 'RESLOTTED'];
const DINE_EVENT = {
  CREATED: 'Үүссэн', PAID: 'Төлсөн', PLANNED: 'Төлөвлөсөн', ACCEPTED: 'Ресторан баталсан', REJECTED: 'Ресторан татгалзсан', ARMED: 'Бэлтгэлд орсон',
  HELD: 'Түр зогсоосон', HELD_BY_KITCHEN: 'Гал тогоо түр зогсоосон', FIRED: 'Гал дээр гарсан', READY: 'Бэлэн болсон', SERVED: 'Үйлчилсэн', CLOSED: 'Дууссан',
  CANCELLED: 'Цуцлагдсан', REFUNDED: 'Буцаалт хийсэн', NO_SHOW: 'Зочин ирээгүй', REVIEWED: 'Үнэлгээ өгсөн', SEATED: 'Суусан', RESLOTTED: 'Цаг солигдсон',
};
const dineActor = (a) => {
  if (!a) return '';
  if (a.startsWith('guest:')) return 'зочин';
  if (a.startsWith('kitchen')) return 'гал тогоо';
  if (a.startsWith('kds:')) return 'гал тогооны дэлгэц';
  if (a.startsWith('ops:')) return `ops · ${a.slice(4)}`;
  return { 'system:planner': 'төлөвлөгч', 'system:scheduler': 'хуваарьлагч' }[a] ?? a;
};
const stars = (n) => `<span class="stars" aria-label="${n} од">${Array.from({ length: 5 }, (_, i) => (i < n ? STAR : STAR.replace('<svg', '<svg data-off'))).join('')}</span>`;
let venueCache = [];

/* ── lunch: the orders ── */

let lunchFilter = { scope: 'live', restaurant: '', day: '', q: '' };

async function renderLunches(view) {

    columns: [
      { key: 'code', label: 'Захиалга', render: (o) => dtCell.twoHtml(`<span class="mono">№${esc(o.code)}</span>`, `${o.party_size} хүн`) },

      { key: 'slot_starts_at', label: 'Цаг', render: (o) => dtCell.when(o.slot_starts_at) },
      {
        key: 'fire_at',
        label: 'Гал',
        render: (o) => `${o.fire_at ? `<span class="mono">${clockOf(o.fire_at)}</span>` : dtCell.none()}${o.late ? ` ${dtCell.pill('declined', 'хоцорсон')}` : ''}`,
      },
      { key: 'state', label: 'Төлөв', value: (o) => DINE_WORD[o.state] ?? o.state, render: (o) => dtCell.pill(o.state, DINE_WORD[o.state] ?? o.state) },
      { key: 'total_mnt', label: 'Дүн', align: 'end', numeric: true, render: (o) => dtCell.money(o.total_mnt) },
    ],

    onSearch: (q) => {
      lunchFilter.q = q;
      void loadLunches(table);
    },
    filters: [
      { key: 'scope', label: 'Хамрах хүрээ', options: [['live', 'Идэвхтэй'], ['done', 'Дууссан'], ['all', 'Бүгд']], initial: lunchFilter.scope },
      {
        key: 'restaurant',
        label: 'Ресторан',
        kind: 'select',
        options: [['', 'Бүх ресторан'], ...venueCache.map((r) => [r.id, r.name])],
        initial: lunchFilter.restaurant,
      },
    ],
    onFilter: (f) => {
      lunchFilter.scope = f.scope;
      lunchFilter.restaurant = f.restaurant;
      void loadLunches(table);
    },
    tools: [day],
    sort: { key: 'slot_starts_at', desc: true },
    onRow: (o) => openLunch(o.id),
    rowAttrs: (o) => ({ 'data-lunch': o.id }),

    empty: { title: 'Захиалга алга', text: 'Шүүлтэд тохирох хоолны захиалга байхгүй.' },
  });
  table.el.id = 'lunches';
  table.el.querySelector('.dt-search input').value = lunchFilter.q;
  day.addEventListener('change', () => {
    lunchFilter.day = day.value;
    void loadLunches(table);
  });
  view.append(table.el);
  void loadLunches(table);
}

async function loadLunches(table) {
  const qs = new URLSearchParams({ scope: lunchFilter.scope, q: lunchFilter.q });
  if (lunchFilter.restaurant) qs.set('restaurant', lunchFilter.restaurant);
  if (lunchFilter.day) qs.set('day', lunchFilter.day);
  try {
    table.setRows((await ops(`/v1/ops/dine/orders?${qs}`)).orders);
  } catch (error) {
    toast(error.message, 'bad');
    table.setRows([]);
  }
}

  } catch (error) {

          <div class="facts">

            <div><div class="lab">Ширээ</div><b>${o.table ? esc(o.table) : '—'}</b><br>${o.seated_at ? `суусан ${clockOf(o.seated_at)}` : 'суугаагүй'}</div>

            <div><div class="lab">Бэлэн</div><b class="mono">${o.ready_at ? clockOf(o.ready_at) : '—'}</b><br>${o.eta_at ? `ирэх ${clockOf(o.eta_at)}` : ''}</div>
            <div><div class="lab">Дүн</div><b>${money(o.total_mnt)}</b><br>түрийвчээс</div>
          </div>
        </div>
        <section class="section"><h2 class="section-label">Хоол</h2><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Нэр</th><th>Цех</th><th class="num">Тоо</th><th class="num">Үнэ</th></tr></thead><tbody>${d.lines
          .map((l) => `<tr${l.cancelled ? ' data-off' : ''}><td><b>${esc(l.name)}</b>${l.notes ? `<span class="sub">${esc(l.notes)}</span>` : ''}</td><td>${esc(l.station ?? '')}</td><td class="num">${l.qty}</td><td class="num">${money(l.unit_price_mnt * l.qty)}</td></tr>`)

          .map((e) => step(e.type, DINE_EVENT[e.type] ?? e.type, `${e.actor ? esc(dineActor(e.actor)) : ''}${e.payload?.reason ? ` · ${esc(e.payload.reason)}` : ''}`, e.at))

        await openLunch(id);
      },
    });

  view.append(page);

/**
 * A CSV the browser saves, fetched with the desk's token because a plain
 * link cannot carry one. A desk that wants a fresh sign-in brings up its
 * door here as from any other call (`refused`).
 */
async function download(path, name) {
  const sent = token();
  const res = await fetch(path, { headers: { authorization: `Bearer ${sent}` } });
  if (!res.ok) {
    const said = await res.json().catch(() => null);
    if (said?.error?.code === 'SIGN_IN_AGAIN') throw refused(new ApiError(res.status, said), sent);
    throw new Error('Экспорт амжилтгүй.');
  }
  const url = URL.createObjectURL(await res.blob());
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/** The dates a list of money covers, and the CSV of it — the toolbar the three lists share. */
function moneyRange(csvPath, name) {
  const from = el(`<input class="input dt-date" type="date" id="from" value="${esc(moneyFilter.from)}" title="Эхлэх өдөр" aria-label="Эхлэх өдөр">`);
  const to = el(`<input class="input dt-date" type="date" id="to" value="${esc(moneyFilter.to)}" title="Дуусах өдөр" aria-label="Дуусах өдөр">`);
  for (const input of [from, to]) {
    input.addEventListener('change', () => {
      moneyFilter[input.id] = input.value;
      void drawMoney();
    });
  }
  const tools = [from, to];
  if (csvPath && canMoney()) {
    const csv = el('<button class="btn" data-size="sm" type="button" id="csv">CSV татах</button>');
    csv.addEventListener('click', () => download(csvPath(), `basu-${name}-${moneyFilter.from || 'all'}-${moneyFilter.to || 'all'}.csv`).catch((error) => toast(error.message, 'bad')));
    tools.push(csv);
  }
  return tools;
}

const moneyQuery = (extra = {}) => {
  const qs = new URLSearchParams();
  for (const [k, v] of Object.entries(extra)) if (v) qs.set(k, v);
  if (moneyFilter.from) qs.set('from', moneyFilter.from);
  if (moneyFilter.to) qs.set('to', moneyFilter.to);
  return qs;
};

async function loadMessages(table) {
  const qs = new URLSearchParams();
  for (const [k, v] of Object.entries(msgFilter)) if (v) qs.set(k, v);
  try {
    table.setRows((await ops(`/v1/ops/notify/messages?${qs}`)).messages);
  } catch (error) {
    toast(error.message, 'bad');
    table.setRows([]);
  }
}

/** Against the server's own clock: in the demo it runs ahead of the wall. */
const ago = (iso, nowIso) => {
  if (!iso) return 'хэзээ ч үгүй';
  const s = Math.max(0, Math.round((new Date(nowIso).getTime() - new Date(iso).getTime()) / 1000));
  if (s < 60) return `${s} сек өмнө`;
  if (s < 3600) return `${Math.round(s / 60)} мин өмнө`;
  if (s < 86400) return `${Math.round(s / 3600)} цаг өмнө`;
  return `${Math.round(s / 86400)} хоног өмнө`;
};
