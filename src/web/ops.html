<!doctype html>
<html lang="mn" data-theme="light" data-desk data-session="desk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F3F0">
<title>Dashboard — Basu</title>
<link rel="stylesheet" href="/app.css">
<style>
/* ── The desk ──────────────────────────────────────────────────────
   Two or three people, all day, at a computer. Tokens, type, buttons,
   chips, cards, rows, tables and the sidebar all come from /app.css;
   what is left here is where things sit. */
p{margin:0}

/* the door */
.door{min-height:100dvh;display:grid;place-items:center;padding:var(--s-6) var(--gutter)}
.pair{width:100%;max-width:420px;padding:28px}
.pair .brand{margin-bottom:20px}
.pair h2{margin-bottom:6px}
.pair p{color:var(--ink-2);margin-bottom:20px}
.pair .input{margin-bottom:10px}

/* the frame: the grid, the sidebar and the drawer are /app.css's .desk-frame */
.main{min-width:0}
.page{max-width:var(--col-desk);margin:0 auto;padding:var(--s-7) var(--gutter) 64px}
.page > .back{margin-bottom:4px}
.page-head + .section{margin-top:0}
.page-head + .kpi-band{margin-bottom:8px}
.org-row{cursor:pointer}
.org-form .checks{display:flex;gap:20px;margin:0 0 16px}
.org-form .checks label{display:flex;align-items:center;gap:8px;font-size:var(--t-body-lg)}
.add-member{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add-member .input{width:auto;flex:1 1 220px}
.add-member [data-found]{flex-basis:100%;font-size:var(--t-body)}
/* an ask for a seat: who, why, and the answer on one line under it */
.request .main{flex:1;min-width:0}
.request .who-contact{font-weight:400;font-size:var(--t-cap);color:var(--ink-2);margin-left:6px}
.request .cap{margin:2px 0 0}
.req-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.req-actions .input{width:auto;min-width:0;height:var(--h-sm);min-height:var(--h-sm);font-size:var(--t-cap)}
.req-actions select.input{width:240px}
.req-actions [name="reason"]{width:200px}
.req-actions .btn{min-height:var(--h-sm);font-size:var(--t-cap)}
.req-actions .gap{width:12px}
.pair-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 16px;align-items:start}
/* a business's people: on a phone the address folds under the name, and the table fits */
.table.team td .sub{display:none}
@media (max-width:720px){
  .table.team{min-width:0}
  .table.team th:nth-child(2),.table.team td:nth-child(2){display:none}
  .table.team td .sub{display:block}
}
/* a business's front page: a door to each of its parts */
.org-doors{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.org-door h3{font-size:var(--t-row);margin:0 0 10px}
.org-door .links{display:flex;flex-direction:column;gap:2px;margin:0 -8px}
.door-link{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 8px;border-radius:var(--r-sm);font-size:var(--t-body);font-weight:500;color:var(--ink-2)}
.door-link svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-3)}
@media (hover:hover){.door-link:hover{background:var(--surface-2);color:var(--ink)}}
/* who may do what: permissions down, roles across, the reader's own column marked */
.table.roles th.role-col,.table.roles td.role-col{width:96px;text-align:center}
.table.roles th.yours{color:var(--ink)}
.table.roles th.role-col small{display:block;font-family:var(--mono);font-size:var(--t-meta);font-weight:500;color:var(--accent-ink);text-transform:none;letter-spacing:0}
.table.roles td.yours{background:var(--surface-2)}
.table.roles .yes svg{width:18px;height:18px;fill:none;stroke:var(--ready);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.table.roles .no{color:var(--ink-3)}
.table.roles tr.role-sec td{padding-top:18px;font-family:var(--mono);font-size:var(--t-eyebrow);font-weight:500;letter-spacing:var(--track-eyebrow);text-transform:uppercase;color:var(--ink-3);background:none}
/* the roles page: every role on the left, the one chosen on the right as a tree to tick */
.roles-grid{display:grid;grid-template-columns:minmax(240px,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.roles-grid{grid-template-columns:1fr}}
.roles-list{overflow:hidden}
.role-row{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.role-row:last-child{border-bottom:0}
.role-row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.role-row .title{font-size:var(--t-row);font-weight:600}
.role-row .sub{font-size:var(--t-cap);color:var(--ink-2);line-height:1.4}
.role-row .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.role-row .end{flex:none;padding-top:2px}
.role-row[data-on]{background:var(--accent-soft)}
.role-row[data-on] .title{color:var(--accent-ink)}
@media (hover:hover){.role-row:not([data-on]):hover{background:var(--surface-2)}}
.role-add .title{color:var(--accent-ink)}
.role-flags{margin:0 0 16px}
.perm-tree{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.perm-mod{border:1px solid var(--line);border-radius:var(--r-ctl);overflow:hidden}
.perm-mod-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600;cursor:pointer}
.sec-mod{display:inline-flex;align-items:center;gap:8px}
.sec-mod svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;color:var(--ink-3)}
.perm-pages{display:flex;flex-direction:column}
.perm-page{padding:10px 14px}
.perm-page + .perm-page{border-top:1px solid var(--line)}
.perm-view{display:flex;align-items:center;gap:10px;cursor:pointer}
.perm-view small{font-size:var(--t-meta);color:var(--ink-3);font-weight:400}
.perm-acts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0 0 28px}
.perm-acts label{display:flex;align-items:center;gap:8px;font-size:var(--t-cap);color:var(--ink-2);cursor:pointer}
.table.roles tr.perm-act td:first-child{padding-left:28px;font-size:var(--t-cap);color:var(--ink-2)}
.table.roles tr.perm-page td:first-child{font-weight:500}
/* the menu page: each module a card, its pages rows to rename, move, reorder and hide */
.menu-tools{position:sticky;top:0;z-index:2;display:flex;gap:8px;align-items:center;padding:10px 0;margin-bottom:8px;background:var(--bg)}
.menu-tools .gap{flex:1}
.menu-board{display:flex;flex-direction:column;gap:12px}
.menu-mod-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);border-radius:var(--r-md) var(--r-md) 0 0}
.menu-mod-head [name="name"]{flex:1;min-width:0;font-weight:600}
.menu-page{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;border-top:1px solid var(--line)}
.menu-page:first-child{border-top:0}
.menu-board .input{width:auto;min-width:0;height:var(--h-sm);min-height:var(--h-sm);font-size:var(--t-body)}
.menu-page [name="name"]{flex:1 1 220px}
.menu-page [name="module"]{flex:0 0 190px}
.icon-pick select{flex:0 0 120px}
.menu-page[data-off] [name="name"]{color:var(--ink-3);text-decoration:line-through}
.menu-page .menu-href{flex-basis:100%;font-size:var(--t-meta);color:var(--ink-3);padding-left:170px;overflow-wrap:anywhere}
@media (max-width:720px){.menu-page [name="module"]{flex:1 1 100%}.menu-page .menu-href{padding-left:0}}
.menu-pages > .empty{padding:12px 16px}
.menu-moves{display:flex;align-items:center;gap:4px}
.menu-shown{display:flex;align-items:center;gap:6px;margin-left:6px;font-size:var(--t-cap);color:var(--ink-2)}
.icon-pick{display:flex;align-items:center;gap:6px}
.icon-pick [data-preview]{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.icon-pick [data-preview] svg{width:18px;height:18px;fill:none;stroke:var(--ink-2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* a business's roles, from the desk */
.org-roles{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.org-role{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-ctl)}
.org-role small{flex-basis:100%;padding-left:26px;font-size:var(--t-cap);color:var(--ink-2)}
/* a page whose part of Basu is not joined up yet */
.soon{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 24px}
.soon-mark{display:inline-grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);margin-bottom:12px}
.soon-mark svg{width:22px;height:22px;fill:none;stroke:var(--ink-3);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.soon h3{margin:0 0 6px}
.soon .cap{max-width:52ch;margin:0}
@media (max-width:900px){
  .page{padding:var(--s-5) var(--s-5) var(--s-8)}
}

/* toolbars, tables, KPI rows */
.card > .tools{padding:14px 20px;border-bottom:1px solid var(--line)}
.tools > .input{width:auto;min-width:0;flex:none}
.tools > .input.search{flex:1 1 220px}
.tools > [data-end]{margin-left:auto}
.card > .table-wrap{border-radius:inherit}
.card-foot{padding:12px 20px;border-top:1px solid var(--line)}
.table:has(tr[data-link]) th:last-child{padding-right:32px}
.table td.end{text-align:right}
.run-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
/* Until app.css scopes `.kpi-band .kpi span` to `> span`: money() inside a
   KPI value keeps the value's size, weight and tone instead of the caption's. */
.kpi-band .kpi b span{display:inline;font-size:inherit;color:inherit;line-height:inherit}
.kpi-band .kpi b .cur{font-size:.65em;font-weight:500}

/* rows: suppliers, kitchens, settlements — hairline rows in one container */
.rows[data-rows]{overflow:visible}
/* a list with nothing in it is a hairline and one line, not a boxed card */
.rows[data-rows]:has(> .empty:only-child){background:none;border:0;border-radius:0;box-shadow:none}
.rows[data-rows] > .empty:only-child{border-top:1px solid var(--line);padding-left:0;padding-right:0}
.rows[data-rows] > .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:14px 20px}
.row .name{font-size:var(--t-row);font-weight:600;line-height:var(--lh-snug);min-width:0}
.row .name .pill{margin-left:6px}
.row .name small{display:block;font-size:var(--t-cap);font-weight:400;line-height:1.5;color:var(--ink-2);margin-top:3px}
.row .right{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.row .btns{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row .amount{font-size:var(--t-title-3)}
.row[data-paid] .name{color:var(--ink-2)}
.row[data-paid] .amount .money{color:var(--ink-3)}
.row .about{grid-column:1 / -1;font-size:var(--t-cap);line-height:1.5;color:var(--ink-2)}
.row .about b{font-weight:500;color:var(--ink)}
.row .drawer{grid-column:1 / -1;padding-top:12px;border-top:1px solid var(--line)}
.row .drawer .table th:first-child,.row .drawer .table td:first-child{padding-left:0}
.row .drawer .table th:last-child,.row .drawer .table td:last-child{padding-right:0}
.row .code{grid-column:1 / -1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r-ctl);background:var(--ready-soft);border:1px solid var(--ready-line);color:var(--ready);font-size:var(--t-cap)}
.row .code b{font-size:var(--t-title-3);font-weight:600;letter-spacing:.12em;color:inherit}
.stall-line{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:var(--t-body)}
.stall-line + .stall-line{border-top:1px solid var(--line)}
.stall-line span{flex:1}
.stall-line[data-off]{color:var(--ink-3)}
.sess-list{margin-top:8px}
.sess{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:var(--t-body)}
.sess small{display:block;font-size:var(--t-cap);color:var(--ink-3)}
@media (max-width:720px){
  .rows[data-rows] > .row{grid-template-columns:1fr}
  .row .right,.row .btns{justify-content:flex-start}
  /* a wide table scrolls inside its wrap instead of squeezing every cell */
  .table:has(th:nth-child(4)){min-width:640px}
  .table:has(th:nth-child(4)) td:first-child,.table:has(th:nth-child(4)) .sub{white-space:nowrap}
  .tools > .input,.tools > .seg{flex:1 1 100%;width:100%}
}

/* the overflow menu: every action stays in the DOM, one is in view */
.more{position:relative;display:inline-flex}
.more > summary{list-style:none}
.more > summary::-webkit-details-marker{display:none}
.more > summary svg{fill:currentColor;stroke:none}
.more > .menu{position:absolute;right:0;top:calc(100% + 4px);z-index:var(--z-bar);min-width:220px;display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);box-shadow:var(--shadow-float)}
.more > .menu .btn{width:100%;justify-content:flex-start}
.more > .menu .btn.ink-stop{color:var(--stop)}

/* one order, one guest */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1000px){.detail{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px 20px;padding:20px;font-size:var(--t-body);line-height:1.45;color:var(--ink-2)}
.facts .lab{display:block;margin-bottom:4px}
.facts b{font-size:var(--t-row);font-weight:600;color:var(--ink)}
a.tel{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:500}
a.tel svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;flex-direction:column;gap:10px}
.acts .hint{font-size:var(--t-cap);line-height:1.45;color:var(--ink-3)}
.acts .sep{height:1px;background:var(--line);margin:4px 0}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{width:14px;height:14px;fill:var(--star)}
.stars svg[data-off]{fill:var(--line-2)}

/* the log: who, what, when */
.log li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 20px;font-size:var(--t-body)}
.log li.empty{display:block}
.log .who{font-weight:500;color:var(--ink-2);white-space:nowrap}
.log .when{white-space:nowrap;text-align:right}
.log small{display:block;font-size:var(--t-cap);line-height:1.4;color:var(--ink-2)}
.log .when .pill{margin-top:4px}

/* one toned word inside a sentence */
.ink-stop{color:var(--stop)}
.ink-hold{color:var(--hold)}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { api, store, toast, mnt, money, KIND, HEADLINE, dayLabel, signInDoors, accountWays, authReturn } from '/api.js';
import { NAV_ICON, deskFrame } from '/sidenav.js';

const root = document.getElementById('root');
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
const esc = (value) => {
  const node = document.createElement('span');
  node.textContent = value ?? '';
  return node.innerHTML;
};
const when = (iso) => (iso ? dayLabel(iso.slice(0, 10)) : '—');
const clockOf = (iso) => {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};
/** A date with its time, as one mono run: the table's "өнөөдөр 11:16". */
const stamp = (iso) => `<span class="mono">${when(iso)} ${clockOf(iso)}</span>`;
const CHEV = '<svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>';
const PHONE = '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>';
const tel = (phone) => `<a class="tel mono" href="tel:${esc(phone)}">${PHONE}${esc(phone)}</a>`;
/** Three rows of the shape that is coming, while it loads. */
const busy = () => el(`<div role="status" aria-busy="true">${'<div class="skel-row"><span class="skel"></span><span class="skel-lines"><span class="skel"></span><span class="skel"></span></span><span class="skel"></span></div>'.repeat(3)}</div>`);
/** The rest of a row's actions, folded behind one button; every button stays in the DOM. */
const more = () => el('<details class="more"><summary class="btn" data-size="sm" data-icon aria-label="Бусад үйлдэл"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></summary><div class="menu"></div></details>');
document.addEventListener('click', (e) => {
  for (const d of document.querySelectorAll('details.more[open]')) {
    if (!d.contains(e.target) || e.target.closest('.menu button')) d.open = false;
  }
});
/** The dot's tone on the story: red for a cancellation, blue for on the road, green for handed over. */
const STORY_K = {
  CANCELLED: 'stop', REFUNDED: 'stop', REFUND_DUE: 'stop', HELD: 'stop', HELD_BY_KITCHEN: 'stop', REJECTED: 'stop', NO_SHOW: 'stop',
  DISPATCHED: 'route', RESLOTTED: 'route', RESENT: 'route', PAID: 'route',
  HANDED: 'ready', CLOSED: 'ready', SERVED: 'ready', READY: 'ready',
};
const step = (type, title, sub, at) =>
  `<li data-done${STORY_K[type] ? ` data-k="${STORY_K[type]}"` : ''}><span class="w">${title}<span class="s">${sub}</span></span><span class="t">${when(at)} ${clockOf(at)}</span></li>`;
const STATE = { applied: 'хүлээгдэж байна', contracted: 'гэрээт', declined: 'татгалзсан' };
const STATE_WORD = {
  PAID: 'Төлсөн', PREPARING: 'Бэлтгэж байна', READY: 'Бэлэн', DISPATCHED: 'Замд',
  HANDED: 'Өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан', REFUNDED: 'Буцаасан',
};
const EVENT_WORD = {
  CREATED: 'Үүссэн', PAID: 'Төлсөн', PREPARING: 'Бэлтгэж эхэлсэн', READY: 'Бэлэн болсон', DISPATCHED: 'Замд гарсан',
  HANDED: 'Хүлээлгэн өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан', REFUND_DUE: 'Буцаалт үүссэн', REFUNDED: 'Буцаалт шилжүүлсэн', RESENT: 'Мэдэгдэл дахин илгээсэн',
};
const REASON = {
  guest_asked: 'Зочин хүссэн', vet: 'Мал эмнэлгийн шалгалт', cannot_fulfil: 'Нийлүүлэгч биелүүлж чадахгүй',
  no_show: 'Зочин ирээгүй', unreachable: 'Хаяг дээр холбогдоогүй', draft_expired: 'Төлөгдөөгүй',
};
const actorWord = (a) =>
  a.startsWith('guest:') ? 'зочин'
    : a.startsWith('supplier:owner:') ? 'нийлүүлэгчийн эзэн'
      : /^supplier:[a-z0-9-]+:[0-9a-f-]{36}$/.test(a) ? 'нийлүүлэгчийн ажилтан'
        : a.startsWith('supplier:') ? 'нийлүүлэгчийн дэлгэц'
          : a.startsWith('ops') ? a.replace('ops:', 'ops · ') : 'систем';
/* ── the door ─────────────────────────────────────────────────────── */

async function showToken() {
  root.replaceChildren();
  // The demo hands its secret out; anywhere else a member signs in by phone.
  const demo = await api('/dev/ops-token').catch(() => null);
  const door = el('<div class="door"></div>');
  if (demo?.token) {
    const card = el(`
      <div class="card pair">
        <div class="brand wordmark">Basu<small>Ops</small></div>
        <h2>Демо горим</h2>
        <p>Нууц үг автоматаар орлоо. Нэвтрэхэд л болно.</p>
        <input class="input" type="password" placeholder="OPS_TOKEN" aria-label="Ops нууц" autocomplete="off">
        <button class="btn" data-v="primary" data-size="lg" type="button">Нэвтрэх</button>
      </div>`);
    const input = card.querySelector('input');
    input.value = demo.token;
    const submit = async () => {
      store.opsToken = input.value.trim();
      try {
        ({ member: me } = await api('/v1/ops/me', { token: store.opsToken }));
        boot();
      } catch (error) {
        store.opsToken = null;
        toast(error.message, 'bad');
      }
    };
    card.querySelector('button').addEventListener('click', submit);
    input.addEventListener('keydown', (e) => e.key === 'Enter' && submit());
    door.append(card);
    root.append(door);
    return;
  }
  const card = el(`
    <div class="card pair">
      <div class="brand wordmark">Basu<small>Ops</small></div>
      <h2>Нэвтрэх</h2>
      <p id="door-lead">Нэвтэрнэ үү. Гишүүн биш бол нэвтэрсний дараа эрх хүсэж болно.</p>
      <div data-doors></div>
    </div>`);
  // Every way in — Google, a code by email, a password and its reset — is
  // the shared block; the desk keeps its session under its own key, so the
  // block hands the token here. What the account may do is its roles', which
  // it asks for once inside.
  const doors = signInDoors({ device: 'Ops', returnTo: '/dashboard', onToken: enterDesk, keep: false });
  card.querySelector('[data-doors]').append(doors);
  // Say only the ways that are really on the card.
  doors.ready.then((open) => {
    const others = [open.google && 'Google', open.email && 'имэйл'].filter(Boolean);
    const ways = others.length ? `${others.join(', ')} эсвэл нууц үгээрээ` : 'нууц үгээрээ';
    card.querySelector('#door-lead').textContent = `${ways[0].toUpperCase()}${ways.slice(1)} нэвтэрнэ үү. Гишүүн биш бол нэвтэрсний дараа эрх хүсэж болно.`;
  });
  door.append(card);
  root.append(door);
}

/**
 * A session from any door — Google, a code by email, the phone — comes in.
 * What it sees is the server's to say: a member gets the desk, anybody else
 * the front room, with their profile and the way to ask for a seat.
 */
function enterDesk(t) {
  store.opsToken = t;
  boot();
}

/* ── a person's own corner ─────────────────────────────────────────── */

let frontPoll;
/** What the switcher asked the corner to open when it gets there: the business form, or the ask for a seat. */
let wanted = null;

const ORG_STATE = { applied: ['applied', 'хүлээгдэж байна'], active: ['contracted', 'идэвхтэй'], declined: ['off', 'татгалзсан'], suspended: ['off', 'түр хаасан'] };
const kinds = (o) => [o.restaurant && 'Ресторан', o.supplier && 'Нийлүүлэгч'].filter(Boolean);

/**
 * The corner's front page: the businesses this person is part of, the way
 * to register one, and their seat at Basu's desk — asked for, waiting, said
 * no to, or held. While an ask waits the page keeps asking, so the yes opens
 * the desk without anybody reloading anything.
 */
function renderMeHome(view) {
  const account = access.account ?? {};
  view.append(head(account.name ? `Сайн байна уу, ${esc(account.name)}` : 'Тавтай морил', 'Таны байгууллагууд, Basu-гийн ops эрх нэг дор.'));

    <section class="section"><h2 class="section-label">Миний байгууллагууд</h2>

    </section>`);
  const list = section.querySelector('#org-list');
  if (!orgs.length) {
    list.append(el('<div class="empty">Та одоогоор ямар ч байгууллагад байхгүй. Ресторан эсвэл нийлүүлэгчээ бүртгүүлбэл та эзэн нь болно; эсвэл менежер тань таныг утас, имэйлээр чинь нэмнэ.</div>'));
  }
  for (const w of orgs) {
    const [tone, word] = ORG_STATE[w.state] ?? ['off', w.state];
    const row = el(`
      <div class="row org-row" data-chev tabindex="0" data-org="${esc(w.id)}">
        <div class="main">
          <div class="title">${esc(w.name)}</div>
          <p class="cap" style="margin:2px 0 0">${esc(w.sub)}</p>
          ${w.state === 'declined' && w.decline_reason ? `<p class="cap" style="margin:4px 0 0">Шалтгаан: ${esc(w.decline_reason)}</p>` : ''}
        </div>
        <div class="end"><span class="pill" data-s="${tone}">${word}</span></div>
      </div>`);
    const go = () => open(w);
    row.addEventListener('click', go);
    row.addEventListener('keydown', (e) => e.key === 'Enter' && go());
    list.append(row);
  }
  const newOrg = section.querySelector('#org-new');
  newOrg.addEventListener('click', () => {
    newOrg.remove();
    section.append(orgForm(async (id) => {
      await reload(id);
    }));
  });

  view.append(deskSection());

  if (wanted === 'new-org') newOrg.click();
  if (wanted) view.querySelector(wanted === 'new-org' ? '.org-form' : '#front')?.scrollIntoView({ block: 'start' });
  if (wanted === 'ask-desk') view.querySelector('#ask-open')?.click();
  wanted = null;
}

/** Basu's own desk, from the corner: the seat held, or the ask for one. */
function deskSection() {
  const seat = deskSeat();
  const request = access.desk_request;
  const box = el(`
    <section class="section"><h2 class="section-label">Basu-гийн ops эрх</h2>
      <div class="card"><div class="card-body" id="front">
        <p class="cap" style="margin:0 0 14px">Basu-гийн ажилтан бол ops-ийн хэсэгт орох эрх хүснэ үү — админ зөвшөөрөхөд шууд нээгдэнэ.</p>
        <div data-state></div>
        <div data-form></div>
      </div></div>
    </section>`);
  const state = box.querySelector('[data-state]');
  const slot = box.querySelector('[data-form]');
  if (seat) {
    box.querySelector('.cap').textContent = `Та Basu ops-ийн гишүүн — ${seat.role_label}.`;
    const go = el('<button class="btn" type="button">Ops ширээ нээх</button>');
    go.addEventListener('click', () => open(seat));
    slot.append(go);
    return box;
  }
  const form = (asked) => {
    const f = el(`
      <div>
        <input class="input" name="name" placeholder="Таны нэр" aria-label="Нэр" autocomplete="name">
        <select class="input" name="role" aria-label="Хүсэх эрх"></select>
        <textarea class="input" name="note" rows="3" placeholder="Та хэн бэ, юунд хэрэгтэй вэ (заавал биш)" aria-label="Тайлбар"></textarea>
        <button class="btn" data-size="lg" type="button" id="ask" style="width:100%">${asked ? 'Хүсэлтээ шинэчлэх' : 'Эрх хүсэх'}</button>
      </div>`);
    f.querySelector('[name="name"]').value = asked?.name ?? access.account?.name ?? '';
    // The desk's roles as Basu has them now, each with what it is for.
    void deskRoleList().then((roles) => {
      f.querySelector('[name="role"]').innerHTML = roles.map((r) => roleOption(r, asked?.role ?? 'ops')).join('');
    });
    f.querySelector('[name="note"]').value = asked?.note ?? '';
    f.querySelector('#ask').addEventListener('click', async (e) => {
      const v = (n) => f.querySelector(`[name="${n}"]`).value.trim();
      e.target.setAttribute('data-busy', '');
      try {
        await ops('/v1/ops/requests', { method: 'POST', body: { name: v('name'), role: v('role'), note: v('note') } });
        toast('Хүсэлт илгээгдлээ.');
        await reload('me');
      } catch (error) {
        toast(error.message, 'bad');
      } finally {
        e.target.removeAttribute('data-busy');
      }
    });
    return f;
  };

  if (request?.state === 'pending') {
    const waiting = el(`
      <div class="callout" data-k="ok" style="margin-bottom:16px">
        <b>Хүсэлт хүлээгдэж байна</b>
        <span>Хүссэн эрх: <span data-asked>${esc(request.role)}</span> · ${when(request.created_at)} ${clockOf(request.created_at)}. Админ зөвшөөрмөгц энэ хуудас өөрөө нээгдэнэ.</span>
      </div>`);
    void deskRoleList().then((roles) => {
      waiting.querySelector('[data-asked]').textContent = roles.find((r) => r.key === request.role)?.name ?? request.role;
    });
    state.append(waiting);
    const change = el('<button class="btn" type="button" data-size="lg" style="width:100%">Хүсэлтээ өөрчлөх</button>');
    change.addEventListener('click', () => {
      change.remove();
      slot.replaceChildren(form(request));
    });
    slot.append(change);
    // Keep asking while it waits: the yes opens the desk on its own.
    frontPoll = setInterval(async () => {
      if (document.hidden) return;
      try {
        const now = await ops('/v1/access');
        if (now.workspaces.some((w) => w.kind === 'desk') || now.desk_request?.state !== 'pending') {
          clearInterval(frontPoll);
          access = now;
          const seated = now.workspaces.find((w) => w.kind === 'desk');
          if (seated) open(seated);
          else show(tab);
        }
      } catch {
        clearInterval(frontPoll);
      }
    }, 10_000);
    return box;
  }
  if (request?.state === 'declined') {
    state.append(el(`
      <div class="callout" data-k="warn" style="margin-bottom:16px">
        <b>Хүсэлтийг татгалзсан</b>
        <span>${request.decline_reason ? `Шалтгаан: ${esc(request.decline_reason)}. ` : ''}Дахин хүсэж болно.</span>
      </div>`));
    slot.append(form(null));
    return box;
  }
  // Most people here run a business; asking for Basu's own desk is the rarer thing, one tap away.
  const ask = el('<button class="btn" type="button" id="ask-open">Ops эрх хүсэх</button>');
  ask.addEventListener('click', () => {
    ask.remove();
    slot.append(form(null));
  });
  slot.append(ask);
  return box;
}

/** The business open now, with who works there — asked afresh by each of its pages. */
const orgFile = () => ops(`/v1/orgs/${ws.id}`);
/** The supplier's own routes, for the business open now. */
const atOrg = (path) => api(path, { token: token(), headers: { 'x-basu-org': ws.id } });
const orgLink = (key) => pagesOf(ws).find((i) => i.key === key);

/**
 * A business's front page: what it is and what the person is in it, the
 * day's numbers where it sells идэш, and a door to every page the role opens.
 * One still waiting for the desk, or turned down, says so and nothing else.
 */
async function renderOrgHome(view) {
  const w = ws;
  view.append(head(esc(w.name), esc(w.sub)));
  if (w.state !== 'active') {
    const word = {
      applied: ['ok', 'Basu шалгаж байна', 'Бүртгэлийг тань Basu-гийн баг шалгаж байна. Батлагдмагц энд ажилтнуудаа нэмж, хэсгүүдээ нээнэ — мэдэгдэл ирнэ.'],
      declined: ['warn', 'Бүртгэлийг татгалзсан', w.decline_reason ? `Шалтгаан: ${esc(w.decline_reason)}. Засаад дахин бүртгүүлж болно.` : 'Засаад дахин бүртгүүлж болно.'],
      suspended: ['warn', 'Түр хаасан', 'Энэ байгууллагыг Basu түр хаасан байна. Дэлгэрэнгүйг Basu-гаас асууна уу.'],
    }[w.state] ?? ['warn', w.state, ''];
    view.append(el(`<div class="callout" data-k="${word[0]}"><b>${word[1]}</b><span>${word[2]}</span></div>`));
    if (w.state === 'declined') {
      const again = el('<div class="form-foot" style="justify-content:flex-start;margin-top:16px"><button class="btn" type="button">Дахин бүртгүүлэх</button></div>');
      again.querySelector('button').addEventListener('click', () => {
        wanted = 'new-org';
        open(access.workspaces.find((x) => x.kind === 'me'), 'home');
      });
      view.append(again);
    }
    return;
  }

  if (w.kinds?.supplier && (can('org.idesh.today') || can('org.idesh.orders'))) {
    const band = el('<div class="kpis kpi-band" id="org-kpis" hidden></div>');
    view.append(band);
    atOrg('/v1/supplier/home')
      .then((h) => {
        if (!band.isConnected) return;
        const todo = h.lanes.paid + h.lanes.preparing + h.lanes.ready + h.lanes.dispatched;
        const cells = [
          `<div class="card kpi"><div class="lab">Хийх ажил</div><b>${todo}</b><span>${[h.due_today ? `${h.due_today} өнөөдөр авна` : '', h.overdue ? `${h.overdue} ирээгүй` : ''].filter(Boolean).join(' · ') || 'идэвхтэй захиалга'}</span></div>`,
          `<div class="card kpi"><div class="lab">Шинэ</div><b>${h.lanes.paid}</b><span>төлсөн, бэлтгэж эхлээгүй</span></div>`,
          `<div class="card kpi"><div class="lab">Улирал</div><b>${h.season.handed}</b><span>хүлээлгэн өгсөн</span></div>`,
        ];
        if (h.season.payout_mnt !== null) cells.push(`<div class="card kpi"><div class="lab">Танд очих</div><b>${money(h.season.payout_mnt)}</b><span>энэ улирлын орлого</span></div>`);
        band.innerHTML = cells.join('');
        band.hidden = false;
      })
      .catch(() => band.remove());
  }

  const doors = w.menu.filter((g) => g.label);
  const grid = el('<section class="section"><h2 class="section-label">Таны хэсгүүд</h2><div class="org-doors"></div></section>');
  for (const g of doors) {
    const card = el(`<div class="card org-door"><div class="card-body"><h3>${esc(g.label)}</h3><div class="links"></div></div></div>`);
    for (const it of g.items) {
      const link = el(`<a class="door-link" href="${it.href ? esc(it.href) : `#${esc(w.id)}/${esc(it.key)}`}">${NAV_ICON[it.icon] ?? ''}<span>${esc(it.label)}</span></a>`);
      if (!it.href) {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          show(it.key);
        });
      }
      card.querySelector('.links').append(link);
    }
    grid.querySelector('.org-doors').append(card);
  }
  view.append(grid);
  view.append(el(`<p class="cap" style="margin-top:20px">Та энэ байгууллагад <b>${esc(w.role_label)}</b>. ${orgLink('roles') ? '<a class="link" href="#" data-roles>Хэн юу хийж болохыг харах →</a>' : ''}</p>`));
  view.querySelector('[data-roles]')?.addEventListener('click', (e) => {
    e.preventDefault();
    show('roles');
  });
}

        const who = await ops(`/v1/orgs/${org.id}/lookup?contact=${encodeURIComponent(contact)}`);

        found.replaceChildren(el(`
          <div class="add-member" style="margin-top:8px">

  tag: 'Шошго', file: 'Файл',
};
const SCOPE_WORD = { desk: 'Basu ops', org: 'Байгууллага' };
let accessScope = localStorage.getItem('basu.ops.access') === 'org' ? 'org' : 'desk';
/** The role the roles page opens on next: the one just made or saved. */
let rolePick = null;

/** The desk's roles, for the pickers that seat somebody or ask for a seat: asked once a page, and again after the roles change. */
let deskRoles = null;
async function deskRoleList() {
  deskRoles ??= ops('/v1/access/roles?scope=desk').then((t) => t.roles).catch(() => []);
  return deskRoles;
}
const roleOption = (r, chosen) => `<option value="${esc(r.key)}"${r.key === chosen ? ' selected' : ''}>${esc(r.name)}${r.description ? ` — ${esc(r.description)}` : ''}</option>`;

/** Desk or business: the switch the roles and menu pages share. */
function scopeSeg(onChange) {
  const seg = el(`<div class="seg">${['desk', 'org'].map((k) => `<button type="button" data-scope="${k}"${accessScope === k ? ' data-on' : ''}>${SCOPE_WORD[k]}</button>`).join('')}</div>`);
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-scope]');
    if (!b || b.dataset.scope === accessScope) return;
    accessScope = b.dataset.scope;
    localStorage.setItem('basu.ops.access', accessScope);
    onChange();
  });
  return seg;
}

/**
 * Who may do what, read-only: each module's pages and what can be done on
 * each, a mark under every role that may, the reader's own column lit.
 */
function matrixTable(table) {
  const roles = table.roles;
  const opens = (r, p) => r.locked || (r.permissions ?? []).includes(p);
  const lit = (r) => (r.key === table.yours ? ' yours' : '');
  const cols = (p) => roles.map((r) => `<td class="role-col${lit(r)}">${opens(r, p) ? `<span class="yes" aria-label="тийм">${NAV_ICON.check}</span>` : '<span class="no" aria-label="үгүй">—</span>'}</td>`).join('');
  const thead = `<tr><th>Хуудас, үйлдэл</th>${roles.map((r) => `<th class="role-col${lit(r)}">${esc(r.name)}${r.key === table.yours ? '<small>та</small>' : ''}</th>`).join('')}</tr>`;
  const body = table.modules
    .map((m) => {
      const pages = table.pages.filter((p) => p.module === m.key && !p.hidden);
      if (!pages.length) return '';
      return `<tr class="role-sec"><td colspan="${roles.length + 1}"><span class="sec-mod">${NAV_ICON[m.icon] ?? ''}${esc(m.name)}</span></td></tr>${pages
        .map((p) => `<tr class="perm-page"><td>${esc(p.name)}</td>${cols(p.permission)}</tr>${p.actions.map((a) => `<tr class="perm-act"><td>${esc(a.label)}</td>${cols(a.permission)}</tr>`).join('')}`)
        .join('')}`;
    })
    .join('');
  return el(`<section class="section"><div class="card"><div class="table-wrap"><table class="table roles"><thead>${thead}</thead><tbody>${body}</tbody></table></div></div></section>`);
}

/**
 * The roles page. On the left every role of the desk or of businesses, with
 * who holds it; on the right the one chosen, as a tree of modules, their
 * pages and what can be done on each, ticked for what the role opens. A new
 * role starts empty. The admin role opens everything and stays as it is.
 */
async function renderRoles(view) {
  const pick = rolePick;
  rolePick = null;
  const manage = can('desk.roles:manage');
  view.append(head('Үүрэг, эрх', 'Үүрэг үүсгээд, ямар хуудас, ямар үйлдэл нээхийг нь чагтаар сонгоно. Хүн бүрийн цэс, эрх үүнээс шууд гарна.', '<div data-seg></div>'));
  view.querySelector('[data-seg]').replaceWith(scopeSeg(() => show('roles')));
  const box = el('<div class="roles-grid"><div class="card roles-list" data-rows id="roles-list"></div><div class="card role-edit" id="role-edit"></div></div>');
  view.append(box);
  let data;
  try {
    data = await ops(`/v1/ops/access/${accessScope}`);
  } catch (error) {
    box.replaceWith(el(`<p class="empty">${esc(error.message)}</p>`));
    return;
  }
  if (tab !== 'roles') return;
  const list = box.querySelector('#roles-list');
  const edit = box.querySelector('#role-edit');
  const draw = (key) => {
    for (const r of list.querySelectorAll('[data-role]')) r.toggleAttribute('data-on', r.dataset.role === key);
    const role = key === '+' ? { key: null, name: '', description: '', permissions: [], locked: false, head: false, everyone: true, builtin: false } : data.roles.find((r) => r.key === key);
    edit.replaceChildren(roleEditor(data, role, manage));
  };
  for (const r of data.roles) {
    const flags = [
      r.locked && '<span class="pill" data-size="sm">бүгдийг нээнэ</span>',
      r.head && '<span class="pill" data-size="sm">эзэн</span>',
      accessScope === 'org' && !r.everyone && '<span class="pill" data-size="sm" data-s="applied">сонгосон байгууллагад</span>',
    ].filter(Boolean).join('');
    const count = data.usage[r.key] ?? 0;
    const row = el(`
      <button class="row role-row" type="button" data-role="${esc(r.key)}">
        <span class="main"><span class="title">${esc(r.name)}</span><span class="sub">${esc(r.description ?? '')}</span>${flags ? `<span class="tags">${flags}</span>` : ''}</span>
        <span class="end"><span class="meta">${count} хүн</span></span>
      </button>`);
    row.addEventListener('click', () => draw(r.key));
    list.append(row);
  }
  if (manage) {
    const add = el('<button class="row role-row role-add" type="button" data-role="+"><span class="main"><span class="title">+ Шинэ үүрэг</span><span class="sub">Нэр өгөөд хуудсуудаа сонгоно</span></span></button>');
    add.addEventListener('click', () => draw('+'));
    list.append(add);
  }
  draw(pick && (pick === '+' || data.roles.some((r) => r.key === pick)) ? pick : data.roles[0]?.key ?? '+');
}

/** One role, as a tree to tick: modules, their pages, and what can be done on each. */
function roleEditor(data, role, manage) {
  const fixed = role.locked || !manage;
  const held = new Set(role.locked ? data.pages.flatMap((p) => [p.permission, ...p.actions.map((a) => a.permission)]) : role.permissions ?? []);
  const kindWord = { supplier: 'нийлүүлэгчид', restaurant: 'ресторанд' };
  const f = el(`
    <div class="card-body">
      <div class="fields">
        <label class="field"><span>Үүргийн нэр</span><input name="name" maxlength="40" placeholder="Кассир, Тогооч, Нягтлан…"></label>
        <label class="field"><span>Тайлбар</span><input name="description" maxlength="200" placeholder="Юу хийдэг вэ, нэг өгүүлбэр"></label>
      </div>
      ${data.scope === 'org' ? `<div class="checks role-flags">
        <label><input type="checkbox" name="everyone"> Бүх байгууллагад нээлттэй</label>
        <label><input type="checkbox" name="head"> Эзэн — байгууллагын тэргүүн</label>
      </div>` : ''}
      ${role.locked ? '<div class="callout" style="margin-bottom:16px"><b>Бүх хуудас, бүх үйлдэл</b><span>Админ үүрэг бүгдийг нээдэг, засагдахгүй — ингэснээр Basu өөрийгөө хэзээ ч түгжихгүй.</span></div>' : ''}
      <div class="perm-tree" data-tree></div>
      ${fixed ? '' : `<div class="form-foot">
        ${role.key && !role.builtin ? '<button class="btn" data-v="quiet" type="button" data-drop>Устгах</button>' : ''}
        <button class="btn" data-v="primary" type="button" data-save>${role.key ? 'Хадгалах' : 'Үүрэг үүсгэх'}</button>
      </div>`}
    </div>`);
  f.querySelector('[name="name"]').value = role.name ?? '';
  f.querySelector('[name="description"]').value = role.description ?? '';
  if (data.scope === 'org') {
    f.querySelector('[name="everyone"]').checked = role.everyone !== false;
    f.querySelector('[name="head"]').checked = Boolean(role.head);
  }
  const tree = f.querySelector('[data-tree]');
  for (const m of data.modules) {
    const pages = data.pages.filter((p) => p.module === m.key);
    if (!pages.length) continue;
    const mod = el(`
      <div class="perm-mod">
        <label class="perm-mod-head"><input type="checkbox" data-all> <span class="sec-mod">${NAV_ICON[m.icon] ?? ''}${esc(m.name)}</span></label>
        <div class="perm-pages"></div>
      </div>`);
    for (const p of pages) {
      const note = [p.hidden && 'цэснээс нуусан', p.kind && `зөвхөн ${kindWord[p.kind]}`, p.link && 'холбоос'].filter(Boolean).join(' · ');
      const page = el(`
        <div class="perm-page" data-page="${esc(p.key)}">
          <label class="perm-view"><input type="checkbox" value="${esc(p.permission)}" data-view> <b>${esc(p.name)}</b>${note ? ` <small>${esc(note)}</small>` : ''}</label>
          ${p.actions.length ? `<div class="perm-acts">${p.actions.map((a) => `<label><input type="checkbox" value="${esc(a.permission)}" data-act> ${esc(a.label)}</label>`).join('')}</div>` : ''}
        </div>`);
      page.querySelectorAll('input').forEach((i) => (i.checked = held.has(i.value)));
      mod.querySelector('.perm-pages').append(page);
    }
    tree.append(mod);
  }
  // A module's box says whether all, some or none of it is ticked; a page's actions need the page.
  const sync = () => {
    for (const mod of tree.querySelectorAll('.perm-mod')) {
      const boxes = [...mod.querySelectorAll('.perm-pages input')];
      const on = boxes.filter((b) => b.checked).length;
      const all = mod.querySelector('[data-all]');
      all.checked = on === boxes.length && on > 0;
      all.indeterminate = on > 0 && on < boxes.length;
    }
  };
  tree.addEventListener('change', (e) => {
    const input = e.target;
    if (input.matches('[data-all]')) {
      for (const b of input.closest('.perm-mod').querySelectorAll('.perm-pages input')) b.checked = input.checked;
    } else if (input.matches('[data-act]') && input.checked) {
      input.closest('.perm-page').querySelector('[data-view]').checked = true;
    } else if (input.matches('[data-view]') && !input.checked) {
      for (const b of input.closest('.perm-page').querySelectorAll('[data-act]')) b.checked = false;
    }
    sync();
  });
  sync();
  if (fixed) f.querySelectorAll('input').forEach((i) => (i.disabled = true));

  f.querySelector('[data-save]')?.addEventListener('click', async (e) => {
    const body = {
      name: f.querySelector('[name="name"]').value.trim(),
      description: f.querySelector('[name="description"]').value.trim(),
      permissions: [...tree.querySelectorAll('.perm-pages input:checked')].map((i) => i.value),
      ...(data.scope === 'org' ? { everyone: f.querySelector('[name="everyone"]').checked, head: f.querySelector('[name="head"]').checked } : {}),
    };
    e.target.setAttribute('data-busy', '');
    try {
      const saved = role.key
        ? await ops(`/v1/ops/roles/${data.scope}/${role.key}`, { method: 'PATCH', body })
        : await ops(`/v1/ops/roles/${data.scope}`, { method: 'POST', body });
      toast(role.key ? 'Хадгалагдлаа.' : 'Үүрэг үүслээ.', 'good');
      deskRoles = null;
      rolePick = saved.key;
      await reload();
    } catch (error) {
      toast(error.message, 'bad');
    } finally {
      e.target.removeAttribute('data-busy');
    }
  });
  f.querySelector('[data-drop]')?.addEventListener('click', async () => {
    if (!confirm(`«${role.name}» үүргийг устгах уу?`)) return;
    try {
      await ops(`/v1/ops/roles/${data.scope}/${role.key}`, { method: 'DELETE' });
      toast('Устгалаа.');
      deskRoles = null;
      await reload();
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  return f;
}

/**
 * The menu page: every module of the desk or of businesses, in order, with
 * its pages under it — each renamed, reordered, moved to another module,
 * given another icon or hidden, right here; a module or a link added; and
 * all of it saved at once, the sidebar following the moment it is.
 */
async function renderMenus(view) {
  const manage = can('desk.menus:manage');
  view.append(head('Цэс', 'Зүүн цэсний модуль, хуудсыг нэрлэж, эрэмбэлж, зөөж, нууна. Хэн юу харах нь «Үүрэг, эрх»-ээр.', '<div data-seg></div>'));
  view.querySelector('[data-seg]').replaceWith(scopeSeg(() => show('menus')));
  let data;
  try {
    data = await ops(`/v1/ops/access/${accessScope}`);
  } catch (error) {
    view.append(el(`<p class="empty">${esc(error.message)}</p>`));
    return;
  }
  if (tab !== 'menus') return;
  const icons = (chosen) => data.icons.map((k) => `<option value="${k}"${k === chosen ? ' selected' : ''}>${ICON_WORD[k] ?? k}</option>`).join('');
  const moduleOptions = (chosen) => data.all_modules.map((m) => `<option value="${esc(m.key)}"${m.key === chosen ? ' selected' : ''}>${esc(m.key === 'main' ? 'Дээд хэсэг' : m.name)}</option>`).join('');
  const board = el('<div class="menu-board" id="menu-board"></div>');
  const mods = new Map();
  for (const m of data.all_modules) {
    const top = m.key === 'main';
    const card = el(`
      <section class="card menu-mod" data-module="${esc(m.key)}">
        <div class="menu-mod-head">
          <span class="icon-pick"><span data-preview>${NAV_ICON[m.icon] ?? ''}</span><select class="input" data-size="sm" name="icon" aria-label="Дүрс"${top ? ' disabled' : ''}>${icons(m.icon)}</select></span>
          <input class="input" name="name" maxlength="40" aria-label="Модулийн нэр"${top ? ' disabled' : ''}>
          <span class="menu-moves">
            <button class="btn" data-size="sm" data-v="quiet" data-icon type="button" data-up aria-label="Дээш"${top ? ' disabled' : ''}>↑</button>
            <button class="btn" data-size="sm" data-v="quiet" data-icon type="button" data-down aria-label="Доош"${top ? ' disabled' : ''}>↓</button>
            ${m.key.startsWith('m-') ? '<button class="btn" data-size="sm" data-v="quiet" type="button" data-drop-mod>Устгах</button>' : ''}
          </span>
        </div>
        <div class="menu-pages" data-rows></div>
      </section>`);
    card.querySelector('[name="name"]').value = top ? 'Дээд хэсэг — модульгүй хуудсууд' : m.name ?? '';
    mods.set(m.key, card);
    board.append(card);
  }
  const pageRow = (p) => {
    const row = el(`
      <div class="menu-page" data-page="${esc(p.key)}"${p.hidden ? ' data-off' : ''}>
        <span class="icon-pick"><span data-preview>${NAV_ICON[p.icon] ?? ''}</span><select class="input" data-size="sm" name="icon" aria-label="Дүрс">${icons(p.icon)}</select></span>
        <input class="input" name="name" maxlength="40" aria-label="Хуудасны нэр">
        <select class="input" data-size="sm" name="module" aria-label="Модуль">${moduleOptions(p.module)}</select>
        <span class="menu-moves">
          <button class="btn" data-size="sm" data-v="quiet" data-icon type="button" data-up aria-label="Дээш">↑</button>
          <button class="btn" data-size="sm" data-v="quiet" data-icon type="button" data-down aria-label="Доош">↓</button>
          <label class="menu-shown"><input type="checkbox" name="shown"${p.hidden ? '' : ' checked'}> харагдана</label>
          ${p.link ? `<button class="btn" data-size="sm" data-v="quiet" type="button" data-drop-link title="${esc(p.link)}">Холбоос устгах</button>` : ''}
        </span>
        ${p.link ? `<span class="menu-href mono">${esc(p.link)}</span>` : ''}
      </div>`);
    row.querySelector('[name="name"]').value = p.name;
    return row;
  };
  for (const p of data.pages) mods.get(p.module)?.querySelector('.menu-pages').append(pageRow(p));
  for (const card of mods.values()) {
    if (!card.querySelector('.menu-page')) card.querySelector('.menu-pages').append(el('<div class="empty">Хоосон — хуудсыг энд зөөвөл харагдана.</div>'));
  }

  board.addEventListener('change', (e) => {
    const t = e.target;
    if (t.name === 'icon') t.closest('.icon-pick').querySelector('[data-preview]').innerHTML = NAV_ICON[t.value] ?? '';
    if (t.name === 'module') {
      const row = t.closest('.menu-page');
      const target = mods.get(t.value).querySelector('.menu-pages');
      target.querySelector('.empty')?.remove();
      target.append(row);
    }
    if (t.name === 'shown') t.closest('.menu-page').toggleAttribute('data-off', !t.checked);
  });
  board.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const unit = b.closest('.menu-page') ?? b.closest('.menu-mod');
    if (b.matches('[data-up]')) {
      const prev = unit.previousElementSibling;
      if (prev && !prev.matches('[data-module="main"]') && !prev.matches('.empty')) prev.before(unit);
    } else if (b.matches('[data-down]')) {
      unit.nextElementSibling?.after(unit);
    } else if (b.matches('[data-drop-mod]')) {
      try {
        await ops(`/v1/ops/menus/${accessScope}/modules/${unit.dataset.module}`, { method: 'DELETE' });
        await reload();
      } catch (error) {
        toast(error.message, 'bad');
      }
    } else if (b.matches('[data-drop-link]')) {
      if (!confirm('Энэ холбоосыг цэснээс устгах уу?')) return;
      try {
        await ops(`/v1/ops/menus/${accessScope}/links/${unit.dataset.page}`, { method: 'DELETE' });
        await reload();
      } catch (error) {
        toast(error.message, 'bad');
      }
    }
  });

  const tools = el(`
    <div class="menu-tools">
      <button class="btn" type="button" data-add-mod>+ Модуль</button>
      <button class="btn" type="button" data-add-link>+ Холбоос</button>
      <span class="gap"></span>
      <button class="btn" data-v="primary" type="button" data-save-menu id="save-menu">Хадгалах</button>
    </div>`);
  tools.querySelector('[data-add-mod]').addEventListener('click', async () => {
    const name = prompt('Модулийн нэр:', '');
    if (!name?.trim()) return;
    try {
      await ops(`/v1/ops/menus/${accessScope}/modules`, { method: 'POST', body: { name: name.trim() } });
      await reload();
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  tools.querySelector('[data-add-link]').addEventListener('click', async () => {
    const name = prompt('Холбоосын нэр (цэсэнд харагдах):', '');
    if (!name?.trim()) return;
    const href = prompt('Хаяг — /kds гэх мэт Basu-гийн зам, эсвэл https://…', 'https://');
    if (!href?.trim()) return;
    try {
      await ops(`/v1/ops/menus/${accessScope}/links`, { method: 'POST', body: { name: name.trim(), href: href.trim() } });
      toast('Холбоос нэмэгдлээ. Хэн харахыг «Үүрэг, эрх»-ээс сонгоно.', 'good');
      await reload();
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  tools.querySelector('[data-save-menu]').addEventListener('click', async (e) => {
    const modules = [...board.querySelectorAll('.menu-mod')].map((card, i) => ({
      key: card.dataset.module,
      name: card.querySelector('[name="name"]').value.trim(),
      icon: card.querySelector('[name="icon"]').value,
      sort: i * 10,
    }));
    const pages = [...board.querySelectorAll('.menu-mod')].flatMap((card) =>
      [...card.querySelectorAll('.menu-page')].map((row, i) => ({
        key: row.dataset.page,
        module: card.dataset.module,
        name: row.querySelector('[name="name"]').value.trim(),
        icon: row.querySelector('[name="icon"]').value,
        sort: (i + 1) * 10,
        hidden: !row.querySelector('[name="shown"]').checked,
      })),
    );
    e.target.setAttribute('data-busy', '');
    try {
      await ops(`/v1/ops/menus/${accessScope}`, { method: 'PUT', body: { modules: modules.filter((m) => m.key !== 'main'), pages } });
      toast('Цэс хадгалагдлаа.', 'good');
      await reload();
    } catch (error) {
      toast(error.message, 'bad');
    } finally {
      e.target.removeAttribute('data-busy');
    }
  });
  if (manage) view.append(tools);
  view.append(board);
  if (!manage) board.querySelectorAll('input, select, button').forEach((i) => (i.disabled = true));
}

/**
 * One business, from the desk: the people in it and their roles — any of
 * them the desk may change, its head too — and which roles, beyond those
 * open to every business, it may hand out.
 */
async function openOrgAccess(orgId) {
  const view = nav.view;
  view.replaceChildren();
  window.scrollTo(0, 0);
  let data;
  try {
    data = await ops(`/v1/ops/orgs/${orgId}/access`);
  } catch (error) {
    toast(error.message, 'bad');
    return show('orgs');
  }
  const deciding = can('desk.orgs:access');
  const back = el('<button class="back link" type="button">← Байгууллагууд</button>');
  back.addEventListener('click', () => show('orgs'));
  view.append(back, head(esc(data.org.name), `${kinds(data.org).join(' · ')} · ${ORG_STATE[data.org.state]?.[1] ?? data.org.state}`));
  const open = data.roles.filter((r) => r.open);
  const people = el(`
    <section class="section"><h2 class="section-label">Хүмүүс, үүрэг</h2>
      <div class="card"><div class="table-wrap"><table class="table team"><thead><tr><th>Нэр</th><th>Утас, имэйл</th><th>Үүрэг</th></tr></thead><tbody data-people></tbody></table></div></div>
    </section>`);
  for (const m of data.members) {
    const tr = el(`<tr data-member="${esc(m.guest_id)}"><td><b>${esc(m.name ?? '—')}</b><span class="sub mono">${esc(m.contact ?? '')}</span></td><td class="mono">${esc(m.contact ?? '—')}</td><td></td></tr>`);
    const cell = tr.lastElementChild;
    if (deciding) {
      const select = el(`<select class="input" data-size="sm" style="width:auto" aria-label="Үүрэг">${open.map((r) => `<option value="${esc(r.key)}"${r.key === m.role ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</select>`);
      select.addEventListener('change', async () => {
        try {
          await ops(`/v1/ops/orgs/${orgId}/members/${m.guest_id}`, { method: 'PATCH', body: { role: select.value } });
          toast(`${m.name ?? 'Хүн'}: ${select.selectedOptions[0].textContent}`, 'good');
          m.role = select.value;
        } catch (error) {
          toast(error.message, 'bad');
          select.value = m.role;
        }
      });
      cell.append(select);
    } else cell.textContent = m.role_name;
    people.querySelector('[data-people]').append(tr);
  }
  view.append(people);

  const roles = el(`
    <section class="section"><h2 class="section-label">Энэ байгууллагад нээлттэй үүрэг</h2>
      <div class="card"><div class="card-body">
        <p class="cap" style="margin:0 0 12px">«Бүх байгууллагад» үүргийг хүн бүр ашиглана. Бусдыг нь зөвхөн чагталсан байгууллага ажилтандаа өгнө. Үүрэг бүр юу нээхийг «Үүрэг, эрх»-ээр засна.</p>
        <div class="org-roles" data-org-roles></div>
        ${deciding ? '<div class="form-foot"><button class="btn" data-v="primary" type="button" data-save-roles>Хадгалах</button></div>' : ''}
      </div></div>
    </section>`);
  const holder = roles.querySelector('[data-org-roles]');
  for (const r of data.roles) {
    holder.append(el(`<label class="org-role"><input type="checkbox" value="${esc(r.key)}"${r.open ? ' checked' : ''}${r.everyone || !deciding ? ' disabled' : ''}> <b>${esc(r.name)}</b>${r.head ? ' <span class="pill" data-size="sm">эзэн</span>' : ''}${r.everyone ? ' <span class="meta">бүх байгууллагад</span>' : ''}${r.description ? `<small>${esc(r.description)}</small>` : ''}</label>`));
  }
  roles.querySelector('[data-save-roles]')?.addEventListener('click', async () => {
    const keys = [...holder.querySelectorAll('input:checked:not(:disabled)')].map((i) => i.value);
    try {
      await ops(`/v1/ops/orgs/${orgId}/roles`, { method: 'PUT', body: { keys } });
      toast('Хадгалагдлаа.', 'good');
      openOrgAccess(orgId);
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  view.append(roles);
}

/* ── the frame: one sidebar for every place a person works ─────────── */

/**
 * The desk's own session: the demo's secret, or a person's sign-in — kept
 * under its own key, never the guest's, so a person who is both a guest
 * and a member keeps both, and a browser that is only a guest is simply
 * shown the door here.
 */
const token = () => store.opsToken;
const ops = (path, options = {}) => api(path, { ...options, token: token() });

/** What /v1/access said: the person, and every place they work, each with its menu. */
let access = null;
/** The place open now. */
let ws = null;
/** The frame's handles. */
let nav = null;
/** The page open now. */
let tab = null;
/** The desk seat, when the place open is the desk. */
let me = null;
let cache = { suppliers: [], settlements: [], requests: [], orgs: [] };

/** Whether the place open now lets this person do that. The server asks again; this only decides what to draw. */
const can = (permission) => Boolean(ws?.permissions?.includes(permission));
const deskSeat = () => access?.workspaces.find((w) => w.kind === 'desk') ?? null;
const pagesOf = (w) => w.menu.flatMap((g) => g.items);
/** Whether the place open now has that page — what a link inside a page asks before it is drawn. */
const hasPage = (key) => Boolean(ws && pagesOf(ws).some((i) => i.key === key && !i.href));
const lastPageKey = (w) => (w.kind === 'desk' ? 'basu.ops.tab' : `basu.dash.page.${w.id}`);
const firstPage = (w) => pagesOf(w).find((i) => !i.href)?.key ?? 'home';
const remembered = (w) => {
  const saved = localStorage.getItem(lastPageKey(w));
  return saved && pagesOf(w).some((i) => i.key === saved && !i.href) ? saved : firstPage(w);
};

const DESK_PAGES = {
  overview: renderOverview, guests: renderGuests, money: renderMoney, notify: renderNotify, system: renderSystem,
  venues: renderVenues, lunches: renderLunches, reviews: renderReviews,
  stats: renderStats, orders: renderOrders, suppliers: renderSuppliers, pay: renderPay,
  orgs: renderOrgsDesk, members: renderMembers, roles: renderRoles, menus: renderMenus, audit: renderAudit,
};
const ORG_PAGES = { home: renderOrgHome, team: renderOrgTeam, profile: renderOrgProfile, roles: renderOrgRoles, log: renderOrgLog };
const ME_PAGES = { home: renderMeHome, profile: renderMeProfile };

/**
 * The place to open: the one the address names, else the last one used,
 * else the desk, else the first business that is running, else the
 * person's own corner.
 */
function choose(hash) {
  const [id, page] = decodeURIComponent((hash ?? '').replace(/^#/, '')).split('/');
  const all = access.workspaces;
  const named = all.find((w) => w.id === id);
  if (named) return { w: named, page };
  const last = all.find((w) => w.id === localStorage.getItem('basu.dash.ws'));
  return { w: last ?? all.find((w) => w.kind === 'desk') ?? all.find((w) => w.kind === 'org' && w.state === 'active') ?? all[0], page: null };
}

/** Open a place — the frame is built afresh for it — on the page asked for, or the one last open there. */
function open(w, page) {
  if (!w) return;
  clearInterval(frontPoll);
  ws = w;
  localStorage.setItem('basu.dash.ws', w.id);
  me = w.kind === 'desk' ? { id: w.seat?.id, name: w.seat?.name, role: w.role } : null;
  frame();
  tab = hasPage(page) ? page : remembered(w);
  nav.select(tab);
  if (w.kind === 'desk') refresh();
  else show(tab);
}

function frame() {
  const actions = [];
  if (access.account) {
    actions.push({ key: 'new-org', label: 'Байгууллага бүртгүүлэх', icon: 'plus' });
    if (!deskSeat()) actions.push({ key: 'ask-desk', label: 'Basu ops эрх хүсэх', icon: 'key' });
  }
  nav = deskFrame({
    workspaces: access.workspaces,
    current: ws,
    account: access.account,
    onPage: (item) => (item.href ? false : show(item.key)),
    onWorkspace: (w) => open(w),
    onSignOut: signOut,
    actions,
    onAction: (key) => {
      wanted = key;
      open(access.workspaces.find((w) => w.kind === 'me'), 'home');
    },
  });
  root.replaceChildren(nav.root);
}

/** Ask again who the person is and where they work — after they changed it — and open `id` (or stay). */
async function reload(id) {
  try {
    access = await ops('/v1/access');
  } catch (error) {
    if (error.status === 401) return signOut();
    toast(error.message, 'bad');
    return;
  }
  const w = access.workspaces.find((x) => x.id === (id ?? ws?.id)) ?? access.workspaces.find((x) => x.id === ws?.id);
  open(w ?? choose('').w, w?.id === ws?.id ? tab : null);
}

function signOut() {
  clearInterval(frontPoll);
  store.opsToken = null;
  access = ws = nav = me = null;
  showToken();
}

/** The desk's lists the badges and three pages read, then the page again. A business or the corner has none. */
async function refresh() {
  if (ws?.kind === 'desk') {
    try {
      const [suppliers, settlements, requests, orgs] = await Promise.all([
        (can('desk.suppliers') || can('desk.orders')) ? ops('/v1/ops/suppliers').then((r) => r.suppliers) : [],
        can('desk.pay') ? ops('/v1/ops/settlements').then((r) => r.settlements) : [],
        can('desk.members') ? ops('/v1/ops/requests').then((r) => r.requests) : [],
        can('desk.orgs') ? ops('/v1/ops/orgs').then((r) => r.orgs) : [],
      ]);
      cache = { suppliers, settlements, requests, orgs };
    } catch (error) {
      // The seat went while the page was open: ask again where this person works rather than throw them out.
      if (error.status === 401) return reload();
      if (error.status === 503) return signOut();
      toast(error.message, 'bad');
      return;
    }
  }
  badges();
  show(tab);
}

/** What waits, in the sidebar: applications to answer, money to send, people and businesses asking in. */
function badges() {
  if (ws?.kind !== 'desk' || !nav) return;
  const applied = cache.suppliers.filter((s) => s.state === 'applied').length;
  const due = cache.settlements.filter((t) => t.state === 'due').length;
  const waitingOrgs = cache.orgs.filter((o) => o.state === 'applied').length;
  nav.badge('suppliers', applied, applied > 0);
  nav.badge('pay', due, due > 0);
  nav.badge('members', cache.requests.length, cache.requests.length > 0);
  nav.badge('orgs', waitingOrgs, waitingOrgs > 0);
}

function show(key) {
  if (!ws || !nav) return;
  tab = key;
  localStorage.setItem(lastPageKey(ws), key);
  history.replaceState(null, '', `#${ws.id}/${key}`);
  nav.select(key);
  clearInterval(frontPoll);
  const view = nav.view;
  view.replaceChildren();
  window.scrollTo(0, 0);
  const pages = ws.kind === 'desk' ? DESK_PAGES : ws.kind === 'org' ? ORG_PAGES : ME_PAGES;
  const draw = hasPage(key) ? pages[key] ?? (key.startsWith('dine.') ? renderDineSoon : null) : null;
  if (draw) draw(view);
  else view.append(head('Олдсонгүй', 'Энэ хуудас танд нээлттэй биш байна.'));
}

const PERIODS = [['today', 'Өнөөдөр'], ['week', '7 хоног'], ['season', 'Улирал']];
let period = localStorage.getItem('basu.ops.period') ?? 'today';

/** The period switch every numbers page shares; `draw` is called again on each change. */
function periodSeg(draw) {
  const seg = el(`<div class="seg">${PERIODS.map(([k, l]) => `<button type="button" data-p="${k}"${period === k ? ' data-on' : ''}>${l}</button>`).join('')}</div>`);
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-p]');
    if (!b) return;
    period = b.dataset.p;
    localStorage.setItem('basu.ops.period', period);
    for (const c of seg.querySelectorAll('button')) c.toggleAttribute('data-on', c === b);
    draw();
  });
  return seg;
}

async function loadGuests() {
  const box = document.getElementById('guests');
  if (!box) return;
  let data;
  try {
    data = await ops(`/v1/ops/guests?${new URLSearchParams({ q: guestQ })}`);
  } catch (error) {
    box.replaceChildren(el(`<div class="empty">${esc(error.message)}</div>`));
    return;
  }
  if (!document.getElementById('guests')) return;
  if (!data.guests.length) {
    box.replaceChildren(el('<div class="empty"><b>Зочин олдсонгүй</b>Утасны дор хаяж 4 орон, имэйл эсвэл нэрийн хэсгийг бич.</div>'));
    return;
  }
  const table = el('<table class="table"><thead><tr><th>Зочин</th><th>Холбоо барих</th><th>Бүртгүүлсэн</th><th>Төлөв</th></tr></thead><tbody></tbody></table>');
  const body = table.querySelector('tbody');
  for (const g of data.guests) {
    const tr = el(`
      <tr data-link data-guest="${g.id}">
        <td><b>${esc(g.name ?? (g.closed_at ? 'Хаагдсан бүртгэл' : 'Нэргүй зочин'))}</b></td>
        <td><span class="mono">${esc(g.phone ?? '')}</span>${g.email ? `<span class="sub">${esc(g.email)}</span>` : ''}${!g.phone && !g.email ? '—' : ''}</td>
        <td><span class="mono">${when(g.joined_at)}</span></td>
        <td>${g.closed_at ? `<span class="pill" data-s="off">хаагдсан ${when(g.closed_at)}</span>` : '<span class="pill" data-s="contracted">идэвхтэй</span>'}</td>
      </tr>`);
    tr.addEventListener('click', () => openGuest(g.id));
    body.append(tr);
  }
  box.replaceChildren(table);
}

        toast('Бүртгэл хаагдлаа.', 'good');
      }
      await openGuest(id);
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  view.append(page);
}

/* ── lunch: the restaurants ── */

const DINE_LIVE = ['PLACED', 'ACCEPTED', 'SCHEDULED', 'ARMED', 'HELD', 'FIRED', 'COOKING', 'READY', 'SERVED'];
const DINE_FREE = ['PLACED', 'ACCEPTED', 'SCHEDULED', 'ARMED', 'HELD', 'RESLOTTED'];
const DINE_EVENT = {
  CREATED: 'Үүссэн', PAID: 'Төлсөн', PLANNED: 'Төлөвлөсөн', ACCEPTED: 'Ресторан баталсан', REJECTED: 'Ресторан татгалзсан', ARMED: 'Бэлтгэлд орсон',
  HELD: 'Түр зогсоосон', HELD_BY_KITCHEN: 'Гал тогоо түр зогсоосон', FIRED: 'Гал дээр гарсан', READY: 'Бэлэн болсон', SERVED: 'Үйлчилсэн', CLOSED: 'Дууссан',
  CANCELLED: 'Цуцлагдсан', REFUNDED: 'Буцаалт хийсэн', NO_SHOW: 'Зочин ирээгүй', REVIEWED: 'Үнэлгээ өгсөн', SEATED: 'Суусан', RESLOTTED: 'Цаг солигдсон',
};
const dineActor = (a) => {
  if (!a) return '';
  if (a.startsWith('guest:')) return 'зочин';
  if (a.startsWith('kds:')) return 'гал тогооны дэлгэц';
  if (a.startsWith('ops:')) return `ops · ${a.slice(4)}`;
  return { 'system:planner': 'төлөвлөгч', 'system:scheduler': 'хуваарьлагч' }[a] ?? a;
};
const stars = (n) => `<span class="stars" aria-label="${n} од">${Array.from({ length: 5 }, (_, i) => (i < n ? STAR : STAR.replace('<svg', '<svg data-off'))).join('')}</span>`;
let venueCache = [];

async function renderVenues(view) {
  view.append(head('Ресторан', 'Гал тогоо бүр: таблет холбоотой эсэх, өнөөдрийн захиалга, цэс, үнэлгээ.'));
  view.append(el('<div class="rows" id="venues" data-rows></div>'));
  view.querySelector('#venues').append(busy());
  await loadVenues();
}

async function loadVenues() {
  const box = document.getElementById('venues');
  if (!box) return;
  try {
    ({ restaurants: venueCache } = await ops('/v1/ops/dine/restaurants'));
  } catch (error) {
    box.replaceChildren(el(`<div class="card empty">${esc(error.message)}</div>`));
    return;
  }
  if (!document.getElementById('venues')) return;
  box.replaceChildren(...(venueCache.length ? venueCache.map(renderVenue) : [el('<div class="card empty"><b>Ресторан алга</b>Хоолны талд ресторан бүртгэгдээгүй.</div>')]));
}

function renderVenue(r) {
  const card = el(`
    <div class="card row" data-venue="${r.id}" data-state="${r.active ? 'on' : 'off'}">
      <div class="name">${esc(r.name)}
        ${r.active ? '' : ' <span class="pill" data-s="off">зогссон</span>'}
        <span class="pill" data-s="${r.online ? 'contracted' : 'declined'}">${r.online ? 'дэлгэц холбоотой' : 'дэлгэц холбогдоогүй'}</span>
        <small>${r.rating ? `${stars(Math.round(r.rating.stars))} ${r.rating.stars} · ${r.rating.count} үнэлгээ${r.rating.on_time_share === null ? '' : ` · цагтаа ${Math.round(r.rating.on_time_share * 100)}%`}` : 'үнэлгээ алга'} · ${r.slot_minutes} мин цаг · ${r.auto_accept ? 'автоматаар батална' : 'гараар батална'}${r.merchant_tin ? '' : ' · <b class="ink-stop">е-баримтын ТТД алга</b>'}</small>
      </div>
      <div class="right"><div class="btns">
        <button class="btn" data-size="sm" type="button" data-a="menu">Цэс</button>
        ${can('desk.venues:manage') ? `<details class="more"><summary class="btn" data-size="sm" data-icon aria-label="Бусад үйлдэл"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></summary><div class="menu">
          <button class="btn" data-size="sm" data-v="quiet" type="button" data-a="tablet">Шинэ таблет</button>
          <button class="btn${r.active ? ' ink-stop' : ''}" data-size="sm" data-v="quiet" type="button" data-a="active">${r.active ? 'Зогсоох' : 'Идэвхжүүлэх'}</button>
        </div></details>` : ''}
      </div></div>
      <div class="about">Өнөөдөр <b>${r.today.placed}</b> захиалга · <b>${r.today.live}</b> идэвхтэй${r.today.held ? ` · <b class="ink-hold">${r.today.held} түр зогсоосон</b>` : ''} · <b>${money(r.today.sales_mnt)}</b> · цэс ${r.menu.active}/${r.menu.total}${r.menu.sold_out ? ` (${r.menu.sold_out} дууссан)` : ''}
        <div class="sess-list">${r.devices.length ? r.devices.map((d) => `
          <div class="sess"><span>${d.pairing_code ? `Код <b class="mono">${d.pairing_code}</b> · ${esc(d.label ?? '')} · ${clockOf(d.pairing_expires_at)} хүртэл` : `${esc(d.label ?? 'Таблет')} · ${d.online ? '<span class="pill" data-s="contracted">онлайн</span>' : `сүүлд ${d.last_seen_at ? `${when(d.last_seen_at)} ${clockOf(d.last_seen_at)}` : 'хэзээ ч үгүй'}`}`}</span>
          ${can('desk.venues:manage') ? `<button class="btn" data-v="quiet" data-size="sm" type="button" data-a="revoke" data-device="${d.id}">Салгах</button>` : ''}</div>`).join('') : '<span class="muted">Таблет холбогдоогүй.</span>'}</div>
      </div>
    </div>`);
  card.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    try {
      if (b.dataset.a === 'tablet') {
        const label = prompt('Таблетын нэр (жишээ нь «Хойд гал тогоо»):', 'Гал тогооны таблет');
        if (label === null) return;
        const { pairing_code } = await ops(`/v1/ops/dine/restaurants/${r.id}/devices`, { method: 'POST', body: { label } });
        toast(`Код ${pairing_code} — 10 минутын дотор таблет дээр оруулна.`, 'good');
      } else if (b.dataset.a === 'revoke') {
        if (!confirm('Энэ таблетыг салгах уу? Дэлгэц дахин холбох код шаардана.')) return;
        await ops(`/v1/ops/dine/devices/${b.dataset.device}/revoke`, { method: 'POST', body: {} });
      } else if (b.dataset.a === 'active') {
        const note = prompt(r.active ? 'Зогсоох шалтгаан:' : 'Идэвхжүүлэх тэмдэглэл:', '');
        if (note === null) return;
        await ops(`/v1/ops/dine/restaurants/${r.id}/active`, { method: 'POST', body: { active: !r.active, note } });
      } else if (b.dataset.a === 'menu') {
        const open = card.querySelector('.drawer');
        if (open) return open.remove();
        return card.append(await menuDrawer(r));
      }
      await loadVenues();
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  return card;
}

async function menuDrawer(r) {
  const { items } = await ops(`/v1/ops/dine/restaurants/${r.id}/menu`);
  const d = el(`<div class="drawer table-wrap"><table class="table"${items.length ? '' : ' data-empty'}><thead><tr><th>Хоол</th><th>Цех</th><th class="num">Үнэ</th><th class="num">Бэлтгэх, мин</th><th>Төлөв</th><th></th></tr></thead><tbody>${items
    .map((m) => `<tr${m.active ? '' : ' data-off'}><td><b>${esc(m.name)}</b></td><td>${esc(m.station)}</td><td class="num">${money(m.price_mnt)}</td><td class="num">${m.prep_minutes}</td><td>${m.active ? (m.sold_out_until ? '<span class="pill" data-s="off">дууссан</span>' : '<span class="pill" data-s="contracted">цэсэнд</span>') : '<span class="pill" data-s="declined">нуусан</span>'}</td><td class="num">${can('desk.venues:manage') ? `<button class="btn" data-size="sm" data-v="quiet" type="button" data-item="${m.id}" data-on="${m.active}">${m.active ? 'Нуух' : 'Харуулах'}</button>` : ''}</td></tr>`)
    .join('') || '<tr><td colspan="6" class="empty">Цэс хоосон.</td></tr>'}</tbody></table></div>`);
  d.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-item]');
    if (!b) return;
    e.stopPropagation();
    const active = b.dataset.on !== 'true';
    const note = prompt(active ? 'Цэсэнд буцаах тэмдэглэл:' : 'Нуух шалтгаан:', '');
    if (note === null) return;
    try {
      await ops(`/v1/ops/dine/menu/${b.dataset.item}/active`, { method: 'POST', body: { active, note } });
      d.replaceWith(await menuDrawer(r));
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  return d;
}

/* ── lunch: the orders ── */

let lunchFilter = { scope: 'live', restaurant: '', day: '', q: '' };

async function renderLunches(view) {
  view.append(head('Хоолны захиалга', 'Өнөөдрийн болон өмнөх захиалгууд. Дарж дэлгэрэнгүйг үзнэ.'));
  if (!venueCache.length) {
    try {
      ({ restaurants: venueCache } = await ops('/v1/ops/dine/restaurants'));
    } catch { /* the list still works without the filter */ }
  }
  if (tab !== 'lunches') return;
  view.append(el(`
    <div class="card">
      <div class="tools">
        <input class="input search" type="search" id="q" placeholder="Код, утас, зочин, ресторан…" value="${esc(lunchFilter.q)}" autocomplete="off">
        <select class="input" id="restaurant"><option value="">Бүх ресторан</option>${venueCache.map((r) => `<option value="${r.id}"${lunchFilter.restaurant === r.id ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</select>
        <input class="input" type="date" id="day" value="${esc(lunchFilter.day)}" title="Хоолны өдөр">
        <div class="seg">${[['live', 'Идэвхтэй'], ['done', 'Дууссан'], ['all', 'Бүгд']].map(([k, l]) => `<button type="button" data-scope="${k}"${lunchFilter.scope === k ? ' data-on' : ''}>${l}</button>`).join('')}</div>
      </div>
      <div id="lunches" class="table-wrap"></div>
    </div>`));
  view.querySelector('#lunches').append(busy());
  let timer;
  view.querySelector('#q').addEventListener('input', (e) => {
    lunchFilter.q = e.target.value;
    clearTimeout(timer);
    timer = setTimeout(loadLunches, 250);
  });
  view.querySelector('#restaurant').addEventListener('change', (e) => ((lunchFilter.restaurant = e.target.value), loadLunches()));
  view.querySelector('#day').addEventListener('change', (e) => ((lunchFilter.day = e.target.value), loadLunches()));
  view.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-scope]');
    if (!b) return;
    lunchFilter.scope = b.dataset.scope;
    for (const c of view.querySelectorAll('.seg button')) c.toggleAttribute('data-on', c === b);
    void loadLunches();
  });
  void loadLunches();
}

async function loadLunches() {
  const box = document.getElementById('lunches');
  if (!box) return;
  const qs = new URLSearchParams({ scope: lunchFilter.scope, q: lunchFilter.q });
  if (lunchFilter.restaurant) qs.set('restaurant', lunchFilter.restaurant);
  if (lunchFilter.day) qs.set('day', lunchFilter.day);
  let data;
  try {
    data = await ops(`/v1/ops/dine/orders?${qs}`);
  } catch (error) {
    box.replaceChildren(el(`<div class="empty">${esc(error.message)}</div>`));
    return;
  }
  if (!document.getElementById('lunches')) return;
  if (!data.orders.length) {
    box.replaceChildren(el('<div class="empty"><b>Захиалга алга</b>Шүүлтэд тохирох хоолны захиалга байхгүй.</div>'));
    return;
  }
  const table = el('<table class="table"><thead><tr><th>Захиалга</th><th>Ресторан</th><th>Зочин</th><th>Цаг</th><th>Гал</th><th>Төлөв</th><th class="num">Дүн</th></tr></thead><tbody></tbody></table>');
  const body = table.querySelector('tbody');
  for (const o of data.orders) {
    const tr = el(`
      <tr data-link data-lunch="${o.id}">
        <td><b class="mono">№${esc(o.code)}</b><span class="sub">${o.party_size} хүн</span></td>
        <td>${esc(o.restaurant.name)}</td>
        <td>${esc(o.guest ?? 'зочин')}<span class="sub mono">${esc(o.guest_phone ?? '')}</span></td>
        <td>${stamp(o.slot_starts_at)}</td>
        <td>${o.fire_at ? `<span class="mono">${clockOf(o.fire_at)}</span>` : '—'}${o.late ? ' <span class="pill" data-s="declined">хоцорсон</span>' : ''}</td>
        <td><span class="pill" data-s="${o.state}">${DINE_WORD[o.state] ?? o.state}</span></td>
        <td class="num">${money(o.total_mnt)}</td>
      </tr>`);
    tr.addEventListener('click', () => openLunch(o.id));
    body.append(tr);
  }
  box.replaceChildren(table);
}

async function openLunch(id) {
  const view = document.getElementById('view');
  let d;
  try {
    d = await ops(`/v1/ops/dine/orders/${id}`);
  } catch (error) {
    toast(error.message, 'bad');
    return;
  }
  const o = d.order;
  view.replaceChildren();
  const back = el(`<button class="back link" type="button" id="back">${CHEV}Хоолны захиалга</button>`);
  back.addEventListener('click', () => show('lunches'));
  view.append(back);
  view.append(head(`№${esc(o.code)} <span class="pill" data-s="${o.state}">${DINE_WORD[o.state] ?? o.state}</span>`, `${esc(o.restaurant.name)} · ${when(o.slot_starts_at)} ${clockOf(o.slot_starts_at)} · ${o.party_size} хүн`));
