            <div><div class="lab">Нийт төлсөн</div><b>${money(o.total_mnt)}</b><br>${o.delivery_fee_mnt ? `хүргэлт ${mnt(o.delivery_fee_mnt)} орсон` : 'хүргэлтгүй'}</div>
            <div><div class="lab">Нийлүүлэгчид</div><b>${money(o.payout_mnt)}</b><br>шимтгэл хассан</div>
            ${o.cancel_reason ? `<div><div class="lab">Цуцлалт</div><b>${REASON[o.cancel_reason] ?? o.cancel_reason}</b><br>буцаалт ${mnt(o.refund_mnt ?? 0)}${o.forfeit_mnt ? ` · суутгал ${mnt(o.forfeit_mnt)}` : ''}</div>` : ''}
          </div>
        </div>
        <section class="section"><h2 class="section-label">Мөнгө</h2><div id="money"></div></section>
        <section class="section"><h2 class="section-label">Явц</h2><div class="card card-body"><ol class="story stepper" data-stepper>${d.events
          .map((e) => step(e.type, EVENT_WORD[e.type] ?? e.type, `${actorWord(e.actor)}${e.payload?.reason ? ` · ${REASON[e.payload.reason] ?? e.payload.reason}` : ''}${e.payload?.state ? ` · ${STATE_WORD[e.payload.state] ?? ''}` : ''}`, e.at))
          .join('')}</ol></div></section>
      </div>
      <div class="card" id="acts">
        <div class="card-head"><h3>Ops-ийн үйлдэл</h3></div>
        <div class="card-body acts">
          ${live && !can('desk.orders:manage') ? '<div class="hint">Үйлдлийг ops, админ хийнэ.</div>' : live ? `
          ${['READY', 'DISPATCHED'].includes(o.state) ? '<button class="btn" data-v="primary" type="button" data-a="hand">Хүлээлгэн өгсөн гэж тэмдэглэх</button>' : ''}
          <button class="btn" type="button" data-a="resend">Мэдэгдэл дахин илгээх</button>
          <div class="sep"></div>
          <button class="btn" data-v="danger" type="button" data-a="cancel">Нийлүүлэгчийн өмнөөс цуцлах</button>
          <div class="hint">Буцаалтын дүнг шалтгаан ба дүрэм тогтооно; хүн сонгохгүй.</div>
          ` : '<div class="hint">Дууссан захиалгад үйлдэл алга.</div>'}
        </div>
      </div>
    </div>`);
  const moneyBox = page.querySelector('#money');
  if (d.settlements.length) moneyBox.append(settlementTable(d.settlements, false).el);
  else moneyBox.append(el('<div class="card empty">Тооцоо үүсээгүй — хүлээлгэн өгснөөс хойш нэг хоногт үүснэ.</div>'));
  const acts = page.querySelector('#acts');
  const done = async () => {
    await refresh();
    await openOrder(id);
  };
  const ASK = {
    hand: { title: 'Хүлээлгэн өгсөн', text: `№${esc(o.code)}-г зочинд хүлээлгэн өгсөн гэж тэмдэглэнэ. Нийлүүлэгчийн олголт нэг хоногийн дараа үүснэ.`, ok: 'Тэмдэглэх' },
    resend: { title: 'Мэдэгдэл дахин илгээх', text: `№${esc(o.code)}-ийн сүүлийн мэдэгдлийг зочинд дахин илгээнэ.`, ok: 'Илгээх' },
  };
  acts.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    const action = b.dataset.a;
    if (action === 'cancel') {
      void popup({
        title: 'Нийлүүлэгчийн өмнөөс цуцлах',
        sub: `№${esc(o.code)} · ${esc(o.title)} · ${mnt(o.total_mnt)}`,
        width: 520,
        danger: true,
        submit: 'Цуцлах',
        fields: [
          { type: 'note', text: 'Буцаалтын дүнг сонгосон шалтгаан ба дүрэм тогтооно; хүн сонгохгүй.' },
          { name: 'reason', label: 'Шалтгаан', type: 'select', required: true, wide: true, options: [['', 'Сонгох…'], ...Object.entries(REASON).filter(([k]) => k !== 'draft_expired')] },
          { name: 'note', label: 'Тэмдэглэл', type: 'textarea', placeholder: 'Бүртгэлд үлдэнэ' },
        ],
        onSubmit: async (v) => {
          await ops(`/v1/ops/orders/${id}/cancel`, { method: 'POST', body: { reason: v.reason, note: v.note } });
          toast(`№${o.code} цуцлагдлаа.`, 'good');
          await done();
        },
      });
      return;
    }
    const ask = ASK[action];
    void confirmPopup({
      ...ask,
      reason: { label: 'Тэмдэглэл', placeholder: 'Бүртгэлд үлдэнэ (заавал биш)' },
      onConfirm: async (note) => {
        await ops(`/v1/ops/orders/${id}/${action}`, { method: 'POST', body: { note } });
        toast('Болсон, бүртгэгдлээ.', 'good');
        await done();
      },
    });
  });
  view.append(page);
}

/* ── suppliers ── */

/** A supplier's word and tone: an application, under contract (or paused), or declined. */
const supplierState = (s) => (s.state === 'contracted' ? (s.active ? ['contracted', 'гэрээт'] : ['off', 'түр зогссон']) : [s.state, STATE[s.state] ?? s.state]);

/** Yes to an application, after one look at who it is. */
const approveSupplier = (s, done) =>
  confirmPopup({
    title: 'Нийлүүлэгчийг батлах',
    text: `<b>${esc(s.name)}</b> гэрээт нийлүүлэгч болно. Хүсэлт гаргасан хүн эзэн нь болж, өөрийн бүртгэлээр /supplier-д нэвтэрнэ — SMS очно.`,
    ok: 'Батлах',
    onConfirm: async () => {
      await ops(`/v1/ops/suppliers/${s.id}/approve`, { method: 'POST', body: {} });
      toast(`«${s.name}» батлагдлаа.`, 'good');
      await done();
    },
  });

/** No to an application, with the reason the applicant will read. */
const declineSupplier = (s, done) =>
  confirmPopup({
    title: 'Хүсэлтийг татгалзах',
    text: `<b>${esc(s.name)}</b>-ийн хүсэлтийг татгалзана. Шалтгааныг SMS-ээр илгээнэ; засаад дахин хүсэж болно.`,
    ok: 'Татгалзах',
    danger: true,
    reason: { label: 'Шалтгаан', placeholder: 'ТТД баталгаажаагүй, хаяг тодорхойгүй…', required: true },
    onConfirm: async (reason) => {
      await ops(`/v1/ops/suppliers/${s.id}/decline`, { method: 'POST', body: { reason } });
      toast('Татгалзлаа.', 'good');
      await done();
    },
  });

/** A supplier the desk writes in straight away: the contract is signed, the owner has a Basu account. */
const registerSupplier = () =>
  popup({
    title: 'Нийлүүлэгч бүртгэх',
    sub: 'Гэрээ байгуулсан нийлүүлэгч. Эзэмшигч нь Basu-д бүртгэлтэй байх ёстой — бүртгэмэгц өөрийн бүртгэлээр /supplier-д орно.',
    width: 640,
    id: 'new-supplier',
    fields: [
      { name: 'name', label: 'Нэр', placeholder: 'Хэнтий · «Хэрлэн» хоршоо', required: true, wide: true },
      { name: 'phone', label: 'Утас', type: 'tel', placeholder: '+976XXXXXXXX', required: true },
      { name: 'owner', label: 'Эзэмшигчийн Basu бүртгэл', inputmode: 'email', placeholder: 'Утас эсвэл имэйл', hint: 'Хоосон бол дээрх утас.' },
      { name: 'address', label: 'Мах авах цэг', placeholder: 'Дүүрэг, зах, хаалга', required: true, wide: true },
      { name: 'lat', label: 'Өргөрөг', inputmode: 'decimal', placeholder: '47.9…' },
      { name: 'lon', label: 'Уртраг', inputmode: 'decimal', placeholder: '106.9…' },
      { name: 'tin', label: 'ТТД', inputmode: 'numeric', placeholder: '7–10 орон' },
      { name: 'bank_name', label: 'Банк', placeholder: 'Хаан банк' },
      { name: 'bank_account', label: 'Данс', inputmode: 'numeric', placeholder: '5012345678' },
      { name: 'bank_holder', label: 'Данс эзэмшигч', placeholder: 'Гэрээний нэр' },
    ],
    submit: 'Бүртгэх',
    onSubmit: async (v) => {
      const body = { name: v.name, phone: v.phone, owner: v.owner || undefined, tin: v.tin, address: v.address, bank_name: v.bank_name, bank_account: v.bank_account, bank_holder: v.bank_holder };
      if (v.lat) body.lat = Number(v.lat);
      if (v.lon) body.lon = Number(v.lon);
      const { owner } = await ops('/v1/ops/suppliers', { method: 'POST', body });
      toast(`Бүртгэгдлээ. Эзэмшигч: ${owner.name ?? owner.email ?? owner.phone} — өөрийн бүртгэлээр /supplier-д орно.`, 'good');
      await refresh();
    },
  });

/**
 * The suppliers: the applications waiting for an answer — only while there
 * are some — then everybody under contract, paused or said no to. A supplier
 * is registered, approved, declined in a popup; a row opens its file.
 */
function renderSuppliers(view) {
  const applied = cache.suppliers.filter((s) => s.state === 'applied');
  const rest = cache.suppliers.filter((s) => s.state !== 'applied');
  const runs = can('desk.suppliers:manage');
  view.append(
    headActs(
      head('Нийлүүлэгчид', 'Гэрээт нийлүүлэгчид ба ирсэн хүсэлтүүд. Мөр дээр дарж нөхцөл, данс, зарыг нь үзнэ.'),
      runs && button(`${NAV_ICON.plus}Нийлүүлэгч бүртгэх`, registerSupplier, 'data-v="primary" id="add-supplier"'),
    ),
  );

  if (applied.length) {
    const asked = dataTable({
      columns: [
        { key: 'name', label: 'Хүсэлт гаргагч', render: (s) => dtCell.two(s.name, s.about ?? '') },
        { key: 'phone', label: 'Утас', render: (s) => dtCell.mono(s.phone) },
        { key: 'merchant_tin', label: 'ТТД', render: (s) => dtCell.mono(s.merchant_tin), phone: false },
        { key: 'pickup_address', label: 'Авах цэг', phone: false },
        { key: 'applied_at', label: 'Ирсэн', render: (s) => dtCell.when(s.applied_at) },
      ],
      search: false,
      actions: runs
        ? (s) => [
            button('Батлах', () => approveSupplier(s, refresh), 'data-v="primary" data-size="sm" data-a="approve"'),
            button('Татгалзах', () => declineSupplier(s, refresh), 'data-v="quiet" data-size="sm" data-a="decline"'),
          ]
        : null,
      sort: { key: 'applied_at', desc: true },
      onRow: (s) => openSupplier(s.id),
      rowAttrs: (s) => ({ 'data-supplier': s.id, 'data-state': s.state }),
      noun: 'хүсэлт',
      empty: { title: 'Хүлээгдэж буй хүсэлт алга', text: '' },
      rows: applied,
    });
    asked.el.id = 'applied';
    const section = el(`<section class="section"><h2 class="section-label">Хариу хүлээж буй хүсэлт · ${applied.length}</h2></section>`);
    section.append(asked.el);
    view.append(section);
  }

  const all = dataTable({
    columns: [
      { key: 'name', label: 'Нийлүүлэгч', render: (s) => dtCell.two(s.name, s.pickup_address) },
      { key: 'phone', label: 'Утас', render: (s) => dtCell.mono(s.phone) },
      { key: 'merchant_tin', label: 'ТТД', render: (s) => (s.merchant_tin ? dtCell.mono(s.merchant_tin) : '<span class="ink-stop">алга</span>'), phone: false },
      { key: 'commission_pct', label: 'Шимтгэл', align: 'end', numeric: true, render: (s) => (s.state === 'declined' ? dtCell.none() : `<span class="dt-num">${s.commission_pct}%</span>`) },
      {
        key: 'bank',
        label: 'Данс',
        value: (s) => (s.bank_account ? (s.bank_verified ? 2 : 1) : 0),
        numeric: true,
        render: (s) =>
          s.bank_account
            ? dtCell.twoHtml(`${esc(s.bank_name)} <span class="mono">${esc(s.bank_account)}</span>`, s.bank_verified ? esc(s.bank_holder ?? '') : dtCell.pill('warn', 'баталгаажаагүй'))
            : dtCell.none(),
        phone: false,
      },
      { key: 'listings', label: 'Зар', align: 'end', numeric: true, render: (s) => (s.state === 'contracted' ? dtCell.num(s.listings) : dtCell.none()) },
      { key: 'contracted_at', label: 'Гэрээ', render: (s) => (s.state === 'declined' ? `<small class="muted">татгалзсан</small>` : dtCell.when(s.contracted_at)), phone: false },
      { key: 'state', label: 'Төлөв', value: (s) => supplierState(s)[1], render: (s) => dtCell.pill(...supplierState(s)) },
    ],
    search: { placeholder: 'Нэр, утас, ТТД, хаяг…' },
    filters: [
      {
        key: 'state',
        label: 'Төлөв',
        options: [['all', 'Бүгд'], ['on', 'Гэрээт'], ['off', 'Түр зогссон'], ['declined', 'Татгалзсан']],
        test: (s, v) => v === 'all' || (v === 'on' ? s.state === 'contracted' && s.active : v === 'off' ? s.state === 'contracted' && !s.active : s.state === v),
      },
    ],
    sort: { key: 'name' },
    onRow: (s) => openSupplier(s.id),
    rowAttrs: (s) => ({ 'data-supplier': s.id, 'data-state': s.state }),
    noun: 'нийлүүлэгч',
    empty: { title: 'Нийлүүлэгч алга', text: 'Гэрээ байгуулсан нийлүүлэгчийг «Нийлүүлэгч бүртгэх»-ээр нэмнэ.' },
    stateKey: 'basu.dt.suppliers',
    rows: rest,
  });
  all.el.id = 'all';
  const section = el(`<section class="section">${applied.length ? '<h2 class="section-label">Нийлүүлэгчид</h2>' : ''}</section>`);
  section.append(all.el);
  view.append(section);
}

/** One supplier, whole: who, the contract's terms, the money's account, the listings — and what ops may do, each in a popup. */
async function openSupplier(id) {
  const view = document.getElementById('view');
  const s = cache.suppliers.find((x) => x.id === id);
  if (!s) return show('suppliers');
  const runs = can('desk.suppliers:manage');
  const signs = can('desk.suppliers:terms');
  const again = async () => {
    try {
      cache.suppliers = (await ops('/v1/ops/suppliers')).suppliers;
      badges();
    } catch (error) {
      toast(error.message, 'bad');
    }
    await openSupplier(id);
  };
  view.replaceChildren();
  const back = el(`<button class="back link" type="button" id="back">${CHEV}Нийлүүлэгчид</button>`);
  back.addEventListener('click', () => show('suppliers'));
  const [tone, word] = supplierState(s);
  const h = head(`${esc(s.name)} ${dtCell.pill(tone, word)}`, `${tel(s.phone)} · ${esc(s.pickup_address)}`);

  // What may be done to it: at the top right, each a popup.
  if (s.state === 'applied' && runs) {
    headActs(h, button('Татгалзах', () => declineSupplier(s, again), 'data-a="decline"'), button('Батлах', () => approveSupplier(s, again), 'data-v="primary" data-a="approve"'));
  }
  if (s.state === 'contracted' && runs) {
    headActs(
      h,
      button(
        s.active ? 'Түр зогсоох' : 'Идэвхжүүлэх',
        () =>
          confirmPopup({
            title: s.active ? 'Нийлүүлэгчийг түр зогсоох' : 'Нийлүүлэгчийг идэвхжүүлэх',
            text: s.active ? `<b>${esc(s.name)}</b>-ийн зарууд зочдод харагдахаа болино. Авсан захиалга хэвээр үргэлжилнэ.` : `<b>${esc(s.name)}</b>-ийн зарууд дахин зочдод харагдана.`,
            ok: s.active ? 'Түр зогсоох' : 'Идэвхжүүлэх',
            danger: s.active,
            reason: { label: s.active ? 'Шалтгаан' : 'Тэмдэглэл', placeholder: 'Бүртгэлд үлдэнэ', required: s.active },
            onConfirm: async (note) => {
              await ops(`/v1/ops/suppliers/${s.id}/active`, { method: 'POST', body: { active: !s.active, note } });
              toast(s.active ? 'Түр зогсоолоо.' : 'Идэвхжлээ.', 'good');
              await again();
            },
          }),
        `data-a="active"${s.active ? '' : ' data-v="primary"'}`,
      ),
    );
  }
  view.append(back, h);

  const terms = el(`
    <section class="section"><h2 class="section-label">Гэрээ, данс</h2>
      <div class="card"><div class="facts">
        <div><span class="lab">Шимтгэл</span><b>${s.state === 'declined' ? '—' : `${s.commission_pct}%`}</b></div>
        <div><span class="lab">ТТД</span><b class="mono">${esc(s.merchant_tin ?? '—')}</b></div>
        <div><span class="lab">Банк</span><b>${esc(s.bank_name ?? '—')}</b></div>
        <div><span class="lab">Данс</span><b class="mono">${esc(s.bank_account ?? '—')}</b>${s.bank_account ? (s.bank_verified ? ' <span class="pill" data-s="verified">баталгаажсан</span>' : ' <span class="pill" data-s="warn">баталгаажаагүй</span>') : ''}</div>
        <div><span class="lab">Данс эзэмшигч</span><b>${esc(s.bank_holder ?? '—')}</b></div>
        <div><span class="lab">${s.state === 'applied' ? 'Хүсэлт' : s.state === 'declined' ? 'Татгалзсан' : 'Гэрээ'}</span><b>${when(s.state === 'applied' ? s.applied_at : s.state === 'declined' ? s.decided_at : s.contracted_at)}</b>${s.state === 'declined' && s.decline_reason ? `<br><small class="muted">${esc(s.decline_reason)}</small>` : ''}</div>
      </div></div>
    </section>`);
  const label = terms.querySelector('.section-label');
  const tools = el('<span class="label-acts"></span>');
  if (s.state === 'contracted' && s.bank_account && !s.bank_verified && signs) {
    // A changed account pays out nothing until somebody holds it up against the contract.
    tools.append(
      button(
        'Данс баталгаажуулах',
        () =>
          confirmPopup({
            title: 'Данс баталгаажуулах',
            text: `<b>${esc(s.bank_name ?? '')} <span class="mono">${esc(s.bank_account)}</span></b> · ${esc(s.bank_holder ?? '')}<br>Гэрээний данстай таарч байна уу? Баталгаажсаны дараа олголт энэ данс руу явна.`,
            ok: 'Таарч байна',
            onConfirm: async () => {
              await ops(`/v1/ops/suppliers/${s.id}/bank-verify`, { method: 'POST', body: { note: 'гэрээтэй тулгасан' } });
              toast('Данс баталгаажлаа.', 'good');
              await again();
            },
          }),
        'data-v="primary" data-size="sm" data-a="bank-verify"',
      ),
    );
  }
  if (s.state !== 'declined' && signs) {
    // The contract's terms: written in once it is signed, corrected here.
    tools.append(
      button(
        'Засах',
        () =>
          popup({
            title: 'Гэрээ, данс',
            sub: esc(s.name),
            width: 600,
            fields: [
              { name: 'commission_pct', label: 'Шимтгэл, %', inputmode: 'decimal', value: s.commission_pct },
              { name: 'tin', label: 'ТТД', inputmode: 'numeric', placeholder: '7–14 орон', value: s.merchant_tin ?? '' },
              { name: 'bank_name', label: 'Банк', value: s.bank_name ?? '' },
              { name: 'bank_account', label: 'Данс', inputmode: 'numeric', value: s.bank_account ?? '', hint: 'Данс өөрчлөгдвөл дахин баталгаажуулах хүртэл олголт гарахгүй.' },
              { name: 'bank_holder', label: 'Данс эзэмшигч', value: s.bank_holder ?? '', wide: true },
            ],
            onSubmit: async (v) => {
              const body = { tin: v.tin, bank_name: v.bank_name, bank_account: v.bank_account, bank_holder: v.bank_holder };
              if (v.commission_pct !== '') body.commission_pct = Number(v.commission_pct);
              await ops(`/v1/ops/suppliers/${s.id}`, { method: 'PATCH', body });
              toast('Хадгалагдлаа.', 'good');
              await again();
            },
          }),
        'data-size="sm" data-a="terms"',
      ),
    );
  }
  if (tools.childElementCount) label.append(tools);
  view.append(terms);
  if (s.about) view.append(el(`<section class="section"><h2 class="section-label">Тухай</h2><div class="card"><div class="card-body">${esc(s.about)}</div></div></section>`));

  if (s.state === 'contracted') {
    const listings = dataTable({
      columns: [
        { key: 'title', label: 'Зар', render: (l) => `<b>${esc(l.title)}</b>` },

/* ── the money ── */

/** Where a payout or a refund stands, in the word and tone the desk reads it by. */
const settlementState = (t) =>
  t.state === 'paid'
    ? ['paid', 'шилжүүлсэн']
    : t.state === 'needs_account'
      ? ['needs_account', 'данс хүлээж байна']
      : !t.bank_verified
        ? ['warn', 'данс баталгаажаагүй']
        : t.approved_at
          ? ['due', 'шилжүүлэх']
          : ['hold', 'батлах хүлээж байна'];

/**
 * Payouts and refunds as one table: who, for which order, to which account,
 * where it stands — and on a row that is due, the one half of the two-person
 * release this member may press. The whole list on «Олголт», one order's on its page.
 */
function settlementTable(rows, withFilters = true) {
  return dataTable({
    columns: [
      {
        key: 'who',
        label: 'Хэнд',
        value: (t) => (t.kind === 'payout' ? t.supplier?.name ?? '' : t.guest?.name ?? 'Зочин'),
        render: (t) => dtCell.two(t.kind === 'payout' ? t.supplier?.name ?? '' : t.guest?.name ?? 'Зочин', t.kind === 'payout' ? 'олголт · нийлүүлэгч' : 'буцаалт · зочин'),
      },
      { key: 'order_code', label: 'Захиалга', render: (t) => dtCell.twoHtml(`<span class="mono">№${esc(t.order_code)}</span>`, esc(t.memo ?? '')) },
      {
        key: 'bank',
        label: 'Данс',
        value: (t) => `${t.bank_name ?? ''} ${t.bank_account ?? ''} ${t.bank_holder ?? ''}`,
        render: (t) => (t.bank_account ? dtCell.twoHtml(`${esc(t.bank_name)} <span class="mono">${esc(t.bank_account)}</span>`, esc(t.bank_holder ?? '')) : '<span class="muted">данс алга</span>'),
        phone: false,
      },
      {
        key: 'state',
        label: 'Төлөв',
        value: (t) => settlementState(t)[1],
        render: (t) =>
          dtCell.twoHtml(
            dtCell.pill(...settlementState(t)),
            t.state === 'paid'
              ? `${when(t.paid_at)}${t.reference ? ` · <span class="mono">${esc(t.reference)}</span>` : ''}`
              : t.approved_by
                ? `${esc(t.approved_by.replace('ops:', ''))} баталсан`
                : '',
          ),
      },
      { key: 'created_at', label: 'Үүссэн', render: (t) => dtCell.when(t.created_at), phone: false },
      { key: 'amount_mnt', label: 'Дүн', align: 'end', numeric: true, render: (t) => dtCell.money(t.amount_mnt) },
    ],
    search: withFilters ? { placeholder: 'Нэр, захиалга, данс…' } : false,
    filters: withFilters ? [
      {
        key: 'state',
        label: 'Төлөв',
        options: [['open', 'Хийх'], ['needs_account', 'Данс хүлээж буй'], ['paid', 'Шилжүүлсэн'], ['all', 'Бүгд']],
        test: (t, v) => v === 'all' || (v === 'open' ? t.state === 'due' : t.state === v),
      },
      {
        key: 'kind',
        label: 'Төрөл',
        kind: 'select',
        options: [['', 'Олголт ба буцаалт'], ['payout', 'Олголт'], ['refund', 'Буцаалт']],
        test: (t, v) => !v || t.kind === v,
      },
    ] : [],
    actions: (t) => {
      if (t.state !== 'due' || !t.bank_verified || !can('desk.pay:approve')) return null;
      const who = t.kind === 'payout' ? t.supplier?.name ?? 'Нийлүүлэгч' : t.guest?.name ?? 'Зочин';
      const line = `<b>${mnt(t.amount_mnt)}</b> → ${esc(who)}<br>${esc(t.bank_name ?? '')} · <span class="mono">${esc(t.bank_account ?? '')}</span> · ${esc(t.bank_holder ?? '')}<br><small class="muted">№${esc(t.order_code)} · ${t.kind === 'payout' ? 'олголт' : 'буцаалт'}</small>`;
      if (!t.approved_at) {
        // Two people, not one: releasing the money and sending it are different
        // hands, so the row only ever offers the half that is this member's.
        return button(
          'Батлах',
          () =>
            confirmPopup({
              title: t.kind === 'payout' ? 'Олголт батлах' : 'Буцаалт батлах',
              text: `${line}<br><br>Батласны дараа шилжүүлэхийг өөр гишүүн хийнэ.`,
              ok: 'Батлах',
              onConfirm: async () => {
                await ops(`/v1/ops/settlements/${t.id}/approve`, { method: 'POST', body: {} });
                toast('Батлагдлаа. Одоо өөр гишүүн шилжүүлж тэмдэглэнэ.', 'good');
                await refresh();
              },
            }),
          'data-v="primary" data-size="sm" data-a="approve"',
        );
      }
      return button(
        'Шилжүүлсэн',
        () =>
          confirmPopup({
            title: 'Шилжүүлсэн гэж тэмдэглэх',
            text: `${line}<br><br>Basu-гийн банкаар шилжүүлсний дараа тэмдэглэнэ. ${t.kind === 'payout' ? 'Нийлүүлэгч' : 'Зочин'}д мэдэгдэл очно.`,
            ok: 'Шилжүүлсэн',
            reason: { label: 'Банкны гүйлгээний дугаар', type: 'text', placeholder: 'Заавал биш' },
            onConfirm: async (reference) => {
              await ops(`/v1/ops/settlements/${t.id}/paid`, { method: 'POST', body: { reference } });
              toast('Тэмдэглэгдлээ, мэдэгдэл явлаа.', 'good');
              await refresh();
            },
          }),
        'data-v="primary" data-size="sm" data-a="paid"',
      );
    },
    sort: { key: 'created_at', desc: true },
    rowAttrs: (t) => ({ 'data-kind': t.kind, 'data-settlement': t.id, 'data-paid': t.state === 'paid' }),
    noun: 'мөр',
    empty: { title: 'Шилжүүлэх зүйл алга', text: 'Хүлээлгэн өгсөн захиалгын олголт, цуцлагдсан захиалгын буцаалт энд гарна.' },
    stateKey: withFilters ? 'basu.dt.pay' : null,
    rows,
  });
}

        value: (p) => p.name,
        render: (p) => dtCell.twoHtml(`<span class="pill" data-tone="${p.tier === 'vip' ? 'hi' : 'accent'}" data-strong>${p.tier === 'vip' ? '★ VIP' : 'Онцгой'}</span>`, `${p.days} хоног`),

      { key: 'ends_at', label: 'Хүртэл', render: (p) => (p.ends_at ? dtCell.when(p.ends_at) : dtCell.none()) },
      {
        key: 'standing',
        label: 'Төлөв',
        value: (p) => PROMO_STANDING[p.standing]?.[1] ?? p.standing,
        render: (p) => {
          const [tone, word] = PROMO_STANDING[p.standing] ?? [p.standing, p.standing];

    search: { placeholder: 'Зар, нийлүүлэгч, худалдан авагч…' },
    filters: [
      {

        label: 'Төлөв',
        kind: 'seg',
        options: [['', 'Бүгд'], ['live', 'Идэвхтэй'], ['pending', 'Төлбөр хүлээж буй'], ['over', 'Дууссан']],
        test: (p, v) => !v || p.standing === v,
      },
      { key: 'tier', label: 'Зэрэглэл', kind: 'select', options: [['', 'Бүх зэрэглэл'], ['vip', 'VIP'], ['featured', 'Онцгой']], test: (p, v) => !v || p.tier === v },
    ],
    actions: (p) => {
      if (!manages || !['live', 'pending'].includes(p.standing)) return null;
      return button(
        p.standing === 'pending' ? 'Цуцлах' : 'Зогсоох',
        () =>
          confirmPopup({
            title: p.standing === 'pending' ? 'Нэхэмжлэхийг цуцлах' : 'Онцлолтыг зогсоох',
            text: `<b>${esc(p.listing_title)}</b> (${esc(p.supplier_name)}) — ${p.tier === 'vip' ? 'VIP' : 'Онцгой'}. ${

            }`,
            ok: p.standing === 'pending' ? 'Цуцлах' : 'Зогсоох',

    );
    table.setRows(promotions);
  } catch (error) {
    toast(error.message, 'bad');
    table.setRows([]);
  }
}

    <div class="card kpi"><div class="lab">Шилжүүлэх ёстой</div><b>${money(due.reduce((s, t) => s + t.amount_mnt, 0))}</b><span>${due.length} мөр, данс бэлэн</span></div>

  view.append(
    headActs(
      head('Гишүүд', 'Хэн энэ хуудсанд орж, юу хийж болох вэ. Basu-д бүртгэлтэй хэрэглэгчдээс сонгож эрх олгоно.'),
      button(
        `${NAV_ICON.plus}Гишүүн нэмэх`,
        () =>
          popup({
            title: 'Гишүүн нэмэх',
            sub: 'Basu-д бүртгэлтэй хэрэглэгчдээс сонгоод эрх олгоно. Тэр dashboard-аа нээхэд ops хэсэг нь шууд нээгдэнэ.',
            width: 600,
            id: 'member-new',
            fields: [
              {
                type: 'pick',
                name: 'guest_id',
                label: 'Хэрэглэгч',
                placeholder: 'Нэр, утас, имэйлээр хайх…',
                empty: 'Ийм хэрэглэгч олдсонгүй. Хүн эхлээд Basu-д нэвтэрсэн байх ёстой.',
                search: async (q) =>
                  (await ops(`/v1/ops/people?q=${encodeURIComponent(q)}`)).people.map((p) => ({
                    value: p.id,
                    title: p.name || p.email || p.phone || 'Нэргүй',
                    sub: [p.phone, p.email].filter(Boolean).join(' · '),
                    note: p.member ? (p.member.active ? `Гишүүн · ${roleNames.get(p.member.role) ?? p.member.role}` : 'Хаасан гишүүн') : '',
                    // Somebody at the desk already has a seat to change in the table, not a second one.
                    disabled: Boolean(p.member?.active),
                  })),
              },
              { name: 'role', label: 'Олгох эрх', type: 'select', options: roleOptions, value: 'ops', wide: true },
            ],
            submit: 'Эрх олгох',
            onSubmit: async (v) => {
              if (!v.guest_id) throw new Error('Хэрэглэгчээ жагсаалтаас сонгоно уу.');
              const added = await ops('/v1/ops/members', { method: 'POST', body: { guest_id: v.guest_id, role: v.role } });
              toast(`${added.name}: ${roleNames.get(added.role) ?? added.role} эрх олголоо.`, 'good');
              show('members');
            },
          }),
        'data-v="primary" id="add-member"',
      ),
    ),
  );
  const memberState = (m) => (!m.active ? ['off', 'хаасан'] : m.joined ? ['contracted', 'идэвхтэй'] : ['applied', 'ороогүй']);
  const table = dataTable({
    columns: [
      { key: 'name', label: 'Нэр', render: (m) => `<b>${esc(m.name)}</b>${m.id === me?.id ? ' <small class="muted">(та)</small>' : ''}` },
      {
        key: 'contact',
        label: 'Утас, имэйл',
        value: (m) => `${m.phone ?? ''} ${m.email ?? ''}`,
        render: (m) => dtCell.twoHtml(m.phone ? `<span class="mono">${esc(m.phone)}</span>` : esc(m.email ?? '—'), m.phone && m.email ? esc(m.email) : ''),
      },
      { key: 'role', label: 'Эрх', value: (m) => roleNames.get(m.role) ?? m.role },
      { key: 'state', label: 'Төлөв', value: (m) => memberState(m)[1], render: (m) => dtCell.pill(...memberState(m)) },
    ],
    search: { placeholder: 'Нэр, утас, имэйл…' },
    actions: (m) => {
      // Your own seat is another admin's to change.
      if (m.id === me?.id) return null;
      return [
        button(
          'Эрх солих',
          () =>
            popup({
              title: 'Эрх солих',
              sub: `${esc(m.name)} · ${esc(m.email ?? m.phone ?? '')}`,
              width: 520,
              fields: [{ name: 'role', label: 'Эрх', type: 'select', options: roleOptions, value: m.role, wide: true }],
              onSubmit: async (v) => {
                if (v.role === m.role) return true;
                await ops(`/v1/ops/members/${m.id}/role`, { method: 'POST', body: { role: v.role } });
                toast(`${m.name}: ${roleNames.get(v.role) ?? v.role} эрхтэй боллоо.`, 'good');
                show('members');
              },
            }),
          'data-v="quiet" data-size="sm" data-a="role"',
        ),
        button(
          m.active ? 'Хаах' : 'Нээх',
          () =>
            confirmPopup({
              title: m.active ? 'Гишүүнийг хаах' : 'Гишүүнийг нээх',
              // Off closes the desk to them at once, and only the desk: an open dashboard drops to their own
              // corner at its next step, and their account and sign-ins are theirs.
              text: m.active
                ? `<b>${esc(m.name)}</b> ops-ийн хэсэгт шууд орохоо болино — нээлттэй байгаа ops хэсэг нь ч дараагийн алхамд хаагдана. Бүртгэл нь хэвээр, Basu-гийн вэб, апп-д нэвтэрсэн хэвээр үлдэнэ. Дараа нь дахин нээж болно.`
                : `<b>${esc(m.name)}</b> ${esc(roleNames.get(m.role) ?? m.role)} эрхээрээ дахин орно.`,
              ok: m.active ? 'Хаах' : 'Нээх',
              danger: m.active,
              onConfirm: async () => {
                await ops(`/v1/ops/members/${m.id}/active`, { method: 'POST', body: { active: !m.active } });
                toast(m.active ? `${m.name} хаагдлаа.` : `${m.name} нээгдлээ.`, 'good');
                show('members');
              },
            }),
          'data-v="quiet" data-size="sm" data-a="active"',
        ),
      ];
    },
    sort: { key: 'name' },
    rowAttrs: (m) => ({ 'data-member': m.id, 'data-off': !m.active }),
    noun: 'гишүүн',
    empty: { title: 'Гишүүн алга', text: '«Гишүүн нэмэх» товчоор хэрэглэгчдээс сонгож нэмнэ.' },
  });
  table.el.id = 'members';
  const section = el('<section class="section"></section>');
  section.append(table.el);
  view.append(section);
  try {
    table.setRows((await ops('/v1/ops/members')).members);
  } catch (error) {
    toast(error.message, 'bad');
    table.setRows([]);
  }
  // What each role opens, before a role is handed to anybody: made and changed on the roles page.
  if (hasPage('roles')) {
    const go = el('<p class="cap" style="margin-top:20px" id="desk-roles">Үүрэг бүр ямар хуудас, үйлдэл нээхийг <a class="link" href="#desk/roles">«Үүрэг, эрх»</a> хуудсанд үүсгэж, засна.</p>');
    go.querySelector('a').addEventListener('click', (e) => {
      e.preventDefault();
      show('roles');
    });
    view.append(go);
    return;
  }
  try {
    const matrix = await ops('/v1/access/roles?scope=desk');
    if (tab !== 'members') return;
    const roles = matrixTable(matrix);
    roles.prepend(el('<h2 class="section-label">Эрх бүр юу хийдэг</h2>'));
    roles.id = 'desk-roles';
    view.append(roles);
  } catch {
    /* the page stands without the table */
  }
}

/* ── boot ─────────────────────────────────────────────────────────── */

/** The session this page last drew — to notice when the browser has moved on to somebody else. */
let bootedAs = null;

/**
 * Signed in or not; and if so, where this person works. The server says
 * which places and which pages; the page opens the one the address names,
 * or the one used last.
 */
async function boot() {
  root.replaceChildren();
  // A sign-in that just came back from Google is already this browser's person (api.js, authReturn).
  bootedAs = token();
  if (!bootedAs) {
    access = ws = nav = me = null;
    showToken();
    return;
  }
  try {
    access = await ops('/v1/access');
  } catch (error) {
    if (error.status === 401 || error.status === 503) return signedOut(error);
    toast(error.message, 'bad');
    return;
  }
  // Somebody is signed in and the server took it: whatever the door last said is past.
  doorWhy = null;
  const { w, page } = choose(location.hash);
  open(w, page);
}

// Another tab signed somebody else in, or signed out; or the back button
// brought this page out of the cache after that. This one follows, rather
// than keep drawing a person the browser no longer holds.
addEventListener('storage', (event) => {
  if ((event.key === 'basu.guest' || event.key === null) && token() !== bootedAs) void boot();
});
addEventListener('pageshow', (event) => {
  if (event.persisted && token() !== bootedAs) void boot();
});

// A link from the supplier's screen, or the back button: the address names another place or page.
addEventListener('hashchange', () => {
  if (!access) return;
  const { w, page } = choose(location.hash);
  if (w && (w.id !== ws?.id || (page && page !== tab))) open(w, page);
});

boot();
</script>
