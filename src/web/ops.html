<!doctype html>
<html lang="mn" data-theme="light" data-desk data-session="desk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9EBEC">
<title>Dashboard — Basu</title>
<link rel="stylesheet" href="/app.css">
<style>
/* ── The desk ──────────────────────────────────────────────────────
   Two or three people, all day, at a computer. Tokens, type, buttons,
   chips, cards, rows, tables and the sidebar all come from /app.css;
   what is left here is where things sit. */
p{margin:0}

/* the door */
.door{min-height:100dvh;display:grid;place-items:center;padding:var(--s-6) var(--gutter)}
.pair{width:100%;max-width:420px;padding:28px}
.pair .brand{margin-bottom:20px}
.pair h2{margin-bottom:6px}
.pair p{color:var(--ink-2);margin-bottom:20px}
.pair .input{margin-bottom:10px}

/* the frame */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100dvh}
.main{min-width:0}
.page{max-width:var(--col-desk);margin:0 auto;padding:var(--s-7) var(--gutter) 64px}
.page > .back{margin-bottom:4px}
.page-head + .section{margin-top:0}
/* the front room: a person's own page, before and beside the desk */
.front{max-width:760px;margin:0 auto;padding:28px var(--gutter) 56px}
.front-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:8px}
.front-head .who{font-size:var(--t-cap);color:var(--ink-2);margin-top:4px}
.front .section{margin-top:28px}
.org-row{cursor:pointer}
.org-row .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.org-form .checks{display:flex;gap:20px;margin:0 0 16px}
.org-form .checks label{display:flex;align-items:center;gap:8px;font-size:var(--t-body-lg)}
.add-member{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.add-member .input{width:auto;flex:1 1 220px}
.add-member [data-found]{flex-basis:100%;font-size:var(--t-body)}
.back-link{margin-bottom:12px}
/* an ask for a seat: who, why, and the answer on one line under it */
.request .main{flex:1;min-width:0}
.request .who-contact{font-weight:400;font-size:var(--t-cap);color:var(--ink-2);margin-left:6px}
.request .cap{margin:2px 0 0}
.req-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.req-actions .input{width:auto;min-width:0;height:var(--h-sm);min-height:var(--h-sm);font-size:var(--t-cap)}
.req-actions select.input{width:240px}
.req-actions [name="reason"]{width:200px}
.req-actions .btn{min-height:var(--h-sm);font-size:var(--t-cap)}
.req-actions .gap{width:12px}
.pair-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0 16px;align-items:start}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:sticky;top:0;z-index:var(--z-bar);height:auto;width:auto;min-width:0;max-width:100%;flex-direction:row;align-items:center;gap:8px;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .sidebar .brand{padding:0 8px 0 4px;flex:none}
  .sidebar .brand span{display:none}
  .sidebar > nav.tabs{flex-direction:row;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;gap:2px}
  .sidebar > nav.tabs::-webkit-scrollbar{display:none}
  .sidebar .grp{display:none}
  .sidebar .tabs button[data-tab]{width:auto;flex:none;padding:0 10px}
  .sidebar .me{display:none}
  .sidebar .out{margin:0;width:auto;flex:none}
  .page{padding:var(--s-5) var(--s-5) var(--s-8)}
}

/* toolbars, tables, KPI rows */
.card > .tools{padding:14px 20px;border-bottom:1px solid var(--line)}
.tools > .input{width:auto;min-width:0;flex:none}
.tools > .input.search{flex:1 1 220px}
.tools > [data-end]{margin-left:auto}
.card > .table-wrap{border-radius:inherit}
.card-foot{padding:12px 20px;border-top:1px solid var(--line)}
.table:has(tr[data-link]) th:last-child{padding-right:32px}
.table td.end{text-align:right}
.run-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
/* Until app.css scopes `.kpi-band .kpi span` to `> span`: money() inside a
   KPI value keeps the value's size, weight and tone instead of the caption's. */
.kpi-band .kpi b span{display:inline;font-size:inherit;color:inherit;line-height:inherit}
.kpi-band .kpi b .cur{font-size:.65em;font-weight:500}

/* rows: suppliers, kitchens, settlements — hairline rows in one container */
.rows[data-rows]{overflow:visible}
/* a list with nothing in it is a hairline and one line, not a boxed card */
.rows[data-rows]:has(> .empty:only-child){background:none;border:0;border-radius:0;box-shadow:none}
.rows[data-rows] > .empty:only-child{border-top:1px solid var(--line);padding-left:0;padding-right:0}
.rows[data-rows] > .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:14px 20px}
.row .name{font-size:var(--t-row);font-weight:600;line-height:var(--lh-snug);min-width:0}
.row .name .pill{margin-left:6px}
.row .name small{display:block;font-size:var(--t-cap);font-weight:400;line-height:1.5;color:var(--ink-2);margin-top:3px}
.row .right{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.row .btns{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.row .amount{font-size:var(--t-title-3)}
.row[data-paid] .name{color:var(--ink-2)}
.row[data-paid] .amount .money{color:var(--ink-3)}
.row .about{grid-column:1 / -1;font-size:var(--t-cap);line-height:1.5;color:var(--ink-2)}
.row .about b{font-weight:500;color:var(--ink)}
.row .drawer{grid-column:1 / -1;padding-top:12px;border-top:1px solid var(--line)}
.row .drawer .table th:first-child,.row .drawer .table td:first-child{padding-left:0}
.row .drawer .table th:last-child,.row .drawer .table td:last-child{padding-right:0}
.row .code{grid-column:1 / -1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r-ctl);background:var(--ready-soft);border:1px solid var(--ready-line);color:var(--ready);font-size:var(--t-cap)}
.row .code b{font-size:var(--t-title-3);font-weight:600;letter-spacing:.12em;color:inherit}
.stall-line{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:var(--t-body)}
.stall-line + .stall-line{border-top:1px solid var(--line)}
.stall-line span{flex:1}
.stall-line[data-off]{color:var(--ink-3)}
.sess-list{margin-top:8px}
.sess{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:var(--t-body)}
.sess small{display:block;font-size:var(--t-cap);color:var(--ink-3)}
@media (max-width:720px){
  .rows[data-rows] > .row{grid-template-columns:1fr}
  .row .right,.row .btns{justify-content:flex-start}
  /* a wide table scrolls inside its wrap instead of squeezing every cell */
  .table:has(th:nth-child(4)){min-width:640px}
  .table:has(th:nth-child(4)) td:first-child,.table:has(th:nth-child(4)) .sub{white-space:nowrap}
  .tools > .input,.tools > .seg{flex:1 1 100%;width:100%}
}

/* the overflow menu: every action stays in the DOM, one is in view */
.more{position:relative;display:inline-flex}
.more > summary{list-style:none}
.more > summary::-webkit-details-marker{display:none}
.more > summary svg{fill:currentColor;stroke:none}
.more > .menu{position:absolute;right:0;top:calc(100% + 4px);z-index:var(--z-bar);min-width:220px;display:flex;flex-direction:column;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-ctl);box-shadow:var(--shadow-float)}
.more > .menu .btn{width:100%;justify-content:flex-start}
.more > .menu .btn.ink-stop{color:var(--stop)}

/* one order, one guest */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1000px){.detail{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px 20px;padding:20px;font-size:var(--t-body);line-height:1.45;color:var(--ink-2)}
.facts .lab{display:block;margin-bottom:4px}
.facts b{font-size:var(--t-row);font-weight:600;color:var(--ink)}
a.tel{display:inline-flex;align-items:center;gap:4px;color:var(--ink);font-weight:500}
a.tel svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;flex-direction:column;gap:10px}
.acts .hint{font-size:var(--t-cap);line-height:1.45;color:var(--ink-3)}
.acts .sep{height:1px;background:var(--line);margin:4px 0}
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{width:14px;height:14px;fill:var(--star)}
.stars svg[data-off]{fill:var(--line-2)}

/* the log: who, what, when */
.log li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 20px;font-size:var(--t-body)}
.log li.empty{display:block}
.log .who{font-weight:500;color:var(--ink-2);white-space:nowrap}
.log .when{white-space:nowrap;text-align:right}
.log small{display:block;font-size:var(--t-cap);line-height:1.4;color:var(--ink-2)}
.log .when .pill{margin-top:4px}

/* one toned word inside a sentence */
.ink-stop{color:var(--stop)}
.ink-hold{color:var(--hold)}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { api, store, toast, mnt, money, KIND, HEADLINE, dayLabel, signInDoors, authReturn } from '/api.js';

const root = document.getElementById('root');
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
const esc = (value) => {
  const node = document.createElement('span');
  node.textContent = value ?? '';
  return node.innerHTML;
};
const when = (iso) => (iso ? dayLabel(iso.slice(0, 10)) : '—');
const clockOf = (iso) => {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
};
/** A date with its time, as one mono run: the table's "өнөөдөр 11:16". */
const stamp = (iso) => `<span class="mono">${when(iso)} ${clockOf(iso)}</span>`;
const CHEV = '<svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>';
const PHONE = '<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';
const STAR = '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>';
const tel = (phone) => `<a class="tel mono" href="tel:${esc(phone)}">${PHONE}${esc(phone)}</a>`;
/** Three rows of the shape that is coming, while it loads. */
const busy = () => el(`<div role="status" aria-busy="true">${'<div class="skel-row"><span class="skel"></span><span class="skel-lines"><span class="skel"></span><span class="skel"></span></span><span class="skel"></span></div>'.repeat(3)}</div>`);
/** The rest of a row's actions, folded behind one button; every button stays in the DOM. */
const more = () => el('<details class="more"><summary class="btn" data-size="sm" data-icon aria-label="Бусад үйлдэл"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></summary><div class="menu"></div></details>');
document.addEventListener('click', (e) => {
  for (const d of document.querySelectorAll('details.more[open]')) {
    if (!d.contains(e.target) || e.target.closest('.menu button')) d.open = false;
  }
});
/** The dot's tone on the story: red for a cancellation, blue for on the road, green for handed over. */
const STORY_K = {
  CANCELLED: 'stop', REFUNDED: 'stop', REFUND_DUE: 'stop', HELD: 'stop', HELD_BY_KITCHEN: 'stop', REJECTED: 'stop', NO_SHOW: 'stop',
  DISPATCHED: 'route', RESLOTTED: 'route', RESENT: 'route', PAID: 'route',
  HANDED: 'ready', CLOSED: 'ready', SERVED: 'ready', READY: 'ready',
};
const step = (type, title, sub, at) =>
  `<li data-done${STORY_K[type] ? ` data-k="${STORY_K[type]}"` : ''}><span class="w">${title}<span class="s">${sub}</span></span><span class="t">${when(at)} ${clockOf(at)}</span></li>`;
const STATE = { applied: 'хүлээгдэж байна', contracted: 'гэрээт', declined: 'татгалзсан' };
const ROLE_WORD = { admin: 'админ', finance: 'санхүү', ops: 'ops', viewer: 'зөвхөн харах' };
const STATE_WORD = {
  PAID: 'Төлсөн', PREPARING: 'Бэлтгэж байна', READY: 'Бэлэн', DISPATCHED: 'Замд',
  HANDED: 'Өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан', REFUNDED: 'Буцаасан',
};
const EVENT_WORD = {
  CREATED: 'Үүссэн', PAID: 'Төлсөн', PREPARING: 'Бэлтгэж эхэлсэн', READY: 'Бэлэн болсон', DISPATCHED: 'Замд гарсан',
  HANDED: 'Хүлээлгэн өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан', REFUND_DUE: 'Буцаалт үүссэн', REFUNDED: 'Буцаалт шилжүүлсэн', RESENT: 'Мэдэгдэл дахин илгээсэн',
};
const REASON = {
  guest_asked: 'Зочин хүссэн', vet: 'Мал эмнэлгийн шалгалт', cannot_fulfil: 'Нийлүүлэгч биелүүлж чадахгүй',
  no_show: 'Зочин ирээгүй', unreachable: 'Хаяг дээр холбогдоогүй', draft_expired: 'Төлөгдөөгүй',
};
const actorWord = (a) =>
  a.startsWith('guest:') ? 'зочин' : a.startsWith('supplier:owner:') ? 'нийлүүлэгч (утас)' : a.startsWith('supplier:') ? 'нийлүүлэгчийн дэлгэц' : a.startsWith('ops') ? a.replace('ops:', 'ops · ') : 'систем';
const ICON = {
  notify: '<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  system: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M7 10l2 2 2-2 2 2 2-2"/></svg>',
  money: '<svg viewBox="0 0 24 24"><path d="M4 7h16v11H4z"/><path d="M4 11h16M8 7V5h8v2"/><circle cx="12" cy="14.5" r="1.6"/></svg>',
  venues: '<svg viewBox="0 0 24 24"><path d="M4 10l1.5-5h13L20 10"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  lunches: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/></svg>',
  reviews: '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>',
  guests: '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.9-3.8 3.5-5.6 7-5.6s6.1 1.8 7 5.6"/></svg>',
  overview: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
  stats: '<svg viewBox="0 0 24 24"><path d="M4 19h16M7 16V9M12 16V5M17 16v-6"/></svg>',
  orders: '<svg viewBox="0 0 24 24"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h4"/></svg>',
  suppliers: '<svg viewBox="0 0 24 24"><path d="M4 9l1.5-4h13L20 9"/><path d="M4 9c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3"/><path d="M6 12v8h12v-8"/></svg>',
  pay: '<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M15.5 15h2"/></svg>',
  audit: '<svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>',
  members: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 20c.8-3.2 3-4.8 6-4.8s5.2 1.6 6 4.8"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.5 15.2c2.6.2 4.4 1.6 5 4.8"/></svg>',
};

/* ── the door ─────────────────────────────────────────────────────── */

async function showToken() {
  root.replaceChildren();
  // The demo hands its secret out; anywhere else a member signs in by phone.
  const demo = await api('/dev/ops-token').catch(() => null);
  const door = el('<div class="door"></div>');
  if (demo?.token) {
    const card = el(`
      <div class="card pair">
        <div class="brand wordmark">Basu<small>Ops</small></div>
        <h2>Демо горим</h2>
        <p>Нууц үг автоматаар орлоо. Нэвтрэхэд л болно.</p>
        <input class="input" type="password" placeholder="OPS_TOKEN" aria-label="Ops нууц" autocomplete="off">
        <button class="btn" data-v="primary" data-size="lg" type="button">Нэвтрэх</button>
      </div>`);
    const input = card.querySelector('input');
    input.value = demo.token;
    const submit = async () => {
      store.opsToken = input.value.trim();
      try {
        ({ member: me } = await api('/v1/ops/me', { token: store.opsToken }));
        boot();
      } catch (error) {
        store.opsToken = null;
        toast(error.message, 'bad');
      }
    };
    card.querySelector('button').addEventListener('click', submit);
    input.addEventListener('keydown', (e) => e.key === 'Enter' && submit());
    door.append(card);
    root.append(door);
    return;
  }
  const card = el(`
    <div class="card pair">
      <div class="brand wordmark">Basu<small>Ops</small></div>
      <h2 id="door-title">Нэвтрэх</h2>
      <p id="door-lead">Утас, нууц үгээрээ нэвтэрнэ үү. Гишүүн биш бол нэвтэрсний дараа эрх хүсэж болно.</p>
      <div data-doors></div>
      <div class="or" data-phone-or hidden>эсвэл утас, нууц үгээр</div>
      <input class="input" name="invite" inputmode="numeric" placeholder="Урилгын код · 12345 67890" aria-label="Урилгын код" autocomplete="one-time-code" hidden>
      <input class="input" name="name" placeholder="Таны нэр" aria-label="Нэр" autocomplete="name" hidden>
      <input class="input" name="phone" type="tel" inputmode="tel" placeholder="+976 XXXX XXXX" aria-label="Утас" autocomplete="tel">
      <input class="input" name="password" type="password" placeholder="Нууц үг" aria-label="Нууц үг" autocomplete="current-password">
      <button class="btn" data-v="primary" data-size="lg" type="button" id="send">Нэвтрэх</button>
      <button class="btn" data-v="link" type="button" id="use-invite">Урилгын код байгаа юу?</button>
    </div>`);
  // Google and a code by email, above the desk's own phone door. The desk
  // keeps its session under its own key, so the block hands the token here.
  const doors = signInDoors({
    device: 'Ops',
    returnTo: '/dashboard',
    onToken: enterDesk,
    keep: false,
    phone: false,
    emailHint: 'Гишүүнээр бүртгэгдсэн имэйл рүү 6 оронтой код илгээнэ.',
  });
  card.querySelector('[data-doors]').replaceWith(doors);
  // Say only the ways that are really on the card.
  let everyday = 'Утас, нууц үгээрээ нэвтэрнэ үү. Гишүүн биш бол нэвтэрсний дараа эрх хүсэж болно.';
  doors.ready.then((open) => {
    const others = open.google || open.email;
    const ways = [open.google && 'Google', open.email && 'имэйл'].filter(Boolean);
    if (ways.length) everyday = `${ways.join(', ')} эсвэл утас, нууц үгээрээ нэвтэрнэ үү. Гишүүн биш бол нэвтэрсний дараа эрх хүсэж болно.`;
    if (!claiming) card.querySelector('#door-lead').textContent = everyday;
    card.querySelector('[data-phone-or]').hidden = !others;
    // One primary on the card: with Google or email above, the phone is the quieter way.
    if (others) card.querySelector('#send').removeAttribute('data-v');
  });
  const phone = card.querySelector('[name="phone"]');
  const code = card.querySelector('[name="password"]');
  const invite = card.querySelector('[name="invite"]');
  const who = card.querySelector('[name="name"]');
  const send = card.querySelector('#send');
  // A person the desk has invited redeems the code once, with their own
  // number and the password they choose; after that the ordinary door.
  let claiming = false;
  card.querySelector('#use-invite').addEventListener('click', (e) => {
    claiming = !claiming;
    invite.hidden = !claiming;
    who.hidden = !claiming;
    code.setAttribute('autocomplete', claiming ? 'new-password' : 'current-password');
    code.placeholder = claiming ? 'Шинэ нууц үг · дор хаяж 8 тэмдэгт' : 'Нууц үг';
    card.querySelector('#door-title').textContent = claiming ? 'Урилгаар нэвтрэх' : 'Нэвтрэх';
    card.querySelector('#door-lead').textContent = claiming
      ? 'Админаас авсан кодоо, өөрийн утас, шинэ нууц үгээ оруулна. Код нэг удаа хүчинтэй.'
      : everyday;
    send.textContent = claiming ? 'Нэвтрэх' : 'Нэвтрэх';
    e.target.textContent = claiming ? 'Нууц үгтэй юу? Энгийнээр нэвтрэх' : 'Урилгын код байгаа юу?';
    (claiming ? invite : phone).focus();
  });
  const submit = async () => {
    try {
      const number = phone.value.replace(/\s+/g, '');
      const { token: t } = claiming
        ? await api('/v1/auth/claim', {
            method: 'POST',
            body: { code: invite.value, phone: number, password: code.value, name: who.value, device: 'Ops' },
          })
        : await api('/v1/auth/login', {
            method: 'POST',
            body: { phone: number, password: code.value, device: 'Ops' },
          });
      enterDesk(t);
    } catch (error) {
      toast(error.message, 'bad');
    }
  };
  send.addEventListener('click', submit);
  for (const input of [code, phone, invite, who]) input.addEventListener('keydown', (e) => e.key === 'Enter' && submit());
  door.append(card);
  root.append(door);
}

/**
 * A session from any door — Google, a code by email, the phone — comes in.
 * What it sees is the server's to say: a member gets the desk, anybody else
 * the front room, with their profile and the way to ask for a seat.
 */
function enterDesk(t) {
  store.opsToken = t;
  boot();
}

/* ── the front room: signed in, not seated ─────────────────────────── */

const ROLE_ASK = [
  ['ops', 'ops — захиалга, нийлүүлэгч'],
  ['finance', 'санхүү — олголт, буцаалт, данс'],
  ['viewer', 'зөвхөн харах'],
  ['admin', 'админ — бүгд, гишүүд'],
];
let frontPoll;

/**
 * Who you are, and your seat at the desk: asked for, waiting, or said no
 * to. While a request waits the page keeps asking, so the yes opens the
 * desk without anybody reloading anything.
 */
function showFrontRoom({ account, request }) {
  clearInterval(frontPoll);
  const name = account.name ?? request?.name ?? '';
  const contact = account.email ?? account.phone ?? '';
  const page = el(`
    <div class="front">
      <div class="front-head">
        <div><div class="brand wordmark">Basu</div><div class="who"><span data-name>${name ? `${esc(name)} · ` : ''}</span>${esc(contact)} <button class="btn" data-v="link" type="button" data-rename>${name ? 'Нэр засах' : 'Нэрээ бичих'}</button></div></div>
        <button class="btn" data-v="quiet" type="button" id="front-out">Гарах</button>
      </div>
      <div id="front-orgs"></div>
      <section class="section"><h2 class="section-label">Basu-гийн ops эрх</h2>
        <div class="card"><div class="card-body" id="front">
          <p class="cap" style="margin:0 0 14px">Basu-гийн ажилтан бол ops-ийн хэсэгт орох эрх хүснэ үү — админ зөвшөөрөхөд шууд нээгдэнэ.</p>
          <div data-state></div>
          <div data-form></div>
        </div></div>
      </section>
    </div>`);
  const card = page;
  const state = card.querySelector('[data-state]');
  const slot = card.querySelector('[data-form]');

  const form = (asked) => {
    const f = el(`
      <div>
        <input class="input" name="name" placeholder="Таны нэр" aria-label="Нэр" autocomplete="name">
        <select class="input" name="role" aria-label="Хүсэх эрх">${ROLE_ASK.map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>
        <textarea class="input" name="note" rows="3" placeholder="Та хэн бэ, юунд хэрэгтэй вэ (заавал биш)" aria-label="Тайлбар"></textarea>
        <button class="btn" data-size="lg" type="button" id="ask" style="width:100%">${asked ? 'Хүсэлтээ шинэчлэх' : 'Эрх хүсэх'}</button>
      </div>`);
    f.querySelector('[name="name"]').value = asked?.name ?? name;
    f.querySelector('[name="role"]').value = asked?.role ?? 'ops';
    f.querySelector('[name="note"]').value = asked?.note ?? '';
    f.querySelector('#ask').addEventListener('click', async (e) => {
      const v = (n) => f.querySelector(`[name="${n}"]`).value.trim();
      e.target.setAttribute('data-busy', '');
      try {
        await ops('/v1/ops/requests', { method: 'POST', body: { name: v('name'), role: v('role'), note: v('note') } });
        toast('Хүсэлт илгээгдлээ.');
        boot();
      } catch (error) {
        toast(error.message, 'bad');
      } finally {
        e.target.removeAttribute('data-busy');
      }
    });
    return f;
  };

  if (request?.state === 'pending') {
    const role = ROLE_ASK.find(([k]) => k === request.role)?.[1] ?? request.role;
    state.append(el(`
      <div class="callout" data-k="ok" style="margin-bottom:16px">
        <b>Хүсэлт хүлээгдэж байна</b>
        <span>Хүссэн эрх: ${esc(role)} · ${when(request.created_at)} ${clockOf(request.created_at)}. Админ зөвшөөрмөгц энэ хуудас өөрөө нээгдэнэ.</span>
      </div>`));
    const change = el('<button class="btn" type="button" data-size="lg" style="width:100%">Хүсэлтээ өөрчлөх</button>');
    change.addEventListener('click', () => {
      change.remove();
      slot.replaceChildren(form(request));
    });
    slot.append(change);
    // Keep asking while it waits: the yes opens the desk on its own.
    frontPoll = setInterval(async () => {
      if (document.hidden) return;
      try {
        const now = await ops('/v1/ops/whoami');
        if (now.member || now.request?.state !== 'pending') {
          clearInterval(frontPoll);
          boot();
        }
      } catch {
        clearInterval(frontPoll);
      }
    }, 10_000);
  } else {
    if (request?.state !== 'declined') {
      // Most people here run a business; asking for Basu's own desk is the rarer thing, one tap away.
      const open = el('<button class="btn" type="button">Ops эрх хүсэх</button>');
      open.addEventListener('click', () => {
        open.remove();
        slot.append(form(null));
      });
      slot.append(open);
    }
    if (request?.state === 'declined') {
      state.append(el(`
        <div class="callout" data-k="warn" style="margin-bottom:16px">
          <b>Хүсэлтийг татгалзсан</b>
          <span>${request.decline_reason ? `Шалтгаан: ${esc(request.decline_reason)}. ` : ''}Дахин хүсэж болно.</span>
        </div>`));
      slot.append(form(null));
    }
  }
  card.querySelector('#front-out').addEventListener('click', () => {
    clearInterval(frontPoll);
    store.opsToken = null;
    me = null;
    showToken();
  });
  card.querySelector('[data-rename]').addEventListener('click', (e) => {
    const box = el(`<span class="add-member" style="display:inline-flex;margin-top:6px"><input class="input" name="display_name" placeholder="Таны нэр" style="width:220px"><button class="btn" data-v="primary" data-size="sm" type="button">Хадгалах</button></span>`);
    box.querySelector('input').value = name;
    const save = async () => {
      try {
        await ops('/v1/me', { method: 'PATCH', body: { display_name: box.querySelector('input').value.trim() } });
        toast('Нэр хадгалагдлаа.', 'good');
        boot();
      } catch (error) {
        toast(error.message, 'bad');
      }
    };
    box.querySelector('button').addEventListener('click', save);
    box.querySelector('input').addEventListener('keydown', (ev) => ev.key === 'Enter' && save());
    e.target.replaceWith(box);
    box.querySelector('input').focus();
  });
  root.replaceChildren(card);
  void renderMyOrgs(card.querySelector('#front-orgs'));
}

/* ── a person's businesses ─────────────────────────────────────────── */

const ORG_ROLE_WORD = { owner: 'эзэн', manager: 'менежер', staff: 'ажилтан', accountant: 'нягтлан' };
const ORG_STATE = { applied: ['applied', 'хүлээгдэж байна'], active: ['contracted', 'идэвхтэй'], declined: ['off', 'татгалзсан'], suspended: ['off', 'түр хаасан'] };
const kinds = (o) => [o.restaurant && 'Ресторан', o.supplier && 'Нийлүүлэгч'].filter(Boolean);

/**
 * The businesses this person is part of, and the way to register one. Used
 * in the front room and, for somebody at the desk, under «Миний байгууллага».
 */
async function renderMyOrgs(box) {
  box.replaceChildren();
  let orgs;
  try {
    ({ orgs } = await ops('/v1/orgs/mine'));
  } catch (error) {
    box.append(el(`<p class="empty">${esc(error.message)}</p>`));
    return;
  }
  const section = el(`
    <section class="section"><h2 class="section-label">Миний байгууллага</h2>
      <div class="card" data-rows id="org-list"></div>
      <div class="form-foot" style="justify-content:flex-start;margin-top:12px"><button class="btn" data-v="primary" type="button" id="org-new">Байгууллага бүртгүүлэх</button></div>
    </section>`);
  const list = section.querySelector('#org-list');
  if (!orgs.length) {
    list.append(el('<div class="empty">Та одоогоор ямар ч байгууллагад байхгүй. Ресторан эсвэл нийлүүлэгчээ бүртгүүлбэл та эзэн нь болно; эсвэл менежер тань таныг утас, имэйлээр чинь нэмнэ.</div>'));
  }
  for (const o of orgs) {
    const [tone, word] = ORG_STATE[o.state] ?? ['off', o.state];
    const row = el(`
      <div class="row org-row" data-chev tabindex="0">
        <div class="main">
          <div class="title">${esc(o.name)}</div>
          <div class="tags">${kinds(o).map((k) => `<span class="pill" data-size="sm">${k}</span>`).join('')}<span class="pill" data-size="sm">${ORG_ROLE_WORD[o.role] ?? o.role}</span></div>
          ${o.state === 'declined' && o.decline_reason ? `<p class="cap" style="margin:4px 0 0">Шалтгаан: ${esc(o.decline_reason)}</p>` : ''}
        </div>
        <div class="end"><span class="pill" data-s="${tone}">${word}</span></div>
      </div>`);
    const open = () => {
      if (o.state === 'active') renderOrg(box, o.id);
      else toast(o.state === 'applied' ? 'Basu хүсэлтийг тань үзэж байна. Батлагдмагц ажилтнуудаа нэмж болно.' : 'Энэ байгууллага идэвхгүй байна.');
    };
    row.addEventListener('click', open);
    row.addEventListener('keydown', (e) => e.key === 'Enter' && open());
    list.append(row);
  }
  section.querySelector('#org-new').addEventListener('click', () => {
    section.querySelector('#org-new').remove();
    section.append(orgForm(() => renderMyOrgs(box)));
  });
  box.append(section);
}

/** Registering a business: its owner is whoever sends this; Basu approves it. */
function orgForm(done) {
  const f = el(`
    <div class="card org-form" style="margin-top:12px"><div class="card-body">
      <label class="field"><span>Байгууллагын нэр</span><input name="name" placeholder="Хэрлэн мах, Алтан тогоо ресторан…"></label>
      <div class="checks">
        <label><input type="checkbox" name="restaurant"> Ресторан</label>
        <label><input type="checkbox" name="supplier"> Идэшний нийлүүлэгч</label>
      </div>
      <div class="fields">
        <label class="field"><span>Холбогдох утас</span><input name="phone" type="tel" placeholder="+976 XXXX XXXX"></label>
        <label class="field"><span>ТТД (байвал)</span><input name="tin" inputmode="numeric" placeholder="7–10 орон"></label>
      </div>
      <label class="field"><span>Хаяг</span><input name="address" placeholder="Дүүрэг, хороо, байр / зах, хаалга"></label>
      <label class="field"><span>Товч тайлбар</span><textarea name="about" placeholder="Юу хийдэг, хэдэн хүнтэй…"></textarea></label>
      <p class="cap">Бүртгүүлсэн хүн байгууллагын эзэн болно. Basu шалгаж баталсны дараа ажилтнуудаа нэмнэ.</p>
      <div class="form-foot"><button class="btn" data-v="primary" type="button" data-send>Бүртгүүлэх</button></div>
    </div></div>`);
  f.querySelector('[data-send]').addEventListener('click', async (e) => {
    const v = (n) => f.querySelector(`[name="${n}"]`).value.trim();
    const on = (n) => f.querySelector(`[name="${n}"]`).checked;
    e.target.setAttribute('data-busy', '');
    try {
      await ops('/v1/orgs', {
        method: 'POST',
        body: { name: v('name'), restaurant: on('restaurant'), supplier: on('supplier'), phone: v('phone'), tin: v('tin'), address: v('address'), about: v('about') },
      });
      toast('Бүртгэл илгээгдлээ. Basu батлахад мэдэгдэнэ.', 'good');
      done();
    } catch (error) {
      toast(error.message, 'bad');
    } finally {
      e.target.removeAttribute('data-busy');
    }
  });
  return f;
}

/**
 * One business: who works there, and — for its owner and managers — bringing
 * somebody in by the phone or address they sign in with, changing a role,
 * taking somebody out.
 */
async function renderOrg(box, id) {
  box.replaceChildren();
  let data;
  try {
    data = await ops(`/v1/orgs/${id}`);
  } catch (error) {
    toast(error.message, 'bad');
    return renderMyOrgs(box);
  }
  const { org, role, may, members } = data;
  // Which roles this person may give: an owner any, a manager staff and accountants.
  const giving = may.managers ? ['manager', 'staff', 'accountant', 'owner'] : may.members ? ['staff', 'accountant'] : [];
  const back = el('<button class="btn" data-v="link" type="button">← Миний байгууллага</button>');
  back.addEventListener('click', () => renderMyOrgs(box));
  const section = el(`
    <section class="section">
      <div class="back-link"></div>
      <h2 style="margin:0 0 4px">${esc(org.name)}</h2>
      <p class="cap" style="margin:0 0 16px">${kinds(org).join(' · ')} · Та: ${ORG_ROLE_WORD[role]}${org.phone ? ` · <span class="mono">${esc(org.phone)}</span>` : ''}${org.address ? ` · ${esc(org.address)}` : ''}</p>
      ${org.supplier ? '<p style="margin:0 0 16px"><a class="link" href="/supplier">Нийлүүлэгчийн хэсэг нээх →</a></p>' : ''}
      ${org.restaurant ? '<p class="cap" style="margin:0 0 16px">Рестораны цэс, захиалгын хэсэг удахгүй нэмэгдэнэ.</p>' : ''}
      <h3 class="section-label">Ажилтнууд · ${members.length}</h3>
      <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Нэр</th><th>Утас, имэйл</th><th>Эрх</th><th></th></tr></thead><tbody data-members></tbody></table></div></div>
      <div data-add></div>
    </section>`);
  section.querySelector('.back-link').append(back);
  const body = section.querySelector('[data-members]');
  for (const m of members) {
    const mine = giving.includes(m.role) && !m.you;
    const tr = el(`
      <tr>
        <td><b>${esc(m.name ?? '—')}</b>${m.you ? ' <span class="meta">(та)</span>' : ''}</td>
        <td>${m.contact ? esc(m.contact) : '—'}</td>
        <td>${mine ? `<select class="input" data-size="sm" style="width:auto">${giving.map((r) => `<option value="${r}"${r === m.role ? ' selected' : ''}>${ORG_ROLE_WORD[r]}</option>`).join('')}</select>` : ORG_ROLE_WORD[m.role]}</td>
        <td class="num"></td>
      </tr>`);
    const cell = tr.lastElementChild;
    if (mine) {
      tr.querySelector('select').addEventListener('change', async (e) => {
        try {
          await ops(`/v1/orgs/${id}/members/${m.guest_id}`, { method: 'PATCH', body: { role: e.target.value } });
          toast(`${m.name ?? ''}: ${ORG_ROLE_WORD[e.target.value]}`, 'good');
        } catch (error) {
          toast(error.message, 'bad');
          e.target.value = m.role;
        }
      });
    }
    if (mine || m.you) {
      const out = el(`<button class="btn" data-v="quiet" data-size="sm" type="button">${m.you ? 'Гарах' : 'Хасах'}</button>`);
      out.addEventListener('click', async () => {
        if (!confirm(m.you ? `«${org.name}»-оос гарах уу?` : `${m.name ?? 'Энэ хүн'}-ийг хасах уу?`)) return;
        try {
          await ops(`/v1/orgs/${id}/members/${m.guest_id}`, { method: 'DELETE' });
          if (m.you) return renderMyOrgs(box);
          renderOrg(box, id);
        } catch (error) {
          toast(error.message, 'bad');
        }
      });
      cell.append(out);
    }
    body.append(tr);
  }
  if (giving.length) {
    const add = el(`
      <div class="card" style="margin-top:12px"><div class="card-body">
        <h3 class="section-label" style="margin-top:0">Хүн нэмэх</h3>
        <p class="cap" style="margin:0 0 12px">Тэр хүний Basu-д нэвтэрдэг утас эсвэл имэйлээр хайна. Урьд нь нэг удаа нэвтэрсэн байх ёстой.</p>
        <div class="add-member">
          <input class="input" name="contact" placeholder="Утас эсвэл имэйл" aria-label="Утас эсвэл имэйл" autocapitalize="none">
          <button class="btn" type="button" data-find>Хайх</button>
          <div data-found hidden></div>
        </div>
      </div></div>`);
    const found = add.querySelector('[data-found]');
    const find = async () => {
      const contact = add.querySelector('[name="contact"]').value.trim();
      if (!contact) return;
      try {
        const who = await ops(`/v1/orgs/${id}/lookup?contact=${encodeURIComponent(contact)}`);
        found.hidden = false;
        found.replaceChildren(el(`
          <div class="add-member" style="margin-top:8px">
            <span><b>${esc(who.name ?? 'Нэргүй')}</b> · ${esc(who.contact ?? '')}</span>
            <select class="input" style="width:auto;flex:0 0 auto">${giving.filter((r) => r !== 'owner').map((r) => `<option value="${r}">${ORG_ROLE_WORD[r]}</option>`).join('')}</select>
            <button class="btn" data-v="primary" type="button" data-add-go>Нэмэх</button>
          </div>`));
        found.querySelector('[data-add-go]').addEventListener('click', async () => {
          try {
            await ops(`/v1/orgs/${id}/members`, { method: 'POST', body: { guest_id: who.guest_id, role: found.querySelector('select').value } });
            toast(`${who.name ?? 'Хүн'} нэмэгдлээ.`, 'good');
            renderOrg(box, id);
          } catch (error) {
            toast(error.message, 'bad');
          }
        });
      } catch (error) {
        found.hidden = false;
        found.replaceChildren(el(`<p class="cap" style="margin:8px 0 0">${esc(error.message)}</p>`));
      }
    };
    add.querySelector('[data-find]').addEventListener('click', find);
    add.querySelector('[name="contact"]').addEventListener('keydown', (e) => e.key === 'Enter' && find());
    section.querySelector('[data-add]').append(add);
  }
  box.append(section);
}

/* ── the desk: businesses waiting for a yes ────────────────────────── */

  view.append(head('Байгууллагууд', 'Ресторан, нийлүүлэгчийн бүртгэл. Батлахад бүртгүүлсэн хүн нь эзэн болж, ажилтнуудаа өөрөө нэмнэ.'));

    ({ orgs } = await ops('/v1/ops/orgs'));

  cache.orgs = orgs;

  const list = el('<div class="card" data-rows></div>');

  for (const o of orgs) {

    const row = el(`
      <div class="row request">
        <div class="main">
          <div class="title">${esc(o.name)} <span class="who-contact">${kinds(o).join(' · ')}</span></div>
          <p class="cap">${[o.applicant && `Бүртгүүлсэн: ${esc(o.applicant)}`, o.phone && `<span class="mono">${esc(o.phone)}</span>`, o.address && esc(o.address), o.tin && `ТТД ${esc(o.tin)}`, `${o.members} хүн`].filter(Boolean).join(' · ')}</p>
          ${o.about ? `<p class="cap">${esc(o.about)}</p>` : ''}
          ${o.state === 'applied' ? `<div class="req-actions">
            <button class="btn" data-v="primary" type="button" data-a="approve">Батлах</button>
            <span class="gap" aria-hidden="true"></span>
            <input class="input" name="reason" placeholder="Татгалзах шалтгаан" aria-label="Татгалзах шалтгаан">
            <button class="btn" data-v="quiet" type="button" data-a="decline">Татгалзах</button>
          </div>` : ''}
        </div>
        <div class="end"><span class="pill" data-s="${tone}">${word}</span><span class="meta" style="display:block;margin-top:6px">${when(o.created_at)}</span></div>
      </div>`);
    row.querySelector('[data-a="approve"]')?.addEventListener('click', async () => {
      try {
        await ops(`/v1/ops/orgs/${o.id}/approve`, { method: 'POST' });
        toast(`«${o.name}» батлагдлаа.`, 'good');
        show('orgs');

async function refresh() {
  try {
    const [{ suppliers }, { settlements }, whoami] = await Promise.all([ops('/v1/ops/suppliers'), ops('/v1/ops/settlements'), ops('/v1/ops/me')]);
    me = whoami.member;
    const requests = me?.role === 'admin' ? (await ops('/v1/ops/requests')).requests : [];
    const orgs = ['admin', 'ops'].includes(me?.role) ? (await ops('/v1/ops/orgs')).orgs : [];
    cache = { suppliers, settlements, requests, orgs };
  } catch (error) {
    if (error.status === 401 || error.status === 503) {
      store.opsToken = null;
      me = null;
      showToken();
      return;
    }
    toast(error.message, 'bad');
    return;
  }
  if (!document.querySelector('.app')) frame();
  badges();
  show(tab);
}

function frame() {
  const f = el(`
    <div class="app">
      <aside class="side sidebar">
        <div class="brand"><b>Basu</b><span>Ops</span></div>
        <nav class="tabs" aria-label="Хэсгүүд">
          ${TABS.filter((t) => (!t.admin || me?.role === 'admin') && (!t.run || ['admin', 'ops'].includes(me?.role)))
            .map((t, i, all) => `${t.group !== all[i - 1]?.group ? `<div class="grp">${t.group}</div>` : ''}<button type="button" data-tab="${t.key}">${t.icon}<span class="t">${t.label}</span><span class="n" data-badge="${t.key}" hidden></span></button>`)
            .join('')}
        </nav>
        <div class="me"><b id="me-name">${esc(me?.name ?? '')}</b><span>${me ? ROLE_WORD[me.role] ?? me.role : ''}${me?.phone ? ` · ${esc(me.phone)}` : ''}</span></div>
        <button class="out" type="button" id="out">Гарах</button>
      </aside>
      <main class="main"><div class="page" id="view"></div></main>
    </div>`);
  f.querySelector('#out').addEventListener('click', () => {
    store.opsToken = null;
    me = null;
    showToken();
  });
  f.querySelector('.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]');
    if (b) show(b.dataset.tab);
  });

}

/** What waits, in the sidebar: applications to answer, money to send. */
function badges() {
  const applied = cache.suppliers.filter((s) => s.state === 'applied').length;
  const due = cache.settlements.filter((t) => t.state === 'due').length;
  const set = (key, n, hot) => {
    const b = document.querySelector(`[data-badge="${key}"]`);
    if (!b) return;
    b.hidden = !n;
    b.textContent = String(n);
    b.toggleAttribute('data-hot', Boolean(hot));
  };
  set('suppliers', applied, applied > 0);
  set('pay', due, due > 0);
  set('members', cache.requests.length, cache.requests.length > 0);
  const waitingOrgs = cache.orgs.filter((o) => o.state === 'applied').length;
  set('orgs', waitingOrgs, waitingOrgs > 0);
}

function show(key) {
  tab = key;
  localStorage.setItem('basu.ops.tab', key);
  for (const b of document.querySelectorAll('.tabs button')) {
    const on = b.dataset.tab === key;
    b.toggleAttribute('data-on', on);
    if (on) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  }
  const view = document.getElementById('view');
  view.replaceChildren();
  window.scrollTo(0, 0);
  ({ overview: renderOverview, guests: renderGuests, money: renderMoney, notify: renderNotify, system: renderSystem, venues: renderVenues, lunches: renderLunches, reviews: renderReviews, stats: renderStats, orders: renderOrders, suppliers: renderSuppliers, pay: renderPay, audit: renderAudit, members: renderMembers, orgs: renderOrgsDesk, myorgs: (v) => renderMyOrgs(v) })[key]?.(view);
}

let period = localStorage.getItem('basu.ops.period') ?? 'today';

/** The period switch every numbers page shares; `draw` is called again on each change. */
function periodSeg(draw) {
  const seg = el(`<div class="seg">${PERIODS.map(([k, l]) => `<button type="button" data-p="${k}"${period === k ? ' data-on' : ''}>${l}</button>`).join('')}</div>`);
  seg.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-p]');
    if (!b) return;
    period = b.dataset.p;
    localStorage.setItem('basu.ops.period', period);
    for (const c of seg.querySelectorAll('button')) c.toggleAttribute('data-on', c === b);
    draw();
  });
  return seg;
}

const periodWord = () => PERIODS.find(([k]) => k === period)?.[1] ?? '';

          <table class="table"${f.idesh_orders.length ? '' : ' data-empty'}><thead><tr><th>Захиалга</th><th>Нийлүүлэгч</th><th>Өдөр</th><th>Төлөв</th><th class="num">Дүн</th></tr></thead>

            <button class="btn" data-v="quiet" data-size="sm" type="button" data-a="revoke" data-sid="${s.id}">Гаргах</button></div>`).join('') : '<div class="hint">Нээлттэй сесс алга.</div>'}
          ${f.devices.length ? `<div class="hint">Push: ${f.devices.map((d) => `${PLATFORM_WORD[d.platform] ?? d.platform}${d.label ? ` · ${esc(d.label)}` : ''}`).join(', ')}</div>` : ''}
          ${closed ? '' : `
          <div class="sep"></div>

    const b = e.target.closest('button[data-a]');

    try {
      if (b.dataset.a === 'revoke') {
        if (!confirm('Энэ сессийг гаргах уу? Тэр утсан дээр дахин нэвтрэх шаардлагатай болно.')) return;
        await ops(`/v1/ops/guests/${id}/sessions/${b.dataset.sid}/revoke`, { method: 'POST', body: {} });

        if (!note) return toast('Шалтгаан бичнэ үү.', 'bad');

        await ops(`/v1/ops/guests/${id}/close`, { method: 'POST', body: { note } });
        toast('Бүртгэл хаагдлаа.', 'good');
      }
      await openGuest(id);
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  view.append(page);
}

/* ── lunch: the restaurants ── */

const DINE_LIVE = ['PLACED', 'ACCEPTED', 'SCHEDULED', 'ARMED', 'HELD', 'FIRED', 'COOKING', 'READY', 'SERVED'];
const DINE_FREE = ['PLACED', 'ACCEPTED', 'SCHEDULED', 'ARMED', 'HELD', 'RESLOTTED'];
const DINE_EVENT = {
  CREATED: 'Үүссэн', PAID: 'Төлсөн', PLANNED: 'Төлөвлөсөн', ACCEPTED: 'Ресторан баталсан', REJECTED: 'Ресторан татгалзсан', ARMED: 'Бэлтгэлд орсон',
  HELD: 'Түр зогсоосон', HELD_BY_KITCHEN: 'Гал тогоо түр зогсоосон', FIRED: 'Гал дээр гарсан', READY: 'Бэлэн болсон', SERVED: 'Үйлчилсэн', CLOSED: 'Дууссан',
  CANCELLED: 'Цуцлагдсан', REFUNDED: 'Буцаалт хийсэн', NO_SHOW: 'Зочин ирээгүй', REVIEWED: 'Үнэлгээ өгсөн', SEATED: 'Суусан', RESLOTTED: 'Цаг солигдсон',
};
const dineActor = (a) => {
  if (!a) return '';
  if (a.startsWith('guest:')) return 'зочин';
  if (a.startsWith('kds:')) return 'гал тогооны дэлгэц';
  if (a.startsWith('ops:')) return `ops · ${a.slice(4)}`;
  return { 'system:planner': 'төлөвлөгч', 'system:scheduler': 'хуваарьлагч' }[a] ?? a;
};
const stars = (n) => `<span class="stars" aria-label="${n} од">${Array.from({ length: 5 }, (_, i) => (i < n ? STAR : STAR.replace('<svg', '<svg data-off'))).join('')}</span>`;
let venueCache = [];

async function renderVenues(view) {
  view.append(head('Ресторан', 'Гал тогоо бүр: таблет холбоотой эсэх, өнөөдрийн захиалга, цэс, үнэлгээ.'));
  view.append(el('<div class="rows" id="venues" data-rows></div>'));
  view.querySelector('#venues').append(busy());
  await loadVenues();
}

async function loadVenues() {
  const box = document.getElementById('venues');
  if (!box) return;
  try {
    ({ restaurants: venueCache } = await ops('/v1/ops/dine/restaurants'));
  } catch (error) {
    box.replaceChildren(el(`<div class="card empty">${esc(error.message)}</div>`));
    return;
  }
  if (!document.getElementById('venues')) return;
  box.replaceChildren(...(venueCache.length ? venueCache.map(renderVenue) : [el('<div class="card empty"><b>Ресторан алга</b>Хоолны талд ресторан бүртгэгдээгүй.</div>')]));
}

function renderVenue(r) {
  const card = el(`
    <div class="card row" data-venue="${r.id}" data-state="${r.active ? 'on' : 'off'}">
      <div class="name">${esc(r.name)}
        ${r.active ? '' : ' <span class="pill" data-s="off">зогссон</span>'}
        <span class="pill" data-s="${r.online ? 'contracted' : 'declined'}">${r.online ? 'дэлгэц холбоотой' : 'дэлгэц холбогдоогүй'}</span>
        <small>${r.rating ? `${stars(Math.round(r.rating.stars))} ${r.rating.stars} · ${r.rating.count} үнэлгээ${r.rating.on_time_share === null ? '' : ` · цагтаа ${Math.round(r.rating.on_time_share * 100)}%`}` : 'үнэлгээ алга'} · ${r.slot_minutes} мин цаг · ${r.auto_accept ? 'автоматаар батална' : 'гараар батална'}${r.merchant_tin ? '' : ' · <b class="ink-stop">е-баримтын ТТД алга</b>'}</small>
      </div>
      <div class="right"><div class="btns">
        <button class="btn" data-size="sm" type="button" data-a="menu">Цэс</button>
        <details class="more"><summary class="btn" data-size="sm" data-icon aria-label="Бусад үйлдэл"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></summary><div class="menu">
          <button class="btn" data-size="sm" data-v="quiet" type="button" data-a="tablet">Шинэ таблет</button>
          <button class="btn${r.active ? ' ink-stop' : ''}" data-size="sm" data-v="quiet" type="button" data-a="active">${r.active ? 'Зогсоох' : 'Идэвхжүүлэх'}</button>
        </div></details>
      </div></div>
      <div class="about">Өнөөдөр <b>${r.today.placed}</b> захиалга · <b>${r.today.live}</b> идэвхтэй${r.today.held ? ` · <b class="ink-hold">${r.today.held} түр зогсоосон</b>` : ''} · <b>${money(r.today.sales_mnt)}</b> · цэс ${r.menu.active}/${r.menu.total}${r.menu.sold_out ? ` (${r.menu.sold_out} дууссан)` : ''}
        <div class="sess-list">${r.devices.length ? r.devices.map((d) => `
          <div class="sess"><span>${d.pairing_code ? `Код <b class="mono">${d.pairing_code}</b> · ${esc(d.label ?? '')} · ${clockOf(d.pairing_expires_at)} хүртэл` : `${esc(d.label ?? 'Таблет')} · ${d.online ? '<span class="pill" data-s="contracted">онлайн</span>' : `сүүлд ${d.last_seen_at ? `${when(d.last_seen_at)} ${clockOf(d.last_seen_at)}` : 'хэзээ ч үгүй'}`}`}</span>
          <button class="btn" data-v="quiet" data-size="sm" type="button" data-a="revoke" data-device="${d.id}">Салгах</button></div>`).join('') : '<span class="muted">Таблет холбогдоогүй.</span>'}</div>
      </div>
    </div>`);
  card.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    try {
      if (b.dataset.a === 'tablet') {
        const label = prompt('Таблетын нэр (жишээ нь «Хойд гал тогоо»):', 'Гал тогооны таблет');
        if (label === null) return;
        const { pairing_code } = await ops(`/v1/ops/dine/restaurants/${r.id}/devices`, { method: 'POST', body: { label } });
        toast(`Код ${pairing_code} — 10 минутын дотор таблет дээр оруулна.`, 'good');
      } else if (b.dataset.a === 'revoke') {
        if (!confirm('Энэ таблетыг салгах уу? Дэлгэц дахин холбох код шаардана.')) return;
        await ops(`/v1/ops/dine/devices/${b.dataset.device}/revoke`, { method: 'POST', body: {} });
      } else if (b.dataset.a === 'active') {
        const note = prompt(r.active ? 'Зогсоох шалтгаан:' : 'Идэвхжүүлэх тэмдэглэл:', '');
        if (note === null) return;
        await ops(`/v1/ops/dine/restaurants/${r.id}/active`, { method: 'POST', body: { active: !r.active, note } });
      } else if (b.dataset.a === 'menu') {
        const open = card.querySelector('.drawer');
        if (open) return open.remove();
        return card.append(await menuDrawer(r));
      }
      await loadVenues();
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  return card;
}

async function menuDrawer(r) {
  const { items } = await ops(`/v1/ops/dine/restaurants/${r.id}/menu`);
  const d = el(`<div class="drawer table-wrap"><table class="table"${items.length ? '' : ' data-empty'}><thead><tr><th>Хоол</th><th>Цех</th><th class="num">Үнэ</th><th class="num">Бэлтгэх, мин</th><th>Төлөв</th><th></th></tr></thead><tbody>${items
    .map((m) => `<tr${m.active ? '' : ' data-off'}><td><b>${esc(m.name)}</b></td><td>${esc(m.station)}</td><td class="num">${money(m.price_mnt)}</td><td class="num">${m.prep_minutes}</td><td>${m.active ? (m.sold_out_until ? '<span class="pill" data-s="off">дууссан</span>' : '<span class="pill" data-s="contracted">цэсэнд</span>') : '<span class="pill" data-s="declined">нуусан</span>'}</td><td class="num"><button class="btn" data-size="sm" data-v="quiet" type="button" data-item="${m.id}" data-on="${m.active}">${m.active ? 'Нуух' : 'Харуулах'}</button></td></tr>`)
    .join('') || '<tr><td colspan="6" class="empty">Цэс хоосон.</td></tr>'}</tbody></table></div>`);
  d.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-item]');
    if (!b) return;
    e.stopPropagation();
    const active = b.dataset.on !== 'true';
    const note = prompt(active ? 'Цэсэнд буцаах тэмдэглэл:' : 'Нуух шалтгаан:', '');
    if (note === null) return;
    try {
      await ops(`/v1/ops/dine/menu/${b.dataset.item}/active`, { method: 'POST', body: { active, note } });
      d.replaceWith(await menuDrawer(r));
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  return d;
}

/* ── lunch: the orders ── */

let lunchFilter = { scope: 'live', restaurant: '', day: '', q: '' };

async function renderLunches(view) {
  view.append(head('Хоолны захиалга', 'Өнөөдрийн болон өмнөх захиалгууд. Дарж дэлгэрэнгүйг үзнэ.'));
  if (!venueCache.length) {
    try {
      ({ restaurants: venueCache } = await ops('/v1/ops/dine/restaurants'));
    } catch { /* the list still works without the filter */ }
  }
  if (tab !== 'lunches') return;
  view.append(el(`
    <div class="card">
      <div class="tools">
        <input class="input search" type="search" id="q" placeholder="Код, утас, зочин, ресторан…" value="${esc(lunchFilter.q)}" autocomplete="off">
        <select class="input" id="restaurant"><option value="">Бүх ресторан</option>${venueCache.map((r) => `<option value="${r.id}"${lunchFilter.restaurant === r.id ? ' selected' : ''}>${esc(r.name)}</option>`).join('')}</select>
        <input class="input" type="date" id="day" value="${esc(lunchFilter.day)}" title="Хоолны өдөр">
        <div class="seg">${[['live', 'Идэвхтэй'], ['done', 'Дууссан'], ['all', 'Бүгд']].map(([k, l]) => `<button type="button" data-scope="${k}"${lunchFilter.scope === k ? ' data-on' : ''}>${l}</button>`).join('')}</div>
      </div>
      <div id="lunches" class="table-wrap"></div>
    </div>`));
  view.querySelector('#lunches').append(busy());
  let timer;
  view.querySelector('#q').addEventListener('input', (e) => {
    lunchFilter.q = e.target.value;
    clearTimeout(timer);
    timer = setTimeout(loadLunches, 250);
  });
  view.querySelector('#restaurant').addEventListener('change', (e) => ((lunchFilter.restaurant = e.target.value), loadLunches()));
  view.querySelector('#day').addEventListener('change', (e) => ((lunchFilter.day = e.target.value), loadLunches()));
  view.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-scope]');
    if (!b) return;
    lunchFilter.scope = b.dataset.scope;
    for (const c of view.querySelectorAll('.seg button')) c.toggleAttribute('data-on', c === b);
    void loadLunches();
  });
  void loadLunches();
}

async function loadLunches() {
  const box = document.getElementById('lunches');
  if (!box) return;
  const qs = new URLSearchParams({ scope: lunchFilter.scope, q: lunchFilter.q });
  if (lunchFilter.restaurant) qs.set('restaurant', lunchFilter.restaurant);
  if (lunchFilter.day) qs.set('day', lunchFilter.day);
  let data;
  try {
    data = await ops(`/v1/ops/dine/orders?${qs}`);
  } catch (error) {
    box.replaceChildren(el(`<div class="empty">${esc(error.message)}</div>`));
    return;
  }
  if (!document.getElementById('lunches')) return;
  if (!data.orders.length) {
    box.replaceChildren(el('<div class="empty"><b>Захиалга алга</b>Шүүлтэд тохирох хоолны захиалга байхгүй.</div>'));
    return;
  }
  const table = el('<table class="table"><thead><tr><th>Захиалга</th><th>Ресторан</th><th>Зочин</th><th>Цаг</th><th>Гал</th><th>Төлөв</th><th class="num">Дүн</th></tr></thead><tbody></tbody></table>');
  const body = table.querySelector('tbody');
  for (const o of data.orders) {
    const tr = el(`
      <tr data-link data-lunch="${o.id}">
        <td><b class="mono">№${esc(o.code)}</b><span class="sub">${o.party_size} хүн</span></td>
        <td>${esc(o.restaurant.name)}</td>
        <td>${esc(o.guest ?? 'зочин')}<span class="sub mono">${esc(o.guest_phone ?? '')}</span></td>
        <td>${stamp(o.slot_starts_at)}</td>
        <td>${o.fire_at ? `<span class="mono">${clockOf(o.fire_at)}</span>` : '—'}${o.late ? ' <span class="pill" data-s="declined">хоцорсон</span>' : ''}</td>
        <td><span class="pill" data-s="${o.state}">${DINE_WORD[o.state] ?? o.state}</span></td>
        <td class="num">${money(o.total_mnt)}</td>
      </tr>`);
    tr.addEventListener('click', () => openLunch(o.id));
    body.append(tr);
  }
  box.replaceChildren(table);
}

/** A CSV the browser saves, fetched with the desk's token because a plain link cannot carry one. */
async function download(path, name) {
  const res = await fetch(path, { headers: { authorization: `Bearer ${token()}` } });
  if (!res.ok) throw new Error('Экспорт амжилтгүй.');
  const url = URL.createObjectURL(await res.blob());
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function loadMessages() {
  const box = document.getElementById('messages');
  if (!box) return;

  for (const [k, v] of Object.entries(msgFilter)) if (v) qs.set(k, v);
  let data;
  try {
    data = await ops(`/v1/ops/notify/messages?${qs}`);
  } catch (error) {
    box.replaceChildren(el(`<div class="empty">${esc(error.message)}</div>`));
    return;
  }
  if (!document.getElementById('messages')) return;
  if (!data.messages.length) {
    box.replaceChildren(el('<div class="empty"><b>Мэдэгдэл алга</b>Шүүлтэд тохирох мэдэгдэл байхгүй.</div>'));
    return;
  }
  const list = el('<ul class="log"></ul>');
  for (const m of data.messages) {
    list.append(el(`<li data-message="${m.id}"><span class="who">${m.channel === 'sms' ? 'SMS' : 'Push'}<small>${esc(m.guest ?? 'зочин')}<br><span class="mono">${esc(m.guest_phone ?? '')}</span></small></span>

const FLAVOUR = { fake: 'туршилтын', real: 'бодит' };
const REPORT_WORD = { armed: 'бэлтгэлд', planned: 'төлөвлөсөн', held: 'түр зогсоосон', fired: 'галласан', lateFires: 'хоцорсон', superseded: 'дахин төлөвлөсөн', relayed: 'outbox', notified: 'мэдэгдэл', receipts: 'е-баримт', abandoned: 'орхисон', ideshExpired: 'идэш хугацаа дууссан', ideshClosed: 'идэш хаагдсан', purged: 'цэвэрлэсэн', activitiesUpdated: 'карт шинэчилсэн', activitiesEnded: 'карт хаасан' };
/** Against the server's own clock: in the demo it runs ahead of the wall. */
const ago = (iso, nowIso) => {
  if (!iso) return 'хэзээ ч үгүй';
  const s = Math.max(0, Math.round((new Date(nowIso).getTime() - new Date(iso).getTime()) / 1000));
  if (s < 60) return `${s} сек өмнө`;
  if (s < 3600) return `${Math.round(s / 60)} мин өмнө`;
  if (s < 86400) return `${Math.round(s / 3600)} цаг өмнө`;
  return `${Math.round(s / 86400)} хоног өмнө`;
};

          ${live ? `
          <label class="field"><span>Тэмдэглэл</span><input id="note" placeholder="Бүртгэлд үлдэнэ"></label>
          <button class="btn" type="button" data-a="resend">Мэдэгдэл дахин илгээх</button>
          ${['READY', 'DISPATCHED'].includes(o.state) ? '<button class="btn" data-v="primary" type="button" data-a="hand">Хүлээлгэн өгсөн гэж тэмдэглэх</button>' : ''}
          <div class="sep"></div>
          <label class="field"><span>Нийлүүлэгчийн өмнөөс цуцлах</span><select id="reason"><option value="">Шалтгаан сонгох…</option>${Object.entries(REASON).filter(([k]) => k !== 'draft_expired').map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
          <button class="btn" data-v="danger" type="button" data-a="cancel" disabled>Цуцлах</button>
          <div class="hint">Буцаалтын дүнг шалтгаан ба дүрэм тогтооно; хүн сонгохгүй.</div>
          ` : '<div class="hint">Дууссан захиалгад үйлдэл алга.</div>'}
        </div>
      </div>
    </div>`);
  for (const t of d.settlements) page.querySelector('#money').append(renderSettlement(t));
  const acts = page.querySelector('#acts');
  const reason = acts.querySelector('#reason');
  reason?.addEventListener('change', () => (acts.querySelector('[data-a="cancel"]').disabled = !reason.value));
  acts.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    const action = b.dataset.a;
    const body = { note: acts.querySelector('#note')?.value ?? '' };
    if (action === 'cancel') body.reason = reason.value;
    if (action === 'cancel' && !confirm(`№${o.code}-г «${REASON[reason.value]}» шалтгаанаар цуцлах уу? Буцаалтыг дүрэм тогтооно.`)) return;
    b.disabled = true;
    try {
      await ops(`/v1/ops/orders/${id}/${action}`, { method: 'POST', body });
      toast('Болсон, бүртгэгдлээ.');
      await refresh();
      await openOrder(id);
    } catch (error) {
      toast(error.message, 'bad');
      b.disabled = false;
    }
  });
  view.append(page);
}

/* ── suppliers ── */

function renderSuppliers(view) {
  const applied = cache.suppliers.filter((s) => s.state === 'applied');
  const rest = cache.suppliers.filter((s) => s.state !== 'applied');
  view.append(head('Нийлүүлэгчид', `${applied.length} хүсэлт · ${rest.filter((s) => s.state === 'contracted').length} гэрээт`));
  view.append(
    el(`<section class="section" id="applied"><h2 class="section-label">Хүсэлт</h2><div class="rows" data-rows></div></section>`),
    el(`<section class="section" id="all"><h2 class="section-label">Нийлүүлэгчид</h2><div class="rows" data-rows></div></section>`),
    el(`<section class="section" id="new"><h2 class="section-label">Шинэ нийлүүлэгч, гэрээтэй</h2></section>`),
  );
  const pending = view.querySelector('#applied .rows');
  if (!applied.length) pending.append(el('<div class="card empty">Хүлээгдэж буй хүсэлт алга.</div>'));
  for (const s of applied) pending.append(renderRow(s));
  const list = view.querySelector('#all .rows');
  if (!rest.length) list.append(el('<div class="card empty">Нийлүүлэгч алга.</div>'));
  for (const s of rest) list.append(renderRow(s));
  view.querySelector('#new').append(newForm());
}

function renderRow(s) {
  const status = s.state === 'contracted' ? (s.active ? 'contracted' : 'off') : s.state;
  const row = el(`
    <div class="card row" data-state="${s.state}" data-supplier="${s.id}">
      <div class="name">${esc(s.name)}<small><span class="mono">${esc(s.phone)}</span>${s.merchant_tin ? ` · ТТД <span class="mono">${esc(s.merchant_tin)}</span>` : ' · ТТД алга'} · ${esc(s.pickup_address)}<br>${
        s.state === 'applied'
          ? `хүсэлт ${when(s.applied_at)}`
          : s.state === 'contracted'
            ? `гэрээ ${when(s.contracted_at)} · ${s.listings} зар · ${s.watched ? 'дэлгэц холбогдсон' : 'дэлгэц холбогдоогүй'}`
            : `татгалзсан ${when(s.decided_at)}: ${esc(s.decline_reason)}`
      }</small></div>
      <div class="right"><span class="pill" data-s="${status}">${s.state === 'contracted' && !s.active ? 'түр зогссон' : STATE[s.state]}</span><div class="btns"></div></div>
      ${s.about ? `<div class="about">${esc(s.about)}</div>` : ''}
      ${
        s.state !== 'declined'
          ? `<div class="about">Шимтгэл <b>${s.commission_pct}%</b> · Данс: ${
              s.bank_account ? `<b>${esc(s.bank_name)} <span class="mono">${esc(s.bank_account)}</span></b> · ${esc(s.bank_holder)}${s.bank_verified ? '' : ' <span class="pill" data-s="warn">баталгаажаагүй</span>'}` : '<b>алга</b>'
            }</div>`
          : ''
      }
    </div>`);
  const buttons = row.querySelector('.btns');
  const act = async (path, body, done) => {
    try {
      const answer = await ops(path, { method: 'POST', body: body ?? {} });
      done?.(answer);
      await refresh();
    } catch (error) {
      toast(error.message, 'bad');
    }
  };
  const showCode = (answer) => {
    // The code is on its way by SMS; it is also here, in case the SMS is not.
    const code = answer?.pairing_code;
    if (code) {
      toast(`Батлагдлаа. Код ${code} — SMS-ээр илгээгдэнэ.`);
      sessionStorage.setItem(`ops.code.${s.id}`, code);
    }
  };
  const small = (label, attrs = '') => el(`<button class="btn" data-size="sm" type="button" ${attrs}>${label}</button>`);
  // One action in view, the rest behind ⋯ — every button stays in the DOM.
  const folded = more();
  const menu = folded.querySelector('.menu');
  const fold = (button) => {
    button.dataset.v = 'quiet';
    menu.append(button);
  };

  if (s.state === 'applied') {
    const ok = el('<button class="btn" data-v="primary" data-size="sm" type="button" data-a="approve">Батлах</button>');
    ok.addEventListener('click', () => act(`/v1/ops/suppliers/${s.id}/approve`, null, showCode));
    const no = el('<button class="btn" data-v="quiet" data-size="sm" type="button" data-a="decline">Татгалзах</button>');
    no.addEventListener('click', () => {
      const reason = prompt('Шалтгаан (нийлүүлэгчид SMS-ээр очно):', '');
      if (reason === null) return;
      act(`/v1/ops/suppliers/${s.id}/decline`, { reason });
    });
    buttons.append(ok, no);
  }
  if (s.state === 'contracted' && s.bank_account && !s.bank_verified) {
    // A changed account pays out nothing until somebody holds it up against the contract.
    const check = el('<button class="btn" data-size="sm" type="button" data-a="bank-verify">Данс баталгаажуулах</button>');
    check.addEventListener('click', () => {
      if (!confirm(`${s.name}: ${s.bank_name} ${s.bank_account} (${s.bank_holder}) гэрээний данстай таарч байна уу?`)) return;
      act(`/v1/ops/suppliers/${s.id}/bank-verify`, { note: 'гэрээтэй тулгасан' });
    });
    buttons.append(check);
  }
  if (s.state === 'contracted') {
    const code = small('Шинэ код', 'data-a="code"');
    code.addEventListener('click', () => act(`/v1/ops/suppliers/${s.id}/code`, null, showCode));
    fold(code);
    // Their listings, to look at and, if need be, hide.
    const stall = small('Зарууд', 'data-a="listings"');
    stall.addEventListener('click', async () => {
      if (row.querySelector('.stall')) return row.querySelector('.stall').remove();
      const { listings } = await ops(`/v1/ops/suppliers/${s.id}/listings`);
      const box = el('<div class="drawer stall"></div>');
      if (!listings.length) box.append(el('<span class="muted">Зар алга.</span>'));
      for (const l of listings) {
        const line = el(`<div class="stall-line"${l.active ? '' : ' data-off'}><span>${esc(l.title)} · ${money(l.price_mnt)}/${l.unit === 'kg' ? 'кг' : 'толгой'} · <span class="mono">${l.sold}/${l.quantity}</span>${l.active ? '' : ' · нуусан'}</span></div>`);
        if (l.active) {
          const hide = el('<button class="btn" data-v="quiet" data-size="sm" type="button">Нуух</button>');
          hide.addEventListener('click', () => {
            const note = prompt('Нуух шалтгаан (бүртгэлд үлдэнэ):', '');
            if (note === null) return;
            act(`/v1/ops/listings/${l.id}/hide`, { note });
          });
          line.append(hide);
        }
        box.append(line);
      }
      row.append(box);
    });
    buttons.append(stall);
    // Off the market, or back on it — with the reason kept.
    const toggle = el(`<button class="btn${s.active ? ' ink-stop' : ''}" data-size="sm" type="button" data-a="active">${s.active ? 'Түр зогсоох' : 'Идэвхжүүлэх'}</button>`);
    toggle.addEventListener('click', () => {
      const note = prompt(s.active ? 'Түр зогсоох шалтгаан (бүртгэлд үлдэнэ):' : 'Идэвхжүүлэх тэмдэглэл:', '');
      if (note === null) return;
      act(`/v1/ops/suppliers/${s.id}/active`, { active: !s.active, note });
    });
    fold(toggle);
  }
  if (s.state !== 'declined') {
    // The contract's terms: written in once it is signed, corrected here.
    const terms = small('Нөхцөл', 'data-a="terms"');
    terms.addEventListener('click', () => {
      if (row.querySelector('.terms')) return row.querySelector('.terms').remove();
      const form = el(`
        <div class="drawer terms">
          <div class="fields">
            <label class="field"><span>Шимтгэл, %</span><input name="commission_pct" inputmode="decimal" value="${s.commission_pct}"></label>
            <label class="field"><span>ТТД</span><input name="tin" inputmode="numeric" value="${esc(s.merchant_tin ?? '')}" placeholder="7–14 орон"></label>
            <label class="field"><span>Банк</span><input name="bank_name" value="${esc(s.bank_name ?? '')}"></label>
            <label class="field"><span>Данс</span><input name="bank_account" inputmode="numeric" value="${esc(s.bank_account ?? '')}"></label>
            <label class="field"><span>Эзэмшигч</span><input name="bank_holder" value="${esc(s.bank_holder ?? '')}"></label>
          </div>
          <div class="form-foot">
            <button class="btn" data-v="quiet" type="button" data-a="close">Болих</button>
            <button class="btn" data-v="primary" type="button" data-a="save">Хадгалах</button>
          </div>
        </div>`);
      form.querySelector('[data-a="close"]').addEventListener('click', () => form.remove());
      form.querySelector('[data-a="save"]').addEventListener('click', async () => {
        const v = (name) => form.querySelector(`[name="${name}"]`).value.trim();
        const body = { tin: v('tin'), bank_name: v('bank_name'), bank_account: v('bank_account'), bank_holder: v('bank_holder') };
        if (v('commission_pct') !== '') body.commission_pct = Number(v('commission_pct'));
        try {
          await ops(`/v1/ops/suppliers/${s.id}`, { method: 'PATCH', body });
          toast('Хадгалагдлаа.');
          await refresh();
        } catch (error) {
          toast(error.message, 'bad');
        }
      });
      row.append(form);
    });
    fold(terms);
  }
  if (menu.childElementCount) buttons.append(folded);

  const remembered = sessionStorage.getItem(`ops.code.${s.id}`);
  if (remembered && s.state === 'contracted' && !s.watched) {
    row.append(el(`<div class="code">Дэлгэц холбох код<b class="mono">${remembered}</b> · 24 цаг</div>`));
  }
  return row;
}

      <div class="card-head"><h3>Гэрээ байгуулсан нийлүүлэгчийг бүртгэх</h3><span class="cap muted">Бүртгэмэгц дэлгэц холбох код SMS-ээр очно</span></div>
      <div class="card-body">

          <label class="field wide"><span>Нэр</span><input name="name" placeholder="Хэнтий · «Хэрлэн» хоршоо"></label>

          <label class="field"><span>Эзэмшигч</span><input name="bank_holder" placeholder="Гэрээний нэр"></label>
        </div>

function renderPay(view) {
  const due = cache.settlements.filter((t) => t.state === 'due');
  const waiting = cache.settlements.filter((t) => t.state === 'needs_account');
  const paid = cache.settlements.filter((t) => t.state === 'paid');
  view.append(head('Олголт, буцаалт', 'Basu-гийн банкаар гараар шилжүүлж, энд «Шилжүүлсэн» гэж тэмдэглэнэ.'));
  view.append(el(`<div class="kpis kpi-band">
    <div class="card kpi"><div class="lab">Шилжүүлэх ёстой</div><b>${money(due.reduce((s, t) => s + t.amount_mnt, 0))}</b><span>${due.length} мөр, данс бэлэн</span></div>
    <div class="card kpi"><div class="lab">Данс хүлээж байна</div><b>${money(waiting.reduce((s, t) => s + t.amount_mnt, 0))}</b><span>${waiting.length} буцаалт — зочин дансаа оруулаагүй</span></div>
    <div class="card kpi"><div class="lab">Шилжүүлсэн (30 хоног)</div><b>${money(paid.reduce((s, t) => s + t.amount_mnt, 0))}</b><span>${paid.length} мөр</span></div>
  </div>`));
  const section = el('<section id="pay" class="section"><div class="rows" data-rows></div></section>');
  const rows = section.querySelector('.rows');
  if (!cache.settlements.length) rows.append(el('<div class="card empty"><b>Шилжүүлэх зүйл алга</b>Хүлээлгэн өгсөн захиалгын олголт, цуцлагдсан захиалгын буцаалт энд гарна.</div>'));
  for (const t of cache.settlements) rows.append(renderSettlement(t));
  view.append(section);
}

/**
 * One thing to pay: who, how much, to which account, and the button that
 * says it was done. A refund without an account yet is shown but cannot be
 * paid — the guest has not said where.
 */
function renderSettlement(t) {
  const who = t.kind === 'payout' ? esc(t.supplier?.name ?? '') : `${esc(t.guest?.name ?? 'Зочин')} (зочин)`;
  const bank = t.bank_account ? `${esc(t.bank_name)} · ${esc(t.bank_account)} · ${esc(t.bank_holder)}` : 'данс алга';
  const bankHtml = t.bank_account ? `${esc(t.bank_name)} · <span class="mono">${esc(t.bank_account)}</span> · ${esc(t.bank_holder)}` : 'данс алга';
  const status = t.state === 'paid' ? ['paid', 'шилжүүлсэн'] : t.state === 'needs_account' ? ['needs_account', 'данс хүлээж байна'] : !t.bank_verified ? ['warn', 'данс баталгаажаагүй'] : t.approved_at ? ['due', 'шилжүүлэх'] : ['hold', 'батлах хүлээж байна'];
  const releasedBy = t.approved_by ? esc(t.approved_by.replace('ops:', '')) : null;
  const row = el(`
    <div class="card row" data-kind="${t.kind}" data-settlement="${t.id}"${t.state === 'paid' ? ' data-paid' : ''}>
      <div class="name">${esc(t.memo)} · ${who}<small><span class="mono">№${esc(t.order_code)}</span> · ${bankHtml}<br>${
        t.state === 'paid'
          ? `шилжүүлсэн ${when(t.paid_at)}${t.reference ? ` · гүйлгээ <span class="mono">${esc(t.reference)}</span>` : ''}`
          : t.state === 'needs_account'
            ? 'зочин аппаар дансаа оруулмагц шилжүүлж болно'
            : releasedBy
              ? `<b>${releasedBy}</b> баталсан ${when(t.approved_at)} — өөр гишүүн шилжүүлнэ`
              : `үүссэн ${when(t.created_at)}`
      }</small></div>
      <div class="right"><span class="amount">${money(t.amount_mnt)}</span><span class="pill" data-s="${status[0]}">${status[1]}</span><div class="btns"></div></div>
    </div>`);
  if (t.state === 'due' && t.bank_verified && !t.approved_at) {
    // Two people, not one: releasing the money and sending it are different
    // hands, so the row only ever offers the half that is this member's.
    const approve = el('<button class="btn" data-v="primary" data-size="sm" type="button" data-a="approve">Батлах</button>');
    approve.addEventListener('click', async () => {
      if (!confirm(`${mnt(t.amount_mnt)} → ${bank}\nЭнэ олголтыг батлах уу? Шилжүүлэхийг өөр гишүүн хийнэ.`)) return;
      approve.disabled = true;
      try {
        await ops(`/v1/ops/settlements/${t.id}/approve`, { method: 'POST', body: {} });
        toast('Батлагдлаа. Одоо өөр гишүүн шилжүүлж тэмдэглэнэ.', 'good');
        await refresh();
      } catch (error) {
        toast(error.message, 'bad');
        approve.disabled = false;
      }
    });
    row.querySelector('.btns').append(approve);
  }
  if (t.state === 'due' && t.bank_verified && t.approved_at) {
    const paid = el('<button class="btn" data-v="primary" data-size="sm" type="button" data-a="paid">Шилжүүлсэн</button>');
    paid.addEventListener('click', async () => {
      const reference = prompt(`${mnt(t.amount_mnt)} → ${bank}\nБанкны гүйлгээний дугаар (заавал биш):`, '');
      if (reference === null) return;
      paid.disabled = true;
      try {
        await ops(`/v1/ops/settlements/${t.id}/paid`, { method: 'POST', body: { reference } });
        toast('Тэмдэглэгдлээ, мэдэгдэл явлаа.');
        await refresh();
      } catch (error) {
        toast(error.message, 'bad');
        paid.disabled = false;
      }
    });
    row.querySelector('.btns').append(paid);
  }
  return row;
}
