<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ops — Basu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
/* Ops is two or three people in one room signing contracts. A table and a
   form, no more chrome than a spreadsheet. */
body{background:var(--sunk)}
.top{display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.top h1{font-size:1rem;font-weight:700}
.top .lab{margin-left:auto}
.top .swap{
  font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);background:none;border:1px solid var(--line-2);border-radius:2px;padding:3px 8px;
}
.wrap{padding:14px;display:flex;flex-direction:column;gap:18px;max-width:960px}
section > h2{
  font-family:"IBM Plex Mono",monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;
  color:var(--ink-3);font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;
}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 13px}
.row[data-state="applied"]{border-left:3px solid var(--hold)}
.row[data-state="contracted"]{border-left:3px solid var(--ready)}
.row[data-state="declined"]{border-left:3px solid var(--line-2);opacity:.6}
.row .name{font-weight:700;font-size:.94rem;flex:1;min-width:200px}
.row .name small{display:block;font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink-3);font-weight:400;margin-top:3px;line-height:1.5;overflow-wrap:anywhere}
.row .about{flex-basis:100%;font-size:.82rem;color:var(--ink-2);line-height:1.45;padding:6px 0 0;border-top:1px dashed var(--line)}
.row .btns{display:flex;gap:6px;flex-wrap:wrap}
.row .amount{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:.95rem;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.row[data-kind="refund"]{border-left:3px solid var(--stop)}
.row[data-kind="payout"]{border-left:3px solid var(--ready)}
.row[data-paid]{opacity:.6}
.row .terms{flex-basis:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding-top:8px;border-top:1px dashed var(--line)}
.row .terms label{font-size:.72rem;color:var(--ink-3);display:flex;flex-direction:column;gap:3px}
.row .terms input{font:inherit;font-size:.84rem;padding:7px 8px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);color:var(--ink)}
.row .terms .foot{grid-column:1 / -1;display:flex;gap:6px}
.row .code{
  flex-basis:100%;font-family:"IBM Plex Mono",monospace;font-size:.86rem;padding:8px 10px;
  background:var(--ready-soft);border:1px solid var(--ready-line);border-radius:3px;color:var(--ready);
}
.row .code b{font-size:1.2rem;letter-spacing:.14em}
.none{color:var(--ink-3);font-size:.84rem;padding:10px 0}
.new{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px}
.new .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.new label{display:flex;flex-direction:column;gap:4px;font-family:"IBM Plex Mono",monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.new label.wide{grid-column:1 / -1}
.new input,.new select{width:100%;padding:8px 9px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2);color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:.86rem;letter-spacing:0;text-transform:none}
.new .foot{display:flex;justify-content:flex-end;margin-top:10px;gap:10px;align-items:center}
/* ── the desk's sections, one at a time ── */
.tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto}
.tabs button{font-family:"Golos Text",sans-serif;font-size:.86rem;font-weight:600;padding:9px 12px;border:none;background:none;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[data-on]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.tabs .name{margin-left:auto;font:inherit;font-size:.8rem;padding:6px 8px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);color:var(--ink);width:150px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:12px 14px}
.card h3{font-family:"IBM Plex Mono",monospace;font-size:.66rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3);font-weight:500;margin:0 0 8px}
.card dl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin:0;font-size:.86rem}
.card dt{color:var(--ink-2)}
.card dd{margin:0;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right}
.card dd.money{color:var(--accent-ink);font-weight:600}
table.grid{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:4px;font-size:.84rem}
table.grid th{font-family:"IBM Plex Mono",monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.grid td{padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.grid td.n{font-family:"IBM Plex Mono",monospace;text-align:right}
table.grid tr[data-off] td{opacity:.55}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.filters input,.filters select{font:inherit;font-size:.86rem;padding:8px 10px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);color:var(--ink)}
.filters input[type="search"]{flex:1;min-width:200px}
.chips{display:flex;gap:6px}
.chips button{font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--line-2);border-radius:99px;background:var(--surface);color:var(--ink-3)}
.chips button[data-on]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.row.order{cursor:pointer}
.row.order:hover{border-color:var(--ink-3)}
.chip[data-s="PAID"]{color:var(--route);border-color:var(--route-line)}
.chip[data-s="PREPARING"]{color:var(--accent-ink);border-color:var(--accent-line)}
.chip[data-s="READY"],.chip[data-s="HANDED"],.chip[data-s="CLOSED"]{color:var(--ready);border-color:var(--ready-line)}
.chip[data-s="CANCELLED"],.chip[data-s="REFUNDED"]{color:var(--stop);border-color:var(--stop-line)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:14px;align-items:start}
@media(max-width:800px){.detail{grid-template-columns:1fr}}
.detail .back{background:none;border:none;color:var(--accent-ink);font-family:"Golos Text",sans-serif;font-weight:600;font-size:.9rem;padding:0 0 8px;cursor:pointer}
.story{list-style:none;padding:0;margin:0 0 0 6px;border-left:2px solid var(--line)}
.story li{position:relative;padding:3px 0 9px 14px;font-size:.86rem}
.story li::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:99px;background:var(--ready)}
.story .t{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-3);margin-right:8px}
.story small{display:block;font-size:.74rem;color:var(--ink-3)}
.acts{display:flex;flex-direction:column;gap:8px}
.acts select,.acts input{font:inherit;font-size:.86rem;padding:8px 10px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);color:var(--ink);width:100%}
.audit .row small{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-3)}
.pair{max-width:420px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:26px 24px;text-align:center}
.pair h2{font-size:1.1rem;margin-bottom:6px}
.pair p{color:var(--ink-2);font-size:.86rem;margin:0 0 18px;line-height:1.5}
.pair input{width:100%;font-family:"IBM Plex Mono",monospace;font-size:.95rem;padding:11px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2);color:var(--ink);margin-bottom:12px}
.pair .hint{font-size:.74rem;color:var(--ink-3);margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { api, store, toast, mnt, KIND, dayLabel } from '/api.js';

const root = document.getElementById('root');
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
const esc = (value) => {
  const node = document.createElement('span');
  node.textContent = value ?? '';
  return node.innerHTML;
};
const when = (iso) => (iso ? dayLabel(iso.slice(0, 10)) : '—');

const STATE = { applied: 'хүлээгдэж байна', contracted: 'гэрээт', declined: 'татгалзсан' };

/* ── the secret ──────────────────────────────────────────────────── */

async function showToken() {
  root.replaceChildren();
  // The demo hands its secret out; anywhere else a member signs in by phone.
  const demo = await api('/dev/ops-token').catch(() => null);
  if (demo?.token) {
    const card = el(`
      <div class="pair">
        <h2>Ops · демо</h2>
        <p>Демо горим: нууц үг автоматаар орлоо.</p>
        <input type="password" placeholder="OPS_TOKEN" aria-label="Ops нууц" autocomplete="off">
        <button class="btn" data-v="primary" data-size="lg" type="button">Нэвтрэх</button>
      </div>`);
    const input = card.querySelector('input');
    input.value = demo.token;
    const submit = async () => {
      store.opsToken = input.value.trim();
      try {
        ({ member: me } = await api('/v1/ops/me', { token: store.opsToken }));
        boot();
      } catch (error) {
        store.opsToken = null;
        toast(error.message, 'bad');
      }
    };
    card.querySelector('button').addEventListener('click', submit);
    input.addEventListener('keydown', (e) => e.key === 'Enter' && submit());
    root.append(card);
    return;
  }
  const card = el(`
    <div class="pair">
      <h2>Ops</h2>
      <p>Гишүүн утасны дугаараараа нэвтэрнэ. Дугаар руу нэг удаагийн код очно.</p>
      <input name="phone" inputmode="tel" placeholder="+976 XXXX XXXX" aria-label="Утас" autocomplete="tel">
      <input name="code" inputmode="numeric" maxlength="6" placeholder="Ирсэн код" aria-label="Код" autocomplete="one-time-code" hidden>
      <button class="btn" data-v="primary" data-size="lg" type="button" id="send">Код авах</button>
    </div>`);
  const phone = card.querySelector('[name="phone"]');
  const code = card.querySelector('[name="code"]');
  const send = card.querySelector('#send');
  let asked = false;
  const submit = async () => {
    try {
      if (!asked) {
        await api('/v1/auth/otp', { method: 'POST', body: { phone: phone.value.replace(/\s+/g, '') } });
        asked = true;
        code.hidden = false;
        send.textContent = 'Нэвтрэх';
        code.focus();
        return;
      }
      const { token: t } = await api('/v1/auth/verify', {
        method: 'POST',
        body: { phone: phone.value.replace(/\s+/g, ''), code: code.value.trim(), device: 'Ops' },
      });
      try {
        ({ member: me } = await api('/v1/ops/me', { token: t }));
      } catch {
        toast('Энэ дугаар ops-ийн гишүүн биш байна.', 'bad');
        return;
      }
      store.opsToken = t;
      boot();
    } catch (error) {
      toast(error.message, 'bad');
    }
  };
  send.addEventListener('click', submit);
  code.addEventListener('keydown', (e) => e.key === 'Enter' && submit());
  phone.addEventListener('keydown', (e) => e.key === 'Enter' && submit());
  root.append(card);
  phone.focus();
}

/* ── the desk ────────────────────────────────────────────────────── */

/**
 * The desk's own session: the demo's secret, or a member's sign-in — kept
 * under its own key, never the guest's, so a person who is both a guest
 * and a member keeps both, and a browser that is only a guest is simply
 * shown the door here.
 */
const token = () => store.opsToken;
const ops = (path, options = {}) => api(path, { ...options, token: token() });
let me = null;

const TABS = [
  { key: 'stats', label: 'Тоон үзүүлэлт' },
  { key: 'orders', label: 'Захиалгууд' },
  { key: 'suppliers', label: 'Нийлүүлэгчид' },
  { key: 'pay', label: 'Олголт, буцаалт' },
  { key: 'audit', label: 'Бүртгэл' },
  { key: 'members', label: 'Гишүүд', admin: true },
];
let tab = localStorage.getItem('basu.ops.tab') ?? 'stats';
let cache = { suppliers: [], settlements: [] };

async function refresh() {
  try {
    const [{ suppliers }, { settlements }, whoami] = await Promise.all([ops('/v1/ops/suppliers'), ops('/v1/ops/settlements'), ops('/v1/ops/me')]);
    cache = { suppliers, settlements };
    me = whoami.member;
  } catch (error) {
    if (error.status === 401 || error.status === 503) {
      store.opsToken = null;
      me = null;
      showToken();
      return;
    }
    toast(error.message, 'bad');
    return;
  }
  if (!document.querySelector('.tabs')) frame();
  show(tab);
}

function frame() {
  const f = el(`
    <div>
      <div class="top">
        <h1>Ops · идэш</h1>
        <span class="lab" id="tally"></span>
        <span class="lab" id="me">${esc(me?.name ?? '')}${me ? ` · ${ROLE_WORD[me.role] ?? me.role}` : ''}</span>
        <button class="swap" type="button" id="out">Гарах</button>
      </div>
      <nav class="tabs" aria-label="Хэсгүүд">
        ${TABS.filter((t) => !t.admin || me?.role === 'admin').map((t) => `<button type="button" data-tab="${t.key}">${t.label}</button>`).join('')}
      </nav>
      <div class="wrap" id="view"></div>
    </div>`);
  f.querySelector('#out').addEventListener('click', () => {
    store.opsToken = null;
    me = null;
    showToken();
  });
  f.querySelector('.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-tab]');
    if (b) show(b.dataset.tab);
  });
  root.replaceChildren(f);
}

function show(key) {
  tab = key;
  localStorage.setItem('basu.ops.tab', key);
  for (const b of document.querySelectorAll('.tabs button')) b.toggleAttribute('data-on', b.dataset.tab === key);
  const applied = cache.suppliers.filter((s) => s.state === 'applied').length;
  const toPay = cache.settlements.filter((t) => t.state !== 'paid').length;
  const tally = document.getElementById('tally');
  if (tally) tally.textContent = `${applied} хүсэлт · ${cache.suppliers.filter((s) => s.state === 'contracted').length} гэрээт · ${toPay} шилжүүлэх`;
  const view = document.getElementById('view');
  const scroll = window.scrollY;
  view.replaceChildren();
  ({ stats: renderStats, orders: renderOrders, suppliers: renderSuppliers, pay: renderPay, audit: renderAudit, members: renderMembers })[key]?.(view);
  window.scrollTo(0, scroll);
}

/* ── the numbers ── */

async function renderStats(view) {
  view.append(el('<div class="none">…</div>'));
  let st;
  try {
    st = await ops('/v1/ops/stats');
  } catch (error) {
    view.replaceChildren(el(`<div class="none">${esc(error.message)}</div>`));
    return;
  }
  if (tab !== 'stats') return;
  const tally = (title, t) => `
    <div class="card"><h3>${title}</h3><dl>
      <dt>Төлсөн захиалга</dt><dd>${t.paid}</dd>
      <dt>Борлуулалт</dt><dd class="money">${mnt(t.sales_mnt)}</dd>
      <dt>Хүлээлгэн өгсөн</dt><dd>${t.handed}</dd>
      <dt>Шимтгэл (Basu)</dt><dd class="money">${mnt(t.commission_mnt)}</dd>
      <dt>Цуцлагдсан</dt><dd>${t.cancelled}${t.cancelled ? ` <small>(нийлүүлэгч ${t.supplier_fault} · зочин ${t.guest_fault})</small>` : ''}</dd>
      <dt>Буцаалт</dt><dd>${mnt(t.refund_mnt)}</dd>
      <dt>Суутгал</dt><dd>${mnt(t.forfeit_mnt)}</dd>
    </dl></div>`;
  view.replaceChildren(
    el(`<section class="cards">${tally('Өнөөдөр', st.today)}${tally('Сүүлийн 7 хоног', st.week)}${tally('Улирал', st.season)}</section>`),
    el(`<section><h2><span>Нийлүүлэгч бүрээр</span></h2>
          <table class="grid"><thead><tr><th>Нийлүүлэгч</th><th>Төлсөн</th><th>Өгсөн</th><th>Цуцалсан</th><th>Өөрийн буруу</th><th>Ирээгүй зочин</th><th>Бэлэн болтол, цаг</th><th>Борлуулалт</th><th>Шимтгэл</th></tr></thead>
          <tbody>${st.suppliers
            .map(
              (r) => `<tr${r.active ? '' : ' data-off'}><td>${esc(r.name)}${r.active ? '' : ' · <b>түр зогссон</b>'}</td><td class="n">${r.paid}</td><td class="n">${r.handed}</td><td class="n">${r.cancelled}</td><td class="n">${r.supplier_fault}</td><td class="n">${r.no_shows}</td><td class="n">${r.ready_hours ?? '—'}</td><td class="n">${mnt(r.sales_mnt)}</td><td class="n">${mnt(r.commission_mnt)}</td></tr>`,
            )
            .join('') || '<tr><td colspan="9" class="none">Гэрээт нийлүүлэгч алга.</td></tr>'}</tbody></table>
        </section>`),
    el(`<section><h2><span>Махны төрлөөр (хүлээлгэн өгсөн)</span></h2>
          <table class="grid"><thead><tr><th>Төрөл</th><th>Хэмжээ</th><th>Захиалга</th><th>Борлуулалт</th></tr></thead>
          <tbody>${st.by_kind
            .map((k) => `<tr><td>${KIND[k.kind] ?? k.kind}</td><td class="n">${k.qty} ${k.unit === 'kg' ? 'кг' : 'толгой'}</td><td class="n">${k.orders}</td><td class="n">${mnt(k.sales_mnt)}</td></tr>`)
            .join('') || '<tr><td colspan="4" class="none">Одоогоор алга.</td></tr>'}</tbody></table>
        </section>`),
  );
}

/* ── every order ── */

let orderFilter = { scope: 'live', supplier: '', day: '', q: '' };
const STATE_WORD = {
  PAID: 'Төлсөн', PREPARING: 'Бэлтгэж байна', READY: 'Бэлэн', DISPATCHED: 'Замд',
  HANDED: 'Өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан', REFUNDED: 'Буцаасан',
};
const EVENT_WORD = {
  CREATED: 'Үүссэн', PAID: 'Төлсөн', PREPARING: 'Бэлтгэж эхэлсэн', READY: 'Бэлэн болсон', DISPATCHED: 'Замд гарсан',
  HANDED: 'Хүлээлгэн өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан', REFUND_DUE: 'Буцаалт үүссэн', REFUNDED: 'Буцаалт шилжүүлсэн', RESENT: 'Мэдэгдэл дахин илгээсэн',
};
const REASON = {
  guest_asked: 'Зочин хүссэн', vet: 'Мал эмнэлгийн шалгалт', cannot_fulfil: 'Нийлүүлэгч биелүүлж чадахгүй',
  no_show: 'Зочин ирээгүй', unreachable: 'Хаяг дээр холбогдоогүй', draft_expired: 'Төлөгдөөгүй',
};
const actorWord = (a) =>
  a.startsWith('guest:') ? 'зочин' : a.startsWith('supplier:owner:') ? 'нийлүүлэгч (утас)' : a.startsWith('supplier:') ? 'нийлүүлэгчийн дэлгэц' : a.startsWith('ops') ? a.replace('ops:', 'ops · ') : 'систем';

function renderOrders(view) {
  const suppliers = cache.suppliers.filter((s) => s.state === 'contracted');
  view.append(el(`
    <section>
      <div class="filters">
        <input type="search" id="q" placeholder="Код, утас, зочин, нийлүүлэгч, мах…" value="${esc(orderFilter.q)}" autocomplete="off">
        <select id="supplier"><option value="">Бүх нийлүүлэгч</option>${suppliers.map((s) => `<option value="${s.id}"${orderFilter.supplier === s.id ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
        <input type="date" id="day" value="${esc(orderFilter.day)}" title="Авах/хүргэх өдөр">
        <div class="chips">${[['live', 'Идэвхтэй'], ['done', 'Дууссан'], ['all', 'Бүгд']].map(([k, l]) => `<button type="button" data-scope="${k}"${orderFilter.scope === k ? ' data-on' : ''}>${l}</button>`).join('')}</div>
      </div>
      <div class="rows" id="orders"><div class="none">…</div></div>
    </section>`));
  let timer;
  view.querySelector('#q').addEventListener('input', (e) => {
    orderFilter.q = e.target.value;
    clearTimeout(timer);
    timer = setTimeout(loadOrders, 250);
  });
  view.querySelector('#supplier').addEventListener('change', (e) => ((orderFilter.supplier = e.target.value), loadOrders()));
  view.querySelector('#day').addEventListener('change', (e) => ((orderFilter.day = e.target.value), loadOrders()));
  view.querySelector('.chips').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-scope]');
    if (!b) return;
    orderFilter.scope = b.dataset.scope;
    for (const c of view.querySelectorAll('.chips button')) c.toggleAttribute('data-on', c === b);
    void loadOrders();
  });
  void loadOrders();
}

async function loadOrders() {
  const box = document.getElementById('orders');
  if (!box) return;
  const qs = new URLSearchParams({ scope: orderFilter.scope, q: orderFilter.q });
  if (orderFilter.supplier) qs.set('supplier', orderFilter.supplier);
  if (orderFilter.day) qs.set('day', orderFilter.day);
  let data;
  try {
    data = await ops(`/v1/ops/orders?${qs}`);
  } catch (error) {
    box.replaceChildren(el(`<div class="none">${esc(error.message)}</div>`));
    return;
  }
  if (!document.getElementById('orders')) return;
  box.replaceChildren();
  if (!data.orders.length) box.append(el('<div class="none">Захиалга алга.</div>'));
  for (const o of data.orders) {
    const row = el(`
      <div class="row order" data-order="${o.id}" data-s="${o.state}">
        <div class="name">№${o.code} · ${esc(o.title)} ×${o.qty}${o.unit === 'kg' ? ' кг' : ''}<small>${
          [o.supplier.name, o.guest, o.guest_phone, o.receive === 'delivery' ? 'хүргэлт' : 'өөрөө авна', dayLabel(o.receive_on)].filter(Boolean).map(esc).join(' · ')
        }</small></div>
        <span class="chip" data-s="${o.state}">${STATE_WORD[o.state] ?? o.state}</span>
        <span class="amount">${mnt(o.total_mnt)}</span>
      </div>`);
    row.addEventListener('click', () => openOrder(o.id));
    box.append(row);
  }
}

/** One order, its money, its story — and the three things ops may do to it. */
async function openOrder(id) {
  const view = document.getElementById('view');
  let d;
  try {
    d = await ops(`/v1/ops/orders/${id}`);
  } catch (error) {
    toast(error.message, 'bad');
    return;
  }
  const o = d.order;
  const live = ['PAID', 'PREPARING', 'READY', 'DISPATCHED'].includes(o.state);
  const page = el(`
    <section>
      <button class="back" type="button" id="back">‹ Захиалгууд</button>
      <div class="detail">
        <div>
          <div class="row" data-s="${o.state}">
            <div class="name">№${o.code} · ${esc(o.title)} ×${o.qty}${o.unit === 'kg' ? ' кг' : ''}<small>
              ${esc(o.supplier.name)} · ${o.guest ? esc(o.guest) : 'зочин'} · ${esc(o.guest_phone ?? '')}<br>
              ${o.receive === 'delivery' ? `Хүргэлт ${dayLabel(o.receive_on)}: ${esc(o.address)} · ${esc(o.address_phone)}` : `Өөрөө авна ${dayLabel(o.receive_on)}`}<br>
              Нийт ${mnt(o.total_mnt)}${o.delivery_fee_mnt ? ` (хүргэлт ${mnt(o.delivery_fee_mnt)})` : ''} · нийлүүлэгчид ${mnt(o.payout_mnt)}${
                o.cancel_reason ? `<br>Цуцлалт: ${REASON[o.cancel_reason] ?? o.cancel_reason} · буцаалт ${mnt(o.refund_mnt ?? 0)}${o.forfeit_mnt ? ` · суутгал ${mnt(o.forfeit_mnt)}` : ''}` : ''
              }</small></div>
            <span class="chip" data-s="${o.state}">${STATE_WORD[o.state] ?? o.state}</span>
          </div>
          <div class="lab" style="margin:14px 0 6px">Мөнгө</div>
          <div class="rows" id="money">${d.settlements.length ? '' : '<div class="none">Тооцоо үүсээгүй.</div>'}</div>
          <div class="lab" style="margin:14px 0 6px">Явц</div>
          <ol class="story">${d.events
            .map((e) => `<li><span class="t">${when(e.at)} ${clockOf(e.at)}</span><b>${EVENT_WORD[e.type] ?? e.type}</b><small>${actorWord(e.actor)}${e.payload?.reason ? ` · ${REASON[e.payload.reason] ?? e.payload.reason}` : ''}${e.payload?.state ? ` · ${STATE_WORD[e.payload.state] ?? ''}` : ''}</small></li>`)
            .join('')}</ol>
        </div>
        <div class="card acts" id="acts">
          <h3>Ops-ийн үйлдэл</h3>
          ${live ? `
          <input id="note" placeholder="Тэмдэглэл (бүртгэлд үлдэнэ)">
          <button class="btn" type="button" data-a="resend">Мэдэгдэл дахин илгээх</button>
          ${['READY', 'DISPATCHED'].includes(o.state) ? '<button class="btn" data-v="primary" type="button" data-a="hand">Хүлээлгэн өгсөн гэж тэмдэглэх</button>' : ''}
          <select id="reason"><option value="">Цуцлах шалтгаан…</option>${Object.entries(REASON).filter(([k]) => k !== 'draft_expired').map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
          <button class="btn" data-v="danger" type="button" data-a="cancel" disabled>Нийлүүлэгчийн өмнөөс цуцлах</button>
          ` : '<div class="none">Дууссан захиалгад үйлдэл алга.</div>'}
        </div>
      </div>
    </section>`);
  for (const t of d.settlements) page.querySelector('#money').append(renderSettlement(t));
  page.querySelector('#back').addEventListener('click', () => show('orders'));
  const acts = page.querySelector('#acts');
  const reason = acts.querySelector('#reason');
  reason?.addEventListener('change', () => (acts.querySelector('[data-a="cancel"]').disabled = !reason.value));
  acts.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    const action = b.dataset.a;
    const body = { note: acts.querySelector('#note')?.value ?? '' };
    if (action === 'cancel') body.reason = reason.value;
    if (action === 'cancel' && !confirm(`№${o.code}-г «${REASON[reason.value]}» шалтгаанаар цуцлах уу? Буцаалтыг дүрэм тогтооно.`)) return;
    b.disabled = true;
    try {
      await ops(`/v1/ops/orders/${id}/${action}`, { method: 'POST', body });
      toast('Болсон, бүртгэгдлээ.');
      await refresh();
      await openOrder(id);
    } catch (error) {
      toast(error.message, 'bad');
      b.disabled = false;
    }
  });
  view.replaceChildren(page);
}

function clockOf(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

/**
 * One thing to pay: who, how much, to which account, and the button that
 * says it was done. A refund without an account yet is shown but cannot be
 * paid — the guest has not said where.
 */
function renderSettlement(t) {
  const who = t.kind === 'payout' ? esc(t.supplier?.name ?? '') : `${esc(t.guest?.name ?? 'Зочин')} (зочин)`;
  const bank = t.bank_account ? `${esc(t.bank_name)} · ${esc(t.bank_account)} · ${esc(t.bank_holder)}` : 'данс алга';
  const row = el(`
    <div class="row" data-kind="${t.kind}" data-settlement="${t.id}"${t.state === 'paid' ? ' data-paid' : ''}>
      <div class="name">${esc(t.memo)} · ${who}<small>№${esc(t.order_code)} · ${bank}<br>${
        t.state === 'paid'
          ? `шилжүүлсэн ${when(t.paid_at)}${t.reference ? ` · ${esc(t.reference)}` : ''}`
          : t.state === 'needs_account'
            ? 'зочин дансаа оруулаагүй байна'
            : `үүссэн ${when(t.created_at)}`
      }</small></div>
      <span class="amount">${mnt(t.amount_mnt)}</span>
      <div class="btns"></div>
    </div>`);
  if (t.state === 'due') {
    const paid = el('<button class="btn" data-v="primary" type="button" data-a="paid">Шилжүүлсэн</button>');
    paid.addEventListener('click', async () => {
      const reference = prompt(`${mnt(t.amount_mnt)} → ${bank}\nБанкны гүйлгээний дугаар (заавал биш):`, '');
      if (reference === null) return;
      paid.disabled = true;
      try {
        await ops(`/v1/ops/settlements/${t.id}/paid`, { method: 'POST', body: { reference } });
        toast('Тэмдэглэгдлээ, мэдэгдэл явлаа.');
        await refresh();
      } catch (error) {
        toast(error.message, 'bad');
        paid.disabled = false;
      }
    });
    row.querySelector('.btns').append(paid);
  }
  return row;
}

function renderRow(s) {
  const row = el(`
    <div class="row" data-state="${s.state}" data-supplier="${s.id}">
      <div class="name">${esc(s.name)}<small>${esc(s.phone)}${s.merchant_tin ? ` · ТТД ${esc(s.merchant_tin)}` : ' · ТТД алга'} · ${esc(s.pickup_address)}<br>${
        s.state === 'applied'
          ? `хүсэлт ${when(s.applied_at)}`
          : s.state === 'contracted'
            ? `гэрээ ${when(s.contracted_at)} · ${s.listings} зар · ${s.watched ? 'дэлгэц холбогдсон' : 'дэлгэц холбогдоогүй'}`
            : `татгалзсан ${when(s.decided_at)}: ${esc(s.decline_reason)}`
      }</small></div>
      <span class="chip" data-s="${s.state === 'contracted' ? (s.active ? 'READY' : 'CANCELLED') : s.state === 'applied' ? 'PAID' : 'CANCELLED'}">${s.state === 'contracted' && !s.active ? 'түр зогссон' : STATE[s.state]}</span>
      <div class="btns"></div>
      ${s.about ? `<div class="about">${esc(s.about)}</div>` : ''}
      ${
        s.state !== 'declined'
          ? `<div class="about">Шимтгэл <b>${s.commission_pct}%</b> · Данс: ${
              s.bank_account ? `${esc(s.bank_name)} ${esc(s.bank_account)} · ${esc(s.bank_holder)}` : '<b>алга</b>'
            }</div>`
          : ''
      }
    </div>`);
  const buttons = row.querySelector('.btns');
  const act = async (path, body, done) => {
    try {
      const answer = await ops(path, { method: 'POST', body: body ?? {} });
      done?.(answer);
      await refresh();
    } catch (error) {
      toast(error.message, 'bad');
    }
  };
  const showCode = (answer) => {
    // The code is on its way by SMS; it is also here, in case the SMS is not.
    const code = answer?.pairing_code;
    if (code) {
      toast(`Батлагдлаа. Код ${code} — SMS-ээр илгээгдэнэ.`);
      sessionStorage.setItem(`ops.code.${s.id}`, code);
    }
  };

  if (s.state === 'applied') {
    const ok = el('<button class="btn" data-v="primary" type="button" data-a="approve">Батлах</button>');
    ok.addEventListener('click', () => act(`/v1/ops/suppliers/${s.id}/approve`, null, showCode));
    const no = el('<button class="btn" data-v="danger" type="button" data-a="decline">Татгалзах</button>');
    no.addEventListener('click', () => {
      const reason = prompt('Шалтгаан (нийлүүлэгчид SMS-ээр очно):', '');
      if (reason === null) return;
      act(`/v1/ops/suppliers/${s.id}/decline`, { reason });
    });
    buttons.append(ok, no);
  } else if (s.state === 'contracted') {
    const code = el('<button class="btn" type="button" data-a="code">Шинэ код</button>');
    code.addEventListener('click', () => act(`/v1/ops/suppliers/${s.id}/code`, null, showCode));
    buttons.append(code);
  }
  if (s.state === 'contracted') {
    // Off the market, or back on it — with the reason kept.
    const toggle = el(`<button class="btn" type="button" data-a="active"${s.active ? ' data-v="danger"' : ''}>${s.active ? 'Түр зогсоох' : 'Идэвхжүүлэх'}</button>`);
    toggle.addEventListener('click', () => {
      const note = prompt(s.active ? 'Түр зогсоох шалтгаан (бүртгэлд үлдэнэ):' : 'Идэвхжүүлэх тэмдэглэл:', '');
      if (note === null) return;
      act(`/v1/ops/suppliers/${s.id}/active`, { active: !s.active, note });
    });
    buttons.append(toggle);
    // Their listings, to look at and, if need be, hide.
    const stall = el('<button class="btn" type="button" data-a="listings">Зарууд</button>');
    stall.addEventListener('click', async () => {
      if (row.querySelector('.stall')) return row.querySelector('.stall').remove();
      const { listings } = await ops(`/v1/ops/suppliers/${s.id}/listings`);
      const box = el('<div class="about stall"></div>');
      if (!listings.length) box.append(el('<span>Зар алга.</span>'));
      for (const l of listings) {
        const line = el(`<div style="display:flex;gap:8px;align-items:center;padding:3px 0${l.active ? '' : ';opacity:.5'}"><span style="flex:1">${esc(l.title)} · ${mnt(l.price_mnt)}/${l.unit === 'kg' ? 'кг' : 'толгой'} · ${l.sold}/${l.quantity}${l.active ? '' : ' · нуусан'}</span></div>`);
        if (l.active) {
          const hide = el('<button class="btn" data-v="danger" type="button">Нуух</button>');
          hide.addEventListener('click', () => {
            const note = prompt('Нуух шалтгаан (бүртгэлд үлдэнэ):', '');
            if (note === null) return;
            act(`/v1/ops/listings/${l.id}/hide`, { note });
          });
          line.append(hide);
        }
        box.append(line);
      }
      row.append(box);
    });
    buttons.append(stall);
  }
  if (s.state !== 'declined') {
    // The contract's terms: written in once it is signed, corrected here.
    const terms = el('<button class="btn" type="button" data-a="terms">Нөхцөл</button>');
    terms.addEventListener('click', () => {
      if (row.querySelector('.terms')) return;
      const form = el(`
        <div class="terms">
          <label>Шимтгэл, %<input name="commission_pct" inputmode="decimal" value="${s.commission_pct}"></label>
          <label>ТТД<input name="tin" value="${esc(s.merchant_tin ?? '')}" placeholder="7–14 орон"></label>
          <label>Банк<input name="bank_name" value="${esc(s.bank_name ?? '')}"></label>
          <label>Данс<input name="bank_account" value="${esc(s.bank_account ?? '')}"></label>
          <label>Эзэмшигч<input name="bank_holder" value="${esc(s.bank_holder ?? '')}"></label>
          <div class="foot">
            <button class="btn" data-v="primary" type="button" data-a="save">Хадгалах</button>
            <button class="btn" type="button" data-a="close">Болих</button>
          </div>
        </div>`);
      form.querySelector('[data-a="close"]').addEventListener('click', () => form.remove());
      form.querySelector('[data-a="save"]').addEventListener('click', async () => {
        const v = (name) => form.querySelector(`[name="${name}"]`).value.trim();
        const body = { tin: v('tin'), bank_name: v('bank_name'), bank_account: v('bank_account'), bank_holder: v('bank_holder') };
        if (v('commission_pct') !== '') body.commission_pct = Number(v('commission_pct'));
        try {
          await ops(`/v1/ops/suppliers/${s.id}`, { method: 'PATCH', body });
          toast('Хадгалагдлаа.');
          await refresh();
        } catch (error) {
          toast(error.message, 'bad');
        }
      });
      row.append(form);
    });
    buttons.append(terms);
  }

  const remembered = sessionStorage.getItem(`ops.code.${s.id}`);
  if (remembered && s.state === 'contracted' && !s.watched) {
    row.append(el(`<div class="code">Дэлгэц холбох код <b>${remembered}</b> · 24 цаг</div>`));
  }
  return row;
}

        }
      });
      row.querySelector('.btns').append(b);
    }
    box.append(row);
  }
  const form = el(`
    <div class="new">
      <div class="grid">
        <label>Утас<input name="phone" placeholder="+976XXXXXXXX"></label>
        <label>Нэр<input name="name" placeholder="Нэр"></label>
        <label>Эрх<select name="role"><option value="ops">ops — захиалга, нийлүүлэгч</option><option value="finance">санхүү — олголт, буцаалт</option><option value="viewer">зөвхөн харах</option><option value="admin">админ</option></select></label>
      </div>
      <div class="foot"><button class="btn" data-v="primary" type="button" id="add-member">Гишүүн нэмэх</button></div>
    </div>`);
  form.querySelector('#add-member').addEventListener('click', async () => {
    const v = (n) => form.querySelector(`[name="${n}"]`).value.trim();
    try {
      await ops('/v1/ops/members', { method: 'POST', body: { phone: v('phone'), name: v('name'), role: v('role') } });
      toast('Нэмэгдлээ.');
      show('members');
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  view.append(form);
}

/* ── boot ────────────────────────────────────────────────────────── */

function boot() {
  root.replaceChildren();
  if (!token()) {
    showToken();
    return;
  }
  refresh();
}

boot();
</script>
</body>
</html>
