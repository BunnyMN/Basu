    <div class="detail">
      <div>
        <div class="card">
          <div class="facts">
            <div><div class="lab">Зочин</div><b>${esc(o.guest ?? 'зочин')}</b><br>${o.guest_phone ? tel(o.guest_phone) : ''}</div>
            <div><div class="lab">Ширээ</div><b>${o.table ? esc(o.table) : '—'}</b><br>${o.seated_at ? `суусан ${clockOf(o.seated_at)}` : 'суугаагүй'}</div>
            <div><div class="lab">Гал</div><b class="mono">${o.fire_at ? clockOf(o.fire_at) : '—'}</b><br>${o.fired_at ? `гарсан ${clockOf(o.fired_at)}` : o.late ? '<span class="ink-stop">хоцорч байна</span>' : o.fire_mode ?? 'товлоогүй'}</div>
            <div><div class="lab">Бэлэн</div><b class="mono">${o.ready_at ? clockOf(o.ready_at) : '—'}</b><br>${o.eta_at ? `ирэх ${clockOf(o.eta_at)}` : ''}</div>
            <div><div class="lab">Дүн</div><b>${money(o.total_mnt)}</b><br>түрийвчээс</div>
          </div>
        </div>
        <section class="section"><h2 class="section-label">Хоол</h2><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Нэр</th><th>Цех</th><th class="num">Тоо</th><th class="num">Үнэ</th></tr></thead><tbody>${d.lines
          .map((l) => `<tr${l.cancelled ? ' data-off' : ''}><td><b>${esc(l.name)}</b>${l.notes ? `<span class="sub">${esc(l.notes)}</span>` : ''}</td><td>${esc(l.station ?? '')}</td><td class="num">${l.qty}</td><td class="num">${money(l.unit_price_mnt * l.qty)}</td></tr>`)
          .join('')}</tbody></table></div></div></section>
        ${d.review ? `<section class="section"><h2 class="section-label">Үнэлгээ</h2><div class="card card-body">${stars(d.review.stars)} ${d.review.on_time === null ? '' : d.review.on_time ? '· цагтаа' : '· хоцорсон'}${d.review.comment ? `<br>${esc(d.review.comment)}` : ''}</div></section>` : ''}
        <section class="section"><h2 class="section-label">Явц</h2><div class="card card-body"><ol class="story stepper" data-stepper>${d.events
          .map((e) => step(e.type, DINE_EVENT[e.type] ?? e.type, `${e.actor ? esc(dineActor(e.actor)) : ''}${e.payload?.reason ? ` · ${esc(e.payload.reason)}` : ''}`, e.at))
          .join('')}</ol></div></section>
      </div>
      <div class="card" id="acts">
        <div class="card-head"><h3>Ops-ийн үйлдэл</h3></div>
        <div class="card-body acts">
          ${!can('desk.lunches:manage') ? '<div class="hint">Үйлдлийг ops, админ хийнэ.</div>' : DINE_FREE.includes(o.state) || ['ARMED', 'HELD', 'FIRED', 'COOKING', 'READY'].includes(o.state) ? `
          <label class="field"><span>Тэмдэглэл</span><input id="note" placeholder="Бүртгэлд үлдэнэ"></label>
          ${DINE_FREE.includes(o.state) ? '<button class="btn" data-v="danger" type="button" data-a="cancel">Зочны өмнөөс цуцлах</button><div class="hint">Гал дээр гараагүй тул мөнгө бүтэн түрийвч рүү буцна.</div>' : '<div class="hint">Гал дээр гарсан: цуцлах боломжгүй.</div>'}
          ${['ARMED', 'HELD', 'FIRED', 'COOKING', 'READY'].includes(o.state) ? '<div class="sep"></div><button class="btn" type="button" data-a="no-show">Зочин ирээгүй гэж тэмдэглэх</button><div class="hint">Ширээ суллагдана; мөнгө буцахгүй.</div>' : ''}

    const note = page.querySelector('#note')?.value.trim() ?? '';
    if (b.dataset.a === 'cancel' && !note) return toast('Шалтгаан бичнэ үү.', 'bad');
    if (!confirm(b.dataset.a === 'cancel' ? `№${o.code}-г цуцалж, ${mnt(o.total_mnt)}-г буцаах уу?` : `№${o.code}: зочин ирээгүй гэж тэмдэглэх үү?`)) return;
    try {
      await ops(`/v1/ops/dine/orders/${id}/${b.dataset.a}`, { method: 'POST', body: { note } });

      await openLunch(id);
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  view.append(page);
}

async function loadReviews() {
  const box = document.getElementById('reviews');

    return;
  }
  const table = el('<table class="table"><thead><tr><th>Огноо</th><th>Ресторан</th><th>Захиалга</th><th>Зочин</th><th>Од</th><th>Сэтгэгдэл</th></tr></thead><tbody></tbody></table>');
  const body = table.querySelector('tbody');
  for (const v of data.reviews) {

/** A CSV the browser saves, fetched with the desk's token because a plain link cannot carry one. */
async function download(path, name) {
  const res = await fetch(path, { headers: { authorization: `Bearer ${token()}` } });
  if (!res.ok) throw new Error('Экспорт амжилтгүй.');
  const url = URL.createObjectURL(await res.blob());
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function notifyLog() {
  const page = el(`<div class="card">
    <div class="tools">
      <input class="input search" type="search" id="q" placeholder="Утас эсвэл нэр…" value="${esc(msgFilter.q)}" autocomplete="off">

      <select class="input" id="state"><option value="">Бүх төлөв</option>${Object.entries(MSG_WORD).map(([k, l]) => `<option value="${k}"${msgFilter.state === k ? ' selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    <div id="messages"></div>
  </div>`);
  page.querySelector('#messages').append(busy());
  let timer;
  page.querySelector('#q').addEventListener('input', (e) => {
    msgFilter.q = e.target.value;
    clearTimeout(timer);
    timer = setTimeout(loadMessages, 250);
  });
  page.querySelector('#channel').addEventListener('change', (e) => ((msgFilter.channel = e.target.value), loadMessages()));

async function loadMessages() {
  const box = document.getElementById('messages');
  if (!box) return;
  const qs = new URLSearchParams();
  for (const [k, v] of Object.entries(msgFilter)) if (v) qs.set(k, v);
  let data;
  try {
    data = await ops(`/v1/ops/notify/messages?${qs}`);
  } catch (error) {
    box.replaceChildren(el(`<div class="empty">${esc(error.message)}</div>`));
    return;
  }
  if (!document.getElementById('messages')) return;
  if (!data.messages.length) {
    box.replaceChildren(el('<div class="empty"><b>Мэдэгдэл алга</b>Шүүлтэд тохирох мэдэгдэл байхгүй.</div>'));
    return;
  }
  const list = el('<ul class="log"></ul>');
  for (const m of data.messages) {
    list.append(el(`<li data-message="${m.id}"><span class="who">${m.channel === 'sms' ? 'SMS' : 'Push'}<small>${esc(m.guest ?? 'зочин')}<br><span class="mono">${esc(m.guest_phone ?? '')}</span></small></span>

  }
  list.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-retry]');
    if (!b) return;
    try {
      await ops(`/v1/ops/notify/messages/${b.dataset.retry}/retry`, { method: 'POST', body: {} });
      toast('Дараалалд буцаалаа. Дараагийн тойрогт илгээгдэнэ.', 'good');
      await loadMessages();
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  box.replaceChildren(list);
}

const REPORT_WORD = { armed: 'бэлтгэлд', planned: 'төлөвлөсөн', held: 'түр зогсоосон', fired: 'галласан', lateFires: 'хоцорсон', superseded: 'дахин төлөвлөсөн', relayed: 'outbox', notified: 'мэдэгдэл', receipts: 'е-баримт', abandoned: 'орхисон', ideshExpired: 'идэш хугацаа дууссан', ideshClosed: 'идэш хаагдсан', purged: 'цэвэрлэсэн', activitiesUpdated: 'карт шинэчилсэн', activitiesEnded: 'карт хаасан' };
/** Against the server's own clock: in the demo it runs ahead of the wall. */
const ago = (iso, nowIso) => {
  if (!iso) return 'хэзээ ч үгүй';
  const s = Math.max(0, Math.round((new Date(nowIso).getTime() - new Date(iso).getTime()) / 1000));
  if (s < 60) return `${s} сек өмнө`;
  if (s < 3600) return `${Math.round(s / 60)} мин өмнө`;
  if (s < 86400) return `${Math.round(s / 3600)} цаг өмнө`;
  return `${Math.round(s / 86400)} хоног өмнө`;
};

async function renderSystem(view) {
  view.append(head('Систем', 'Холболтууд, scheduler, өгөгдлийн сан, тохиргоо. Ямар нэг зүйл унавал энд эхлээд харагдана.'));

  if (!box) return;
  let s;
  try {
    s = await ops('/v1/ops/system');
  } catch (error) {
    box.replaceChildren(el(`<div class="card empty">${esc(error.message)}</div>`));
    return;
  }
  if (!document.getElementById('system')) return;
  const sch = s.scheduler;
  const page = el(`<div>
    <div class="kpis kpi-band" id="integrations">
      <div class="card kpi" data-word data-tone="${sch.ok ? 'good' : 'bad'}"><div class="lab">Scheduler</div><b>${sch.ok ? 'ажиллаж байна' : 'зогссон'}</b><span>сүүлийн тойрог ${ago(sch.last_at, s.now)}${sch.last_took_ms !== null ? ` · ${sch.last_took_ms} мс` : ''} · цагт ${sch.ticks_last_hour}${s.mode === 'demo' ? ' · demo: тойрог гараар' : ''}</span></div>

      <div class="card kpi"><div class="lab">Өгөгдлийн сан</div><b>${esc(s.database.size)}</b><span>${s.database.migrations} migration · сүүлийнх ${esc(s.database.last_migration ?? '—')}</span></div>

    <div class="pair-cols">
      <section class="section"><h2 class="section-label">Сүүлийн 24 цаг</h2><div class="card"><div class="table-wrap"><table class="table"><tbody>
        <tr><td>Галласан</td><td class="num">${sch.day.fired}</td></tr>
        <tr><td>Хоцорч галласан</td><td class="num${sch.day.lateFires ? ' ink-stop' : ''}">${sch.day.lateFires}</td></tr>
        <tr><td>Түр зогсоосон</td><td class="num">${sch.day.held}</td></tr>
        <tr><td>Мэдэгдэл илгээсэн</td><td class="num">${sch.day.notified}</td></tr>
        <tr><td>Е-баримт гаргасан</td><td class="num">${sch.day.receipts}</td></tr>
      </tbody></table></div></div>
      <h2 class="section-label">Процесс</h2><div class="card"><div class="table-wrap"><table class="table"><tbody>
        <tr><td>Горим</td><td class="num"><span class="pill" data-s="${s.mode === 'production' ? 'contracted' : 'PAID'}">${s.mode === 'production' ? 'production' : 'demo'}</span></td></tr>
        <tr><td>Хувилбар</td><td class="num">${esc(s.version)} · node ${esc(s.node)}</td></tr>
        <tr><td>Асаасан</td><td class="num">${when(s.started_at)} ${clockOf(s.started_at)}</td></tr>
        <tr><td>Идэшний дүрэм</td><td class="end">шимтгэл ${s.rules.commission_pct}% · суутгал ${s.rules.forfeit_pct}% · ирээгүй ${s.rules.no_show_days} хоног</td></tr>
      </tbody></table></div></div></section>
      <section class="section"><h2 class="section-label">Тохиргоо</h2><div class="card card-body" id="settings">${s.settings

    </div>
  </div>`);
  page.querySelector('#save-settings')?.addEventListener('click', async (e) => {
    e.target.disabled = true;
    try {

        const before = s.settings.find((k) => k.key === input.dataset.key);
        if (String(before.value) === input.value) continue;
        await ops(`/v1/ops/system/settings/${input.dataset.key}`, { method: 'PUT', body: { value: input.value } });
      }
      toast('Хадгаллаа.', 'good');
      await drawSystem();
    } catch (error) {
      toast(error.message, 'bad');
      e.target.disabled = false;
    }
  });
  box.replaceChildren(page);
}

let orderFilter = { scope: 'live', supplier: '', day: '', q: '' };

function renderOrders(view) {
  const suppliers = cache.suppliers.filter((s) => s.state === 'contracted');
  view.append(head('Захиалгууд', 'Бүх нийлүүлэгчийн захиалга нэг цонхонд.'));
  view.append(el(`
    <div class="card">
      <div class="tools">
        <input class="input search" type="search" id="q" placeholder="Код, утас, зочин, нийлүүлэгч, мах…" value="${esc(orderFilter.q)}" autocomplete="off">
        <select class="input" id="supplier"><option value="">Бүх нийлүүлэгч</option>${suppliers.map((s) => `<option value="${s.id}"${orderFilter.supplier === s.id ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select>
        <input class="input" type="date" id="day" value="${esc(orderFilter.day)}" title="Авах, хүргэх өдөр">
        <div class="seg">${[['live', 'Идэвхтэй'], ['done', 'Дууссан'], ['all', 'Бүгд']].map(([k, l]) => `<button type="button" data-scope="${k}"${orderFilter.scope === k ? ' data-on' : ''}>${l}</button>`).join('')}</div>
      </div>
      <div id="orders" class="table-wrap"></div>
    </div>`));
  view.querySelector('#orders').append(busy());
  let timer;
  view.querySelector('#q').addEventListener('input', (e) => {
    orderFilter.q = e.target.value;
    clearTimeout(timer);
    timer = setTimeout(loadOrders, 250);
  });
  view.querySelector('#supplier').addEventListener('change', (e) => ((orderFilter.supplier = e.target.value), loadOrders()));
  view.querySelector('#day').addEventListener('change', (e) => ((orderFilter.day = e.target.value), loadOrders()));
  view.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-scope]');
    if (!b) return;
    orderFilter.scope = b.dataset.scope;
    for (const c of view.querySelectorAll('.seg button')) c.toggleAttribute('data-on', c === b);
    void loadOrders();
  });
  void loadOrders();
}

async function loadOrders() {
  const box = document.getElementById('orders');
  if (!box) return;
  const qs = new URLSearchParams({ scope: orderFilter.scope, q: orderFilter.q });
  if (orderFilter.supplier) qs.set('supplier', orderFilter.supplier);
  if (orderFilter.day) qs.set('day', orderFilter.day);
  let data;
  try {
    data = await ops(`/v1/ops/orders?${qs}`);
  } catch (error) {
    box.replaceChildren(el(`<div class="empty">${esc(error.message)}</div>`));
    return;
  }
  if (!document.getElementById('orders')) return;
  if (!data.orders.length) {
    box.replaceChildren(el('<div class="empty"><b>Захиалга алга</b>Шүүлтэд тохирох захиалга байхгүй.</div>'));
    return;
  }
  const table = el(`<table class="table"><thead><tr><th>Захиалга</th><th>Нийлүүлэгч</th><th>Зочин</th><th>Өдөр</th><th>Төлөв</th><th class="num">Дүн</th></tr></thead><tbody></tbody></table>`);
  const body = table.querySelector('tbody');
  for (const o of data.orders) {
    const tr = el(`
      <tr data-link data-order="${o.id}">
        <td><b class="mono">№${o.code}</b><span class="sub">${esc(o.title)} ×${o.qty}${o.unit === 'kg' ? ' кг' : ''}</span></td>
        <td>${esc(o.supplier.name)}</td>
        <td>${esc(o.guest ?? 'зочин')}<span class="sub mono">${esc(o.guest_phone ?? '')}</span></td>
        <td><span class="mono">${dayLabel(o.receive_on)}</span><span class="sub">${o.receive === 'delivery' ? 'хүргэлт' : 'өөрөө авна'}</span></td>
        <td><span class="pill" data-s="${o.state}">${STATE_WORD[o.state] ?? o.state}</span></td>
        <td class="num">${money(o.total_mnt)}</td>
      </tr>`);
    tr.addEventListener('click', () => openOrder(o.id));
    body.append(tr);
  }
  box.replaceChildren(table);
}

/** One order, its money, its story — and the three things ops may do to it. */
async function openOrder(id) {
  const view = document.getElementById('view');
  let d;
  try {
    d = await ops(`/v1/ops/orders/${id}`);
  } catch (error) {
    toast(error.message, 'bad');
    return;
  }
  const o = d.order;
  const live = ['PAID', 'PREPARING', 'READY', 'DISPATCHED'].includes(o.state);
  view.replaceChildren();
  const back = el(`<button class="back link" type="button" id="back">${CHEV}Захиалгууд</button>`);
  back.addEventListener('click', () => show('orders'));
  view.append(back);
  view.append(head(`№${o.code} <span class="pill" data-s="${o.state}">${STATE_WORD[o.state] ?? o.state}</span>`, `${esc(o.title)} ×${o.qty}${o.unit === 'kg' ? ' кг' : ''} · ${esc(o.supplier.name)}`));
  const page = el(`
    <div class="detail">
      <div>
        <div class="card">
          <div class="facts">
            <div><div class="lab">Зочин</div><b>${esc(o.guest ?? 'зочин')}</b><br>${o.guest_phone ? tel(o.guest_phone) : ''}</div>
            <div><div class="lab">${o.receive === 'delivery' ? 'Хүргэх' : 'Өөрөө авах'}</div><b>${dayLabel(o.receive_on)}</b><br>${o.receive === 'delivery' ? `${esc(o.address)} · <span class="mono">${esc(o.address_phone)}</span>` : 'нийлүүлэгчийн авах цэгээс'}</div>
            <div><div class="lab">Нийт төлсөн</div><b>${money(o.total_mnt)}</b><br>${o.delivery_fee_mnt ? `хүргэлт ${mnt(o.delivery_fee_mnt)} орсон` : 'хүргэлтгүй'}</div>
            <div><div class="lab">Нийлүүлэгчид</div><b>${money(o.payout_mnt)}</b><br>шимтгэл хассан</div>
            ${o.cancel_reason ? `<div><div class="lab">Цуцлалт</div><b>${REASON[o.cancel_reason] ?? o.cancel_reason}</b><br>буцаалт ${mnt(o.refund_mnt ?? 0)}${o.forfeit_mnt ? ` · суутгал ${mnt(o.forfeit_mnt)}` : ''}</div>` : ''}
          </div>
        </div>
        <section class="section"><h2 class="section-label">Мөнгө</h2><div class="rows" id="money" data-rows>${d.settlements.length ? '' : '<div class="card empty">Тооцоо үүсээгүй — хүлээлгэн өгснөөс хойш нэг хоногт үүснэ.</div>'}</div></section>
        <section class="section"><h2 class="section-label">Явц</h2><div class="card card-body"><ol class="story stepper" data-stepper>${d.events
          .map((e) => step(e.type, EVENT_WORD[e.type] ?? e.type, `${actorWord(e.actor)}${e.payload?.reason ? ` · ${REASON[e.payload.reason] ?? e.payload.reason}` : ''}${e.payload?.state ? ` · ${STATE_WORD[e.payload.state] ?? ''}` : ''}`, e.at))
          .join('')}</ol></div></section>
      </div>
      <div class="card" id="acts">
        <div class="card-head"><h3>Ops-ийн үйлдэл</h3></div>
        <div class="card-body acts">
          ${live && !can('desk.orders:manage') ? '<div class="hint">Үйлдлийг ops, админ хийнэ.</div>' : live ? `
          <label class="field"><span>Тэмдэглэл</span><input id="note" placeholder="Бүртгэлд үлдэнэ"></label>
          <button class="btn" type="button" data-a="resend">Мэдэгдэл дахин илгээх</button>
          ${['READY', 'DISPATCHED'].includes(o.state) ? '<button class="btn" data-v="primary" type="button" data-a="hand">Хүлээлгэн өгсөн гэж тэмдэглэх</button>' : ''}
          <div class="sep"></div>
          <label class="field"><span>Нийлүүлэгчийн өмнөөс цуцлах</span><select id="reason"><option value="">Шалтгаан сонгох…</option>${Object.entries(REASON).filter(([k]) => k !== 'draft_expired').map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
          <button class="btn" data-v="danger" type="button" data-a="cancel" disabled>Цуцлах</button>
          <div class="hint">Буцаалтын дүнг шалтгаан ба дүрэм тогтооно; хүн сонгохгүй.</div>
          ` : '<div class="hint">Дууссан захиалгад үйлдэл алга.</div>'}
        </div>
      </div>
    </div>`);
  for (const t of d.settlements) page.querySelector('#money').append(renderSettlement(t));
  const acts = page.querySelector('#acts');
  const reason = acts.querySelector('#reason');
  reason?.addEventListener('change', () => (acts.querySelector('[data-a="cancel"]').disabled = !reason.value));
  acts.addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-a]');
    if (!b) return;
    const action = b.dataset.a;
    const body = { note: acts.querySelector('#note')?.value ?? '' };
    if (action === 'cancel') body.reason = reason.value;
    if (action === 'cancel' && !confirm(`№${o.code}-г «${REASON[reason.value]}» шалтгаанаар цуцлах уу? Буцаалтыг дүрэм тогтооно.`)) return;
    b.disabled = true;
    try {
      await ops(`/v1/ops/orders/${id}/${action}`, { method: 'POST', body });
      toast('Болсон, бүртгэгдлээ.');
      await refresh();
      await openOrder(id);
    } catch (error) {
      toast(error.message, 'bad');
      b.disabled = false;
    }
  });
  view.append(page);
}

/* ── suppliers ── */

function renderSuppliers(view) {
  const applied = cache.suppliers.filter((s) => s.state === 'applied');
  const rest = cache.suppliers.filter((s) => s.state !== 'applied');
  view.append(head('Нийлүүлэгчид', `${applied.length} хүсэлт · ${rest.filter((s) => s.state === 'contracted').length} гэрээт`));
  view.append(
    el(`<section class="section" id="applied"><h2 class="section-label">Хүсэлт</h2><div class="rows" data-rows></div></section>`),
    el(`<section class="section" id="all"><h2 class="section-label">Нийлүүлэгчид</h2><div class="rows" data-rows></div></section>`),
    el(`<section class="section" id="new"><h2 class="section-label">Шинэ нийлүүлэгч, гэрээтэй</h2></section>`),
  );
  const pending = view.querySelector('#applied .rows');
  if (!applied.length) pending.append(el('<div class="card empty">Хүлээгдэж буй хүсэлт алга.</div>'));
  for (const s of applied) pending.append(renderRow(s));
  const list = view.querySelector('#all .rows');
  if (!rest.length) list.append(el('<div class="card empty">Нийлүүлэгч алга.</div>'));
  for (const s of rest) list.append(renderRow(s));
  if (can('desk.suppliers:manage')) view.querySelector('#new').append(newForm());
  else view.querySelector('#new').remove();
}

function renderRow(s) {
  const status = s.state === 'contracted' ? (s.active ? 'contracted' : 'off') : s.state;
  const row = el(`
    <div class="card row" data-state="${s.state}" data-supplier="${s.id}">
      <div class="name">${esc(s.name)}<small><span class="mono">${esc(s.phone)}</span>${s.merchant_tin ? ` · ТТД <span class="mono">${esc(s.merchant_tin)}</span>` : ' · ТТД алга'} · ${esc(s.pickup_address)}<br>${
        s.state === 'applied'
          ? `хүсэлт ${when(s.applied_at)}`
          : s.state === 'contracted'
            ? `гэрээ ${when(s.contracted_at)} · ${s.listings} зар · ${s.watched ? 'дэлгэц холбогдсон' : 'дэлгэц холбогдоогүй'}`
            : `татгалзсан ${when(s.decided_at)}: ${esc(s.decline_reason)}`
      }</small></div>
      <div class="right"><span class="pill" data-s="${status}">${s.state === 'contracted' && !s.active ? 'түр зогссон' : STATE[s.state]}</span><div class="btns"></div></div>
      ${s.about ? `<div class="about">${esc(s.about)}</div>` : ''}
      ${
        s.state !== 'declined'
          ? `<div class="about">Шимтгэл <b>${s.commission_pct}%</b> · Данс: ${
              s.bank_account ? `<b>${esc(s.bank_name)} <span class="mono">${esc(s.bank_account)}</span></b> · ${esc(s.bank_holder)}${s.bank_verified ? '' : ' <span class="pill" data-s="warn">баталгаажаагүй</span>'}` : '<b>алга</b>'
            }</div>`
          : ''
      }
    </div>`);
  const buttons = row.querySelector('.btns');
  const act = async (path, body, done) => {
    try {
      const answer = await ops(path, { method: 'POST', body: body ?? {} });
      done?.(answer);
      await refresh();
    } catch (error) {
      toast(error.message, 'bad');
    }
  };
  const showCode = (answer) => {
    // The code is on its way by SMS; it is also here, in case the SMS is not.
    const code = answer?.pairing_code;
    if (code) {
      toast(`Батлагдлаа. Код ${code} — SMS-ээр илгээгдэнэ.`);
      sessionStorage.setItem(`ops.code.${s.id}`, code);
    }
  };
  const small = (label, attrs = '') => el(`<button class="btn" data-size="sm" type="button" ${attrs}>${label}</button>`);
  // One action in view, the rest behind ⋯ — every button stays in the DOM.
  const folded = more();
  const menu = folded.querySelector('.menu');
  const fold = (button) => {
    button.dataset.v = 'quiet';
    menu.append(button);
  };

  // Each button only for a seat that may press it: ops runs the suppliers, finance the contract's money.
  const runs = can('desk.suppliers:manage');
  const signs = can('desk.suppliers:terms');
  if (s.state === 'applied' && runs) {
    const ok = el('<button class="btn" data-v="primary" data-size="sm" type="button" data-a="approve">Батлах</button>');
    ok.addEventListener('click', () => act(`/v1/ops/suppliers/${s.id}/approve`, null, showCode));
    const no = el('<button class="btn" data-v="quiet" data-size="sm" type="button" data-a="decline">Татгалзах</button>');
    no.addEventListener('click', () => {
      const reason = prompt('Шалтгаан (нийлүүлэгчид SMS-ээр очно):', '');
      if (reason === null) return;
      act(`/v1/ops/suppliers/${s.id}/decline`, { reason });
    });
    buttons.append(ok, no);
  }
  if (s.state === 'contracted' && s.bank_account && !s.bank_verified && signs) {
    // A changed account pays out nothing until somebody holds it up against the contract.
    const check = el('<button class="btn" data-size="sm" type="button" data-a="bank-verify">Данс баталгаажуулах</button>');
    check.addEventListener('click', () => {
      if (!confirm(`${s.name}: ${s.bank_name} ${s.bank_account} (${s.bank_holder}) гэрээний данстай таарч байна уу?`)) return;
      act(`/v1/ops/suppliers/${s.id}/bank-verify`, { note: 'гэрээтэй тулгасан' });
    });
    buttons.append(check);
  }
  if (s.state === 'contracted') {
    if (runs) {
      const code = small('Шинэ код', 'data-a="code"');
      code.addEventListener('click', () => act(`/v1/ops/suppliers/${s.id}/code`, null, showCode));
      fold(code);
    }
    // Their listings, to look at and, if need be, hide.
    const stall = small('Зарууд', 'data-a="listings"');
    stall.addEventListener('click', async () => {
      if (row.querySelector('.stall')) return row.querySelector('.stall').remove();
      const { listings } = await ops(`/v1/ops/suppliers/${s.id}/listings`);
      const box = el('<div class="drawer stall"></div>');
      if (!listings.length) box.append(el('<span class="muted">Зар алга.</span>'));
      for (const l of listings) {
        const line = el(`<div class="stall-line"${l.active ? '' : ' data-off'}><span>${esc(l.title)} · ${money(l.price_mnt)}/${l.unit === 'kg' ? 'кг' : 'толгой'} · <span class="mono">${l.sold}/${l.quantity}</span>${l.active ? '' : ' · нуусан'}</span></div>`);
        if (l.active && runs) {
          const hide = el('<button class="btn" data-v="quiet" data-size="sm" type="button">Нуух</button>');
          hide.addEventListener('click', () => {
            const note = prompt('Нуух шалтгаан (бүртгэлд үлдэнэ):', '');
            if (note === null) return;
            act(`/v1/ops/listings/${l.id}/hide`, { note });
          });
          line.append(hide);
        }
        box.append(line);
      }
      row.append(box);
    });
    buttons.append(stall);
    // Off the market, or back on it — with the reason kept.
    const toggle = el(`<button class="btn${s.active ? ' ink-stop' : ''}" data-size="sm" type="button" data-a="active">${s.active ? 'Түр зогсоох' : 'Идэвхжүүлэх'}</button>`);
    toggle.addEventListener('click', () => {
      const note = prompt(s.active ? 'Түр зогсоох шалтгаан (бүртгэлд үлдэнэ):' : 'Идэвхжүүлэх тэмдэглэл:', '');
      if (note === null) return;
      act(`/v1/ops/suppliers/${s.id}/active`, { active: !s.active, note });
    });
    if (runs) fold(toggle);
  }
  if (s.state !== 'declined' && signs) {
    // The contract's terms: written in once it is signed, corrected here.
    const terms = small('Нөхцөл', 'data-a="terms"');
    terms.addEventListener('click', () => {
      if (row.querySelector('.terms')) return row.querySelector('.terms').remove();
      const form = el(`
        <div class="drawer terms">
          <div class="fields">
            <label class="field"><span>Шимтгэл, %</span><input name="commission_pct" inputmode="decimal" value="${s.commission_pct}"></label>
            <label class="field"><span>ТТД</span><input name="tin" inputmode="numeric" value="${esc(s.merchant_tin ?? '')}" placeholder="7–14 орон"></label>
            <label class="field"><span>Банк</span><input name="bank_name" value="${esc(s.bank_name ?? '')}"></label>
            <label class="field"><span>Данс</span><input name="bank_account" inputmode="numeric" value="${esc(s.bank_account ?? '')}"></label>
            <label class="field"><span>Эзэмшигч</span><input name="bank_holder" value="${esc(s.bank_holder ?? '')}"></label>
          </div>
          <div class="form-foot">
            <button class="btn" data-v="quiet" type="button" data-a="close">Болих</button>
            <button class="btn" data-v="primary" type="button" data-a="save">Хадгалах</button>
          </div>
        </div>`);
      form.querySelector('[data-a="close"]').addEventListener('click', () => form.remove());
      form.querySelector('[data-a="save"]').addEventListener('click', async () => {
        const v = (name) => form.querySelector(`[name="${name}"]`).value.trim();
        const body = { tin: v('tin'), bank_name: v('bank_name'), bank_account: v('bank_account'), bank_holder: v('bank_holder') };
        if (v('commission_pct') !== '') body.commission_pct = Number(v('commission_pct'));
        try {
          await ops(`/v1/ops/suppliers/${s.id}`, { method: 'PATCH', body });
          toast('Хадгалагдлаа.');
          await refresh();
        } catch (error) {
          toast(error.message, 'bad');
        }
      });
      row.append(form);
    });
    fold(terms);
  }
  if (menu.childElementCount) buttons.append(folded);

  const remembered = sessionStorage.getItem(`ops.code.${s.id}`);
  if (remembered && s.state === 'contracted' && !s.watched) {
    row.append(el(`<div class="code">Дэлгэц холбох код<b class="mono">${remembered}</b> · 24 цаг</div>`));
  }
  return row;
}

function renderPay(view) {
  const due = cache.settlements.filter((t) => t.state === 'due');
  const waiting = cache.settlements.filter((t) => t.state === 'needs_account');
  const paid = cache.settlements.filter((t) => t.state === 'paid');
  view.append(head('Олголт, буцаалт', 'Basu-гийн банкаар гараар шилжүүлж, энд «Шилжүүлсэн» гэж тэмдэглэнэ.'));
  view.append(el(`<div class="kpis kpi-band">
    <div class="card kpi"><div class="lab">Шилжүүлэх ёстой</div><b>${money(due.reduce((s, t) => s + t.amount_mnt, 0))}</b><span>${due.length} мөр, данс бэлэн</span></div>
    <div class="card kpi"><div class="lab">Данс хүлээж байна</div><b>${money(waiting.reduce((s, t) => s + t.amount_mnt, 0))}</b><span>${waiting.length} буцаалт — зочин дансаа оруулаагүй</span></div>
    <div class="card kpi"><div class="lab">Шилжүүлсэн (30 хоног)</div><b>${money(paid.reduce((s, t) => s + t.amount_mnt, 0))}</b><span>${paid.length} мөр</span></div>
  </div>`));
  const section = el('<section id="pay" class="section"><div class="rows" data-rows></div></section>');
  const rows = section.querySelector('.rows');
  if (!cache.settlements.length) rows.append(el('<div class="card empty"><b>Шилжүүлэх зүйл алга</b>Хүлээлгэн өгсөн захиалгын олголт, цуцлагдсан захиалгын буцаалт энд гарна.</div>'));
  for (const t of cache.settlements) rows.append(renderSettlement(t));
  view.append(section);
}

/**
 * One thing to pay: who, how much, to which account, and the button that
 * says it was done. A refund without an account yet is shown but cannot be
 * paid — the guest has not said where.
 */
function renderSettlement(t) {
  const who = t.kind === 'payout' ? esc(t.supplier?.name ?? '') : `${esc(t.guest?.name ?? 'Зочин')} (зочин)`;
  const bank = t.bank_account ? `${esc(t.bank_name)} · ${esc(t.bank_account)} · ${esc(t.bank_holder)}` : 'данс алга';
  const bankHtml = t.bank_account ? `${esc(t.bank_name)} · <span class="mono">${esc(t.bank_account)}</span> · ${esc(t.bank_holder)}` : 'данс алга';
  const status = t.state === 'paid' ? ['paid', 'шилжүүлсэн'] : t.state === 'needs_account' ? ['needs_account', 'данс хүлээж байна'] : !t.bank_verified ? ['warn', 'данс баталгаажаагүй'] : t.approved_at ? ['due', 'шилжүүлэх'] : ['hold', 'батлах хүлээж байна'];
  const releasedBy = t.approved_by ? esc(t.approved_by.replace('ops:', '')) : null;
  const row = el(`
    <div class="card row" data-kind="${t.kind}" data-settlement="${t.id}"${t.state === 'paid' ? ' data-paid' : ''}>
      <div class="name">${esc(t.memo)} · ${who}<small><span class="mono">№${esc(t.order_code)}</span> · ${bankHtml}<br>${
        t.state === 'paid'
          ? `шилжүүлсэн ${when(t.paid_at)}${t.reference ? ` · гүйлгээ <span class="mono">${esc(t.reference)}</span>` : ''}`
          : t.state === 'needs_account'
            ? 'зочин аппаар дансаа оруулмагц шилжүүлж болно'
            : releasedBy
              ? `<b>${releasedBy}</b> баталсан ${when(t.approved_at)} — өөр гишүүн шилжүүлнэ`
              : `үүссэн ${when(t.created_at)}`
      }</small></div>
      <div class="right"><span class="amount">${money(t.amount_mnt)}</span><span class="pill" data-s="${status[0]}">${status[1]}</span><div class="btns"></div></div>
    </div>`);
  if (t.state === 'due' && t.bank_verified && !t.approved_at && can('desk.pay:approve')) {
    // Two people, not one: releasing the money and sending it are different
    // hands, so the row only ever offers the half that is this member's.
    const approve = el('<button class="btn" data-v="primary" data-size="sm" type="button" data-a="approve">Батлах</button>');
    approve.addEventListener('click', async () => {
      if (!confirm(`${mnt(t.amount_mnt)} → ${bank}\nЭнэ олголтыг батлах уу? Шилжүүлэхийг өөр гишүүн хийнэ.`)) return;
      approve.disabled = true;
      try {
        await ops(`/v1/ops/settlements/${t.id}/approve`, { method: 'POST', body: {} });
        toast('Батлагдлаа. Одоо өөр гишүүн шилжүүлж тэмдэглэнэ.', 'good');
        await refresh();
      } catch (error) {
        toast(error.message, 'bad');
        approve.disabled = false;
      }
    });
    row.querySelector('.btns').append(approve);
  }
  if (t.state === 'due' && t.bank_verified && t.approved_at && can('desk.pay:approve')) {
    const paid = el('<button class="btn" data-v="primary" data-size="sm" type="button" data-a="paid">Шилжүүлсэн</button>');
    paid.addEventListener('click', async () => {
      const reference = prompt(`${mnt(t.amount_mnt)} → ${bank}\nБанкны гүйлгээний дугаар (заавал биш):`, '');
      if (reference === null) return;
      paid.disabled = true;
      try {
        await ops(`/v1/ops/settlements/${t.id}/paid`, { method: 'POST', body: { reference } });
        toast('Тэмдэглэгдлээ, мэдэгдэл явлаа.');
        await refresh();
      } catch (error) {
        toast(error.message, 'bad');
        paid.disabled = false;
      }
    });
    row.querySelector('.btns').append(paid);
  }
  return row;
}

/** Asks for a seat, answered here: yes with a role, or no with a reason. */
async function renderRequests(view) {
  let requests;
  try {
    ({ requests } = await ops('/v1/ops/requests'));
  } catch (error) {
    toast(error.message, 'bad');
    return;
  }
  cache.requests = requests;
  badges();
  const roles = await deskRoleList();
  const section = el(`<section class="section"><h2 class="section-label">Эрхийн хүсэлт${requests.length ? ` · ${requests.length}` : ''}</h2><div class="card" data-rows id="requests"></div></section>`);
  const list = section.querySelector('#requests');
  if (!requests.length) list.append(el('<div class="empty">Хүлээгдэж буй хүсэлт алга. Хүн dashboard-д нэвтэрч «Эрх хүсэх» дарахад энд гарна.</div>'));
  for (const r of requests) {
    const row = el(`
      <div class="row request" data-request="${r.id}">
        <div class="main">
          <div class="title">${esc(r.name)}${r.contact ? ` <span class="who-contact">${esc(r.contact)}</span>` : ''}</div>
          ${r.note ? `<p class="cap">${esc(r.note)}</p>` : ''}
          <div class="req-actions">
            <select class="input" aria-label="Олгох эрх">${roles.map((x) => roleOption(x, r.role)).join('')}</select>
            <button class="btn" data-v="primary" type="button" data-a="approve">Зөвшөөрөх</button>
            <span class="gap" aria-hidden="true"></span>
            <input class="input" name="reason" placeholder="Татгалзах шалтгаан" aria-label="Татгалзах шалтгаан">
            <button class="btn" data-v="quiet" type="button" data-a="decline">Татгалзах</button>
          </div>
        </div>
        <div class="end"><span class="meta">${when(r.created_at)} ${clockOf(r.created_at)}</span></div>
      </div>`);
    row.querySelector('[data-a="approve"]').addEventListener('click', async () => {
      try {
        const done = await ops(`/v1/ops/requests/${r.id}/approve`, { method: 'POST', body: { role: row.querySelector('select').value } });
        toast(`${done.member.name}: ${roles.find((x) => x.key === done.member.role)?.name ?? done.member.role} эрх олголоо.`, 'good');
        show('members');
      } catch (error) {
        toast(error.message, 'bad');
      }
    });
    row.querySelector('[data-a="decline"]').addEventListener('click', async () => {
      try {
        await ops(`/v1/ops/requests/${r.id}/decline`, { method: 'POST', body: { reason: row.querySelector('[name="reason"]').value.trim() } });
        toast('Татгалзлаа.');
        show('members');
      } catch (error) {
        toast(error.message, 'bad');
      }
    });
    list.append(row);
  }
  view.append(section);
}

async function renderMembers(view) {
  view.append(head('Гишүүд', 'Хэн энэ хуудсанд орж, юу хийж болох вэ. Хүн өөрөө нэвтэрч эрх хүсдэг — та зөвшөөрнө.'));
  await renderRequests(view);
  view.append(el('<section class="section"><h2 class="section-label">Гишүүд</h2><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Нэр</th><th>Утас, имэйл</th><th>Эрх</th><th>Төлөв</th><th></th></tr></thead><tbody id="members"><tr><td colspan="5" class="empty">…</td></tr></tbody></table></div></div></section>'));
  let data;
  try {
    data = await ops('/v1/ops/members');
  } catch (error) {
    view.querySelector('#members').replaceChildren(el(`<tr><td colspan="5" class="empty">${esc(error.message)}</td></tr>`));
    return;
  }
  const body = view.querySelector('#members');
  if (!body) return;
  const roleNames = new Map((await deskRoleList()).map((r) => [r.key, r.name]));
  body.replaceChildren();
  if (!data.members.length) body.append(el('<tr><td colspan="5" class="empty">Гишүүн алга. Хүн нэвтэрч эрх хүсэхэд дээр гарч ирнэ.</td></tr>'));
  for (const m of data.members) {
    const address = [m.phone ? `<span class="mono">${esc(m.phone)}</span>` : '', m.email ? `<span>${esc(m.email)}</span>` : ''].filter(Boolean).join('<br>');
    // Named but not in yet: the address has not signed in.
    const state = !m.active ? ['off', 'хаасан'] : m.joined ? ['contracted', 'идэвхтэй'] : ['applied', 'ороогүй'];
    const tr = el(`<tr${m.active ? '' : ' data-off'}><td><b>${esc(m.name)}</b></td><td>${address}</td><td data-role>${esc(roleNames.get(m.role) ?? m.role)}</td><td><span class="pill" data-s="${state[0]}">${state[1]}</span></td><td class="num"></td></tr>`);
    if (m.id !== me?.id) {
      // Anybody else's role is a choice here, from the desk's roles; your own is another admin's to change.
      const pick = el(`<select class="input" data-size="sm" aria-label="${esc(m.name)}-ийн эрх">${[...roleNames.keys()].map((k) => `<option value="${esc(k)}"${k === m.role ? ' selected' : ''}>${esc(roleNames.get(k))}</option>`).join('')}</select>`);
      pick.addEventListener('change', async () => {
        try {
          await ops(`/v1/ops/members/${m.id}/role`, { method: 'POST', body: { role: pick.value } });
          toast(`${m.name}: ${roleNames.get(pick.value) ?? pick.value} эрхтэй боллоо.`, 'good');
          m.role = pick.value;
        } catch (error) {
          pick.value = m.role;
          toast(error.message, 'bad');
        }
      });
      tr.querySelector('[data-role]').replaceChildren(pick);
    }
    if (m.id !== me?.id) {
      const b = el(`<button class="btn" data-size="sm" type="button"${m.active ? ' data-v="quiet"' : ''}>${m.active ? 'Хаах' : 'Нээх'}</button>`);
      b.addEventListener('click', async () => {
        try {
          await ops(`/v1/ops/members/${m.id}/active`, { method: 'POST', body: { active: !m.active } });
          show('members');
        } catch (error) {
          toast(error.message, 'bad');
        }
      });
      tr.lastElementChild.append(b);
    }
    body.append(tr);
  }
  const form = el(`
    <section class="section"><h2 class="section-label">Имэйлээр урьдчилан нэмэх</h2><div class="card"><div class="card-body">
      <p class="cap" style="margin:0 0 14px">Ихэнхдээ хэрэггүй — хүн өөрөө нэвтэрч эрх хүсдэг. Имэйлийг нь мэдэж байвал энд нэмэхэд тэр хаягаар (Google эсвэл имэйл код) нэвтэрмэгц эрх нь нээгдэнэ.</p>
      <div class="fields">
        <label class="field"><span>Нэр</span><input name="name" placeholder="Нэр"></label>
        <label class="field"><span>Имэйл</span><input name="email" type="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="нэр@gmail.com"></label>
        <label class="field"><span>Эрх</span><select name="role">${[...roleNames.keys()].map((k) => `<option value="${esc(k)}"${k === 'ops' ? ' selected' : ''}>${esc(roleNames.get(k))}</option>`).join('')}</select></label>
      </div>
      <div class="form-foot"><button class="btn" type="button" id="add-member">Нэмэх</button></div>
    </div></div></section>`);
  form.querySelector('#add-member').addEventListener('click', async () => {
    const v = (n) => form.querySelector(`[name="${n}"]`).value.trim();
    try {
      const added = await ops('/v1/ops/members', { method: 'POST', body: { email: v('email'), name: v('name'), role: v('role') } });
      toast(`${added.name} нэмэгдлээ. ${added.email} хаягаар нэвтэрмэгц эрх нь нээгдэнэ.`, 'good');
      await show('members');
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  view.append(form);
  // What each role opens, before a role is handed to anybody: made and changed on the roles page.
  if (hasPage('roles')) {
    const go = el('<p class="cap" style="margin-top:20px" id="desk-roles">Үүрэг бүр ямар хуудас, үйлдэл нээхийг <a class="link" href="#desk/roles">«Үүрэг, эрх»</a> хуудсанд үүсгэж, засна.</p>');
    go.querySelector('a').addEventListener('click', (e) => {
      e.preventDefault();
      show('roles');
    });
    view.append(go);
    return;
  }
  try {
    const table = await ops('/v1/access/roles?scope=desk');
    if (tab !== 'members') return;
    const roles = matrixTable(table);
    roles.prepend(el('<h2 class="section-label">Эрх бүр юу хийдэг</h2>'));
    roles.id = 'desk-roles';
    view.append(roles);
  } catch {
    /* the page stands without the table */
  }
}

/* ── boot ─────────────────────────────────────────────────────────── */

/**
 * Signed in or not; and if so, where this person works. The server says
 * which places and which pages; the page opens the one the address names,
 * or the one used last.
 */
async function boot() {
  root.replaceChildren();
  clearInterval(frontPoll);
  if (!token()) {
    // Back from Google with a session: in, whoever it is.
    const back = authReturn?.token;
    if (back && !boot.tried) {
      boot.tried = true;
      enterDesk(back);
      return;
    }
    showToken();
    return;
  }
  try {
    access = await ops('/v1/access');
  } catch (error) {
    if (error.status === 401 || error.status === 503) {
      store.opsToken = null;
      showToken();
      return;
    }
    toast(error.message, 'bad');
    return;
  }
  const { w, page } = choose(location.hash);
  open(w, page);
}

// A link from the supplier's screen, or the back button: the address names another place or page.
addEventListener('hashchange', () => {
  if (!access) return;
  const { w, page } = choose(location.hash);
  if (w && (w.id !== ws?.id || (page && page !== tab))) open(w, page);
});

boot();
</script>
</body>
</html>
