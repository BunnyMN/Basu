  'supplier.suspend': 'Нийлүүлэгчийг түр зогсоосон', 'supplier.activate': 'Нийлүүлэгчийг идэвхжүүлсэн', 'supplier.terms': 'Гэрээний нөхцөл өөрчилсөн',
  'supplier.bank_verify': 'Данс баталгаажуулсан', 'listing.hide': 'Зар нуусан', 'member.upsert': 'Гишүүн нэмсэн', 'member.approve': 'Ops эрх олгосон', 'org.approve': 'Байгууллага баталсан', 'org.decline': 'Байгууллага татгалзсан', 'member.decline': 'Эрхийн хүсэлт татгалзсан', 'member.activate': 'Гишүүн нээсэн', 'member.deactivate': 'Гишүүн хаасан',
};

async function renderAudit(view) {
  view.append(head('Бүртгэл', 'Ops-ийн хийсэн үйлдэл бүр — хэн, хэзээ, юуг, ямар тэмдэглэлтэй.'));
  view.append(el('<ul class="log" id="audit" data-rows><li class="empty">…</li></ul>'));
  let data;
  try {
    data = await ops('/v1/ops/audit?limit=200');
  } catch (error) {
    view.querySelector('#audit').replaceChildren(el(`<li class="empty">${esc(error.message)}</li>`));
    return;
  }
  const box = view.querySelector('#audit');
  if (!box) return;
  box.replaceChildren();
  if (!data.audit.length) box.append(el('<li class="empty">Одоогоор юу ч хийгээгүй.</li>'));
  for (const a of data.audit) {
    box.append(el(`<li><span class="who">${esc(a.who.replace('ops:', ''))}</span><div>${ACTION[a.action] ?? esc(a.action)}${a.note ? `<small>${esc(a.note)}</small>` : ''}</div><span class="when meta">${when(a.at)} ${clockOf(a.at)}</span></li>`));
  }
}

/* ── the members ── */

/** Asks for a seat, answered here: yes with a role, or no with a reason. */
async function renderRequests(view) {
  let requests;
  try {
    ({ requests } = await ops('/v1/ops/requests'));
  } catch (error) {
    toast(error.message, 'bad');
    return;
  }
  cache.requests = requests;
  badges();
  const section = el(`<section class="section"><h2 class="section-label">Эрхийн хүсэлт${requests.length ? ` · ${requests.length}` : ''}</h2><div class="card" data-rows id="requests"></div></section>`);
  const list = section.querySelector('#requests');
  if (!requests.length) list.append(el('<div class="empty">Хүлээгдэж буй хүсэлт алга. Хүн dashboard-д нэвтэрч «Эрх хүсэх» дарахад энд гарна.</div>'));
  for (const r of requests) {
    const row = el(`
      <div class="row request" data-request="${r.id}">
        <div class="main">
          <div class="title">${esc(r.name)}${r.contact ? ` <span class="who-contact">${esc(r.contact)}</span>` : ''}</div>
          ${r.note ? `<p class="cap">${esc(r.note)}</p>` : ''}
          <div class="req-actions">
            <select class="input" aria-label="Олгох эрх">${ROLE_ASK.map(([k, l]) => `<option value="${k}"${k === r.role ? ' selected' : ''}>${l}</option>`).join('')}</select>
            <button class="btn" data-v="primary" type="button" data-a="approve">Зөвшөөрөх</button>
            <span class="gap" aria-hidden="true"></span>
            <input class="input" name="reason" placeholder="Татгалзах шалтгаан" aria-label="Татгалзах шалтгаан">
            <button class="btn" data-v="quiet" type="button" data-a="decline">Татгалзах</button>
          </div>
        </div>
        <div class="end"><span class="meta">${when(r.created_at)} ${clockOf(r.created_at)}</span></div>
      </div>`);
    row.querySelector('[data-a="approve"]').addEventListener('click', async () => {
      try {
        const done = await ops(`/v1/ops/requests/${r.id}/approve`, { method: 'POST', body: { role: row.querySelector('select').value } });
        toast(`${done.member.name}: ${ROLE_WORD[done.member.role] ?? done.member.role} эрх олголоо.`, 'good');
        show('members');
      } catch (error) {
        toast(error.message, 'bad');
      }
    });
    row.querySelector('[data-a="decline"]').addEventListener('click', async () => {
      try {
        await ops(`/v1/ops/requests/${r.id}/decline`, { method: 'POST', body: { reason: row.querySelector('[name="reason"]').value.trim() } });
        toast('Татгалзлаа.');
        show('members');
      } catch (error) {
        toast(error.message, 'bad');
      }
    });
    list.append(row);
  }
  view.append(section);
}

async function renderMembers(view) {
  view.append(head('Гишүүд', 'Хэн энэ хуудсанд орж, юу хийж болох вэ. Хүн өөрөө нэвтэрч эрх хүсдэг — та зөвшөөрнө.'));
  await renderRequests(view);
  view.append(el('<section class="section"><h2 class="section-label">Гишүүд</h2><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Нэр</th><th>Утас, имэйл</th><th>Эрх</th><th>Төлөв</th><th></th></tr></thead><tbody id="members"><tr><td colspan="5" class="empty">…</td></tr></tbody></table></div></div></section>'));
  let data;
  try {
    data = await ops('/v1/ops/members');
  } catch (error) {
    view.querySelector('#members').replaceChildren(el(`<tr><td colspan="5" class="empty">${esc(error.message)}</td></tr>`));
    return;
  }
  const body = view.querySelector('#members');
  if (!body) return;
  body.replaceChildren();
  if (!data.members.length) body.append(el('<tr><td colspan="5" class="empty">Бүртгэлтэй гишүүн алга. Доорх маягтаар нэмнэ.</td></tr>'));
  for (const m of data.members) {
    const address = [m.phone ? `<span class="mono">${esc(m.phone)}</span>` : '', m.email ? `<span>${esc(m.email)}</span>` : ''].filter(Boolean).join('<br>');
    // Named but not in yet: the invite is unused, or the address has not signed in.
    const state = !m.active ? ['off', 'хаасан'] : m.joined ? ['contracted', 'идэвхтэй'] : ['applied', 'ороогүй'];
    const tr = el(`<tr${m.active ? '' : ' data-off'}><td><b>${esc(m.name)}</b></td><td>${address}</td><td>${ROLE_WORD[m.role] ?? m.role}</td><td><span class="pill" data-s="${state[0]}">${state[1]}</span></td><td class="num"></td></tr>`);
    if (m.id !== me?.id) {
      const b = el(`<button class="btn" data-size="sm" type="button"${m.active ? ' data-v="quiet"' : ''}>${m.active ? 'Хаах' : 'Нээх'}</button>`);
      b.addEventListener('click', async () => {
        try {
          await ops(`/v1/ops/members/${m.id}/active`, { method: 'POST', body: { active: !m.active } });
          show('members');
        } catch (error) {
          toast(error.message, 'bad');
        }
      });
      tr.lastElementChild.append(b);
    }
    body.append(tr);
  }
  const form = el(`
    <section class="section"><h2 class="section-label">Гараар нэмэх</h2><div class="card"><div class="card-body">
      <div class="fields">
        <label class="field"><span>Нэр</span><input name="name" placeholder="Нэр"></label>
        <label class="field"><span>Имэйл · Google-ээр нэвтэрнэ</span><input name="email" type="email" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="нэр@gmail.com"></label>
        <label class="field"><span>Утас · урилгын кодоор нэвтэрнэ</span><input name="phone" type="tel" placeholder="+976XXXXXXXX"></label>
        <label class="field"><span>Эрх</span><select name="role"><option value="ops">ops — захиалга, нийлүүлэгч</option><option value="finance">санхүү — олголт, буцаалт, данс</option><option value="viewer">зөвхөн харах</option><option value="admin">админ</option></select></label>
      </div>
      <div class="form-foot"><button class="btn" type="button" id="add-member">Гишүүн нэмэх</button></div>
    </div></div></section>`);
  form.querySelector('#add-member').addEventListener('click', async () => {
    const v = (n) => form.querySelector(`[name="${n}"]`).value.trim();
    try {
      const added = await ops('/v1/ops/members', {
        method: 'POST',
        body: { phone: v('phone'), email: v('email'), name: v('name'), role: v('role') },
      });
      await show('members');
      const view = document.getElementById('view');
      if (!added.invite_code) {
        // Named by address: the address proves itself, no code to hand over.
        view.prepend(el(`
          <div class="callout" data-k="ok" id="invite-shown" style="margin-bottom:16px">
            <div><b>${esc(added.name)} нэмэгдлээ.</b>
            <span>Тэр хүн dashboard-ын хаалган дээр «Google-ээр нэвтрэх» дарж (эсвэл имэйлээр код авч) ${esc(added.email ?? '')} хаягаараа орно. Урилгын код хэрэггүй.</span></div>
          </div>`));
        return;
      }
      // The code is shown once and never again: it lives only as a hash.
      // The admin reads it to the new member, who redeems it on this door.
      view.prepend(el(`
        <div class="callout" data-k="ok" id="invite-shown" style="margin-bottom:16px">
          <div><b>${esc(added.name)}-д өгөх урилгын код: <span class="mono" style="font-size:1.25rem;letter-spacing:.08em">${esc(added.invite_code)}</span></b>
          <span>Энэ кодыг зөвхөн тэр хүнд, нууцаар хэлээрэй. 24 цаг хүчинтэй, нэг удаа. Тэр хүн dashboard-ын хаалган дээр «Урилгын код байгаа юу?» дарж, өөрийн утас (${esc(added.phone)}), шинэ нууц үгтэйгээ оруулна. Энэ код дахин харагдахгүй.</span></div>
        </div>`));
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  view.append(form);
}

/* ── boot ─────────────────────────────────────────────────────────── */

async function boot() {
  root.replaceChildren();
  clearInterval(frontPoll);
  if (!token()) {
    // Back from Google with a session: in, whoever it is.
    const back = authReturn?.token;
    if (back && !boot.tried) {
      boot.tried = true;
      enterDesk(back);
      return;
    }
    showToken();
    return;
  }
  // A member sits at the desk; anybody else signed in stands in the front room.
  try {
    ({ member: me } = await ops('/v1/ops/me'));
  } catch (error) {
    if (error.status !== 401) {
      toast(error.message, 'bad');
      return;
    }
    try {
      showFrontRoom(await ops('/v1/ops/whoami'));
    } catch {
      store.opsToken = null;
      me = null;
      showToken();
    }
    return;
  }
  refresh();
}

boot();
</script>
