<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Basu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
/* The home screen. Basu is one app with several things inside it, and this is
   the page that says which ones exist. It owns no domain logic: everything
   here is a name, an icon and a link — plus whatever of the guest's is
   currently running, because a launcher that cannot tell you your lunch is on
   the fire is just a menu of links. */

body{min-height:100dvh}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom))}

/* ── the brand line ───────────────────────────────────────────────── */
.top{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.top h1{
  font-size:1.6rem;font-weight:900;letter-spacing:-.05em;
  /* The wordmark is the accent; nothing else on this page competes with it. */
  color:var(--accent-ink);
}
.top .city{
  font-family:"IBM Plex Mono",monospace;font-size:.66rem;text-transform:uppercase;
  letter-spacing:.16em;color:var(--ink-3);
}
.hello{font-size:.94rem;color:var(--ink-2);margin:0 0 22px}

/* ── the grid of apps ─────────────────────────────────────────────── */
h2.sec{
  font-family:"IBM Plex Mono",monospace;font-size:.66rem;font-weight:500;
  text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3);
  margin:0 0 10px;
}
.apps{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));
  gap:14px 10px;margin:0 0 26px;padding:0;list-style:none;
}
.app{display:block;text-decoration:none;color:inherit;text-align:center}
.app .tile{
  aspect-ratio:1;display:grid;place-items:center;border-radius:18px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  transition:transform .14s ease,border-color .14s ease;
}
.app:hover .tile{transform:translateY(-2px);border-color:var(--accent-line)}
.app:active .tile{transform:translateY(0)}
.app .tile svg{width:38px;height:38px;stroke:var(--accent);fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.app .name{display:block;font-size:.82rem;font-weight:600;margin-top:7px;letter-spacing:-.01em}
.app .tag{
  display:block;font-family:"IBM Plex Mono",monospace;font-size:.6rem;
  color:var(--ink-3);margin-top:1px;
}
@media (prefers-reduced-motion:reduce){.app .tile{transition:none}}

/* ── what of the guest's is running ───────────────────────────────── */
.live{margin-bottom:26px}
.live:not([data-any]){display:none}
.card{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:4px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:inherit;
  box-shadow:var(--shadow);
}
.card:hover{border-color:var(--line-2);border-left-color:var(--accent)}
.card .who{min-width:0;flex:1}
.card .venue{display:block;font-weight:700;font-size:.94rem;letter-spacing:-.02em;overflow-wrap:anywhere}
.card .what{display:block;font-size:.78rem;color:var(--ink-2);margin-top:2px}
.card .code{
  display:flex;align-items:center;gap:6px;margin-top:5px;
  font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--ink-3);
}
.card .when{
  font-family:"IBM Plex Mono",monospace;font-size:1.02rem;font-weight:600;
  font-variant-numeric:tabular-nums;flex:none;color:var(--accent-ink);
}
.card .when small{display:block;font-size:.56rem;font-weight:400;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);text-align:right;margin-top:2px}

/* ── the quiet bottom of the page ─────────────────────────────────── */
.staff{border-top:1px solid var(--line);padding-top:14px;display:flex;gap:14px;align-items:center}
.staff a{
  font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--ink-3);
  text-decoration:none;border-bottom:1px solid transparent;
}
.staff a:hover{color:var(--ink-2);border-bottom-color:var(--line-2)}
</style>
</head>
<body>

<main class="wrap">
  <div class="top">
    <h1>Basu</h1>
    <span class="city">Улаанбаатар</span>
  </div>
  <p class="hello" id="hello">Өнөөдөр юу хийх вэ?</p>

  <section class="live" id="live">
    <h2 class="sec">Идэвхтэй</h2>
    <div id="live-list"></div>
  </section>

  <h2 class="sec">Аппууд</h2>
  <ul class="apps" id="apps"></ul>

  <div class="staff">
    <a href="/kds">Гал тогооны дэлгэц →</a>
  </div>
</main>

<script type="module">
import { api, store, hhmm, mountClock, HEADLINE } from '/api.js';

const $ = (id) => document.getElementById(id);
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};

/**
 * Everything inside Basu, in the order it appears on the home screen.
 *
 * A list rather than markup because this is the file that will grow: the
 * second app is a new entry here and nothing else. Icons are inline so a
 * launcher never waits on a network round trip to draw itself.
 */
const APPS = [
  {
    id: 'dine',
    name: 'Хоол',
    tag: 'урьдчилсан',
    href: '/dine',
    // A bowl with steam over it: the whole product in one glyph.
    icon: `<svg viewBox="0 0 24 24" aria-hidden="true">
             <path d="M3.5 11h17c0 4.4-3.8 7.5-8.5 7.5S3.5 15.4 3.5 11Z"/>
             <path d="M2.5 11h19"/>
             <path d="M9 7.5c0-1 1-1.4 1-2.4S9 3.5 9 3.5"/>
             <path d="M13.5 8c0-1.2 1.2-1.7 1.2-2.9s-1.2-1.6-1.2-1.6"/>
           </svg>`,
  },
];

for (const app of APPS) {
  const item = el(`
    <li>
      <a class="app" href="${app.href}" data-app="${app.id}">
        <span class="tile">${app.icon}</span>
        <span class="name">${app.name}</span>
        <span class="tag">${app.tag}</span>
      </a>
    </li>`);
  $('apps').append(item);
}

/* ── what is already running ──────────────────────────────────────── */

/**
 * The states that carry a time worth putting in the corner of the card, and
 * what that time is called. Anything else gets the slot it was booked for.
 */
function moment(order) {
  if (['FIRED', 'COOKING'].includes(order.state) && order.ready_at) {
    return [hhmm(order.ready_at), 'бэлэн'];
  }
  if (order.fire_at && !['READY', 'SERVED'].includes(order.state)) {
    return [hhmm(order.fire_at), 'гал'];
  }
  return [hhmm(order.slot_starts_at), 'суух'];
}

const SUB = {
  SCHEDULED: 'Энэ цагт гал дээр гарна',
  ARMED: 'Та замд гарсан уу?',
  COOKING: 'Хоол хийгдэж байна',
};

/**
 * The guest's live orders, if there is a guest.
 *
 * No session is created here: signing in is the dine-in app's business, and a
 * launcher that quietly makes an account for anyone who opens it would be
 * lying about what a visit costs. No token simply means nothing to show.
 */
async function loadLive() {
  const token = store.guestToken;
  if (!token) return paint([]);
  try {
    const { orders } = await api('/v1/orders', { token });
    paint(orders);
  } catch (error) {
    // A token from a reseeded database is dead, not a reason to shout at
    // somebody who has only just opened the app.
    if (error.status === 401) store.guestToken = null;
    paint([]);
  }
}

function paint(orders) {
  const list = $('live-list');
  list.replaceChildren();
  if (!orders.length) {
    $('live').removeAttribute('data-any');
    return;
  }
  $('live').dataset.any = String(orders.length);

  for (const order of orders) {
    const [word, cap] = HEADLINE[order.state] ?? [order.state, ''];
    const [time, label] = moment(order);
    const card = el(`
      <a class="card" href="/dine?order=${order.id}">
        <span class="who">
          <span class="venue">${order.restaurant.name}</span>
          <span class="what">${SUB[order.state] ?? cap ?? ''}</span>
          <span class="code">№${order.code}<span class="chip" data-s="${order.state}">${word}</span></span>
        </span>
        <span class="when">${time}<small>${label}</small></span>
      </a>`);
    list.append(card);
  }
}

/* ── boot ─────────────────────────────────────────────────────────── */

mountClock(() => void loadLive());
void loadLive();

/**
 * The kitchen accepts and fires without anybody touching this page, so the
 * strip has to keep asking. It stops when the page is hidden and when it goes
 * away — a launcher left open in a background tab should cost nothing.
 */
const poll = setInterval(() => {
  if (!document.hidden) void loadLive();
}, 4000);
addEventListener('pagehide', () => clearInterval(poll));
</script>
</body>
</html>
