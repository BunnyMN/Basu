<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Basu — үдийн хоол</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.css">
<link rel="stylesheet" href="/app.css">
<style>
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column}

/* The map is the page: the product is "which lunch is five minutes away",
   and that is a question about a place before it is one about a menu. */
#map{flex:1;min-height:0;position:relative;background:#f5f3ef}
#map .maplibregl-ctrl-group{border-radius:3px;box-shadow:var(--shadow)}
#map .maplibregl-ctrl-attrib{font-size:10px}

.badge{
  position:absolute;top:12px;left:12px;z-index:5;
  background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:8px 12px;box-shadow:var(--shadow);max-width:calc(100% - 24px);
}
.badge b{display:block;font-size:.92rem;font-weight:800;letter-spacing:-.02em}
.badge span{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--ink-3)}

/* The walk, when a venue is open and we know where the guest is. */
.walk{
  display:flex;align-items:center;gap:8px;margin-top:6px;
  font-family:"IBM Plex Mono",monospace;font-size:.74rem;color:var(--route);
}
.walk b{font-weight:600;font-variant-numeric:tabular-nums}
.walk .guess{color:var(--ink-3)}

/* ── the sheet a pin opens ──────────────────────────────────────── */
.scrim{
  position:fixed;inset:0;z-index:20;background:rgba(10,14,16,.45);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.scrim[data-open]{opacity:1;pointer-events:auto}

.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  background:var(--surface);border-top:1px solid var(--line);
  border-radius:10px 10px 0 0;box-shadow:0 -12px 34px -18px rgba(0,0,0,.5);
  max-height:86vh;display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.25,1);
}
.sheet[data-open]{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
@media(min-width:640px){
  .sheet{left:50%;right:auto;width:520px;transform:translate(-50%,100%)}
  .sheet[data-open]{transform:translate(-50%,0)}
}

.grip{display:flex;justify-content:center;padding:8px 0 2px;flex:none}
.grip i{width:38px;height:4px;border-radius:99px;background:var(--line-2)}

.sheet header{
  display:flex;align-items:flex-start;gap:12px;padding:6px 18px 14px;
  border-bottom:1px solid var(--line);flex:none;
}
.sheet header h2{font-size:1.15rem;font-weight:800;letter-spacing:-.03em}
.sheet header .sub{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-3);margin-top:3px}
.sheet header .x{
  margin-left:auto;background:none;border:none;color:var(--ink-3);font-size:1.2rem;
  line-height:1;padding:4px 2px;flex:none;
}
.sheet .body{overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.sheet footer{border-top:1px solid var(--line);padding:12px 18px calc(14px + env(safe-area-inset-bottom));flex:none}
.sheet footer:empty{display:none}
.sheet footer .terms{font-size:.74rem;color:var(--ink-2);text-align:center;margin:0 0 9px;line-height:1.45}
.sheet footer .terms b{color:var(--accent-ink)}

/* ── menu ───────────────────────────────────────────────────────── */
.item{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item img{
  width:56px;height:56px;border-radius:4px;flex:none;object-fit:cover;
  background:var(--surface-2);border:1px solid var(--line);
}
.item .who{min-width:0;flex:1}
.item .name{font-weight:600;font-size:.94rem;overflow-wrap:anywhere}
.item .desc{font-size:.76rem;color:var(--ink-2);margin-top:1px;overflow-wrap:anywhere}
.item .meta{font-family:"IBM Plex Mono",monospace;font-size:.66rem;color:var(--ink-3);margin-top:3px}
.item .price{font-family:"IBM Plex Mono",monospace;font-size:.82rem;font-variant-numeric:tabular-nums;flex:none}
.qty{display:flex;border:1px solid var(--line-2);border-radius:3px;overflow:hidden;flex:none}
.qty button{width:32px;height:32px;background:var(--surface);border:none;color:var(--ink-2);font-size:1.05rem;line-height:1}
.qty button:hover{background:var(--surface-2);color:var(--ink)}
.qty span{width:26px;line-height:32px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:.82rem;font-variant-numeric:tabular-nums}
.item[data-sold] .name{color:var(--ink-3);text-decoration:line-through}

.slothead{padding:14px 18px 0;font-family:"IBM Plex Mono",monospace;font-size:.66rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:7px;padding:10px 18px 16px}
.slot{
  font-family:"IBM Plex Mono",monospace;font-size:.86rem;padding:11px 4px;border-radius:3px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  font-variant-numeric:tabular-nums;
}
.slot:hover:not([disabled]){border-color:var(--accent-line);color:var(--accent-ink)}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.slot[disabled]{opacity:.32;cursor:not-allowed;text-decoration:line-through}

/* ── status, once an order exists ────────────────────────────────── */
/* A guest walking to the restaurant wants the progress and the route at the
   same time, so this is a sheet over the map rather than a page instead of it.
   Dismissing it leaves a bar at the bottom to bring it back. */
.orderbar{
  position:fixed;left:0;right:0;bottom:0;z-index:22;
  background:var(--surface);border-top:1px solid var(--line);
  padding:11px 16px calc(12px + env(safe-area-inset-bottom));
  display:none;align-items:center;gap:12px;text-align:left;width:100%;
  box-shadow:0 -8px 24px -18px rgba(0,0,0,.45);color:inherit;border-left:none;border-right:none;
}
.orderbar[data-open]{display:flex}
@media(min-width:640px){
  .orderbar{left:50%;right:auto;width:520px;transform:translateX(-50%);border-radius:8px 8px 0 0;border:1px solid var(--line);border-bottom:none}
}
.orderbar .code{font-family:"IBM Plex Mono",monospace;font-size:.86rem;font-weight:600}
.orderbar .what{font-size:.82rem;color:var(--ink-2);margin-top:1px}
.orderbar .when{
  margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:1.05rem;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--accent-ink);
}
.status{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px 18px;text-align:center}
.status .big{font-size:2.2rem;font-weight:900;letter-spacing:-.04em;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;line-height:1}
.status .cap{font-size:.8rem;color:var(--ink-3);margin-top:6px}
.status[data-s="FIRED"] .big,.status[data-s="COOKING"] .big{color:var(--accent-ink)}
.status[data-s="READY"] .big,.status[data-s="SERVED"] .big{color:var(--ready)}
.timeline{list-style:none;margin:14px 0 0;padding:0;text-align:left}
.timeline li{display:grid;grid-template-columns:3.4rem 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.timeline .t{font-family:"IBM Plex Mono",monospace;font-size:.8rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.timeline .w{font-size:.86rem}
.timeline li[data-done] .w{color:var(--ink)}
.timeline li:not([data-done]) .w{color:var(--ink-3)}
.near{
  font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--route);
  background:var(--route-soft);border:1px solid var(--route-line);border-radius:3px;
  padding:8px 12px;margin-top:10px;text-align:center;
}
.back{background:none;border:none;color:var(--ink-3);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;padding:16px 0 4px;font-family:"IBM Plex Mono",monospace}

.note{
  background:var(--hold-soft);border:1px solid var(--hold-line);border-left:3px solid var(--hold);
  border-radius:3px;padding:12px 14px;margin:14px 18px;
}
.note b{display:block;font-size:.88rem;color:var(--ink);margin-bottom:3px}
.note span{font-size:.8rem;color:var(--ink-2);line-height:1.5}
.note a{color:var(--accent-ink)}
.empty{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:.86rem}
</style>
</head>
<body>
<div id="map">
  <div class="badge" id="badge"><b>Үдийн хоол</b><span>Ирэхээс чинь өмнө гал тавина</span></div>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="sheet" aria-label="Ресторан">
  <div class="grip"><i></i></div>
  <header>
    <div>
      <h2 id="sheet-name">—</h2>
      <div class="sub" id="sheet-sub"></div>
      <div class="walk" id="sheet-walk"></div>
    </div>
    <button class="x" type="button" id="sheet-close" aria-label="Хаах">✕</button>
  </header>
  <div class="body" id="sheet-body"></div>
  <footer id="sheet-foot"></footer>
</section>

<button class="orderbar" id="orderbar" type="button">
  <div>
    <div class="code" id="ob-code">—</div>
    <div class="what" id="ob-what"></div>
  </div>
  <div class="when" id="ob-when"></div>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min.js"></script>
<script type="module">
import { api, store, toast, mountClock, mnt, hhmm } from '/api.js';
import { mapStyle, pinImage, ULAANBAATAR, isCovered, metresBetween, walkMinutes } from '/mapStyle.js';

const $ = (id) => document.getElementById(id);
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};

const SOURCE = 'venues';
const LAYER = 'venue-pin';
const ROUTE = 'walk';

const emptyLine = () => ({ type: 'FeatureCollection', features: [] });

const state = {
  venues: [],
  venue: null,
  menu: [],
  slots: [],
  cart: new Map(),
  slot: null,
  orderId: null,
  here: null,
  route: null,
  /** Geofence bands already reported for the current order. */
  sent: new Set(),
};

/* ── signing in ──────────────────────────────────────────────────── */

async function signIn() {
  const { token } = await api('/dev/login', { method: 'POST', body: {} });
  store.guestToken = token;
  return token;
}

/**
 * Every call that needs a guest goes through here.
 *
 * A stored token outlives the thing it points at: sessions expire, get
 * revoked, or vanish when the demo database is reseeded. So a 401 means sign
 * in again and retry — once — rather than a dead end.
 */
async function guestApi(path, options = {}) {
  const token = store.guestToken ?? (await signIn());
  try {
    return await api(path, { ...options, token });
  } catch (error) {
    if (error.status !== 401) throw error;
    store.guestToken = null;
    return api(path, { ...options, token: await signIn() });
  }
}

/* ── the map ─────────────────────────────────────────────────────── */

const style = mapStyle();
// Named for the same reason as __map below: the tile URLs are a thing worth
// asserting about from outside, and a relative one silently blanks the map.
window.__style = style;

const map = new maplibregl.Map({
  container: 'map',
  style,
  center: [ULAANBAATAR.lon, ULAANBAATAR.lat],
  // Tilted, because the buildings are the landmark. A guest deciding between
  // two lunches five minutes apart recognises the tower they work in long
  // before they recognise a street name, and the tiles carry building heights.
  zoom: 15.4,
  pitch: 55,
  bearing: -17,
  attributionControl: { compact: true, customAttribution: '© OpenStreetMap' },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

// Named so scripts/inspect.mjs can ask the map what it thinks happened. A
// tile can be byte-perfect at the proxy and still never be requested, and
// nothing outside the browser can see that.
window.__map = map;

map.on('error', (event) => {
  // MapLibre reports a missing tile, a bad style and a dead source the same
  // way — quietly, on this channel. Left unhandled it is a blank map with no
  // explanation anywhere.
  console.error('[map]', event?.error?.message ?? event?.error ?? event);
});

/**
 * Where the guest is, and what that means for the order.
 *
 * The ETA model already reasons about 800m and 300m bands, but nothing could
 * ever emit them because nothing knew where anybody was. This closes that
 * loop: crossing a band reports it once and the planner moves the fire time.
 */
const geolocate = new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true },
  trackUserLocation: true,
  showUserLocation: true,
});
map.addControl(geolocate, 'bottom-right');

geolocate.on('geolocate', (position) => {
  const { latitude: lat, longitude: lon } = position.coords;
  if (!isCovered(lat, lon)) return; // outside the tiles, and outside the pilot
  const first = !state.here;
  state.here = { lat, lon };
  void reportProximity();
  // A venue may already be open; the walk to it is now answerable.
  if (state.venue) void drawWalk(state.venue);
  if (first && !state.venue) map.easeTo({ center: [lon, lat], duration: 700 });
});

/**
 * The walk from here to a restaurant: the road somebody would take, how far it
 * is, and how long it takes on foot.
 *
 * The straight line between two points in a city is short by about a third —
 * buildings are in the way — so this asks the server, which has the road
 * geometry. When the router cannot be reached it answers with a straight line
 * marked `direct`, and the layer above draws that dashed.
 */
async function drawWalk(venue) {
  const walk = document.getElementById('sheet-walk');
  if (!state.here || !venue?.lat) {
    map.getSource(ROUTE)?.setData(emptyLine());
    if (walk) walk.textContent = '';
    return;
  }

  const from = `${state.here.lon},${state.here.lat}`;
  const to = `${venue.lon},${venue.lat}`;
  let route;
  try {
    route = await api(`/v1/route?from=${from}&to=${to}`);
  } catch {
    return;
  }
  // The guest may have closed the sheet or opened another one meanwhile.
  if (state.venue?.id !== venue.id) return;
  state.route = route;

  map.getSource(ROUTE)?.setData({
    type: 'FeatureCollection',
    features: [
      {
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: route.line },
        properties: { direct: route.kind === 'direct' },
      },
    ],
  });

  const km = route.metres >= 1000 ? `${(route.metres / 1000).toFixed(1)} км` : `${route.metres} м`;
  const sub = document.getElementById('sheet-walk');
  if (sub) {
    sub.innerHTML =
      `<span>🚶</span><b>${km}</b><span>·</span><b>${route.minutes} мин</b>` +
      (route.kind === 'direct' ? '<span class="guess">ойролцоогоор</span>' : '');
  }

  // Show both ends of the walk at once.
  const bounds = route.line.reduce(
    (box, point) => box.extend(point),
    new maplibregl.LngLatBounds(route.line[0], route.line[0]),
  );
  map.fitBounds(bounds, { padding: { top: 70, bottom: 340, left: 50, right: 50 }, duration: 700 });
}

async function reportProximity() {
  if (!state.orderId || !state.here || !state.venue?.lat) return;

  const metres = metresBetween(state.here, { lat: state.venue.lat, lon: state.venue.lon });
  const band = metres <= 300 ? 'geofence_300' : metres <= 800 ? 'geofence_800' : null;
  if (!band || state.sent.has(band)) return;

  state.sent.add(band);
  try {
    await guestApi(`/v1/orders/${state.orderId}/signal`, { method: 'POST', body: { type: band } });
    toast(`${Math.round(metres)}м зайд ирлээ — гал тавих цаг шинэчлэгдэнэ.`);
    await api('/dev/tick', { method: 'POST' }).catch(() => {});
    void showStatus();
  } catch {
    state.sent.delete(band); // let the next fix try again
  }
}

let ready = false;
map.on('load', () => {
  map.addImage('pin-open', pinImage('#C64E08', false), { pixelRatio: 2 });
  map.addImage('pin-shut', pinImage('#78868E', true), { pixelRatio: 2 });

  // The walk, under the pins so a pin is never hidden by its own route.
  map.addSource(ROUTE, { type: 'geojson', data: emptyLine() });
  map.addLayer({
    id: 'route-casing',
    type: 'line',
    source: ROUTE,
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ffffff', 'line-width': 9, 'line-opacity': 0.9 },
  });
  map.addLayer({
    id: 'route-line',
    type: 'line',
    source: ROUTE,
    layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: {
      'line-color': '#1B5B8F',
      'line-width': 5,
      // Dashed when it is a straight line rather than a surveyed route, so a
      // guess never draws itself as something somebody measured.
      'line-dasharray': ['case', ['get', 'direct'], ['literal', [1.4, 1.2]], ['literal', [1, 0]]],
    },
  });

  map.addSource(SOURCE, { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({
    id: LAYER,
    type: 'symbol',
    source: SOURCE,
    layout: {
      'icon-image': ['case', ['get', 'open'], 'pin-open', 'pin-shut'],
      'icon-size': 0.5,
      'icon-anchor': 'bottom',
      'icon-allow-overlap': true,
      'text-field': ['get', 'label'],
      'text-font': ['Noto Sans Regular'],
      'text-size': 11,
      'text-offset': [0, 0.7],
      'text-anchor': 'top',
      'text-allow-overlap': true,
    },
    paint: {
      'text-color': ['case', ['get', 'open'], '#14181B', '#78868E'],
      'text-halo-color': '#ffffff',
      'text-halo-width': 1.8,
    },
  });

  map.on('mouseenter', LAYER, () => (map.getCanvas().style.cursor = 'pointer'));
  map.on('mouseleave', LAYER, () => (map.getCanvas().style.cursor = ''));
  map.on('click', LAYER, (event) => {
    const id = event.features?.[0]?.properties?.id;
    const venue = state.venues.find((v) => v.id === id);
    if (venue) void openVenue(venue);
  });

  ready = true;
  paintVenues();
});

function paintVenues() {
  if (!ready) return;
  const features = state.venues
    .filter((v) => Number.isFinite(v.lat) && Number.isFinite(v.lon))
    .map((v) => ({
      type: 'Feature',
      geometry: { type: 'Point', coordinates: [v.lon, v.lat] },
      properties: { id: v.id, open: v.accepting_orders, label: v.name },
    }));
  map.getSource(SOURCE)?.setData({ type: 'FeatureCollection', features });
}

/* ── loading venues ─────────────────────────────────────────────── */

async function loadVenues() {
  const { restaurants } = await api('/v1/restaurants');
  state.venues = restaurants;
  paintVenues();
  if (state.venue) {
    // Keep the open sheet's copy fresh; a kitchen can go dark while it is open.
    const fresh = restaurants.find((r) => r.id === state.venue.id);
    if (fresh) state.venue = { ...state.venue, ...fresh };
  }

  const open = restaurants.filter((r) => r.accepting_orders).length;
  $('badge').querySelector('span').textContent =
    open > 0
      ? `${open}/${restaurants.length} ресторан захиалга авч байна`
      : 'Нэг ч гал тогоо холбогдоогүй';

  // A map of grey pins with no explanation is a dead end. A kitchen goes dark
  // ninety seconds after its tablet stops checking in — the guard working, but
  // the guest still deserves to be told what that means.
  const existing = $('map').querySelector('.note');
  if (open === 0 && !existing) {
    $('map').append(
      el(`<div class="note" style="position:absolute;top:62px;left:12px;right:12px;z-index:5;margin:0">
            <b>Одоогоор нэг ч гал тогоо холбогдоогүй</b>
            <span>Тогооч дэлгэцээ нээгээгүй бол захиалга хүлээж авах хүнгүй.
            Демо үзэж байгаа бол <a href="/kds">гал тогооны дэлгэцийг</a> нээнэ үү.</span>
          </div>`),
    );
  } else if (open > 0 && existing) {
    existing.remove();
  }
}

/* ── the sheet ──────────────────────────────────────────────────── */

function closeSheet() {
  $('sheet').removeAttribute('data-open');
  $('scrim').removeAttribute('data-open');

  if (state.orderId) {
    // The order is still live: keep its route on the map and leave a bar to
    // bring the detail back. Someone walking there wants to see both.
    $('orderbar').dataset.open = '1';
    return;
  }
  // No order — the route belonged to a venue nobody chose.
  map.getSource(ROUTE)?.setData(emptyLine());
  state.venue = null;
  state.route = null;
}
$('sheet-close').addEventListener('click', closeSheet);
$('scrim').addEventListener('click', closeSheet);
$('orderbar').addEventListener('click', () => {
  $('orderbar').removeAttribute('data-open');
  void showStatus();
});

async function openVenue(venue) {
  $('orderbar').removeAttribute('data-open');
  state.venue = venue;
  state.cart = new Map();
  state.slot = null;

  const walk = state.here
    ? walkMinutes(metresBetween(state.here, { lat: venue.lat, lon: venue.lon }))
    : venue.walk_minutes;

  $('sheet-name').textContent = venue.name;
  $('sheet-sub').textContent = `${walk} мин алхаад · ${
    venue.accepting_orders ? 'захиалга авч байна' : 'одоогоор хаалттай'
  }`;
  $('sheet-body').replaceChildren(el('<p class="empty">Цэс ачаалж байна…</p>'));
  $('sheet-foot').replaceChildren();
  $('sheet').dataset.open = '1';
  $('scrim').dataset.open = '1';

  document.getElementById('sheet-walk').textContent = '';
  if (state.here) {
    // The walk answers "is this worth it" before the menu does.
    void drawWalk(venue);
  } else {
    // Lift the pin above the sheet rather than leaving it hidden behind it.
    map.easeTo({ center: [venue.lon, venue.lat], zoom: 16.6, offset: [0, -120], duration: 500 });
  }

  if (!venue.accepting_orders) {
    $('sheet-body').replaceChildren(
      el(`<div class="note"><b>Одоогоор захиалга авахгүй байна</b>
            <span>Гал тогооны дэлгэц холбогдоогүй тул хоол хийх хүн байхгүй.</span></div>`),
    );
    return;
  }

  const [{ items }, { slots }] = await Promise.all([
    api(`/v1/restaurants/${venue.id}/menu`),
    api(`/v1/restaurants/${venue.id}/slots`),
  ]);
  state.menu = items;
  state.slots = slots;
  renderSheet();
}

function renderSheet() {
  const body = $('sheet-body');
  body.replaceChildren();

  for (const item of state.menu) {
    const qty = state.cart.get(item.id) ?? 0;
    const row = el(`
      <div class="item"${item.sold_out ? ' data-sold' : ''}>
        <img src="${item.image_url ?? '/dishes/unknown.svg'}" alt="" loading="lazy" width="56" height="56">
        <div class="who">
          <div class="name">${item.name}</div>
          ${item.description ? `<div class="desc">${item.description}</div>` : ''}
          <div class="meta">${item.station} · ${item.prep_minutes} мин</div>
        </div>
        <div class="price">${mnt(item.price_mnt)}</div>
      </div>`);

    if (item.sold_out) {
      row.append(el('<span class="chip">Дууссан</span>'));
    } else {
      const stepper = el(`
        <div class="qty">
          <button type="button" data-d="-1" aria-label="Хасах">−</button>
          <span>${qty}</span>
          <button type="button" data-d="1" aria-label="Нэмэх">+</button>
        </div>`);
      stepper.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button) return;
        const next = Math.max(0, (state.cart.get(item.id) ?? 0) + Number(button.dataset.d));
        if (next === 0) state.cart.delete(item.id);
        else state.cart.set(item.id, next);
        renderSheet();
      });
      row.append(stepper);
    }
    body.append(row);
  }

  body.append(el('<div class="slothead">Хэдэн цагт ирэх вэ?</div>'));
  const grid = el('<div class="slots"></div>');
  for (const slot of state.slots) {
    const button = el(
      `<button class="slot" type="button" aria-pressed="${state.slot === slot.starts_at}"${
        slot.available ? '' : ' disabled'
      }>${slot.label}</button>`,
    );
    button.addEventListener('click', () => {
      state.slot = slot.starts_at;
      renderSheet();
    });
    grid.append(button);
  }
  body.append(grid);
  renderFoot();
}

function renderFoot() {
  const total = [...state.cart].reduce((sum, [id, qty]) => {
    const item = state.menu.find((m) => m.id === id);
    return sum + (item ? item.price_mnt * qty : 0);
  }, 0);
  const foot = $('sheet-foot');
  foot.replaceChildren();
  if (total === 0) return;

  const chosen = Boolean(state.slot);
  foot.append(el('<p class="terms">Хоол <b>гал дээр гарахаас өмнө</b> үнэгүй цуцална.</p>'));
  const button = el(
    `<button class="btn" data-v="primary" data-size="lg" type="button"${chosen ? '' : ' disabled'}>
       ${chosen ? `${mnt(total)} төлөх` : 'Цагаа сонгоно уу'}
     </button>`,
  );
  button.addEventListener('click', placeOrder);
  foot.append(button);
}

async function placeOrder() {
  const button = $('sheet-foot').querySelector('button');
  button.disabled = true;
  button.textContent = 'Түр хүлээнэ үү…';
  try {
    const order = await guestApi('/v1/orders', {
      method: 'POST',
      // A phone on a patchy connection retries; the same key must not buy lunch twice.
      idempotencyKey: `order-${state.venue.id}-${state.slot}-${[...state.cart].join(',')}`,
      body: {
        restaurant_id: state.venue.id,
        slot_starts_at: state.slot,
        party_size: 2,
        items: [...state.cart].map(([menu_item_id, qty]) => ({ menu_item_id, qty })),
      },
    });
    await guestApi(`/v1/orders/${order.id}/pay`, { method: 'POST' });
    state.orderId = order.id;
    state.sent = new Set();
    await showStatus();
  } catch (error) {
    toast(error.message, 'bad');
    renderFoot();
  }
}

/* ── status ─────────────────────────────────────────────────────── */

const STEPS = [
  ['placed', 'Захиалга баталгаажлаа'],
  ['accepted', 'Ресторан хүлээн авлаа'],
  ['fired', 'Гал дээр гарлаа'],
  ['ready', 'Хоол бэлэн'],
  ['served', 'Ширээн дээр'],
];

const HEADLINE = {
  PLACED: ['Хүлээгдэж байна', 'Ресторан хараахан хараагүй'],
  ACCEPTED: ['Баталгаажлаа', 'Гал тавих цаг тооцоологдож байна'],
  HELD: ['Хүлээж байна', 'Гал тогоо ачаалалтай байна'],
  FIRED: ['Гал дээр', 'Хоол хийгдэж эхэллээ'],
  READY: ['Бэлэн', 'Ширээндээ хүрч ирлээ'],
  SERVED: ['Сайхан хооллоорой', ''],
  CLOSED: ['Дууслаа', 'Баярлалаа'],
  CANCELLED: ['Цуцлагдлаа', 'Мөнгө буцаагдана'],
  REFUNDED: ['Буцаагдлаа', 'Мөнгө таны данс руу очлоо'],
  NO_SHOW: ['Ирээгүй', 'Хоол хадгалагдаагүй'],
  REJECTED: ['Татгалзсан', 'Мөнгө бүтэн буцаагдана'],
};

async function showStatus() {
  if (!state.orderId) return;
  const order = await guestApi(`/v1/orders/${state.orderId}`);

  // The states that carry a time say it; the rest carry a word.
  const [word, cap] = HEADLINE[order.state] ?? [null, ''];
  const big = word ?? hhmm(order.fire_at);
  const sub =
    cap ||
    (order.state === 'SCHEDULED'
      ? 'Энэ цагт гал дээр гарна'
      : order.state === 'ARMED'
        ? 'Та замд гарсан уу?'
        : order.state === 'COOKING'
          ? `${hhmm(order.ready_at)}-д бэлэн болно`
          : '');

  // The collapsed bar carries the same answer in one line.
  $('ob-code').textContent = `№${order.code}`;
  $('ob-what').textContent = sub || String(word ?? '');
  $('ob-when').textContent = HEADLINE[order.state]?.[0] ?? hhmm(order.fire_at);

  $('orderbar').removeAttribute('data-open');
  $('sheet').dataset.open = '1';
  $('scrim').dataset.open = '1';
  $('sheet-name').textContent = `№${order.code}`;
  $('sheet-sub').textContent = [state.venue?.name, order.table && `Ширээ ${order.table}`]
    .filter(Boolean)
    .join(' · ');

  const body = $('sheet-body');
  body.replaceChildren();

  const card = el(`
    <div class="status" data-s="${order.state}">
      <div class="lab">${order.state}</div>
      <div class="big">${big}</div>
      <div class="cap">${sub}</div>
    </div>`);

  const done = {
    placed: true,
    accepted: order.state !== 'PLACED',
    fired: ['FIRED', 'COOKING', 'READY', 'SERVED', 'CLOSED'].includes(order.state),
    ready: ['READY', 'SERVED', 'CLOSED'].includes(order.state),
    served: ['SERVED', 'CLOSED'].includes(order.state),
  };
  const when = { placed: order.slot_starts_at, fired: order.fire_at, ready: order.ready_at };

  const timeline = el('<ul class="timeline"></ul>');
  for (const [key, wordFor] of STEPS) {
    timeline.append(
      el(`<li${done[key] ? ' data-done' : ''}>
            <span class="t">${when[key] ? hhmm(when[key]) : '·'}</span>
            <span class="w">${wordFor}</span>
          </li>`),
    );
  }
  card.append(timeline);
  body.append(card);

  // The walk is still the thing being watched, so keep it fresh and on the map.
  if (state.here && state.venue?.lat) void drawWalk(state.venue);

  const foot = $('sheet-foot');
  foot.replaceChildren();

  if (order.can_cancel) {
    const cancel = el(
      `<button class="btn" data-v="danger" data-size="lg" type="button">
         Үнэгүй цуцлах${order.free_cancel_until ? ` — ${hhmm(order.free_cancel_until)} хүртэл` : ''}
       </button>`,
    );
    cancel.addEventListener('click', async () => {
      try {
        await guestApi(`/v1/orders/${state.orderId}/cancel`, { method: 'POST' });
        toast('Цуцлагдлаа. Мөнгө буцаагдана.');
      } catch (error) {
        toast(error.message, 'bad');
      }
      void showStatus();
    });
    foot.append(cancel);
  }

  if (order.state === 'ARMED' || order.state === 'SCHEDULED') {
    const otw = el(
      '<button class="btn" data-size="lg" type="button" style="margin-top:8px">Хөдөллөө</button>',
    );
    otw.addEventListener('click', async () => {
      await guestApi(`/v1/orders/${state.orderId}/signal`, {
        method: 'POST',
        body: { type: 'on_my_way' },
      });
      toast('Мэдэгдлээ. Гал тавих цаг шинэчлэгдэнэ.');
      await api('/dev/tick', { method: 'POST' }).catch(() => {});
      void showStatus();
    });
    foot.append(otw);
  }

  if (order.receipt) {
    body.append(
      el(`<div class="note"><b>Е-баримт</b><span>Сугалаа ${order.receipt.lottery}</span></div>`),
    );
  }

  // Once there is nothing left to watch, let go of the order and the route.
  if (['SERVED', 'CLOSED', 'REFUNDED', 'CANCELLED', 'NO_SHOW', 'REJECTED'].includes(order.state)) {
    const again = el('<button class="btn" data-size="lg" type="button" style="margin-top:8px">Шинэ захиалга</button>');
    again.addEventListener('click', () => {
      state.orderId = null;
      state.route = null;
      map.getSource(ROUTE)?.setData(emptyLine());
      closeSheet();
      void loadVenues();
    });
    foot.append(again);
  }
}

/* ── boot ───────────────────────────────────────────────────────── */

mountClock(() => {
  void loadVenues();
  if (state.orderId) void showStatus();
});

void loadVenues();

/**
 * The status screen changes without the guest touching anything, so it polls.
 *
 * It stops when the page goes away. A browser tearing a page down makes this
 * moot, but a page kept alive in the background — or embedded in a test — that
 * keeps asking the server for orders it will never draw is doing work for
 * nobody.
 */
const poll = setInterval(() => {
  if (document.hidden) return;
  if (state.orderId) void showStatus();
  else void loadVenues();
}, 4000);
addEventListener('pagehide', () => clearInterval(poll));
</script>
</body>
</html>
