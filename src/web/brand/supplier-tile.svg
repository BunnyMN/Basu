<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Нийлүүлэгч">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDFA"/>
      <stop offset="1" stop-color="#EEE7DD"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".38" r=".6">
      <stop offset="0" stop-color="#FFE6D1" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFE6D1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E4DED4"/>
      <stop offset=".35" stop-color="#FFFFFF"/>
      <stop offset=".7" stop-color="#F6F2EC"/>
      <stop offset="1" stop-color="#D6CFC4"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#EFE9E0"/>
      <stop offset="1" stop-color="#CFC6B9"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A73C05"/>
      <stop offset=".4" stop-color="#E0600F"/>
      <stop offset="1" stop-color="#9E3804"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F07A2A"/>
      <stop offset="1" stop-color="#C24E0C"/>
    </linearGradient>
    <linearGradient id="wool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7E1D8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#plate)"/>
    <rect width="256" height="256" fill="url(#glow)"/>

    <g transform="translate(128 132) scale(1.16) translate(-124 -132)">
    <!-- the ground under it -->
    <ellipse cx="124" cy="206" rx="92" ry="14" fill="#6B5A48" opacity=".22" filter="url(#soft)"/>

    <!-- the ger: wall, band, roof, crown -->
    <path d="M52 132h144v58c0 7-32 13-72 13s-72-6-72-13z" fill="url(#wall)"/>
    <path d="M52 146h144v14c0 4-32 8-72 8s-72-4-72-8z" fill="url(#band)"/>
    <g fill="#FFD9A8" opacity=".9">
      <path d="M62 153l5-4 5 4-5 4z"/><path d="M80 154l5-4 5 4-5 4z"/><path d="M98 155l5-4 5 4-5 4z"/>
      <path d="M140 155l5-4 5 4-5 4z"/><path d="M158 154l5-4 5 4-5 4z"/><path d="M176 153l5-4 5 4-5 4z"/>
    </g>
    <path d="M40 134c22-40 56-66 84-76 28 10 62 36 84 76-24 8-54 12-84 12s-60-4-84-12z" fill="url(#roof)"/>
    <g stroke="#C9A77F" stroke-width="2" opacity=".55" fill="none" stroke-linecap="round">
      <path d="M124 60 64 137"/><path d="M124 60 92 142"/><path d="M124 60 124 145"/><path d="M124 60 156 142"/><path d="M124 60 184 137"/>
    </g>
    <path d="M40 134c24 8 54 12 84 12s60-4 84-12" fill="none" stroke="#B7AA98" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="124" cy="60" rx="15" ry="6" fill="#7A4A26"/>
    <ellipse cx="124" cy="58" rx="10" ry="3.5" fill="#A56A3A"/>

    <!-- the door, carved and painted -->
    <path d="M108 168h32v34c-5 1.4-11 2-16 2s-11-.6-16-2z" fill="#6E3E1C"/>
    <path d="M112 172h24v29c-4 .8-8 1.2-12 1.2s-8-.4-12-1.2z" fill="url(#door)"/>
    <path d="M118 182l6-5 6 5-6 5z" fill="#FFD27A"/>
    <path d="M118 194l6-5 6 5-6 5z" fill="#FFD27A" opacity=".85"/>

    <!-- a sheep beside it -->
    <g transform="translate(168 170)">
      <ellipse cx="18" cy="34" rx="22" ry="4" fill="#6B5A48" opacity=".25"/>
      <path d="M6 22v12M13 24v11M24 24v11M31 22v12" stroke="#3B2F2A" stroke-width="3.2" stroke-linecap="round"/>
      <g fill="url(#wool)">
        <circle cx="10" cy="14" r="9"/><circle cx="20" cy="10" r="10"/><circle cx="30" cy="15" r="8.5"/>
        <circle cx="14" cy="22" r="9"/><circle cx="26" cy="22" r="9"/>
      </g>
      <ellipse cx="38" cy="14" rx="7" ry="8.5" fill="#2F2622"/>
      <ellipse cx="33" cy="9" rx="4" ry="2.4" fill="#2F2622" transform="rotate(-25 33 9)"/>
      <circle cx="40" cy="12" r="1.2" fill="#FFFFFF"/>
    </g>

    </g>
    <!-- a little sky -->
    <circle cx="200" cy="52" r="11" fill="#FFB36B" opacity=".85"/>
  </g>
  <rect x=".75" y=".75" width="254.5" height="254.5" rx="55.5" fill="none" stroke="#000" stroke-opacity=".06" stroke-width="1.5"/>
</svg>
