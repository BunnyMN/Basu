<!doctype html>
<html lang="mn" data-session="kitchen">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100D0C">
<title>Гал тогоо — Basu</title>
<link rel="stylesheet" href="/app.css">
<style>
/* Layout, and the board's size. Colour, type, radius, buttons, chips, cards
   and the empty row all come from app.css («Тансаг хар»; the off-white
   primary is the kitchen's — html[data-session="kitchen"]). The board sets a
   22px base and scales its own pieces in em, because a chef reads it from
   two metres with wet hands: the codes, the clocks and the counts in the
   condensed display, big; buttons a fist can hit. The lanes are told apart
   by their words and each ticket's meter, never by a colour; a ticket that
   needs somebody now wears one hairline — gold when its fire time has come,
   the crimson's ink once it is late or the kitchen must decide. Everything
   around the board is the shared system at its normal size. */

/* ── chrome: the sticky bar, and on a narrow screen the lane picker in it ── */
.topbar.kds{
  grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"who conn act" "lanes lanes lanes";
  gap:0 16px;padding-left:var(--gutter);padding-right:16px;
}
.topbar.kds .who{grid-area:who;min-width:0;padding:12px 0 10px}
.topbar.kds .who .eyebrow{display:block;margin-bottom:8px;color:var(--gold)}
/* the kitchen's name, as the prototype's titles are: the condensed display at 800 */
.topbar.kds .who h1{font-family:var(--display);font-size:2.5rem;font-weight:800;line-height:1;padding-bottom:.06em;letter-spacing:-.004em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar.kds .conn{grid-area:conn;font-size:var(--t-body)}
.topbar.kds .act{grid-area:act;align-items:center;gap:16px}
.topbar.kds .clock{font-family:var(--display);font-size:2.75rem;font-weight:800;line-height:1;letter-spacing:.01em;color:var(--ink)}
.topbar.kds .act .btn{min-height:48px;padding:0 22px;font-size:var(--t-body-lg)}
.topbar.kds > .lanes{grid-area:lanes;margin:4px 0 12px}
/* On a portrait tablet these tabs are the only way to change lane, and the
   hands pressing them are wet: a 52px bar, not the seg's 40. */
.topbar.kds > .lanes[data-fill] > button{min-height:52px;font-size:var(--t-body-lg)}
@media (min-width:821px){.topbar.kds > .lanes[data-fill]{display:none}}
/* A phone is too narrow for the name, the connection and the clock in one
   row: the connection word drops under the name, the clock keeps its place. */
@media (max-width:600px){
  .topbar.kds{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who act" "conn act" "lanes lanes"}
  .topbar.kds .who{padding-bottom:4px}
  .topbar.kds .who h1{font-size:1.625rem}
  .topbar.kds .clock{font-size:1.75rem}
  .topbar.kds .act{gap:10px}
  .topbar.kds .act .btn{min-height:var(--target);padding:0 16px;font-size:var(--t-body)}
  .topbar.kds .conn{padding-bottom:8px}
  .topbar.kds > .lanes[data-fill] > button{padding:0 8px;font-size:var(--t-body)}
}
/* A board that lost the server says so across its width, with the time of what it still shows. */
.stale-strip{font-size:var(--t-body)}
.stale-strip .mono{margin-left:0}

/* ── board: three columns in a 24px gutter, no card around a lane ── */
.board{
  font-size:1.375rem;display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:var(--s-6);align-items:start;
  padding:var(--s-6) var(--gutter) calc(var(--s-8) + var(--safe-b));
  min-height:calc(100dvh - var(--bar-h) - var(--safe-t));
}
/* An old board is not to be acted on as if it were now: it fades and stops taking presses until the server answers again. */
.board[data-stale]{opacity:.5;filter:saturate(.35);pointer-events:none;transition:opacity var(--dur) var(--ease)}
.lane{min-width:0}
/* The lane's name is read from the pass: the display, as big as the board allows, its count beside it. */
.lane > .section-title{display:flex;align-items:center;gap:.4em;margin:0 0 .6em;padding-bottom:.45em;border-bottom:1px solid var(--line);font-family:var(--display);font-size:1.45em;font-weight:800;line-height:1}
.lane > .section-title .count{min-width:1.45em;height:1.2em;padding:0 .35em;border-radius:.6em;font-family:var(--sans);font-size:.6em;font-weight:800;background:var(--surface-3);color:var(--ink)}
.lane .stack{display:flex;flex-direction:column;gap:var(--s-4);min-width:0}
/* An empty lane says in words what is not there, and when the board last looked. */
.lane .none{width:100%;max-width:none;padding:1.1em .8em;border-top:0;font-size:.75em;color:var(--ink-2)}
.lane .none b{font-weight:600;color:var(--ink-2);margin:0}
.lane .none .upd{display:block;margin-top:6px;font-size:var(--t-cap);color:var(--ink-3)}
@media (max-width:820px){
  .board{grid-template-columns:1fr;min-height:0;padding-top:var(--s-4)}
  .board[data-show] .lane{display:none}
  .board[data-show="incoming"] .lane[data-key="incoming"],
  .board[data-show="cooking"] .lane[data-key="cooking"],
  .board[data-show="ready"] .lane[data-key="ready"]{display:block}
  .lane > .section-title{display:none}
}

/* ── ticket: a card with its band on top, the dishes below ── */
/* The band has one shape on every ticket at every width: two columns, two
   lines, then the meter. Left is who — the № over the table chip; right is
   when — the big figure over the word that says what it counts to. Nothing
   on one side ever has to fit beside the other side's longest phrase, so
   the chip never drops under the № on a 1024px tablet, and both columns
   share a min-height so a cooking ticket (no note) or an unseated one (no
   table) keeps the same band height as its neighbours. The meter runs the
   band's width: how far the order has come in this kitchen (new, taken,
   on the fire, ready). A capacity warning is a last full-width line. The
   band is the card's own charcoal in every lane — no tint says the lane. */
.ticket{min-width:0;padding:0;overflow:hidden}
.ticket > .top{
  display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:.5em .6em;
  padding:.75em .8em .8em;border-bottom:1px solid var(--line);background:none;
}
.ticket[data-now]{box-shadow:inset 0 3px 0 var(--gold),var(--shadow-1)}
.ticket:is([data-late],[data-attention]){box-shadow:inset 0 3px 0 var(--accent-ink),var(--shadow-1)}
.ticket .who,.ticket .cdw{
  flex:none;display:flex;flex-direction:column;justify-content:space-between;gap:.3em;
  min-height:2.9em;max-width:100%;min-width:0;
}
.ticket .who{align-items:flex-start}
.ticket .cdw{align-items:flex-end;text-align:right}
.ticket .id{font-family:var(--display);font-size:1.4em;font-weight:800;line-height:1;letter-spacing:.01em;color:var(--ink);white-space:nowrap}
.ticket .tbl{max-width:100%;height:1.5em;padding:0 .55em;font-size:.75em}
.ticket > .top > .meter{flex-basis:100%;gap:.25em}
.ticket > .top > .meter > i{height:5px;border-radius:3px}
.ticket .why{flex-basis:100%;font-size:.75em;font-weight:700;line-height:1.3;color:var(--accent-ink)}
.ticket .cd{font-family:var(--display);font-size:2.2em;font-weight:800;line-height:.9;letter-spacing:.005em;color:var(--ink);white-space:nowrap}
/* The unit is a word, not a figure: it sits beside the number in the sans
   face at a third of its size. textContent is still «32 мин». */
.ticket .cd small{font-family:var(--sans);font-size:.36em;font-weight:600;letter-spacing:0;color:var(--ink-2)}
/* The word the chef reads to know what the figure means — «хоцорсон» decides
   something — so it is the sans at 14px on the 22px board. */
.ticket .cds{font-family:var(--sans);font-size:.64em;font-weight:600;line-height:1.2;letter-spacing:0;color:var(--ink-2)}
.ticket:is([data-late],[data-attention]) :is(.cd,.cds){color:var(--accent-ink)}
.ticket[data-now] .cds{color:var(--gold)}
.ticket .body{padding:.7em .8em .85em}
.ticket .meta{
  font-family:var(--sans);font-size:.7em;line-height:1.45;color:var(--ink-2);
  font-variant-numeric:tabular-nums;white-space:normal;overflow:visible;text-overflow:clip;
}
.ticket .meta .mono{font-family:var(--sans);font-weight:700;color:var(--ink)}
.ticket .meta .chip{vertical-align:middle;margin-left:.3em}
/* What to cook is the largest thing on the card after the clock: the count in the display, the dish beside it. */
.ticket .lines{display:flex;flex-direction:column;margin:.5em 0 .8em}
.ticket .lines > div{display:flex;align-items:baseline;gap:.55em;padding:.38em 0;border-top:1px solid var(--line);line-height:1.3;min-width:0}
.ticket .lines > div:first-child{border-top:0}
.ticket .lines b{flex:none;min-width:1.9em;font-family:var(--display);font-size:1.15em;font-weight:800;color:var(--ink)}
.ticket .lines span{font-size:1em;font-weight:600;color:var(--ink);min-width:0}
.ticket .btns{display:flex;flex-direction:column;gap:.45em}
.ticket .btns .btn{width:100%;min-height:52px;font-size:.8em}
.ticket .btns .btn[data-size="lg"]{min-height:64px;font-size:.9em;font-weight:700}
.ticket .btns .btn[data-v="danger"]{min-height:48px}

/* ── the door: one card in the middle of the ground ── */
.door{width:min(440px,calc(100% - 2 * var(--gutter)));margin:var(--s-8) auto;padding:28px 24px}
.door > .eyebrow{display:block;margin-bottom:12px;color:var(--gold)}
.door > h1{font-family:var(--display);font-size:var(--t-display);font-weight:800;line-height:.92;letter-spacing:-.004em;margin-bottom:12px}
.door > p{margin:0 0 var(--s-6);color:var(--ink-2)}
.door .dev{margin:var(--s-6) -24px -28px;padding-bottom:var(--s-2);border-top:1px solid var(--line)}
.door .dev > summary{
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--target);padding:0 24px;
  list-style:none;cursor:pointer;font-size:var(--t-body);font-weight:600;color:var(--ink-2);
}
.door .dev > summary::-webkit-details-marker{display:none}
.door .dev > summary::after{
  content:"";width:16px;height:16px;flex:none;background:var(--ink-3);transform:rotate(90deg);transition:transform var(--dur);
  -webkit-mask:var(--mask-chev) center/contain no-repeat;mask:var(--mask-chev) center/contain no-repeat;
}
.door .dev[open] > summary::after{transform:rotate(-90deg)}
.door .venues[data-rows]{border:0;border-radius:0;box-shadow:none;background:none;overflow:visible;border-top:1px solid var(--line)}
.door .venues > .row{padding-left:24px;padding-right:24px}
.door .venues .tag{font-size:var(--t-cap);color:var(--ink-3)}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { api, store, toast, mountClock, signInDoors, authReturn, endSession, popup, meter } from '/api.js';

const root = document.getElementById('root');
/**
 * Text into markup: a guest's name, the table they sat at, a dish. Quotes
 * too, so that nothing put inside an attribute can end it.
 */
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};

/**
 * Who is at this screen: a person who works at a restaurant, signed in as
 * themselves — the cook on the tablet by the pass, the manager on a phone.
 * What they may do is their role there; the dashboard's `/kds?org=…` picks
 * the restaurant for somebody who works at two. The session is the
 * kitchen's own (`data-session` on the root), apart from any guest signed in
 * on the same browser.
 */
const ORG = new URLSearchParams(location.search).get('org');
/** A sign-in at this screen: it is the kitchen's person now, and whoever was here before is signed out on the server too. */
function takeKitchen(t) {
  const before = store.kitchenToken;
  store.kitchenToken = t;
  if (before && before !== t) endSession(before);
}
// Back from Google: the claimed session is the kitchen's person, not the browser's guest.
const back = await authReturn;
if (back?.token) takeKitchen(back.token);
const token = () => store.kitchenToken;
const kitchen = (path, options = {}) => api(path, { ...options, token: token(), headers: ORG ? { 'x-basu-org': ORG } : {} });

/* ── the door ────────────────────────────────────────────────────── */

async function showDoor() {
  root.replaceChildren();
  boardSig = '';
  const card = el(`
    <main class="door card">
      <span class="eyebrow">Basu</span>
      <h1>Гал тогоо</h1>
      <p>Өөрийн бүртгэлээр нэвтэрнэ үү. Рестораны эзэн эсвэл менежер танд эрх өгсөн байх ёстой.</p>
      <div data-doors></div>
    </main>`);
  card.querySelector('[data-doors]').replaceWith(
    signInDoors({
      device: 'Гал тогоо',
      returnTo: `/kds${location.search}`,
      keep: false,
      onToken: (t) => {
        takeKitchen(t);
        boot();
      },
    }),
  );

  // A developer's machine: sign in as a seeded restaurant's cook, folded under the real door.
  const { kitchens } = await api('/dev/kitchens').catch(() => ({ kitchens: [] }));
  if (kitchens.length) {
    const dev = el('<details class="dev"><summary>Демо горим</summary></details>');
    const list = el('<div class="venues" data-rows></div>');
    for (const k of kitchens.filter((k) => k.phone)) {
      const button = el(`
        <button type="button" class="row">
          <span class="main"><span class="title" data-weight="normal">${esc(k.name)}</span></span>
          <span class="end"><span class="tag mn">${esc(k.phone)}</span></span>
        </button>`);
      button.addEventListener('click', async () => {
        try {
          const { token: t } = await api('/dev/login', { method: 'POST', body: { phone: k.phone, device: 'Гал тогоо' } });
          store.kitchenToken = t;
          boot();
        } catch (error) {
          toast(error.message, 'bad');
        }
      });
      list.append(button);
    }
    dev.append(list);
    card.append(dev);
  }
  root.append(card);
}

/** Signed in, but not at a restaurant whose kitchen this person may open. */
function showNotHere() {
  boardSig = '';
  root.replaceChildren(el(`
    <main class="door card">
      <span class="eyebrow">Basu</span>
      <h1>Гал тогоо нээх эрхгүй</h1>
      <p>Энэ бүртгэл аль ч рестораны ажилтан биш байна. Рестораны эзэн эсвэл менежер Бизнес хэсгийн «Ажилтнууд» хуудаснаас танд эрх өгнө.</p>
      <button class="btn" data-size="lg" type="button" id="other">Өөр бүртгэлээр нэвтрэх</button>
    </main>`));
  root.querySelector('#other').addEventListener('click', signOut);
}

function signOut() {
  endSession(store.kitchenToken);
  store.kitchenToken = null;
  boot();
}

/* ── the board ───────────────────────────────────────────────────── */

const LANES = [
  { key: 'incoming', title: 'Ирж явна', none: 'Шинэ захиалга алга' },
  { key: 'cooking', title: 'Гал дээр', none: 'Гал дээр юу ч алга' },
  { key: 'ready', title: 'Бэлэн', none: 'Бэлэн хоол алга' },
];

/**
 * How far an order has come in this kitchen, on the meter's four bars: new
 * (to take or refuse), taken (waiting for its fire), on the fire, ready. The
 * lanes used to be told apart by colour; now by their words and these bars.
 */
const KITCHEN_STEP = { PLACED: 1, ACCEPTED: 2, SCHEDULED: 2, ARMED: 2, HELD: 2, FIRED: 3, COOKING: 3, READY: 4 };

// The board's clock at the last successful refresh: what a stale screen shows
// so nobody mistakes an old board for a quiet one.
let lastNow = '—';
// On a narrow screen the three lanes take turns; the choice survives a poll.
let shownLane = 'incoming';
// Whether this person's role lets them press anything, or only watch.
let mayAct = false;
// What the board last drew: a poll that brings the same board leaves it — and the finger on it — alone.
let boardSig = '';

function renderBoard(data) {
  const sig = JSON.stringify([data.now, data.watching, data.may_act, data.lanes]);
  if (sig === boardSig && document.querySelector('.board')) {
    fresh();
    return;
  }
  boardSig = sig;
  const scroll = window.scrollY;
  mayAct = Boolean(data.may_act);

  const frame = el(`
    <div>
      <header class="topbar kds">
        <div class="who">
          <span class="eyebrow">Гал тогоо</span>
          <h1 id="venue">${esc(data.watching ?? 'Гал тогоо')}</h1>
        </div>
        <span class="conn" id="conn" role="status">холбогдсон</span>
        <div class="act">
          <span class="clock mn">${esc(data.now)}</span>
          <button class="btn" type="button" id="out">Гарах</button>
        </div>
        <div class="lanes seg" data-fill></div>
      </header>
      <main class="kds-main">
        <div class="stale-strip" role="alert" hidden>Холболт тасарсан — самбар <span class="mono"></span>-ийн байдлаар байна. Дахин холбогдож байна…</div>
        <div class="board"></div>
      </main>
    </div>`);

  const board = frame.querySelector('.board');
  const picker = frame.querySelector('.lanes');
  // When the board last looked is said once, under the first empty lane — not in every one.
  let saidWhen = false;
  for (const lane of LANES) {
    const tickets = data.lanes[lane.key] ?? [];
    const column = el(`
      <section class="lane" data-key="${lane.key}">
        <h2 class="section-title"><span>${lane.title}</span> <span class="count" data-tone="neutral">${tickets.length}</span></h2>
        <div class="stack"></div>
      </section>`);
    const stack = column.querySelector('.stack');

    if (!tickets.length) {
      stack.append(el(`<div class="none empty" data-center><b>${lane.none}</b>${saidWhen ? '' : `<span class="upd">шинэчилсэн <span class="mono">${esc(data.now)}</span></span>`}</div>`));
      saidWhen = true;
    }

    for (const ticket of tickets) stack.append(renderTicket(ticket, lane.key));
    board.append(column);

    const tab = el(`
      <button type="button" data-key="${lane.key}" aria-pressed="${lane.key === shownLane}"${lane.key === shownLane ? ' data-on' : ''}>${
        lane.title
      } <span class="count" data-tone="neutral">${tickets.length}</span></button>`);
    tab.addEventListener('click', () => {
      shownLane = lane.key;
      board.dataset.show = shownLane;
      for (const other of picker.children) {
        other.toggleAttribute('data-on', other === tab);
        other.setAttribute('aria-pressed', String(other === tab));
      }
    });
    picker.append(tab);
  }
  board.dataset.show = shownLane;

  // Two taps: a stray elbow on the pass must not sign the kitchen out mid-service.
  const out = frame.querySelector('#out');
  let armed = null;
  out.addEventListener('click', () => {
    if (armed) {
      clearTimeout(armed);
      signOut();
      return;
    }
    out.textContent = 'Гарах уу?';
    armed = setTimeout(() => {
      armed = null;
      out.textContent = 'Гарах';
    }, 4000);
  });

  root.replaceChildren(frame);
  window.scrollTo(0, scroll);
  lastNow = data.now;
}

/** The board reached the server again: the strip goes, the board takes presses again. */
function fresh() {
  const conn = document.getElementById('conn');
  if (conn?.dataset.stale) {
    conn.textContent = 'холбогдсон';
    delete conn.dataset.stale;
  }
  const strip = document.querySelector('.stale-strip');
  if (strip) strip.hidden = true;
  const board = document.querySelector('.board');
  if (board) {
    delete board.dataset.stale;
    board.removeAttribute('inert');
  }
}

/**
 * What the band's big number says, and the small word under it that says
 * what the number is counting. Minutes are signed: below zero a ticket not
 * yet on the fire is late and says so; exactly zero is now. A ticket that is
 * cooking counts its time on the fire — it is never late for a fire it is
 * already on. A new ticket shows the time the guest sits.
 */
function countdownFor(ticket, lane) {
  const minutes = ticket.countdown_minutes;
  if (lane === 'ready') return { value: '✓', note: 'бэлэн болсон' };
  if (minutes === null) return { value: ticket.due_at, note: 'суух цаг' };
  if (lane === 'cooking') {
    // Fired by hand before its time, the clock it was planned to is still ahead of it.
    return minutes > 0 ? { value: `${minutes} мин`, note: 'эрт тавьсан' } : { value: `${-minutes} мин`, note: 'гал дээр' };
  }
  if (minutes < 0) return { value: `−${-minutes} мин`, note: 'хоцорсон' };
  if (minutes === 0) return { value: 'ОДОО', note: 'гал тавих цаг' };
  return { value: `${minutes} мин`, note: 'гал тавих хүртэл' };
}

function renderTicket(ticket, lane) {
  const { value, note } = countdownFor(ticket, lane);
  // Late is for a ticket still waiting for its fire; one already cooking is never late for it.
  const late = lane === 'incoming' && ticket.countdown_minutes !== null && ticket.countdown_minutes < 0;
  // «32 мин» is a figure and a word: the word is marked so it can be set in
  // the sans face beside the number. The text is unchanged.
  const unit = value.match(/^(.*) мин$/);
  const figure = unit ? `${esc(unit[1])} <small>мин</small>` : esc(value);
  // A scheduled ticket's fire time is the clock the countdown runs to; said once, under the band.
  const fireAt = lane === 'incoming' && ticket.countdown_minutes !== null ? `гал тавих <span class="mono">${esc(ticket.due_at)}</span> · ` : '';
  // Its fire time has come: a gold hairline over the card until it is on the fire.
  const now = lane === 'incoming' && ticket.countdown_minutes === 0;
  const step = KITCHEN_STEP[ticket.state] ?? { incoming: 1, cooking: 3, ready: 4 }[lane];

  const node = el(`
    <article class="ticket card" data-lane="${lane}"${ticket.needs_attention ? ' data-attention' : ''}${
      late ? ' data-late' : ''
    }${now ? ' data-now' : ''}>
      <div class="top">
        <div class="who">
          <span class="id mn">№${esc(ticket.code)}</span>
          ${ticket.table ? `<span class="tbl chip" data-size="lg">Ширээ ${esc(ticket.table)}</span>` : ''}
        </div>
        <div class="cdw"><span class="cd mn">${figure}</span>${note ? `<span class="cds">${note}</span>` : ''}</div>
        ${meter(step)}
        ${ticket.needs_attention ? '<div class="why">Багтаамж дүүрсэн — гараар шийд</div>' : ''}
      </div>
      <div class="body">
        <div class="meta">${fireAt}${esc(ticket.party_size)} хүн${
          ticket.guest ? ` · ${esc(ticket.guest)}` : ''
        }${ticket.seated ? ' <span class="chip" data-tone="ready">СУУСАН</span>' : ''}</div>
        <div class="lines">${ticket.lines
          .map((l) => `<div><b class="mn">×${esc(l.qty)}</b><span>${esc(l.name)}</span></div>`)
          .join('')}</div>
        <div class="btns"></div>
      </div>
    </article>`);

  // A role that only watches the kitchen gets the board without the buttons.
  if (!mayAct) return node;

  const buttons = node.querySelector('.btns');
  /** One press: the button turns while it goes, the board redraws when it is done. */
  const send = async (action, button) => {
    try {
      await kitchen(`/v1/kds/tickets/${ticket.id}/${action}`, { method: 'POST', body: {} });
      await refreshBoard();
    } catch (error) {
      // Signed out elsewhere, or the role taken away: back to the door,
      // not buttons that no longer do anything.
      if (error.status === 401 || error.status === 403) {
        boot();
        return;
      }
      toast(error.message, 'bad');
      if (button) delete button.dataset.busy;
    }
  };
  const add = (label, action, variant) => {
    // One large primary per ticket; everything else is the 44px default —
    // the outline already makes «Татгалзах» secondary, a shorter button
    // would only make it harder to hit.
    const size = variant === 'primary' ? ' data-size="lg"' : '';
    const button = el(
      `<button class="btn" type="button"${variant ? ` data-v="${variant}"` : ''}${size}>${label}</button>`,
    );
    button.addEventListener('click', async () => {
      if (button.dataset.busy) return;
      // Refusing a paid order sends the guest's money back and cannot be
      // undone: one wet tap is not enough, the popup asks first.
      if (action === 'reject') {
        void refuse(ticket);
        return;
      }
      button.dataset.busy = '1';
      await send(action, button);
    });
    buttons.append(button);
  };

  if (ticket.state === 'PLACED') {
    add('Хүлээн авах', 'accept', 'primary');
    add('Татгалзах', 'reject', 'danger');
  } else if (lane === 'incoming') {
    // «Одоо тавь» is never taken away, whatever the model thinks.
    add('Одоо тавь', 'fire-now', 'primary');
    add('+5 мин', 'hold');
  } else if (lane === 'cooking') {
    add('Бэлэн боллоо', 'ready', 'primary');
  } else {
    add('Гардуулсан', 'served', 'primary');
  }

  return node;
}

/** «Татгалзах», asked: which order, at which table, and that the money goes back whole. */
async function refuse(ticket) {
  const done = await popup({
    id: 'reject-order',
    title: 'Захиалгыг татгалзах уу?',
    sub: `<span class="mn">№${esc(ticket.code)}</span>${ticket.table ? ` · Ширээ ${esc(ticket.table)}` : ''} · ${esc(ticket.party_size)} хүн${ticket.guest ? ` · ${esc(ticket.guest)}` : ''}`,
    width: 460,
    fields: [
      {
        type: 'note',
        html: `${ticket.lines.map((l) => `${esc(l.name)} ×${esc(l.qty)}`).join(', ')}. Зочинд төлсөн мөнгө нь <b>бүтнээр</b> буцна. Татгалзсаныг буцаах боломжгүй.`,
      },
    ],
    submit: 'Татгалзах',
    danger: true,
    onSubmit: async () => {
      await kitchen(`/v1/kds/tickets/${ticket.id}/reject`, { method: 'POST', body: {} });
      return true;
    },
  });
  if (done) await refreshBoard();
}

/** Whether the board is up: the poll only asks when there is one to redraw. */
const onBoard = () => Boolean(document.querySelector('.board'));

async function refreshBoard() {
  try {
    renderBoard(await kitchen('/v1/kds/tickets'));
  } catch (error) {
    if (error.status === 401) {
      signOut();
      return;
    }
    if (error.status === 403) {
      showNotHere();
      return;
    }
    // A screen that cannot reach us keeps showing the last board it had, and
    // says so — a blank screen mid-service is worse than a stale one. The
    // board fades and stops taking presses until the server answers again.
    const conn = document.getElementById('conn');
    if (conn) {
      conn.textContent = 'холболт тасарсан';
      conn.dataset.stale = '1';
    }
    const strip = document.querySelector('.stale-strip');
    if (strip) {
      strip.querySelector('.mono').textContent = lastNow;
      strip.hidden = false;
    }
    // Out of reach of the keyboard and a screen reader too, not only of a finger.
    const board = document.querySelector('.board');
    if (board) {
      board.dataset.stale = '1';
      board.setAttribute('inert', '');
    }
  }
}

/* ── boot ────────────────────────────────────────────────────────── */

function boot() {
  if (!token()) {
    void showDoor();
    return;
  }
  void refreshBoard();
}

mountClock(() => {
  if (onBoard()) void refreshBoard();
});

boot();

// The board is the kitchen's only view of what is coming, so it polls — and
// stops when the page goes away rather than asking on behalf of nobody.
const poll = setInterval(() => {
  if (!document.hidden && onBoard()) void refreshBoard();
}, 3000);
addEventListener('pagehide', () => clearInterval(poll));
</script>
</body>
</html>
