<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0D" media="(prefers-color-scheme: dark)">
<title>Гал тогоо — Basu</title>
<link rel="stylesheet" href="/app.css">
<style>
/* Layout only. Colour, type, radius, buttons, chips, cards and the empty
   row all come from app.css. The board sets a 20px base and scales its own
   pieces in em, because a chef reads it from two metres with wet hands;
   everything around the board is the shared system at its normal size. */

/* ── chrome: the sticky bar, and on a narrow screen the lane picker in it ── */
.topbar.kds{
  grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"who conn act" "lanes lanes lanes";
  gap:0 12px;padding-left:var(--gutter);padding-right:12px;
}
.topbar.kds .who{grid-area:who;min-width:0;padding:8px 0}
.topbar.kds .who .eyebrow{display:block;margin-bottom:5px}
.topbar.kds .who h1{font-size:var(--t-title-2);line-height:1.2;letter-spacing:-.015em}
.topbar.kds .conn{grid-area:conn}
.topbar.kds .act{grid-area:act;align-items:center;gap:12px}
.topbar.kds .clock{font-size:var(--t-live);font-weight:600;line-height:1;color:var(--ink)}
.topbar.kds > .lanes{grid-area:lanes;margin:4px 0 10px}
/* On a portrait tablet these tabs are the only way to change lane, and the
   hands pressing them are wet: the full 44px touch bar, not the seg's 40. */
.topbar.kds > .lanes[data-fill] > button{min-height:var(--target)}
@media (min-width:821px){.topbar.kds > .lanes[data-fill]{display:none}}
/* A phone is too narrow for the name, the connection and the clock in one
   row: the connection word drops under the name, the clock keeps its place. */
@media (max-width:600px){
  .topbar.kds{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who act" "conn act" "lanes lanes"}
  .topbar.kds .who{padding-bottom:2px}
  .topbar.kds .conn{padding-bottom:8px}
}

/* ── board: three columns in a 24px gutter, no card around a lane ── */
.board{
  font-size:1.25rem;display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:var(--s-6);align-items:start;
  padding:var(--s-5) var(--gutter) calc(var(--s-7) + var(--safe-b));
  min-height:calc(100dvh - var(--bar-h) - var(--safe-t));
}
.lane{min-width:0}
.lane > .section-title{display:flex;align-items:center;gap:10px;margin:0 0 var(--s-3)}
.lane .stack{display:flex;flex-direction:column;gap:var(--s-3);min-width:0}
/* The empty row's hairline spans the lane like the title above it; the text
   stays centred. */
.lane .none{width:100%;max-width:none}
.lane .none .mono{display:block;margin-top:4px;font-size:var(--t-meta);color:var(--ink-3)}
@media (max-width:820px){
  .board{grid-template-columns:1fr;min-height:0;padding-top:var(--s-4)}
  .board[data-show] .lane{display:none}
  .board[data-show="incoming"] .lane[data-key="incoming"],
  .board[data-show="cooking"] .lane[data-key="cooking"],
  .board[data-show="ready"] .lane[data-key="ready"]{display:block}
  .lane > .section-title{display:none}
}

/* ── ticket: a card with a state band on top, body below ── */
/* The band has one shape on every ticket at every width: two columns, two
   lines. Left is who — the № over the table chip; right is when — the big
   figure over the word that says what it counts to. Nothing on one side ever
   has to fit beside the other side's longest phrase, so the chip never drops
   under the № on a 1024px tablet, and both columns share a min-height so a
   cooking ticket (no note) or an unseated one (no table) keeps the same band
   height as its neighbours. A capacity warning is a third, full-width line. */
.ticket{min-width:0;padding:0;overflow:hidden}
.ticket > .top{
  display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:.4em .6em;
  padding:.5em .8em;border-bottom:1px solid var(--line);background:var(--surface-2);
}
.ticket[data-lane="incoming"] > .top{background:var(--route-soft)}
.ticket[data-lane="cooking"] > .top{background:var(--accent-soft)}
.ticket[data-lane="ready"] > .top{background:var(--ready-soft)}
.ticket[data-late] > .top,.ticket[data-attention] > .top{background:var(--stop-soft)}
.ticket .who,.ticket .cdw{
  flex:none;display:flex;flex-direction:column;justify-content:space-between;gap:.2em;
  min-height:2.8em;max-width:100%;min-width:0;
}
.ticket .who{align-items:flex-start}
.ticket .cdw{align-items:flex-end;text-align:right}
.ticket .id{font-size:1em;font-weight:600;line-height:1.2;color:var(--ink);white-space:nowrap}
.ticket .tbl{max-width:100%}
.ticket .why{flex-basis:100%;font-size:.75em;font-weight:600;line-height:1.3;color:var(--stop)}
.ticket .cd{font-size:1.6em;font-weight:600;line-height:1;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
/* The unit is a word, not a figure: it sits beside the number in the sans
   face at half its size. textContent is still «32 мин». */
.ticket .cd small{font-family:var(--sans);font-size:.5em;font-weight:500;letter-spacing:0;color:var(--ink-2)}
/* The word the chef reads to know what the figure means — «хоцорсон» decides
   something — so it is sans at 13px on the 20px board, not 11.5px mono. */
.ticket .cds{font-family:var(--sans);font-size:.65em;font-weight:500;line-height:1.2;letter-spacing:0;color:var(--ink-2)}
.ticket[data-late] .cds,.ticket[data-attention] .cds{color:var(--stop)}
.ticket .body{padding:.6em .8em .8em}
.ticket .where{font-size:.75em;font-weight:600;line-height:1.3;color:var(--ink);margin-bottom:.15em}
.ticket .meta{
  font-family:var(--sans);font-size:.65em;line-height:1.45;color:var(--ink-2);
  font-variant-numeric:tabular-nums;white-space:normal;overflow:visible;text-overflow:clip;
}
.ticket .meta .chip{vertical-align:middle;margin-left:.3em}
.ticket .lines{display:flex;flex-direction:column;margin:.45em 0 .7em}
.ticket .lines > div{display:flex;align-items:baseline;gap:.5em;padding:.3em 0;border-top:1px solid var(--line);line-height:1.3;min-width:0}
.ticket .lines > div:first-child{border-top:0}
.ticket .lines b{flex:none;min-width:2em;font-size:.9em;font-weight:600;color:var(--ink)}
.ticket .lines span{font-size:.85em;min-width:0}
.ticket .btns{display:flex;flex-direction:column;gap:.4em}
.ticket .btns .btn{width:100%}
.ticket .btns .btn[data-size="lg"]{min-height:56px}

/* ── pairing: one card in the middle of the ground ── */
.pair{width:min(420px,calc(100% - 2 * var(--gutter)));margin:var(--s-8) auto;padding:var(--s-6);text-align:center}
.pair > p{margin:6px 0 var(--s-5);color:var(--ink-2)}
.pair input.code{margin-bottom:var(--s-3)}
.pair .hint{margin-top:var(--s-5);text-align:left;font-size:var(--t-cap);line-height:1.5;color:var(--ink-2)}
.pair .hint ul{list-style:none;margin:var(--s-2) 0 0;padding:0}
.pair .hint li{display:flex;align-items:center;gap:12px;min-height:32px;border-top:1px solid var(--line)}
.pair .hint code{font-size:var(--t-body);color:var(--ink)}
.pair .dev{margin:var(--s-5) calc(-1 * var(--s-6)) calc(-1 * var(--s-6));padding-bottom:var(--s-2);border-top:1px solid var(--line);text-align:left}
.pair .dev > summary{
  display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--target);padding:0 var(--s-6);
  list-style:none;cursor:pointer;font-size:var(--t-body);font-weight:500;color:var(--ink-2);
}
.pair .dev > summary::-webkit-details-marker{display:none}
.pair .dev > summary::after{
  content:"";width:16px;height:16px;flex:none;background:var(--ink-3);transform:rotate(90deg);transition:transform var(--dur);
  -webkit-mask:var(--mask-chev) center/contain no-repeat;mask:var(--mask-chev) center/contain no-repeat;
}
.pair .dev[open] > summary::after{transform:rotate(-90deg)}
.pair .or{display:block;text-align:center;margin:var(--s-1) 0 var(--s-3)}
.pair .venues[data-rows]{border:0;border-radius:0;box-shadow:none;background:none;overflow:visible;border-top:1px solid var(--line)}
.pair .venues > .row{padding-left:var(--s-6);padding-right:var(--s-6)}
.pair .venues .tag:not(.chip){font-size:var(--t-cap);color:var(--ink-3)}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { api, store, toast, mountClock, hhmm } from '/api.js';

const root = document.getElementById('root');
const esc = (value) => {
  const node = document.createElement('span');
  node.textContent = value ?? '';
  return node.innerHTML;
};
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};

/* ── pairing ─────────────────────────────────────────────────────── */

async function showPairing() {
  const [{ devices }, { venues }] = await Promise.all([
    api('/dev/pairing-codes').catch(() => ({ devices: [] })),
    api('/dev/venues').catch(() => ({ venues: [] })),
  ]);
  root.replaceChildren();

  const card = el(`
    <div class="pair card">
      <h2>Таблетаа холбоно уу</h2>
      <p>Менежерээс авсан 8 оронтой кодоо оруулна уу.</p>
      <input class="code" inputmode="numeric" maxlength="8" placeholder="········" aria-label="Холбох код">
      <button class="btn" data-v="primary" data-size="lg" type="button">Холбох</button>
    </div>`);

  const input = card.querySelector('input');
  const submit = async () => {
    try {
      const { token } = await api('/v1/kds/pair', {
        method: 'POST',
        body: { pairing_code: input.value.trim() },
      });
      store.deviceToken = token;
      boot();
    } catch (error) {
      toast(error.message, 'bad');
      input.select();
    }
  };
  card.querySelector('button').addEventListener('click', submit);
  input.addEventListener('keydown', (e) => e.key === 'Enter' && submit());

  if (devices.length) {
    input.value = devices[0].code;
    // A list, one row per code: el() keeps only the first element of what it
    // is given, so a bare "<code> name<br>" used to lose the name.
    const hint = el('<div class="hint">Холбоогүй ресторанны кодууд:<ul></ul></div>');
    const list = hint.querySelector('ul');
    for (const device of devices) {
      list.append(el(`<li><code>${device.code}</code>${esc(device.name)}</li>`));
    }
    card.append(hint);
  }

  // The demo clock moves in hours and pairing codes expire in minutes, so
  // typing one is not always possible. Picking a kitchen always is — but it
  // is a developer's door, so it sits folded under the real one.
  if (venues.length) {
    const dev = el(`
      <details class="dev">
        <summary>Хөгжүүлэгчийн горим</summary>
        <div class="or eyebrow">эсвэл демо горимоор</div>
      </details>`);
    const list = el('<div class="venues" data-rows></div>');

    // First, because it is what a walkthrough actually needs: orders placed at
    // any of the ten venues land on one screen instead of nine of them being
    // invisible.
    const all = el(`
      <button type="button" class="row" data-watched>
        <span class="main"><span class="title" data-weight="normal">Бүх гал тогоо</span></span>
        <span class="end"><span class="tag">${venues.length} ресторан</span></span>
      </button>`);
    all.addEventListener('click', () => {
      store.deviceToken = ALL;
      boot();
    });
    list.append(all);
    for (const venue of venues) {
      const button = el(`
        <button type="button" class="row"${venue.watched ? ' data-watched' : ''}>
          <span class="main"><span class="title" data-weight="normal">${esc(venue.name)}</span></span>
          <span class="end"><span class="tag chip" data-inline${venue.watched ? ' data-tone="ready"' : ''}>${
            venue.watched ? 'захиалга авч байна' : 'хаалттай'
          }</span></span>
        </button>`);
      button.addEventListener('click', async () => {
        try {
          const { token } = await api('/dev/kds-token', {
            method: 'POST',
            body: { restaurant_id: venue.id },
          });
          store.deviceToken = token;
          boot();
        } catch (error) {
          toast(error.message, 'bad');
        }
      });
      list.append(button);
    }
    dev.append(list);
    card.append(dev);
  }

  if (!devices.length && !venues.length) {
    card.append(el('<div class="hint">Ресторан алга. <code>npm run seed</code> ажиллуулна уу.</div>'));
  }

  root.append(card);
  input.focus();
}

/* ── the board ───────────────────────────────────────────────────── */

const LANES = [
  { key: 'incoming', title: 'Ирж явна' },
  { key: 'cooking', title: 'Гал дээр' },
  { key: 'ready', title: 'Бэлэн' },
];

/**
 * Which board this screen is showing.
 *
 * A real tablet is paired to one restaurant and sees that one — the token says
 * so and the API enforces it. A walkthrough moves between ten venues, and
 * orders placed at nine of them would be invisible on a screen paired to the
 * tenth, so the demo can watch every kitchen at once.
 */
const ALL = 'all-kitchens';
const watchingAll = () => store.deviceToken === ALL;

let lastSeen = 0;
// The board's clock at the last successful refresh: what a stale screen shows
// so nobody mistakes an old board for a quiet one.
let lastNow = '—';
// On a narrow screen the three lanes take turns; the choice survives a poll.
let shownLane = 'incoming';

function renderBoard(data) {
  const scroll = window.scrollY;

  const frame = el(`
    <div>
      <header class="topbar kds">
        <div class="who">
          <span class="eyebrow">Гал тогоо</span>
          <h1 id="venue">${watchingAll() ? 'Бүх гал тогоо' : esc(data.watching ?? 'Гал тогоо')}</h1>
        </div>
        <span class="conn" id="conn" role="status">холбогдсон</span>
        <div class="act">
          <span class="clock mn">${data.now}</span>
          <button class="btn" type="button" id="swap">Солих</button>
        </div>
        <div class="lanes seg" data-fill></div>
      </header>
      <div class="stale-strip" hidden>холболт тасарсан<span class="mono"></span></div>
      <div class="board"></div>
    </div>`);

  const board = frame.querySelector('.board');
  const picker = frame.querySelector('.lanes');
  for (const lane of LANES) {
    const tickets = data.lanes[lane.key] ?? [];
    const column = el(`
      <section class="lane" data-key="${lane.key}">
        <h2 class="section-title"><span>${lane.title}</span><span class="count" data-tone="neutral">${tickets.length}</span></h2>
        <div class="stack"></div>
      </section>`);
    const stack = column.querySelector('.stack');

    if (!tickets.length) {
      stack.append(el(`<div class="none empty" data-center>—<span class="mono">${data.now}</span></div>`));
    }

    for (const ticket of tickets) stack.append(renderTicket(ticket, lane.key));
    board.append(column);

    const tab = el(`
      <button type="button" data-key="${lane.key}"${lane.key === shownLane ? ' data-on' : ''}>${
        lane.title
      }<span class="count" data-tone="neutral">${tickets.length}</span></button>`);
    tab.addEventListener('click', () => {
      shownLane = lane.key;
      board.dataset.show = shownLane;
      for (const other of picker.children) other.toggleAttribute('data-on', other === tab);
    });
    picker.append(tab);
  }
  board.dataset.show = shownLane;

  frame.querySelector('#swap').addEventListener('click', () => {
    store.deviceToken = null;
    showPairing();
  });

  root.replaceChildren(frame);
  window.scrollTo(0, scroll);
  lastSeen = Date.now();
  lastNow = data.now;
}

/**
 * What the band's big number says, and the small word under it that says
 * what the number is counting to. Minutes are signed: below zero the ticket
 * is late and says so; exactly zero is now.
 */
function countdownFor(ticket, lane) {
  const minutes = ticket.countdown_minutes;
  if (lane === 'ready') return { value: '✓', note: 'бэлэн болсон' };
  if (minutes === null) return { value: ticket.due_at, note: 'хүлээн авах хүртэл' };
  if (minutes < 0) return { value: `−${-minutes} мин`, note: 'хоцорсон' };
  const note = lane === 'incoming' ? 'гал дээр тавих' : '';
  return { value: minutes === 0 ? 'ОДОО' : `${minutes} мин`, note };
}

function renderTicket(ticket, lane) {
  const { value, note } = countdownFor(ticket, lane);
  const late = lane !== 'ready' && ticket.countdown_minutes !== null && ticket.countdown_minutes < 0;
  // «32 мин» is a figure and a word: the word is marked so it can be set in
  // the sans face beside the number. The text is unchanged.
  const unit = value.match(/^(.*) мин$/);
  const figure = unit ? `${unit[1]} <small>мин</small>` : value;

  const node = el(`
    <article class="ticket card" data-lane="${lane}"${ticket.needs_attention ? ' data-attention' : ''}${
      late ? ' data-late' : ''
    }>
      <div class="top">
        <div class="who">
          <span class="id mn">№${ticket.code}</span>
          ${ticket.table ? `<span class="tbl chip" data-size="lg">Ширээ ${esc(ticket.table)}</span>` : ''}
        </div>
        <div class="cdw"><span class="cd mn">${figure}</span>${note ? `<span class="cds">${note}</span>` : ''}</div>
        ${ticket.needs_attention ? '<div class="why">Багтаамж дүүрсэн — гараар шийд</div>' : ''}
      </div>
      <div class="body">
        ${watchingAll() && ticket.restaurant ? `<div class="where">${esc(ticket.restaurant)}</div>` : ''}
        <div class="meta">${ticket.due_at} · ${ticket.party_size} хүн${
          ticket.guest ? ` · ${esc(ticket.guest)}` : ''
        }${ticket.seated ? ' <span class="chip" data-tone="ready">СУУСАН</span>' : ''}</div>
        <div class="lines">${ticket.lines
          .map((l) => `<div><b class="mn">×${l.qty}</b><span>${esc(l.name)}</span></div>`)
          .join('')}</div>
        <div class="btns"></div>
      </div>
    </article>`);

  const buttons = node.querySelector('.btns');
  const add = (label, action, variant) => {
    // One large primary per ticket; everything else is the 44px default —
    // the outline already makes «Татгалзах» secondary, a shorter button
    // would only make it harder to hit.
    const size = variant === 'primary' ? ' data-size="lg"' : '';
    const button = el(
      `<button class="btn" type="button"${variant ? ` data-v="${variant}"` : ''}${size}>${label}</button>`,
    );
    button.addEventListener('click', async () => {
      if (button.dataset.busy) return;
      button.dataset.busy = '1';
      try {
        await api(
          watchingAll()
            ? `/dev/kds/tickets/${ticket.id}/${action}`
            : `/v1/kds/tickets/${ticket.id}/${action}`,
          { method: 'POST', token: watchingAll() ? undefined : store.deviceToken, body: {} },
        );
        await refreshBoard();
      } catch (error) {
        // A revoked or stale tablet must go back to pairing, not sit there
        // showing "please sign in" over buttons that no longer do anything.
        if (error.status === 401 && !watchingAll()) {
          store.deviceToken = null;
          showPairing();
          return;
        }
        toast(error.message, 'bad');
        delete button.dataset.busy;
      }
    });
    buttons.append(button);
  };

  if (ticket.state === 'PLACED') {
    add('Хүлээн авах', 'accept', 'primary');
    add('Татгалзах', 'reject', 'danger');
  } else if (lane === 'incoming') {
    // «Одоо тавь» is never taken away, whatever the model thinks.
    add('Одоо тавь', 'fire-now', 'primary');
    add('+5 мин', 'hold');
  } else if (lane === 'cooking') {
    add('Бэлэн боллоо', 'ready', 'primary');
  } else {
    add('Гардуулсан', 'served', 'primary');
  }

  return node;
}

async function refreshBoard() {
  try {
    const data = watchingAll()
      ? await api('/dev/kds/tickets')
      : await api('/v1/kds/tickets', { token: store.deviceToken });
    renderBoard(data);
  } catch (error) {
    if (error.status === 401 && !watchingAll()) {
      store.deviceToken = null;
      showPairing();
      return;
    }
    // A tablet that cannot reach us keeps showing the last board it had, and
    // says so — a blank screen mid-service is worse than a stale one.
    const conn = document.getElementById('conn');
    if (conn) {
      conn.textContent = 'холболт тасарсан';
      conn.dataset.stale = '1';
    }
    const strip = document.querySelector('.stale-strip');
    if (strip) {
      strip.querySelector('.mono').textContent = lastNow;
      strip.hidden = false;
    }
  }
}

/* ── boot ────────────────────────────────────────────────────────── */

function boot() {
  if (!store.deviceToken) {
    showPairing();
    return;
  }
  refreshBoard();
}

mountClock(() => {
  if (store.deviceToken) refreshBoard();
});

boot();

// The board is the kitchen's only view of what is coming, so it polls — and
// stops when the page goes away rather than asking on behalf of nobody.
const poll = setInterval(() => {
  if (!document.hidden && store.deviceToken) void refreshBoard();
}, 3000);
addEventListener('pagehide', () => clearInterval(poll));
void hhmm;
void lastSeen;
</script>
</body>
</html>
