<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1110" media="(prefers-color-scheme: dark)">
<title>Нийлүүлэгч — Basu</title>
<link rel="stylesheet" href="/app.css">
<script src="/vendor/table-core.js"></script>
<style>
/* ── The supplier's own app ─────────────────────────────────────────
   For a person with a knife in one hand and a phone in the other, and for
   the same person at a desk. Colour, type, buttons, chips, cards, rows,
   fields, popups and tables all come from /app.css; what is left here is
   where things sit. */

/* ── the doors: sign in, apply, waiting ── */
.door{max-width:440px;margin:32px auto;padding:0 var(--gutter) calc(24px + var(--safe-b))}
.door .card{padding:24px 20px}
.door .brand{display:inline-flex;align-items:center;min-height:var(--target);margin:-10px 0 6px;color:var(--ink);text-decoration:none}
.door h2{font-size:var(--t-title-2);line-height:1.2;letter-spacing:-.015em;margin-bottom:6px;text-wrap:balance}
.door .lead{color:var(--ink-2);margin:0 0 20px;text-wrap:pretty}
.door .form-group > .cap{margin:-2px 0 14px}
.door .foot{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.door .form-error{margin:0 0 16px}
/* what being a supplier is, in three facts under the way in */
.how{list-style:none;margin:20px 4px 0;padding:0;display:grid;gap:14px}
.how li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;font-size:var(--t-body);line-height:1.5;color:var(--ink-2)}
.how li b{display:block;font-size:var(--t-body-lg);font-weight:600;color:var(--ink);margin-bottom:2px}
.how .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:var(--t-cap);font-weight:600;color:var(--ink-2)}
.door-foot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 8px;margin-top:8px;font-size:var(--t-cap);font-weight:500;color:var(--ink-3)}
.door-foot a,.door-foot button{display:inline-flex;align-items:center;min-height:var(--target);padding:0;border:0;background:none;font:inherit;color:var(--ink-2);text-decoration:none;cursor:pointer}
.door-foot .other{flex-basis:100%;justify-content:center;color:var(--accent-ink)}
/* the walkthrough's shortcuts: one folded «Демо горим» group, fenced off from the real door */
.demo{margin-top:20px;padding:0 14px}
.demo > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--target);cursor:pointer;-webkit-user-select:none;user-select:none}
.demo > summary::-webkit-details-marker{display:none}
.demo > summary .chev{transform:rotate(90deg);transition:transform var(--dur) var(--ease)}
.demo[open] > summary .chev{transform:rotate(-90deg)}
.demo > .body{padding:0 0 12px}
.demo .btn{width:100%}
.demo .venues[data-rows]{background:none;border:0;border-radius:0;box-shadow:none;border-top:1px solid var(--line);margin-top:12px}
.demo .venues .row{padding-left:0;padding-right:0}
.demo .venues .row:active{background:var(--surface)}
@media (hover:hover){.demo .venues .row:hover{background:var(--surface)}}
/* where an application stands */
.status{padding:4px 0 0}
.status .big{font-size:var(--t-headline);font-weight:600;line-height:1.2;letter-spacing:-.015em;color:var(--ink)}
.status .big::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3);margin:0 8px 3px 0;vertical-align:middle}
.status[data-s="applied"] .big::before{background:var(--hold)}
.status[data-s="contracted"] .big::before{background:var(--ready)}
.status[data-s="declined"] .big::before{background:var(--stop)}
.status .cap{margin-top:6px;max-width:44ch;font-size:var(--t-body)}
.door .stepper{margin:16px 0 4px}
.door .card > .btn[data-size="lg"]{margin-top:20px}
/* a field the page refused, said where it is — the stop tone wins over the field's own border */
.door .field :is(input,textarea)[aria-invalid="true"]{border-color:var(--stop);box-shadow:0 0 0 3px var(--stop-soft)}
.door .field .help[data-error]{color:var(--stop);font-weight:500}

/* ── the app frame ── */
.shell{min-height:100dvh;display:flex;flex-direction:column}
.view{flex:1;min-width:0;width:100%;max-width:var(--col-desk);margin:0 auto;padding:16px var(--gutter) 24px}
.view .page-head[data-large]{padding-top:4px}
.page-head p{margin-bottom:0}
.head-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.page-head[data-large] .head-acts{margin-top:14px}
/* on a phone the bar names the business at its leading edge; the way out sits at the end */
.topbar.sup{grid-template-columns:minmax(0,1fr) auto;padding-left:var(--gutter)}
.topbar.sup[data-shell]{grid-template-columns:auto minmax(0,1fr);padding-left:8px}
.topbar.sup .title{text-align:left}
.topbar.sup .title span{color:var(--ink-3)}
/* on a phone the nav is a tab bar and shows only its tabs */
.tabbar > :not([data-tab]){display:none}
/* signing out is two taps: the first turns the button into the question, the second answers it */
.topbar .out[data-confirm]{width:auto;padding:0 12px;border-color:var(--stop-line);color:var(--stop)}
.topbar .out[data-confirm] svg{display:none}
.sidebar .out[data-confirm]{background:var(--stop-soft);color:var(--stop)}
/* at a desk the pages sit in the dashboard's frame (/app.css .desk-frame) */
.desk-frame .page{width:100%;max-width:var(--col-desk);margin:0 auto;padding:28px var(--gutter) 48px}
/* a lost connection is said across the work, with the last time it was right */
#conn{margin:0 0 16px;border:1px solid var(--stop-line);border-radius:var(--r-ctl)}
#conn .mono{margin-left:0}
#board[data-stale]{opacity:.55;transition:opacity var(--dur) var(--ease)}

/* ── today ── */
.stats{margin-bottom:24px}
.group{margin-top:28px}
.group:first-child{margin-top:0}
.group h3{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.group h3 .n{margin:0}
.stack{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));align-items:start}
.stack > *{min-width:0}
/* one order: a state band on top, the facts, the money, one button */
.ticket .top{
  display:flex;align-items:center;gap:8px;min-height:40px;padding:8px 16px;
  border-bottom:1px solid var(--line);border-radius:calc(var(--r-md) - 1px) calc(var(--r-md) - 1px) 0 0;
  background:var(--surface-2);font-size:var(--t-pill);font-weight:500;line-height:1.2;color:var(--ink-2);
}
.ticket[data-lane="paid"] .top,.ticket[data-lane="dispatched"] .top{background:var(--route-soft);border-color:var(--route-line);color:var(--route)}
.ticket[data-lane="preparing"] .top{background:var(--hi-soft);border-color:var(--hi-line);color:var(--hi-ink)}
.ticket[data-lane="ready"] .top{background:var(--ready-soft);border-color:var(--ready-line);color:var(--ready)}
.ticket .top .dot{margin:0}
.ticket .top .id{font-family:var(--mono);font-size:var(--t-body-lg);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);margin-left:4px}
.ticket .body{padding:14px 16px 16px}
.ticket .what{font-size:var(--t-row);font-weight:600;line-height:var(--lh-snug);color:var(--ink)}
.ticket .facts-rows{margin-top:6px}
.ticket .who,.ticket .on,.ticket .where{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px;padding:6px 0;font-size:var(--t-body-lg);line-height:1.4}
.ticket .k{font-size:var(--t-cap);line-height:1.4;padding-top:2px;color:var(--ink-3)}
.ticket .v{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;color:var(--ink);min-width:0}
.ticket .where .v > span:first-child{overflow-wrap:anywhere}
.ticket .rel{font-size:var(--t-cap);font-weight:500;color:var(--ink-2)}
.ticket .rel[data-tone="hold"]{color:var(--hold);font-weight:600}
.ticket .rel[data-tone="stop"]{color:var(--stop);font-weight:600}
/* a number dials: the whole 44px line is the target, not the 14px glyph */
.ticket a.tel{min-height:var(--target);margin:-12px 0;padding:0 2px}
.ticket .sum,.ticket .pay{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:var(--t-cap);color:var(--ink-2)}
.ticket .sum{margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.ticket .pay{margin-top:6px}
.ticket .sum .money,.ticket .pay .money{font-size:var(--t-body-lg)}
.ticket .pay .money{color:var(--ready)}
.ticket .grace{margin-top:12px;font-size:var(--t-cap)}
.ticket .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
/* on the desk the one button sits at its own width on the right, Цуцлах quiet beside it — the full-width slab is a thumb affordance */
:root[data-desk] .ticket .body > .btns{flex-direction:row-reverse;justify-content:flex-start;gap:8px}
:root[data-desk] .ticket .body > .btns .btn[data-size="lg"]{width:auto;min-height:var(--h-md);padding:0 18px;font-size:var(--t-body-lg)}
/* the shape of the work while it loads */
.board-skel{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.board-skel .card{display:grid;gap:12px;padding:16px}
.board-skel .skel{height:14px}
.board-skel .skel[data-h="band"]{height:24px}
.board-skel .skel[data-h="btn"]{height:52px;margin-top:8px}
/* the module's shape before the seat is known (waiting()): the frame at its sizes, bars where its words will be */
.sup-wait .page-head > div{flex:1;min-width:0;display:grid;gap:10px}
/* bars on the ground itself, not on a card: the hairline's tone, or the light ground swallows them */
.sup-wait .page-head .skel{background:var(--line)}
.sup-wait .wait-title{height:30px;width:min(220px,60%)}
.sup-wait .page-head[data-large] .wait-title{height:34px}
.sup-wait .wait-line{height:14px;width:min(180px,45%)}
.sup-wait .kpi-band{margin-bottom:24px}
.sup-wait .kpi{display:grid;gap:10px;padding:16px 18px}
.sup-wait .ws-btn{background:var(--surface)}
.sup-wait .ws-text{gap:6px}
.sup-wait .ws-mark{background:var(--surface-2)}
.sup-wait .wait-nav{display:grid;gap:14px;padding:10px 10px 0}
.sup-wait .wait-nav .skel{height:14px;width:70%}
.sup-wait .wait-nav .skel:nth-child(2n){width:52%}
.sup-wait .topbar .title{display:grid;gap:6px}
.sup-wait .wait-name{height:16px;width:min(200px,55%)}
.sup-wait .wait-role{height:12px;width:min(120px,35%)}

/* ── orders ── */
.orders .tools{margin-bottom:16px}
.orders .tools .input{flex:1 1 220px;min-width:0}
.orders .tools .seg{flex:none}
/* a guest's number goes to the next line whole beside a wide state («Хүлээлгэн өгсөн»), never «+976 9555» over «0002» */
.order .sub .mn{white-space:nowrap}
.order-page .back{margin-bottom:4px}
.order-page .page-head h1 .mn{font-weight:600}
.order-page #act{margin-bottom:16px}
.order-page .callout{margin-bottom:16px}
.order-page .section-label + .story{margin-top:4px}
.order-main,.order-story{max-width:640px;min-width:0}
/* on a wide desk the story stands beside the card rather than under it */
@media (min-width:1180px){
  :root[data-desk] .order-cols{display:grid;grid-template-columns:minmax(0,600px) minmax(260px,420px);gap:40px;align-items:start}
  :root[data-desk] .order-story .section-label{margin-top:14px}
}
.dt-sub{display:block;font-family:var(--sans);font-size:var(--t-meta);font-weight:500;color:var(--ink-3)}

/* ── the stall ── */
.stall .rows{margin-bottom:24px}
.stall .row{flex-wrap:wrap;align-items:flex-start}
.stall .row > .main{flex:1 1 100%}
.stall .row .title .chip{margin-left:8px;vertical-align:2px}
.stall .row .nums{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:10px}
.stall .num{font-family:var(--mono);font-size:var(--t-body-lg);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--ink)}
.stall .num small{display:block;font-family:var(--sans);font-size:var(--t-cap);font-weight:400;line-height:1.4;color:var(--ink-3);margin-top:2px}
.stall .row[data-off] .num{color:var(--ink-3)}
.stall .row .btns{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;flex:1 1 100%}
@media (min-width:720px){
  .stall .row{flex-wrap:nowrap;align-items:center}
  .stall .row > .main{flex:1 1 auto;min-width:0}
  .stall .row .btns{display:flex;flex:none;margin-left:auto}
}
.cell-sub{display:block;font-size:var(--t-cap);color:var(--ink-3);margin-top:2px}
/* the two tiers to choose from: pine marks the chosen one, the tier's own chip keeps its colour */
.promo-opts{display:grid;gap:10px}
.promo-opt{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:14px;border:1px solid var(--line-2);border-radius:var(--r-md);background:var(--surface);cursor:pointer}
.promo-opt:has(input:checked){border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}
.promo-opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.promo-opt input{margin:2px 0 0}
.promo-opt b{display:flex;align-items:center;gap:8px;font-size:var(--t-row)}
.promo-opt small{grid-column:2 / -1;font-size:var(--t-cap);line-height:1.45;color:var(--ink-2)}
.promo-opt .price{font-family:var(--mono);font-weight:600;white-space:nowrap}
.promo-pay{display:grid;gap:10px;justify-items:start}
.promo-pay .amount{font-family:var(--mono);font-size:1.75rem;font-weight:600}

/* ── the popups this page opens ── */
/* why a listing's field is wrong, or a cancel's reason: rows a thumb can hit */
.reasons .reason-list{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
.reasons .reason{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;margin:0;font-size:var(--t-body-lg);line-height:1.35;color:var(--ink);cursor:pointer}
.reasons .reason + .reason{border-top:1px solid var(--line)}
.reasons .reason:has(input:checked){background:var(--accent-soft)}
.reasons .reason input{flex:none;margin:0}
.reasons .refund{margin:12px 0 0;font-size:var(--t-body);line-height:1.5;color:var(--ink-2)}
.reasons .refund b{color:var(--ink);font-weight:600}
/* the confirming step of a cancel is a filled red button; disabled, it must look it */
#cancel-order [data-submit][disabled]{background:var(--surface-2);border-color:var(--line);color:var(--ink-3);cursor:not-allowed}
.hand-code b{font-size:2.5rem;letter-spacing:.14em}
.field > .affix{font-weight:400;margin-bottom:0}
/* a field that waits on another (the fee on «Хүргэлт хийнэ») reads as waiting, label and all */
.field[data-off] > span{color:var(--ink-3)}

/* ── facts: the profile and the money read as labelled values, changed in popups ── */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px 24px;margin:0;padding:16px}
.facts > div{min-width:0}
.facts dt{font-size:var(--t-cap);font-weight:500;color:var(--ink-2);margin-bottom:4px}
.facts dd{margin:0;font-size:var(--t-row);font-weight:600;line-height:1.35;color:var(--ink);overflow-wrap:break-word}
.facts dd.wide{grid-column:1 / -1}
/* short facts — a number, a percentage, a day — sit two to a row even on a phone */
.facts[data-short]{grid-template-columns:repeat(auto-fit,minmax(min(100%,136px),1fr))}
.facts dd .mn{font-weight:500}
.facts dd small{display:block;font-size:var(--t-cap);font-weight:400;color:var(--ink-2);margin-top:2px}
.facts dd[data-none]{font-weight:400;color:var(--ink-3)}
:root[data-desk] .facts{padding:20px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.card-foot .cap{flex:1 1 260px;margin:0}
.card-foot .cap a{color:var(--accent-ink);text-decoration:underline;text-underline-offset:.15em;overflow-wrap:anywhere}
:root[data-desk] .card-foot{padding:12px 20px}
.card-head .chip{flex:none}
.card-head + .card-foot{border-top:0}
.cards{display:grid;gap:16px}
.money-sum{margin-bottom:16px}
.money-page .cards,.profile-page .cards{margin-bottom:24px}
.settle-list .row .amt .chip{margin-top:4px}
/* What a place holds before it holds anything is app.css's .empty-state (the markup blank() draws). */
</style>

<body>
<div id="root"></div>

<script type="module">
import { api, store, shell, toast, mnt, money, KIND, IDESH_STATE, dayLabel, dayShort, signInDoors, accountWays, authReturn, popup, dropSession, whatWentWrong } from '/api.js';
import { NAV_ICON, deskFrame, navHref } from '/sidenav.js';
import { dataTable, dtCell } from '/datatable.js';

const root = document.getElementById('root');
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
/**
 * Text into markup: a guest's name, the address and the number a guest typed
 * for a delivery, a listing, the business's own name. Quotes too — a number
 * goes into a tel: link and a name into an input's value, and a `"` would
 * end the attribute and start one of its own on the screen of everybody who
 * works here.
 */
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

/**
 * The business the dashboard opened this page for — `/supplier?org=…` — so
 * a person who works at two suppliers works at the one they chose there.
 */
const ORG = new URLSearchParams(location.search).get('org');
/**
 * The person's own sign-in — made on this page, by the app, on the website
 * or on the dashboard: one browser holds one person. A tablet on the
 * counter is somebody who works there, signed in as themselves, doing what
 * their role allows.
 */
const token = () => store.guestToken;
/** The supplier's own routes: the token, and which business when the dashboard said. */
const sup = (path, options = {}) => api(path, { ...options, token: token(), headers: ORG ? { 'x-basu-org': ORG } : {} });

/**
 * Who this seat is here and what it may do — `/v1/supplier/seat`, asked on
 * opening. A tab or a button this seat may not use is not drawn; the server
 * refuses it anyway.
 */
let seat = null;
const may = (permission) => Boolean(seat?.permissions?.includes(permission));
/** The words for the roles a business is built with; any other role Basu made is said as the business's kind. */
const ROLE_WORD = { owner: 'Эзэн', manager: 'Менежер', staff: 'Ажилтан', accountant: 'Нягтлан' };

/**
 * Phone chrome below 900px, a desk above it: the same nav is a tab bar or a
 * sidebar, and the root carries data-desk so the shared sheet drops the blur
 * and tightens the controls. jsdom has no matchMedia, so a page under test is
 * a phone.
 */
const desk = typeof matchMedia === 'function' ? matchMedia('(min-width:900px)') : null;
const isDesk = () => Boolean(desk?.matches);
function applyDesk() {
  document.documentElement.toggleAttribute('data-desk', isDesk());
  document.body.classList.toggle('has-tabbar', Boolean(document.querySelector('.shell > .tabbar')) && !isDesk());
}
/** Which frame is drawn: the desk's (true), the phone's (false), or none yet. */
let frameIsDesk = null;
let settling = null;
// Phone and desk are two frames, not one restyled: crossing the line redraws
// the module on the tab it was on — once the width has settled, and only if
// the frame drawn is the wrong one. A window dragged across the line, or an
// iPad's split view, can cross it and back in a few milliseconds.
desk?.addEventListener?.('change', () => {
  clearTimeout(settling);
  settling = setTimeout(() => {
    applyDesk();
    if (document.getElementById('view') && frameIsDesk !== isDesk()) openModule();
  }, 150);
});

/**
 * Inside the Basu app this page is one of the app's: the app owns the
 * session, and the way out is the app's own home. It never signs anybody out
 * of the app, and never draws a way in of its own — no code by email, no
 * password form inside a page inside the app.
 */
function goHome() {
  shell.post({ type: 'home' });
}

/** The app's session was refused: the app asks on its own sheet; closed, back home. */
function askShell() {
  shell.signIn().then(() => boot(), goHome);
}

/** Sign out of the session this page is using — and, having come from the dashboard, go back there. */
function signOut() {
  if (shell.present) {
    askShell();
    return;
  }
  dropSession();
  seat = null;
  if (ORG) {
    location.href = '/dashboard';
    return;
  }
  boot();
}

const ICON = {
  today: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8 3v4M16 3v4M8 14h3"/></svg>',
  orders: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h4"/></svg>',
  stall: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1.5-4h13L20 9"/><path d="M4 9c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3"/><path d="M6 12v8h12v-8M10 20v-5h4v5"/></svg>',
  money: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M15.5 15h2"/></svg>',

/**
 * What a place is for while it holds nothing yet: a mark, a title, one line,
 * and the one next step. The markup api.js's emptyState() draws, so the page
 * can take that up as it is once it lands. `action` is { label, onClick,
 * primary, id }.
 */
function blank({ icon = ICON.orders, title, text = '', action = null, size, tone, frame = false }) {
  const box = el(`<div class="empty-state"${size ? ` data-size="${size}"` : ''}${tone ? ` data-tone="${tone}"` : ''}${frame ? ' data-frame' : ''}><span class="es-mark" aria-hidden="true">${icon}</span><h3 class="es-title"></h3><p class="es-text"></p></div>`);
  box.querySelector('.es-title').textContent = title ?? '';
  box.querySelector('.es-text').textContent = text ?? '';
  if (action) {
    const b = el(`<button class="btn" type="button"${action.primary ? ' data-v="primary"' : ''}${action.id ? ` id="${action.id}"` : ''}></button>`);
    b.textContent = action.label;
    b.addEventListener('click', action.onClick);
    const act = el('<div class="es-act"></div>');
    act.append(b);
    box.append(act);
  }
  return box;
}

/** A Mongolian number the way people read it: `+97699112233` → `+976 9911 2233`. Anything else as it came. */
function phoneLine(value) {
  const raw = String(value ?? '');
  const m = /^(?:\+?976)?(\d{4})(\d{4})$/.exec(raw.replace(/[\s-]/g, ''));
  return m ? `+976 ${m[1]} ${m[2]}` : raw;
}
/** A number that dials: the digits in the link, the number as written on the screen. */
const tel = (n) => `<a class="tel" href="tel:${esc(String(n).replace(/[^\d+]/g, ''))}">${ICON.phone}${esc(phoneLine(n))}</a>`;

/** A button at work: its words stay (for a reader and for textContent), a spinner turns, no second press. */
function pressing(button, on) {
  if (!button) return;
  button.toggleAttribute('data-busy', on);
  if (on) button.setAttribute('aria-busy', 'true');
  else button.removeAttribute('aria-busy');
}

/** The walkthrough's shortcuts, folded under a door: opened on purpose, never mistaken for the real way in. */
const demoGroup = () => el('<details class="demo inset" data-demo><summary><span class="lab">Демо горим</span><span class="chev" aria-hidden="true"></span></summary><div class="body"></div></details>');

/**
 * Under every door: the terms a supplier signs up to and, signed in, the way
 * back out — somebody who came in with the wrong account is not stuck on a
 * form that is not theirs. Inside the app the app owns the session.
 */
function doorFoot(signedIn = false) {
  const foot = el(`<div class="door-foot"><a href="/terms">Үйлчилгээний нөхцөл</a><span aria-hidden="true">·</span><a href="/privacy">Нууцлалын бодлого</a></div>`);
  if (signedIn && !shell.present) {
    const other = el('<button class="other" type="button" id="other">Өөр бүртгэлээр нэвтрэх</button>');
    other.addEventListener('click', signOut);
    foot.prepend(other);

}

/** The wordmark at the top of a door: home to Basu in a browser, a plain mark inside the app. */
const brand = () => (shell.present ? '<div class="brand wordmark" data-size="sm">Basu</div>' : '<a class="brand wordmark" data-size="sm" href="/">Basu</a>');

/* ── the doors ─────────────────────────────────────────────────────── */

/**
 * The ways in — Google, a code by email, or a password (the phone and
 * password a contract was signed with, or an address) — the same block the
 * guests' pages use. Whoever is new becomes an account by any of them, and
 * the application form is the next card. Under it, what being a supplier is,

function signInCard() {

        <h2>Нийлүүлэгчийн хэсэг</h2>
        <p class="lead">Нэвтэрч ороод нийлүүлэгч болох хүсэлтээ илгээнэ үү. Гэрээт нийлүүлэгч бол гэрээний утас, нууц үгээрээ нэвтэрнэ.</p>
        <div data-doors></div>
      </div>
      <ol class="how" aria-label="Нийлүүлэгч болох нь">
        <li><span class="n">1</span><span><b>Хүсэлт илгээнэ</b>Basu утсаар холбогдож шалгаад гэрээ байгуулна.</span></li>
        <li><span class="n">2</span><span><b>Зараа оруулна</b>Зар оруулах үнэгүй. Үнэ, тоо, бэлэн болох өдрөө өөрөө тавина.</span></li>
        <li><span class="n">3</span><span><b>Захиалга авна</b>Хүлээлгэн өгсөн захиалга бүрийн мөнгө таны банкны данс руу шилжинэ.</span></li>
      </ol>
    </div>`);
  card.append(doorFoot());
  const doors = signInDoors({ device: 'Нийлүүлэгчийн дэлгэц', returnTo: '/supplier', onToken: () => boot() });
  card.querySelector('[data-doors]').replaceWith(doors);
  // The demo has no inbox to read a code from; a walkthrough skips straight
  // in — as a seeded supplier's owner, or as whoever the typed number is.
  api('/dev/suppliers')
    .then(({ suppliers }) => {
      const demo = el('<button class="btn" type="button" id="demo">Демо: кодгүй нэвтрэх</button>');
      const group = demoGroup();
      const owners = el('<div class="venues" data-rows></div>');
      for (const s of suppliers.filter((x) => x.phone)) {
        const row = el(`<button class="row" type="button" data-dense><span class="main"><span class="title" data-weight="normal">${esc(s.name)}</span></span><span class="end"><span class="tag mn">${esc(s.phone)}</span></span></button>`);
        row.addEventListener('click', async () => {
          const { token } = await api('/dev/login', { method: 'POST', body: { phone: s.phone, device: 'Нийлүүлэгч' } });
          store.guestToken = token;
          boot();
        });
        owners.append(row);
      }
      group.querySelector('.body').append(owners, demo);
      demo.addEventListener('click', async () => {
        // A number typed is the person who typed it; none typed is somebody
        // new, so a walkthrough reaches the form rather than the seed's own
        // waiting application.
        const typed = doors.querySelector('[name="login"]')?.value.replace(/\s+/g, '') ?? '';
        const fresh = `+97688${String(Date.now() % 1_000_000).padStart(6, '0')}`;
        const { token } = await api('/dev/login', {
          method: 'POST',
          body: { phone: typed || fresh, device: 'Нийлүүлэгчийн дэлгэц' },

        boot();
      });
      card.querySelector('#signin').append(group);
    })
    .catch(() => {});

/**
 * Off the module's frame — the door, the application, a refusal: the page
 * follows the device's light or dark again. Only the desk frame, and its
 * shape while the seat is asked (`waiting`), is pinned light.
 */
const unpinned = () => document.documentElement.removeAttribute('data-theme');

/** The front door: a person, signed in as themselves. */
function showLanding() {
  unpinned();
  if (shell.present) {
    askShell();
    return;
  }
  root.replaceChildren(signInCard());
}

/* ── becoming a supplier ─────────────────────────────────────────── */

/**
 * The form a would-be supplier fills in, once signed in.
 *
 * The phone guests will ring is the account's own when it was made with one.
 * An account made by email, Google or Apple has none, so the form asks for
 * it — and ops rings it before saying yes, which is the proof it is theirs.
 * Ops answers from the desk and the answer arrives here, and by email or
 * message.
 */
async function showApply() {
  unpinned();
  root.replaceChildren();
  const person = token();
  if (!person) {
    showLanding();
    return;
  }
  let application;
  let me;
  try {
    [{ application }, me] = await Promise.all([
      api('/v1/supplier/application', { token: person }),
      api('/v1/me', { token: person }),
    ]);
  } catch (error) {
    if (error.status === 401) {
      if (shell.present) return askShell();
      if (store.guestToken === person) store.guestToken = null;
      root.append(signInCard());
      return;
    }
    toast(error.message, 'bad');
    return;
  }
  const needsPhone = !me.phone;
  root.append(application ? statusCard(application, needsPhone) : applyForm(needsPhone));
}

/**
 * A bank account as people write it — the spaces out, the letters up: the
 * IBAN, MN and its 18 digits, or the plain 6–20 digit number. The server's
 * own rule, word for word, so a number the page lets through is one the
 * server takes (and the guest's refund account on /orders keeps it too).
 */
const ACCOUNT = /^(MN\d{18}|\d{6,20})$/;
/** What a number the rule refuses is told, under its field. */
const ACCOUNT_WORDS = 'IBAN бол MN-ээр эхэлсэн 20 тэмдэгт, эсвэл 6–20 оронтой дансны дугаар бичнэ үү.';
/** The banks a person in Ulaanbaatar has an account at, most common first. */
const BANKS = ['Хаан банк', 'Голомт банк', 'Худалдаа хөгжлийн банк', 'Хас банк', 'Төрийн банк', 'Капитрон банк', 'Ариг банк', 'Богд банк', 'М банк'];

/**
 * Say under a field what is wrong with it, or clear it. The first refused
 * field takes the focus, so a person is taken to it rather than told about it
 * at the bottom of the screen.
 */
function fieldSays(input, message) {
  const field = input.closest('.field');
  field?.querySelector('.help[data-error]')?.remove();
  if (!message) {
    input.removeAttribute('aria-invalid');
    for (const hint of field?.querySelectorAll('small:not([data-error])') ?? []) hint.hidden = false;
    return;
  }
  input.setAttribute('aria-invalid', 'true');
  // The error stands where the hint was: one line under the field, not two.
  for (const hint of field?.querySelectorAll('small:not([data-error])') ?? []) hint.hidden = true;
  const line = document.createElement('small');
  line.className = 'help';
  line.dataset.error = '';
  line.setAttribute('role', 'alert');
  line.textContent = message;
  field?.append(line);
}

function applyForm(needsPhone = false) {
  const card = el(`
    <div class="door">
      <div class="card" id="apply">
        ${brand()}
        <h2>Нийлүүлэгч болох</h2>
        <p class="lead">Basu хүсэлтийг тань үзээд утсаар холбогдож, гэрээ байгуулна. Батлагдвал энэ бүртгэлээрээ нэвтэрч ажиллана.</p>
        <div class="callout form-error" data-k="stop" role="alert" hidden><span></span></div>
        <div class="form-group">
          <div class="section-label">Таны тухай</div>
          <label class="field"><span>Нэр</span><input name="name" autocomplete="organization"><small>Зочид таныг энэ нэрээр харна. Жишээ нь: «Архангай · Доржийн хот айл».</small></label>
          ${needsPhone ? '<label class="field"><span>Холбогдох утас</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="8811 2233"><small>Зочид, Basu энэ дугаараар холбогдоно. Батлахаас өмнө Basu залгаж шалгана.</small></label>' : ''}
          <label class="field"><span>Хотод мах авах цэг</span><input name="address" autocomplete="street-address"><small>Зочин өөрөө ирж авах газар: дүүрэг, зах, хаалга.</small></label>
          <label class="field"><span>ТТД (заавал биш)</span><input name="tin" inputmode="numeric" maxlength="10"><small>Е-баримт гаргахад хэрэгтэй, 7–10 оронтой.</small></label>
          <label class="field"><span>Юу зарах вэ, хаанаас (заавал биш)</span><textarea name="about"></textarea><small>Жишээ нь: Архангайн хонь, 10-р сараас, 20 толгой.</small></label>
        </div>
        <div class="form-group">
          <div class="section-label">Олголт очих данс</div>
          <p class="cap">Мөнгө тань энэ данс руу очно — гэрээнд бичигдэж, Basu тулгаж шалгана. Одоо бөглөхгүй бол дараа нь профайлаасаа нэмнэ.</p>
          <label class="field"><span>Банк</span><input name="bank_name" list="banks" autocomplete="off"></label>
          <datalist id="banks">${BANKS.map((b) => `<option value="${b}">`).join('')}</datalist>
          <label class="field"><span>Дансны дугаар</span><input name="bank_account" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="MN12 0005 0050 1234 5678"><small>IBAN (MN + 18 орон) эсвэл дансны дугаар (6–20 орон).</small></label>
          <label class="field"><span>Данс эзэмшигчийн нэр</span><input name="bank_holder" autocomplete="name"><small>Гэрээнд гарын үсэг зурах хүний нэр.</small></label>
        </div>
        <div class="foot"><button class="btn" data-v="primary" data-size="lg" type="button" id="submit">Хүсэлт илгээх</button></div>
      </div>
    </div>`);
  card.append(doorFoot(true));
  const field = (name) => card.querySelector(`[name="${name}"]`);
  const v = (name) => field(name)?.value.trim() ?? '';
  const problem = card.querySelector('.form-error');
  // Typing into a refused field takes its complaint away; the next press checks again.
  card.addEventListener('input', (e) => {
    if (e.target.matches?.('[aria-invalid]')) fieldSays(e.target, null);
  });

  /** What the server would refuse, said before anything is sent — and in words about the field, not the order. */
  const check = () => {
    const wrong = [];
    const say = (name, message) => {
      fieldSays(field(name), message);
      if (message) wrong.push(field(name));
    };
    say('name', v('name').length < 2 ? 'Нэрээ бичнэ үү.' : null);
    if (needsPhone) {
      const digits = v('phone').replace(/\D/g, '').replace(/^976/, '');
      say('phone', digits.length !== 8 ? 'Утасны 8 оронтой дугаараа бичнэ үү.' : null);
    }
    say('address', v('address').length < 4 ? 'Зочин ирж авах газраа бичнэ үү.' : null);
    say('tin', v('tin') && !/^\d{7,10}$/.test(v('tin')) ? 'ТТД 7–10 оронтой тоо байна.' : null);
    const account = v('bank_account').replace(/\s+/g, '').toUpperCase();
    say('bank_account', account && !ACCOUNT.test(account) ? ACCOUNT_WORDS : null);
    wrong[0]?.focus();
    return wrong.length === 0;
  };

  const submit = card.querySelector('#submit');
  submit.addEventListener('click', async () => {
    if (submit.hasAttribute('data-busy')) return;
    problem.hidden = true;
    if (!check()) return;
    pressing(submit, true);
    try {
      await api('/v1/supplier/apply', {
        method: 'POST',
        token: token(),
        body: {
          name: v('name'),
          ...(needsPhone ? { phone: v('phone') } : {}),
          tin: v('tin'),
          address: v('address'),
          about: v('about'),
          bank_name: v('bank_name'),
          bank_account: v('bank_account').replace(/\s+/g, '').toUpperCase(),
          bank_holder: v('bank_holder'),
        },
      });
      toast('Хүсэлт илгээгдлээ.', 'good');
      showApply();
    } catch (error) {
      if (error.status === 401) return signOut();
      // Said on the form, over the fields, where the person is looking.
      problem.querySelector('span').textContent = error.message;
      problem.hidden = false;
      problem.scrollIntoView?.({ block: 'center', behavior: 'smooth' });
      pressing(submit, false);
    }
  });
  return card;
}

const APPLICATION = {
  applied: ['Хүлээгдэж байна', 'Basu хүсэлтийг тань үзэж байна. Хариуг энд, мөн имэйл эсвэл мессежээр мэдэгдэнэ.'],
  contracted: ['Батлагдлаа', 'Та гэрээт нийлүүлэгч боллоо.'],
  declined: ['Татгалзсан', ''],
};

/** The day of a timestamp in Ulaanbaatar: «10-р сарын 1» in a sentence, «10/1» where it is set as a figure. */
const dayOfStamp = (iso) => (iso ? dayLabel(new Date(iso).toLocaleDateString('sv-SE', { timeZone: 'Asia/Ulaanbaatar' })) : '');
const dayFigure = (iso) => (iso ? dayShort(new Date(iso).toLocaleDateString('sv-SE', { timeZone: 'Asia/Ulaanbaatar' })) : '');

function statusCard(a, needsPhone = false) {
  const [word, cap] = APPLICATION[a.state] ?? [a.state, ''];
  const card = el(`
    <div class="door">
      <div class="card" id="application">
        ${brand()}
        <h2>${esc(a.name)}</h2>
        <div class="status" data-s="${esc(a.state)}">
          <div class="big">${esc(word)}</div>
          <div class="cap">${a.state === 'declined' ? `Шалтгаан: ${esc(a.decline_reason)}` : cap}</div>
        </div>
      </div>
    </div>`);
  card.append(doorFoot(true));
  const inner = card.querySelector('.card');
  if (a.state === 'applied') {
    // What happens next, so waiting is a step on a road rather than silence.
    inner.append(el(`
      <ol class="stepper">
        <li data-done><span class="w">Хүсэлт илгээсэн</span><span class="t">${esc(dayFigure(a.applied_at))}</span></li>
        <li data-next><span class="w">Basu шалгаж байна<span class="s">Утсаар холбогдож, мэдээллийг тань тулгана.</span></span><span class="t"></span></li>
        <li><span class="w">Гэрээ байгуулна<span class="s">Дараа нь зараа оруулж, захиалга авна.</span></span><span class="t"></span></li>
      </ol>`));
  } else if (a.state === 'contracted') {
    const open = el('<button class="btn" data-v="primary" data-size="lg" type="button" id="open">Нийлүүлэгчийн хэсэг рүү орох</button>');
    open.addEventListener('click', () => boot());
    inner.append(open, el('<p class="cap">Ажилтнуудаа Бизнес хэсгийн «Ажилтнууд» хуудаснаас нэмж, эрх өгнө — тэд өөрсдийн бүртгэлээр нэвтэрнэ.</p>'));
  } else if (a.state === 'declined') {
    const again = el('<button class="btn" data-v="primary" data-size="lg" type="button" id="again">Дахин хүсэлт гаргах</button>');
    again.addEventListener('click', () => root.replaceChildren(applyForm(needsPhone)));
    inner.append(again);
  }
  return card;
}

/* ── today's work ────────────────────────────────────────────────── */

/** Set by whichever view holds tickets besides the board, to redraw after an action. */
let onActed = null;

/** What each group of work is called. */
const LANES = [
  { key: 'paid', title: 'Бэлтгэж эхлэх' },
  { key: 'preparing', title: 'Бэлэн болгох' },
  { key: 'ready', title: 'Өгөх, хүргэх' },
  { key: 'dispatched', title: 'Замд яваа' },
];
/** The order state each lane holds, and the tone its band takes: «бэлтгэж байна» in honey, as its chip is everywhere. */
const LANE_STATE = { paid: 'PAID', preparing: 'PREPARING', ready: 'READY', dispatched: 'DISPATCHED' };
const STATE_TONE = { PAID: 'route', PREPARING: 'hi', READY: 'ready', DISPATCHED: 'route', HANDED: 'ready', CLOSED: 'ready' };

/**
 * The server's day. The demo's clock is not the browser's, and an order
 * opened from the list must not take its own day for today — so it comes
 * from the board or the day's numbers, and until it has, days are said
 * without how far away they are.
 */
let today = null;
async function knowToday() {
  if (today) return today;
  try {
    today = (await sup('/v1/supplier/home')).today ?? null;
  } catch {
    // A seat without the day's numbers: days are said as dates.
  }
  return today;
}

/** «Бямба, 9-р сарын 13» — the day, the way it is said. */
function dayLong(day) {
  if (!day) return '—';
  const d = new Date(`${day}T12:00:00+08:00`);
  const names = ['Ням', 'Даваа', 'Мягмар', 'Лхагва', 'Пүрэв', 'Баасан', 'Бямба'];
  return `${names[d.getUTCDay()]}, ${dayLabel(day)}`;
}

/** How far a day is from today, in words, and the tone that says it is now or gone. */
function dayAway(day) {
  if (!day || !today) return null;
  const n = Math.round((Date.parse(`${day}T00:00:00Z`) - Date.parse(`${today}T00:00:00Z`)) / 86_400_000);
  if (n === 0) return { word: 'Өнөөдөр', tone: 'hold' };
  if (n === 1) return { word: 'Маргааш', tone: '' };
  if (n === -1) return { word: 'Өчигдөр', tone: 'stop' };
  if (n > 1) return { word: `${n} хоногийн дараа`, tone: '' };
  return { word: `${-n} хоног өнгөрсөн`, tone: 'stop' };
}

/** How many orders wait for somebody's hands: on the «Өнөөдөр» tab, and beside it in the desk's menu. */
function setTodo(n) {
  const count = document.querySelector('.tabbar button[data-tab="today"] .count');
  if (count) {
    count.hidden = !n;
    count.textContent = n > 99 ? '99+' : String(n);
  }
  deskNav?.badge?.('idesh.today', n, true);
}

/** A board redraws only when what it shows changed: never under a finger about to press, never under the focus. */
let boardSig = '';
let lastGood = null;

/**
 * The work, as a list rather than a board: one group per thing to do next,
 * empty groups not drawn. A person sees what is theirs today and taps one
 * button per order.
 */
function renderBoard(data) {
  today = data.today ?? today;
  const todo = LANES.reduce((sum, lane) => sum + (data.lanes[lane.key]?.length ?? 0), 0);
  setTodo(todo);
  const board = document.getElementById('board');
  if (!board) return;
  for (const n of document.querySelectorAll('.supplier-name')) {
    n.textContent = data.supplier?.name ?? 'Нийлүүлэгч';
  }
  connection(true);
  const noShows = (data.lanes.ready ?? []).map((t) => Boolean(t.no_show_from && new Date(t.no_show_from) <= new Date()));
  const sig = JSON.stringify([data.today, data.lanes, noShows, (data.listings ?? []).map((l) => [l.id, l.active, l.remaining])]);
  if (sig === boardSig && board.dataset.ready) return;
  boardSig = sig;

  const scroll = window.scrollY;
  board.replaceChildren();
  for (const lane of LANES) {
    const tickets = data.lanes[lane.key] ?? [];
    if (!tickets.length) continue;
    const group = el(`<section class="group lane"><h3 class="section-title">${lane.title}<span class="n count" data-tone="neutral">${tickets.length}</span></h3><div class="stack"></div></section>`);
    const stack = group.querySelector('.stack');
    for (const ticket of tickets) stack.append(renderTicket(ticket, lane.key));
    board.append(group);
  }
  if (!todo) board.append(nothingToDo(data.listings ?? []));
  board.dataset.ready = '1';
  window.scrollTo(0, scroll);
}

/**
 * An empty day says what to do next. With nothing for sale there is nothing
 * to wait for: the next step is a listing. With listings up, it is waiting —
 * and how many of them guests can see.
 */
function nothingToDo(listings) {
  const live = listings.filter((l) => l.active && l.remaining > 0).length;
  if (!live) {
    const canAdd = may('org.idesh.stall:edit');
    return blank({
      icon: ICON.stall,
      tone: 'accent',
      title: listings.length ? 'Зочдод харагдаж буй зар алга' : 'Эхний зараа нэмнэ үү',
      text: listings.length
        ? 'Зар бүр зогссон эсвэл дууссан байна. Зараа идэвхжүүлэх эсвэл шинэ зар нэмэхэд зочид захиалж эхэлнэ.'
        : 'Зочид таны зараас л захиална: ямар мал, бүтнээр эсвэл кг-аар, үнэ, хэдэн толгой, хэзээ бэлэн болох. Зар оруулах үнэгүй.',
      action: canAdd
        ? { label: listings.length ? 'Зар руу очих' : 'Зар нэмэх', primary: true, onClick: () => (listings.length ? show('stall') : show('stall', { add: true })) }
        : null,
    });
  }
  return blank({
    icon: ICON.check,
    title: 'Одоогоор хийх ажил алга',
    text: `${live} зар зочдод харагдаж байна. Шинэ захиалга ирэхэд энд гарч, танд мессеж ирнэ.`,
    action: may('org.idesh.stall') ? { label: 'Зараа харах', onClick: () => show('stall') } : null,
  });
}

/** The words on each primary button, and what the toast says when it is done. */
const DONE_WORD = {
  prepare: 'бэлтгэж эхэллээ',
  ready: 'бэлэн гэж тэмдэглэлээ',
  dispatch: 'замд гарлаа',
  hand: 'хүлээлгэн өгсөн',
};

/**
 * One order as a card: what, for whom, which day, where, what you get — and
 * one button. On the order's own page the band is left out: the code and the
 * state are the page's title there.
 */
function renderTicket(ticket, lane, { page = false } = {}) {
  const delivery = ticket.receive === 'delivery';
  const state = ticket.state ?? LANE_STATE[lane];
  const live = lane in LANE_STATE;
  const away = live ? dayAway(ticket.receive_on) : null;
  const urgent = away && (away.tone === 'hold' || away.tone === 'stop');
  const node = el(`
    <article class="card ticket" data-lane="${lane}"${urgent ? ' data-due' : ''}>
      ${page ? '' : `<div class="top">
        <span class="dot"${STATE_TONE[state] ? ` data-tone="${STATE_TONE[state]}"` : ''}></span><span>${STATE_WORD[state] ?? ''}</span>
        <span class="id">№${esc(ticket.code)}</span>
      </div>`}
      <div class="body">
        <div class="what">${esc(ticket.title)} ×${esc(ticket.qty)}${ticket.unit === 'kg' ? ' кг' : ''}</div>
        <div class="facts-rows">
          <div class="who"><span class="k">Зочин</span><span class="v">${
            ticket.guest || ticket.guest_phone
              ? `${ticket.guest ? `<span>${esc(ticket.guest)}</span>` : ''}${ticket.guest_phone ? tel(ticket.guest_phone) : ''}`
              : '—'
          }</span></div>
          <div class="on"><span class="k">${delivery ? 'Хүргэх өдөр' : 'Авах өдөр'}</span><span class="v"><span>${dayLong(ticket.receive_on)}</span>${
            away ? `<span class="rel"${away.tone ? ` data-tone="${away.tone}"` : ''}>${away.word}</span>` : ''
          }</span></div>
          <div class="where"><span class="k">${delivery ? 'Хүргэлт' : 'Авах'}</span><span class="v">${
            delivery ? `<span>${esc(ticket.address)}</span>${ticket.address_phone ? tel(ticket.address_phone) : ''}` : 'Өөрөө ирж авна'
          }</span></div>
        </div>
        <div class="sum"><span>Нийт</span>${money(ticket.total_mnt)}</div>
        ${typeof ticket.payout_mnt === 'number' ? `<div class="pay"><span>Танд очих</span>${money(ticket.payout_mnt)}</div>` : ''}
        ${
          lane === 'ready' && !delivery && ticket.no_show_from
            ? new Date(ticket.no_show_from) <= new Date()
              ? '<div class="grace callout" data-k="warn"><span>Зочин ирсэнгүй. Залгаад, ирэхгүй бол «Цуцлах» дээр «зочин ирээгүй» гэж сонгоно.</span></div>'
              : `<div class="grace callout"><span>Ирэхгүй бол ${dayLabel(ticket.no_show_from.slice(0, 10))}-нөөс «зочин ирээгүй» гэж цуцалж болно.</span></div>`
            : ''
        }
        <div class="btns"></div>
      </div>
    </article>`);

  const buttons = node.querySelector('.btns');

  /** One press, one step: the button turns while it goes, the toast says it went, the board moves the card. */
  const go = async (action, button, body = {}) => {
    if (button?.hasAttribute('data-busy')) return;
    pressing(button, true);
    for (const b of buttons.querySelectorAll('button')) if (b !== button) b.disabled = true;
    try {
      await sup(`/v1/supplier/orders/${ticket.id}/${action}`, { method: 'POST', body });
      toast(`№${ticket.code} ${DONE_WORD[action] ?? ''}.`, 'good');
      await refreshBoard();
      await onActed?.();
    } catch (error) {
      if (error.status === 401) {
        signOut();
        return;
      }
      toast(error.message, 'bad');
      pressing(button, false);
      for (const b of buttons.querySelectorAll('button')) b.disabled = false;
    }
  };
  const add = (label, action, { primary = false, confirm = null } = {}) => {
    const button = el(`<button class="btn" type="button" data-a="${action}"${primary ? ' data-v="primary" data-size="lg"' : ''}>${label}</button>`);
    button.addEventListener('click', async () => {
      // A step that cannot be taken back asks first, in a popup over the page.
      if (confirm && !(await confirm())) return;
      void go(action, button);
    });
    buttons.append(button);
    return button;
  };

  // An accountant reads the order; the buttons are for whoever does the work.
  if (!may('org.idesh.orders:act')) return node;
  const cancel = (reasons) => {
    const button = el('<button class="btn" type="button" data-v="quiet" data-a="cancel">Цуцлах</button>');
    button.addEventListener('click', () => void cancelOrder(ticket, lane, reasons));
    buttons.append(button);
  };
  if (lane === 'paid') {
    add('Бэлтгэж эхлэх', 'prepare', { primary: true });
    cancel(['guest_asked', 'cannot_fulfil', 'vet']);
  } else if (lane === 'preparing') {
    add('Бэлэн боллоо', 'ready', { primary: true });
    cancel(['guest_asked', 'vet', 'cannot_fulfil']);
  } else if (lane === 'ready') {
    if (delivery) add('Замд гаргах', 'dispatch', { primary: true });
    else add('Хүлээлгэн өгсөн', 'hand', { primary: true, confirm: () => handOver(ticket) });
    cancel(delivery ? ['guest_asked', 'unreachable', 'vet', 'cannot_fulfil'] : ['guest_asked', 'no_show', 'vet', 'cannot_fulfil']);
  } else if (lane === 'dispatched') {
    add('Хүлээлгэн өгсөн', 'hand', { primary: true, confirm: () => handOver(ticket) });
    cancel(['unreachable', 'guest_asked', 'cannot_fulfil']);
  }
  return node;
}

/**
 * Handing over is the last step and has no way back: the order closes and
 * the payout is counted. So it shows the code the guest's phone shows, to
 * check against, before it is said — the wrong animal to the wrong family
 * is the one mistake a counter must not make.
 */
async function handOver(ticket) {
  const delivery = ticket.receive === 'delivery';
  const answer = await popup({
    id: 'hand-order',
    title: delivery ? 'Хүргэлт зочинд хүрсэн үү?' : 'Хүлээлгэн өгөх',
    sub: `${esc(ticket.title)} ×${esc(ticket.qty)}${ticket.unit === 'kg' ? ' кг' : ''}${ticket.guest ? ` · ${esc(ticket.guest)}` : ''}`,
    width: 460,
    fields: [
      {
        type: 'static',
        label: 'Зочны код',
        html: `<div class="codebox hand-code"><b>${esc(ticket.code)}</b><small>${
          delivery ? 'Хүргэлтийн ажилтан зочноос кодыг нь асууж тулгана.' : 'Зочны утсан дээрх код үүнтэй таарвал махыг өгнө.'
        }</small></div>`,
      },
      { type: 'note', text: '«Хүлээлгэн өгсөн» дарснаар захиалга дуусч, танд очих мөнгө тооцогдоно. Буцаах боломжгүй.' },
    ],
    submit: 'Хүлээлгэн өгсөн',
    onSubmit: async () => true,
  });
  return Boolean(answer);
}

/** The words for a reason, and which reasons are the supplier's own fault. */
const REASON = {
  guest_asked: 'Зочин хүссэн — утсаар ярьж тохирсон',
  vet: 'Мал эмнэлгийн шалгалт унасан',
  cannot_fulfil: 'Биелүүлж чадахгүй боллоо',
  no_show: 'Зочин ирээгүй — өдрөөс 3 хоног өнгөрсөн',
  unreachable: 'Хаяг дээр холбогдож чадсангүй',
};
const SUPPLIER_FAULT = ['vet', 'cannot_fulfil'];
const FORFEIT_PCT = 10;

/**
 * Cancelling asks why, because the reason decides the money — the supplier
 * picks from what can be true of this order, sees what the guest gets back
 * and what stays, and only then confirms. A popup over the page, so the poll
 * can redraw the board under it.
 */
async function cancelOrder(ticket, lane, reasons) {
  const delivery = ticket.receive === 'delivery';
  const slaughtered = lane !== 'paid';
  const meat = ticket.total_mnt - (delivery ? ticket.delivery_fee_mnt ?? 0 : 0);
  const waiting = 'Шалтгаанаа сонгоно уу — зочинд хэдийг буцаах нь түүнээс хамаарна.';
  const answer = popup({
    id: 'cancel-order',
    title: 'Захиалгыг цуцлах',
    sub: `<span class="mn">№${esc(ticket.code)}</span> · ${esc(ticket.title)} ×${esc(ticket.qty)}${ticket.guest ? ` · ${esc(ticket.guest)}` : ''}`,
    width: 520,
    fields: [
      {
        type: 'static',
        label: 'Яагаад цуцлах вэ?',
        html: `<div class="reasons"><div class="reason-list" role="radiogroup" aria-label="Цуцлах шалтгаан">${reasons
          .map((r) => `<label class="check reason"><input type="radio" name="reason" value="${r}"><span>${REASON[r]}</span></label>`)
          .join('')}</div><p class="refund" aria-live="polite">${waiting}</p></div>`,
      },
    ],
    submit: 'Захиалгыг цуцлах',
    danger: true,
    onSubmit: async (values) => {
      if (!values.reason) throw new Error('Шалтгаанаа сонгоно уу.');
      await sup(`/v1/supplier/orders/${ticket.id}/cancel`, { method: 'POST', body: { reason: values.reason } });
      return true;
    },
  });
  const sheet = document.getElementById('cancel-order');
  const confirm = sheet?.querySelector('[data-submit]');
  if (confirm) {
    confirm.setAttribute('data-fill', '');
    confirm.disabled = true;
  }
  sheet?.addEventListener('change', () => {
    const reason = sheet.querySelector('.reasons input:checked')?.value;
    if (!reason) return;
    const forfeit = slaughtered && !SUPPLIER_FAULT.includes(reason) ? Math.round((meat * FORFEIT_PCT) / 100) : 0;
    sheet.querySelector('.refund').innerHTML = forfeit
      ? `Зочинд <b>${money(ticket.total_mnt - forfeit)}</b> буцна, ${money(forfeit)} (${FORFEIT_PCT}%) танд үлдэнэ.`
      : `Зочинд <b>${money(ticket.total_mnt)}</b> бүтнээр буцна.`;
    if (confirm) confirm.disabled = false;
  });
  if (!(await answer)) return;
  toast(`№${ticket.code} цуцлагдлаа.`, 'good');
  await refreshBoard();
  await onActed?.();
}

/**
 * Whether the board is reaching the server. Lost, it is said across the
 * work with the last time it was right, and the work dims: an old board is
 * not to be acted on as if it were now.
 */
function connection(ok) {
  const strip = document.getElementById('conn');
  const board = document.getElementById('board');
  if (ok) {
    lastGood = new Date();
    if (strip) {
      strip.hidden = true;
      delete strip.dataset.stale;
    }
    if (board) {
      delete board.dataset.stale;
      board.removeAttribute('inert');
    }
    return;
  }
  if (!strip) return;
  const at = lastGood ? `${String(lastGood.getHours()).padStart(2, '0')}:${String(lastGood.getMinutes()).padStart(2, '0')}` : '—';
  strip.querySelector('.mono').textContent = at;
  strip.dataset.stale = '1';
  strip.hidden = false;
  if (board) {
    board.dataset.stale = '1';
    board.setAttribute('inert', '');
  }
}

async function refreshBoard() {
  try {
    renderBoard(await sup('/v1/supplier/board'));
  } catch (error) {
    if (error.status === 401) {
      signOut();
      return;
    }
    connection(false);
  }
}

/* ── the stall ───────────────────────────────────────────────────── */

/** A listing's state in a word: what a guest can do with it now. */
const listingState = (l) => (!l.active ? ['off', 'Зогссон'] : l.remaining <= 0 ? ['gone', 'Дууссан'] : ['active', 'Идэвхтэй']);
/** What a listing says about delivery: its fee, free, or none. */
const deliveryWord = (l) => (l.delivers ? (l.delivery_fee_mnt ? `хүргэлт ${mnt(l.delivery_fee_mnt)}` : 'хүргэлт үнэгүй') : 'хүргэхгүй');
/** «Хонь · бүтэн, ~38 кг · Архангай, Их тамир» — what the listing is, after its title. */
const listingWhat = (l) =>
  `${KIND[l.kind] ?? l.kind} · ${l.unit === 'whole' ? `бүтэн, ~${l.approx_kg} кг` : `кг-аар, доод тал нь ${l.min_qty} кг`} · ${esc(l.origin)}`;
/** The marks beside a listing's name: its tier while it lasts, and a state other than on sale. */
function listingMarks(l) {
  const [state, word] = listingState(l);
  return `${state === 'active' ? '' : ` <span class="chip" data-size="sm" data-s="${state}">${word}</span>`}${
    l.tier ? ` <span class="chip tier" data-size="sm" data-tone="${l.tier === 'vip' ? 'hi' : 'accent'}" data-strong>${l.tier === 'vip' ? 'VIP' : 'Онцгой'} · ${dayLabel(l.tier_until.slice(0, 10))} хүртэл</span>` : ''
  }`;
}

/**
 * The supplier's own listings, edited here and nowhere else. Twenty sheep
 * becoming fifteen sold is a fact only they know; ops does not edit numbers
 * on a phone. The page only shows them: adding one and changing one are
 * popups.
 */
function renderStall(listings) {
  const stall = document.getElementById('stall');
  if (!stall) return;
  const canEdit = may('org.idesh.stall:edit');
  const head = el(pageHead('Миний зар', 'Зочид эндээс л захиална. Үнэ, тоо, өдрөө өөрөө засна.'));
  if (canEdit && listings.length) {
    const addButton = el(`<button class="btn" data-v="primary" type="button" id="add">${ICON.plus}Зар нэмэх</button>`);
    addButton.addEventListener('click', () => void addListing());
    headActs(head, addButton);
  }
  stall.replaceChildren(head);

  if (!listings.length) {
    stall.append(
      blank({
        icon: ICON.stall,
        tone: 'accent',
        frame: true,
        title: 'Эхний зараа нэмнэ үү',
        text: canEdit
          ? 'Зочид таны зараас л захиална: ямар мал, бүтнээр эсвэл кг-аар, үнэ, хэдэн толгой, хэзээ бэлэн болох. Зар оруулах үнэгүй.'
          : 'Зар нэмэх, засах нь эзэн, менежерийн ажил.',
        action: canEdit ? { label: 'Зар нэмэх', primary: true, id: 'add', onClick: () => void addListing() } : null,
      }),
    );
    return;
  }
  stall.append(isDesk() ? stallTable(listings) : stallRows(listings));
}

/** On a phone: one row per listing, its numbers in words, at most two buttons a thumb can hit. */
function stallRows(listings) {
  const rows = el('<div class="rows" data-rows></div>');
  for (const l of listings) rows.append(renderRow(l));
  return rows;
}

function renderRow(l) {
  const kg = l.unit === 'kg';
  const row = el(`
    <div class="card row" data-listing="${esc(l.id)}"${l.active ? '' : ' data-off'}>
      <span class="main">
        <span class="name title">${esc(l.title)}${listingMarks(l)}</span>
        <span class="sub">${listingWhat(l)} · ${deliveryWord(l)}</span>
        <span class="nums">
          <span class="num">${money(l.price_mnt)}<small>${kg ? '1 кг' : 'толгой бүр'}</small></span>
          <span class="num">${esc(l.remaining)}${kg ? ' кг' : ''}<small>үлдсэн, нийт ${esc(l.quantity)}</small></span>
          <span class="num">${esc(dayShort(l.ready_from))}<small>бэлэн болно</small></span>
        </span>
      </span>
      <span class="btns">${rowActions(l)}</span>
    </div>`);
  wireActions(row, l);
  return row;
}

/** The next useful thing to do with a listing, and changing it: put a live one first, put a paused one back. */
function rowActions(l, size = '') {
  const sized = size ? ` data-size="${size}"` : '';
  const next =
    l.active && l.remaining > 0
      ? may('org.idesh.stall:promote')
        ? `<button class="btn" type="button" data-a="promote"${sized}>${l.tier ? 'Сунгах' : 'Онцлох'}</button>`
        : ''
      : !l.active && may('org.idesh.stall:edit')
        ? `<button class="btn" type="button" data-a="toggle"${sized}>Идэвхжүүлэх</button>`
        : '';
  const edit = may('org.idesh.stall:edit') ? `<button class="btn" type="button" data-a="edit"${sized}>Засах</button>` : '';
  return next + edit;
}

function wireActions(box, l) {
  box.querySelector('[data-a="promote"]')?.addEventListener('click', () => void promote(l));
  box.querySelector('[data-a="edit"]')?.addEventListener('click', () => void editListing(l));
  box.querySelector('[data-a="toggle"]')?.addEventListener('click', async (e) => {
    const button = e.currentTarget;
    pressing(button, true);
    try {
      await sup(`/v1/supplier/listings/${l.id}`, { method: 'PATCH', body: { active: true } });
      toast('Зар дахин зочдод харагдаж байна.', 'good');
      await reloadStall();
    } catch (error) {
      toast(error.message, 'bad');
      pressing(button, false);
    }
  });
}

/** At a desk: the dashboard's own table — sortable, the numbers in their columns, a click opens the listing. */
function stallTable(listings) {
  const table = dataTable({
    columns: [
      {
        key: 'title',
        label: 'Зар',
        render: (l) => `<span class="dt-two"><b>${esc(l.title)}${listingMarks(l)}</b><small>${listingWhat(l)}</small></span>`,
      },
      { key: 'price_mnt', label: 'Үнэ', align: 'end', numeric: true, render: (l) => `${money(l.price_mnt)}<span class="dt-sub">${l.unit === 'kg' ? '1 кг' : 'толгой бүр'}</span>` },
      {
        key: 'remaining',
        label: 'Үлдсэн',
        align: 'end',
        numeric: true,
        render: (l) => `<span class="dt-num">${esc(l.remaining)}${l.unit === 'kg' ? ' кг' : ''}</span><span class="dt-sub">нийт ${esc(l.quantity)}</span>`,
      },
      { key: 'ready_from', label: 'Бэлэн болох', render: (l) => esc(dayLabel(l.ready_from)) },
      { key: 'delivery_fee_mnt', label: 'Хүргэлт', numeric: true, sortValue: (l) => (l.delivers ? l.delivery_fee_mnt : -1), render: (l) => (l.delivers ? (l.delivery_fee_mnt ? money(l.delivery_fee_mnt) : 'Үнэгүй') : '<span class="dt-none">Хүргэхгүй</span>') },
      { key: 'state', label: 'Төлөв', value: (l) => listingState(l)[1], render: (l) => dtCell.pill(...listingState(l)) },
    ],
    search: listings.length > 8 ? { placeholder: 'Зар хайх…' } : false,
    actions: (l) => {
      const box = el(`<span>${rowActions(l, 'sm')}</span>`);
      wireActions(box, l);
      return [...box.children];
    },
    onRow: (l) => void editListing(l),
    rowAttrs: (l) => ({ 'data-listing': l.id, 'data-off': !l.active }),
    noun: 'зар',
    rows: listings,
  });
  return table.el;
}

async function reloadStall() {
  try {
    const { listings } = await sup('/v1/supplier/listings');
    renderStall(listings);
  } catch {
    // The rows keep what they said until the page is opened again.
  }
}

/**
 * A number as a person types it. «460 000», «460,000» and «460.000» are four
 * hundred and sixty thousand — a dot or a comma before groups of exactly
 * three digits is a thousands mark — while «38.5» and «38,5» are thirty-eight
 * and a half. Anything else is NaN, and the check that reads it says so in
 * words. Where the stall counts in wholes (a price, how many, a minimum), a
 * decimal is refused there rather than rounded or multiplied here.
 */
const asNumber = (value) => {
  const s = String(value ?? '').trim().replace(/[\s'’]/g, '');
  if (s === '') return NaN;
  return /^\d{1,3}([.,]\d{3})+$/.test(s) ? Number(s.replace(/[.,]/g, '')) : Number(s.replace(',', '.'));
};
/** The day a week from today, for a new listing's ready day. */
function weekFrom(day) {
  const d = new Date(`${day ?? new Date().toISOString().slice(0, 10)}T12:00:00+08:00`);
  d.setUTCDate(d.getUTCDate() + 7);
  return d.toISOString().slice(0, 10);
}

/**
 * Put a unit beside a popup's number — ₮ after a price, кг after a weight —
 * the way the design system's affix field draws one.
 */
function affix(sheet, name, unit) {
  const input = sheet?.querySelector(`[name="${name}"]`);
  if (!input || input.parentElement.classList.contains('affix')) return;
  const wrap = document.createElement('span');
  wrap.className = 'affix';
  input.replaceWith(wrap);
  const i = document.createElement('i');
  i.textContent = unit;
  wrap.append(input, i);
}

/** Show or hide a popup field — hidden, it is not sent either. */
function fieldShown(sheet, name, on) {
  const input = sheet?.querySelector(`[name="${name}"]`);
  if (!input) return;
  input.disabled = !on;
  const field = input.closest('.field');
  if (field) field.hidden = !on;
}

/** Name a popup field anew — «Нэг толгойн үнэ» becomes «1 кг-ийн үнэ» when the unit does. */
function fieldLabel(sheet, name, words) {
  const label = sheet?.querySelector(`[name="${name}"]`)?.closest('.field')?.querySelector(':scope > span');
  if (label) label.textContent = words;
}

/** Delivery and its fee travel together: no delivery, no fee to type — the field is not there until it is ticked. */
function wireDelivery(sheet) {
  const delivers = sheet?.querySelector('[name="delivers"]');
  if (!delivers) return;
  const sync = () => fieldShown(sheet, 'delivery_fee_mnt', delivers.checked);
  delivers.addEventListener('change', () => {
    sync();
    if (delivers.checked) sheet.querySelector('[name="delivery_fee_mnt"]')?.focus();
  });
  sync();
}

/**
 * On a touch screen a form popup opens on the form, not on the keyboard: the
 * popup takes the focus itself (it stays inside the dialog), and the person
 * taps the field they came to change.
 */
function noKeyboard(sheet) {
  if (sheet && typeof matchMedia === 'function' && matchMedia('(pointer:coarse)').matches) sheet.focus();
}

/**
 * A refusal that knows its field. Thrown from a popup's answer, popup() says
 * why under that field, marks it and puts the cursor in it; typing in it takes
 * the word back.
 */
const refuse = (field, message) => Object.assign(new Error(message), { field });

/**
 * What the server would refuse, said in words about the listing rather than
 * «the order changed». A past ready day is refused for a new listing, and for
 * an old one only when it is the day being changed.
 */
function checkListing(v, { unit, sold = 0, day = null, keptDay = null }) {
  const price = asNumber(v.price_mnt);
  if (!Number.isInteger(price) || price <= 0) throw refuse('price_mnt', 'Үнээ төгрөгөөр, бүхэл тоогоор бичнэ үү.');
  if (unit === 'whole' && v.approx_kg !== undefined && !(asNumber(v.approx_kg) > 0)) {
    throw refuse('approx_kg', 'Нэг толгойн ойролцоо жинг кг-аар бичнэ үү, жишээ нь 38.5.');
  }
  if (unit === 'kg' && v.min_qty) {
    const least = asNumber(v.min_qty);
    if (!Number.isInteger(least) || least <= 0) throw refuse('min_qty', 'Доод захиалгыг бүхэл кг-аар бичнэ үү.');
  }
  const qty = asNumber(v.quantity);
  if (!Number.isInteger(qty) || qty < 0) throw refuse('quantity', `Хэдэн ${unit === 'kg' ? 'кг' : 'толгой'} байгааг бүхэл тоогоор бичнэ үү.`);
  if (qty < sold) throw refuse('quantity', `Аль хэдийн ${sold} зарагдсан — нийт тоо ${sold}-аас бага байж болохгүй.`);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v.ready_from ?? '')) throw refuse('ready_from', 'Бэлэн болох өдрөө сонгоно уу.');
  if (day && v.ready_from < day && v.ready_from !== keptDay) {
    throw refuse('ready_from', 'Бэлэн болох өдөр өнгөрсөн байна — өнөөдөр эсвэл дараах өдрийг сонгоно уу.');
  }
  if (v.delivers) {
    const fee = asNumber(v.delivery_fee_mnt);
    if (!Number.isInteger(fee) || fee < 0) throw refuse('delivery_fee_mnt', 'Хүргэлтийн төлбөрөө бичнэ үү — үнэгүй хүргэх бол 0.');
  }
  return { price, qty };
}

/**
 * A new listing, in one popup: what, the price and how many, when, the
 * delivery, a note. Delivery is chosen, never assumed — a listing nobody
 * looked at twice must not promise free delivery to the whole city.
 */
async function addListing() {
  const day = await knowToday();
  const done = popup({
    id: 'listing-new',
    title: 'Шинэ зар нэмэх',
    sub: 'Нэмэхэд зочдод шууд харагдана.',
    width: 640,
    fields: [
      { name: 'kind', label: 'Мал', type: 'select', options: Object.entries(KIND), value: 'sheep' },
      { name: 'unit', label: 'Яаж зарах', type: 'select', options: [['whole', 'Бүтэн мал'], ['kg', 'Кг-аар']], value: 'whole' },
      { name: 'title', label: 'Гарчиг', required: true, wide: true, hint: 'Зочид энэ нэрээр харна. Жишээ нь: Хонь, залуу ирэг.' },
      // Money fields group the tögrög as they are typed («460,000 ₮») and hand the answer the digits.
      { name: 'price_mnt', label: 'Нэг толгойн үнэ', format: 'money', required: true },
      { name: 'approx_kg', label: 'Ойролцоо жин', inputmode: 'decimal', hint: 'Бодит жин зөрсөн ч үнэ өөрчлөгдөхгүй.' },
      { name: 'min_qty', label: 'Доод захиалга', inputmode: 'numeric', hint: 'Зочин хамгийн багадаа хэдэн кг авах вэ.' },
      { name: 'quantity', label: 'Хэдэн толгой байгаа', inputmode: 'numeric', required: true },
      { name: 'ready_from', label: 'Бэлэн болох өдөр', type: 'date', value: weekFrom(day), required: true },
      { name: 'origin', label: 'Гарал', required: true, wide: true, hint: 'Мах хаанаас ирж байгаа: аймаг, сум, эсвэл хотын махны газар.' },
      { type: 'checks', label: 'Хүргэлт', options: [['delivers', 'Хүргэлт хийнэ', false, { hint: 'Хүргэлтийн үйлчилгээгээр зочны хаяг руу хүргүүлнэ — төлбөр нь бүтнээрээ танд.' }]] },
      { name: 'delivery_fee_mnt', label: 'Хүргэлтийн төлбөр', format: 'money', hint: 'Үнэгүй хүргэх бол 0.' },
      { name: 'note', label: 'Тайлбар (заавал биш)', type: 'textarea', placeholder: 'Толгой, дотор мөнтэйгээ…' },
    ],
    submit: 'Зар нэмэх',
    onSubmit: async (v) => {
      const unit = v.unit;
      const { price, qty } = checkListing(v, { unit, day });
      const body = {
        kind: v.kind,
        unit,
        title: v.title,
        price_mnt: price,
        quantity: qty,
        origin: v.origin,
        ready_from: v.ready_from,
        delivers: Boolean(v.delivers),
        delivery_fee_mnt: v.delivers ? asNumber(v.delivery_fee_mnt) : 0,
        note: v.note ?? '',
      };
      if (unit === 'whole') body.approx_kg = asNumber(v.approx_kg);
      else body.min_qty = v.min_qty ? asNumber(v.min_qty) : 1;
      await sup('/v1/supplier/listings', { method: 'POST', body });

    },

  const sheet = document.getElementById('listing-new');
  noKeyboard(sheet);
  affix(sheet, 'approx_kg', 'кг');

    const kg = unit.value === 'kg';
    fieldShown(sheet, 'approx_kg', !kg);
    fieldShown(sheet, 'min_qty', kg);
    fieldLabel(sheet, 'price_mnt', kg ? '1 кг-ийн үнэ' : 'Нэг толгойн үнэ');
    fieldLabel(sheet, 'quantity', kg ? 'Нийт хэдэн кг байгаа' : 'Хэдэн толгой байгаа');

  unit?.addEventListener('change', syncUnit);
  if (unit) syncUnit();
  wireDelivery(sheet);
  if (!(await done)) return;
  toast('Зар нэмэгдлээ — зочдод харагдаж байна.', 'good');

/**
 * Put a listing first, paid to Basu. Two steps in one popup: pick the tier at
 * the desk's price, then pay the QPay invoice and say so — the tier starts
 * when the bank says the money arrived, not when the button is pressed.
 */
async function promote(l) {
  let offer;
  try {
    offer = await sup('/v1/supplier/promotions');
  } catch (error) {
    return toast(error.message, 'bad');
  }
  const plans = offer.plans.filter((p) => !(l.tier === 'vip' && p.tier === 'featured'));
  const WHAT = {
    featured: 'Энгийн зараас дээгүүр, ногоон «Онцгой» тэмдэгтэй.',
    vip: 'Бүх зараас дээр, тод хүрээтэй, шар «VIP» тэмдэгтэй. Нүүр хуудсанд эхэлж гарна.',
  };
  const cards = plans
    .map(
      (p, i) => `<label class="promo-opt" data-tier="${esc(p.tier)}">
        <input type="radio" name="tier" value="${esc(p.tier)}"${i === plans.length - 1 ? ' checked' : ''}>
        <b>${esc(p.name)}<span class="chip" data-size="sm" data-tone="${p.tier === 'vip' ? 'hi' : 'accent'}" data-strong>${esc(p.days)} хоног</span></b>
        <span class="price">${p.price_mnt ? mnt(p.price_mnt) : 'Үнэгүй'}</span>
        <small>${WHAT[p.tier]}${l.tier === p.tier ? ' Одоогийн хугацаан дээр нэмэгдэнэ.' : ''}</small>
      </label>`,
    )
    .join('');
  let started = null;
  const done = await popup({
    title: l.tier ? 'Онцлолтоо сунгах' : 'Зарыг онцлох',
    sub: esc(l.title),
    width: 520,
    fields: [
      { type: 'static', label: 'Зэрэглэл', html: `<div class="promo-opts">${cards}</div>` },
      { type: 'note', text: 'Basu-д QPay-ээр, банкны аппаасаа төлнө. Төлбөр орсон даруйд эхэлж, хугацаа дуусахад энгийн зар болно.' },
    ],
    submit: 'Үргэлжлүүлэх',
    onSubmit: async (values, box) => {
      if (!started) {
        started = await sup(`/v1/supplier/listings/${l.id}/promote`, { method: 'POST', body: { tier: values.tier } });
        if (!started.invoice) return true;
        // The provider's page, and only an http(s) one: an address that runs here is no way to pay.
        const payAt = navHref(started.invoice.action_url);
        const pay = payAt
          ? `<a class="btn" data-v="primary" href="${esc(payAt)}" target="_blank" rel="noopener">QPay-ээр төлөх →</a>`
          : '<span class="cap">Туршилтын сервер: нэхэмжлэх шууд төлөгдсөнд тооцогдоно.</span>';
        box.step({
          title: 'QPay-ээр төлөх',
          sub: `${esc(started.promotion.name)} · ${esc(started.promotion.days)} хоног · ${esc(l.title)}`,
          fields: [
            { type: 'static', label: 'Төлөх дүн', html: `<div class="promo-pay"><span class="amount">${mnt(started.invoice.amount_mnt)}</span>${pay}</div>` },
            { type: 'note', text: 'Банкны аппаасаа төлсний дараа «Төлсөн» дарна уу. Бид банкнаас шалгаад зарыг тань онцолно.' },
          ],
          submit: 'Төлсөн',
        });
        return false;
      }
      await sup(`/v1/supplier/promotions/${started.promotion.id}/settle`, { method: 'POST' });
      return true;
    },
  });
  if (!done) return;
  toast(l.tier ? 'Хугацаа сунгагдлаа.' : 'Зар онцлогдлоо.', 'good');
  await reloadStall();
}

/* ── where the money goes ────────────────────────────────────────── */

/** Whether finance has checked the account against the contract: the one thing that holds a payout back. */
function bankState(b) {
  if (!b.bank_account) return ['declined', 'Бүртгэгдээгүй', 'Данс нэмэхгүй бол олголт хийгдэхгүй.'];
  if (b.bank_verified === false) return ['pending', 'Шалгаж байна', 'Basu санхүү дансыг гэрээтэй тулгаж баталгаажуулах хүртэл олголт хийгдэхгүй.'];
  if (b.bank_verified === true) return ['verified', 'Баталгаажсан', 'Олголт энэ данс руу очно.'];
  return ['', '', ''];
}

/**
 * The account a supplier's money goes to, as a card: where, whose, whether
 * it has been checked, and — for an owner — the button that changes it.
 */
function bankCard(b) {
  const [state, word, says] = bankState(b);
  const card = el(`
    <section class="card bank" id="bank">
      <div class="card-head"><h3>Олголт очих данс</h3>${word ? `<span class="chip" data-s="${state}">${word}</span>` : ''}</div>
      ${
        b.bank_account
          ? `<dl class="facts">
              <div><dt>Банк</dt><dd>${esc(b.bank_name)}</dd></div>
              <div><dt>Дансны дугаар</dt><dd><span class="mn">${esc(b.bank_account)}</span></dd></div>
              <div><dt>Эзэмшигч</dt><dd>${esc(b.bank_holder)}</dd></div>
            </dl>`
          : ''
      }
      <div class="card-foot"><span class="cap">${says || 'Олголт энэ данс руу очно.'}</span></div>
    </section>`);
  const foot = card.querySelector('.card-foot');
  if (may('org.idesh.profile:bank')) {
    const change = el(`<button class="btn" type="button" id="bank-edit"${b.bank_account ? '' : ' data-v="primary"'}>${b.bank_account ? 'Данс солих' : 'Данс нэмэх'}</button>`);
    change.addEventListener('click', () => void changeBank(b));
    foot.append(change);
  } else {
    foot.append(el('<span class="cap">Данс солих нь зөвхөн эзний эрх.</span>'));
  }
  return card;
}

/**
 * Where the money goes is the one field a stolen phone would change, so it
 * takes the owner's own password. An account with none yet is told how to
 * make one rather than asked for what it does not have.
 */
async function changeBank(b) {
  let me = null;
  try {
    me = await api('/v1/me', { token: token() });
  } catch {
    // Asked for the password anyway; the server says if it is wrong.
  }
  if (me && !me.has_password) {
    await popup({
      title: b.bank_account ? 'Данс солих' : 'Данс нэмэх',
      sub: 'Эхлээд нууц үг тохируулна',
      width: 460,
      fields: [
        {
          type: 'note',
          html: 'Олголт очих дансыг солихдоо өөрийн нууц үгээр баталгаажуулна — утсаа алдсан ч мөнгө тань өөр данс руу явахгүй. Таны бүртгэлд нууц үг алга: <b>Профайл → Нэвтрэх</b> хэсгээс эхлээд тохируулна уу.',
        },
      ],
      submit: 'Профайл руу очих',
      cancel: 'Хаах',
      onSubmit: async () => {
        show('profile');
        return true;
      },
    });
    return;
  }
  const done = popup({
    id: 'bank-change',
    title: b.bank_account ? 'Данс солих' : 'Данс нэмэх',
    sub: 'Олголт энэ данс руу очно',
    width: 560,
    fields: [
      { name: 'bank_name', label: 'Банк', value: b.bank_name ?? '', required: true },
      // An IBAN starts with MN: the keyboard with letters, the letters up as they are typed.
      { name: 'bank_account', label: 'Дансны дугаар', inputmode: 'text', autocomplete: 'off', placeholder: 'MN12 0005 0050 1234 5678', hint: 'IBAN (MN + 18 орон) эсвэл дансны дугаар (6–20 орон).', value: b.bank_account ?? '', required: true, attrs: { autocapitalize: 'characters', spellcheck: 'false' } },
      { name: 'bank_holder', label: 'Данс эзэмшигчийн нэр', value: b.bank_holder ?? '', required: true, wide: true },
      { name: 'password', label: 'Таны нууц үг', type: 'password', autocomplete: 'current-password', required: true, wide: true, hint: 'Мөнгө очих газар солигдож байгаа тул өөрийн нууц үгээр баталгаажуулна.' },
      { type: 'note', text: 'Basu санхүү шинэ дансыг гэрээтэй тулгаж баталгаажуулах хүртэл олголт хийгдэхгүй. Солигдсоныг эзэн бүрт мессежээр мэдэгдэнэ.' },
    ],
    submit: 'Хадгалах',
    onSubmit: async (v) => {
      const account = v.bank_account.replace(/\s+/g, '').toUpperCase();
      const badForm = ACCOUNT_WORDS;
      if (!ACCOUNT.test(account)) throw refuse('bank_account', badForm);
      try {
        await sup('/v1/supplier/profile', {
          method: 'PATCH',
          body: { bank_name: v.bank_name, bank_account: account, bank_holder: v.bank_holder, password: v.password },
        });
      } catch (error) {
        // The server takes the same forms the application does; the one thing this change can say
        // «the state changed» about is the number's form, said under it in the page's own words.
        if (error.code === 'WRONG_STATE') throw refuse('bank_account', badForm);
        throw error;
      }
      return true;
    },
  });
  // The banks most people have, offered as they type.
  const sheet = document.getElementById('bank-change');
  noKeyboard(sheet);
  const bankInput = sheet?.querySelector('[name="bank_name"]');
  if (bankInput) {
    bankInput.setAttribute('list', 'popup-banks');
    bankInput.setAttribute('autocomplete', 'off');
    sheet.append(el(`<datalist id="popup-banks">${BANKS.map((name) => `<option value="${name}">`).join('')}</datalist>`));
  }
  if (!(await done)) return;
  toast('Данс хадгалагдлаа. Basu санхүү шалгаж баталгаажуулна.', 'good');
  show(tab);
}

        ],

/** «9/8 14:05» for a timestamp the supplier reads across a list. */
function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

/**
 * Signing out is two taps: the first turns the button into the question for
 * four seconds, the second answers it — a stray tap on a counter tablet must
 * not sign the counter out. `buttons` are every way out on the frame.
 */
function twoTaps(buttons, word, leave, now = false) {
  let armed = null;
  const say = (asking) => {
    for (const b of buttons) {
      b.toggleAttribute('data-confirm', asking);
      const label = b.querySelector('.t');
      if (label) {
        label.textContent = asking ? 'Гарах уу?' : word;
        label.classList.toggle('sr-only', !asking);
      } else if (b.closest('.acct')) b.innerHTML = asking ? 'Гарах уу?' : NAV_ICON.out;
      else b.textContent = asking ? 'Гарах уу?' : word;
      b.setAttribute('aria-label', asking ? 'Гарах уу?' : word);
    }
  };
  return () => {
    if (now) return leave();
    if (armed) {
      clearTimeout(armed);
      armed = null;
      say(false);
      return leave();
    }
    say(true);
    armed = setTimeout(() => {
      armed = null;
      say(false);
    }, 4000);
  };
}
