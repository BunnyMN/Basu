<!doctype html>
<html lang="mn" data-biz>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100D0C">
<title>Нийлүүлэгч — Basu</title>
<link rel="stylesheet" href="/app.css">
<!-- Read only when a table is drawn (datatable.js): never in the way of the first paint. -->
<script defer src="/vendor/table-core.js"></script>
<style>
/* ── The supplier's own app ─────────────────────────────────────────
   For a person with a knife in one hand and a phone in the other, and for
   the same person at a desk: the business's side of «Тансаг хар». The
   charcoal ground, the names of things and every number, code and sum in
   the condensed display, one off-white pill per order (html[data-biz]),
   «Цуцлах» in the crimson's ink with a popup before it, and the meat's own
   photo beside each order. Colour, type, buttons, chips, cards, rows,
   fields, popups and tables come from /app.css; what is left here is where
   things sit, and the few looks only this page has. */

/* ── the doors: sign in, apply, waiting ── */
.door{max-width:440px;margin:40px auto;padding:0 var(--gutter) calc(32px + var(--safe-b))}
.door .card{padding:28px 24px}
.door .brand{display:inline-flex;align-items:center;min-width:var(--target);min-height:var(--target);margin:-10px 0 6px;color:var(--ink);text-decoration:none}
.door :is(h1,h2){font-family:var(--display);font-size:var(--t-title);font-weight:800;line-height:.92;letter-spacing:-.004em;margin:0 0 12px;text-wrap:balance}
.door .lead{color:var(--ink-2);margin:0 0 24px;text-wrap:pretty}
.door .form-group > .cap{margin:-2px 0 14px}
.door .foot{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.door .form-error{margin:0 0 16px}
/* what being a supplier is, in three short steps under the way in: a gold number, a verb, one line */
.how{list-style:none;margin:28px 4px 0;padding:0;display:grid;gap:18px}
.how li{display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;align-items:start;font-size:var(--t-body);line-height:1.5;color:var(--ink-2)}
.how li b{display:block;font-size:var(--t-body-lg);font-weight:700;color:var(--ink);margin-bottom:2px}
.how .n{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--gold-line);font-family:var(--display);font-size:1rem;font-weight:800;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.door-foot{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0 8px;margin-top:12px;font-size:var(--t-cap);font-weight:500;color:var(--ink-3)}
.door-foot a,.door-foot button{display:inline-flex;align-items:center;min-height:var(--target);padding:0;border:0;background:none;font:inherit;color:var(--ink-2);text-decoration:none;cursor:pointer}
.door-foot .other{flex-basis:100%;justify-content:center;font-weight:700;color:var(--ink)}
@media (hover:hover){.door-foot :is(a,button):hover{color:var(--ink)}}
/* the walkthrough's shortcuts: one folded «Демо горим» group, fenced off from the real door */
.demo{margin-top:20px;padding:0 14px}
.demo > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--target);cursor:pointer;-webkit-user-select:none;user-select:none}
.demo > summary::-webkit-details-marker{display:none}
.demo > summary .chev{transform:rotate(90deg);transition:transform var(--dur) var(--ease)}
.demo[open] > summary .chev{transform:rotate(-90deg)}
.demo > .body{padding:0 0 12px}
.demo .btn{width:100%}
.demo .venues[data-rows]{background:none;border:0;border-radius:0;box-shadow:none;border-top:1px solid var(--line);margin-top:12px}
.demo .venues .row{padding-left:0;padding-right:0}
.demo .venues .row:active{background:var(--surface)}
@media (hover:hover){.demo .venues .row:hover{background:var(--surface)}}
/* where an application stands: the word big in the display, its dot in what it means */
.status{padding:4px 0 0}
.status .big{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:var(--t-title-2);font-weight:800;line-height:.95;letter-spacing:-.004em;color:var(--ink)}
.status .big::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--ink-3)}
.status[data-s="applied"] .big::before{background:var(--gold)}
.status[data-s="contracted"] .big::before{background:var(--ink)}
.status[data-s="declined"] .big{color:var(--accent-ink)}
.status[data-s="declined"] .big::before{background:var(--accent-ink)}
.status .cap{margin-top:12px;max-width:44ch;font-size:var(--t-body)}
.door .stepper{margin:20px 0 4px}
/* under the steps: how long it usually takes, and the address to write to meanwhile */
.door .wait-note{margin:12px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:var(--t-cap);line-height:1.5;color:var(--ink-2);text-wrap:pretty}
.door .wait-note a{overflow-wrap:anywhere}
.door .card > .btn[data-size="lg"]{margin-top:24px}
/* a field the page refused, said where it is — the stop tone wins over the field's own border */
.door .field :is(input,textarea)[aria-invalid="true"]{border-color:var(--stop);box-shadow:var(--ring-stop)}
.door .field .help[data-error]{color:var(--stop)}

/* ── the app frame ── */
.shell{min-height:100dvh;display:flex;flex-direction:column}
.view{flex:1;min-width:0;width:100%;max-width:var(--col-desk);margin:0 auto;padding:16px var(--gutter) 24px}
.view .page-head[data-large]{padding-top:8px}
.page-head p{margin-bottom:0}
:root[data-desk] .page-head h1 + p{margin-top:18px}
.head-acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.page-head[data-large] .head-acts{margin-top:16px}
/* a page's name is the biggest thing on it: 56 on a phone, up to 88 at a desk */
.view .page-head[data-large] h1{font-size:3.5rem;line-height:.86}
:root[data-desk] .page-head h1{font-size:clamp(3rem,6vw,5.5rem);line-height:.84}
/* the day over the day's title, quiet */
.dateline{display:block;margin:0 0 14px;font-size:var(--t-body);font-weight:600;line-height:1.2;color:var(--ink-3)}
/* on a phone the bar names the business at its leading edge; the way out sits at the end */
.topbar.sup{grid-template-columns:minmax(0,1fr) auto;padding-left:var(--gutter)}
.topbar.sup[data-shell]{grid-template-columns:auto minmax(0,1fr);padding-left:8px}
.topbar.sup .title{text-align:left}
.topbar.sup .title span{color:var(--ink-3)}
/* on a phone the nav is a tab bar and shows only its tabs */
.tabbar > :not([data-tab]){display:none}
/* signing out is two taps: the first turns the button into the question, the second answers it */
.topbar .out[data-confirm]{width:auto;padding:0 12px;border-color:var(--stop-line);color:var(--stop)}
.topbar .out[data-confirm] svg{display:none}
.sidebar .out[data-confirm]{background:var(--stop-soft);color:var(--stop)}
/* at a desk the pages sit in the dashboard's frame (/app.css .desk-frame), with the prototype's air around them */
.desk-frame .page{width:100%;max-width:1240px;margin:0 auto;padding:44px 48px 64px}
@media (max-width:1100px){.desk-frame .page{padding:32px var(--gutter) 48px}}
/* a lost connection is said across the work, with the last time it was right */
#conn{margin:0 0 16px;border:1px solid var(--stop-line);border-radius:var(--r-ctl)}
#conn .mono{margin-left:0}
#board[data-stale]{opacity:.55;transition:opacity var(--dur) var(--ease)}
/* a guest who gave no name, said quietly: the number beside it is what the counter rings */
.unnamed{font-weight:500;color:var(--ink-3)}
.nowrap{white-space:nowrap}
/* a phone number, a TIN, an account: digits read rather than glanced at — the sans, lined up */
.digits{font-family:var(--sans);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0}
/* the meat's own photo, beside an order or a listing */
.ph{display:block;width:48px;height:48px;flex:none;border-radius:var(--r-sm);object-fit:cover;background:var(--surface-2)}
.ph[data-size="lg"]{width:56px;height:56px}

/* ── today ── */
/* what stands between the supplier and their orders or money, before the numbers: one line each */
.today-notes{display:grid;gap:10px;margin-bottom:16px}
.today-notes .note-act{margin-top:8px}
:root[data-desk] .today-notes .callout:has(> .note-act){display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:24px;row-gap:2px}
:root[data-desk] .today-notes .callout > .note-act{grid-column:2;grid-row:1 / span 2;margin:0}
/* the day's numbers, big: a count in the display at the tile's width, one line under it */
:is(.stats,.money-sum) .kpi b{font-size:clamp(1.75rem,26cqi,3.5rem);line-height:.88}
:is(.stats,.money-sum) .kpi[data-money]{background:linear-gradient(150deg,#2A2321,var(--surface) 70%);border-color:var(--line-2)}
:root[data-desk] :is(.stats,.money-sum) .kpi{padding:24px 26px;gap:18px;min-height:172px}
:root[data-desk] :is(.stats,.money-sum) .kpi .lab{font-size:.875rem}
:root[data-desk] :is(.stats,.money-sum) .kpi > span{font-size:.875rem}
:root[data-desk] :is(.stats,.money-sum) .kpi b{font-size:clamp(2.75rem,28cqi,4.75rem);line-height:.86}
:root[data-desk] :is(.stats,.money-sum) .kpi[data-money] b{font-size:clamp(2.5rem,21cqi,4.75rem)}
:root[data-desk] :is(.stats,.money-sum) .kpi[data-long] b{font-size:clamp(2rem,15cqi,3.5rem)}
:root[data-desk] :is(.stats,.money-sum):has(> :nth-child(3):last-child){grid-template-columns:1fr 1fr 1.25fr;gap:16px}
.stats{margin-bottom:28px}
:root[data-desk] .money-sum:has(> .kpi:only-child){grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
/* at a desk: the work as one table, «Бэлтгэх захиалга», the lanes as filters over it */
.work{margin-top:44px}
.work-hd{display:flex;align-items:center;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin:0 0 16px}
.work-hd h2{font-size:2.5rem;line-height:1}
.lane-filter > button{display:inline-flex;align-items:center;gap:8px;font-size:.875rem}
.lane-filter > button .k{font-style:normal;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums}
.lane-filter > button[aria-pressed="true"] .k{color:#6E625B}
.it-cell{display:flex;align-items:center;gap:14px;min-width:220px}
.it-cell .dt-two{min-width:0}
.it-cell .dt-two :is(b,small){overflow-wrap:normal}
.dt-table .stage{min-width:120px}
.dt-sub.how-sub{display:none}
/* 1360–1439: the same tables, a little tighter — «Авах» moves under the day, the stall's ready day goes to its popup */
@media (max-width:1439px){
  :is(.work,.orders) .dt-table :is(th[data-key="receive"],td[data-label="Авах"]),
  .stall .dt-table :is(th[data-key="ready_from"],td[data-label="Бэлэн болох"]){display:none}
  .dt-sub.how-sub{display:block}
  :root[data-desk] :is(.work,.orders,.stall,.money-page) .dt-table :is(th,td){padding-left:16px;padding-right:16px}
  .dt-table .stage{min-width:112px}
  .work .dt-act .btn[data-v="primary"]{min-width:150px}
}
.it-cell .dt-two b{font-size:var(--t-row);line-height:1.25}
.it-cell .dt-two small.code{font-family:var(--display);font-size:.9375rem;font-weight:700;letter-spacing:.02em;color:var(--ink-3)}
.how-cell{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.how-cell svg{width:18px;height:18px;flex:none;fill:none;stroke:var(--ink-3);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.day-word{white-space:nowrap}
.day-word[data-tone="stop"],.dt-sub[data-tone="stop"]{color:var(--accent-ink);font-weight:700}
.day-word[data-tone="stop"]::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin:0 8px 2px 0;vertical-align:middle}
.dt-act .btns.row-acts{display:inline-flex;flex-direction:row-reverse;align-items:center;gap:8px;margin:0}
.work .dt-act .btn[data-v="primary"]{min-width:172px;min-height:var(--h-md);padding:0 18px;font-size:.875rem}
.work .dt-table td{padding-top:14px;padding-bottom:14px}
/* on a phone: one card per order, grouped by what to do next, empty groups not drawn */
.group{margin-top:36px}
.group:first-child{margin-top:4px}
.group h2{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:var(--t-title-2)}
.group h2 .n{margin:0;min-width:26px;height:26px;padding:0 8px;font-family:var(--sans);font-size:.8125rem}
.stack{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));align-items:start}
.stack > *{min-width:0}
/* one order: its meat and code over its state (a word and the meter), the facts, the money, one button */
.ticket{overflow:hidden}
.ticket .top{display:grid;grid-template-columns:56px minmax(0,1fr);align-items:center;gap:14px;padding:16px 16px 0}
.ticket .top .it{min-width:0}
.ticket .what{display:block;font-size:var(--t-row);font-weight:700;line-height:var(--lh-snug);color:var(--ink);overflow-wrap:break-word}
.ticket .id{display:block;margin-top:5px;font-family:var(--display);font-size:1.25rem;font-weight:800;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums lining-nums;color:var(--ink-2)}
.ticket .top > .stage{grid-column:1 / -1;max-width:none;width:100%;gap:10px;margin-top:2px}
.ticket .top > .stage > b{font-size:var(--t-body)}
/* when it is due, said with a hairline only: gold on its day, the crimson's ink once the day has gone */
.ticket[data-due="today"]{box-shadow:inset 0 2px 0 var(--gold),var(--shadow-1)}
.ticket[data-due="late"]{box-shadow:inset 0 2px 0 var(--accent-ink),var(--shadow-1)}
.ticket .body{padding:16px}
.ticket .facts-rows{padding-top:6px;border-top:1px solid var(--line)}
.ticket .who,.ticket .on,.ticket .where{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;padding:7px 0;font-size:var(--t-body-lg);line-height:1.4}
.ticket .k{font-size:var(--t-cap);line-height:1.4;padding-top:2px;color:var(--ink-3)}
.ticket .v{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;color:var(--ink);min-width:0}
.ticket .where .v > span:first-child{overflow-wrap:anywhere}
/* A listing's own photographs on its popup: small square tiles, the cover marked, one more tile to add. */
.shots{display:flex;flex-wrap:wrap;gap:10px}
.shots[aria-busy="true"]{opacity:.6}
.shot{position:relative;flex:none;width:88px;height:88px;border-radius:var(--r-sm);overflow:hidden;background:var(--surface-2);border:1px solid var(--line-2)}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
.shot[data-cover]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.shot i{position:absolute;left:6px;bottom:6px;padding:2px 8px;border-radius:var(--r-pill);background:var(--ink);color:var(--on-light);font-style:normal;font-size:.6875rem;font-weight:700;line-height:1.4}
.shot button{position:absolute;top:4px;display:grid;place-items:center;width:28px;height:28px;margin:0;padding:0;border:0;border-radius:50%;background:rgba(16,13,12,.72);color:var(--ink);font:inherit;font-size:1rem;font-weight:700;line-height:1;cursor:pointer}
.shot .drop{right:4px}
.shot .first{left:4px;font-size:.8125rem}
.shot.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-style:dashed;background:none;color:var(--ink-2);font:inherit;cursor:pointer}
.shot.add b{font-size:1.5rem;font-weight:500;line-height:1}
.shot.add span{font-size:.6875rem;font-weight:600;line-height:1.2;text-align:center}
@media (hover:hover){.shot.add:hover{border-color:var(--ink-2);color:var(--ink)}}
/* The certificates under the listings, and the popup's file field and photograph. */
.papers{margin-top:28px}
.papers-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.papers-none{margin:8px 0 0;color:var(--ink-3);font-size:var(--t-body);max-width:56ch}
.paper-act,.call-act{margin-top:12px}
.paper-act + .call-act{margin-left:8px}
.file-pick{display:flex;align-items:center;gap:12px;min-width:0}
/* The certificate's product table in its popup: animal, product, how many, of what. */
.paper-rows{display:grid;gap:8px;margin-bottom:10px}
.paper-row{display:grid;grid-template-columns:minmax(84px,1fr) minmax(0,2fr) minmax(64px,1fr) minmax(76px,1fr) auto;gap:8px;align-items:center}
.paper-row > *{min-width:0}
@media (max-width:520px){.paper-row{grid-template-columns:1fr 1fr}.paper-row [data-k="what"]{grid-column:1/-1;order:-1}}
.file-pick .file-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-3);font-size:var(--t-body)}
.ticket .rel{font-size:var(--t-cap);font-weight:600;color:var(--ink-2)}
.ticket .rel[data-tone="hold"]{color:var(--gold);font-weight:700}
.ticket .rel[data-tone="stop"]{color:var(--stop);font-weight:700}
/* a number dials: the whole 44px line is the target, not the 14px glyph */
.ticket a.tel{min-height:var(--target);margin:-12px 0;padding:0 2px}
.ticket .sum,.ticket .pay{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:var(--t-cap);font-weight:600;color:var(--ink-2)}
.ticket .sum{margin-top:10px;padding-top:14px;border-top:1px solid var(--line)}
.ticket .pay{margin-top:8px}
.ticket .sum .money{font-size:1.25rem}
.ticket .pay .money{font-size:1.75rem;font-weight:800}
.ticket .grace{margin-top:14px;font-size:var(--t-cap)}
.ticket .btns{display:flex;flex-direction:column;gap:6px;margin-top:16px}
/* on the desk (an order's own page) the one button sits at its own width on the right, Цуцлах beside it — the full-width slab is a thumb affordance */
@media (pointer:fine){
  :root[data-desk] .ticket .body > .btns{flex-direction:row-reverse;justify-content:flex-start;gap:8px}
  :root[data-desk] .ticket .body > .btns .btn[data-size="lg"]{width:auto;min-height:var(--h-md);padding:0 22px;font-size:var(--t-body-lg)}
}
/* a desk narrower than the tables (a counter's tablet, a small laptop): the lanes side by side, a column of cards each */
:root[data-desk] #board:has(> .group){display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:36px 24px;align-items:start;margin-top:36px}
:root[data-desk] #board > .group{margin-top:0}
:root[data-desk] #board > .group .stack{grid-template-columns:minmax(0,1fr)}
/* the shape of the work while it loads */
.board-skel{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.board-skel .card{display:grid;gap:12px;padding:16px}
.board-skel .skel{height:14px}
.board-skel .skel[data-h="band"]{height:56px;width:56px;border-radius:var(--r-sm)}
.board-skel .skel[data-h="btn"]{height:56px;margin-top:8px;border-radius:var(--r-pill)}
.board-skel[data-rows]{display:flex;margin-top:44px}
.board-skel[data-rows] .skel-row{min-height:76px}
.board-skel[data-rows] .skel-row > .skel:last-child{width:172px;height:44px;border-radius:var(--r-pill)}
/* the module's shape before the seat is known (waiting()): the frame at its sizes, bars where its words will be */
.sup-wait .page-head > div{flex:1;min-width:0;display:grid;gap:12px}
/* bars on the ground itself, not on a card: the hairline's tone */
.sup-wait .page-head .skel{background:var(--line)}
.sup-wait .wait-title{height:44px;width:min(260px,60%)}
:root[data-desk] .sup-wait .wait-title{height:72px;width:min(320px,60%)}
.sup-wait .wait-line{height:14px;width:min(180px,45%)}
.sup-wait .kpi-band{margin-bottom:24px}
.sup-wait .kpi{display:grid;gap:10px;padding:16px 18px}
.sup-wait .ws-btn{background:var(--surface)}
.sup-wait .ws-text{gap:6px}
.sup-wait .ws-mark{background:var(--surface-2)}
.sup-wait .wait-nav{display:grid;gap:14px;padding:10px 10px 0}
.sup-wait .wait-nav .skel{height:14px;width:70%}
.sup-wait .wait-nav .skel:nth-child(2n){width:52%}
.sup-wait .topbar .title{display:grid;gap:6px}
.sup-wait .wait-name{height:16px;width:min(200px,55%)}
.sup-wait .wait-role{height:12px;width:min(120px,35%)}

/* ── orders ── */
.orders .tools{margin-bottom:16px}
.orders .tools .input{flex:1 1 220px;min-width:0}
.orders .tools .seg{flex:none}
/* a row: the meat, what and whose, its state as a word and the meter, and what it brings */
.order.row{align-items:flex-start}
.order > .lead{padding-top:2px}
.order .meta{white-space:normal;overflow:visible;text-overflow:clip}
.order > .main > .stage{display:flex;flex-direction:row;align-items:center;gap:12px;max-width:none;margin-top:10px}
.order > .main > .stage > b{font-size:var(--t-cap)}
.order > .main > .stage .meter{width:96px;min-width:0;flex:none}
/* a guest's number goes to the next line whole beside a wide state, never «+976 9555» over «0002» */
.order .sub .digits{white-space:nowrap}
.order-page .back{margin-bottom:8px}
.order-page .page-head h1 .mn{font-weight:800;letter-spacing:.005em}
.order-page .page-head .stage{margin-top:18px;min-width:168px}
.order-page .page-head .stage > b{font-size:var(--t-body)}
.order-page #act{margin-bottom:16px}
.order-page .callout{margin-bottom:16px}

.dt-sub{display:block;font-family:var(--sans);font-size:var(--t-meta);font-weight:600;color:var(--ink-3);margin-top:3px}

/* ── the stall ── */
.stall .rows{margin-bottom:24px}
.stall .row{flex-wrap:wrap;align-items:flex-start}
.stall .row > .main{flex:1 1 calc(100% - 72px)}
.stall .row .title .chip{margin-left:8px;vertical-align:2px}

.stall .num{font-family:var(--display);font-size:1.375rem;font-weight:800;font-variant-numeric:tabular-nums lining-nums;letter-spacing:.01em;line-height:1;color:var(--ink)}

/* a listing's paid place: a label in a gold hairline, not a state's dot */
.chip.tier{gap:0;height:24px;min-height:0;padding:0 10px;border:1px solid var(--gold-line);border-radius:var(--r-pill);color:var(--gold);font-size:.75rem;font-weight:700}

.cell-sub{display:block;font-size:var(--t-cap);color:var(--ink-3);margin-top:2px}
/* the two tiers to choose from: the chosen one is the ink's frame on a raised well — never the crimson */
.promo-opts{display:grid;gap:10px}
.promo-opt{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:16px;border:1px solid var(--line-2);border-radius:var(--r-day);background:var(--surface);cursor:pointer;transition:border-color var(--dur),background-color var(--dur)}
.promo-opt:has(input:checked){border-color:var(--ink);background:var(--surface-3)}
.promo-opt:has(input:checked) input[type="radio"]:checked{box-shadow:inset 0 0 0 5px var(--surface-3)}
.promo-opt:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
@media (hover:hover){.promo-opt:not(:has(input:checked)):hover{border-color:var(--ink-3)}}
.promo-opt input{margin:2px 0 0}
.promo-opt b{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:var(--t-row)}
.promo-opt small{grid-column:2 / -1;font-size:var(--t-cap);line-height:1.45;color:var(--ink-2)}
.promo-opt .price{font-family:var(--display);font-size:1.5rem;font-weight:800;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums;color:var(--ink)}
.promo-pay{display:grid;gap:16px;justify-items:start}
.promo-pay .amount{font-family:var(--display);font-size:3.5rem;font-weight:800;line-height:.9;letter-spacing:.005em;font-variant-numeric:tabular-nums lining-nums;color:var(--ink)}

/* ── the popups this page opens ── */
/* a cancel's reason: rows a thumb can hit; the chosen one raised, never tinted red */
.reasons .reason-list{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r-day);overflow:hidden;background:var(--surface)}
.reasons .reason{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 16px;margin:0;font-size:var(--t-body-lg);line-height:1.35;color:var(--ink);cursor:pointer}

.reasons .reason:has(input:checked){background:var(--surface-3);font-weight:700}

#cancel-order [data-submit][disabled]{background:var(--surface-2);border-color:var(--line);color:var(--ink-3);cursor:not-allowed}
/* the code to check against the guest's phone: as big as the popup lets it be */
.hand-code{padding:28px 20px 22px}

.field > .affix{font-weight:400;margin-bottom:0}

/* ── facts: the profile and the money read as labelled values, changed in popups ── */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px 24px;margin:0;padding:18px}
.facts > div{min-width:0}

.facts dd .mn{font-size:1.25rem;font-weight:800}
.facts dd small{display:block;font-size:var(--t-cap);font-weight:500;color:var(--ink-2);margin-top:4px}
.facts dd[data-none]{font-weight:500;color:var(--ink-3)}
:root[data-desk] .facts{padding:22px 24px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
.card-foot .cap{flex:1 1 260px;margin:0}
.card-foot .cap a{overflow-wrap:anywhere}
:root[data-desk] .card-foot{padding:14px 24px}
/* a card's title is the h2 under the page's h1: the sans at a card head's size, the right level */
.card-head h2{flex:1;min-width:0;font-family:var(--sans);font-size:var(--t-title-3);font-weight:700;line-height:var(--lh-snug);letter-spacing:0}
.card-head .chip{flex:none}
.card-head + .card-foot{border-top:0}
.cards{display:grid;gap:16px}
.money-sum{margin-bottom:16px}
.money-page .cards,.profile-page .cards{margin-bottom:24px}
.settle-list .row .amt .chip{margin-top:4px}
/* What a place holds before it holds anything is app.css's .empty-state (the markup blank() draws). */
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { api, photoOf, ownPhoto, store, shell, toast, mnt, money, KIND, IDESH_STATE, ideshStage, dayLabel, dayShort, ubParts, signInDoors, accountWays, authReturn, popup, confirmPopup, passwordPopup, BANK_NAMES, phoneText, dropSession, whatWentWrong } from '/api.js';
import { callButton, listenForCalls } from '/call.js';
import { NAV_ICON, deskFrame, navHref } from '/sidenav.js';
import { dataTable, dtCell } from '/datatable.js';

const root = document.getElementById('root');
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
/**
 * Text into markup: a guest's name, the address and the number a guest typed
 * for a delivery, a listing, the business's own name. Quotes too — a number
 * goes into a tel: link and a name into an input's value, and a `"` would
 * end the attribute and start one of its own on the screen of everybody who
 * works here.
 */
const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

/**
 * The business the dashboard opened this page for — `/supplier?org=…` — so
 * a person who works at two suppliers works at the one they chose there.
 */
const ORG = new URLSearchParams(location.search).get('org');
/**
 * The person's own sign-in — made on this page, by the app, on the website
 * or on the dashboard: one browser holds one person. A tablet on the
 * counter is somebody who works there, signed in as themselves, doing what
 * their role allows.
 */
const token = () => store.guestToken;
/** The supplier's own routes: the token, and which business when the dashboard said. */
const sup = (path, options = {}) => api(path, { ...options, token: token(), headers: ORG ? { 'x-basu-org': ORG } : {} });

/**
 * Who this seat is here and what it may do — `/v1/supplier/seat`, asked on
 * opening. A tab or a button this seat may not use is not drawn; the server
 * refuses it anyway.
 */
let seat = null;
const may = (permission) => Boolean(seat?.permissions?.includes(permission));
/** The words for the roles a business is built with; any other role Basu made is said as the business's kind. */
const ROLE_WORD = { owner: 'Эзэн', manager: 'Менежер', staff: 'Ажилтан', accountant: 'Нягтлан' };

/**
 * Phone chrome below 900px, a desk above it: the same nav is a tab bar or a
 * sidebar, and the root carries data-desk so the shared sheet drops the blur
 * and tightens the controls. jsdom has no matchMedia, so a page under test is
 * a phone.
 */
const desk = typeof matchMedia === 'function' ? matchMedia('(min-width:900px)') : null;
const isDesk = () => Boolean(desk?.matches);
function applyDesk() {
  document.documentElement.toggleAttribute('data-desk', isDesk());
  document.body.classList.toggle('has-tabbar', Boolean(document.querySelector('.shell > .tabbar')) && !isDesk());
}
/** Which frame is drawn: the desk's (true), the phone's (false), or none yet. */
let frameIsDesk = null;
let settling = null;
// Phone and desk are two frames, not one restyled: crossing the line redraws
// the module on the tab it was on — once the width has settled, and only if
// the frame drawn is the wrong one. A window dragged across the line, or an
// iPad's split view, can cross it and back in a few milliseconds.
desk?.addEventListener?.('change', () => {
  clearTimeout(settling);
  settling = setTimeout(() => {
    applyDesk();
    if (document.getElementById('view') && frameIsDesk !== isDesk()) openModule();
  }, 150);
});

/**
 * A desk wide enough for the prototype's tables — 1360px and up: the day's
 * work, the orders, the stall and the money as tables. A narrower desk (a
 * tablet on its side, a small laptop) shows them as a phone does — cards and
 * rows, big buttons — inside the desk's own frame. Crossing the line redraws
 * the list on screen, never an order's own page under the person.
 */
const wideMq = typeof matchMedia === 'function' ? matchMedia('(min-width:1360px)') : null;
const wideDesk = () => Boolean(frameIsDesk && wideMq?.matches);
wideMq?.addEventListener?.('change', () => {
  if (!frameIsDesk || !document.getElementById('view') || document.querySelector('.order-page')) return;
  show(tab);
});

/**
 * Inside the Basu app this page is one of the app's: the app owns the
 * session, and the way out is the app's own home. It never signs anybody out
 * of the app, and never draws a way in of its own — no code by email, no
 * password form inside a page inside the app.
 */
function goHome() {
  shell.post({ type: 'home' });
}

/** The app's session was refused: the app asks on its own sheet; closed, back home. */
function askShell() {
  shell.signIn().then(() => boot(), goHome);
}

/** Sign out of the session this page is using — and, having come from the dashboard, go back there. */
function signOut() {
  if (shell.present) {
    askShell();
    return;
  }
  dropSession();
  seat = null;
  if (ORG) {
    location.href = '/dashboard';
    return;
  }
  boot();
}

const ICON = {
  today: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8 3v4M16 3v4M8 14h3"/></svg>',
  orders: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h4"/></svg>',
  stall: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1.5-4h13L20 9"/><path d="M4 9c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3"/><path d="M6 12v8h12v-8M10 20v-5h4v5"/></svg>',
  money: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M15.5 15h2"/></svg>',
  profile: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-3.5 3.6-5 7-5s6 1.5 7 5"/></svg>',
  out: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4H5v16h8"/><path d="M10 12h10M17 8l3 4-3 4"/></svg>',
  left: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>',
  phone: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  search: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  truck: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5h11v10H3z"/><path d="M14 10h4l3 3.2v3.3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  store: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1.5-4h13L20 9"/><path d="M5 9v11h14V9"/><path d="M10 20v-5h4v5"/></svg>',
};

/**
 * What a place is for while it holds nothing yet: a mark, a title, one line,
 * and the one next step. The markup api.js's emptyState() draws, so the page
 * can take that up as it is once it lands. `action` is { label, onClick,
 * primary, id }.
 */
function blank({ icon = ICON.orders, title, text = '', action = null, size, tone, frame = false }) {
  const box = el(`<div class="empty-state"${size ? ` data-size="${size}"` : ''}${tone ? ` data-tone="${tone}"` : ''}${frame ? ' data-frame' : ''}><span class="es-mark" aria-hidden="true">${icon}</span><h2 class="es-title"></h2><p class="es-text"></p></div>`);
  box.querySelector('.es-title').textContent = title ?? '';
  box.querySelector('.es-text').textContent = text ?? '';
  if (action) {
    const b = el(`<button class="btn" type="button"${action.primary ? ' data-v="primary"' : ''}${action.id ? ` id="${action.id}"` : ''}></button>`);
    b.textContent = action.label;
    b.addEventListener('click', action.onClick);
    const act = el('<div class="es-act"></div>');
    act.append(b);
    box.append(act);
  }
  return box;
}

/**
 * The meat's photo beside an order or a listing: the supplier's own cover
 * photograph where the listing has one, else Basu's picture of that kind of
 * animal — the one the website shows for it. A picture of the words beside
 * it, so a reader skips it.
 */
const thumb = (of, size = '') =>
  `<img class="ph" src="${esc(ownPhoto(of) ?? `/brand/meat/${photoOf(of)}-480.webp`)}" alt="" width="48" height="48" loading="lazy" decoding="async"${size ? ` data-size="${size}"` : ''}>`;

/** How an order reaches its guest, as a mark and a word: «Хүргэлт» or «Өөрөө авна». */
const howCell = (o) => `<span class="how-cell">${o.receive === 'delivery' ? `${ICON.truck}Хүргэлт` : `${ICON.store}Өөрөө авна`}</span>`;

/** A number that dials: the digits in the link, the number as people read it on the screen («+976 9911 2233»). */
const tel = (n) => `<a class="tel" href="tel:${esc(String(n).replace(/[^\d+]/g, ''))}">${ICON.phone}${esc(phoneText(n))}</a>`;

/**
 * Who an order is for, as the counter greets and rings them: the name they
 * chose — or, with none, said so quietly (never a piece of their address) —
 * and the number to ring: their own, or the one they gave for the delivery.
 * The server sends nothing more of them than that.
 */
const guestName = (o) => (o.guest ? esc(o.guest) : '<span class="unnamed">Нэр оруулаагүй</span>');
const guestNumber = (o) => o.guest_phone || o.address_phone || null;
/** The same in one line under a popup's title: «Сарнай · +976 9911 2233». */
const guestLine = (o) => [guestName(o), guestNumber(o) ? `<span class="digits nowrap">${esc(phoneText(guestNumber(o)))}</span>` : ''].filter(Boolean).join(' · ');

/** A button at work: its words stay (for a reader and for textContent), a spinner turns, no second press. */
function pressing(button, on) {
  if (!button) return;
  button.toggleAttribute('data-busy', on);
  if (on) button.setAttribute('aria-busy', 'true');
  else button.removeAttribute('aria-busy');
}

/** The walkthrough's shortcuts, folded under a door: opened on purpose, never mistaken for the real way in. */
const demoGroup = () => el('<details class="demo inset" data-demo><summary><span class="lab">Демо горим</span><span class="chev" aria-hidden="true"></span></summary><div class="body"></div></details>');

/**
 * Under every door: the terms a supplier signs up to and, signed in, the way
 * back out — somebody who came in with the wrong account is not stuck on a
 * form that is not theirs. Inside the app the app owns the session.
 */
function doorFoot(signedIn = false) {
  const foot = el(`<div class="door-foot"><a href="/terms">Үйлчилгээний нөхцөл</a><span aria-hidden="true">·</span><a href="/privacy">Нууцлалын бодлого</a></div>`);
  if (signedIn && !shell.present) {
    const other = el('<button class="other" type="button" id="other">Өөр бүртгэлээр нэвтрэх</button>');
    other.addEventListener('click', signOut);
    foot.prepend(other);
  }
  return foot;
}

/** The wordmark at the top of a door: home to Basu in a browser, a plain mark inside the app. */
const brand = () => (shell.present ? '<div class="brand wordmark" data-size="sm">Basu</div>' : '<a class="brand wordmark" data-size="sm" href="/">Basu</a>');

/* ── the doors ─────────────────────────────────────────────────────── */

/**
 * The ways in — Google, a code by email, or a password (the phone and
 * password a contract was signed with, or an address) — the same block the
 * guests' pages use. Whoever is new becomes an account by any of them, and
 * the application form is the next card. Under it, what being a supplier is,
 * in the three facts somebody deciding wants to know.
 */
function signInCard() {
  const card = el(`
    <main class="door">
      <div class="card" id="signin">
        ${brand()}
        <h1>Нийлүүлэгчийн хэсэг</h1>
        <p class="lead">Нэвтрээд нийлүүлэгч болох хүсэлтээ илгээнэ үү.</p>
        <div data-doors></div>
      </div>
      <ol class="how" aria-label="Нийлүүлэгч болох нь">
        <li><span class="n">1</span><span><b>Хүсэлт илгээнэ</b>Basu залгаж шалгаад гэрээ байгуулна.</span></li>
        <li><span class="n">2</span><span><b>Зараа оруулна</b>Үнэгүй. Үнэ, тоо, өдрөө өөрөө тавина.</span></li>
        <li><span class="n">3</span><span><b>Захиалга авна</b>Мөнгө тань банкны данс руу шилжинэ.</span></li>
      </ol>
    </main>`);
  card.append(doorFoot());
  const doors = signInDoors({ device: 'Нийлүүлэгчийн дэлгэц', returnTo: '/supplier', onToken: () => boot() });
  card.querySelector('[data-doors]').replaceWith(doors);
  // The demo has no inbox to read a code from; a walkthrough skips straight
  // in — as a seeded supplier's owner, or as whoever the typed number is.
  api('/dev/suppliers')
    .then(({ suppliers }) => {
      const demo = el('<button class="btn" type="button" id="demo">Демо: кодгүй нэвтрэх</button>');
      const group = demoGroup();
      const owners = el('<div class="venues" data-rows></div>');
      for (const s of suppliers.filter((x) => x.phone)) {
        const row = el(`<button class="row" type="button" data-dense><span class="main"><span class="title" data-weight="normal">${esc(s.name)}</span></span><span class="end"><span class="tag mn">${esc(s.phone)}</span></span></button>`);
        row.addEventListener('click', async () => {
          const { token } = await api('/dev/login', { method: 'POST', body: { phone: s.phone, device: 'Нийлүүлэгч' } });
          store.guestToken = token;
          boot();
        });
        owners.append(row);
      }
      group.querySelector('.body').append(owners, demo);
      demo.addEventListener('click', async () => {
        // A number typed is the person who typed it; none typed is somebody
        // new, so a walkthrough reaches the form rather than the seed's own
        // waiting application.
        const typed = doors.querySelector('[name="login"]')?.value.replace(/\s+/g, '') ?? '';
        const fresh = `+97688${String(Date.now() % 1_000_000).padStart(6, '0')}`;
        const { token } = await api('/dev/login', {
          method: 'POST',
          body: { phone: typed || fresh, device: 'Нийлүүлэгчийн дэлгэц' },
        });
        store.guestToken = token;
        boot();
      });
      card.querySelector('#signin').append(group);
    })
    .catch(() => {});
  return card;
}

/** The front door: a person, signed in as themselves. */
function showLanding() {
  if (shell.present) {
    askShell();
    return;
  }
  root.replaceChildren(signInCard());
}

/* ── becoming a supplier ─────────────────────────────────────────── */

/**
 * The form a would-be supplier fills in, once signed in.
 *
 * The phone guests will ring is the account's own when it was made with one.
 * An account made by email, Google or Apple has none, so the form asks for
 * it — and ops rings it before saying yes, which is the proof it is theirs.
 * Ops answers from the desk and the answer arrives here, and by email or
 * message.
 */
async function showApply() {
  root.replaceChildren();
  const person = token();
  if (!person) {
    showLanding();
    return;
  }
  let application;
  let me;
  try {
    [{ application }, me] = await Promise.all([
      api('/v1/supplier/application', { token: person }),
      api('/v1/me', { token: person }),
    ]);
  } catch (error) {
    if (error.status === 401) {
      if (shell.present) return askShell();
      if (store.guestToken === person) store.guestToken = null;
      root.append(signInCard());
      return;
    }
    toast(error.message, 'bad');
    return;
  }
  const needsPhone = !me.phone;
  root.append(application ? statusCard(application, needsPhone) : applyForm(needsPhone));
}

/**
 * A bank account as people write it — the spaces out, the letters up: the
 * IBAN, MN and its 18 digits, or the plain 6–20 digit number. The server's
 * own rule, word for word, so a number the page lets through is one the
 * server takes (and the guest's refund account on /orders keeps it too).
 */
const ACCOUNT = /^(MN\d{18}|\d{6,20})$/;
/** What a number the rule refuses is told, under its field. */
const ACCOUNT_WORDS = 'IBAN бол MN-ээр эхэлсэн 20 тэмдэгт, эсвэл 6–20 оронтой дансны дугаар бичнэ үү.';
/**
 * The bank is picked from Basu's one list (BANK_NAMES, as the refund on
 * /orders picks it), and a bank that is not on it is typed under «Бусад банк».
 * A saved name that is not on the list comes back as «Бусад банк» with the
 * name filled in, so nothing a supplier wrote is lost.
 */
const OTHER_BANK = '__other';
const bankPick = (saved) => (!saved ? '' : BANK_NAMES.includes(saved) ? saved : OTHER_BANK);
const bankOptions = (first) => [['', first], ...BANK_NAMES.map((b) => [b, b]), [OTHER_BANK, 'Бусад банк']];
/** The bank's name a form holds: the one picked, or the one typed under «Бусад банк». */
const bankOf = (picked, typed) => (picked === OTHER_BANK ? String(typed ?? '').trim() : picked);

/**
 * Say under a field what is wrong with it, or clear it. The first refused
 * field takes the focus, so a person is taken to it rather than told about it
 * at the bottom of the screen.
 */
function fieldSays(input, message) {
  const field = input.closest('.field');
  field?.querySelector('.help[data-error]')?.remove();
  if (!message) {
    input.removeAttribute('aria-invalid');
    for (const hint of field?.querySelectorAll('small:not([data-error])') ?? []) hint.hidden = false;
    return;
  }
  input.setAttribute('aria-invalid', 'true');
  // The error stands where the hint was: one line under the field, not two.
  for (const hint of field?.querySelectorAll('small:not([data-error])') ?? []) hint.hidden = true;
  const line = document.createElement('small');
  line.className = 'help';
  line.dataset.error = '';
  line.setAttribute('role', 'alert');
  line.textContent = message;
  field?.append(line);
}

  card.append(doorFoot(true));
  const field = (name) => card.querySelector(`[name="${name}"]`);
  const v = (name) => field(name)?.value.trim() ?? '';
  const problem = card.querySelector('.form-error');
  // Typing into a refused field takes its complaint away; the next press checks again.
  card.addEventListener('input', (e) => {
    if (e.target.matches?.('[aria-invalid]')) fieldSays(e.target, null);
  });
  // «Бусад банк» opens the field for its name; a bank on the list needs none.
  const otherBank = card.querySelector('[data-other-bank]');
  field('bank_name').addEventListener('change', () => {
    const on = field('bank_name').value === OTHER_BANK;

    field('bank_other').disabled = !on;
    if (on) field('bank_other').focus();
    else fieldSays(field('bank_other'), null);
  });

  /** What the server would refuse, said before anything is sent — and in words about the field, not the order. */
  const check = () => {
    const wrong = [];
    const say = (name, message) => {

    say('bank_other', v('bank_name') === OTHER_BANK && !v('bank_other') ? 'Банкныхаа нэрийг бичнэ үү.' : null);
    const account = v('bank_account').replace(/\s+/g, '').toUpperCase();
    say('bank_account', account && !ACCOUNT.test(account) ? ACCOUNT_WORDS : null);
    wrong[0]?.focus();
    return wrong.length === 0;
  };

  const submit = card.querySelector('#submit');
  submit.addEventListener('click', async () => {
    if (submit.hasAttribute('data-busy')) return;
    problem.hidden = true;
    if (!check()) return;
    pressing(submit, true);
    try {
      await api('/v1/supplier/apply', {
        method: 'POST',
        token: token(),
        body: {
          name: v('name'),
          ...(needsPhone ? { phone: v('phone') } : {}),
          tin: v('tin'),
          address: v('address'),
          about: v('about'),
          bank_name: bankOf(v('bank_name'), v('bank_other')),
          bank_account: v('bank_account').replace(/\s+/g, '').toUpperCase(),

      showApply();
    } catch (error) {
      if (error.status === 401) return signOut();
      // Said on the form, over the fields, where the person is looking.
      problem.querySelector('span').textContent = error.message;
      problem.hidden = false;
      // Taken to it — gliding only for whoever has not asked for less motion.
      const still = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
      problem.scrollIntoView?.({ block: 'center', behavior: still ? 'auto' : 'smooth' });
      pressing(submit, false);
    }
  });
  return card;
}

const APPLICATION = {
  applied: ['Хүлээгдэж байна', 'Хариу энд гарч, танд мэдэгдэл очно.'],
  contracted: ['Батлагдлаа', 'Та гэрээт нийлүүлэгч боллоо.'],

};

/**
 * How long Basu's yes usually takes, and who to ask while waiting: in plain
 * words, never a date nobody can promise. The dashboard's waiting card says
 * the same (ops.html, WAIT_WORDS).
 */
const WAIT_WORDS =
  'Шалгалт ихэвчлэн ажлын нэг, хоёр өдөр болдог. Асуух зүйл байвал <a href="mailto:basuappmn@gmail.com">basuappmn@gmail.com</a> хаягаар бичээрэй.';

/**
 * The day of a timestamp in Ulaanbaatar: «10-р сарын 1» in a sentence, «10/1» where it is set as a figure.
 * Never a stamp's first ten characters: those are UTC's day, and before 08:00 here that is yesterday.
 */
const dayOfStamp = (iso) => (iso ? dayLabel(ubParts(iso).day) : '');
const dayFigure = (iso) => (iso ? dayShort(ubParts(iso).day) : '');
