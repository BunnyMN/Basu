<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Нийлүүлэгч — Basu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
/* ── The supplier's own app ─────────────────────────────────────────
   For a person with a knife in one hand and a phone in the other, and for
   the same person at a desk. One typeface, few colours, one big button per
   thing to do. Nothing on this page needs explaining. */
:root{--r:14px;--r-s:10px;--pad:16px;--shadow:0 1px 2px rgba(20,24,27,.05),0 6px 20px rgba(20,24,27,.05)}
html{font-size:16px}
body{background:var(--bg);font-family:"Golos Text",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

/* buttons — sans, big, three kinds */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:"Golos Text",sans-serif;font-size:.95rem;font-weight:600;letter-spacing:0;
  padding:12px 18px;border-radius:var(--r-s);border:1.5px solid var(--line-2);
  background:var(--surface);color:var(--ink);text-transform:none;min-height:46px;
}
.btn:hover{border-color:var(--ink-3)}
.btn[data-v="primary"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[data-v="primary"]:hover{filter:brightness(1.06)}
.btn[data-v="danger"]{background:transparent;border-color:transparent;color:var(--stop);font-weight:600}
.btn[data-v="danger"]:hover{background:var(--stop-soft);border-color:transparent}
.btn[data-size="lg"]{width:100%;padding:14px 18px;font-size:1rem;min-height:50px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--surface-2)}

/* the small things */
.lab{font-family:"Golos Text",sans-serif;font-size:.78rem;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.chip{
  display:inline-flex;align-items:center;font-family:"Golos Text",sans-serif;font-size:.78rem;font-weight:600;letter-spacing:0;
  padding:4px 10px;border-radius:99px;border:none;background:var(--surface-2);color:var(--ink-2);white-space:nowrap;
}
.chip[data-s="PAID"]{background:var(--route-soft);color:var(--route)}
.chip[data-s="PREPARING"]{background:var(--accent-soft);color:var(--accent-ink)}
.chip[data-s="READY"],.chip[data-s="HANDED"],.chip[data-s="CLOSED"],.chip[data-s="paid"]{background:var(--ready-soft);color:var(--ready)}
.chip[data-s="DISPATCHED"]{background:var(--route-soft);color:var(--route)}
.chip[data-s="CANCELLED"],.chip[data-s="REFUNDED"]{background:var(--stop-soft);color:var(--stop)}
.chip[data-s="due"]{background:var(--hold-soft);color:var(--hold)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.empty{text-align:center;padding:34px 20px;color:var(--ink-3);font-size:.95rem;line-height:1.5}
.empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.empty svg{width:36px;height:36px;fill:none;stroke:var(--line-2);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
a.tel{color:var(--accent-ink);font-weight:600;text-decoration:none;white-space:nowrap}

/* fields */
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.84rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;box-sizing:border-box;padding:12px 13px;border:1.5px solid var(--line-2);border-radius:var(--r-s);
  background:var(--surface);color:var(--ink);font-size:1rem;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{min-height:76px;resize:vertical}
.field small{display:block;font-size:.78rem;color:var(--ink-3);margin-top:5px;line-height:1.4}
.check{display:flex;align-items:center;gap:10px;font-size:.95rem;margin-bottom:12px}
.check input{width:20px;height:20px;accent-color:var(--accent)}

/* ── the doors: sign in, pair, apply ── */
.door{max-width:420px;margin:48px auto;padding:0 16px}
.door .card{padding:26px 22px}
.brand{font-weight:800;font-size:1.3rem;letter-spacing:-.03em;color:var(--accent-ink);margin-bottom:14px}
.door h2{font-size:1.35rem;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.door p{color:var(--ink-2);font-size:.95rem;line-height:1.5;margin-bottom:18px}
.door .foot{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.door .links{margin-top:18px;display:flex;flex-direction:column;gap:6px;align-items:center}
.door .links button,.door .links a{background:none;border:none;color:var(--ink-2);font-size:.9rem;font-weight:500;padding:6px;cursor:pointer;text-decoration:none}
.door .links button:hover,.door .links a:hover{color:var(--accent-ink)}
.otp{margin-bottom:12px}
.otp[hidden]{display:none}
.pair input.code{
  width:100%;box-sizing:border-box;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:1.7rem;letter-spacing:.3em;
  padding:14px;border:1.5px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);color:var(--ink);margin-bottom:12px;
}
.demo{margin-top:18px;padding:14px;border-radius:var(--r-s);background:var(--surface-2);border:1px dashed var(--line-2)}
.demo .lab{margin-bottom:8px}
.demo code{font-family:"IBM Plex Mono",monospace;font-size:.88rem;background:var(--surface);padding:2px 6px;border-radius:4px;border:1px solid var(--line)}
.demo .hint{font-size:.82rem;color:var(--ink-2);line-height:1.6}
.venues{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.venues button{
  width:100%;text-align:left;display:flex;align-items:center;gap:10px;font-size:.92rem;font-weight:500;padding:11px 13px;
  border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
}
.venues button:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.venues .tag{margin-left:auto;font-size:.76rem;color:var(--ink-3)}
.venues button[data-watched] .tag{color:var(--ready)}
.status{text-align:center;padding:12px 0 6px}
.status .big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.status .cap{font-size:.92rem;color:var(--ink-2);margin-top:6px;line-height:1.5}
.status[data-s="applied"] .big{color:var(--hold)}
.status[data-s="contracted"] .big{color:var(--ready)}
.status[data-s="declined"] .big{color:var(--stop)}
.code{margin:16px 0;padding:16px;border:1.5px dashed var(--ready-line);border-radius:var(--r-s);text-align:center;color:var(--ink-2);font-size:.9rem}
.code b{display:block;font-family:"IBM Plex Mono",monospace;font-size:2rem;font-weight:600;letter-spacing:.16em;margin-top:4px;color:var(--ink)}

/* ── the app frame ── */
.shell{min-height:100vh;display:flex;flex-direction:column}
.bar{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px var(--pad);
  padding-top:calc(12px + env(safe-area-inset-top));background:color-mix(in srgb,var(--bg) 88%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.bar .brand{font-size:1.05rem;margin:0}
.bar h1{font-size:1rem;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .conn{width:8px;height:8px;border-radius:99px;background:var(--ready);flex:none}
.bar .conn[data-stale]{background:var(--stop)}
.bar .out{font-size:.86rem;font-weight:600;color:var(--ink-2);background:none;border:none;padding:6px 4px}
.view{flex:1;min-width:0;padding:16px var(--pad) calc(90px + env(safe-area-inset-bottom));max-width:980px;width:100%;box-sizing:border-box;margin:0 auto}
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;
  padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line);
}
.tabs button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--ink-3);
  background:none;border:none;padding:6px 2px;border-radius:var(--r-s);
}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[data-on]{color:var(--accent-ink)}
.tabs .side{display:none}
@media(min-width:900px){
  .shell{display:grid;grid-template-columns:232px 1fr;grid-template-rows:1fr;min-height:100vh}
  .bar{display:none}
  .tabs{
    position:sticky;top:0;bottom:auto;height:100vh;flex-direction:column;justify-content:flex-start;gap:2px;
    padding:22px 14px;border-top:none;border-right:1px solid var(--line);box-sizing:border-box;
  }
  .tabs .side{display:block;padding:0 10px 18px}
  .tabs .side .brand{margin-bottom:4px}
  .tabs .side h1{font-size:.92rem;font-weight:600;color:var(--ink-2);line-height:1.35;overflow-wrap:anywhere}
  .tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:.98rem;padding:11px 12px;color:var(--ink-2)}
  .tabs button[data-on]{background:var(--accent-soft);color:var(--accent-ink)}
  .tabs .out{margin-top:auto;font-size:.9rem;font-weight:600;color:var(--ink-3);background:none;border:none;padding:10px 12px;text-align:left;border-radius:var(--r-s);display:block}
  .tabs .out:hover{background:var(--surface-2);color:var(--ink)}
  .view{padding:30px 32px 40px}
}

/* ── page heads ── */
.head{margin-bottom:16px}
.head h2{font-size:1.45rem;font-weight:800;letter-spacing:-.025em;line-height:1.2}
.head p{color:var(--ink-3);font-size:.92rem;margin-top:4px}
.sec{font-size:.8rem;font-weight:700;color:var(--ink-3);letter-spacing:.02em;text-transform:uppercase;margin:22px 0 10px}

/* ── today ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat{padding:14px 14px 12px}
.stat b{display:block;font-size:1.55rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat b.money{color:var(--accent-ink)}
.stat span{display:block;font-size:.8rem;color:var(--ink-3);margin-top:3px;line-height:1.35}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.stat:first-child{grid-column:1 / -1}}
.group{margin-top:18px}
.group h3{font-size:1rem;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.group h3 .n{font-size:.78rem;font-weight:700;color:var(--ink-3);background:var(--surface-2);border-radius:99px;padding:2px 8px}
.stack{display:grid;gap:10px}
@media(min-width:720px){.stack{grid-template-columns:1fr 1fr}}
.ticket{padding:14px 16px 12px;border-left:4px solid var(--line-2);position:relative}
.ticket[data-lane="paid"]{border-left-color:var(--route)}
.ticket[data-lane="preparing"]{border-left-color:var(--accent)}
.ticket[data-lane="ready"]{border-left-color:var(--ready)}
.ticket[data-lane="dispatched"]{border-left-color:var(--route)}
.ticket .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ticket .id{font-family:"IBM Plex Mono",monospace;font-size:.86rem;font-weight:600;color:var(--ink-2)}
.ticket .day{margin-left:auto}
.ticket .what{font-size:1.08rem;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.ticket .who{font-size:.92rem;color:var(--ink-2);margin-top:4px;line-height:1.5}
.ticket .where{font-size:.9rem;color:var(--ink-2);margin-top:2px;line-height:1.5}
.ticket .pay{font-size:.86rem;color:var(--ready);font-weight:600;margin-top:6px}
.ticket .grace{font-size:.84rem;color:var(--hold);margin-top:6px;line-height:1.45}
.ticket .btns{display:flex;align-items:center;gap:8px;margin-top:12px}
.ticket .btns .btn[data-v="primary"]{flex:1}
.ticket .btns .btn[data-v="danger"]{flex:none;padding:12px 10px}
.reasons{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.reasons .q{font-size:1rem;font-weight:700;margin-bottom:6px}
.reasons label{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;padding:8px 0;cursor:pointer;line-height:1.4}
.reasons label input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}
.reasons .money{font-size:.9rem;color:var(--ink-2);margin:6px 0 10px;line-height:1.5;min-height:1.5em}
.reasons .money b{color:var(--stop)}
.reasons .btns{display:flex;gap:8px;margin-top:4px}
.reasons .btns .btn{flex:1}
.reasons .btns .btn[data-a="confirm"]{background:var(--stop);border-color:var(--stop);color:#fff}
.reasons .btns .btn[data-a="confirm"][disabled]{background:var(--stop-soft);border-color:var(--stop-soft);color:var(--stop)}

/* ── orders ── */
.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.tools input{width:100%;box-sizing:border-box;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:var(--r-s);background:var(--surface);font-size:1rem}
.tools input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r-s);padding:3px}
.seg button{flex:1;font-size:.88rem;font-weight:600;padding:8px;border:none;border-radius:8px;background:none;color:var(--ink-3)}
.seg button[data-on]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.list{display:grid;gap:8px}
.list .order{
  display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;text-align:left;
  padding:13px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:inherit;box-shadow:var(--shadow);
}
.list .order:hover{border-color:var(--ink-3)}
.list .order .t{font-size:1rem;font-weight:700;line-height:1.3}
.list .order .s{font-size:.86rem;color:var(--ink-2);line-height:1.45}
.list .order .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.list .order .amt{font-size:.92rem;font-weight:700}
.back{background:none;border:none;color:var(--accent-ink);font-size:.95rem;font-weight:600;padding:0 0 12px;display:inline-flex;align-items:center;gap:4px}
.order-page .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.story{list-style:none;padding:0;margin:0 0 0 8px;border-left:2px solid var(--line)}
.story li{position:relative;padding:2px 0 14px 18px;font-size:.95rem}
.story li::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:99px;background:var(--ready);border:2px solid var(--bg)}
.story b{font-weight:700}
.story small{display:block;font-size:.82rem;color:var(--ink-3);margin-top:1px}

/* ── the stall ── */
.stall .rows{display:grid;gap:8px}
.stall .row{padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.stall .row[data-off]{opacity:.55}
.stall .row .name{font-size:1rem;font-weight:700;line-height:1.3;grid-column:1 / -1}
.stall .row .name small{display:block;font-size:.86rem;color:var(--ink-2);font-weight:400;margin-top:3px;line-height:1.45}
.stall .row .nums{display:flex;gap:18px}
.stall .row .num{font-size:1rem;font-weight:700}
.stall .row .num small{display:block;font-size:.76rem;color:var(--ink-3);font-weight:500}
.stall .row .btns{display:flex;gap:8px;justify-content:flex-end}
.stall .row .btns .btn{padding:9px 14px;min-height:40px;font-size:.9rem}
.stall .row label.num input{width:120px;padding:9px 10px;border:1.5px solid var(--line-2);border-radius:8px;font-size:.95rem}
.stall .row[data-editing]{grid-template-columns:1fr}
.stall .row[data-editing] .nums{flex-wrap:wrap}
.new{padding:18px 16px;margin-top:22px}
.new h3{font-size:1.1rem;font-weight:800;margin-bottom:12px}
.new .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.new .grid .wide{grid-column:1 / -1}
@media(max-width:520px){.new .grid{grid-template-columns:1fr}}
.new .foot{display:flex;justify-content:flex-end;margin-top:4px}

/* ── the money ── */
.money-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.terms{padding:14px 16px;font-size:.9rem;color:var(--ink-2);line-height:1.55;margin-bottom:6px}
.terms b{color:var(--ink)}
.line{padding:13px 16px;display:flex;align-items:center;gap:12px}
.line .name{flex:1;min-width:0;font-weight:600}
.line .name small{display:block;font-size:.84rem;color:var(--ink-3);font-weight:400;margin-top:2px}
.line .amt{font-weight:700;white-space:nowrap}
.line .amt.paid{color:var(--ready)}

/* profile */
.profile{padding:18px 16px;max-width:640px}
.new{max-width:720px}
.profile .hint{font-size:.9rem;color:var(--ink-2);line-height:1.55;margin-bottom:16px;padding:12px 14px;background:var(--surface-2);border-radius:var(--r-s)}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { api, store, toast, mnt, KIND, dayLabel } from '/api.js';

const root = document.getElementById('root');
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
const esc = (value) => {
  const node = document.createElement('span');
  node.textContent = value ?? '';
  return node.innerHTML;
};

/**
 * Which stall this screen is showing.
 *
 * A real screen is paired to one supplier and sees that one — the token says
 * so and the API enforces it. A walkthrough moves between four suppliers, so
 * the demo can watch every one at once, read-only on the stall.
 */
const ALL = 'all-suppliers';
const watchingAll = () => store.supplierToken === ALL;
/** A paired screen's token, or the owner's own sign-in: the API takes either. */
const token = () => store.supplierToken || store.guestToken;
/** Which way we came in: a screen paired by code, or a person by phone. */
const mode = () => (store.supplierToken ? 'device' : 'owner');

function signOut() {
  store.supplierToken = null;
  if (mode() === 'owner') store.guestToken = null;
  boot();
}

const ICON = {
  today: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8 3v4M16 3v4M8 14h3"/></svg>',
  orders: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h4"/></svg>',
  stall: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1.5-4h13L20 9"/><path d="M4 9c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3"/><path d="M6 12v8h12v-8M10 20v-5h4v5"/></svg>',
  money: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M15.5 15h2"/></svg>',
  profile: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-3.5 3.6-5 7-5s6 1.5 7 5"/></svg>',
  box: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>',
};

/* ── the doors ─────────────────────────────────────────────────────── */

/** Phone and a one-time code, the way the app signs in. No password. */
function signInCard() {
  const card = el(`
    <div class="door">
      <div class="card" id="signin">
        <div class="brand">Basu</div>
        <h2>Нийлүүлэгчийн хэсэг</h2>
        <p>Гэрээний утасны дугаараараа нэвтэрнэ үү. Дугаар руу тань нэг удаагийн код очно.</p>
        <label class="field"><span>Утасны дугаар</span><input name="phone" inputmode="tel" placeholder="+976 XXXX XXXX" autocomplete="tel"></label>
        <div class="otp" hidden><label class="field"><span>Ирсэн код</span><input name="code" inputmode="numeric" maxlength="6" placeholder="6 оронтой код" autocomplete="one-time-code"></label></div>
        <div class="foot">
          <button class="btn" data-v="primary" data-size="lg" type="button" id="send">Код авах</button>
        </div>
        <div class="links">
          <span style="font-size:.86rem;color:var(--ink-3)">Шинээр нийлүүлэгч болох бол мөн утсаараа нэвтэрнэ.</span>
          <button type="button" id="back">Таблет дээр кодоор холбох ›</button>
        </div>
      </div>
    </div>`);
  const phone = card.querySelector('[name="phone"]');
  const code = card.querySelector('[name="code"]');
  const send = card.querySelector('#send');
  let asked = false;
  send.addEventListener('click', async () => {
    try {
      if (!asked) {
        await api('/v1/auth/otp', { method: 'POST', body: { phone: phone.value.replace(/\s+/g, '') } });
        asked = true;
        card.querySelector('.otp').hidden = false;
        send.textContent = 'Нэвтрэх';
        code.focus();
        toast('Код илгээгдлээ.');
        return;
      }
      const { token } = await api('/v1/auth/verify', {
        method: 'POST',
        body: { phone: phone.value.replace(/\s+/g, ''), code: code.value.trim(), device: 'Нийлүүлэгчийн дэлгэц' },
      });
      store.guestToken = token;
      boot();
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  code.addEventListener('keydown', (e) => e.key === 'Enter' && send.click());
  phone.addEventListener('keydown', (e) => e.key === 'Enter' && send.click());
  // The demo has no SMS to read a code from; a walkthrough skips straight in.
  api('/dev/clock')
    .then(() => {
      const demo = el('<button class="btn" type="button" id="demo">Демо: кодгүй нэвтрэх</button>');
      demo.addEventListener('click', async () => {
        // A number typed is the person who typed it; none typed is somebody
        // new, so a walkthrough reaches the form rather than the seed's own
        // waiting application.
        const fresh = `+97688${String(Date.now() % 1_000_000).padStart(6, '0')}`;
        const { token } = await api('/dev/login', {
          method: 'POST',
          body: { phone: phone.value.replace(/\s+/g, '') || fresh, device: 'Нийлүүлэгчийн дэлгэц' },
        });
        store.guestToken = token;
        boot();
      });
      card.querySelector('.foot').append(demo);
    })
    .catch(() => {});
  card.querySelector('#back').addEventListener('click', showPairing);
  return card;
}

/** The front door: a phone first, a pairing code for a tablet behind it. */

/** A tablet on the counter: paired once with an eight-digit code from Basu. */
async function showPairing() {
  const [{ devices }, { suppliers }] = await Promise.all([
    api('/dev/supplier-codes').catch(() => ({ devices: [] })),
    api('/dev/suppliers').catch(() => ({ suppliers: [] })),
  ]);
  root.replaceChildren();

  const card = el(`
    <div class="door pair">
      <div class="card">
        <div class="brand">Basu</div>
        <h2>Дэлгэцээ холбоно уу</h2>
        <p>Basu-гаас авсан 8 оронтой кодоо оруулна уу. Нэг удаа холбоход хангалттай.</p>
        <input class="code" inputmode="numeric" maxlength="8" placeholder="········" aria-label="Холбох код">
        <button class="btn" data-v="primary" data-size="lg" type="button">Холбох</button>
        <div class="links"><a id="become">‹ Утсаараа нэвтрэх</a></div>
      </div>
    </div>`);

  const input = card.querySelector('input');
  const submit = async () => {
    try {
      const { token } = await api('/v1/supplier/pair', {
        method: 'POST',
        body: { pairing_code: input.value.trim() },
      });
      store.supplierToken = token;
      boot();
    } catch (error) {
      toast(error.message, 'bad');
      input.select();
    }
  };
  card.querySelector('button').addEventListener('click', submit);
  input.addEventListener('keydown', (e) => e.key === 'Enter' && submit());
  card.querySelector('#become').addEventListener('click', () => showLanding());

  if (devices.length || suppliers.length) {
    const demo = el('<div class="demo"><div class="lab">Демо горим</div></div>');
    if (devices.length) {
      input.value = devices[0].code;
      const hint = el('<div class="hint">Холбоогүй нийлүүлэгчийн кодууд:<br></div>');
      for (const device of devices) hint.append(el(`<span><code>${device.code}</code> ${esc(device.name)}<br></span>`));
      demo.append(hint);
    }
    if (suppliers.length) {
      const list = el('<div class="venues"></div>');
      const all = el(`<button type="button" data-watched>Бүх нийлүүлэгч<span class="tag">${suppliers.length}</span></button>`);
      all.addEventListener('click', () => {
        store.supplierToken = ALL;
        boot();
      });
      list.append(all);
      for (const s of suppliers) {
        const button = el(`
          <button type="button"${s.watched ? ' data-watched' : ''}>
            ${esc(s.name)}
            <span class="tag">${s.watched ? 'холбогдсон' : 'холбогдоогүй'}</span>
          </button>`);
        button.addEventListener('click', async () => {
          try {
            const { token } = await api('/dev/supplier-token', { method: 'POST', body: { supplier_id: s.id } });
            store.supplierToken = token;
            boot();
          } catch (error) {
            toast(error.message, 'bad');
          }
        });
        list.append(button);
      }
      demo.append(list);
    }
    card.querySelector('.card').append(demo);
  }

  root.append(card);
  input.focus();
}

/* ── becoming a supplier ─────────────────────────────────────────── */

/**
 * The form a would-be supplier fills in, behind a phone they have proved.
 *
 * The phone is not a field: it is the number they sign in with, by OTP, and
 * that is the only proof anybody has that it is theirs. What they type is who
 * they are and where a guest collects. Ops answers from the ops page and the
 * answer arrives here — and by SMS, with the code, when it is yes.
 */
async function showApply() {
  root.replaceChildren();
  if (!store.guestToken) {
    root.append(signInCard());
    return;
  }
  let application;
  try {
    ({ application } = await api('/v1/supplier/application', { token: store.guestToken }));
  } catch (error) {
    if (error.status === 401) {
      store.guestToken = null;
      root.append(signInCard());
      return;
    }
    toast(error.message, 'bad');
    return;
  }
  root.append(application ? statusCard(application) : applyForm());
}

/* ── today's work ────────────────────────────────────────────────── */

/** Set by whichever view holds tickets besides the board, to redraw after an action. */
let onActed = null;

/** What each group of work is called, and what the one button on it does. */
const LANES = [
  { key: 'paid', title: 'Бэлтгэж эхлэх' },
  { key: 'preparing', title: 'Бэлэн болгох' },
  { key: 'ready', title: 'Өгөх, хүргэх' },
  { key: 'dispatched', title: 'Замд яваа' },
];

let today = null;

/**
 * The work, as a list rather than a board: one group per thing to do next,
 * empty groups not drawn. A person sees what is theirs today and taps one
 * button per order.
 */
function renderBoard(data) {
  today = data.today;
  const board = document.getElementById('board');
  if (!board) return;
  for (const n of document.querySelectorAll('#supplier')) {
    n.textContent = watchingAll() ? 'Бүх нийлүүлэгч' : (data.supplier?.name ?? 'Нийлүүлэгч');
  }
  const conn = document.getElementById('conn');
  if (conn) delete conn.dataset.stale;

  const scroll = window.scrollY;
  board.replaceChildren();
  let any = 0;
  for (const lane of LANES) {
    const tickets = data.lanes[lane.key] ?? [];
    if (!tickets.length) continue;
    any += tickets.length;
    const group = el(`<section class="group lane"><h3>${lane.title}<span class="n">${tickets.length}</span></h3><div class="stack"></div></section>`);
    const stack = group.querySelector('.stack');
    for (const ticket of tickets) stack.append(renderTicket(ticket, lane.key));
    board.append(group);
  }
  if (!any) {
    board.append(el(`<div class="card empty">${ICON.check}<b>Одоогоор хийх ажил алга</b>Шинэ захиалга ирэхэд танд мессеж ирнэ.</div>`));
  }
  board.dataset.ready = '1';
  window.scrollTo(0, scroll);
}

/** One order as a card: what, for whom, where, what you get — and one button. */
function renderTicket(ticket, lane) {
  const delivery = ticket.receive === 'delivery';
  const dueToday = ticket.receive_on <= today && lane !== 'paid';
  const node = el(`
    <article class="card ticket" data-lane="${lane}"${dueToday ? ' data-due' : ''}>
      <div class="top">
        <span class="id">№${ticket.code}</span>
        ${watchingAll() ? `<span class="chip">${esc(ticket.supplier.name)}</span>` : ''}
        <span class="chip day" data-s="${dueToday ? 'due' : ''}">${dueToday ? 'Өнөөдөр' : dayLabel(ticket.receive_on)}</span>
      </div>
      <div class="what">${esc(ticket.title)} ×${ticket.qty}${ticket.unit === 'kg' ? ' кг' : ''}</div>
      <div class="who">${ticket.guest ? esc(ticket.guest) : 'Зочин'}${
        ticket.guest_phone ? ` · <a class="tel" href="tel:${esc(ticket.guest_phone)}">${esc(ticket.guest_phone)}</a>` : ''
      } · ${mnt(ticket.total_mnt)}</div>
      <div class="where">${
        delivery
          ? `Хүргэлт: ${esc(ticket.address)}${ticket.address_phone ? ` · <a class="tel" href="tel:${esc(ticket.address_phone)}">${esc(ticket.address_phone)}</a>` : ''}`
          : 'Өөрөө ирж авна'
      }</div>
      ${typeof ticket.payout_mnt === 'number' ? `<div class="pay">Танд очих ${mnt(ticket.payout_mnt)}</div>` : ''}
      ${
        lane === 'ready' && !delivery && ticket.no_show_from
          ? `<div class="grace">${
              new Date(ticket.no_show_from) <= new Date()
                ? 'Зочин ирсэнгүй бол «зочин ирээгүй» гэж цуцалж болно.'
                : `Ирэхгүй бол ${dayLabel(ticket.no_show_from.slice(0, 10))}-нөөс «зочин ирээгүй» гэж цуцалж болно.`
            }</div>`
          : ''
      }
      <div class="btns"></div>
    </article>`);

  const buttons = node.querySelector('.btns');
  const send = async (action, body, button) => {
    if (button) button.disabled = true;
    try {
      await api(
        watchingAll()
          ? `/dev/supplier/orders/${ticket.id}/${action}`
          : `/v1/supplier/orders/${ticket.id}/${action}`,
        { method: 'POST', token: watchingAll() ? undefined : token(), body },
      );
      await refreshBoard();
      await onActed?.();
    } catch (error) {
      if (error.status === 401 && !watchingAll()) {
        signOut();
        return;
      }
      toast(error.message, 'bad');
      if (button) button.disabled = false;
    }
  };
  const add = (label, action, variant) => {
    const button = el(`<button class="btn" type="button"${variant ? ` data-v="${variant}"` : ''}>${label}</button>`);
    button.addEventListener('click', () => send(action, {}, button));
    buttons.append(button);
  };

  /**
   * Cancelling asks why, because the reason decides the money — the
   * supplier picks from what can be true of this order, sees what the guest
   * gets back and what stays, and only then confirms.
   */
  const cancelWith = (reasons) => {
    const button = el('<button class="btn" type="button" data-v="danger" data-a="cancel">Цуцлах</button>');
    button.addEventListener('click', () => {
      const slaughtered = lane !== 'paid';
      const meat = ticket.total_mnt - (delivery ? ticket.delivery_fee_mnt ?? 0 : 0);
      const box = el(`
        <div class="reasons">
          <div class="q">Яагаад цуцлах вэ?</div>
          ${reasons
            .map((r) => `<label><input type="radio" name="reason-${ticket.id}" value="${r}"><span>${REASON[r]}</span></label>`)
            .join('')}
          <div class="money"></div>
          <div class="btns">
            <button class="btn" type="button" data-a="keep">Болих</button>
            <button class="btn" type="button" data-a="confirm" disabled>Цуцлах</button>
          </div>
        </div>`);
      const money = box.querySelector('.money');
      const confirm = box.querySelector('[data-a="confirm"]');
      box.addEventListener('change', () => {
        const reason = box.querySelector('input:checked')?.value;
        if (!reason) return;
        const forfeit = slaughtered && !SUPPLIER_FAULT.includes(reason) ? Math.round((meat * FORFEIT_PCT) / 100) : 0;
        money.innerHTML = forfeit
          ? `Зочинд ${mnt(ticket.total_mnt - forfeit)} буцна, <b>${mnt(forfeit)}</b> (${FORFEIT_PCT}%) танд үлдэнэ.`
          : `Зочинд ${mnt(ticket.total_mnt)} бүтнээр буцна.`;
        confirm.disabled = false;
      });
      confirm.addEventListener('click', () => {
        const reason = box.querySelector('input:checked')?.value;
        if (reason) send('cancel', { reason }, confirm);
      });
      box.querySelector('[data-a="keep"]').addEventListener('click', () => {
        box.remove();
        buttons.style.display = '';
      });
      // The row's own buttons step aside while the question is open — by
      // style, because the class sets display and would outrank `hidden`.
      buttons.style.display = 'none';
      node.append(box);
    });
    buttons.append(button);
  };

  if (lane === 'paid') {
    add('Бэлтгэж эхлэх', 'prepare', 'primary');
    cancelWith(['guest_asked', 'cannot_fulfil', 'vet']);
  } else if (lane === 'preparing') {
    add('Бэлэн боллоо', 'ready', 'primary');
    cancelWith(['guest_asked', 'vet', 'cannot_fulfil']);
  } else if (lane === 'ready') {
    if (delivery) add('Замд гаргах', 'dispatch', 'primary');
    else add('Хүлээлгэн өгсөн', 'hand', 'primary');
    cancelWith(delivery ? ['guest_asked', 'unreachable', 'vet', 'cannot_fulfil'] : ['guest_asked', 'no_show', 'vet', 'cannot_fulfil']);
  } else if (lane === 'dispatched') {
    add('Хүлээлгэн өгсөн', 'hand', 'primary');
    cancelWith(['unreachable', 'guest_asked', 'cannot_fulfil']);
  }
  return node;
}

/** The words for a reason, and which reasons are the supplier's own fault. */
const REASON = {
  guest_asked: 'Зочин хүссэн — утсаар ярьж тохирсон',
  vet: 'Мал эмнэлгийн шалгалт унасан',
  cannot_fulfil: 'Биелүүлж чадахгүй боллоо',
  no_show: 'Зочин ирээгүй — өдрөөс 3 хоног өнгөрсөн',
  unreachable: 'Хаяг дээр холбогдож чадсангүй',
};
const SUPPLIER_FAULT = ['vet', 'cannot_fulfil'];
const FORFEIT_PCT = 10;

async function refreshBoard() {
  try {
    const data = watchingAll()
      ? await api('/dev/supplier/board')
      : await api('/v1/supplier/board', { token: token() });
    renderBoard(data);
  } catch (error) {
    if (error.status === 401 && !watchingAll()) {
      signOut();
      return;
    }
    const conn = document.getElementById('conn');
    if (conn) conn.dataset.stale = '1';
  }
}

/* ── the stall ───────────────────────────────────────────────────── */

/**
 * The supplier's own listings, edited here and nowhere else. Twenty sheep
 * becoming fifteen sold is a fact only they know; ops does not edit numbers
 * on a phone. Drawn separately from the board so a poll never wipes a form
 * somebody is typing into.
 */
function renderStall(listings) {
  const stall = document.getElementById('stall');
  if (!stall) return;
  stall.replaceChildren(el('<div class="head"><h2>Миний зар</h2><p>Зочид эндээс л захиална. Үнэ, тоо, өдрөө өөрөө засна.</p></div>'));

  const rows = el('<div class="rows"></div>');
  if (!listings.length) rows.append(el(`<div class="card empty">${ICON.box}<b>Зар алга</b>Доор эхний зараа нэмнэ үү.</div>`));
  for (const l of listings) rows.append(renderRow(l));
  stall.append(rows);
  stall.append(newForm());
}

function renderRow(l) {
  const row = el(`
    <div class="card row"${l.active ? '' : ' data-off'} data-listing="${l.id}">
      <div class="name">${esc(l.title)}${l.active ? '' : ' <span class="chip">зогссон</span>'}<small>${KIND[l.kind]} · ${l.unit === 'whole' ? `бүтэн, ~${l.approx_kg} кг` : `кг-аар, доод ${l.min_qty} кг`} · ${esc(l.origin)} · ${dayLabel(l.ready_from)}-нөөс${l.delivers ? ` · хүргэлт ${mnt(l.delivery_fee_mnt)}` : ''}</small></div>
      <div class="nums">
        <div class="num">${mnt(l.price_mnt)}<small>үнэ</small></div>
        <div class="num">${l.sold} / ${l.quantity}<small>зарагдсан</small></div>
      </div>
      <div class="btns">
        <button class="btn" type="button" data-a="edit">Засах</button>
        <button class="btn quiet" type="button" data-a="toggle">${l.active ? 'Зогсоох' : 'Идэвхжүүлэх'}</button>
      </div>
    </div>`);

  const patch = async (body) => {
    try {
      const { listing } = await api(`/v1/supplier/listings/${l.id}`, { method: 'PATCH', token: token(), body });
      row.replaceWith(renderRow(listing));
    } catch (error) {
      toast(error.message, 'bad');
    }
  };

  row.querySelector('[data-a="toggle"]').addEventListener('click', () => patch({ active: !l.active }));
  row.querySelector('[data-a="edit"]').addEventListener('click', () => {
    const form = el(`
      <div class="card row" data-editing>
        <div class="name">${esc(l.title)}</div>
        <div class="nums">
          <label class="num"><small>Үнэ, ₮</small><input type="number" name="price" value="${l.price_mnt}" min="1"></label>
          <label class="num"><small>Нийт тоо</small><input type="number" name="quantity" value="${l.quantity}" min="${l.sold}"></label>
          <label class="num"><small>Бэлэн болох</small><input type="date" name="ready" value="${l.ready_from}"></label>
        </div>
        <div class="btns">
          <button class="btn quiet" type="button" data-a="back">Болих</button>
          <button class="btn" data-v="primary" type="button" data-a="save">Хадгалах</button>
        </div>
      </div>`);
    form.querySelector('[data-a="back"]').addEventListener('click', () => form.replaceWith(renderRow(l)));
    form.querySelector('[data-a="save"]').addEventListener('click', async () => {
      const body = {
        price_mnt: Number(form.querySelector('[name="price"]').value),
        quantity: Number(form.querySelector('[name="quantity"]').value),
        ready_from: form.querySelector('[name="ready"]').value,
      };
      try {
        const { listing } = await api(`/v1/supplier/listings/${l.id}`, { method: 'PATCH', token: token(), body });
        form.replaceWith(renderRow(listing));
        toast('Хадгалагдлаа');
      } catch (error) {
        toast(error.message, 'bad');
      }
    });
    row.replaceWith(form);
  });
  return row;
}

function newForm() {
  const plusWeek = (() => {
    const d = new Date(`${today ?? new Date().toISOString().slice(0, 10)}T12:00:00+08:00`);
    d.setUTCDate(d.getUTCDate() + 7);
    return d.toISOString().slice(0, 10);
  })();
  const form = el(`
    <div class="card new">
      <h3>Шинэ зар нэмэх</h3>
      <div class="grid">
        <label class="field"><span>Мал</span><select name="kind">${Object.entries(KIND).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
        <label class="field"><span>Нэгж</span><select name="unit"><option value="whole">Бүтэн мал</option><option value="kg">Кг-аар</option></select></label>
        <label class="field wide"><span>Гарчиг</span><input name="title" placeholder="Хонь, залуу ирэг"></label>
        <label class="field"><span>Үнэ, ₮ (толгой эсвэл кг)</span><input name="price_mnt" type="number" min="1" placeholder="460000"></label>
        <label class="field" data-for="whole"><span>Ойролцоо жин, кг</span><input name="approx_kg" type="number" min="1" placeholder="38"></label>
        <label class="field" data-for="kg" hidden><span>Доод захиалга, кг</span><input name="min_qty" type="number" min="1" placeholder="10"></label>
        <label class="field"><span>Хэдэн толгой эсвэл кг</span><input name="quantity" type="number" min="0" placeholder="20"></label>
        <label class="field wide"><span>Гарал</span><input name="origin" placeholder="Архангай, Их тамир"></label>
        <label class="field"><span>Бэлэн болох өдөр</span><input name="ready_from" type="date" value="${plusWeek}"></label>
        <label class="field"><span>Хүргэлтийн төлбөр, ₮</span><input name="delivery_fee_mnt" type="number" min="0" value="0"></label>
        <label class="check wide"><input name="delivers" type="checkbox" checked>Хүргэлт хийнэ</label>
        <label class="field wide"><span>Тайлбар</span><textarea name="note" placeholder="Толгой, дотор мөнтэйгээ…"></textarea></label>
      </div>
      <div class="foot"><button class="btn" data-v="primary" type="button" id="add">Зар нэмэх</button></div>
    </div>`);

  const unit = form.querySelector('[name="unit"]');
  const sync = () => {
    form.querySelector('[data-for="whole"]').hidden = unit.value !== 'whole';
    form.querySelector('[data-for="kg"]').hidden = unit.value !== 'kg';
  };
  unit.addEventListener('change', sync);
  sync();

  form.querySelector('#add').addEventListener('click', async () => {
    const v = (name) => form.querySelector(`[name="${name}"]`).value;
    const body = {
      kind: v('kind'),
      unit: v('unit'),
      title: v('title'),
      price_mnt: Number(v('price_mnt')),
      quantity: Number(v('quantity')),
      origin: v('origin'),
      ready_from: v('ready_from'),
      delivers: form.querySelector('[name="delivers"]').checked,
      delivery_fee_mnt: Number(v('delivery_fee_mnt') || 0),
      note: v('note'),
    };
    if (body.unit === 'whole') body.approx_kg = Number(v('approx_kg'));
    else body.min_qty = Number(v('min_qty') || 1);
    try {
      await api('/v1/supplier/listings', { method: 'POST', token: token(), body });
      toast('Зар нэмэгдлээ');
      const { listings } = await api('/v1/supplier/listings', { token: token() });
      renderStall(listings);
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  return form;
}

/* ── the money ───────────────────────────────────────────────────── */

/**
 * What the supplier is owed and what has been sent: one line per order,
 * with the rate and the account the contract names. The list is ops's to
 * act on; here it is the supplier's to check.
 */
async function renderMoney() {
  const box = document.getElementById('money');
  if (!box) return;
  let data;
  try {
    data = await api('/v1/supplier/money', { token: token() });
  } catch {
    box.replaceChildren(el('<div class="card empty">Тооцоо ачаалж чадсангүй.</div>'));
    return;
  }
  const due = data.settlements.filter((t) => t.state !== 'paid');
  const owed = due.reduce((sum, t) => sum + t.amount_mnt, 0);
  const paid = data.settlements.filter((t) => t.state === 'paid').reduce((sum, t) => sum + t.amount_mnt, 0);
  box.replaceChildren(
    el(`<div class="money-sum">
          <div class="card stat"><b class="money">${mnt(owed)}</b><span>Basu шилжүүлэх ёстой</span></div>
          <div class="card stat"><b>${mnt(paid)}</b><span>Шилжүүлсэн, нийт</span></div>
        </div>`),
    el(`<div class="card terms">Шимтгэл <b>${data.commission_pct ?? '—'}%</b> — махны үнээс, хүргэлтийн төлбөрөөс авахгүй. Олголт хүлээлгэн өгснөөс хойш нэг хоногт үүсч, Basu ажлын өдөрт шилжүүлнэ.<br>Данс: ${
      data.bank_account ? `<b>${esc(data.bank_name)} ${esc(data.bank_account)}</b> · ${esc(data.bank_holder)}` : '<b>бүртгэгдээгүй</b> — Профайл хэсэгт оруулна уу'
    }</div>`),
  );
  if (!data.settlements.length) {
    box.append(el(`<div class="card empty">${ICON.money}<b>Одоогоор тооцоо алга</b>Хүлээлгэн өгсөн захиалга бүр энд гарна.</div>`));
    return;
  }
  const list = el('<div class="list"></div>');
  for (const t of data.settlements) {
    list.append(
      el(`<div class="card line" data-settlement="${t.id}">
            <div class="name">№${esc(t.order_code)} · ${esc(t.memo)}<small>${
              t.state === 'paid' ? `Шилжүүлсэн ${when(t.paid_at)}${t.reference ? ` · ${esc(t.reference)}` : ''}` : `Үүссэн ${when(t.created_at)} · шилжүүлэгдээгүй`
            }</small></div>
            <span class="amt${t.state === 'paid' ? ' paid' : ''}">${mnt(t.amount_mnt)}</span>
          </div>`),
    );
  }
  box.append(list);
}

/** «9/8 14:05» for a timestamp the supplier reads across a list. */
function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

/* ── the module ──────────────────────────────────────────────────── */

const TABS = [
  { key: 'today', label: 'Өнөөдөр', icon: ICON.today },
  { key: 'orders', label: 'Захиалга', icon: ICON.orders },
  { key: 'stall', label: 'Зар', icon: ICON.stall },
  { key: 'money', label: 'Мөнгө', icon: ICON.money },
  { key: 'profile', label: 'Профайл', icon: ICON.profile },
];
let tab = 'today';

/**
 * The supplier's own app: five tabs along the bottom of a phone, a sidebar
 * on a computer, the same page in both. A demo watching every supplier at
 * once gets only today's work — the rest is one supplier's own.
 */
function openModule() {
  const all = watchingAll();
  const tabs = all ? TABS.slice(0, 1) : TABS;
  const frame = el(`
    <div class="shell">
      <header class="bar">
        <span class="brand">Basu</span>
        <h1 id="supplier">${all ? 'Бүх нийлүүлэгч' : '…'}</h1>
        <span class="conn" id="conn" title="Холбогдсон"></span>
        <button class="out" type="button" id="out">${all ? 'Солих' : 'Гарах'}</button>
      </header>
      <nav class="tabs" aria-label="Хэсгүүд">
        <div class="side"><div class="brand">Basu</div><h1 id="supplier">${all ? 'Бүх нийлүүлэгч' : '…'}</h1></div>
        ${tabs.map((t) => `<button type="button" data-tab="${t.key}">${t.icon}<span>${t.label}</span></button>`).join('')}
        <button class="out side" type="button" id="out-side">${all ? 'Солих' : 'Гарах'}</button>
      </nav>
      <main class="view" id="view"></main>
    </div>`);
  const leave = () => (all ? ((store.supplierToken = null), boot()) : signOut());
  frame.querySelector('#out').addEventListener('click', leave);
  frame.querySelector('#out-side').addEventListener('click', leave);
  frame.querySelector('.tabs').addEventListener('click', (e) => {
    const button = e.target.closest('button[data-tab]');
    if (button) show(button.dataset.tab);
  });
  root.replaceChildren(frame);
  show(all ? 'today' : tab);
}

function show(key) {
  tab = key;
  onActed = null;
  for (const b of document.querySelectorAll('.tabs button[data-tab]')) b.toggleAttribute('data-on', b.dataset.tab === key);
  const view = document.getElementById('view');
  view.replaceChildren();
  window.scrollTo(0, 0);
  ({ today: renderToday, orders: renderOrders, stall: renderStallTab, money: renderMoneyTab, profile: renderProfile })[key]?.(view);
}

/** «Бямба, 9-р сарын 13» — the day, the way it is said. */
function dayLong(day) {
  const d = new Date(`${day}T12:00:00+08:00`);
  const names = ['Ням', 'Даваа', 'Мягмар', 'Лхагва', 'Пүрэв', 'Баасан', 'Бямба'];
  return `${names[d.getUTCDay()]}, ${dayLabel(day)}`;
}

/* today: the numbers, then the work */

function renderToday(view) {
  const all = watchingAll();
  view.append(
    el(`<div class="head"><h2>${all ? 'Бүх нийлүүлэгчийн ажил' : 'Өнөөдөр'}</h2><p id="today-line">…</p></div>`),
    el('<div class="stats" id="home"></div>'),
    el('<div id="board"></div>'),
  );
  if (!all) void renderHome();
  void refreshBoard().then(() => {
    const line = document.getElementById('today-line');
    if (line && today) line.textContent = dayLong(today);
  });
}

async function renderHome() {
  const box = document.getElementById('home');
  if (!box) return;
  let h;
  try {
    h = await api('/v1/supplier/home', { token: token() });
  } catch {
    box.remove();
    return;
  }
  if (!document.getElementById('home')) return;
  const todo = h.lanes.paid + h.lanes.preparing + h.lanes.ready + h.lanes.dispatched;
  const k = (n, unit) => `${n} ${unit === 'kg' ? 'кг' : 'толгой'}`;
  box.replaceChildren(
    el(`<div class="card stat"><b>${todo}</b><span>${
      todo
        ? [
            h.due_today ? `${h.due_today} өнөөдөр авна` : '',
            h.overdue ? `${h.overdue} зочин ирээгүй` : '',
          ].filter(Boolean).join(' · ') || 'хийх ажилтай захиалга'
        : 'хийх ажил алга'
    }</span></div>`),
    el(`<div class="card stat"><b>${h.season.handed}</b><span>${h.season.by_kind.map((b) => `${KIND[b.kind] ?? b.kind} ${k(b.qty, b.unit)}`).join(', ') || 'энэ улирал хүлээлгэн өгсөн'}</span></div>`),
    el(`<div class="card stat"><b class="money">${mnt(h.season.payout_mnt)}</b><span>танд очих орлого${h.season.forfeit_mnt ? `, суутгал ${mnt(h.season.forfeit_mnt)}` : ''}</span></div>`),
  );
}

/* orders: the list, searched; one order, with its story */

let orderQuery = { scope: 'live', q: '' };

function renderOrders(view) {
  view.append(el(`
    <section class="orders">
      <div class="head"><h2>Захиалгууд</h2><p>Код, утас, нэр, махаар хайна.</p></div>
      <div class="tools">
        <input type="search" id="q" placeholder="Хайх…" value="${esc(orderQuery.q)}" autocomplete="off">
        <div class="seg">
          ${[['live', 'Идэвхтэй'], ['done', 'Дууссан'], ['all', 'Бүгд']]
            .map(([k, l]) => `<button type="button" data-scope="${k}"${orderQuery.scope === k ? ' data-on' : ''}>${l}</button>`)
            .join('')}
        </div>
      </div>
      <div class="list" id="orders"><div class="empty">…</div></div>
    </section>`));
  let timer;
  view.querySelector('#q').addEventListener('input', (e) => {
    orderQuery.q = e.target.value;
    clearTimeout(timer);
    timer = setTimeout(loadOrders, 250);
  });
  view.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-scope]');
    if (!b) return;
    orderQuery.scope = b.dataset.scope;
    for (const c of view.querySelectorAll('.seg button')) c.toggleAttribute('data-on', c === b);
    void loadOrders();
  });
  void loadOrders();
}

async function loadOrders() {
  const box = document.getElementById('orders');
  if (!box) return;
  let data;
  try {
    data = await api(`/v1/supplier/orders?scope=${orderQuery.scope}&q=${encodeURIComponent(orderQuery.q)}`, { token: token() });
  } catch (error) {
    if (error.status === 401) return signOut();
    box.replaceChildren(el('<div class="card empty">Ачаалж чадсангүй.</div>'));
    return;
  }
  if (!document.getElementById('orders')) return;
  box.replaceChildren();
  if (!data.orders.length) box.append(el(`<div class="card empty">${ICON.orders}<b>Захиалга алга</b>${orderQuery.q ? 'Хайлтад тохирох захиалга олдсонгүй.' : 'Энэ хэсэгт захиалга байхгүй.'}</div>`));
  for (const o of data.orders) {
    const row = el(`
      <button class="order" type="button" data-order="${o.id}">
        <div class="t">№${o.code} · ${esc(o.title)} ×${o.qty}${o.unit === 'kg' ? ' кг' : ''}</div>
        <div class="right"><span class="chip" data-s="${o.state}">${STATE_WORD[o.state] ?? o.state}</span></div>
        <div class="s">${[o.guest, o.guest_phone, o.receive === 'delivery' ? 'хүргэлт' : 'өөрөө авна', dayLabel(o.receive_on)].filter(Boolean).map(esc).join(' · ')}</div>
        <div class="right"><span class="amt">${mnt(o.state === 'CANCELLED' || o.state === 'REFUNDED' ? o.forfeit_mnt ?? 0 : o.payout_mnt)}</span></div>
      </button>`);
    row.addEventListener('click', () => openOrder(o.id));
    box.append(row);
  }
}

const STATE_WORD = {
  PAID: 'Төлсөн', PREPARING: 'Бэлтгэж байна', READY: 'Бэлэн', DISPATCHED: 'Замд',
  HANDED: 'Өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан', REFUNDED: 'Буцаасан',
};
const EVENT_WORD = {
  CREATED: 'Захиалга үүссэн', PAID: 'Төлсөн', PREPARING: 'Бэлтгэж эхэлсэн', READY: 'Бэлэн болсон',
  DISPATCHED: 'Замд гарсан', HANDED: 'Хүлээлгэн өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан',
  REFUND_DUE: 'Буцаалт үүссэн', REFUNDED: 'Буцаалт шилжүүлсэн', RESENT: 'Мэдэгдэл дахин илгээсэн',
};
const ACTOR_WORD = (a) =>
  a.startsWith('guest:') ? 'зочин' : a.startsWith('supplier:owner:') ? 'та (утас)' : a.startsWith('supplier:') ? 'таны дэлгэц' : a.startsWith('ops') ? 'Basu' : 'систем';
const REASON_SHORT = {
  guest_asked: 'зочин хүссэн', vet: 'мал эмнэлэг', cannot_fulfil: 'биелүүлж чадаагүй',
  no_show: 'зочин ирээгүй', unreachable: 'хаяг дээр холбогдоогүй', draft_expired: 'төлөгдөөгүй',
};

async function openOrder(id) {
  const view = document.getElementById('view');
  let data;
  try {
    data = await api(`/v1/supplier/orders/${id}`, { token: token() });
  } catch (error) {
    toast(error.message, 'bad');
    return;
  }
  const o = data.order;
  const lane = { PAID: 'paid', PREPARING: 'preparing', READY: 'ready', DISPATCHED: 'dispatched' }[o.state];
  today = today ?? o.receive_on;
  view.replaceChildren(
    el(`<section class="order-page">
          <button class="back" type="button" id="back">‹ Захиалгууд</button>
          <div class="head"><h2>№${o.code}</h2><span class="chip" data-s="${o.state}">${STATE_WORD[o.state] ?? o.state}</span></div>
          <div id="act"></div>
          ${o.cancel_reason ? `<div class="card terms" style="margin-top:10px">Цуцлагдсан: <b>${REASON_SHORT[o.cancel_reason] ?? o.cancel_reason}</b>. Зочинд ${mnt(o.refund_mnt ?? 0)} буцна${o.forfeit_mnt ? `, танд ${mnt(o.forfeit_mnt)} үлдэнэ` : ''}.</div>` : ''}
          <div class="sec">Явц</div>
          <ol class="story">
            ${data.events.map((e) => `<li><b>${EVENT_WORD[e.type] ?? e.type}</b><small>${when(e.at)} · ${ACTOR_WORD(e.actor)}${e.payload?.reason ? ` · ${REASON_SHORT[e.payload.reason] ?? e.payload.reason}` : ''}</small></li>`).join('')}
          </ol>
        </section>`),
  );
  view.querySelector('#back').addEventListener('click', () => show('orders'));
  // The card is the same one today's list shows — facts, phone, and the button.
  const card = renderTicket(o, lane ?? 'done');
  if (!lane) card.querySelector('.btns').remove();
  view.querySelector('#act').append(card);
  if (lane) onActed = () => openOrder(id);
}

        <datalist id="banks">${BANKS.map((b) => `<option value="${b}">`).join('')}</datalist>
        <label class="field"><span>Дансны дугаар</span><input name="bank_account" inputmode="numeric" value="${esc(p.bank_account ?? '')}"></label>
        <label class="field"><span>Данс эзэмшигчийн нэр</span><input name="bank_holder" value="${esc(p.bank_holder ?? '')}"></label>
        <button class="btn" data-v="primary" data-size="lg" type="button" id="save">Хадгалах</button>
      </div>
    </section>`);
  form.querySelector('#save').addEventListener('click', async () => {
    const v = (name) => form.querySelector(`[name="${name}"]`).value.trim();
    try {
      await api('/v1/supplier/profile', {
        method: 'PATCH',
        token: token(),
        body: { name: v('name'), address: v('address'), about: v('about'), bank_name: v('bank_name'), bank_account: v('bank_account'), bank_holder: v('bank_holder') },
      });
      toast('Хадгалагдлаа.');
      for (const n of document.querySelectorAll('#supplier')) n.textContent = v('name');
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  view.append(form);
}

/* ── boot ────────────────────────────────────────────────────────── */

/**
 * Three ways this page is opened: by a screen paired with a code, by a
 * person signed in with their phone — from the app's tile, or a browser on
 * a computer — and by somebody who is neither yet.
 */
async function boot() {
  root.replaceChildren();
  if (store.supplierToken) {
    openModule();
    return;
  }
  if (store.guestToken) {
    try {
      const { supplier } = await api('/v1/supplier/me', { token: store.guestToken });
      if (supplier?.state === 'contracted') {
        openModule();
        return;
      }
      showApply();
      return;
    } catch (error) {
      if (error.status === 401) store.guestToken = null;
      else {
        toast(error.message, 'bad');
        return;
      }
    }
  }
  showLanding();
}

boot();

const poll = setInterval(() => {
  if (!document.hidden && document.getElementById('board')) void refreshBoard();
}, 3000);
addEventListener('pagehide', () => clearInterval(poll));
</script>
</body>
</html>
