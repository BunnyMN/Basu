/* ── today's work ────────────────────────────────────────────────── */

/** Set by whichever view holds tickets besides the board, to redraw after an action. */
let onActed = null;

/** What each group of work is called. */
const LANES = [
  { key: 'paid', title: 'Бэлтгэж эхлэх' },
  { key: 'preparing', title: 'Бэлэн болгох' },
  { key: 'ready', title: 'Өгөх, хүргэх' },
  { key: 'dispatched', title: 'Замд яваа' },
];
/** The order state each lane holds: its word and its place on the meter come from api.js (ideshStage). */
const LANE_STATE = { paid: 'PAID', preparing: 'PREPARING', ready: 'READY', dispatched: 'DISPATCHED' };

/**
 * The server's day. The demo's clock is not the browser's, and an order
 * opened from the list must not take its own day for today — so it comes
 * from the board or the day's numbers, and until it has, days are said
 * without how far away they are.
 */
let today = null;
async function knowToday() {
  if (today) return today;
  try {
    today = (await sup('/v1/supplier/home')).today ?? null;
  } catch {
    // A seat without the day's numbers: days are said as dates.
  }
  return today;
}

/** «Бямба, 9-р сарын 13» — the day, the way it is said. */
function dayLong(day) {
  if (!day) return '—';
  const d = new Date(`${day}T12:00:00+08:00`);
  const names = ['Ням', 'Даваа', 'Мягмар', 'Лхагва', 'Пүрэв', 'Баасан', 'Бямба'];
  return `${names[d.getUTCDay()]}, ${dayLabel(day)}`;
}

/** How far a day is from today, in words, and the tone that says it is now or gone. */
function dayAway(day) {
  if (!day || !today) return null;
  const n = Math.round((Date.parse(`${day}T00:00:00Z`) - Date.parse(`${today}T00:00:00Z`)) / 86_400_000);
  if (n === 0) return { word: 'Өнөөдөр', tone: 'hold', n };
  if (n === 1) return { word: 'Маргааш', tone: '', n };
  if (n === -1) return { word: 'Өчигдөр', tone: 'stop', n };
  if (n > 1) return { word: `${n} хоногийн дараа`, tone: '', n };
  return { word: `${-n} хоног өнгөрсөн`, tone: 'stop', n };
}

/** The hairline an order's card or row wears for its day: gold on the day itself, the crimson's ink once it has gone. */
const dueOf = (away) => (away?.tone === 'stop' ? 'late' : away?.tone === 'hold' ? 'today' : '');

/** A ready pickup whose guest may now be called absent. */
const noShow = (t, lane) => lane === 'ready' && t.receive !== 'delivery' && Boolean(t.no_show_from) && new Date(t.no_show_from) <= new Date();

/** How many orders wait for somebody's hands: on the «Өнөөдөр» tab, and beside it in the desk's menu. */
function setTodo(n) {
  const count = document.querySelector('.tabbar button[data-tab="today"] .count');
  if (count) {
    count.hidden = !n;
    count.textContent = n > 99 ? '99+' : String(n);
    // Heard as words, not «Өнөөдөр2»: the tab's own name first, then what the number counts.
    const tab = count.closest('button');
    if (n) tab?.setAttribute('aria-label', `${tab.querySelector('.t')?.textContent ?? 'Өнөөдөр'}, ${n} хийх ажил`);
    else tab?.removeAttribute('aria-label');
  }
  deskNav?.badge?.('idesh.today', n, true);
}

/** A board redraws only when what it shows changed: never under a finger about to press, never under the focus. */
let boardSig = '';
let lastGood = null;
/** Which lane the desk's table shows: «Бүгд», or one lane's key. Kept while the board redraws. */
let laneShown = 'all';

/**
 * The work. At a desk, the prototype's table: every order with a job still
 * to do, a row each — its meat, its code, its state as a word and the meter,
 * how and when it goes, what it brings, and its one off-white button — the
 * lanes as filters over it. On a phone, a card per order, one group per
 * thing to do next, empty groups not drawn. A person sees what is theirs
 * today and taps one button per order.
 */
function renderBoard(data) {
  today = data.today ?? today;
  const todo = LANES.reduce((sum, lane) => sum + (data.lanes[lane.key]?.length ?? 0), 0);
  setTodo(todo);
  const board = document.getElementById('board');
  if (!board) return;
  for (const n of document.querySelectorAll('.supplier-name')) {
    n.textContent = data.supplier?.name ?? 'Нийлүүлэгч';
  }
  connection(true);
  const noShows = (data.lanes.ready ?? []).map((t) => noShow(t, 'ready'));
  const sig = JSON.stringify([data.today, data.lanes, noShows, (data.listings ?? []).map((l) => [l.id, l.active, l.remaining])]);
  if (sig === boardSig && board.dataset.ready) return;
  boardSig = sig;

  const scroll = window.scrollY;
  board.replaceChildren();
  if (todo && wideDesk()) board.append(deskWork(data));
  else {
    for (const lane of LANES) {
      const tickets = data.lanes[lane.key] ?? [];
      if (!tickets.length) continue;
      const group = el(`<section class="group lane"><h2 class="section-title">${lane.title} <span class="n count" data-tone="neutral">${tickets.length}</span></h2><div class="stack"></div></section>`);
      const stack = group.querySelector('.stack');
      for (const ticket of tickets) stack.append(renderTicket(ticket, lane.key));
      board.append(group);
    }
  }
  if (!todo) board.append(nothingToDo(data.listings ?? []));
  board.dataset.ready = '1';
  window.scrollTo(0, scroll);
}

/**
 * The desk's day of work, as one table — «Бэлтгэх захиалга» — with a pill
 * per lane that has orders in it (and its count) to narrow it. A row opens
 * the order's own page, with the guest, the number to ring and the address.
 */
function deskWork(data) {
  const rows = LANES.flatMap((lane) => (data.lanes[lane.key] ?? []).map((t) => ({ ...t, lane: lane.key })));
  const lanes = LANES.filter((lane) => (data.lanes[lane.key] ?? []).length);
  if (laneShown !== 'all' && !lanes.some((lane) => lane.key === laneShown)) laneShown = 'all';
  const section = el('<section class="work" aria-labelledby="work-title"><div class="work-hd"><h2 id="work-title">Бэлтгэх захиалга</h2></div></section>');
  const showing = () => (laneShown === 'all' ? rows : rows.filter((t) => t.lane === laneShown));
  const table = dataTable({
    columns: [
      {
        key: 'title',
        label: 'Захиалга',
        sort: false,
        value: (t) => `${t.title} ${t.code}`,
        render: (t) => `<span class="it-cell">${thumb(t)}<span class="dt-two"><b>${what(t)}</b><small class="code">№${esc(t.code)}</small>${t.breakdown ? `<small class="cutup">${esc(t.breakdown.label)}${t.breakdown.note ? ' · хүсэлттэй' : ''}</small>` : ''}</span></span>`,
      },
      { key: 'state', label: 'Төлөв', sort: false, render: (t) => ideshStage(t.state ?? LANE_STATE[t.lane]) },
      { key: 'receive', label: 'Авах', sort: false, render: howCell },
      { key: 'receive_on', label: 'Өдөр', sort: false, render: dayCell },
      {
        key: 'amount',
        label: may('org.idesh.money') ? 'Танд очих' : 'Нийт',
        align: 'end',
        numeric: true,
        sort: false,
        render: (t) => money(typeof t.payout_mnt === 'number' ? t.payout_mnt : t.total_mnt),
      },
    ],
    search: false,
    actions: may('org.idesh.orders:act')
      ? (t) => {
          const box = el('<span class="btns row-acts"></span>');
          ticketActions(t, t.lane, box, { size: '' });
          return box;
        }
      : null,
    onRow: (t) => void openOrder(t.id, 'today'),
    // A row is the order's ticket at a desk, as the card is on a phone: the same hooks (`.ticket[data-lane]`, `[data-a]`).
    rowAttrs: (t) => ({ class: 'dt-row ticket', 'data-ticket': t.id, 'data-lane': t.lane }),
    noun: 'захиалга',
    rows: showing(),
  });
  // A lane filter only where there is more than one lane to choose between.
  if (lanes.length > 1) {
    const pills = el('<div class="filter lane-filter" role="group" aria-label="Аль ажил"></div>');
    for (const [key, word, n] of [['all', 'Бүгд', rows.length], ...lanes.map((lane) => [lane.key, lane.title, data.lanes[lane.key].length])]) {
      const pill = el(`<button type="button" data-lane-pick="${key}" aria-pressed="${key === laneShown}">${word}<i class="k">${n}</i></button>`);
      pill.addEventListener('click', () => {
        laneShown = key;
        for (const other of pills.children) other.setAttribute('aria-pressed', String(other === pill));
        table.setRows(showing());
      });
      pills.append(pill);
    }
    section.querySelector('.work-hd').append(pills);
  }
  section.append(table.el);
  return section;
}

/**
 * When an order goes, as the desk reads it at a glance: «Өнөөдөр»,
 * «Маргааш», «Өчигдөр», else the date («10/17»); a day gone by in the
 * crimson's ink with its dot, and a ready pickup whose guest has not come.
 */
function dayCell(t) {
  const away = dayAway(t.receive_on);
  const word = away && Math.abs(away.n) <= 1 ? away.word : dayShort(t.receive_on);
  return `<span class="day-word"${away?.tone === 'stop' ? ' data-tone="stop"' : ''}>${esc(word)}</span>${
    noShow(t, t.lane) ? '<span class="dt-sub" data-tone="stop">Зочин ирсэнгүй</span>' : ''
  }<span class="dt-sub how-sub">${t.receive === 'delivery' ? 'Хүргэлт' : 'Өөрөө авна'}</span>`;
}

/**
 * An empty day says what to do next. With nothing for sale there is nothing
 * to wait for: the next step is a listing. With listings up, it is waiting —
 * and how many of them guests can see.
 */
function nothingToDo(listings) {
  const live = listings.filter((l) => l.active && l.remaining > 0).length;
  if (!live) {
    const canAdd = may('org.idesh.stall:edit');
    return blank({
      icon: ICON.stall,
      tone: 'accent',
      title: listings.length ? 'Зочдод харагдаж буй зар алга' : 'Эхний зараа нэмнэ үү',
      text: listings.length ? 'Зар бүр зогссон эсвэл дууссан байна.' : 'Зочид таны зараас захиална. Зар оруулах үнэгүй.',
      action: canAdd
        ? { label: listings.length ? 'Зар руу очих' : 'Зар нэмэх', primary: true, onClick: () => (listings.length ? show('stall') : show('stall', { add: true })) }
        : null,
    });
  }
  return blank({
    icon: ICON.check,
    title: 'Одоогоор хийх ажил алга',
    text: `${live} зар зочдод харагдаж байна. Захиалга энд гарна.`,
    action: may('org.idesh.stall') ? { label: 'Зараа харах', onClick: () => show('stall') } : null,
  });
}

/**
 * A step redraws the board, and the button that was pressed goes with it: the
 * keyboard carries on from the same order's card or row — its next step —
 * rather than from the top of the page. Nothing moves for a finger: no
 * scroll, and only when the focus was lost.
 */
function keepPlace(id) {
  if (document.activeElement && document.activeElement !== document.body) return;
  const card = [...document.querySelectorAll('[data-ticket]')].find((t) => t.dataset.ticket === id);
  card?.querySelector('.btns button:not([disabled])')?.focus({ preventScroll: true });
}

/** The words on each primary button, and what the toast says when it is done. */
const DONE_WORD = {
  prepare: 'бэлтгэж эхэллээ',
  ready: 'бэлэн гэж тэмдэглэлээ',
  dispatch: 'замд гарлаа',
  hand: 'хүлээлгэн өгсөн',
};

/**
 * One order as a card: its meat and code over its state — a word and the
 * meter — then for whom, which day, where, what you get, and one button. On
 * the order's own page the code and the state are left out: they are the
 * page's title there.
 */
function renderTicket(ticket, lane, { page = false } = {}) {
  const delivery = ticket.receive === 'delivery';
  const state = ticket.state ?? LANE_STATE[lane];
  const live = lane in LANE_STATE;
  const away = live ? dayAway(ticket.receive_on) : null;
  const due = dueOf(away);
  // The number to ring sits beside the guest; the delivery's own line repeats it only when it is another number.
  const ring = guestNumber(ticket);
  const node = el(`
    <article class="card ticket" data-lane="${lane}" data-ticket="${esc(ticket.id)}"${due ? ` data-due="${due}"` : ''}>
      <div class="top">
        ${thumb(ticket, 'lg')}
        <div class="it"><span class="what">${what(ticket)}</span>${page ? '' : `<span class="id">№${esc(ticket.code)}</span>`}</div>
        ${page ? '' : ideshStage(state)}
      </div>
      <div class="body">
        <div class="facts-rows">
          <div class="who"><span class="k">Зочин</span><span class="v"><span>${guestName(ticket)}</span>${ring ? tel(ring) : ''}</span></div>
          <div class="on"><span class="k">${delivery ? 'Хүргэх өдөр' : 'Авах өдөр'}</span><span class="v"><span>${dayLong(ticket.receive_on)}</span>${
            away ? `<span class="rel"${away.tone ? ` data-tone="${away.tone}"` : ''}>${away.word}</span>` : ''
          }</span></div>
          <div class="where"><span class="k">${delivery ? 'Хүргэлт' : 'Авах'}</span><span class="v">${
            delivery ? `<span>${esc(ticket.address)}</span>${ticket.address_phone && ticket.address_phone !== ring ? tel(ticket.address_phone) : ''}` : 'Өөрөө ирж авна'
          }</span></div>
          ${ticket.breakdown ? `<div class="where cutup"><span class="k">Задаргаа</span><span class="v"><span><b>${esc(ticket.breakdown.label)}</b> — ${esc(ticket.breakdown.detail)}</span>${ticket.breakdown.note ? `<span class="rel" data-tone="hold">«${esc(ticket.breakdown.note)}»</span>` : ''}</span></div>` : ''}
          ${ticket.certificate ? `<div class="where paper"><span class="k">Гэрчилгээ</span><span class="v"><span class="mn">№${esc(ticket.certificate.number)}</span></span></div>` : ''}
        </div>
        <div class="sum"><span>Нийт</span>${money(ticket.total_mnt)}</div>
        ${typeof ticket.payout_mnt === 'number' ? `<div class="pay"><span>Танд очих</span>${money(ticket.payout_mnt)}</div>` : ''}
        ${
          lane === 'ready' && !delivery && ticket.no_show_from
            ? noShow(ticket, lane)
              ? '<div class="grace callout" data-k="warn"><span>Зочин ирсэнгүй. Залгаад, ирэхгүй бол «Цуцлах» дээр «зочин ирээгүй» гэж сонгоно.</span></div>'
              : `<div class="grace callout"><span>Ирэхгүй бол ${dayOfStamp(ticket.no_show_from)}-нөөс «зочин ирээгүй» гэж цуцалж болно.</span></div>`
            : ''
        }
        <div class="btns"></div>
      </div>
    </article>`);
  // An accountant reads the order; the buttons are for whoever does the work.
  if (may('org.idesh.orders:act')) ticketActions(ticket, lane, node.querySelector('.btns'));
  return node;
}

/**
 * An order's buttons, into `box` — the card's foot, or the desk table's last
 * cell: the one step that moves it on, as the business's off-white pill, and
 * «Цуцлах» in the crimson's ink. A step that cannot be taken back asks first,
 * in a popup over the page; so does every cancel.
 */
function ticketActions(ticket, lane, box, { size = 'lg' } = {}) {
  const delivery = ticket.receive === 'delivery';

  /** One press, one step: the button turns while it goes, the toast says it went, the board moves the order. */
  const go = async (action, button, body = {}) => {
    if (button?.hasAttribute('data-busy')) return;
    pressing(button, true);
    for (const b of box.querySelectorAll('button')) if (b !== button) b.disabled = true;
    try {
      await sup(`/v1/supplier/orders/${ticket.id}/${action}`, { method: 'POST', body });
      toast(`№${ticket.code} ${DONE_WORD[action] ?? ''}.`, 'good');
      await refreshBoard();
      await onActed?.();
      keepPlace(ticket.id);
    } catch (error) {
      if (error.status === 401) {
        signOut();
        return;
      }
      toast(error.message, 'bad');
      pressing(button, false);
      for (const b of box.querySelectorAll('button')) b.disabled = false;
    }
  };
  const add = (label, action, { confirm = null } = {}) => {
    const button = el(`<button class="btn" type="button" data-a="${action}" data-v="primary"${size ? ` data-size="${size}"` : ''}>${label}</button>`);
    button.addEventListener('click', async () => {
      // What the popup answers with rides along: the certificate chosen at «Бэлэн».
      const answer = confirm ? await confirm() : true;
      if (!answer) return;
      void go(action, button, typeof answer === 'object' ? answer : {});
    });
    box.append(button);
  };
  const cancel = (reasons) => {
    const button = el(`<button class="btn" type="button" data-v="danger" data-a="cancel"${size ? '' : ' data-size="sm"'}>Цуцлах</button>`);
    button.addEventListener('click', () => void cancelOrder(ticket, lane, reasons));
    box.append(button);
  };
  if (lane === 'paid') {
    // Starting is the slaughter: it changes what a cancel gives back, so it asks first.
    add('Бэлтгэж эхлэх', 'prepare', { confirm: () => startPreparing(ticket) });
    cancel(['guest_asked', 'cannot_fulfil', 'vet']);
  } else if (lane === 'preparing') {
    // Cut meat came with its certificate; a whole animal's is named now, as the meat is.
    add('Бэлэн боллоо', 'ready', ticket.certificate ? {} : { confirm: () => readyWith(ticket) });
    cancel(['guest_asked', 'vet', 'cannot_fulfil']);
  } else if (lane === 'ready') {
    if (delivery) add('Замд гаргах', 'dispatch');
    else add('Хүлээлгэн өгсөн', 'hand', { confirm: () => handOver(ticket) });
    cancel(delivery ? ['guest_asked', 'unreachable', 'vet', 'cannot_fulfil'] : ['guest_asked', 'no_show', 'vet', 'cannot_fulfil']);
  } else if (lane === 'dispatched') {
    add('Хүлээлгэн өгсөн', 'hand', { confirm: () => handOver(ticket) });
    cancel(['unreachable', 'guest_asked', 'cannot_fulfil']);
  }
}

/**
 * «Бэлэн боллоо» for meat that has no certificate yet: the popup asks which
 * one it came with. The step is not held up for it — a certificate still on
 * its way is put on afterwards, from the order's own page.
 */
async function readyWith(ticket) {
  await loadPapers().catch(() => {});
  const answer = popup({
    id: 'ready-order',
    title: 'Бэлэн боллоо',
    sub: `<span class="mn">№${esc(ticket.code)}</span> · ${esc(ticket.title)} ×${esc(ticket.qty)}${ticket.unit === 'kg' ? ' кг' : ''} · ${guestLine(ticket)}`,
    width: 500,
    fields: [
      { name: 'certificate_id', label: 'Мал эмнэлгийн гэрчилгээ', type: 'select', wide: true, options: paperOptions('Одоохондоо алга — дараа оруулна'), value: usablePapers().length === 1 ? usablePapers()[0].id : '', hint: 'Энэ махны гэрчилгээ. Зочин захиалга дээрээ дугаарыг нь харна.' },
      { type: 'note', text: 'Зочинд «идэш бэлэн боллоо» гэж мессеж очно.' },
    ],
    submit: 'Бэлэн боллоо',
    onSubmit: async (v) => (v.certificate_id ? { certificate_id: v.certificate_id } : {}),
  });
  wirePaperSelect(document.getElementById('ready-order'));
  return answer;
}

/**
 * The certificate put on an order after the fact, or the wrong one put
 * right — from the order's own page, while the order is still being worked on.
 */
async function certifyOrder(o, then) {
  await loadPapers().catch(() => {});
  const answer = popup({
    id: 'certify-order',
    title: o.certificate ? 'Гэрчилгээ солих' : 'Гэрчилгээ оруулах',
    sub: `<span class="mn">№${esc(o.code)}</span> · ${esc(o.title)}`,
    width: 500,
    fields: [{ name: 'certificate_id', label: 'Мал эмнэлгийн гэрчилгээ', type: 'select', wide: true, required: true, options: paperOptions('Сонгоно уу'), value: '' }],
    submit: 'Хадгалах',
    onSubmit: async (v) => {
      if (!v.certificate_id) throw refuse('certificate_id', 'Гэрчилгээгээ сонгоно уу, эсвэл шинээр нэмнэ үү.');
      await sup(`/v1/supplier/orders/${o.id}/certify`, { method: 'POST', body: { certificate_id: v.certificate_id } });
      return true;
    },
  });
  wirePaperSelect(document.getElementById('certify-order'));
  if (!(await answer)) return;
  toast('Гэрчилгээ хадгалагдлаа.', 'good');
  await then?.();
}

/**
 * Handing over is the last step and has no way back: the order closes and
 * the payout is counted. So it shows the code the guest's phone shows, to
 * check against, before it is said — the wrong animal to the wrong family
 * is the one mistake a counter must not make.
 */
async function handOver(ticket) {
  const delivery = ticket.receive === 'delivery';
  const answer = await popup({
    id: 'hand-order',
    title: delivery ? 'Хүргэлт зочинд хүрсэн үү?' : 'Хүлээлгэн өгөх',
    sub: `${esc(ticket.title)} ×${esc(ticket.qty)}${ticket.unit === 'kg' ? ' кг' : ''} · ${guestLine(ticket)}`,
    width: 460,
    fields: [
      {
        type: 'static',
        label: 'Зочны код',
        html: `<div class="codebox hand-code"><b>${esc(ticket.code)}</b><small>${
          delivery ? 'Хүргэлтийн ажилтан зочноос кодыг нь асууж тулгана.' : 'Зочны утсан дээрх код үүнтэй таарвал махыг өгнө.'
        }</small></div>`,
      },
      { type: 'note', text: '«Хүлээлгэн өгсөн» дарснаар захиалга дуусч, танд очих мөнгө тооцогдоно. Буцаах боломжгүй.' },
    ],
    submit: 'Хүлээлгэн өгсөн',
    onSubmit: async () => true,
  });
  return Boolean(answer);
}

/**
 * «Бэлтгэж эхлэх» is the animal committed: from that press a cancel on the
 * guest's side leaves the supplier a tenth of the meat price, and the animal
 * does not go back on sale. One tap must not do that unseen — the popup says
 * what changes, in money, before it is said.
 */
async function startPreparing(ticket) {
  const meat = ticket.total_mnt - (ticket.receive === 'delivery' ? ticket.delivery_fee_mnt ?? 0 : 0);
  const kept = Math.round((meat * FORFEIT_PCT) / 100);
  const answer = await popup({
    id: 'prepare-order',
    title: 'Бэлтгэж эхлэх',
    sub: `<span class="mn">№${esc(ticket.code)}</span> · ${esc(ticket.title)} ×${esc(ticket.qty)}${ticket.unit === 'kg' ? ' кг' : ''} · ${guestLine(ticket)}`,
    width: 480,
    fields: [
      // What the guest asked to have done to it, before the knife: the choice, and the wish in their words.
      ...(ticket.breakdown
        ? [{ type: 'note', html: `<b>Задаргаа: ${esc(ticket.breakdown.label)}</b> — ${esc(ticket.breakdown.detail)}${ticket.breakdown.note ? ` Зочны хүсэлт: «${esc(ticket.breakdown.note)}»` : ''}` }]
        : []),
      { type: 'note', text: 'Бэлтгэж эхэлбэл малыг нядалсанд тооцно: буцаах боломжгүй, мал зар руу буцахгүй. Зочинд «бэлтгэгдэж эхэллээ» гэж мэдэгдэнэ.' },
      {
        type: 'note',
        html: `Үүнээс хойш зочны шалтгаанаар цуцлагдвал махны үнийн ${FORFEIT_PCT}% — <b>${money(kept)}</b> танд үлдэнэ. Мал эмнэлгийн шалгалт унах, эсвэл та биелүүлж чадахгүй болбол зочинд бүтнээр нь буцаана.`,
      },
    ],
    submit: 'Бэлтгэж эхлэх',
    onSubmit: async () => true,
  });
  return Boolean(answer);
}

/** The words for a reason, and which reasons are the supplier's own fault. */
const REASON = {
  guest_asked: 'Зочин хүссэн — утсаар ярьж тохирсон',
  vet: 'Мал эмнэлгийн шалгалт унасан',
  cannot_fulfil: 'Биелүүлж чадахгүй боллоо',
  no_show: 'Зочин ирээгүй — өдрөөс 3 хоног өнгөрсөн',
  unreachable: 'Хаяг дээр холбогдож чадсангүй',
};
const SUPPLIER_FAULT = ['vet', 'cannot_fulfil'];
const FORFEIT_PCT = 10;

/**
 * Cancelling asks why, because the reason decides the money — the supplier
 * picks from what can be true of this order, sees what the guest gets back
 * and what stays, and only then confirms. A popup over the page, so the poll
 * can redraw the board under it.
 */
async function cancelOrder(ticket, lane, reasons) {
  const delivery = ticket.receive === 'delivery';
  const slaughtered = lane !== 'paid';
  const meat = ticket.total_mnt - (delivery ? ticket.delivery_fee_mnt ?? 0 : 0);
  const waiting = 'Шалтгаанаа сонгоно уу — зочинд хэдийг буцаах нь түүнээс хамаарна.';
  const answer = popup({
    id: 'cancel-order',
    title: 'Захиалгыг цуцлах',
    sub: `<span class="mn">№${esc(ticket.code)}</span> · ${esc(ticket.title)} ×${esc(ticket.qty)}${ticket.unit === 'kg' ? ' кг' : ''} · ${guestLine(ticket)}`,
    width: 520,
    fields: [
      {
        type: 'static',
        label: 'Яагаад цуцлах вэ?',
        html: `<div class="reasons"><div class="reason-list" role="radiogroup" aria-label="Цуцлах шалтгаан">${reasons
          .map((r) => `<label class="check reason"><input type="radio" name="reason" value="${r}"><span>${REASON[r]}</span></label>`)
          .join('')}</div><p class="refund" aria-live="polite">${waiting}</p></div>`,
      },
    ],
    submit: 'Захиалгыг цуцлах',
    danger: true,
    onSubmit: async (values) => {
      if (!values.reason) throw new Error('Шалтгаанаа сонгоно уу.');
      await sup(`/v1/supplier/orders/${ticket.id}/cancel`, { method: 'POST', body: { reason: values.reason } });
      return true;
    },
  });
  const sheet = document.getElementById('cancel-order');
  const confirm = sheet?.querySelector('[data-submit]');
  if (confirm) {
    confirm.setAttribute('data-fill', '');
    confirm.disabled = true;
  }
  sheet?.addEventListener('change', () => {
    const reason = sheet.querySelector('.reasons input:checked')?.value;
    if (!reason) return;
    const forfeit = slaughtered && !SUPPLIER_FAULT.includes(reason) ? Math.round((meat * FORFEIT_PCT) / 100) : 0;
    sheet.querySelector('.refund').innerHTML = forfeit
      ? `Зочинд <b>${money(ticket.total_mnt - forfeit)}</b> буцна, ${money(forfeit)} (${FORFEIT_PCT}%) танд үлдэнэ.`
      : `Зочинд <b>${money(ticket.total_mnt)}</b> бүтнээр буцна.`;
    if (confirm) confirm.disabled = false;
  });
  if (!(await answer)) return;
  toast(`№${ticket.code} цуцлагдлаа.`, 'good');
  await refreshBoard();
  await onActed?.();
}

/**
 * Whether the board is reaching the server. Lost, it is said across the
 * work with the last time it was right, and the work dims: an old board is
 * not to be acted on as if it were now.
 */
function connection(ok) {
  const strip = document.getElementById('conn');
  const board = document.getElementById('board');
  if (ok) {
    lastGood = new Date();
    if (strip) {
      strip.hidden = true;
      delete strip.dataset.stale;
    }
    if (board) {
      delete board.dataset.stale;
      board.removeAttribute('inert');
    }
    return;
  }
  if (!strip) return;
  const at = lastGood ? ubParts(lastGood).clock : '—';
  strip.querySelector('.mono').textContent = at;
  strip.dataset.stale = '1';
  strip.hidden = false;
  if (board) {
    board.dataset.stale = '1';
    board.setAttribute('inert', '');
  }
}

async function refreshBoard() {
  try {
    const drawn = boardSig;
    renderBoard(await sup('/v1/supplier/board'));
    // The day's numbers move with the work: an order handed over is one less to do and the season's
    // money more — asked again whenever the board changed after its first drawing, by a press here or
    // by somebody at another screen, never on a poll that found nothing new.
    if (drawn && boardSig !== drawn) void renderHome();
  } catch (error) {
    if (error.status === 401) {
      signOut();
      return;
    }
    connection(false);
  }
}

/* ── the certificates ────────────────────────────────────────────── */

/**
 * The veterinary certificates the meat came with. One is written in when a
 * shipment arrives — as the paper prints it: its МЭГ number, the vet and the
 * inspector, the days, where the animals came from, the laboratory's tests,
 * what it covers, the route, a photograph and its QR — and then chosen: on a
 * listing of meat by the kilogram, and on a whole animal's order when it is
 * marked ready. Guests read the number, the origin and the tests; the herder,
 * the route and the photograph are for this business and for Basu.
 */
let papers = [];
/** The aimags a certificate's origin is chosen from, as the server names them. */
let aimags = [];
async function loadPapers() {
  const got = await sup('/v1/supplier/certificates');
  papers = got.certificates;
  aimags = got.aimags ?? aimags;
  return papers;
}
/** «Завхан, Отгон сум» — or null for a certificate written in before origins were asked. */
const paperOrigin = (c) => (c.origin ? `${c.origin.aimag}, ${/(сум|дүүрэг)$/i.test(c.origin.soum) ? c.origin.soum : `${c.origin.soum} ${c.origin.aimag === 'Улаанбаатар' ? 'дүүрэг' : 'сум'}`}` : null);
/** The tests a paper most often lists; others are typed. */
const PAPER_TESTS = ['Шүлхий', 'Бруцеллёз', 'Боом', 'Ям', 'Сүрьеэ', 'Цэцэг'];
const PAPER_UNITS = [['piece', 'ш'], ['head', 'толгой'], ['kg', 'кг']];
/** One that may still be put on meat: not one Basu found false. */
const usablePapers = () => papers.filter((c) => c.state !== 'false');
const PAPER_STATE = { unchecked: ['pending', 'Шалгаагүй'], genuine: ['verified', 'Basu шалгасан'], false: ['bad', 'Хүчингүй'] };
/** «№0883120139 · Завхан, Отгон сум · 10/02» — who gave it, for one written in before origins were asked. */
const paperLine = (c) => `№${c.number} · ${paperOrigin(c) ?? c.issuer} · ${dayShort(c.issued_on)}`;
/** A choice of certificates for a popup's select: `none` is the first line, «add one» the last. */
const paperOptions = (none) => [['', none], ...usablePapers().map((c) => [c.id, paperLine(c)]), ...(may('org.idesh.stall:edit') ? [['new', '+ Шинэ гэрчилгээ нэмэх']] : [])];

/**
 * A photograph of a sheet of paper, made small enough to send: the long side
 * at most 1600 px, a JPEG, stepped down until it is under the server's limit.
 */
async function shrinkPhoto(file, { longest = 1600, under = 850 * 1024 } = {}) {
  if (!/^image\//.test(file.type)) throw refuse('photo', 'Зургийн файл сонгоно уу.');
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(refuse('photo', 'Энэ зургийг уншиж чадсангүй. Өөр зураг сонгоно уу.'));
      i.src = url;
    });
    let side = longest;
    let quality = 0.82;
    for (let tries = 0; tries < 6; tries += 1) {
      const scale = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
      const pen = canvas.getContext('2d');
      // A PNG's clear parts would turn black in a JPEG: paper is white.
      pen.fillStyle = '#fff';
      pen.fillRect(0, 0, canvas.width, canvas.height);
      pen.drawImage(img, 0, 0, canvas.width, canvas.height);
      const data = canvas.toDataURL('image/jpeg', quality);
      if (data.length * 0.75 < under) return data;
      side = Math.round(side * 0.8);
      quality = Math.max(0.6, quality - 0.06);
    }
    throw refuse('photo', 'Зураг хэт том байна. Жижиг зураг сонгоно уу.');
  } finally {
    URL.revokeObjectURL(url);
  }
}

/**
 * A listing's own photographs, on its popup: the ones it has and the ones
 * just chosen as small tiles — the first is the cover a guest sees on the
 * card — each with «take away» and «make it the cover», and a tile that adds
 * more, several at a time. Nothing is sent until the popup is saved:
 * `saveShots` then takes away, sends and orders, in that order.
 */
const MAX_SHOTS = 8;
const SHOTS_FIELD = {
  type: 'static',
  label: 'Зураг (заавал биш)',
  html: `<div class="shots" id="shots"></div><input type="file" id="shots-file" accept="image/*" multiple hidden><small class="help">Малаа олон талаас нь авсан ${MAX_SHOTS} хүртэл зураг. Эхний зураг нь зарын нүүрэнд гарна. Зураггүй бол жишээ зураг харагдана.</small>`,
};
function wireShots(sheet, had = []) {
  const box = sheet?.querySelector('#shots');
  const input = sheet?.querySelector('#shots-file');
  // `id` for one the listing has; `photo` and `thumb` (data URLs) for one chosen here.
  const shots = { list: had.map((p) => ({ id: p.id, show: p.thumb })), gone: [], changed: false };
  if (!box || !input) return shots;
  const paint = () => {
    box.replaceChildren(
      ...shots.list.map((s, i) => {
        const tile = el(`<span class="shot"${i === 0 ? ' data-cover' : ''}>
            <img src="${esc(s.show)}" alt="${i + 1}-р зураг" width="88" height="88">
            ${i === 0 ? '<i>Нүүр</i>' : `<button type="button" class="first" aria-label="${i + 1}-р зургийг нүүр зураг болгох" title="Нүүр зураг болгох">★</button>`}
            <button type="button" class="drop" aria-label="${i + 1}-р зургийг хасах" title="Хасах">×</button>
          </span>`);
        tile.querySelector('.drop').addEventListener('click', () => {
          if (s.id) shots.gone.push(s.id);
          shots.list.splice(i, 1);
          shots.changed = true;
          paint();
        });
        tile.querySelector('.first')?.addEventListener('click', () => {
          shots.list.splice(i, 1);
          shots.list.unshift(s);
          shots.changed = true;
          paint();
        });
        return tile;
      }),
      ...(shots.list.length < MAX_SHOTS
        ? [(() => {
            const add = el(`<button type="button" class="shot add" id="shots-add"><b>+</b><span>Зураг нэмэх</span></button>`);
            add.addEventListener('click', () => input.click());
            return add;
          })()]
        : []),
    );
  };
  input.addEventListener('change', async () => {
    const files = [...(input.files ?? [])];
    input.value = '';
    const room = MAX_SHOTS - shots.list.length;
    if (files.length > room) toast(`Нэг зарт ${MAX_SHOTS} хүртэл зураг орно — эхний ${room}-г авлаа.`);
    box.setAttribute('aria-busy', 'true');
    for (const file of files.slice(0, room)) {
      try {
        // The photograph as a guest looks at it, and a small copy for a card in a list.
        const photo = await shrinkPhoto(file);
        const thumb = await shrinkPhoto(file, { longest: 720, under: 140 * 1024 });
        shots.list.push({ photo, thumb, show: thumb });
        shots.changed = true;
      } catch (error) {
        toast(`${file.name}: ${error.message}`, 'bad');
      }
      paint();
    }
    box.removeAttribute('aria-busy');
  });
  paint();
  return shots;
}
/**
 * Make the listing's photographs what the popup shows: the ones taken away
 * gone, the new ones sent one at a time (a photograph is most of a megabyte),
 * and the order said last, once every one of them has an id.
 */
async function saveShots(listingId, shots) {
  if (!shots?.changed) return;
  for (const id of shots.gone) await sup(`/v1/supplier/listings/${listingId}/photos/${id}`, { method: 'DELETE' });
  shots.gone = [];
  for (const s of shots.list) {
    if (s.id) continue;
    const { photo } = await sup(`/v1/supplier/listings/${listingId}/photos`, { method: 'POST', body: { photo: s.photo, thumb: s.thumb } });
    s.id = photo.id;
  }
  if (shots.list.length > 1) await sup(`/v1/supplier/listings/${listingId}/photos/order`, { method: 'PUT', body: { ids: shots.list.map((s) => s.id) } });
  shots.changed = false;
}

/**
 * A file field in the page's own words: the browser's «Choose File · No file
 * chosen» is put away, and a button and the chosen file's name stand for it.
 */
function filePick(input) {
  if (!input) return;
  const box = el('<span class="file-pick"><button class="btn" type="button" data-size="sm">Зураг сонгох</button><span class="file-name">Сонгоогүй байна</span></span>');
  input.hidden = true;
  input.after(box);
  box.querySelector('button').addEventListener('click', () => input.click());
  input.addEventListener('change', () => {
    box.querySelector('.file-name').textContent = input.files?.[0]?.name ?? 'Сонгоогүй байна';
  });
}

/** jsQR, fetched the first time a photograph is chosen: a page that never reads a QR never loads it. */
let qrReader = null;
const loadQrReader = () =>
  (qrReader ??= new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = '/vendor/jsqr.js';
    script.onload = () => resolve(window.jsQR);
    script.onerror = () => {
      qrReader = null;
      reject(new Error('QR уншигч ачаалсангүй.'));
    };
    document.head.append(script);
  }));

/**
 * What the QR on a photographed certificate says, or null when none is found.
 * The phone's own reader where the browser has one, jsQR everywhere else —
 * on the photograph as taken, made no larger than a reader needs.
 */
async function readQr(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error('Зургийг уншиж чадсангүй.'));
      i.src = url;
    });
    if ('BarcodeDetector' in window) {
      try {
        const [found] = await new window.BarcodeDetector({ formats: ['qr_code'] }).detect(img);
        if (found?.rawValue) return found.rawValue;
      } catch {
        // The browser has the name but not the reader: jsQR reads it below.
      }
    }
    const jsQR = await loadQrReader();
    for (const longest of [1600, 2400, 1000]) {
      const scale = Math.min(1, longest / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(1, Math.round(img.naturalWidth * scale));
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const g = canvas.getContext('2d', { willReadFrequently: true });
      g.drawImage(img, 0, 0, w, h);
      const code = jsQR(g.getImageData(0, 0, w, h).data, w, h);
      if (code?.data) return code.data;
      if (scale === 1) break;
    }
    return null;
  } finally {
    URL.revokeObjectURL(url);
  }
}

/** One line of the certificate's product table, as the popup draws it. */
const paperLineRow = (p = {}) => `
  <div class="paper-row">
    <select data-k="kind" aria-label="Мал">${Object.entries(KIND).map(([k, w]) => `<option value="${k}"${k === (p.kind ?? 'sheep') ? ' selected' : ''}>${w}</option>`).join('')}</select>
    <input data-k="what" aria-label="Бүтээгдэхүүн" placeholder="гулууз мах" maxlength="60" value="${esc(p.what ?? '')}">
    <input data-k="quantity" type="number" inputmode="decimal" min="0" step="any" aria-label="Тоо, хэмжээ" placeholder="Тоо" value="${esc(p.quantity ?? '')}">
    <select data-k="unit" aria-label="Нэгж">${PAPER_UNITS.map(([u, w]) => `<option value="${u}"${u === (p.unit ?? 'piece') ? ' selected' : ''}>${w}</option>`).join('')}</select>
    <button class="btn" type="button" data-size="sm" data-a="drop" aria-label="Мөрийг хасах">✕</button>
  </div>`;

/** The product table's lines as typed: an empty line is no line; half a line is asked about. */
function readPaperRows(sheet) {
  const out = [];
  for (const row of sheet.querySelectorAll('.paper-row')) {
    const get = (k) => row.querySelector(`[data-k="${k}"]`).value.trim();
    const what = get('what');
    const quantity = Number(get('quantity').replace(',', '.'));
    if (!what && !get('quantity')) continue;
    if (!what || !(quantity > 0)) throw new Error('Бүтээгдэхүүний мөр бүрт нэр, тоо хэмжээг нь бичнэ үү.');
    out.push({ kind: get('kind'), what, quantity, unit: get('unit') });
  }
  return out;
}

/**

      { name: 'inspector', label: 'Баталгаажуулсан улсын байцаагч', value: c?.inspector ?? '', attrs: { maxlength: 120 }, placeholder: 'Нэр эсвэл код' },

      { name: 'aimag', label: 'Аймаг, нийслэл', type: 'select', required: true, value: c?.origin?.aimag ?? '', options: [['', 'Сонгоно уу'], ...aimags.map((a) => [a, a])] },
      { name: 'soum', label: 'Сум, дүүрэг', required: true, value: c?.origin?.soum ?? '', attrs: { maxlength: 60 }, placeholder: 'Отгон' },
      { name: 'bag', label: 'Баг, хороо', value: c?.origin?.bag ?? '', attrs: { maxlength: 60 } },
      { name: 'herder', label: 'Малчин', value: c?.herder ?? '', attrs: { maxlength: 120 }, placeholder: 'Овог, нэр' },
      { type: 'section', label: 'Лабораторийн шинжилгээ', text: 'Сөрөг гарсан шинжилгээг тэмдэглэнэ. Зочид өвчний нэрийг харна.' },
      { type: 'checks', label: 'Шинжилсэн өвчин', options: PAPER_TESTS.map((d) => [`test:${d}`, d, tested.has(d)]) },
      { name: 'tests_other', label: 'Бусад шинжилгээ', wide: true, value: [...tested].filter((d) => !PAPER_TESTS.includes(d)).join(', '), placeholder: 'Таслалаар: Формалин, Пероксидаз' },
      { name: 'tested_on', label: 'Шинжилсэн өдөр', type: 'date', value: firstTest.tested_on ?? '', attrs: { max: day ?? null } },

      { type: 'section', label: 'Бүтээгдэхүүн ба тээвэр' },
      { type: 'static', label: 'Мал, бүтээгдэхүүн', html: `<div class="paper-rows">${(c?.products?.length ? c.products : [{}]).map(paperLineRow).join('')}</div><button class="btn" type="button" data-size="sm" data-a="add-row">${ICON.plus}Мөр нэмэх</button>` },
      { name: 'route', label: 'Маршрут', wide: true, value: c?.route ?? '', attrs: { maxlength: 200 }, placeholder: 'Завхан, Отгон → Улаанбаатар', hint: 'Зочдод харагдахгүй.' },
      { type: 'section', label: 'Зураг ба QR' },
      { name: 'photo', label: 'Гэрчилгээний зураг', type: 'file', wide: true, attrs: { accept: 'image/*' }, hint: c?.has_photo ? 'Шинэ зураг сонговол хуучныг нь солино. Зочдод харагдахгүй.' : 'Зургийг зөвхөн та болон Basu харна, зочдод харагдахгүй.' },
      { name: 'qr', label: 'QR кодын агуулга', wide: true, value: c?.qr ?? '', attrs: { maxlength: 1000 }, autocomplete: 'off', hint: 'Зураг сонгоход QR-ыг нь автоматаар уншина. Хуучин цаасан маягтад QR байдаггүй.' },
    ],
    submit: c ? 'Хадгалах' : 'Нэмэх',
    onSubmit: async (v) => {

      const sheet = document.getElementById(id);

      const diseases = [
        ...PAPER_TESTS.filter((d) => v[`test:${d}`]),
        ...v.tests_other.split(/[,;]/).map((d) => d.trim()).filter((d) => d.length >= 2),

        number: v.number,

        issued_on: v.issued_on,

    const file = photo.files?.[0];
    if (!file) return;
    if (qrHelp) qrHelp.textContent = 'QR уншиж байна…';
    try {
      const read = await readQr(file);
      if (read) {
        qr.value = read.slice(0, 1000);
        if (qrHelp) qrHelp.textContent = 'QR-ыг зурагнаас уншлаа.';
      } else if (qrHelp) {
        qrHelp.textContent = 'Зурагнаас QR олдсонгүй. QR байгаа бол ойроос, гэрэлтэй газар дахин зурна уу.';

      if (qrHelp) qrHelp.textContent = error.message;

  if (!done) return null;
  papers = c ? papers.map((x) => (x.id === done.id ? done : x)) : [done, ...papers];
  toast(c ? `№${done.number} гэрчилгээ хадгалагдлаа.` : `№${done.number} гэрчилгээ нэмэгдлээ.`, 'good');

}
const addPaper = () => paperForm();

/**
 * A popup's certificate select: choosing «+ Шинэ гэрчилгээ нэмэх» opens the
 * popup that writes one in, over this one, and comes back with it chosen —
 * or with nothing chosen, when that popup was closed.
 */
function wirePaperSelect(sheet, name = 'certificate_id') {
  const select = sheet?.querySelector(`[name="${name}"]`);
  if (!select) return;
  let kept = select.value;
  select.addEventListener('change', async () => {
    if (select.value !== 'new') {
      kept = select.value;
      return;
    }
    select.value = kept;
    const added = await addPaper();
    if (!added || !select.isConnected) return;
    const option = document.createElement('option');
    option.value = added.id;
    option.textContent = paperLine(added);
    select.querySelector('option[value="new"]')?.before(option);
    select.value = added.id;
    kept = added.id;
    select.dispatchEvent(new Event('input', { bubbles: true }));
  });
}

/** The photograph, shown to the supplier again: fetched as theirs, never a public address. */
async function showPaper(c) {
  let src = null;
  try {
    const answer = await fetch(`/v1/supplier/certificates/${c.id}/photo`, { headers: { authorization: `Bearer ${token()}`, ...(ORG ? { 'x-basu-org': ORG } : {}) } });
    if (!answer.ok) throw new Error('Зургийг ачаалж чадсангүй.');
    src = URL.createObjectURL(await answer.blob());
  } catch (error) {
    toast(error.message, 'bad');
    return;
  }
  await popup({
    id: 'paper-photo',
    title: `Гэрчилгээ №${c.number}`,
    sub: `${esc(paperOrigin(c) ?? c.issuer)} · ${esc(dayLabel(c.issued_on))}`,
    width: 640,
    fields: [{ type: 'static', label: 'Зураг', html: `<img class="cert-photo" src="${src}" alt="Гэрчилгээ №${esc(c.number)}">` }],
    submit: 'Хаах',
    cancel: '',
    onSubmit: async () => true,
  });
  URL.revokeObjectURL(src);
}

async function removePaper(c) {
  const ok = await confirmPopup({
    title: 'Гэрчилгээг устгах уу?',
    text: `№${c.number} · ${c.issuer}. Буруу оруулсан бол устгаад дахин нэмнэ.`,
    ok: 'Устгах',
    danger: true,
    onConfirm: async () => {
      await sup(`/v1/supplier/certificates/${c.id}`, { method: 'DELETE' });
      return true;
    },
  });
  if (!ok) return;
  toast('Гэрчилгээ устлаа.', 'good');
  await reloadStall();
}

/** What a certificate is on, in words: «2 зар · 5 захиалга», or that nothing uses it yet. */
const paperUse = (c) => [c.listings ? `${c.listings} зар` : '', c.orders ? `${c.orders} захиалга` : ''].filter(Boolean).join(' · ') || 'Хэрэглээгүй';
const paperCanGo = (c) => may('org.idesh.stall:edit') && !c.listings && !c.orders && c.state === 'unchecked';
/** One Basu found false is not mended — a new one is written in; any other may be completed. */
const paperCanEdit = (c) => may('org.idesh.stall:edit') && c.state !== 'false';
/** Where the animals came from, or a nudge for a certificate written in before that was asked. */
const paperWhere = (c) => (paperOrigin(c) ? esc(paperOrigin(c)) : '<span class="chip" data-size="sm" data-s="pending">Гарал үүсэл дутуу</span>');

/** The certificates under the listings: a table at a desk, rows on a phone; adding one is a popup. */
function renderPapers() {
  const section = el('<section class="papers" id="papers"></section>');
  const label = el('<div class="section-label papers-head"><span>Мал эмнэлгийн гэрчилгээ</span></div>');
  if (may('org.idesh.stall:edit')) {
    const add = el(`<button class="btn" type="button" data-size="sm" id="add-paper">${ICON.plus}Гэрчилгээ нэмэх</button>`);
    add.addEventListener('click', async () => {
      if (await addPaper()) await reloadStall();
    });
    label.append(add);
  }
  section.append(label);
  if (!papers.length) {
    section.append(el('<p class="papers-none">Ачилт бүрийн гэрчилгээг нэг удаа нэмээд, зар болон захиалга дээрээ сонгоно. Кг-аар зарах маханд заавал хэрэгтэй.</p>'));
    return section;
  }
  const acts = (c, size = '') => {
    const sz = size ? ` data-size="${size}"` : '';
    const box = el(`<span>${paperCanEdit(c) ? `<button class="btn" type="button" data-a="edit"${sz}>Засах</button>` : ''}${c.has_photo ? `<button class="btn" type="button" data-a="photo"${sz}>Зураг</button>` : ''}${
      paperCanGo(c) ? `<button class="btn" type="button" data-v="danger" data-a="remove"${sz}>Устгах</button>` : ''
    }</span>`);
    box.querySelector('[data-a="edit"]')?.addEventListener('click', async () => {
      if (await paperForm(c)) await reloadStall();
    });
    box.querySelector('[data-a="photo"]')?.addEventListener('click', () => void showPaper(c));
    box.querySelector('[data-a="remove"]')?.addEventListener('click', () => void removePaper(c));
    return box;
  };
  if (wideDesk()) {
    section.append(
      dataTable({
        columns: [
          { key: 'number', label: 'Дугаар', render: (c) => `<span class="dt-two"><b class="mn">№${esc(c.number)}</b>${c.state === 'false' && c.check_note ? `<small>${esc(c.check_note)}</small>` : ''}</span>` },
          { key: 'origin', label: 'Гарал үүсэл', value: (c) => paperOrigin(c) ?? '', render: (c) => `<span class="dt-two">${paperWhere(c)}<small>${esc(c.issuer)}</small></span>` },
          { key: 'tests', label: 'Шинжилгээ', value: (c) => c.tests.map((t) => t.disease).join(', '), render: (c) => (c.tests.length ? esc(c.tests.map((t) => t.disease).join(', ')) : '—') },
          { key: 'issued_on', label: 'Олгосон өдөр', render: (c) => esc(dayLabel(c.issued_on)) },
          { key: 'use', label: 'Хэрэглэсэн', sortValue: (c) => c.listings + c.orders, render: (c) => esc(paperUse(c)) },
          { key: 'state', label: 'Төлөв', value: (c) => PAPER_STATE[c.state][1], render: (c) => dtCell.pill(...PAPER_STATE[c.state]) },
        ],
        search: false,
        actions: (c) => [...acts(c, 'sm').children],
        rowAttrs: (c) => ({ 'data-paper': c.id }),
        noun: 'гэрчилгээ',
        rows: papers,
      }).el,
    );
    return section;
  }
  const rows = el('<div class="rows"></div>');
  for (const c of papers) {
    const [state, word] = PAPER_STATE[c.state];
    const row = el(`
      <div class="card row" data-paper="${esc(c.id)}">
        <span class="main">
          <span class="name title"><span class="mn">№${esc(c.number)}</span> <span class="chip" data-size="sm" data-s="${state}">${word}</span></span>
          <span class="sub">${paperWhere(c)} · ${esc(dayLabel(c.issued_on))}</span>
          ${c.tests.length ? `<span class="sub">Шинжилгээ: ${esc(c.tests.map((t) => t.disease).join(', '))}</span>` : ''}
          <span class="sub">${esc(c.state === 'false' && c.check_note ? c.check_note : paperUse(c))}</span>
        </span>
        <span class="btns"></span>
      </div>`);
    row.querySelector('.btns').append(...acts(c).children);
    rows.append(row);
  }
  section.append(rows);
  return section;
}

/* ── the stall ───────────────────────────────────────────────────── */

/** A listing's state in a word: what a guest can do with it now. */
const listingState = (l) => (!l.active ? ['off', 'Зогссон'] : l.remaining <= 0 ? ['gone', 'Дууссан'] : ['active', 'Идэвхтэй']);
/** What a listing says about delivery: its fee, free, or none. */
const deliveryWord = (l) => (l.delivers ? (l.delivery_fee_mnt ? `хүргэлт ${mnt(l.delivery_fee_mnt)}` : 'хүргэлт үнэгүй') : 'хүргэхгүй');
/** «Хонь · бүтэн, ~38 кг · Архангай, Их тамир» — what the listing is, after its title. */
const listingWhat = (l) =>
  `${KIND[l.kind] ?? l.kind} · ${l.unit === 'whole' ? `бүтэн, ~${l.approx_kg} кг` : `кг-аар, доод тал нь ${l.min_qty} кг`} · ${esc(l.origin)}${cutWord(l)}`;
/** « · задаргаа: мөчилсөн, хоолны хэмжээгээр +15,000₮» — the ways a whole animal's listing offers, after what it is. */
const cutWord = (l) =>
  l.breakdown ? ` · задаргаа: ${l.breakdown.styles.map((s) => esc(s.label.toLowerCase())).join(', ')}${l.breakdown.cut_fee_mnt ? ` +${mnt(l.breakdown.cut_fee_mnt)}` : ''}` : '';
/** The marks beside a listing's name: its tier while it lasts, and a state other than on sale. */
function listingMarks(l) {
  const [state, word] = listingState(l);
  // Meat by the kilogram with no certificate is from before certificates were asked for; one is put on in «Засах».
  const paper = l.unit === 'kg' && !l.certificate ? ' <span class="chip" data-size="sm" data-s="pending">Гэрчилгээгүй</span>' : '';
  return `${state === 'active' ? '' : ` <span class="chip" data-size="sm" data-s="${state}">${word}</span>`}${paper}${
    l.tier ? ` <span class="chip tier" data-size="sm">${l.tier === 'vip' ? 'VIP' : 'Онцгой'} · ${dayOfStamp(l.tier_until)} хүртэл</span>` : ''
  }`;
}

/**
 * The supplier's own listings, edited here and nowhere else. Twenty sheep
 * becoming fifteen sold is a fact only they know; ops does not edit numbers
 * on a phone. The page only shows them: adding one and changing one are
 * popups.
 */
function renderStall(listings) {
  const stall = document.getElementById('stall');
  if (!stall) return;
  const canEdit = may('org.idesh.stall:edit');
  const head = el(pageHead('Миний зар', 'Зочид эндээс захиална.'));
  if (canEdit && listings.length) {
    const addButton = el(`<button class="btn" data-v="primary" type="button" id="add">${ICON.plus}Зар нэмэх</button>`);
    addButton.addEventListener('click', () => void addListing());
    headActs(head, addButton);
  }
  stall.replaceChildren(head);

  if (!listings.length) {
    stall.append(
      blank({
        icon: ICON.stall,
        tone: 'accent',
        frame: true,
        title: 'Эхний зараа нэмнэ үү',
        text: canEdit ? 'Зочид таны зараас захиална. Зар оруулах үнэгүй.' : 'Зар нэмэх, засах нь эзэн, менежерийн ажил.',
        action: canEdit ? { label: 'Зар нэмэх', primary: true, id: 'add', onClick: () => void addListing() } : null,
      }),
    );
    if (papers.length) stall.append(renderPapers());
    return;
  }
  stall.append(wideDesk() ? stallTable(listings) : stallRows(listings), renderPapers());
}

/** On a phone: one row per listing, its numbers in words, at most two buttons a thumb can hit. */
function stallRows(listings) {
  const rows = el('<div class="rows" data-rows></div>');
  for (const l of listings) rows.append(renderRow(l));
  return rows;
}

function renderRow(l) {
  const kg = l.unit === 'kg';
  const row = el(`
    <div class="card row" data-listing="${esc(l.id)}"${l.active ? '' : ' data-off'}>
      <span class="lead">${thumb(l, 'lg')}</span>
      <span class="main">
        <span class="name title">${esc(l.title)}${listingMarks(l)}</span>
        <span class="sub">${listingWhat(l)} · ${deliveryWord(l)}</span>
        <span class="nums">
          <span class="num">${money(l.price_mnt)}<small>${kg ? '1 кг' : 'толгой бүр'}</small></span>
          <span class="num">${esc(l.remaining)}${kg ? ' кг' : ''}<small>үлдсэн, нийт ${esc(l.quantity)}</small></span>
          <span class="num">${esc(dayShort(l.ready_from))}<small>бэлэн болно</small></span>
        </span>
      </span>
      <span class="btns">${rowActions(l)}</span>
    </div>`);
  wireActions(row, l);
  return row;
}

/** The next useful thing to do with a listing, and changing it: put a live one first, put a paused one back. */
function rowActions(l, size = '') {
  const sized = size ? ` data-size="${size}"` : '';
  const next =
    l.active && l.remaining > 0
      ? may('org.idesh.stall:promote')
        ? `<button class="btn" type="button" data-a="promote"${sized}>${l.tier ? 'Сунгах' : 'Онцлох'}</button>`
        : ''
      : !l.active && may('org.idesh.stall:edit')
        ? `<button class="btn" type="button" data-a="toggle"${sized}>Идэвхжүүлэх</button>`
        : '';
  const edit = may('org.idesh.stall:edit') ? `<button class="btn" type="button" data-a="edit"${sized}>Засах</button>` : '';
  return next + edit;
}

function wireActions(box, l) {
  box.querySelector('[data-a="promote"]')?.addEventListener('click', () => void promote(l));
  box.querySelector('[data-a="edit"]')?.addEventListener('click', () => void editListing(l));
  box.querySelector('[data-a="toggle"]')?.addEventListener('click', async (e) => {
    const button = e.currentTarget;
    pressing(button, true);
    try {
      await sup(`/v1/supplier/listings/${l.id}`, { method: 'PATCH', body: { active: true } });
      toast('Зар дахин зочдод харагдаж байна.', 'good');
      await reloadStall();
    } catch (error) {
      toast(error.message, 'bad');
      pressing(button, false);
    }
  });
}

async function reloadStall() {

/**
 * A number as a person types it. «460 000», «460,000» and «460.000» are four
 * hundred and sixty thousand — a dot or a comma before groups of exactly
 * three digits is a thousands mark — while «38.5» and «38,5» are thirty-eight
 * and a half. Anything else is NaN, and the check that reads it says so in
 * words. Where the stall counts in wholes (a price, how many, a minimum), a
 * decimal is refused there rather than rounded or multiplied here.
 */
const asNumber = (value) => {
  const s = String(value ?? '').trim().replace(/[\s'’]/g, '');
  if (s === '') return NaN;
  return /^\d{1,3}([.,]\d{3})+$/.test(s) ? Number(s.replace(/[.,]/g, '')) : Number(s.replace(',', '.'));
};
/** The day a week from today — the server's, else Ulaanbaatar's by this computer's clock — for a new listing's ready day. */
function weekFrom(day) {
  const d = new Date(`${day ?? ubParts().day}T12:00:00+08:00`);
  d.setUTCDate(d.getUTCDate() + 7);
  return d.toISOString().slice(0, 10);
}

/**
 * Put a unit beside a popup's number — ₮ after a price, кг after a weight —
 * the way the design system's affix field draws one.
 */
function affix(sheet, name, unit) {
  const input = sheet?.querySelector(`[name="${name}"]`);
  if (!input || input.parentElement.classList.contains('affix')) return;
  const wrap = document.createElement('span');
  wrap.className = 'affix';
  input.replaceWith(wrap);
  const i = document.createElement('i');
  i.textContent = unit;
  wrap.append(input, i);
}

/** Show or hide a popup field — hidden, it is not sent either. */
function fieldShown(sheet, name, on) {
  const input = sheet?.querySelector(`[name="${name}"]`);
  if (!input) return;
  input.disabled = !on;
  const field = input.closest('.field');
  if (field) field.hidden = !on;
}

/** Name a popup field anew — «Нэг толгойн үнэ» becomes «1 кг-ийн үнэ» when the unit does. */
function fieldLabel(sheet, name, words) {
  const label = sheet?.querySelector(`[name="${name}"]`)?.closest('.field')?.querySelector(':scope > span');
  if (label) label.textContent = words;
}

/** Delivery and its fee travel together: no delivery, no fee to type — the field is not there until it is ticked. */
function wireDelivery(sheet) {
  const delivers = sheet?.querySelector('[name="delivers"]');
  if (!delivers) return;
  const sync = () => fieldShown(sheet, 'delivery_fee_mnt', delivers.checked);
  delivers.addEventListener('change', () => {
    sync();
    if (delivers.checked) sheet.querySelector('[name="delivery_fee_mnt"]')?.focus();
  });
  sync();
}

/**
 * Задаргаа on a listing's popup: the ways a whole animal is handed over, as
 * boxes, and the fee for cutting small. Whoever cuts small also joints, so
 * that box follows; a cow is never one carcass; meat by the kilogram is asked
 * nothing. The fee is there only once cutting is ticked.
 */
const CUT_BOXES = (on = []) => [
  ['bd_carcass', 'Бүтэн гулуузаар өгнө', on.includes('carcass'), { hint: 'Задлахгүй, гулуузаар нь. Зөвхөн хонь, ямаа.' }],
  ['bd_jointed', 'Мөчилж өгнө', on.includes('jointed'), { hint: 'Үе мөчөөр нь салгана: хаа, гуя, ууц, нуруу, хавирга, хүзүү.' }],
  ['bd_cut', 'Жижиглэж, ууталж өгнө', on.includes('cut'), { hint: 'Зочин бүгдийг нь, эсвэл хэсэг бүрээр сонгож жижиглүүлнэ.' }],
];
const CUT_FIELDS = (l = null) => [
  { type: 'checks', label: 'Задаргаа', options: CUT_BOXES(l?.breakdown?.styles.map((s) => s.id) ?? []), hint: 'Чагталсан сонголтоос зочин захиалахдаа сонгоно. Юу ч чагтлахгүй бол зочноос асуухгүй.' },
  { name: 'cut_fee_mnt', label: 'Жижиглэх төлбөр, нэг толгойд', format: 'money', value: l?.breakdown?.styles.some((s) => s.id === 'cut') ? String(l.breakdown.cut_fee_mnt) : '', hint: 'Нэмэлт төлбөр авахгүй бол 0. Махны үнэд тооцогдоно.' },
];
/** The boxes as the server reads them: the styles ticked, and the fee when cutting is one of them. */
function cutAnswer(v) {
  const cut = Boolean(v.bd_cut);
  const styles = [v.bd_carcass ? 'carcass' : '', v.bd_jointed || cut ? 'jointed' : '', cut ? 'cut' : ''].filter(Boolean);
  if (!cut) return { breakdown_styles: styles, cut_fee_mnt: 0 };
  const fee = asNumber(v.cut_fee_mnt);
  if (!Number.isInteger(fee) || fee < 0) throw refuse('cut_fee_mnt', 'Жижиглэх төлбөрөө бичнэ үү — нэмэлт төлбөргүй бол 0.');
  return { breakdown_styles: styles, cut_fee_mnt: fee };
}
function wireCut(sheet, { whole = () => true, small = () => true } = {}) {
  const box = (name) => sheet?.querySelector(`[name="${name}"]`);
  const [carcass, jointed, cut] = ['bd_carcass', 'bd_jointed', 'bd_cut'].map(box);
  if (!carcass || !jointed || !cut) return () => {};
  const group = cut.closest('.field');
  const sync = () => {
    const on = whole();
    group.hidden = !on;
    for (const b of [carcass, jointed, cut]) b.disabled = !on;
    // One carcass is a sheep's or a goat's.
    if (on && !small()) {
      carcass.checked = false;
      carcass.disabled = true;
    }
    // Whoever cuts small also joints.
    if (on && cut.checked) {
      jointed.checked = true;
      jointed.disabled = true;
    }
    fieldShown(sheet, 'cut_fee_mnt', on && cut.checked);
  };
  cut.addEventListener('change', () => {
    sync();
    if (cut.checked) sheet.querySelector('[name="cut_fee_mnt"]')?.focus();
  });
  sync();
  return sync;
}

/**
 * On a touch screen a form popup opens on the form, not on the keyboard: the
 * popup takes the focus itself (it stays inside the dialog), and the person
 * taps the field they came to change.
 */
function noKeyboard(sheet) {
  if (sheet && typeof matchMedia === 'function' && matchMedia('(pointer:coarse)').matches) sheet.focus();
}

/**
 * A refusal that knows its field. Thrown from a popup's answer, popup() says
 * why under that field, marks it and puts the cursor in it; typing in it takes
 * the word back.
 */
const refuse = (field, message) => Object.assign(new Error(message), { field });

/**
 * What the server would refuse, said in words about the listing rather than
 * «the order changed». A past ready day is refused for a new listing, and for
 * an old one only when it is the day being changed.
 */
function checkListing(v, { unit, sold = 0, day = null, keptDay = null }) {
  const price = asNumber(v.price_mnt);
  if (!Number.isInteger(price) || price <= 0) throw refuse('price_mnt', 'Үнээ төгрөгөөр, бүхэл тоогоор бичнэ үү.');
  if (unit === 'whole' && v.approx_kg !== undefined && !(asNumber(v.approx_kg) > 0)) {
    throw refuse('approx_kg', 'Нэг толгойн ойролцоо жинг кг-аар бичнэ үү, жишээ нь 38.5.');
  }
  if (unit === 'kg' && v.min_qty) {
    const least = asNumber(v.min_qty);
    if (!Number.isInteger(least) || least <= 0) throw refuse('min_qty', 'Доод захиалгыг бүхэл кг-аар бичнэ үү.');
  }
  const qty = asNumber(v.quantity);
  if (!Number.isInteger(qty) || qty < 0) throw refuse('quantity', `Хэдэн ${unit === 'kg' ? 'кг' : 'толгой'} байгааг бүхэл тоогоор бичнэ үү.`);
  if (qty < sold) throw refuse('quantity', `Аль хэдийн ${sold} зарагдсан — нийт тоо ${sold}-аас бага байж болохгүй.`);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v.ready_from ?? '')) throw refuse('ready_from', 'Бэлэн болох өдрөө сонгоно уу.');
  if (day && v.ready_from < day && v.ready_from !== keptDay) {
    throw refuse('ready_from', 'Бэлэн болох өдөр өнгөрсөн байна — өнөөдөр эсвэл дараах өдрийг сонгоно уу.');
  }
  if (v.delivers) {
    const fee = asNumber(v.delivery_fee_mnt);
    if (!Number.isInteger(fee) || fee < 0) throw refuse('delivery_fee_mnt', 'Хүргэлтийн төлбөрөө бичнэ үү — үнэгүй хүргэх бол 0.');
  }
  return { price, qty };
}

/**

      // Money fields group the tögrög as they are typed («460,000 ₮») and hand the answer the digits.
      { name: 'price_mnt', label: 'Нэг толгойн үнэ', format: 'money', required: true },
      { name: 'approx_kg', label: 'Ойролцоо жин', inputmode: 'decimal', hint: 'Бодит жин зөрсөн ч үнэ өөрчлөгдөхгүй.' },
      { name: 'min_qty', label: 'Доод захиалга', inputmode: 'numeric', hint: 'Зочин хамгийн багадаа хэдэн кг авах вэ.' },
      { name: 'quantity', label: 'Хэдэн толгой байгаа', inputmode: 'numeric', required: true },
