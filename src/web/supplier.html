      { name: 'note', label: 'Тайлбар (заавал биш)', type: 'textarea', placeholder: 'Толгой, дотор мөнтэйгээ…' },
    ],
    submit: 'Зар нэмэх',
    onSubmit: async (v) => {
      const unit = v.unit;
      const { price, qty } = checkListing(v, { unit, day });
      if (unit === 'kg' && !v.certificate_id) throw refuse('certificate_id', 'Кг-аар зарах махны гэрчилгээг сонгоно уу, эсвэл шинээр нэмнэ үү.');
      const body = {
        kind: v.kind,
        unit,
        title: v.title,
        price_mnt: price,
        quantity: qty,
        origin: v.origin,
        ready_from: v.ready_from,
        delivers: Boolean(v.delivers),
        delivery_fee_mnt: v.delivers ? asNumber(v.delivery_fee_mnt) : 0,
        note: v.note ?? '',
      };
      if (unit === 'whole') Object.assign(body, { approx_kg: asNumber(v.approx_kg) }, cutAnswer(v));
      else body.min_qty = v.min_qty ? asNumber(v.min_qty) : 1;
      if (unit === 'kg') body.certificate_id = v.certificate_id;
      // Made once: a press again after a photograph failed sends the photographs, not a second listing.
      made ??= (await sup('/v1/supplier/listings', { method: 'POST', body })).listing.id;
      await saveShots(made, shots);
      return true;
    },
  });
  const sheet = document.getElementById('listing-new');
  shots = wireShots(sheet);
  noKeyboard(sheet);
  affix(sheet, 'approx_kg', 'кг');
  affix(sheet, 'min_qty', 'кг');
  const unit = sheet?.querySelector('[name="unit"]');
  const kind = sheet?.querySelector('[name="kind"]');
  const syncCut = wireCut(sheet, { whole: () => unit?.value !== 'kg', small: () => ['sheep', 'goat'].includes(kind?.value) });
  kind?.addEventListener('change', syncCut);
  const syncUnit = () => {
    const kg = unit.value === 'kg';
    syncCut();
    fieldShown(sheet, 'approx_kg', !kg);
    fieldShown(sheet, 'min_qty', kg);
    fieldShown(sheet, 'certificate_id', kg);
    fieldLabel(sheet, 'price_mnt', kg ? '1 кг-ийн үнэ' : 'Нэг толгойн үнэ');
    fieldLabel(sheet, 'quantity', kg ? 'Нийт хэдэн кг байгаа' : 'Хэдэн толгой байгаа');
  };
  unit?.addEventListener('change', syncUnit);
  if (unit) syncUnit();
  wirePaperSelect(sheet);
  wireDelivery(sheet);
  if (!(await done)) return;
  toast('Зар нэмэгдлээ — зочдод харагдаж байна.', 'good');
  await reloadStall();
}

/**
 * Change a listing: everything the server lets a listing change, in one
 * popup — and whether guests see it at all. The kind, the unit and the
 * origin are what the listing is; a different animal is a new listing.
 */
async function editListing(l) {
  if (!may('org.idesh.stall:edit')) return;
  const kg = l.unit === 'kg';
  const day = await knowToday();
  await loadPapers().catch(() => {});
  // The certificate the listing is under now, by its number: the list of them is this business's own.
  const held = l.certificate ? papers.find((c) => c.number === l.certificate.number) : null;
  const done = popup({
    id: 'listing-edit',
    title: 'Зар засах',
    sub: listingWhat(l),
    width: 640,
    fields: [
      { name: 'title', label: 'Гарчиг', value: l.title, required: true, wide: true },
      { name: 'price_mnt', label: kg ? '1 кг-ийн үнэ' : 'Нэг толгойн үнэ', format: 'money', value: String(l.price_mnt), required: true },
      { name: 'quantity', label: kg ? 'Нийт хэдэн кг' : 'Нийт хэдэн толгой', inputmode: 'numeric', value: String(l.quantity), required: true, hint: l.sold ? `${l.sold} нь зарагдсан — үүнээс бага болгохгүй.` : 'Одоогоор зарагдаагүй.' },
      { name: 'ready_from', label: 'Бэлэн болох өдөр', type: 'date', value: l.ready_from, required: true },
      ...(kg
        ? [{ name: 'certificate_id', label: 'Мал эмнэлгийн гэрчилгээ', type: 'select', wide: true, options: held ? [[held.id, `${paperLine(held)}${held.state === 'false' ? ' — хүчингүй' : ''}`], ...paperOptions('').slice(1).filter(([id]) => id !== held.id)] : paperOptions('Сонгоно уу'), value: held?.id ?? '', hint: 'Шинэ ачилтын мах зарж эхлэхдээ гэрчилгээг нь солино.' }]
        : []),
      { type: 'checks', label: 'Хүргэлт', options: [['delivers', 'Хүргэлт хийнэ', Boolean(l.delivers)]] },
      // A listing that did not deliver offers no fee to keep: ticking delivery asks for one, never assumes 0.
      { name: 'delivery_fee_mnt', label: 'Хүргэлтийн төлбөр', format: 'money', value: l.delivers ? String(l.delivery_fee_mnt ?? 0) : '', hint: 'Үнэгүй хүргэх бол 0.' },
      ...(kg ? [] : CUT_FIELDS(l)),
      SHOTS_FIELD,
      { name: 'note', label: 'Тайлбар (заавал биш)', type: 'textarea', value: l.note ?? '' },
      { type: 'checks', label: 'Зочдод', options: [['active', 'Зочдод харагдана', Boolean(l.active), { hint: 'Арилгавал зар зогсож, шинэ захиалга авахгүй. Авсан захиалга хэвээр.' }]] },
    ],
    submit: 'Хадгалах',
    onSubmit: async (v) => {
      const { price, qty } = checkListing({ ...v, approx_kg: undefined }, { unit: l.unit, sold: l.sold ?? 0, day, keptDay: l.ready_from });
      await sup(`/v1/supplier/listings/${l.id}`, {
        method: 'PATCH',
        body: {
          title: v.title,
          price_mnt: price,
          quantity: qty,
          ready_from: v.ready_from,
          delivers: Boolean(v.delivers),
          ...(v.delivers ? { delivery_fee_mnt: asNumber(v.delivery_fee_mnt) } : {}),
          note: v.note ?? '',
          active: Boolean(v.active),
          ...(kg ? {} : cutAnswer(v)),
          ...(v.certificate_id && v.certificate_id !== held?.id ? { certificate_id: v.certificate_id } : {}),
        },
      });
      await saveShots(l.id, shots);
      return true;
    },
  });
  const sheet = document.getElementById('listing-edit');
  const shots = wireShots(sheet, l.photos ?? []);
  noKeyboard(sheet);
  wirePaperSelect(sheet);
  wireDelivery(sheet);
  wireCut(sheet, { small: () => ['sheep', 'goat'].includes(l.kind) });
  if (!(await done)) return;
  toast('Хадгалагдлаа.', 'good');
  await reloadStall();
}

/**
 * Put a listing first, paid to Basu. Two steps in one popup: pick the tier at
 * the desk's price, then pay the QPay invoice and say so — the tier starts
 * when the bank says the money arrived, not when the button is pressed.
 */
async function promote(l) {
  let offer;
  try {
    offer = await sup('/v1/supplier/promotions');
  } catch (error) {
    return toast(error.message, 'bad');
  }
  const plans = offer.plans.filter((p) => !(l.tier === 'vip' && p.tier === 'featured'));
  const WHAT = {
    featured: 'Энгийн зараас дээгүүр, «Онцгой» тэмдэгтэй.',
    vip: 'Бүх зараас дээр, «VIP» тэмдэгтэй. Нүүр хуудсанд эхэлж гарна.',
  };
  const cards = plans
    .map(
      (p, i) => `<label class="promo-opt" data-tier="${esc(p.tier)}">
        <input type="radio" name="tier" value="${esc(p.tier)}"${i === plans.length - 1 ? ' checked' : ''}>
        <b>${esc(p.name)}<span class="badge">${esc(p.days)} хоног</span></b>
        <span class="price">${p.price_mnt ? mnt(p.price_mnt) : 'Үнэгүй'}</span>
        <small>${WHAT[p.tier]}${l.tier === p.tier ? ' Одоогийн хугацаан дээр нэмэгдэнэ.' : ''}</small>
      </label>`,
    )
    .join('');
  let started = null;
  const done = await popup({
    title: l.tier ? 'Онцлолтоо сунгах' : 'Зарыг онцлох',
    sub: esc(l.title),
    width: 520,
    fields: [
      { type: 'static', label: 'Зэрэглэл', html: `<div class="promo-opts">${cards}</div>` },
      { type: 'note', text: 'Basu-д QPay-ээр, банкны аппаасаа төлнө. Төлбөр орсон даруйд эхэлж, хугацаа дуусахад энгийн зар болно.' },
    ],
    submit: 'Үргэлжлүүлэх',
    onSubmit: async (values, box) => {
      if (!started) {
        started = await sup(`/v1/supplier/listings/${l.id}/promote`, { method: 'POST', body: { tier: values.tier } });
        if (!started.invoice) return true;
        // The provider's page, and only an http(s) one: an address that runs here is no way to pay.
        const payAt = navHref(started.invoice.action_url);
        const pay = payAt
          ? `<a class="btn" data-size="lg" href="${esc(payAt)}" target="_blank" rel="noopener">QPay-ээр төлөх →</a>`
          : '<span class="cap">Туршилтын сервер: нэхэмжлэх шууд төлөгдсөнд тооцогдоно.</span>';
        box.step({
          title: 'QPay-ээр төлөх',
          sub: `${esc(started.promotion.name)} · ${esc(started.promotion.days)} хоног · ${esc(l.title)}`,
          fields: [
            { type: 'static', label: 'Төлөх дүн', html: `<div class="promo-pay"><span class="amount">${mnt(started.invoice.amount_mnt)}</span>${pay}</div>` },
            { type: 'note', text: 'Банкны аппаасаа төлсний дараа «Төлсөн» дарна уу. Бид банкнаас шалгаад зарыг тань онцолно.' },
          ],
          submit: 'Төлсөн',
        });
        return false;
      }
      await sup(`/v1/supplier/promotions/${started.promotion.id}/settle`, { method: 'POST' });
      return true;
    },
  });
  if (!done) return;
  toast(l.tier ? 'Хугацаа сунгагдлаа.' : 'Зар онцлогдлоо.', 'good');
  await reloadStall();
}

/* ── where the money goes ────────────────────────────────────────── */

/** Whether finance has checked the account against the contract: the one thing that holds a payout back. */
function bankState(b) {
  if (!b.bank_account) return ['declined', 'Бүртгэгдээгүй', 'Данс нэмэхгүй бол олголт хийгдэхгүй.'];
  if (b.bank_verified === false) return ['pending', 'Шалгаж байна', 'Basu санхүү дансыг гэрээтэй тулгаж баталгаажуулах хүртэл олголт хийгдэхгүй.'];
  if (b.bank_verified === true) return ['verified', 'Баталгаажсан', 'Олголт энэ данс руу очно.'];
  return ['', '', ''];
}

/**
 * The account a supplier's money goes to, as a card: where, whose, whether
 * it has been checked, and — for an owner — the button that changes it.
 */
function bankCard(b) {
  const [state, word, says] = bankState(b);
  const card = el(`
    <section class="card bank" id="bank">
      <div class="card-head"><h2>Олголт очих данс</h2>${word ? `<span class="chip" data-s="${state}">${word}</span>` : ''}</div>
      ${
        b.bank_account
          ? `<dl class="facts">
              <div><dt>Банк</dt><dd>${esc(b.bank_name)}</dd></div>
              <div><dt>Дансны дугаар</dt><dd><span class="digits">${esc(b.bank_account)}</span></dd></div>
              <div><dt>Эзэмшигч</dt><dd>${esc(b.bank_holder)}</dd></div>
            </dl>`
          : ''
      }
      <div class="card-foot"><span class="cap">${says || 'Олголт энэ данс руу очно.'}</span></div>
    </section>`);
  const foot = card.querySelector('.card-foot');
  if (may('org.idesh.profile:bank')) {
    const change = el(`<button class="btn" type="button" id="bank-edit"${b.bank_account ? '' : ' data-v="primary"'}>${b.bank_account ? 'Данс солих' : 'Данс нэмэх'}</button>`);
    change.addEventListener('click', () => void changeBank(b));
    foot.append(change);
  } else {
    foot.append(el('<span class="cap">Данс солих нь зөвхөн эзний эрх.</span>'));
  }
  return card;
}

/**
 * Where the money goes is the one field a stolen phone would change, so it
 * takes the owner's own password. An account with none yet sets one here —
 * a code to the address on the account, then the password (api.js
 * passwordPopup) — and goes straight on to the account, the password just
 * chosen in hand, rather than being sent to the profile to find the way.
 * `password` is that one: it confirms the account without being asked for
 * again, and the one word at the end says both were kept. A wrong password
 * typed here is said under its field. Resolves to true once the account is
 * kept, null when a popup was closed first.
 */
async function changeBank(b, password = null) {
  let me = null;
  if (!password) {
    try {
      me = await api('/v1/me', { token: token() });
    } catch {
      // Asked for the password anyway; the server says if it is wrong.
    }
  }
  if (me && !me.has_password) {
    return passwordPopup({
      token: token(),
      email: me.email,
      why: 'Олголт очих дансыг өөрийн нууц үгээр баталгаажуулна — утсаа алдсан ч мөнгө тань өөр данс руу явахгүй. Таны бүртгэлд нууц үг алга: эхлээд тохируулаад, дараа нь дансаа оруулна.',
      // One word at the end, from the account's popup, for the password and the account both.
      quiet: true,
      // Set just now — or already set in another tab (null), and then asked for in the account's popup.
      then: ({ password: chosen }) => changeBank(b, chosen ?? null),
    });
  }
  const done = popup({
    id: 'bank-change',
    title: b.bank_account ? 'Данс солих' : 'Данс нэмэх',
    sub: 'Олголт энэ данс руу очно',
    width: 560,
    fields: [
      // «Бусад банк» opens the field for its name; a bank on the list needs none.
      { name: 'bank_name', label: 'Банк', type: 'select', options: bankOptions('Банкаа сонгоно уу'), value: bankPick(b.bank_name), required: true, onChange: (picked, form) => form.show('bank_other', picked === OTHER_BANK) },
      { name: 'bank_other', label: 'Банкны нэр', placeholder: 'Жагсаалтад байхгүй банк', value: bankPick(b.bank_name) === OTHER_BANK ? b.bank_name : '', required: true },
      // An IBAN starts with MN: the keyboard with letters, the letters up as they are typed.
      { name: 'bank_account', label: 'Дансны дугаар', inputmode: 'text', autocomplete: 'off', placeholder: 'MN12 0005 0050 1234 5678', hint: 'IBAN (MN + 18 орон) эсвэл дансны дугаар (6–20 орон).', value: b.bank_account ?? '', required: true, attrs: { autocapitalize: 'characters', spellcheck: 'false' } },
      { name: 'bank_holder', label: 'Данс эзэмшигчийн нэр', value: b.bank_holder ?? '', required: true, wide: true },
      ...(password ? [] : [{ name: 'password', label: 'Таны нууц үг', type: 'password', autocomplete: 'current-password', required: true, wide: true, hint: 'Мөнгө очих газар солигдож байгаа тул өөрийн нууц үгээр баталгаажуулна.' }]),
      { type: 'note', text: 'Basu санхүү шинэ дансыг гэрээтэй тулгаж баталгаажуулах хүртэл олголт хийгдэхгүй. Солигдсон тухай эзэн бүрт мэдэгдэл ирнэ.' },
    ],
    submit: 'Хадгалах',
    onSubmit: async (v) => {
      const account = v.bank_account.replace(/\s+/g, '').toUpperCase();
      const badForm = ACCOUNT_WORDS;
      const bank = bankOf(v.bank_name, v.bank_other);
      if (!bank) throw refuse(v.bank_name === OTHER_BANK ? 'bank_other' : 'bank_name', 'Банкныхаа нэрийг бичнэ үү.');
      if (!ACCOUNT.test(account)) throw refuse('bank_account', badForm);
      try {
        await sup('/v1/supplier/profile', {
          method: 'PATCH',
          body: { bank_name: bank, bank_account: account, bank_holder: v.bank_holder, password: password ?? v.password },
        });
      } catch (error) {
        // The server takes the same forms the application does; the one thing this change can say
        // «the state changed» about is the number's form, said under it in the page's own words.
        if (error.code === 'WRONG_STATE') throw refuse('bank_account', badForm);
        // A wrong password under the field it was typed in, not over the bank's name.
        if (error.code === 'BAD_PASSWORD') throw refuse('password', 'Нууц үг буруу байна.');
        throw error;
      }
      return true;
    },
  });
  const sheet = document.getElementById('bank-change');
  noKeyboard(sheet);
  if (!(await done)) return null;
  toast(password ? 'Нууц үг, данс хоёулаа хадгалагдлаа. Basu санхүү шалгаж баталгаажуулна.' : 'Данс хадгалагдлаа. Basu санхүү шалгаж баталгаажуулна.', 'good');
  show(tab);
  return true;
}

/* ── the money ───────────────────────────────────────────────────── */

const SETTLE_WORD = { paid: ['paid', 'Шилжүүлсэн'], approved: ['queued', 'Баталсан'], due: ['due', 'Хүлээгдэж байна'] };
const settleState = (t) => SETTLE_WORD[t.state] ?? ['', t.state];

/**
 * When a handed-over order's payout appears: a day after the handover the
 * order closes and its payout line opens (src/idesh, `housekeeping`); Basu
 * then sends it on a working day.
 */
const PAYOUT_AFTER_MS = 24 * 60 * 60 * 1000;
/** The day a handed-over order's payout line opens, in Ulaanbaatar: «10-р сарын 4». */
const payoutDay = (o) => (o.handed_at ? dayOfStamp(new Date(Date.parse(o.handed_at) + PAYOUT_AFTER_MS).toISOString()) : '');

/**
 * What the supplier is owed and what has been sent: one line per order,
 * with the rate and the account the contract names. The list is ops's to
 * act on; here it is the supplier's to check.
 */
async function renderMoney(bank = false) {
  const box = document.getElementById('money');
  if (!box) return;
  let data;
  let profile = null;
  let handed = [];
  try {
    [data, profile, handed] = await Promise.all([
      sup('/v1/supplier/money'),
      sup('/v1/supplier/profile').catch(() => null),
      // Handed over and not closed yet: money on its way, though no payout line holds it so far.
      may('org.idesh.orders')
        ? sup('/v1/supplier/orders?scope=live&q=').then((r) => r.orders.filter((o) => o.state === 'HANDED' && typeof o.payout_mnt === 'number')).catch(() => [])
        : [],
    ]);
  } catch (error) {
    if (error.status === 401) return signOut();
    box.replaceChildren(blank({ icon: ICON.money, size: 'sm', title: 'Тооцоо ачаалж чадсангүй', text: error.message }));
    return;
  }
  if (!document.getElementById('money')) return;
  const due = data.settlements.filter((t) => t.state !== 'paid');
  const owed = due.reduce((sum, t) => sum + t.amount_mnt, 0);
  const paidOnes = data.settlements.filter((t) => t.state === 'paid');
  const paid = paidOnes.reduce((sum, t) => sum + t.amount_mnt, 0);
  // The soonest first: the one whose line opens next.
  const coming = handed.slice().sort((a, b) => String(a.handed_at).localeCompare(String(b.handed_at)));
  const comingSum = coming.reduce((sum, o) => sum + o.payout_mnt, 0);

  const parts = [];
  const cells = [];
  if (coming.length) {
    cells.push(el(`<div class="card stat kpi" id="coming-sum" data-money${longSum(comingSum)}><div class="lab">Удахгүй олгох</div><b>${money(comingSum)}</b><span>${coming.length} захиалга · ${esc(payoutDay(coming[0]))}-нөөс</span></div>`));
  }
  if (data.settlements.length) {
    cells.push(
      el(`<div class="card stat kpi"${longSum(owed)}><div class="lab">Basu шилжүүлэх</div><b>${money(owed)}</b><span>${due.length ? `${due.length} олголт хүлээгдэж байна` : 'бүгд шилжсэн'}</span></div>`),
      el(`<div class="card stat kpi"${longSum(paid)}><div class="lab">Шилжүүлсэн</div><b>${money(paid)}</b><span>${paidOnes.length ? `${paidOnes.length} олголт, нийт` : 'одоогоор алга'}</span></div>`),
    );
  }
  if (cells.length) {
    // Three on a phone: what comes next on a line of its own, the two that are settled under it.
    if (cells.length === 3) cells[0].setAttribute('data-span', '');
    const band = el('<div class="money-sum kpis kpi-band"></div>');
    band.append(...cells);
    parts.push(band);
  }
  const cards = el('<div class="cards"></div>');
  cards.append(
    bankCard({ ...data, bank_verified: profile?.bank_verified ?? null }),
    el(`<section class="card terms">
      <div class="card-head"><h2>Хэрхэн олгох вэ</h2></div>
      <dl class="facts">
        <div><dt>Шимтгэл</dt><dd><span class="mn">${data.commission_pct ?? '—'}%</span><small>махны үнээс; хүргэлтийн төлбөрөөс авахгүй</small></dd></div>
        <div><dt>Хэзээ</dt><dd>Хүлээлгэн өгснөөс хойш нэг хоногт<small>олголт үүсч, Basu ажлын өдөрт шилжүүлнэ</small></dd></div>
      </dl>
    </section>`),
  );
  parts.push(cards);
  // «When does Basu pay me?» right after a handover: the order, what it brings, and the day its payout line opens.
  if (coming.length) {
    parts.push(el('<div class="section-label">Удахгүй олгох</div>'));
    const comingAt = (o) => `${esc(dayOfStamp(o.handed_at))}-нд хүлээлгэн өгсөн · олголт ${esc(payoutDay(o))}-нөөс`;
    if (wideDesk()) {
      parts.push(
        dataTable({
          columns: [
            {
              key: 'title',
              label: 'Захиалга',
              value: (o) => `${o.title} ${o.qty} ${o.code}`,
              render: (o) => `<span class="it-cell">${thumb(o)}<span class="dt-two"><b>${what(o)}</b><small class="code">№${esc(o.code)}</small></span></span>`,

            { key: 'opens', label: 'Олголт гарах', sortValue: (o) => o.handed_at, render: (o) => `${esc(payoutDay(o))}-нөөс` },
            { key: 'payout_mnt', label: 'Танд', align: 'end', numeric: true, render: (o) => money(o.payout_mnt) },
          ],
          search: false,
          rowAttrs: (o) => ({ 'data-coming': o.id }),
          sort: { key: 'opens', desc: false },
          noun: 'захиалга',
          rows: coming,
        }).el,
      );
    } else {
      const list = el('<div class="list settle-list" data-rows id="coming"></div>');
      for (const o of coming) {
        list.append(
          el(`<div class="card line row" data-coming="${esc(o.id)}">
                <span class="lead">${thumb(o)}</span>
                <span class="main">
                  <span class="name title"><span class="mn">№${esc(o.code)}</span> · ${what(o)}</span>
                  <span class="sub">${comingAt(o)}</span>
                </span>
                <span class="end"><span class="amt val">${money(o.payout_mnt)}</span><span class="chip" data-size="sm" data-s="queued">Удахгүй</span></span>
              </div>`),
        );
      }
      parts.push(list);
    }
  }
  // The lines Basu holds: shown when there are any — or, with nothing on its way either, what this place is for.
  if (data.settlements.length || !coming.length) parts.push(el('<div class="section-label">Олголтууд</div>'));
  if (!data.settlements.length) {
    if (!coming.length) {
      parts.push(
        blank({
          icon: ICON.money,
          frame: true,
          title: 'Одоогоор олголт алга',
          text: 'Хүлээлгэн өгснөөс хойш нэг хоногт энд гарна.',
        }),
      );
    }
  } else if (wideDesk()) {
    parts.push(
      dataTable({
        columns: [
          { key: 'order_code', label: '№', render: (t) => `<span class="mono">№${esc(t.order_code)}</span>` },
          { key: 'memo', label: 'Юуны', render: (t) => esc(t.memo) },
          { key: 'state', label: 'Төлөв', value: (t) => settleState(t)[1], render: (t) => dtCell.pill(...settleState(t)) },
          { key: 'created_at', label: 'Үүссэн', render: (t) => dtCell.when(t.created_at) },
          { key: 'paid_at', label: 'Шилжүүлсэн', render: (t) => (t.paid_at ? `${dtCell.when(t.paid_at)}${t.reference ? `<span class="dt-sub">${esc(t.reference)}</span>` : ''}` : dtCell.none()) },
          { key: 'amount_mnt', label: 'Дүн', align: 'end', numeric: true, render: (t) => money(t.amount_mnt, t.state === 'paid' ? 'credit' : undefined) },
        ],
        search: data.settlements.length > 8 ? { placeholder: 'Олголт хайх…' } : false,
        rowAttrs: (t) => ({ 'data-settlement': t.id }),
        sort: { key: 'created_at', desc: true },
        noun: 'олголт',
        rows: data.settlements,
      }).el,
    );
  } else {
    const list = el('<div class="list settle-list" data-rows></div>');
    for (const t of data.settlements) {
      const isPaid = t.state === 'paid';
      const [s, word] = settleState(t);
      list.append(
        el(`<div class="card line row" data-settlement="${esc(t.id)}">
              <span class="main">
                <span class="name title"><span class="mn">№${esc(t.order_code)}</span> · ${esc(t.memo)}</span>
                <span class="sub">${
                  isPaid ? `Шилжүүлсэн ${when(t.paid_at)}${t.reference ? ` · ${esc(t.reference)}` : ''}` : `Үүссэн ${when(t.created_at)}`
                }</span>
              </span>
              <span class="end"><span class="amt val${isPaid ? ' paid' : ''}">${money(t.amount_mnt, isPaid ? 'credit' : undefined)}</span><span class="chip" data-size="sm" data-s="${s}">${word}</span></span>
            </div>`),
      );
    }
    parts.push(list);
  }
  box.replaceChildren(...parts);
  // Sent here by the business's «Данс нэмэх»: the account's popup, over the page it changes.
  if (bank && may('org.idesh.profile:bank')) void changeBank(data);
}

/** «9/8 14:05» for a timestamp the supplier reads across a list, as Ulaanbaatar reads it. */
function when(iso) {
  if (!iso) return '';
  const { day, clock } = ubParts(iso);
  return `${dayShort(day)} ${clock}`;
}

/* ── the module ──────────────────────────────────────────────────── */

const TABS = [
  { key: 'today', label: 'Өнөөдөр', icon: ICON.today, nav: 'today', needs: 'org.idesh.today' },
  { key: 'orders', label: 'Захиалга', icon: ICON.orders, nav: 'orders', needs: 'org.idesh.orders' },

];
/**
 * The tab to open: the one the address names — the dashboard links straight
 * to one — else today. After it, what the dashboard's button said it would
 * open there, once: `#stall/new` the new listing's popup, `#profile/bank` or
 * `#money/bank` the payout account's — so «Зар нэмэх» on the business's home
 * is one press, not a second one on this page.
 */
const [linkedTab, linkedAsk] = location.hash.slice(1).split('/');
let tab = linkedTab || 'today';
let asked = linkedAsk ?? null;
/** What the address asked for on arrival, taken once: a redraw of the same tab later opens nothing. */
function arrival() {
  const ask = asked;
  asked = null;
  return { add: ask === 'new' && tab === 'stall', bank: ask === 'bank' && (tab === 'profile' || tab === 'money') };
}
/** The desk frame's handles, when the page is at a desk. */
let deskNav = null;

/**
 * The tabs this person's role opens: all five for an owner or a manager;
 * the day, the orders and the stall for staff; the orders and the money for
 * an accountant — or whatever Basu has made those roles since.
 */
const tabsFor = () => TABS.filter((t) => may(t.needs));

/** The page's one h1: large on a phone, beside its lead on a desk. */
function pageHead(title, sub, subId) {
  return `<div class="page-head head"${isDesk() ? '' : ' data-large'}><div><h1>${title}</h1>${
    sub !== undefined ? `<p${subId ? ` id="${subId}"` : ''}>${sub}</p>` : ''
  }</div></div>`;
}
/** A page's own buttons, at the right of its head on a desk and under its title on a phone. */
function headActs(head, ...buttons) {
  const box = el('<div class="head-acts"></div>');
  box.append(...buttons.filter(Boolean));
  if (box.childElementCount) head.append(box);
  return head;
}

/**
 * Signing out is two taps: the first turns the button into the question for
 * four seconds, the second answers it — a stray tap on a counter tablet must
 * not sign the counter out. `buttons` are every way out on the frame.
 */
function twoTaps(buttons, word, leave, now = false) {
  let armed = null;
  const say = (asking) => {
    for (const b of buttons) {
      b.toggleAttribute('data-confirm', asking);
      const label = b.querySelector('.t');
      if (label) {
        label.textContent = asking ? 'Гарах уу?' : word;
        label.classList.toggle('sr-only', !asking);
      } else if (b.closest('.acct')) b.innerHTML = asking ? 'Гарах уу?' : NAV_ICON.out;
      else b.textContent = asking ? 'Гарах уу?' : word;
      b.setAttribute('aria-label', asking ? 'Гарах уу?' : word);
    }
  };
  return () => {
    if (now) return leave();
    if (armed) {
      clearTimeout(armed);
      armed = null;
      say(false);
      return leave();
    }
    say(true);
    armed = setTimeout(() => {
      armed = null;
      say(false);
    }, 4000);
  };
}

/**
 * The supplier's own app: the tabs this seat opens along the bottom of a
 * phone; at a desk, the dashboard's frame with this business as the place.
 */
function openModule() {
  const tabs = tabsFor();
  if (!tabs.some((t) => t.key === tab)) tab = tabs[0]?.key ?? 'today';
  frameIsDesk = isDesk();
  if (frameIsDesk) {
    void openDesk(tabs);
    return;
  }
  deskNav = null;
  const name = seat?.supplier?.name ?? '…';
  const role = ROLE_WORD[seat?.role] ? `Нийлүүлэгч · ${ROLE_WORD[seat.role]}` : 'Нийлүүлэгч';
  // Inside the app the way home leads, one tap; in a browser the corner signs out, asked twice.
  const frame = el(`
    <div class="shell">
      <header class="bar topbar sup"${shell.present ? ' data-shell' : ''}>
        ${shell.present ? `<button class="home" type="button" id="out" aria-label="Basu нүүр">${ICON.left}Basu</button>` : ''}
        <div class="title"><b class="supplier-name" id="supplier">${esc(name)}</b><span>${esc(role)}</span></div>
        ${shell.present ? '' : `<div class="act"><button class="btn out" type="button" data-v="quiet" data-icon id="out" aria-label="Гарах">${ICON.out}<span class="t sr-only">Гарах</span></button></div>`}
      </header>
      <nav class="tabs tabbar" aria-label="Хэсгүүд">
        ${tabs.map((t) => `<button type="button" data-tab="${t.key}">${t.icon}<span class="t">${t.label}</span>${t.key === 'today' ? '<span class="count" hidden></span>' : ''}</button>`).join('')}
      </nav>
      <main class="view" id="view"></main>
    </div>`);
  const outButton = frame.querySelector('#out');
  outButton.addEventListener('click', shell.present ? goHome : twoTaps([outButton], 'Гарах', signOut));
  frame.querySelector('.tabs').addEventListener('click', (e) => {
    const button = e.target.closest('button[data-tab]');
    if (button) show(button.dataset.tab);
  });
  root.replaceChildren(frame);
  applyDesk();
  show(tab, arrival());
  void countWork();
}

/** The count on «Өнөөдөр» from the first moment, not only once the day's tab has been opened. */
async function countWork() {
  if (!may('org.idesh.today')) return;
  try {
    const h = await sup('/v1/supplier/home');
    today = h.today ?? today;
    setTodo(h.lanes.paid + h.lanes.preparing + h.lanes.ready + h.lanes.dispatched);
  } catch {
    // The count waits for the board.
  }
}

/**
 * At a desk the supplier's pages sit in the dashboard's own frame: the
 * business as the place, and beside its supplier tabs the dashboard's pages
 * for it — its people, its details, who may do what — one click away.
 * Inside the Basu app it has its tabs alone.
 */
async function openDesk(tabs) {
  const name = seat?.supplier?.name ?? 'Нийлүүлэгч';
  let workspaces = null;
  let current = null;
  let account = null;
  // Inside the Basu app — an iPad on its side is a desk too — the dashboard is not one of its pages.
  if (seat && !shell.present) {
    try {
      const access = await api('/v1/access', { token: token() });
      account = access.account;
      workspaces = access.workspaces;
      current = workspaces.find((w) => w.id === seat.org_id) ?? null;
    } catch {
      /* the page works without the dashboard's pages beside it */
    }
  }
  if (!current) {
    current = {
      id: 'supplier',
      kind: 'org',
      name,
      sub: 'Нийлүүлэгч',
      menu: [{ key: 'main', label: null, items: tabs.map((t) => ({ key: `idesh.${t.key}`, label: t.label, icon: t.nav })) }],
    };
    workspaces = [current];
    if (!account) account = { name, email: name };
  }
  const frame = deskFrame({
    workspaces,
    current,
    account,
    // The same place the dashboard opens, under the same name: Basu Бизнес. The page's title still says Нийлүүлэгч.
    brand: 'Бизнес',
    // Inside the app its own launcher is home; the corner button already goes there.
    home: shell.present ? null : '/',
    onPage: (item) => {
      if (item.key.startsWith('idesh.')) return void show(item.key.slice(6));
      toDashboard(`#${current.id}/${item.key}`);
    },
    onWorkspace: (w) => toDashboard(`#${w.id}`),
    onSignOut: () => (shell.present ? goHome() : ask()),
  });
  const ask = twoTaps([frame.root.querySelector('#out')], 'Гарах', signOut);
  deskNav = frame;
  root.replaceChildren(frame.root);
  applyDesk();
  show(tab, arrival());
  void countWork();
}

/** To the dashboard, as the same person: the browser's one sign-in is the dashboard's too. */
function toDashboard(hash) {
  location.href = `/dashboard${hash}`;
}

function show(key, { add = false, bank = false } = {}) {
  tab = key;
  onActed = null;
  history.replaceState(null, '', `${location.pathname}${location.search}#${key}`);
  for (const b of document.querySelectorAll('.tabbar button[data-tab]')) {
    const on = b.dataset.tab === key;
    b.toggleAttribute('data-on', on);
    if (on) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  }
  deskNav?.select(`idesh.${key}`);
  deskNav?.title?.(TABS.find((t) => t.key === key)?.label ?? '');
  const view = document.getElementById('view');
  view.replaceChildren();
  window.scrollTo(0, 0);
  ({ today: renderToday, orders: renderOrders, stall: (v) => renderStallTab(v, add), money: (v) => renderMoneyTab(v, bank), profile: (v) => renderProfile(v, bank) })[key]?.(view);
}

/* today: the numbers, then the work */

/** The shape of the day's work while it loads: the table's rows at a desk, two order cards on a phone. */
function boardSkeleton(desk, busy = false) {
  const said = busy ? ' role="status" aria-busy="true" aria-label="Ачаалж байна"' : '';

/**
 * The day, as the prototype's «Өнөөдөр»: the date over the big title (and, at
 * a desk, the two ways out of it — to the orders' search, to a new listing),
 * what stands in the way, the three numbers, then the work.
 */
function renderToday(view) {
  boardSig = '';
  const head = el(`<div class="page-head head"${isDesk() ? '' : ' data-large'}><div><span class="dateline" id="today-line">&nbsp;</span><h1>Өнөөдөр</h1></div></div>`);
  if (frameIsDesk) {
    const acts = [];
    if (may('org.idesh.orders')) {

      find.addEventListener('click', () => {
        show('orders');

      });

    }

    el('<div class="today-notes" id="notes" hidden></div>'),
    el('<div class="stats kpis kpi-band" id="home" hidden></div>'),
    el(`<div id="board">${boardSkeleton(wideDesk(), true)}</div>`),
  );
  void renderHome();

/**
 * Whether guests can pay on Basu at all just now. The listings say so when
 * they carry it (`payments_open`); else the wallet's top-ups, which the same
 * payment provider opens and closes. Null when neither said — and then
 * nothing is said either.
 */
async function paymentsOpen() {
  try {
    const listed = await api('/v1/idesh/listings', { token: token() });
    if (typeof listed?.payments_open === 'boolean') return listed.payments_open;
  } catch {
    // The wallet is asked instead.
  }
  try {
    const wallet = await api('/v1/wallet', { token: token() });
    if (typeof wallet?.topups_open === 'boolean') return wallet.topups_open;
  } catch {
    // Nobody said: the day says nothing about it.
  }
  return null;
}

/**
 * What stands between the supplier and their orders or their money, said on
 * the day's first screen rather than only deep in a tab: payments closed on
 * Basu — which is why no order comes, however good the listings — and no
 * account for the payouts to go to.
 */
async function renderNotes() {
  if (!document.getElementById('notes')) return;
  const [open, held] = await Promise.all([
    paymentsOpen(),
    may('org.idesh.money') ? sup('/v1/supplier/money').catch(() => null) : null,
  ]);
  const box = document.getElementById('notes');
  if (!box) return;
  const notes = [];
  if (open === false) {
    // What is true while it is closed: a guest with money already in their Basu wallet can still order — so an order may stand right under this line.
    notes.push(el('<div class="callout" data-k="info" id="payments-closed"><span>Онлайн төлбөр түр хаалттай — одоогоор зөвхөн Basu түрийвчээр захиалга орж ирнэ.</span></div>'));
  }
  if (held && !held.bank_account) {
    const note = el('<div class="callout" data-k="warn" id="bank-missing"><b>Олголт очих данс алга</b><span>Данс нэмэхгүй бол хүлээлгэн өгсөн захиалгын мөнгийг тань шилжүүлж чадахгүй.</span></div>');
    if (may('org.idesh.profile:bank')) {
      const add = el('<button class="btn" type="button" id="bank-add">Данс нэмэх</button>');
      add.addEventListener('click', () => void changeBank(held));
      const act = el('<div class="note-act"></div>');
      act.append(add);
      note.append(act);
    } else {
      note.querySelector('span').textContent += ' Дансыг эзэн нь Профайл хэсгээс нэмнэ.';
    }
    notes.push(note);
  }
  box.replaceChildren(...notes);
  box.hidden = !notes.length;
}

/** The latest asking of the day's numbers: an answer that comes back after a newer one is not drawn. */
let homeAsked = 0;
/** A sum of seven figures or more («1,450,800₮») is set a size down, so it stays on its tile's one line. */
const longSum = (mnt) => (String(Math.round(mnt ?? 0)).length > 6 ? ' data-long' : '');

async function renderHome() {
  if (!document.getElementById('home')) return;
  const mine = ++homeAsked;
  let h;
  try {
    h = await sup('/v1/supplier/home');
  } catch {
    if (mine === homeAsked) document.getElementById('home')?.remove();
    return;
  }
  const box = document.getElementById('home');
  if (!box || mine !== homeAsked) return;
  today = h.today ?? today;
  const todo = h.lanes.paid + h.lanes.preparing + h.lanes.ready + h.lanes.dispatched;
  setTodo(todo);
  // Nothing yet — three zeros say less than the empty day below them (and a band drawn before is put away).
  if (!todo && !h.season.handed && !h.season.payout_mnt) {
    box.hidden = true;
    box.replaceChildren();
    return;
  }
  // The same numbers under the same names and lines as the business's home on the dashboard: one place, one way of saying it.
  const due = [h.due_today ? `${h.due_today} нь өнөөдөр авна` : '', h.overdue ? `${h.overdue} нь хоцорсон` : ''].filter(Boolean).join(' · ');
  const cells = [
    el(`<div class="card stat kpi"${h.overdue ? ' data-tone="warn"' : ''}><div class="lab">Хийх ажил</div><b>${todo}</b><span>${
      todo ? due || 'хүлээлгэн өгөөгүй захиалга' : 'одоогоор хийх захиалга алга'
    }</span></div>`),
    el(`<div class="card stat kpi"><div class="lab">Энэ улиралд</div><b>${h.season.handed}</b><span>зочинд хүлээлгэн өгсөн</span></div>`),
    ...(h.season.payout_mnt === null
      ? []
      : [el(`<div class="card stat kpi" data-money${longSum(h.season.payout_mnt)}><div class="lab">Танд очих</div><b>${money(h.season.payout_mnt)}</b><span>энэ улирлын орлого, шимтгэл хассан${h.season.forfeit_mnt ? ` · суутгал ${mnt(h.season.forfeit_mnt)}` : ''}</span></div>`)]),
  ];
  // Three on a phone: the work on a line of its own, the season's two under it.
  if (cells.length === 3) cells[0].setAttribute('data-span', '');
  box.replaceChildren(...cells);
  box.hidden = false;
}

/* orders: the list, searched; one order, with its story */

let orderQuery = { scope: 'live', q: '' };
/** The words an empty list says, for whichever scope and search it is. */
const NONE = {
  live: ['Идэвхтэй захиалга алга', 'Зочин захиалга өгч төлмөгц энд гарна.'],
  done: ['Дууссан захиалга алга', 'Хүлээлгэн өгсөн, цуцалсан захиалга энд гарна.'],
  all: ['Захиалга алга', 'Зочин захиалга өгч төлмөгц энд гарна.'],
};
const noneFor = () =>
  orderQuery.q ? ['Олдсонгүй', `«${orderQuery.q}»-д тохирох захиалга алга. Код, утас, нэр, махаар хайна.`] : NONE[orderQuery.scope] ?? NONE.all;
/** The desk's table of orders, kept while the search or the scope asks the server again. */
let ordersTable = null;
let ordersEmpty = { title: '', text: '' };

function renderOrders(view) {
  ordersTable = null;
  if (wideDesk()) {
    // A desk reads orders as the dashboard's table: one line each, sortable, the money in its column.
    [ordersEmpty.title, ordersEmpty.text] = noneFor();
    ordersTable = dataTable({
      columns: [
        {
          key: 'title',
          label: 'Захиалга',
          value: (o) => `${o.title} ${o.qty} ${o.code}`,
          render: (o) => `<span class="it-cell">${thumb(o)}<span class="dt-two"><b>${what(o)}</b><small class="code">№${esc(o.code)}</small></span></span>`,
        },
        {
          key: 'guest',
          label: 'Зочин',
          value: (o) => `${o.guest ?? ''} ${guestNumber(o) ?? ''} ${phoneText(guestNumber(o) ?? '')}`,
          // A narrow column: the number may break after +976, never inside «9555 0002».
          render: (o) => dtCell.twoHtml(guestName(o), guestNumber(o) ? `<span class="digits">${esc(phoneText(guestNumber(o))).replace(/ (?=\d{4}$)/, '\u00a0')}</span>` : ''),
        },
        { key: 'receive', label: 'Авах', phone: false, render: howCell },
        { key: 'receive_on', label: 'Өдөр', render: (o) => `${esc(dayLabel(o.receive_on))}<span class="dt-sub how-sub">${o.receive === 'delivery' ? 'Хүргэлт' : 'Өөрөө авна'}</span>` },
        { key: 'state', label: 'Төлөв', value: (o) => STATE_WORD[o.state] ?? o.state, render: (o) => ideshStage(o.state) },
        {
          key: 'amount',
          label: may('org.idesh.money') ? 'Танд' : 'Нийт',
          align: 'end',
          numeric: true,
          value: (o) => amountOf(o),
          render: (o) => `${amount(o)}${ended(o) ? '<span class="dt-sub">суутгал</span>' : ''}`,
        },
      ],
      search: { placeholder: 'Код, утас, нэр, мах…' },
      onSearch: (q) => {
        orderQuery.q = q;
        void loadOrders();
      },
      filters: [{ key: 'scope', label: 'Аль захиалга', initial: orderQuery.scope, options: [['live', 'Идэвхтэй'], ['done', 'Дууссан'], ['all', 'Бүгд']] }],
      onFilter: (f) => {
        orderQuery.scope = f.scope;
        void loadOrders();
      },
      onRow: (o) => void openOrder(o.id),
      rowAttrs: (o) => ({ 'data-order': o.id }),
      noun: 'захиалга',
      empty: ordersEmpty,
    });
    const section = el(`<section class="orders">${pageHead('Захиалгууд', 'Код, утас, нэр, махаар хайна.')}<div id="orders"></div></section>`);
    section.querySelector('#orders').append(ordersTable.el);
    const search = ordersTable.el.querySelector('.dt-search input');
    if (search) search.value = orderQuery.q;
    view.append(section);
    void loadOrders();
    return;
  }
  view.append(el(`
    <section class="orders">
      ${pageHead('Захиалгууд', 'Код, утас, нэр, махаар хайна.')}
      <div class="tools">
        <input type="search" class="input search" id="q" placeholder="Хайх…" aria-label="Захиалга хайх" value="${esc(orderQuery.q)}" autocomplete="off">
        <div class="seg" data-fill>
          ${[['live', 'Идэвхтэй'], ['done', 'Дууссан'], ['all', 'Бүгд']]
            .map(([k, l]) => `<button type="button" data-scope="${k}" aria-pressed="${orderQuery.scope === k}"${orderQuery.scope === k ? ' data-on' : ''}>${l}</button>`)
            .join('')}
        </div>
      </div>
      <div class="list" id="orders" data-rows aria-busy="true">${'<div class="skel-row"><span class="skel-lines"><span class="skel"></span><span class="skel"></span></span><span class="skel"></span></div>'.repeat(3)}</div>
    </section>`));
  let timer;
  view.querySelector('#q').addEventListener('input', (e) => {
    orderQuery.q = e.target.value;
    clearTimeout(timer);
    timer = setTimeout(loadOrders, 250);
  });
  view.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-scope]');
    if (!b) return;
    orderQuery.scope = b.dataset.scope;
    for (const c of view.querySelectorAll('.seg button')) {
      c.toggleAttribute('data-on', c === b);
      c.setAttribute('aria-pressed', String(c === b));
    }
    void loadOrders();
  });
  void loadOrders();
}

const ended = (o) => o.state === 'CANCELLED' || o.state === 'REFUNDED';
const what = (o) => `${esc(o.title)} ×${esc(o.qty)}${o.unit === 'kg' ? ' кг' : ''}`;
// What the supplier keeps of an order is the money's; a seat without it reads what the guest paid.
const mine = (o) => o.payout_mnt !== null && o.payout_mnt !== undefined;
const amountOf = (o) => (ended(o) ? o.forfeit_mnt ?? 0 : mine(o) ? o.payout_mnt : o.total_mnt);
const amount = (o) => money(amountOf(o));
const amountWord = (o) => (ended(o) ? 'суутгал' : mine(o) ? 'танд' : 'нийт');

async function loadOrders() {
  const box = document.getElementById('orders');
  if (!box) return;
  let data;
  try {
    data = await sup(`/v1/supplier/orders?scope=${orderQuery.scope}&q=${encodeURIComponent(orderQuery.q)}`);
  } catch (error) {
    if (error.status === 401) return signOut();
    // The desk's table stays where it is, with what it last showed; the phone's list says it here.
    if (ordersTable) return toast(error.message, 'bad');
    box.removeAttribute('aria-busy');
    box.replaceChildren(blank({ icon: ICON.orders, size: 'sm', title: 'Ачаалж чадсангүй', text: error.message }));
    return;
  }
  if (!document.getElementById('orders')) return;
  if (ordersTable) {
    [ordersEmpty.title, ordersEmpty.text] = noneFor();
    ordersTable.setRows(data.orders);
    return;
  }
  box.removeAttribute('aria-busy');
  box.replaceChildren();
  if (!data.orders.length) {
    const [title, text] = noneFor();
    box.append(blank({ icon: orderQuery.q ? ICON.search : ICON.orders, size: 'sm', title, text }));
  }
  for (const o of data.orders) {
    const row = el(`
      <button class="order row" type="button" data-order="${esc(o.id)}" data-chev>
        <span class="lead">${thumb(o)}</span>
        <span class="main">
          <span class="title t">${what(o)}</span>
          <span class="sub s">${guestLine(o)}</span>
          <span class="meta" data-sans><span class="mn">№${esc(o.code)}</span> · ${esc(dayShort(o.receive_on))} · ${o.receive === 'delivery' ? 'хүргэлт' : 'өөрөө авна'}</span>
          ${ideshStage(o.state)}
        </span>
        <span class="end right">
          <span class="amt val">${amount(o)}<small>${amountWord(o)}</small></span>
        </span>
      </button>`);
    row.addEventListener('click', () => void openOrder(o.id));
    box.append(row);
  }
}

/** A state in its one word — «Хүлээлгэн өгсөн», «Цуцлагдсан» — the word the guest's pages and the desk say for the same order (api.js). */
const STATE_WORD = IDESH_STATE;
const EVENT_WORD = {
  CREATED: 'Захиалга үүссэн', PAID: 'Төлсөн', PREPARING: 'Бэлтгэж эхэлсэн', READY: 'Бэлэн болсон',
  DISPATCHED: 'Замд гарсан', HANDED: 'Хүлээлгэн өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан',
  REFUND_DUE: 'Буцаалт үүссэн', REFUNDED: 'Буцаалт шилжүүлсэн', RESENT: 'Мэдэгдэл дахин илгээсэн',
  CERTIFIED: 'Гэрчилгээ оруулсан',
};
/** The dot each event takes in the story: the crimson's ink for a cancellation, the quiet ink on the road, the ink when handed. */
const EVENT_TONE = { CANCELLED: 'stop', REFUND_DUE: 'stop', REFUNDED: 'stop', DISPATCHED: 'route', HANDED: 'ready', CLOSED: 'ready' };
const ACTOR_WORD = (a) =>
  a.startsWith('guest:') ? 'зочин'
    : a.startsWith('supplier:owner:') ? 'эзэн'
      : /^supplier:[a-z0-9-]+:[0-9a-f-]{36}$/.test(a) ? 'ажилтан'
        : a.startsWith('supplier:') ? 'таны дэлгэц'
          : a.startsWith('ops') ? 'Basu' : 'систем';
const REASON_SHORT = {
  guest_asked: 'зочин хүссэн', vet: 'мал эмнэлэг', cannot_fulfil: 'биелүүлж чадаагүй',
  no_show: 'зочин ирээгүй', unreachable: 'хаяг дээр холбогдоогүй', draft_expired: 'төлөгдөөгүй',
};

/** One order's own page, opened from the orders' list — or, at a desk, from the day's table (`from` 'today'). */
async function openOrder(id, from = 'orders') {
  const view = document.getElementById('view');
  let data;
  try {
    [data] = await Promise.all([sup(`/v1/supplier/orders/${id}`), knowToday()]);
  } catch (error) {
    if (error.status === 401) return signOut();
    toast(error.message, 'bad');
    return;
  }
  if (!document.getElementById('view')) return;
  const o = data.order;
  const lane = { PAID: 'paid', PREPARING: 'preparing', READY: 'ready', DISPATCHED: 'dispatched' }[o.state];
  view.replaceChildren(
    el(`<section class="order-page">
          <button class="back link" type="button" id="back">${ICON.left}${from === 'today' ? 'Өнөөдөр' : 'Захиалгууд'}</button>
          <div class="page-head head"><div><h1><span class="mn">№${esc(o.code)}</span></h1>${ideshStage(o.state)}</div></div>
          <div class="order-cols">
            <div class="order-main">
              <div id="act"></div>
              ${o.cancel_reason ? `<div class="terms callout"><b>Цуцлагдсан: ${esc(REASON_SHORT[o.cancel_reason] ?? o.cancel_reason)}</b><span>Зочинд ${money(o.refund_mnt ?? 0)} буцна${o.forfeit_mnt ? `, танд ${money(o.forfeit_mnt)} үлдэнэ` : ''}.</span></div>` : ''}
            </div>
            <div class="order-story">
              <div class="sec section-label">Явц</div>
              <ol class="story stepper" data-stepper>
                ${data.events.map((e) => `<li data-done${EVENT_TONE[e.type] ? ` data-k="${EVENT_TONE[e.type]}"` : ''}><span class="w">${esc(EVENT_WORD[e.type] ?? e.type)}<span class="s">${esc(`${ACTOR_WORD(e.actor)}${e.payload?.reason ? ` · ${REASON_SHORT[e.payload.reason] ?? e.payload.reason}` : ''}`)}</span></span><span class="t">${when(e.at)}</span></li>`).join('')}
              </ol>
            </div>
          </div>
        </section>`),
  );
  view.querySelector('#back').addEventListener('click', () => show(from));
  // The card is the same one today's list shows — facts, phone, and the button — without the band the title already says.
  const card = renderTicket(o, lane ?? 'done', { page: true });
  if (!lane) card.querySelector('.btns')?.remove();
  view.querySelector('#act').append(card);
  // The certificate goes on, or is put right, while the order is still the business's to work on.
  if (may('org.idesh.orders:act') && ['PAID', 'PREPARING', 'READY', 'DISPATCHED', 'HANDED'].includes(o.state)) {
    const paper = el(`<button class="btn paper-act" type="button" data-size="sm" id="certify">${o.certificate ? 'Гэрчилгээ солих' : 'Гэрчилгээ оруулах'}</button>`);
    paper.addEventListener('click', () => void certifyOrder(o, () => openOrder(id, from)));
    view.querySelector('#act').append(paper);
  }
  // Ringing the guest through Basu: neither number changes hands, and the camera can show the animal.
  void callButton('idesh', o.id, { className: 'btn call-act', label: 'Зочин руу залгах' }).then((button) => {
    const act = document.getElementById('act');
    if (button && act && !act.querySelector('[data-call]')) {
      button.dataset.size = 'sm';
      act.append(button);
    }
  });
  if (lane) onActed = () => openOrder(id, from);
}

/* the stall and the money, each on its own tab */

async function renderStallTab(view, add = false) {
  view.append(el(`<div class="stall" id="stall">${pageHead('Миний зар', 'Зочид эндээс захиална.')}<div data-rows aria-busy="true">${'<div class="skel-row"><span class="skel-lines"><span class="skel"></span><span class="skel"></span></span><span class="skel"></span></div>'.repeat(3)}</div></div>`));
  try {
    const [{ listings }] = await Promise.all([sup('/v1/supplier/listings'), loadPapers()]);
    if (!document.getElementById('stall')) return;
    renderStall(listings);
    if (add && may('org.idesh.stall:edit')) void addListing();
  } catch (error) {
    if (error.status === 401) return signOut();
    document.getElementById('stall')?.replaceChildren(el(pageHead('Миний зар')), blank({ icon: ICON.stall, size: 'sm', title: 'Ачаалж чадсангүй', text: error.message }));
  }
}

function renderMoneyTab(view, bank = false) {
  view.append(el(pageHead('Миний мөнгө', 'Хүлээлгэн өгсөн захиалга бүрийн олголт энд.')), el('<div class="money-page" id="money"><div class="kpis kpi-band skel-kpis" role="status" aria-busy="true"><div class="kpi"><span class="skel skel-kpi"></span></div><div class="kpi"><span class="skel skel-kpi"></span></div></div></div>'));
  void renderMoney(bank);
}

/* the profile: how they are found, where the money goes */

/**
 * How guests find the supplier, what the contract says, and where its money
 * goes — read here, changed in popups. An owner or a manager changes the
 * first; only an owner the account, with their own password, and only a seat
 * that holds the money sees it at all. Staff read the details.
 */
async function renderProfile(view, bank = false) {
  let p;
  try {
    p = await sup('/v1/supplier/profile');
  } catch (error) {
    if (error.status === 401) return signOut();
    view.append(el(pageHead('Профайл')), blank({ icon: ICON.profile, size: 'sm', title: 'Ачаалж чадсангүй', text: error.message }));
    return;
  }
  if (!document.getElementById('view')) return;
  const edits = may('org.idesh.profile:edit');
  const seesBank = may('org.idesh.money');
  const fact = (label, value, { mono = false, none = '—', wide = false } = {}) =>
    `<div${wide ? ' class="wide"' : ''}><dt>${label}</dt><dd${value ? '' : ' data-none'}>${value ? (mono ? `<span class="digits">${esc(value)}</span>` : esc(value)) : none}</dd></div>`;
  const head = el(pageHead('Профайл', 'Зочид таныг ингэж харна.'));
  // One primary (the off-white pill) a screen: while no account is on file, adding one is it; otherwise it is this.
  const asksForAccount = seesBank && may('org.idesh.profile:bank') && !p.bank_account;
  if (edits) {
    const edit = el(`<button class="btn"${asksForAccount ? '' : ' data-v="primary"'} type="button" id="edit-profile">Засах</button>`);
    edit.addEventListener('click', () => void editProfile(p));
    headActs(head, edit);
  }
  const section = el('<section class="profile-page"><div class="cards"></div></section>');
  const cards = section.querySelector('.cards');
  cards.append(
    el(`<section class="card profile">
      <div class="card-head"><h2>Зочдод харагдах</h2></div>
      <dl class="facts">
        ${fact('Нэр', p.name)}
        ${fact('Хотод мах авах цэг', p.pickup_address)}
        ${fact('Юу зарах вэ, хаанаас', p.about, { none: 'Бичээгүй' })}
      </dl>
      ${edits ? '' : '<div class="card-foot"><span class="cap">Мэдээллийг эзэн эсвэл менежер засна.</span></div>'}
    </section>`),
    el(`<section class="card contract">
      <div class="card-head"><h2>Гэрээ</h2></div>
      <dl class="facts" data-short>
        <div><dt>Утас</dt><dd>${p.phone ? tel(p.phone) : '—'}</dd></div>
        ${fact('ТТД', p.merchant_tin, { mono: true, none: 'Алга' })}
        ${p.commission_pct !== null && p.commission_pct !== undefined ? `<div><dt>Шимтгэл</dt><dd><span class="mn">${esc(p.commission_pct)}%</span></dd></div>` : ''}
        ${p.contracted_at ? fact('Гэрээ байгуулсан', dayOfStamp(p.contracted_at)) : ''}
      </dl>
      <div class="card-foot"><span class="cap">Утас, ТТД, шимтгэл нь гэрээний нөхцөл. Өөрчлөх бол Basu-д бичнэ үү: <a href="mailto:basuappmn@gmail.com">basuappmn@gmail.com</a></span></div>
    </section>`),
  );
  if (seesBank) cards.append(bankCard(p));
  view.append(head, section);
  // The person's own account. Most owners came in by phone, and an address is
  // their only way back from a forgotten password.
  if (seat) view.append(accountWays({ token: token() }));
  // Sent here by the business's «Данс нэмэх»: the account's popup, over the page it changes.
  if (bank && seesBank && may('org.idesh.profile:bank')) void changeBank(p);
}

/** How guests find the supplier: its name, where they collect, what it sells — in one popup. */
async function editProfile(p) {
  const answer = popup({
    id: 'profile-edit',
    title: 'Профайл засах',
    sub: 'Зочид таныг ингэж харна',
    width: 560,
    fields: [
      { name: 'name', label: 'Нэр', value: p.name ?? '', required: true, wide: true },
      { name: 'address', label: 'Хотод мах авах цэг', value: p.pickup_address ?? '', required: true, wide: true, hint: 'Зочин өөрөө ирж авахдаа энд ирнэ.' },
      { name: 'about', label: 'Юу зарах вэ, хаанаас', type: 'textarea', value: p.about ?? '', placeholder: 'Архангайн хонь, 10-р сараас…' },
    ],
    submit: 'Хадгалах',
    onSubmit: async (v) => {
      if (v.name.length < 2) throw new Error('Нэрээ бичнэ үү.');
      if (v.address.length < 4) throw new Error('Зочин ирж авах газраа бичнэ үү.');
      await sup('/v1/supplier/profile', { method: 'PATCH', body: { name: v.name, address: v.address, about: v.about } });
      return v;
    },
  });
  noKeyboard(document.getElementById('profile-edit'));
  const done = await answer;
  if (!done) return;
  toast('Хадгалагдлаа.', 'good');
  for (const n of document.querySelectorAll('.supplier-name')) n.textContent = done.name;
  show('profile');
}

/* ── boot ────────────────────────────────────────────────────────── */

/**
 * Two ways this page is opened: by a person signed in — from the app's
 * tile, a tablet on the counter, or a browser on a computer — and by
 * somebody who is not yet.
 */
async function boot() {
  root.replaceChildren();
  applyDesk();
  seat = null;
  // Somebody signed in is shown the shape of the module at once — not a blank screen while the seat is asked.
  if (token()) waiting();
  // Back from Google, the code in the address is claimed first: the session
  // it becomes is this browser's person (api.js, authReturn).
  await authReturn;
  if (!token()) {
    showLanding();
    return;
  }
  if (!root.firstElementChild) waiting();
  try {
    seat = await sup('/v1/supplier/seat');
    openModule();
    // A guest ringing about an order rings this desk while it is open.
    listenForCalls();
    return;
  } catch (error) {
    if (error.status === 403) {
      root.replaceChildren(notHere(error.message));
      return;
    }
    if (error.status !== 401) {
      // The card says it, in Mongolian: a dropped connection or a proxy's
      // HTML page must never reach the person as the browser's English.
      root.replaceChildren(cannotReach(whatWentWrong(error)));
      return;
    }
  }
  // Not a seat at a contracted supplier: still applying, or not signed in at all.
  showApply();
}

/**
 * The module's shape while the seat is on its way: at a desk the dashboard's
 * frame — Basu Бизнес, the place, the menu, the page — at its sizes; on a
 * phone the bar and the day's work. Bars, never words that could be wrong.
 * The charcoal either way: there is no light Basu any more.
 */
function waiting() {
  const desk = isDesk();
  const page = `
    <div class="page-head head"${desk ? '' : ' data-large'}><div><span class="skel wait-line"></span><span class="skel wait-title"></span></div></div>
    <div class="stats kpis kpi-band skel-kpis">${'<div class="kpi"><span class="skel" data-w="40"></span><span class="skel skel-kpi"></span><span class="skel" data-w="60"></span></div>'.repeat(3)}</div>
    ${boardSkeleton(desk && Boolean(wideMq?.matches))}`;
  root.replaceChildren(
    el(
      desk
        ? `<div class="app desk-frame sup-wait" role="status" aria-busy="true" aria-label="Ачаалж байна">
            <aside class="side sidebar" aria-hidden="true">
              <div class="brand"><b>Basu</b><span>Бизнес</span></div>
              <div class="ws"><div class="ws-btn"><span class="ws-mark"></span><span class="ws-text"><span class="skel" data-w="80"></span><span class="skel" data-w="40"></span></span></div></div>
              <div class="wait-nav">${'<span class="skel"></span>'.repeat(7)}</div>
            </aside>
            <main class="main"><div class="page" aria-hidden="true">${page}</div></main>
          </div>`
        : `<div class="shell sup-wait" role="status" aria-busy="true" aria-label="Ачаалж байна">
            <header class="bar topbar sup" aria-hidden="true"><div class="title"><span class="skel wait-name"></span><span class="skel wait-role"></span></div></header>
            <main class="view" aria-hidden="true">${page}</main>
          </div>`,
    ),
  );
}

/** The seat could not be asked — the network, the server: said where the module would be, with the way to try again. */
function cannotReach(message) {
  const card = el('<main class="door"></main>');
  card.append(
    blank({
      icon: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12a10 10 0 0 1 13 0M9 15.5a5 5 0 0 1 6 0"/><path d="M12 19h.01M3 3l18 18"/></svg>',
      title: 'Basu-д холбогдож чадсангүй',
      text: message || 'Интернэтээ шалгаад дахин оролдоно уу.',
      action: { label: 'Дахин оролдох', primary: true, id: 'retry', onClick: () => void boot() },
      frame: true,
    }),
  );
  return card;
}

/** Opened from the dashboard for a business this person does not work at as a supplier. */
function notHere(message) {
  const card = el(`
    <main class="door">
      <div class="card">
        ${brand()}
        <h1>Нээх эрхгүй байна</h1>
        <p class="lead">${esc(message)} Энэ байгууллагын нийлүүлэгчийн хэсэгт та ажилладаггүй байна.</p>
        <a class="btn" data-v="primary" data-size="lg" href="/dashboard">Бизнес рүү буцах</a>
      </div>
    </main>`);
  card.append(doorFoot(true));
  return card;
}

boot();

const poll = setInterval(() => {
  if (!document.hidden && document.getElementById('board')) void refreshBoard();
}, 3000);
addEventListener('pagehide', () => clearInterval(poll));
</script>
