<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F3F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0E0D" media="(prefers-color-scheme: dark)">
<title>Нийлүүлэгч — Basu</title>
<link rel="stylesheet" href="/app.css">
<style>
/* ── The supplier's own app ─────────────────────────────────────────
   For a person with a knife in one hand and a phone in the other, and for
   the same person at a desk. Colour, type, buttons, chips, cards, rows and
   fields all come from /app.css; what is left here is where things sit. */

/* ── the doors: sign in, pair, apply ── */
.door{max-width:420px;margin:32px auto;padding:0 var(--gutter) calc(24px + var(--safe-b))}
.door .card{padding:24px 20px}
.door .brand{display:block;margin-bottom:16px}
.door h2{margin-bottom:6px}
.door p{color:var(--ink-2);margin:0 0 20px}
.door .form-group > p{margin:-2px 0 14px}
.door .foot{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.door .links{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:12px}
.door .links p{margin:0;text-align:center}
.door-foot{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px;font-size:var(--t-cap);font-weight:500;color:var(--ink-3)}
.door-foot a{display:inline-flex;align-items:center;min-height:var(--target);color:var(--ink-2)}
.pair input.code{margin-bottom:12px}
/* the walkthrough's shortcuts: one folded «Демо горим» group, fenced off from the real door */
.demo{margin-top:20px;padding:0 14px}
.demo > summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:var(--target);cursor:pointer;-webkit-user-select:none;user-select:none}
.demo > summary::-webkit-details-marker{display:none}
.demo > summary .chev{transform:rotate(90deg);transition:transform var(--dur) var(--ease)}
.demo[open] > summary .chev{transform:rotate(-90deg)}
.demo > .body{padding:0 0 12px}
.demo .hint{font-size:var(--t-cap);line-height:1.6;color:var(--ink-2);margin-bottom:10px}
.demo .hint code{font-size:var(--t-cap);color:var(--ink)}
.demo .btn{width:100%}
/* the list of stalls is a hairline list inside the inset, not a card inside a card */
.demo .venues[data-rows]{background:none;border:0;border-radius:0;box-shadow:none;border-top:1px solid var(--line);margin-top:12px}
.demo .venues .row{padding-left:0;padding-right:0}
.demo .venues .row:active{background:var(--surface)}
@media (hover:hover){.demo .venues .row:hover{background:var(--surface)}}
.status{padding:8px 0 4px}
.status .big{font-size:1.5rem;font-weight:600;line-height:1.2;letter-spacing:-.015em;color:var(--ink)}
.status .big::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3);margin:0 8px 3px 0;vertical-align:middle}
.status[data-s="applied"] .big::before{background:var(--hold)}
.status[data-s="contracted"] .big::before{background:var(--ready)}
.status[data-s="declined"] .big::before{background:var(--stop)}
.status .cap{margin-top:6px;max-width:40ch}
.code{margin:16px 0}

/* ── the app frame ── */
.shell{min-height:100dvh;display:flex;flex-direction:column}
.view{flex:1;min-width:0;width:100%;max-width:var(--col-desk);margin:0 auto;padding:16px var(--gutter) 24px}
.view .page-head[data-large]{padding-top:4px}
.page-head p{margin-bottom:0}
/* on a phone the nav is a tab bar and shows only its tabs */
.tabbar > :not([data-tab]){display:none}
/* signing out is two taps: the first turns the button into the question, the second answers it */
.topbar .out[data-confirm]{width:auto;padding:0 12px;border-color:var(--stop-line);color:var(--stop)}
.topbar .out[data-confirm] svg{display:none}
.sidebar .out[data-confirm]{background:var(--stop-soft);color:var(--stop)}
/* at a desk the pages sit in the dashboard's frame (/app.css .desk-frame) */
.desk-frame .page{width:100%;max-width:var(--col-desk);margin:0 auto;padding:28px var(--gutter) 48px}

/* ── today ── */
.stats{margin-bottom:24px}
.group{margin-top:24px}
.group:first-child{margin-top:0}
.group h3{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.group h3 .n{margin:0}
.stack{display:grid;gap:12px}
.stack > *{min-width:0}
@media (min-width:720px){.stack{grid-template-columns:1fr 1fr}}
/* one order: a state band on top, the facts, the money, one button */
.ticket .top{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-bottom:1px solid var(--line);border-radius:calc(var(--r-md) - 1px) calc(var(--r-md) - 1px) 0 0;
  background:var(--surface-2);font-size:var(--t-pill);font-weight:500;line-height:1.2;color:var(--ink-2);
}
.ticket[data-lane="paid"] .top,.ticket[data-lane="dispatched"] .top{background:var(--route-soft);border-color:var(--route-line);color:var(--route)}
.ticket[data-lane="preparing"] .top{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.ticket[data-lane="ready"] .top{background:var(--ready-soft);border-color:var(--ready-line);color:var(--ready)}
.ticket .top .dot{margin:0}
.ticket .top .id{font-family:var(--mono);font-size:var(--t-body-lg);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);margin-left:4px}
.ticket .top .day{margin-left:auto;white-space:nowrap;color:var(--ink-2)}
.ticket .top .day[data-s="due"]{color:var(--hold)}
.ticket .body{padding:14px 16px 16px}
.ticket .what{font-size:var(--t-row);font-weight:600;line-height:var(--lh-snug)}
.ticket .what + .sub{font-size:var(--t-cap);line-height:1.4;color:var(--ink-2);margin-top:2px}
.ticket .who,.ticket .where{display:grid;grid-template-columns:76px minmax(0,1fr);gap:8px;margin-top:8px;font-size:var(--t-body-lg);line-height:1.4}
.ticket .k{font-size:var(--t-cap);line-height:1.4;padding-top:2px;color:var(--ink-3)}
.ticket .v{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;color:var(--ink-2)}
.ticket .where .v{overflow-wrap:anywhere}
a.tel{display:inline-flex;align-items:center;gap:4px;padding:12px 0;margin:-12px 0;color:var(--ink);font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
a.tel svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--ink-3)}
.ticket .sum,.ticket .pay{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:var(--t-cap);color:var(--ink-2)}
.ticket .sum{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.ticket .pay{margin-top:6px}
.ticket .sum .money,.ticket .pay .money{font-size:var(--t-body-lg)}
.ticket .pay .money{color:var(--ready)}
.ticket .grace{margin-top:12px}
.ticket .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
/* on the desk the one button sits at its own width on the right, Цуцлах quiet beside it — the full-width slab is a thumb affordance */
:root[data-desk] .ticket .body > .btns{flex-direction:row-reverse;justify-content:flex-start;gap:8px}
:root[data-desk] .ticket .body > .btns .btn[data-size="lg"]{width:auto;min-height:var(--h-md);padding:0 16px;font-size:var(--t-body-lg)}
.ticket > .reasons{margin:0 16px 16px}
.reasons .q{font-size:var(--t-row);font-weight:600;margin-bottom:4px}
.reasons > .money{font-family:var(--sans);font-size:var(--t-cap);font-weight:400;line-height:1.5;min-height:1.5em;color:var(--ink-2);margin:8px 0 12px}
.reasons .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── orders ── */
.orders .tools{margin-bottom:16px}
.orders .tools .input{flex:1 1 220px;min-width:0}
.orders .tools .seg{flex:none}
.orders .list.card{padding:0}
.orders .table td .sub{margin-top:2px}
.order-page .back{margin-bottom:4px}
.order-page #act{margin-bottom:16px}
.order-page .callout{margin-bottom:16px}
.order-page .section-label + .story{margin-top:4px}

/* ── the stall ── */
.stall .rows{margin-bottom:24px}
.stall .row{flex-wrap:wrap}
.stall .row > .main{flex:1 1 100%}
.stall .row .title .chip{margin-left:8px}
.stall .row .nums{display:flex;gap:20px;flex:1 1 auto}
.stall .num{font-family:var(--mono);font-size:var(--t-body-lg);font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;color:var(--ink)}
.stall .num small{display:block;font-family:var(--sans);font-size:var(--t-cap);font-weight:400;line-height:1.4;color:var(--ink-3);margin-top:2px}
.stall .row .btns{display:flex;gap:8px;flex:1 1 100%;justify-content:flex-end}
:root[data-desk] .stall .row .btn{min-height:var(--h-sm);padding:0 12px;font-size:var(--t-cap)}
.stall .row[data-editing] .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 12px;flex:1 1 100%}
.stall .row[data-editing] .field{margin-bottom:12px}
@media (min-width:720px){
  .stall .row > .main{flex:1 1 auto;min-width:0}
  .stall .row .nums{flex:none}
  .stall .row .btns{flex:none;margin-left:auto}
  .stall .row[data-editing] .nums{flex:1 1 100%}
}
.new .grid{grid-template-columns:1fr}
@media (min-width:640px){.new .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.new .grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.new .grid .check{margin-bottom:16px}
/* .field > span is the label rule; the affix wrapper is a span too (requested for app.css) */
.field > .affix{font-weight:400;margin-bottom:0}
/* digits a person reads back to a bank — ТТД, данс, утас, үнэ — are mono tabular; the placeholder is a sentence and stays sans (requested for app.css) */
:is(.door,.view,.page) .field input:is([type="tel"],[inputmode="numeric"],[inputmode="decimal"]){font-family:var(--mono);font-variant-numeric:tabular-nums}
:is(.door,.view,.page) .field input:is([type="tel"],[inputmode="numeric"],[inputmode="decimal"])::placeholder{font-family:var(--sans)}
.new .form-group:first-child{border-top:0;padding-top:0;margin-top:0}
.new .foot{margin-top:4px}

/* ── the money ── */
.money-sum{margin-bottom:16px}
.terms .sub{text-wrap:pretty}

/* ── profile ── */
.profile{max-width:640px}
.profile .hint{padding:14px 16px;border-bottom:1px solid var(--line);font-size:var(--t-body);line-height:1.5;color:var(--ink-2)}
.profile .hint b{font-weight:500;color:var(--ink)}
.profile .callout{margin:0 0 16px}
.profile #save{margin-top:8px}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { api, store, shell, toast, mnt, money, KIND, dayLabel, signInDoors, accountWays } from '/api.js';
import { NAV_ICON, deskFrame } from '/sidenav.js';

const root = document.getElementById('root');
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
const esc = (value) => {
  const node = document.createElement('span');
  node.textContent = value ?? '';
  return node.innerHTML;
};

/**
 * Which stall this screen is showing.
 *
 * A real screen is paired to one supplier and sees that one — the token says
 * so and the API enforces it. A walkthrough moves between four suppliers, so
 * the demo can watch every one at once, read-only on the stall.
 */
const ALL = 'all-suppliers';
/**
 * The business the dashboard opened this page for — `/supplier?org=…` — so
 * a person who works at two suppliers works at the one they chose there.
 */
const ORG = new URLSearchParams(location.search).get('org');
const watchingAll = () => !ORG && store.supplierToken === ALL;
/**
 * A paired screen's token, or a person's own sign-in — made on this page, by
 * the app, or on the dashboard. Opened from the dashboard, the dashboard's
 * session is the person; otherwise a screen paired here comes first.
 */
const token = () => (ORG ? store.opsToken || store.guestToken : store.supplierToken || store.guestToken || store.opsToken);
/** The supplier's own routes: the token, and which business when the dashboard said. */
const sup = (path, options = {}) => api(path, { ...options, token: token(), headers: ORG ? { 'x-basu-org': ORG } : {} });

/**
 * Who this seat is here and what it may do — `/v1/supplier/seat`, asked on
 * opening. A tab or a button this seat may not use is not drawn; the server
 * refuses it anyway.
 */
let seat = null;
const may = (permission) => Boolean(seat?.permissions?.includes(permission));

/**
 * Phone chrome below 900px, a desk above it: the same nav is a tab bar or a
 * sidebar, and the root carries data-desk so the shared sheet drops the blur
 * and tightens the controls. jsdom has no matchMedia, so a page under test is
 * a phone.
 */
const desk = typeof matchMedia === 'function' ? matchMedia('(min-width:900px)') : null;
const isDesk = () => Boolean(desk?.matches);
function applyDesk() {
  document.documentElement.toggleAttribute('data-desk', isDesk());
  document.body.classList.toggle('has-tabbar', Boolean(document.querySelector('.shell > .tabbar')) && !isDesk());
}
// Phone and desk are two frames, not one restyled: crossing the line redraws the module on the tab it was on.
desk?.addEventListener?.('change', () => {
  applyDesk();
  if (document.getElementById('view')) openModule();
});

/** Sign out of the session this page is using — and, having come from the dashboard, go back there. */
function signOut() {
  const used = token();
  if (store.supplierToken === used || watchingAll()) store.supplierToken = null;
  if (store.guestToken === used) store.guestToken = null;
  if (store.opsToken === used) store.opsToken = null;
  seat = null;
  if (ORG) {
    location.href = '/dashboard';
    return;
  }
  boot();
}

const ICON = {
  today: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8 3v4M16 3v4M8 14h3"/></svg>',
  orders: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2z"/><path d="M9 9h6M9 13h4"/></svg>',
  stall: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9l1.5-4h13L20 9"/><path d="M4 9c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3s3-1.3 3-3c0 1.7 1.3 3 3 3"/><path d="M6 12v8h12v-8M10 20v-5h4v5"/></svg>',
  money: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18M15.5 15h2"/></svg>',
  profile: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-3.5 3.6-5 7-5s6 1.5 7 5"/></svg>',
  out: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 4H5v16h8"/><path d="M10 12h10M17 8l3 4-3 4"/></svg>',
  swap: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>',
  right: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  left: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>',
  phone: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
};

/** The walkthrough's shortcuts, folded under a door: opened on purpose, never mistaken for the real way in. */
const demoGroup = () => el('<details class="demo inset" data-demo><summary><span class="lab">Демо горим</span><span class="chev" aria-hidden="true"></span></summary><div class="body"></div></details>');

/** Under every door: the terms a supplier signs up to. */
const DOOR_FOOT = '<div class="door-foot"><a href="/terms">Үйлчилгээний нөхцөл</a><span aria-hidden="true">·</span><a href="/privacy">Нууцлалын бодлого</a></div>';

/* ── the doors ─────────────────────────────────────────────────────── */

/**
 * The ways in — Google, a code by email, or a password (the phone and
 * password a contract was signed with, or an address) — the same block the
 * guests' pages use. Whoever is new becomes an account by any of them, and
 * the application form is the next card.
 */
function signInCard() {
  const card = el(`
    <div class="door">
      <div class="card" id="signin">
        <div class="brand wordmark" data-size="sm">Basu</div>
        <h2>Нийлүүлэгчийн хэсэг</h2>
        <p>Нэвтэрч ороод нийлүүлэгч болох хүсэлтээ илгээнэ үү. Гэрээт нийлүүлэгч бол гэрээний утас, нууц үгээрээ нэвтэрнэ.</p>
        <div data-doors></div>
        <div class="links">
          <button class="link" type="button" id="back">Таблет дээр кодоор холбох${ICON.right}</button>
        </div>
      </div>
      ${DOOR_FOOT}
    </div>`);
  const doors = signInDoors({ device: 'Нийлүүлэгчийн дэлгэц', returnTo: '/supplier', onToken: () => boot() });
  card.querySelector('[data-doors]').replaceWith(doors);
  // The demo has no inbox to read a code from; a walkthrough skips straight in.
  api('/dev/clock')
    .then(() => {
      const demo = el('<button class="btn" type="button" id="demo">Демо: кодгүй нэвтрэх</button>');
      const group = demoGroup();
      group.querySelector('.body').append(demo);
      demo.addEventListener('click', async () => {
        // A number typed is the person who typed it; none typed is somebody
        // new, so a walkthrough reaches the form rather than the seed's own
        // waiting application.
        const typed = doors.querySelector('[name="phone"]').value.replace(/\s+/g, '');
        const fresh = `+97688${String(Date.now() % 1_000_000).padStart(6, '0')}`;
        const { token } = await api('/dev/login', {
          method: 'POST',
          body: { phone: typed || fresh, device: 'Нийлүүлэгчийн дэлгэц' },
        });
        store.guestToken = token;
        boot();
      });
      card.querySelector('#signin').append(group);
    })
    .catch(() => {});
  card.querySelector('#back').addEventListener('click', showPairing);
  return card;
}

/** The front door: a person first, a pairing code for a tablet behind it. */
function showLanding() {
  root.replaceChildren(signInCard());
}

/** A tablet on the counter: paired once with an eight-digit code from Basu. */
async function showPairing() {
  const [{ devices }, { suppliers }] = await Promise.all([
    api('/dev/supplier-codes').catch(() => ({ devices: [] })),
    api('/dev/suppliers').catch(() => ({ suppliers: [] })),
  ]);
  root.replaceChildren();

  const card = el(`
    <div class="door pair">
      <div class="card">
        <div class="brand wordmark" data-size="sm">Basu</div>
        <h2>Дэлгэцээ холбоно уу</h2>
        <p>Basu-гаас авсан 8 оронтой кодоо оруулна уу. Нэг удаа холбоход хангалттай.</p>
        <input class="code" inputmode="numeric" maxlength="8" placeholder="········" aria-label="Холбох код">
        <button class="btn" data-v="primary" data-size="lg" type="button">Холбох</button>
        <div class="links"><a id="become" class="link" role="button" tabindex="0">${ICON.left}Нэвтрэх</a></div>
      </div>
      ${DOOR_FOOT}
    </div>`);

  const input = card.querySelector('input');
  const submit = async () => {
    try {
      const { token } = await api('/v1/supplier/pair', {
        method: 'POST',
        body: { pairing_code: input.value.trim() },
      });
      store.supplierToken = token;
      boot();
    } catch (error) {
      toast(error.message, 'bad');
      input.select();
    }
  };
  card.querySelector('button').addEventListener('click', submit);
  input.addEventListener('keydown', (e) => e.key === 'Enter' && submit());
  card.querySelector('#become').addEventListener('click', () => showLanding());

  if (devices.length || suppliers.length) {
    const demo = demoGroup();
    const body = demo.querySelector('.body');
    if (devices.length) {
      input.value = devices[0].code;
      const hint = el('<div class="hint">Холбоогүй нийлүүлэгчийн кодууд:<br></div>');
      for (const device of devices) hint.append(el(`<span><code>${device.code}</code> ${esc(device.name)}<br></span>`));
      body.append(hint);
    }
    if (suppliers.length) {
      const list = el('<div class="venues" data-rows></div>');
      const all = el(`
        <button class="row" type="button" data-watched data-dense>
          <span class="main"><span class="title" data-weight="normal">Бүх нийлүүлэгч</span></span>
          <span class="end"><span class="tag count" data-tone="neutral">${suppliers.length}</span></span>
        </button>`);
      all.addEventListener('click', () => {
        store.supplierToken = ALL;
        boot();
      });
      list.append(all);
      for (const s of suppliers) {
        const button = el(`
          <button class="row" type="button"${s.watched ? ' data-watched' : ''} data-dense>
            <span class="main"><span class="title" data-weight="normal">${esc(s.name)}</span></span>
            <span class="end"><span class="tag chip" data-size="sm"${s.watched ? ' data-s="on"' : ''}>${s.watched ? 'холбогдсон' : 'холбогдоогүй'}</span></span>
          </button>`);
        button.addEventListener('click', async () => {
          try {
            const { token } = await api('/dev/supplier-token', { method: 'POST', body: { supplier_id: s.id } });
            store.supplierToken = token;
            boot();
          } catch (error) {
            toast(error.message, 'bad');
          }
        });
        list.append(button);
      }
      body.append(list);
    }
    card.querySelector('.card').append(demo);
  }

  root.append(card);
  input.focus();
}

/* ── becoming a supplier ─────────────────────────────────────────── */

/**
 * The form a would-be supplier fills in, once signed in.
 *
 * The phone guests will ring is the account's own when it was made with one.
 * An account made by email, Google or Apple has none, so the form asks for
 * it — and ops rings it before saying yes, which is the proof it is theirs.
 * Ops answers from the desk and the answer arrives here, and by email or
 * message, with the code, when it is yes.
 */
async function showApply() {
  root.replaceChildren();
  const person = ORG || !store.supplierToken ? token() : store.guestToken || store.opsToken;
  if (!person) {
    root.append(signInCard());
    return;
  }
  let application;
  let me;
  try {
    [{ application }, me] = await Promise.all([
      api('/v1/supplier/application', { token: person }),
      api('/v1/me', { token: person }),
    ]);
  } catch (error) {
    if (error.status === 401) {
      if (store.guestToken === person) store.guestToken = null;
      if (store.opsToken === person) store.opsToken = null;
      root.append(signInCard());
      return;
    }
    toast(error.message, 'bad');
    return;
  }
  const needsPhone = !me.phone;
  root.append(application ? statusCard(application, needsPhone) : applyForm(needsPhone));
}

const APPLICATION = {
  applied: ['Хүлээгдэж байна', 'Basu хүсэлтийг тань үзэж байна. Хариуг энд, мөн имэйл эсвэл мессежээр мэдэгдэнэ.'],
  contracted: ['Батлагдлаа', 'Та гэрээт нийлүүлэгч боллоо.'],
  declined: ['Татгалзсан', ''],
};

function statusCard(a, needsPhone = false) {
  const [word, cap] = APPLICATION[a.state] ?? [a.state, ''];
  const card = el(`
    <div class="door">
      <div class="card" id="application">
        <div class="brand wordmark" data-size="sm">Basu</div>
        <h2>${esc(a.name)}</h2>
        <div class="status" data-s="${a.state}">
          <div class="big">${word}</div>
          <div class="cap">${a.state === 'declined' ? `Шалтгаан: ${esc(a.decline_reason)}` : cap}</div>
        </div>
      </div>
      ${DOOR_FOOT}
    </div>`);
  const inner = card.querySelector('.card');
  if (a.state === 'contracted' && a.pairing_code) {
    inner.append(el(`<div class="code codebox"><span class="lab">Таблет холбох код</span><b>${a.pairing_code}</b></div>`));
    const pair = el('<button class="btn" data-v="primary" data-size="lg" type="button" id="pair-now">Энэ кодоор холбох</button>');
    pair.addEventListener('click', async () => {
      try {
        const { token } = await api('/v1/supplier/pair', { method: 'POST', body: { pairing_code: a.pairing_code } });
        store.supplierToken = token;
        boot();
      } catch (error) {
        toast(error.message, 'bad');
      }
    });
    inner.append(pair);
  } else if (a.state === 'contracted' && a.paired) {
    inner.append(el('<p>Дэлгэц аль хэдийн холбогдсон. Код шинээр хэрэгтэй бол Basu-д хэлнэ үү.</p>'));
  } else if (a.state === 'declined') {
    const again = el('<button class="btn" data-size="lg" type="button" id="again">Дахин хүсэлт гаргах</button>');
    again.addEventListener('click', () => root.replaceChildren(applyForm(needsPhone)));
    inner.append(again);
  }
  inner.append(el(`<div class="links"><button class="link" type="button" id="back">Таблет дээр кодоор холбох${ICON.right}</button></div>`));
  inner.querySelector('#back').addEventListener('click', showPairing);
  return card;
}

/* ── today's work ────────────────────────────────────────────────── */

/** Set by whichever view holds tickets besides the board, to redraw after an action. */
let onActed = null;

/** What each group of work is called, and what the one button on it does. */
const LANES = [
  { key: 'paid', title: 'Бэлтгэж эхлэх' },
  { key: 'preparing', title: 'Бэлэн болгох' },
  { key: 'ready', title: 'Өгөх, хүргэх' },
  { key: 'dispatched', title: 'Замд яваа' },
];
/** The order state each lane holds, and the tone its band takes. */
const LANE_STATE = { paid: 'PAID', preparing: 'PREPARING', ready: 'READY', dispatched: 'DISPATCHED' };
const STATE_TONE = { PAID: 'route', PREPARING: 'accent', READY: 'ready', DISPATCHED: 'route', HANDED: 'ready', CLOSED: 'ready' };

let today = null;

/**
 * The work, as a list rather than a board: one group per thing to do next,
 * empty groups not drawn. A person sees what is theirs today and taps one
 * button per order.
 */
function renderBoard(data) {
  today = data.today;
  const board = document.getElementById('board');
  if (!board) return;
  for (const n of document.querySelectorAll('.supplier-name')) {
    n.textContent = watchingAll() ? 'Бүх нийлүүлэгч' : (data.supplier?.name ?? 'Нийлүүлэгч');
  }
  const conn = document.getElementById('conn');
  if (conn) delete conn.dataset.stale;
  // A question left open — which reason, on which ticket — outlives the
  // poll: the board is not rebuilt under somebody's finger.
  if (board.querySelector('.reasons:not([data-busy])')) return;

  const scroll = window.scrollY;
  board.replaceChildren();
  let any = 0;
  for (const lane of LANES) {
    const tickets = data.lanes[lane.key] ?? [];
    if (!tickets.length) continue;
    any += tickets.length;
    const group = el(`<section class="group lane"><h3 class="section-title">${lane.title}<span class="n count" data-tone="neutral">${tickets.length}</span></h3><div class="stack"></div></section>`);
    const stack = group.querySelector('.stack');
    for (const ticket of tickets) stack.append(renderTicket(ticket, lane.key));
    board.append(group);
  }
  if (!any) {
    board.append(el('<div class="card empty"><b>Одоогоор хийх ажил алга</b>Шинэ захиалга ирэхэд танд мессеж ирнэ.</div>'));
  }
  board.dataset.ready = '1';
  window.scrollTo(0, scroll);
}

/** One order as a card: what, for whom, where, what you get — and one button. */
function renderTicket(ticket, lane) {
  const delivery = ticket.receive === 'delivery';
  const dueToday = ticket.receive_on <= today && lane !== 'paid';
  const state = ticket.state ?? LANE_STATE[lane];
  const tel = (n) => `<a class="tel" href="tel:${esc(n)}">${ICON.phone}${esc(n)}</a>`;
  const node = el(`
    <article class="card ticket" data-lane="${lane}"${dueToday ? ' data-due' : ''}>
      <div class="top">
        <span class="dot"${STATE_TONE[state] ? ` data-tone="${STATE_TONE[state]}"` : ''}></span><span>${STATE_WORD[state] ?? ''}</span>
        <span class="id">№${ticket.code}</span>
        <span class="day"${dueToday ? ' data-s="due"' : ''}>${dueToday ? 'Өнөөдөр' : dayLabel(ticket.receive_on)}</span>
      </div>
      <div class="body">
        <div class="what">${esc(ticket.title)} ×${ticket.qty}${ticket.unit === 'kg' ? ' кг' : ''}</div>
        ${watchingAll() ? `<div class="sub">${esc(ticket.supplier.name)}</div>` : ''}
        <div class="who"><span class="k">Зочин</span><span class="v">${
          ticket.guest
            ? `<span>${esc(ticket.guest)}</span>${ticket.guest_phone ? tel(ticket.guest_phone) : ''}`
            : ticket.guest_phone ? tel(ticket.guest_phone) : '—'
        }</span></div>
        <div class="where"><span class="k">${delivery ? 'Хүргэлт' : 'Авах'}</span><span class="v">${
          delivery
            ? `<span>${esc(ticket.address)}</span>${ticket.address_phone ? tel(ticket.address_phone) : ''}`
            : 'Өөрөө ирж авна'
        }</span></div>
        <div class="sum"><span>Нийт</span>${money(ticket.total_mnt)}</div>
        ${typeof ticket.payout_mnt === 'number' ? `<div class="pay"><span>Танд очих</span>${money(ticket.payout_mnt)}</div>` : ''}
        ${
          lane === 'ready' && !delivery && ticket.no_show_from
            ? `<div class="grace callout" data-k="warn"><span>${
                new Date(ticket.no_show_from) <= new Date()
                  ? 'Зочин ирсэнгүй бол «зочин ирээгүй» гэж цуцалж болно.'
                  : `Ирэхгүй бол ${dayLabel(ticket.no_show_from.slice(0, 10))}-нөөс «зочин ирээгүй» гэж цуцалж болно.`
              }</span></div>`
            : ''
        }
        <div class="btns"></div>
      </div>
    </article>`);

  const buttons = node.querySelector('.btns');
  const send = async (action, body, button) => {
    if (button) button.disabled = true;
    try {
      await (watchingAll()
        ? api(`/dev/supplier/orders/${ticket.id}/${action}`, { method: 'POST', body })
        : sup(`/v1/supplier/orders/${ticket.id}/${action}`, { method: 'POST', body }));
      await refreshBoard();
      await onActed?.();
    } catch (error) {
      if (error.status === 401 && !watchingAll()) {
        signOut();
        return;
      }
      toast(error.message, 'bad');
      if (button) button.disabled = false;
    }
  };
  const add = (label, action, variant) => {
    const button = el(`<button class="btn" type="button"${variant ? ` data-v="${variant}"` : ''}${variant === 'primary' ? ' data-size="lg"' : ''}>${label}</button>`);
    button.addEventListener('click', () => send(action, {}, button));
    buttons.append(button);
  };

  /**
   * Cancelling asks why, because the reason decides the money — the
   * supplier picks from what can be true of this order, sees what the guest
   * gets back and what stays, and only then confirms.
   */
  const cancelWith = (reasons) => {
    const button = el('<button class="btn" type="button" data-v="quiet" data-a="cancel">Цуцлах</button>');
    button.addEventListener('click', () => {
      const slaughtered = lane !== 'paid';
      const meat = ticket.total_mnt - (delivery ? ticket.delivery_fee_mnt ?? 0 : 0);
      const box = el(`
        <div class="reasons inset">
          <div class="q">Яагаад цуцлах вэ?</div>
          ${reasons
            .map((r) => `<label class="check"><input type="radio" name="reason-${ticket.id}" value="${r}"><span>${REASON[r]}</span></label>`)
            .join('')}
          <div class="money"></div>
          <div class="btns">
            <button class="btn" type="button" data-v="quiet" data-a="keep">Болих</button>
            <button class="btn" type="button" data-v="danger" data-fill data-a="confirm" disabled>Цуцлах</button>
          </div>
        </div>`);
      const money_ = box.querySelector('.money');
      const confirm = box.querySelector('[data-a="confirm"]');
      box.addEventListener('change', () => {
        const reason = box.querySelector('input:checked')?.value;
        if (!reason) return;
        const forfeit = slaughtered && !SUPPLIER_FAULT.includes(reason) ? Math.round((meat * FORFEIT_PCT) / 100) : 0;
        money_.innerHTML = forfeit
          ? `Зочинд ${money(ticket.total_mnt - forfeit)} буцна, ${money(forfeit)} (${FORFEIT_PCT}%) танд үлдэнэ.`
          : `Зочинд ${money(ticket.total_mnt)} бүтнээр буцна.`;
        confirm.disabled = false;
      });
      confirm.addEventListener('click', () => {
        const reason = box.querySelector('input:checked')?.value;
        if (!reason) return;
        // Sending: the refresh that follows may rebuild the board; if it
        // fails, the question stays and the poll leaves it alone again.
        box.dataset.busy = '1';
        send('cancel', { reason }, confirm).then(() => {
          if (box.isConnected) delete box.dataset.busy;
        });
      });
      box.querySelector('[data-a="keep"]').addEventListener('click', () => {
        box.remove();
        buttons.style.display = '';
      });
      // The row's own buttons step aside while the question is open — by
      // style, because the class sets display and would outrank `hidden`.
      buttons.style.display = 'none';
      node.append(box);
    });
    buttons.append(button);
  };

  // An accountant reads the order; the buttons are for whoever does the work.
  if (!watchingAll() && !may('org.idesh.orders:act')) return node;
  if (lane === 'paid') {
    add('Бэлтгэж эхлэх', 'prepare', 'primary');
    cancelWith(['guest_asked', 'cannot_fulfil', 'vet']);
  } else if (lane === 'preparing') {
    add('Бэлэн боллоо', 'ready', 'primary');
    cancelWith(['guest_asked', 'vet', 'cannot_fulfil']);
  } else if (lane === 'ready') {
    if (delivery) add('Замд гаргах', 'dispatch', 'primary');
    else add('Хүлээлгэн өгсөн', 'hand', 'primary');
    cancelWith(delivery ? ['guest_asked', 'unreachable', 'vet', 'cannot_fulfil'] : ['guest_asked', 'no_show', 'vet', 'cannot_fulfil']);
  } else if (lane === 'dispatched') {
    add('Хүлээлгэн өгсөн', 'hand', 'primary');
    cancelWith(['unreachable', 'guest_asked', 'cannot_fulfil']);
  }
  return node;
}

/** The words for a reason, and which reasons are the supplier's own fault. */
const REASON = {
  guest_asked: 'Зочин хүссэн — утсаар ярьж тохирсон',
  vet: 'Мал эмнэлгийн шалгалт унасан',
  cannot_fulfil: 'Биелүүлж чадахгүй боллоо',
  no_show: 'Зочин ирээгүй — өдрөөс 3 хоног өнгөрсөн',
  unreachable: 'Хаяг дээр холбогдож чадсангүй',
};
const SUPPLIER_FAULT = ['vet', 'cannot_fulfil'];
const FORFEIT_PCT = 10;

async function refreshBoard() {
  try {
    const data = watchingAll()
      ? await api('/dev/supplier/board')
      : await sup('/v1/supplier/board');
    renderBoard(data);
  } catch (error) {
    if (error.status === 401 && !watchingAll()) {
      signOut();
      return;
    }
    const conn = document.getElementById('conn');
    if (conn) conn.dataset.stale = '1';
  }
}

/* ── the stall ───────────────────────────────────────────────────── */

/**
 * The supplier's own listings, edited here and nowhere else. Twenty sheep
 * becoming fifteen sold is a fact only they know; ops does not edit numbers
 * on a phone. Drawn separately from the board so a poll never wipes a form
 * somebody is typing into.
 */
function renderStall(listings) {
  const stall = document.getElementById('stall');
  if (!stall) return;
  stall.replaceChildren(el(pageHead('Миний зар', 'Зочид эндээс л захиална. Үнэ, тоо, өдрөө өөрөө засна.')));

  const rows = el('<div class="rows" data-rows></div>');
  if (!listings.length) rows.append(el('<div class="card empty"><b>Зар алга</b>Доор эхний зараа нэмнэ үү.</div>'));
  for (const l of listings) rows.append(renderRow(l));
  stall.append(rows);
  if (may('org.idesh.stall:edit')) stall.append(newForm());
}

function renderRow(l) {
  const row = el(`
    <div class="card row"${l.active ? '' : ' data-off'} data-listing="${l.id}">
      <span class="main">
        <span class="name title">${esc(l.title)}${l.active ? '' : ' <span class="chip" data-size="sm">зогссон</span>'}</span>
        <span class="sub">${KIND[l.kind]} · ${l.unit === 'whole' ? `бүтэн, ~${l.approx_kg} кг` : `кг-аар, доод ${l.min_qty} кг`} · ${esc(l.origin)} · ${dayLabel(l.ready_from)}-нөөс${l.delivers ? ` · хүргэлт ${mnt(l.delivery_fee_mnt)}` : ''}</span>
      </span>
      <span class="nums">
        <span class="num">${money(l.price_mnt)}<small>үнэ</small></span>
        <span class="num">${l.sold} / ${l.quantity}<small>зарагдсан</small></span>
      </span>
      ${may('org.idesh.stall:edit') ? `<span class="btns">
        <button class="btn" type="button" data-a="edit">Засах</button>
        <button class="btn quiet" type="button" data-a="toggle">${l.active ? 'Зогсоох' : 'Идэвхжүүлэх'}</button>
      </span>` : ''}
    </div>`);
  if (!may('org.idesh.stall:edit')) return row;

  const patch = async (body) => {
    try {
      const { listing } = await sup(`/v1/supplier/listings/${l.id}`, { method: 'PATCH', body });
      row.replaceWith(renderRow(listing));
    } catch (error) {
      toast(error.message, 'bad');
    }
  };

  row.querySelector('[data-a="toggle"]').addEventListener('click', () => patch({ active: !l.active }));
  row.querySelector('[data-a="edit"]').addEventListener('click', () => {
    const form = el(`
      <div class="card row" data-editing>
        <span class="main"><span class="name title">${esc(l.title)}</span></span>
        <span class="nums fields">
          <label class="field"><span>Үнэ, ₮</span><input inputmode="numeric" name="price" value="${l.price_mnt}"></label>
          <label class="field"><span>Нийт тоо</span><input inputmode="numeric" name="quantity" value="${l.quantity}"></label>
          <label class="field"><span>Бэлэн болох</span><input type="date" name="ready" value="${l.ready_from}"></label>
        </span>
        <span class="btns">
          <button class="btn quiet" type="button" data-a="back">Болих</button>
          <button class="btn" data-v="primary" type="button" data-a="save">Хадгалах</button>
        </span>
      </div>`);
    form.querySelector('[data-a="back"]').addEventListener('click', () => form.replaceWith(renderRow(l)));
    form.querySelector('[data-a="save"]').addEventListener('click', async () => {
      const body = {
        price_mnt: Number(form.querySelector('[name="price"]').value),
        quantity: Number(form.querySelector('[name="quantity"]').value),
        ready_from: form.querySelector('[name="ready"]').value,
      };
      try {
        const { listing } = await sup(`/v1/supplier/listings/${l.id}`, { method: 'PATCH', body });
        form.replaceWith(renderRow(listing));
        toast('Хадгалагдлаа');
      } catch (error) {
        toast(error.message, 'bad');
      }
    });
    row.replaceWith(form);
  });
  return row;
}

function newForm() {
  const plusWeek = (() => {
    const d = new Date(`${today ?? new Date().toISOString().slice(0, 10)}T12:00:00+08:00`);
    d.setUTCDate(d.getUTCDate() + 7);
    return d.toISOString().slice(0, 10);
  })();
  const form = el(`
    <div class="card new">
      <div class="card-head"><h3>Шинэ зар нэмэх</h3></div>
      <div class="card-body">
        <div class="form-group">
          <div class="section-label">Юу</div>
          <div class="grid fields">
            <label class="field"><span>Мал</span><select name="kind">${Object.entries(KIND).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
            <label class="field"><span>Нэгж</span><select name="unit"><option value="whole">Бүтэн мал</option><option value="kg">Кг-аар</option></select></label>
            <label class="field wide"><span>Гарчиг</span><input name="title" placeholder="Хонь, залуу ирэг"></label>
          </div>
        </div>
        <div class="form-group">
          <div class="section-label">Үнэ, нөөц</div>
          <div class="grid fields">
            <label class="field"><span>Үнэ, ₮ (толгой эсвэл кг)</span><span class="affix"><input name="price_mnt" inputmode="numeric" placeholder="460000"><i>₮</i></span></label>
            <label class="field" data-for="whole"><span>Ойролцоо жин, кг</span><span class="affix"><input name="approx_kg" inputmode="numeric" placeholder="38"><i>кг</i></span></label>
            <label class="field" data-for="kg" hidden><span>Доод захиалга, кг</span><span class="affix"><input name="min_qty" inputmode="numeric" placeholder="10"><i>кг</i></span></label>
            <label class="field"><span>Хэдэн толгой эсвэл кг</span><input name="quantity" inputmode="numeric" placeholder="20"></label>
            <label class="field wide"><span>Гарал</span><input name="origin" placeholder="Архангай, Их тамир"></label>
          </div>
        </div>
        <div class="form-group">
          <div class="section-label">Хэзээ, хүргэлт</div>
          <div class="grid fields">
            <label class="field"><span>Бэлэн болох өдөр</span><input name="ready_from" type="date" value="${plusWeek}"></label>
            <label class="field"><span>Хүргэлтийн төлбөр, ₮</span><span class="affix"><input name="delivery_fee_mnt" inputmode="numeric" value="0"><i>₮</i></span></label>
            <label class="check wide"><input name="delivers" type="checkbox" checked>Хүргэлт хийнэ</label>
          </div>
        </div>
        <div class="form-group">
          <div class="section-label">Тэмдэглэл</div>
          <div class="grid fields">
            <label class="field wide"><span>Тайлбар</span><textarea name="note" placeholder="Толгой, дотор мөнтэйгээ…"></textarea></label>
          </div>
        </div>
        <div class="foot form-foot"><button class="btn" data-v="primary" type="button" id="add">Зар нэмэх</button></div>
      </div>
    </div>`);

  const unit = form.querySelector('[name="unit"]');
  const sync = () => {
    form.querySelector('[data-for="whole"]').hidden = unit.value !== 'whole';
    form.querySelector('[data-for="kg"]').hidden = unit.value !== 'kg';
  };
  unit.addEventListener('change', sync);
  sync();

  // No delivery, no delivery fee: the field waits on the checkbox.
  const delivers = form.querySelector('[name="delivers"]');
  const fee = form.querySelector('[name="delivery_fee_mnt"]');
  const syncFee = () => { fee.disabled = !delivers.checked; };
  delivers.addEventListener('change', syncFee);
  syncFee();

  form.querySelector('#add').addEventListener('click', async () => {
    const v = (name) => form.querySelector(`[name="${name}"]`).value;
    const body = {
      kind: v('kind'),
      unit: v('unit'),
      title: v('title'),
      price_mnt: Number(v('price_mnt')),
      quantity: Number(v('quantity')),
      origin: v('origin'),
      ready_from: v('ready_from'),
      delivers: delivers.checked,
      delivery_fee_mnt: Number(v('delivery_fee_mnt') || 0),
      note: v('note'),
    };
    if (body.unit === 'whole') body.approx_kg = Number(v('approx_kg'));
    else body.min_qty = Number(v('min_qty') || 1);
    try {
      await sup('/v1/supplier/listings', { method: 'POST', body });
      toast('Зар нэмэгдлээ');
      const { listings } = await sup('/v1/supplier/listings');
      renderStall(listings);
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  return form;
}

/**
 * What the supplier is owed and what has been sent: one line per order,
 * with the rate and the account the contract names. The list is ops's to
 * act on; here it is the supplier's to check.
 */
async function renderMoney() {
  const box = document.getElementById('money');
  if (!box) return;
  let data;
  try {
    data = await sup('/v1/supplier/money');
  } catch {
    box.replaceChildren(el('<div class="card empty">Тооцоо ачаалж чадсангүй.</div>'));
    return;
  }
  const due = data.settlements.filter((t) => t.state !== 'paid');
  const owed = due.reduce((sum, t) => sum + t.amount_mnt, 0);
  const paid = data.settlements.filter((t) => t.state === 'paid').reduce((sum, t) => sum + t.amount_mnt, 0);
  const list = el('<div class="list" data-rows></div>');
  list.append(
    el(`<div class="terms row">
          <span class="main">
            <span class="title" data-weight="normal">Шимтгэл <b>${data.commission_pct ?? '—'}%</b> — махны үнээс, хүргэлтийн төлбөрөөс авахгүй.</span>
            <span class="sub">Олголт хүлээлгэн өгснөөс хойш нэг хоногт үүсч, Basu ажлын өдөрт шилжүүлнэ.</span>
            <span class="sub">Данс: ${
              data.bank_account ? `<b>${esc(data.bank_name)} <span class="mn">${esc(data.bank_account)}</span></b> · ${esc(data.bank_holder)}` : '<b>бүртгэгдээгүй</b> — Профайл хэсэгт оруулна уу'
            }</span>
          </span>
        </div>`),
  );
  if (!data.settlements.length) {
    list.append(el('<div class="card empty"><b>Одоогоор тооцоо алга</b>Хүлээлгэн өгсөн захиалга бүр энд гарна.</div>'));
  }
  for (const t of data.settlements) {
    const isPaid = t.state === 'paid';
    list.append(
      el(`<div class="card line row" data-settlement="${t.id}">
            <span class="main">
              <span class="name title"><span class="mn">№${esc(t.order_code)}</span> · ${esc(t.memo)}</span>
              <span class="sub">${
                isPaid ? `Шилжүүлсэн ${when(t.paid_at)}${t.reference ? ` · ${esc(t.reference)}` : ''}` : `Үүссэн ${when(t.created_at)} · шилжүүлэгдээгүй`
              }</span>
            </span>
            <span class="end"><span class="amt val${isPaid ? ' paid' : ''}">${money(t.amount_mnt, isPaid ? 'credit' : undefined)}</span></span>
          </div>`),
    );
  }
  box.replaceChildren(
    el(`<div class="money-sum kpis kpi-band">
          <div class="card stat kpi"><b>${money(owed)}</b><span>Basu шилжүүлэх ёстой</span></div>
          <div class="card stat kpi"><b>${money(paid)}</b><span>Шилжүүлсэн, нийт</span></div>
        </div>`),
    list,
  );
}

/** «9/8 14:05» for a timestamp the supplier reads across a list. */
function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

const TABS = [
  { key: 'today', label: 'Өнөөдөр', icon: ICON.today, nav: 'today', needs: 'org.idesh.today' },
  { key: 'orders', label: 'Захиалга', icon: ICON.orders, nav: 'orders', needs: 'org.idesh.orders' },
  { key: 'stall', label: 'Зар', icon: ICON.stall, nav: 'stall', needs: 'org.idesh.stall' },
  { key: 'money', label: 'Мөнгө', icon: ICON.money, nav: 'pay', needs: 'org.idesh.money' },
  { key: 'profile', label: 'Профайл', icon: ICON.profile, nav: 'person', needs: 'org.idesh.profile' },
];
/** The tab to open: the one the address names — the dashboard links straight to one — else today. */
let tab = location.hash.slice(1) || 'today';
/** The desk frame's handles, when the page is at a desk. */
let deskNav = null;

/**
 * The tabs this seat opens: all five for an owner, a manager or a screen on
 * the counter; the day, the orders and the stall for staff; the orders and
 * the money for an accountant. A demo watching every supplier at once gets
 * only today's work — the rest is one supplier's own.
 */
const tabsFor = () => (watchingAll() ? TABS.slice(0, 1) : TABS.filter((t) => may(t.needs)));

/** The page's one h1: large on a phone, beside its lead on a desk. */
function pageHead(title, sub, subId) {
  return `<div class="page-head head"${isDesk() ? '' : ' data-large'}><div><h1>${title}</h1>${
    sub ? `<p${subId ? ` id="${subId}"` : ''}>${sub}</p>` : ''
  }</div></div>`;
}

/**
 * Signing out is two taps: the first turns the button into the question for
 * four seconds, the second answers it — a stray tap on a counter tablet must
 * not drop the pairing. `buttons` are every way out on the frame.
 */
function twoTaps(buttons, word, leave, now = false) {
  let armed = null;
  const say = (asking) => {
    for (const b of buttons) {
      b.toggleAttribute('data-confirm', asking);
      const label = b.querySelector('.t');
      if (label) {
        label.textContent = asking ? 'Гарах уу?' : word;
        label.classList.toggle('sr-only', !asking);
      } else if (b.closest('.acct')) b.innerHTML = asking ? 'Гарах уу?' : NAV_ICON.out;
      else b.textContent = asking ? 'Гарах уу?' : word;
      b.setAttribute('aria-label', asking ? 'Гарах уу?' : word);
    }
  };
  return () => {
    if (now) return leave();
    if (armed) {
      clearTimeout(armed);
      armed = null;
      say(false);
      return leave();
    }
    say(true);
    armed = setTimeout(() => {
      armed = null;
      say(false);
    }, 4000);
  };
}

/**
 * The supplier's own app: the tabs this seat opens along the bottom of a
 * phone; at a desk, the dashboard's frame with this business as the place.
 */
function openModule() {
  const tabs = tabsFor();
  if (!tabs.some((t) => t.key === tab)) tab = tabs[0]?.key ?? 'today';
  if (isDesk()) {
    void openDesk(tabs);
    return;
  }
  deskNav = null;
  // On a phone the page follows the phone's light or dark, as every guest page does.
  document.documentElement.removeAttribute('data-theme');
  const all = watchingAll();
  const name = all ? 'Бүх нийлүүлэгч' : seat?.supplier?.name ?? '…';
  const out = all ? 'Солих' : 'Гарах';
  const frame = el(`
    <div class="shell">
      <header class="bar topbar">
        <span class="conn" id="conn">Холбогдсон</span>
        <div class="title"><b class="supplier-name" id="supplier">${esc(name)}</b></div>
        <div class="act"><button class="btn out" type="button" data-v="quiet" data-icon id="out" aria-label="${out}">${all ? ICON.swap : ICON.out}<span class="t sr-only">${out}</span></button></div>
      </header>
      <nav class="tabs tabbar" aria-label="Хэсгүүд">
        ${tabs.map((t) => `<button type="button" data-tab="${t.key}">${t.icon}<span class="t">${t.label}</span></button>`).join('')}
      </nav>
      <main class="view" id="view"></main>
    </div>`);
  const leave = () => (all ? ((store.supplierToken = null), boot()) : signOut());
  frame.querySelector('#out').addEventListener('click', twoTaps([frame.querySelector('#out')], out, leave, all));
  frame.querySelector('.tabs').addEventListener('click', (e) => {
    const button = e.target.closest('button[data-tab]');
    if (button) show(button.dataset.tab);
  });
  root.replaceChildren(frame);
  applyDesk();
  show(tab);
}

/**
 * At a desk the supplier's pages sit in the dashboard's own frame: the
 * business as the place, and beside its supplier tabs the dashboard's pages
 * for it — its people, its details, who may do what — one click away. A
 * screen on the counter, or a demo watching everybody, has its tabs alone.
 */
async function openDesk(tabs) {
  const all = watchingAll();
  const name = all ? 'Бүх нийлүүлэгч' : seat?.supplier?.name ?? 'Нийлүүлэгч';
  let workspaces = null;
  let current = null;
  let account = null;
  // Inside the Basu app — an iPad on its side is a desk too — the dashboard is not one of its pages.
  if (!all && seat && !seat.screen && !shell.present) {
    try {
      const access = await api('/v1/access', { token: token() });
      account = access.account;
      workspaces = access.workspaces;
      current = workspaces.find((w) => w.id === seat.org_id) ?? null;
    } catch {
      /* the page works without the dashboard's pages beside it */
    }
  }
  if (!current) {
    current = {
      id: 'screen',
      kind: 'org',
      name,
      sub: all ? 'Демо · бүх нийлүүлэгч' : seat?.screen ? 'Нийлүүлэгчийн дэлгэц' : 'Нийлүүлэгч',
      menu: [{ key: 'main', label: null, items: tabs.map((t) => ({ key: `idesh.${t.key}`, label: t.label, icon: t.nav })) }],
    };
    workspaces = [current];
    if (!account) account = { name: all ? 'Демо' : seat?.screen ? 'Холбосон дэлгэц' : name, email: all ? 'Бүх нийлүүлэгч' : name };
  }
  const leave = () => (all ? ((store.supplierToken = null), boot()) : signOut());
  const frame = deskFrame({
    workspaces,
    current,
    account,
    brand: 'Нийлүүлэгч',
    onPage: (item) => {
      if (item.key.startsWith('idesh.')) return void show(item.key.slice(6));
      toDashboard(`#${current.id}/${item.key}`);
    },
    onWorkspace: (w) => toDashboard(`#${w.id}`),
    onSignOut: () => ask(),
  });
  const ask = twoTaps([frame.root.querySelector('#out')], all ? 'Солих' : 'Гарах', leave, all);
  deskNav = frame;
  // At a desk it is the dashboard's frame, and the dashboard is light: one look from page to page.
  document.documentElement.setAttribute('data-theme', 'light');
  root.replaceChildren(frame.root);
  applyDesk();
  show(tab);
}

/**
 * To the dashboard, as the same person: a session made on this page is the
 * dashboard's too, rather than a second sign-in for the one person.
 */
function toDashboard(hash) {
  if (!store.opsToken && token() && !seat?.screen) store.opsToken = token();
  location.href = `/dashboard${hash}`;
}

function show(key) {
  tab = key;
  onActed = null;
  history.replaceState(null, '', `${location.pathname}${location.search}#${key}`);
  for (const b of document.querySelectorAll('.tabbar button[data-tab]')) {
    const on = b.dataset.tab === key;
    b.toggleAttribute('data-on', on);
    if (on) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  }
  deskNav?.select(`idesh.${key}`);
  const view = document.getElementById('view');
  view.replaceChildren();
  window.scrollTo(0, 0);
  ({ today: renderToday, orders: renderOrders, stall: renderStallTab, money: renderMoneyTab, profile: renderProfile })[key]?.(view);
}

/** «Бямба, 9-р сарын 13» — the day, the way it is said. */
function dayLong(day) {
  const d = new Date(`${day}T12:00:00+08:00`);
  const names = ['Ням', 'Даваа', 'Мягмар', 'Лхагва', 'Пүрэв', 'Баасан', 'Бямба'];
  return `${names[d.getUTCDay()]}, ${dayLabel(day)}`;
}

/* today: the numbers, then the work */

function renderToday(view) {
  const all = watchingAll();
  view.append(
    el(pageHead(all ? 'Бүх нийлүүлэгчийн ажил' : 'Өнөөдөр', '…', 'today-line')),
    el('<div class="stats kpis kpi-band" id="home" hidden></div>'),
    el('<div id="board"></div>'),
  );
  if (!all) void renderHome();
  void refreshBoard().then(() => {
    const line = document.getElementById('today-line');
    if (line && today) line.textContent = dayLong(today);
  });
}

async function renderHome() {
  const box = document.getElementById('home');
  if (!box) return;
  let h;
  try {
    h = await sup('/v1/supplier/home');
  } catch {
    box.remove();
    return;
  }
  if (!document.getElementById('home')) return;
  const todo = h.lanes.paid + h.lanes.preparing + h.lanes.ready + h.lanes.dispatched;
  // Nothing yet — three zeros say less than the empty line below them.
  if (!todo && !h.season.handed && !h.season.payout_mnt) return;
  const k = (n, unit) => `${n} ${unit === 'kg' ? 'кг' : 'толгой'}`;
  box.replaceChildren(
    el(`<div class="card stat kpi" data-span><b>${todo}</b><span>${
      todo
        ? [
            h.due_today ? `${h.due_today} өнөөдөр авна` : '',
            h.overdue ? `${h.overdue} зочин ирээгүй` : '',
          ].filter(Boolean).join(' · ') || 'хийх ажилтай захиалга'
        : 'хийх ажил алга'
    }</span></div>`),
    el(`<div class="card stat kpi"><b>${h.season.handed}</b><span>${h.season.by_kind.map((b) => `${KIND[b.kind] ?? b.kind} ${k(b.qty, b.unit)}`).join(', ') || 'энэ улирал хүлээлгэн өгсөн'}</span></div>`),
    ...(h.season.payout_mnt === null
      ? []
      : [el(`<div class="card stat kpi"><b>${money(h.season.payout_mnt)}</b><span>танд очих орлого${h.season.forfeit_mnt ? `, суутгал ${mnt(h.season.forfeit_mnt)}` : ''}</span></div>`)]),
  );
  box.hidden = false;
}

/* orders: the list, searched; one order, with its story */

let orderQuery = { scope: 'live', q: '' };

function renderOrders(view) {
  view.append(el(`
    <section class="orders">
      ${pageHead('Захиалгууд', 'Код, утас, нэр, махаар хайна.')}
      <div class="tools">
        <input type="search" class="input search" id="q" placeholder="Хайх…" value="${esc(orderQuery.q)}" autocomplete="off">
        <div class="seg"${isDesk() ? '' : ' data-fill'}>
          ${[['live', 'Идэвхтэй'], ['done', 'Дууссан'], ['all', 'Бүгд']]
            .map(([k, l]) => `<button type="button" data-scope="${k}"${orderQuery.scope === k ? ' data-on' : ''}>${l}</button>`)
            .join('')}
        </div>
      </div>
      <div class="list${isDesk() ? ' card' : ''}" id="orders"${isDesk() ? '' : ' data-rows'}><div class="empty">…</div></div>
    </section>`));
  let timer;
  view.querySelector('#q').addEventListener('input', (e) => {
    orderQuery.q = e.target.value;
    clearTimeout(timer);
    timer = setTimeout(loadOrders, 250);
  });
  view.querySelector('.seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-scope]');
    if (!b) return;
    orderQuery.scope = b.dataset.scope;
    for (const c of view.querySelectorAll('.seg button')) c.toggleAttribute('data-on', c === b);
    void loadOrders();
  });
  void loadOrders();
}

async function loadOrders() {
  const box = document.getElementById('orders');
  if (!box) return;
  let data;
  try {
    data = await sup(`/v1/supplier/orders?scope=${orderQuery.scope}&q=${encodeURIComponent(orderQuery.q)}`);
  } catch (error) {
    if (error.status === 401) return signOut();
    box.replaceChildren(el('<div class="card empty">Ачаалж чадсангүй.</div>'));
    return;
  }
  if (!document.getElementById('orders')) return;
  const none = orderQuery.q ? 'Хайлтад тохирох захиалга олдсонгүй.' : 'Энэ хэсэгт захиалга байхгүй.';
  const ended = (o) => o.state === 'CANCELLED' || o.state === 'REFUNDED';
  const what = (o) => `${esc(o.title)} ×${o.qty}${o.unit === 'kg' ? ' кг' : ''}`;
  // What the supplier keeps of an order is the money's; a seat without it reads what the guest paid.
  const mine = (o) => o.payout_mnt !== null && o.payout_mnt !== undefined;
  const amount = (o) => money(ended(o) ? o.forfeit_mnt ?? 0 : mine(o) ? o.payout_mnt : o.total_mnt);
  const amountWord = (o) => (ended(o) ? 'суутгал' : mine(o) ? 'танд' : 'нийт');
  if (isDesk()) {
    // A desk reads orders as a table: one line each, the code and the money in their columns.
    const rows = data.orders.map((o) => `
      <tr class="order" data-order="${o.id}" data-link tabindex="0">
        <td><span class="mono">№${o.code}</span></td>
        <td>${what(o)}</td>
        <td>${o.guest ? esc(o.guest) : ''}${o.guest_phone ? `<span class="sub mono">${esc(o.guest_phone)}</span>` : ''}${o.guest || o.guest_phone ? '' : '—'}</td>
        <td>${o.receive === 'delivery' ? 'Хүргэлт' : 'Өөрөө авна'}</td>
        <td><span class="mono">${dayLabel(o.receive_on)}</span></td>
        <td><span class="chip" data-s="${o.state}" data-size="sm">${STATE_WORD[o.state] ?? o.state}</span></td>
        <td class="num">${amount(o)}${ended(o) ? '<span class="sub">суутгал</span>' : ''}</td>
      </tr>`);
    box.replaceChildren(el(`
      <div class="table-wrap">
        <table class="table"${rows.length ? '' : ' data-empty'}>
          <thead><tr><th>№</th><th>Мах</th><th>Зочин</th><th>Авах</th><th>Өдөр</th><th>Төлөв</th><th class="num">${may('org.idesh.money') ? 'Танд' : 'Нийт'}</th></tr></thead>
          <tbody>${rows.join('') || `<tr><td colspan="7" class="empty"><b>Захиалга алга</b>${none}</td></tr>`}</tbody>
        </table>
      </div>`));
    const body = box.querySelector('tbody');
    body.addEventListener('click', (e) => {
      const tr = e.target.closest('tr[data-order]');
      if (tr) openOrder(tr.dataset.order);
    });
    body.addEventListener('keydown', (e) => {
      const tr = e.target.closest('tr[data-order]');
      if (tr && (e.key === 'Enter' || e.key === ' ')) {
        e.preventDefault();
        openOrder(tr.dataset.order);
      }
    });
    return;
  }
  box.replaceChildren();
  if (!data.orders.length) box.append(el(`<div class="card empty"><b>Захиалга алга</b>${none}</div>`));
  for (const o of data.orders) {
    const row = el(`
      <button class="order row" type="button" data-order="${o.id}" data-chev>
        <span class="main">
          <span class="title t"><span class="mn">№${o.code}</span> · ${what(o)}</span>
          <span class="sub s">${[
            o.guest ? esc(o.guest) : '',
            o.guest_phone ? `<span class="mn">${esc(o.guest_phone)}</span>` : '',
            o.receive === 'delivery' ? 'хүргэлт' : 'өөрөө авна',
            dayLabel(o.receive_on),
          ].filter(Boolean).join(' · ')}</span>
        </span>
        <span class="end right">
          <span class="chip" data-s="${o.state}" data-size="sm">${STATE_WORD[o.state] ?? o.state}</span>
          <span class="amt val">${amount(o)}<small>${amountWord(o)}</small></span>
        </span>
      </button>`);
    row.addEventListener('click', () => openOrder(o.id));
    box.append(row);
  }
}

const STATE_WORD = {
  PAID: 'Төлсөн', PREPARING: 'Бэлтгэж байна', READY: 'Бэлэн', DISPATCHED: 'Замд',
  HANDED: 'Өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан', REFUNDED: 'Буцаасан',
};
const EVENT_WORD = {
  CREATED: 'Захиалга үүссэн', PAID: 'Төлсөн', PREPARING: 'Бэлтгэж эхэлсэн', READY: 'Бэлэн болсон',
  DISPATCHED: 'Замд гарсан', HANDED: 'Хүлээлгэн өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан',
  REFUND_DUE: 'Буцаалт үүссэн', REFUNDED: 'Буцаалт шилжүүлсэн', RESENT: 'Мэдэгдэл дахин илгээсэн',
};
/** The dot each event takes in the story: red for a cancellation, blue on the road, green when handed. */
const EVENT_TONE = { CANCELLED: 'stop', REFUND_DUE: 'stop', REFUNDED: 'stop', DISPATCHED: 'route', HANDED: 'ready', CLOSED: 'ready' };
const ACTOR_WORD = (a) =>
  a.startsWith('guest:') ? 'зочин'
    : a.startsWith('supplier:owner:') ? 'эзэн'
      : /^supplier:[a-z0-9-]+:[0-9a-f-]{36}$/.test(a) ? 'ажилтан'
        : a.startsWith('supplier:') ? 'таны дэлгэц'
          : a.startsWith('ops') ? 'Basu' : 'систем';
const REASON_SHORT = {
  guest_asked: 'зочин хүссэн', vet: 'мал эмнэлэг', cannot_fulfil: 'биелүүлж чадаагүй',
  no_show: 'зочин ирээгүй', unreachable: 'хаяг дээр холбогдоогүй', draft_expired: 'төлөгдөөгүй',
};

async function openOrder(id) {
  const view = document.getElementById('view');
  let data;
  try {
    data = await sup(`/v1/supplier/orders/${id}`);
  } catch (error) {
    toast(error.message, 'bad');
    return;
  }
  const o = data.order;
  const lane = { PAID: 'paid', PREPARING: 'preparing', READY: 'ready', DISPATCHED: 'dispatched' }[o.state];
  today = today ?? o.receive_on;
  view.replaceChildren(
    el(`<section class="order-page">
          <button class="back link" type="button" id="back">${ICON.left}Захиалгууд</button>
          <div class="page-head head"><div><h1 class="mn">№${o.code}<span class="chip" data-s="${o.state}">${STATE_WORD[o.state] ?? o.state}</span></h1></div></div>
          <div id="act"></div>
          ${o.cancel_reason ? `<div class="terms callout"><b>Цуцлагдсан: ${REASON_SHORT[o.cancel_reason] ?? o.cancel_reason}</b><span>Зочинд ${money(o.refund_mnt ?? 0)} буцна${o.forfeit_mnt ? `, танд ${money(o.forfeit_mnt)} үлдэнэ` : ''}.</span></div>` : ''}
          <div class="sec section-label">Явц</div>
          <ol class="story stepper" data-stepper>
            ${data.events.map((e) => `<li data-done${EVENT_TONE[e.type] ? ` data-k="${EVENT_TONE[e.type]}"` : ''}><span class="w">${EVENT_WORD[e.type] ?? e.type}<span class="s">${ACTOR_WORD(e.actor)}${e.payload?.reason ? ` · ${REASON_SHORT[e.payload.reason] ?? e.payload.reason}` : ''}</span></span><span class="t">${when(e.at)}</span></li>`).join('')}
          </ol>
        </section>`),
  );
  view.querySelector('#back').addEventListener('click', () => show('orders'));
  // The card is the same one today's list shows — facts, phone, and the button.
  const card = renderTicket(o, lane ?? 'done');
  if (!lane) card.querySelector('.btns').remove();
  view.querySelector('#act').append(card);
  if (lane) onActed = () => openOrder(id);
}

/* the stall and the money, each on its own tab */

async function renderStallTab(view) {
  view.append(el(`<div class="stall" id="stall">${pageHead('Миний зар')}</div>`));
  try {
    const { listings } = await sup('/v1/supplier/listings');
    if (document.getElementById('stall')) renderStall(listings);
  } catch (error) {
    if (error.status === 401) signOut();
  }
}

function renderMoneyTab(view) {
  view.append(el(pageHead('Миний мөнгө', 'Хүлээлгэн өгсөн захиалга бүрийн олголт энд.')), el('<div id="money"></div>'));
  void renderMoney();
}

/* the profile: how they are found, where the money goes */

/**
 * How guests find the supplier, and where its money goes. An owner or a
 * manager changes the first; only an owner the second, with their own
 * password, and only a seat that holds the money sees it at all. Staff read
 * the details and nothing more.
 */
async function renderProfile(view) {
  let p;
  try {
    p = await sup('/v1/supplier/profile');
  } catch (error) {
    if (error.status === 401) return signOut();
    view.append(el('<div class="card empty">Ачаалж чадсангүй.</div>'));
    return;
  }
  const edits = may('org.idesh.profile:edit');
  const seesBank = may('org.idesh.money');
  const movesBank = may('org.idesh.profile:bank');
  const terms = [
    `Утас <b class="mn">${esc(p.phone)}</b>`,
    p.merchant_tin ? `ТТД <b class="mn">${esc(p.merchant_tin)}</b>` : 'ТТД алга',
    p.commission_pct !== null && p.commission_pct !== undefined ? `шимтгэл ${p.commission_pct}%` : '',
  ].filter(Boolean).join(' · ');
  const form = el(`
    <section>
      ${pageHead('Профайл', 'Зочид таныг ингэж харна.')}
      <div class="card profile">
        <div class="hint">${terms}. Эдгээр нь гэрээний нөхцөл — өөрчлөх бол Basu-д хэлнэ.</div>
        <div class="card-body">
          <label class="field"><span>Нэр</span><input name="name" value="${esc(p.name)}"></label>
          <label class="field"><span>Хотод мах авах цэг</span><input name="address" value="${esc(p.pickup_address)}"><small>Зочин өөрөө ирж авахдаа энд ирнэ.</small></label>
          <label class="field"><span>Юу зарах вэ, хаанаас</span><textarea name="about">${esc(p.about ?? '')}</textarea></label>
          ${seesBank ? `<div class="form-group">
            <div class="sec section-label">Олголт очих данс</div>
            <label class="field"><span>Банк</span><input name="bank_name" list="banks" value="${esc(p.bank_name ?? '')}"></label>
            <datalist id="banks">${BANKS.map((b) => `<option value="${b}">`).join('')}</datalist>
            <label class="field"><span>Дансны дугаар</span><input name="bank_account" inputmode="numeric" value="${esc(p.bank_account ?? '')}"></label>
            <label class="field"><span>Данс эзэмшигчийн нэр</span><input name="bank_holder" value="${esc(p.bank_holder ?? '')}"></label>
            ${p.bank_account && !p.bank_verified ? '<div class="callout" data-k="warn"><span>Шинэ дансыг Basu санхүү гэрээтэй тулгаж баталгаажуулах хүртэл олголт хийгдэхгүй.</span></div>' : ''}
            ${movesBank ? '' : '<p class="cap">Данс солих нь зөвхөн эзний эрх.</p>'}
            <div id="password-step" hidden><label class="field"><span>Таны нууц үг</span><input name="password" type="password" autocomplete="current-password"><small>Мөнгө очих газар солигдож байгаа тул өөрийн нууц үгээр баталгаажуулна.</small></label></div>
          </div>` : ''}
          ${edits ? '<button class="btn" data-v="primary" data-size="lg" type="button" id="save">Хадгалах</button>' : '<p class="cap">Мэдээллийг эзэн эсвэл менежер засна.</p>'}
        </div>
      </div>
    </section>`);
  for (const input of form.querySelectorAll('input, textarea')) {
    const bank = ['bank_name', 'bank_account', 'bank_holder'].includes(input.name);
    if (input.name === 'password') continue;
    input.disabled = bank ? !movesBank : !edits;
  }
  form.querySelector('#save')?.addEventListener('click', async () => {
    const v = (name) => form.querySelector(`[name="${name}"]`)?.value.trim();
    const body = { name: v('name'), address: v('address'), about: v('about') };
    if (movesBank) Object.assign(body, { bank_name: v('bank_name'), bank_account: v('bank_account'), bank_holder: v('bank_holder'), password: v('password') || undefined });
    try {
      await sup('/v1/supplier/profile', { method: 'PATCH', body });
      toast('Хадгалагдлаа.');
      for (const n of document.querySelectorAll('.supplier-name')) n.textContent = v('name');
      show('profile');
    } catch (error) {
      if (error.code === 'PASSWORD_REQUIRED' || error.code === 'BAD_PASSWORD') {
        // The money is moving somewhere new: the owner says it is them.
        form.querySelector('#password-step').hidden = false;
        form.querySelector('[name="password"]').focus();
      }
      toast(error.message, 'bad');
    }
  });
  view.append(form);
  // The person's own account — a paired screen has none. Most owners came in
  // by phone, and an address is their only way back from a forgotten password.
  if (seat && !seat.screen) view.append(accountWays({ token: token() }));
}

/* ── boot ────────────────────────────────────────────────────────── */

/**
 * Three ways this page is opened: by a screen paired with a code, by a
 * person signed in with their phone — from the app's tile, or a browser on
 * a computer — and by somebody who is neither yet.
 */
async function boot() {
  root.replaceChildren();
  applyDesk();
  seat = null;
  if (watchingAll()) {
    openModule();
    return;
  }
  if (!token()) {
    showLanding();
    return;
  }
  try {
    seat = await sup('/v1/supplier/seat');
    openModule();
    return;
  } catch (error) {
    if (error.status === 403) {
      root.append(notHere(error.message));
      return;
    }
    if (error.status !== 401) {
      toast(error.message, 'bad');
      return;
    }
  }
  // Not a seat at a contracted supplier. A screen whose pairing was taken back
  // starts again; a person is either still applying or not signed in at all.
  if (!ORG && store.supplierToken) {
    store.supplierToken = null;
    boot();
    return;
  }
  showApply();
}

/** Opened from the dashboard for a business this person does not work at as a supplier. */
function notHere(message) {
  const card = el(`
    <div class="door">
      <div class="card">
        <div class="brand wordmark" data-size="sm">Basu</div>
        <h2>Нээх эрхгүй байна</h2>
        <p>${esc(message)} Энэ байгууллагын нийлүүлэгчийн хэсэгт та ажилладаггүй байна.</p>
        <a class="btn" data-v="primary" data-size="lg" href="/dashboard">Dashboard руу буцах</a>
      </div>
      ${DOOR_FOOT}
    </div>`);
  return card;
}

boot();

const poll = setInterval(() => {
  if (!document.hidden && document.getElementById('board')) void refreshBoard();
}, 3000);
addEventListener('pagehide', () => clearInterval(poll));
</script>
