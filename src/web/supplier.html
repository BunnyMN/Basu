<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Нийлүүлэгч — Basu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/app.css">
<style>
/* The kitchen display's sibling: a tool for a person with a knife in one
   hand and a phone in the other. Big type, state by colour and column. */
body{background:var(--sunk)}
.top{
  display:flex;align-items:baseline;gap:14px;padding:12px 18px;
  border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap;
}
.top h1{font-size:1rem;font-weight:700}
.top .day{font-family:"IBM Plex Mono",monospace;font-size:.9rem;font-weight:600;margin-left:auto;font-variant-numeric:tabular-nums}
.top .swap{
  font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);background:none;
  border:1px solid var(--line-2);border-radius:2px;padding:3px 8px;
}
.top .swap:hover{color:var(--ink);border-color:var(--ink-3)}
.top .conn{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ready)}
.top .conn[data-stale]{color:var(--stop)}

.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;padding:14px;align-items:start}
.board:empty{display:none}
@media(max-width:1000px){.board{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.board{grid-template-columns:1fr}}

.lane{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:11px;min-height:120px}
.lane > h2{
  font-family:"IBM Plex Mono",monospace;font-size:.68rem;text-transform:uppercase;
  letter-spacing:.14em;color:var(--ink-3);display:flex;justify-content:space-between;
  font-weight:500;margin-bottom:10px;
}
.lane .stack{display:flex;flex-direction:column;gap:9px;min-width:0}
.lane .none{color:var(--line-2);font-size:.8rem;text-align:center;padding:14px 0}

.ticket{border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:3px;padding:11px 12px;background:var(--surface-2);min-width:0}
.ticket .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px}
.ticket .id{font-family:"IBM Plex Mono",monospace;font-size:.86rem;font-weight:600}
.ticket .day{font-family:"IBM Plex Mono",monospace;font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
.ticket .what{font-size:.94rem;font-weight:700;margin-bottom:2px;overflow-wrap:anywhere}
.ticket .meta{font-family:"IBM Plex Mono",monospace;font-size:.68rem;color:var(--ink-3);margin-bottom:7px;overflow-wrap:anywhere;line-height:1.5}
.ticket .where{font-family:"Golos Text",sans-serif;font-size:.78rem;font-weight:700;color:var(--ink-2);margin-bottom:6px;overflow-wrap:anywhere}
.ticket .pay{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ready);font-weight:600;margin:-4px 0 7px}
.ticket .grace{font-size:.72rem;color:var(--hold);margin:-4px 0 7px;line-height:1.4}
.ticket .reasons{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.ticket .reasons .q{font-size:.78rem;font-weight:700;margin-bottom:6px}
.ticket .reasons label{display:flex;gap:8px;align-items:flex-start;font-size:.8rem;padding:5px 0;cursor:pointer;line-height:1.35}
.ticket .reasons label input{margin-top:2px;accent-color:var(--accent)}
.ticket .reasons .money{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-2);margin:6px 0 8px;line-height:1.5;min-height:1.5em}
.ticket .reasons .money b{color:var(--stop)}
.ticket .btns{display:flex;gap:6px;flex-wrap:wrap}
.ticket .btns .btn{flex:1;min-width:96px;padding:9px 8px}
.ticket[data-lane="paid"]{border-left-color:var(--route)}
.ticket[data-lane="paid"] .day{color:var(--route)}
.ticket[data-lane="preparing"]{border-left-color:var(--accent);background:var(--accent-soft)}
.ticket[data-lane="preparing"] .day{color:var(--accent-ink)}
.ticket[data-lane="ready"]{border-left-color:var(--ready)}
.ticket[data-lane="ready"] .day{color:var(--ready)}
.ticket[data-lane="dispatched"]{border-left-color:var(--route)}
/* A delivery that is due today has to be seen across the yard. */
.ticket[data-due]{box-shadow:inset 0 0 0 1px var(--accent-line)}

/* ── the module's frame: tabs under the top on a phone, beside it on a computer ── */
.shell{min-height:100vh;display:flex;flex-direction:column}
.tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto}
.tabs button{
  flex:1;font-family:"Golos Text",sans-serif;font-size:.82rem;font-weight:600;padding:9px 6px;border:none;background:none;
  color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;
}
.tabs button[data-on]{color:var(--accent-ink);border-bottom-color:var(--accent)}
.view{flex:1;min-width:0}
@media(min-width:900px){
  .shell{display:grid;grid-template-columns:200px 1fr;grid-template-rows:auto 1fr}
  .shell .top{grid-column:1 / -1}
  .tabs{flex-direction:column;border-bottom:none;border-right:1px solid var(--line);padding:14px 10px;gap:2px;overflow:visible}
  .tabs button{text-align:left;border-bottom:none;border-left:2px solid transparent;padding:10px 12px;border-radius:0 3px 3px 0}
  .tabs button[data-on]{border-left-color:var(--accent);background:var(--accent-soft)}
}
/* ── today's numbers ── */
.home{padding:14px 14px 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.cards .card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:5px;padding:12px 14px}
.cards .card[data-tone="accent"]{border-left-color:var(--accent)}
.cards .card[data-tone="ready"]{border-left-color:var(--ready)}
.cards .card[data-tone="stop"]{border-left-color:var(--stop)}
.cards .card .lab{display:block;margin-bottom:4px}
.cards .card b{font-family:"IBM Plex Mono",monospace;font-size:1.6rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cards .card small{margin-left:6px;font-size:.74rem;color:var(--ink-3)}
.cards .card p{font-size:.8rem;color:var(--ink-2);margin:6px 0 0;line-height:1.5}
.cards .card p b{font-family:inherit;font-size:inherit;font-weight:700;color:var(--ink)}
.cards .card p b.warn{color:var(--stop)}
/* ── the orders list ── */
.orders{padding:14px}
.orders .tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.orders .tools input{flex:1;min-width:200px;padding:9px 11px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem}
.chips{display:flex;gap:6px}
.chips button{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--line-2);border-radius:99px;background:var(--surface);color:var(--ink-3)}
.chips button[data-on]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.row.order{width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit}
.row.order:hover{border-color:var(--ink-3)}
.row .chip{font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:2px;border:1px solid var(--line-2);color:var(--ink-2)}
.row .chip[data-s="PAID"]{color:var(--route);border-color:var(--route-line)}
.row .chip[data-s="PREPARING"]{color:var(--accent-ink);border-color:var(--accent-line)}
.row .chip[data-s="READY"],.row .chip[data-s="HANDED"]{color:var(--ready);border-color:var(--ready-line)}
.row .chip[data-s="CANCELLED"],.row .chip[data-s="REFUNDED"]{color:var(--stop);border-color:var(--stop-line)}
.none{color:var(--ink-3);font-size:.84rem;padding:14px;text-align:center}
/* ── one order ── */
.order-page{padding:14px;max-width:720px}
.order-page .back{background:none;border:none;color:var(--accent-ink);font-family:"Golos Text",sans-serif;font-weight:600;font-size:.9rem;padding:0 0 10px}
.order-head h2{font-size:1.2rem;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.order-head .what{font-size:.92rem;color:var(--ink-2);margin:4px 0 12px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:12px}
.facts div{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:.84rem;color:var(--ink-2);line-height:1.5}
.facts .lab{display:block;margin-bottom:2px}
.facts b{display:block;color:var(--ink);font-size:.95rem}
.facts a{color:var(--accent-ink);font-family:"IBM Plex Mono",monospace;font-weight:600;text-decoration:none}
.order-page h3{font-family:"IBM Plex Mono",monospace;font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-3);font-weight:500;margin:16px 0 8px}
.order-page #act .ticket{margin-bottom:4px}
.story{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:6px}
.story li{position:relative;padding:4px 0 10px 16px;font-size:.88rem}
.story li::before{content:"";position:absolute;left:-6px;top:10px;width:10px;height:10px;border-radius:99px;background:var(--ready)}
.story .t{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink-3);margin-right:8px}
.story small{display:block;font-size:.76rem;color:var(--ink-3)}
.profile{margin:14px}
.profile .hint{font-size:.82rem;color:var(--ink-2);margin:-4px 0 12px;line-height:1.5}
/* ── the stall ───────────────────────────────────────────────────── */
.stall{padding:0 14px 24px}
.stall > h2{
  font-family:"IBM Plex Mono",monospace;font-size:.68rem;text-transform:uppercase;
  letter-spacing:.14em;color:var(--ink-3);font-weight:500;margin:6px 0 10px;
}
.rows{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.row{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);
  border:1px solid var(--line);border-radius:4px;padding:10px 12px;
}
.row[data-off]{opacity:.55}
.row .name{font-weight:700;font-size:.92rem;flex:1;min-width:160px}
.row .name small{display:block;font-family:"IBM Plex Mono",monospace;font-size:.64rem;color:var(--ink-3);font-weight:400;margin-top:2px}
.row .num{font-family:"IBM Plex Mono",monospace;font-size:.82rem;font-variant-numeric:tabular-nums;min-width:90px}
.row .num small{display:block;font-size:.58rem;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.row .btns{display:flex;gap:6px}
.row input{
  width:110px;padding:6px 8px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2);
  color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:.82rem;
}
.new{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px}
.new h3{font-size:.95rem;font-weight:700;margin-bottom:10px}
.new .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.new label{display:flex;flex-direction:column;gap:4px;font-family:"IBM Plex Mono",monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.new label.wide{grid-column:1 / -1}
.new input,.new select,.new textarea{
  width:100%;padding:8px 9px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2);
  color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:.86rem;letter-spacing:0;text-transform:none;
}
.new textarea{font-family:inherit;min-height:52px}
.new .check{flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-family:inherit;font-size:.86rem;color:var(--ink)}
.new .check input{width:auto}
.new .foot{display:flex;justify-content:flex-end;margin-top:10px}

/* ── pairing ─────────────────────────────────────────────────────── */
.pair{max-width:380px;margin:60px auto;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:26px 24px;text-align:center}
.pair h2{font-size:1.1rem;margin-bottom:6px}
.pair p{color:var(--ink-2);font-size:.86rem;margin:0 0 18px}
.pair input{
  width:100%;text-align:center;font-size:1.5rem;letter-spacing:.28em;padding:12px;
  border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2);
  color:var(--ink);margin-bottom:12px;font-variant-numeric:tabular-nums;
}
.pair .hint{font-size:.74rem;color:var(--ink-3);margin-top:16px;line-height:1.5;text-align:left}
.pair .hint code{background:var(--surface-2);padding:1px 5px;border-radius:2px;border:1px solid var(--line)}
.pair .or{display:flex;align-items:center;gap:10px;margin:20px 0 14px;font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.pair .or::before,.pair .or::after{content:"";flex:1;height:1px;background:var(--line)}
.venues{display:flex;flex-direction:column;gap:6px}
.venues button{
  width:100%;text-align:left;display:flex;align-items:center;gap:10px;
  font-family:"Golos Text",sans-serif;font-size:.86rem;padding:11px 13px;border-radius:3px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
}
.venues button:hover{border-color:var(--accent-line);background:var(--accent-soft)}
.venues .tag{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.venues button[data-watched] .tag{color:var(--ready)}

/* ── becoming a supplier ────────────────────────────────────────── */
.apply{max-width:420px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:24px}
.apply h2{font-size:1.1rem;margin-bottom:6px}
.apply p{color:var(--ink-2);font-size:.86rem;margin:0 0 16px;line-height:1.5}
.apply label{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-family:"IBM Plex Mono",monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3)}
.apply input,.apply textarea{width:100%;padding:9px 10px;border:1px solid var(--line-2);border-radius:3px;background:var(--surface-2);color:var(--ink);font-family:"IBM Plex Mono",monospace;font-size:.88rem;letter-spacing:0;text-transform:none}
.apply textarea{font-family:inherit;min-height:60px}
.apply .foot{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.apply .foot .btn{flex:1}
.apply .back{background:none;border:none;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:14px 0 0;width:100%;text-align:center}
.status{text-align:center;padding:10px 0 4px}
.status .big{font-size:1.4rem;font-weight:900;letter-spacing:-.03em}
.status .cap{font-size:.84rem;color:var(--ink-2);margin-top:6px;line-height:1.5}
.status[data-s="applied"] .big{color:var(--hold)}
.status[data-s="contracted"] .big{color:var(--ready)}
.status[data-s="declined"] .big{color:var(--stop)}
.code{margin:14px 0;padding:14px;border:1px dashed var(--line-2);border-radius:4px;text-align:center}
.code b{display:block;font-family:"IBM Plex Mono",monospace;font-size:1.9rem;font-weight:600;letter-spacing:.14em;margin-top:4px}
.otp{display:flex;gap:8px}
.otp[hidden]{display:none}
.otp input{flex:1}
.pair .become{margin-top:18px;font-size:.82rem;color:var(--ink-2)}
.pair .become a{color:var(--accent-ink);font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { api, store, toast, mnt, KIND, dayLabel } from '/api.js';

const root = document.getElementById('root');
const el = (html) => {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
};
const esc = (value) => {
  const node = document.createElement('span');
  node.textContent = value ?? '';
  return node.innerHTML;
};

/**
 * Which stall this screen is showing.
 *
 * A real screen is paired to one supplier and sees that one — the token says
 * so and the API enforces it. A walkthrough moves between four suppliers, so
 * the demo can watch every one at once, read-only on the stall.
 */
const ALL = 'all-suppliers';
const watchingAll = () => store.supplierToken === ALL;
/** A paired screen's token, or the owner's own sign-in: the API takes either. */
const token = () => store.supplierToken || store.guestToken;
/** Which way we came in: a screen paired by code, or a person by phone. */
const mode = () => (store.supplierToken ? 'device' : 'owner');

function signOut() {
  store.supplierToken = null;
  if (mode() === 'owner') store.guestToken = null;
  boot();
}

/* ── pairing ─────────────────────────────────────────────────────── */

async function showPairing() {
  const [{ devices }, { suppliers }] = await Promise.all([
    api('/dev/supplier-codes').catch(() => ({ devices: [] })),
    api('/dev/suppliers').catch(() => ({ suppliers: [] })),
  ]);
  root.replaceChildren();

  const card = el(`
    <div class="pair">
      <h2>Дэлгэцээ холбоно уу</h2>
      <p>Basu-гаас авсан 8 оронтой кодоо оруулна уу.</p>
      <input inputmode="numeric" maxlength="8" placeholder="········" aria-label="Холбох код">
      <button class="btn" data-v="primary" data-size="lg" type="button">Холбох</button>
    </div>`);

  const input = card.querySelector('input');
  const submit = async () => {
    try {
      const { token } = await api('/v1/supplier/pair', {
        method: 'POST',
        body: { pairing_code: input.value.trim() },
      });
      store.supplierToken = token;
      boot();
    } catch (error) {
      toast(error.message, 'bad');
      input.select();
    }
  };
  card.querySelector('button').addEventListener('click', submit);
  input.addEventListener('keydown', (e) => e.key === 'Enter' && submit());

  if (devices.length) {
    input.value = devices[0].code;
    const hint = el('<div class="hint">Холбоогүй нийлүүлэгчийн кодууд:<br></div>');
    for (const device of devices) hint.append(el(`<code>${device.code}</code> ${esc(device.name)}<br>`));
    card.append(hint);
  }

  if (suppliers.length) {
    card.append(el('<div class="or">эсвэл демо горимоор</div>'));
    const list = el('<div class="venues"></div>');
    const all = el(`
      <button type="button" data-watched>
        Бүх нийлүүлэгч
        <span class="tag">${suppliers.length}</span>
      </button>`);
    all.addEventListener('click', () => {
      store.supplierToken = ALL;
      boot();
    });
    list.append(all);
    for (const s of suppliers) {
      const button = el(`
        <button type="button"${s.watched ? ' data-watched' : ''}>
          ${esc(s.name)}
          <span class="tag">${s.watched ? 'холбогдсон' : 'холбогдоогүй'}</span>
        </button>`);
      button.addEventListener('click', async () => {
        try {
          const { token } = await api('/dev/supplier-token', {
            method: 'POST',
            body: { supplier_id: s.id },
          });
          store.supplierToken = token;
          boot();
        } catch (error) {
          toast(error.message, 'bad');
        }
      });
      list.append(button);
    }
    card.append(list);
  }

  if (!devices.length && !suppliers.length) {
    card.append(el('<div class="hint">Нийлүүлэгч алга. <code>npm run seed</code> ажиллуулна уу.</div>'));
  }

  // A person, not a screen: the way in is a phone.
  const become = el('<div class="become"><a id="become">‹ Утсаараа нэвтрэх</a></div>');
  become.querySelector('#become').addEventListener('click', () => showLanding());
  card.append(become);

  root.append(card);
  input.focus();
}

/* ── becoming a supplier ─────────────────────────────────────────── */

/**
 * The form a would-be supplier fills in, behind a phone they have proved.
 *
 * The phone is not a field: it is the number they sign in with, by OTP, and
 * that is the only proof anybody has that it is theirs. What they type is who
 * they are and where a guest collects. Ops answers from the ops page and the
 * answer arrives here — and by SMS, with the code, when it is yes.
 */
async function showApply() {
  root.replaceChildren();
  if (!store.guestToken) {
    root.append(signInCard());
    return;
  }
  let application;
  try {
    ({ application } = await api('/v1/supplier/application', { token: store.guestToken }));
  } catch (error) {
    if (error.status === 401) {
      store.guestToken = null;
      root.append(signInCard());
      return;
    }
    toast(error.message, 'bad');
    return;
  }
  root.append(application ? statusCard(application) : applyForm());
}

/** Phone and a one-time code, the way the app signs in. No password. */
function signInCard() {
  const card = el(`
    <div class="apply" id="signin">
      <h2>Нийлүүлэгчийн хэсэг</h2>
      <p>Гэрээт нийлүүлэгч гэрээний утсаараа нэвтэрнэ. Шинээр нийлүүлэгч болох бол мөн эндээс — эхлээд утсаа баталгаажуулна.</p>
      <label>Утас<input name="phone" inputmode="tel" placeholder="+976XXXXXXXX"></label>
      <div class="otp" hidden><input name="code" inputmode="numeric" maxlength="6" placeholder="6 оронтой код"></div>
      <div class="foot">
        <button class="btn" data-v="primary" type="button" id="send">Код авах</button>
      </div>
      <button class="back" type="button" id="back">Дэлгэц холбох кодоор ›</button>
    </div>`);
  const phone = card.querySelector('[name="phone"]');
  const code = card.querySelector('[name="code"]');
  const send = card.querySelector('#send');
  let asked = false;
  send.addEventListener('click', async () => {
    try {
      if (!asked) {
        await api('/v1/auth/otp', { method: 'POST', body: { phone: phone.value.trim() } });
        asked = true;
        card.querySelector('.otp').hidden = false;
        send.textContent = 'Нэвтрэх';
        code.focus();
        toast('Код илгээгдлээ.');
        return;
      }
      const { token } = await api('/v1/auth/verify', {
        method: 'POST',
        body: { phone: phone.value.trim(), code: code.value.trim(), device: 'Нийлүүлэгчийн дэлгэц' },
      });
      store.guestToken = token;
      boot();
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  // The demo has no SMS to read a code from; a walkthrough skips straight in.
  api('/dev/clock')
    .then(() => {
      const demo = el('<button class="btn" type="button" id="demo">Демо: кодгүй нэвтрэх</button>');
      demo.addEventListener('click', async () => {
        // A number typed is the person who typed it; none typed is somebody
        // new, so a walkthrough reaches the form rather than the seed's own
        // waiting application.
        const fresh = `+97688${String(Date.now() % 1_000_000).padStart(6, '0')}`;
        const { token } = await api('/dev/login', {
          method: 'POST',
          body: { phone: phone.value.trim() || fresh, device: 'Нийлүүлэгчийн дэлгэц' },
        });
        store.guestToken = token;
        boot();
      });
      card.querySelector('.foot').append(demo);
    })
    .catch(() => {});
  card.querySelector('#back').addEventListener('click', showPairing);
  return card;
}

/** The front door: a phone first, a pairing code for a tablet behind it. */

  root.replaceChildren(signInCard());
}

/** The banks a person in Ulaanbaatar has an account at, most common first. */
const BANKS = ['Хаан банк', 'Голомт банк', 'Худалдаа хөгжлийн банк', 'Хас банк', 'Төрийн банк', 'Капитрон банк', 'Ариг банк', 'Богд банк', 'М банк'];

const APPLICATION = {
  applied: ['Хүлээгдэж байна', 'Basu хүсэлтийг тань үзэж байна. Батлагдвал энд болон SMS-ээр код ирнэ.'],
  contracted: ['Батлагдлаа', 'Та гэрээт нийлүүлэгч боллоо.'],
  declined: ['Татгалзсан', ''],
};

function statusCard(a) {
  const [word, cap] = APPLICATION[a.state] ?? [a.state, ''];
  const card = el(`
    <div class="apply" id="application">
      <h2>${esc(a.name)}</h2>
      <div class="status" data-s="${a.state}">
        <div class="big">${word}</div>
        <div class="cap">${a.state === 'declined' ? `Шалтгаан: ${esc(a.decline_reason)}` : cap}</div>
      </div>
    </div>`);
  if (a.state === 'contracted' && a.pairing_code) {
    card.append(el(`<div class="code">Дэлгэц холбох код<b>${a.pairing_code}</b></div>`));
    const pair = el('<button class="btn" data-v="primary" data-size="lg" type="button" id="pair-now">Энэ кодоор холбох</button>');
    pair.addEventListener('click', async () => {
      try {
        const { token } = await api('/v1/supplier/pair', { method: 'POST', body: { pairing_code: a.pairing_code } });
        store.supplierToken = token;
        boot();
      } catch (error) {
        toast(error.message, 'bad');
      }
    });
    card.append(pair);
  } else if (a.state === 'contracted' && a.paired) {
    card.append(el('<p>Дэлгэц аль хэдийн холбогдсон. Код шинээр хэрэгтэй бол Basu-д хэлнэ үү.</p>'));
  } else if (a.state === 'declined') {
    const again = el('<button class="btn" data-size="lg" type="button" id="again">Дахин хүсэлт гаргах</button>');
    again.addEventListener('click', () => {
      root.replaceChildren(applyForm());
    });
    card.append(again);
  }
  card.append(el('<button class="back" type="button" id="back">‹ Дэлгэц холбох</button>'));
  card.querySelector('#back').addEventListener('click', showPairing);
  return card;
}

/* ── the board ───────────────────────────────────────────────────── */

/** Set by whichever view holds tickets besides the board, to redraw after an action. */
let onActed = null;

const LANES = [
  { key: 'paid', title: 'Төлсөн' },
  { key: 'preparing', title: 'Бэлтгэж байна' },
  { key: 'ready', title: 'Бэлэн' },
  { key: 'dispatched', title: 'Замд' },
];

let today = null;

function renderBoard(data) {
  today = data.today;
  const board = document.getElementById('board');
  if (!board) return;
  const name = document.getElementById('supplier');
  if (name) name.textContent = watchingAll() ? 'Бүх нийлүүлэгч' : (data.supplier?.name ?? 'Нийлүүлэгч');
  const day = document.getElementById('today');
  if (day) day.textContent = dayLabel(data.today);
  const conn = document.getElementById('conn');
  if (conn) {
    conn.textContent = 'холбогдсон';
    delete conn.dataset.stale;
  }

  const scroll = window.scrollY;
  board.replaceChildren();
  for (const lane of LANES) {
    const tickets = data.lanes[lane.key] ?? [];
    const column = el(`
      <section class="lane">
        <h2><span>${lane.title}</span><span>${tickets.length}</span></h2>
        <div class="stack"></div>
      </section>`);
    const stack = column.querySelector('.stack');
    if (!tickets.length) stack.append(el('<div class="none">—</div>'));
    for (const ticket of tickets) stack.append(renderTicket(ticket, lane.key));
    board.append(column);
  }
  window.scrollTo(0, scroll);
}

function renderTicket(ticket, lane) {
  const delivery = ticket.receive === 'delivery';
  const node = el(`
    <article class="ticket" data-lane="${lane}"${ticket.receive_on <= today && lane !== 'paid' ? ' data-due' : ''}>
      <div class="head">
        <span class="id">№${ticket.code}</span>
        <span class="day">${dayLabel(ticket.receive_on)}</span>
      </div>
      <div class="what">${esc(ticket.title)} ×${ticket.qty}${ticket.unit === 'kg' ? ' кг' : ''}</div>
      ${watchingAll() ? `<div class="where">${esc(ticket.supplier.name)}</div>` : ''}
      <div class="meta">${KIND[ticket.kind] ?? ticket.kind} · ${mnt(ticket.total_mnt)}${
        ticket.guest ? ` · ${esc(ticket.guest)}` : ''
      }${ticket.guest_phone ? ` · <a href="tel:${esc(ticket.guest_phone)}">${esc(ticket.guest_phone)}</a>` : ''}<br>${
        delivery
          ? `Хүргэлт: ${esc(ticket.address)} · ${esc(ticket.address_phone)}`
          : 'Өөрөө ирж авна'
      }</div>
      ${typeof ticket.payout_mnt === 'number' ? `<div class="pay">Танд очих ${mnt(ticket.payout_mnt)}</div>` : ''}
      ${
        lane === 'ready' && !delivery && ticket.no_show_from
          ? `<div class="grace">${
              new Date(ticket.no_show_from) <= new Date()
                ? 'Зочин ирсэнгүй бол «зочин ирээгүй» гэж цуцалж болно.'
                : `Ирэхгүй бол ${dayLabel(ticket.no_show_from.slice(0, 10))}-нөөс «зочин ирээгүй» гэж цуцалж болно.`
            }</div>`
          : ''
      }
      <div class="btns"></div>
    </article>`);

  const buttons = node.querySelector('.btns');
  const send = async (action, body, button) => {
    if (button) button.disabled = true;
    try {
      await api(
        watchingAll()
          ? `/dev/supplier/orders/${ticket.id}/${action}`
          : `/v1/supplier/orders/${ticket.id}/${action}`,
        { method: 'POST', token: watchingAll() ? undefined : token(), body },
      );
      await refreshBoard();
      await onActed?.();
    } catch (error) {
      if (error.status === 401 && !watchingAll()) {
        signOut();
        return;
      }
      toast(error.message, 'bad');
      if (button) button.disabled = false;
    }
  };
  const add = (label, action, variant) => {
    const button = el(
      `<button class="btn" type="button"${variant ? ` data-v="${variant}"` : ''}>${label}</button>`,
    );
    button.addEventListener('click', () => send(action, {}, button));
    buttons.append(button);
  };

  /**
   * Cancelling asks why, because the reason decides the money — the
   * supplier picks from what can be true of this order, sees what the guest
   * gets back and what stays, and only then confirms.
   */
  const cancelWith = (reasons) => {
    const button = el('<button class="btn" type="button" data-v="danger" data-a="cancel">Цуцлах</button>');
    button.addEventListener('click', () => {
      const slaughtered = lane !== 'paid';
      const meat = ticket.total_mnt - (delivery ? ticket.delivery_fee_mnt ?? 0 : 0);
      const box = el(`
        <div class="reasons">
          <div class="q">Яагаад цуцлах вэ?</div>
          ${reasons
            .map(
              (r) =>
                `<label><input type="radio" name="reason-${ticket.id}" value="${r}"><span>${REASON[r]}</span></label>`,
            )
            .join('')}
          <div class="money"></div>
          <div class="btns">
            <button class="btn" type="button" data-v="danger" data-a="confirm" disabled>Цуцлах</button>
            <button class="btn" type="button" data-a="keep">Болих</button>
          </div>
        </div>`);
      const money = box.querySelector('.money');
      const confirm = box.querySelector('[data-a="confirm"]');
      box.addEventListener('change', () => {
        const reason = box.querySelector('input:checked')?.value;
        if (!reason) return;
        const forfeit = slaughtered && !SUPPLIER_FAULT.includes(reason) ? Math.round((meat * FORFEIT_PCT) / 100) : 0;
        money.innerHTML = forfeit
          ? `Зочинд ${mnt(ticket.total_mnt - forfeit)} буцна, <b>${mnt(forfeit)}</b> (${FORFEIT_PCT}%) танд үлдэнэ.`
          : `Зочинд ${mnt(ticket.total_mnt)} бүтнээр буцна.`;
        confirm.disabled = false;
      });
      confirm.addEventListener('click', () => {
        const reason = box.querySelector('input:checked')?.value;
        if (reason) send('cancel', { reason }, confirm);
      });
      box.querySelector('[data-a="keep"]').addEventListener('click', () => {
        box.remove();
        buttons.style.display = '';
      });
      // The row's own buttons step aside while the question is open — by
      // style, because the class sets display and would outrank `hidden`.
      buttons.style.display = 'none';
      node.append(box);
    });
    buttons.append(button);
  };

  if (lane === 'paid') {
    add('Бэлтгэж эхлэх', 'prepare', 'primary');
    cancelWith(['guest_asked', 'cannot_fulfil', 'vet']);
  } else if (lane === 'preparing') {
    add('Бэлэн боллоо', 'ready', 'primary');
    cancelWith(['guest_asked', 'vet', 'cannot_fulfil']);
  } else if (lane === 'ready') {
    if (delivery) add('Замд гаргах', 'dispatch', 'primary');
    else add('Хүлээлгэн өгсөн', 'hand', 'primary');
    cancelWith(delivery ? ['guest_asked', 'unreachable', 'vet', 'cannot_fulfil'] : ['guest_asked', 'no_show', 'vet', 'cannot_fulfil']);
  } else {
    add('Хүлээлгэн өгсөн', 'hand', 'primary');
    cancelWith(['unreachable', 'guest_asked', 'cannot_fulfil']);
  }
  return node;
}

/** The words for a reason, and which reasons are the supplier's own fault. */
const REASON = {
  guest_asked: 'Зочин хүссэн — утсаар ярьж тохирсон',
  vet: 'Мал эмнэлгийн шалгалт унасан',
  cannot_fulfil: 'Биелүүлж чадахгүй боллоо',
  no_show: 'Зочин ирээгүй — өдрөөс 3 хоног өнгөрсөн',
  unreachable: 'Хаяг дээр холбогдож чадсангүй',
};
const SUPPLIER_FAULT = ['vet', 'cannot_fulfil'];
const FORFEIT_PCT = 10;

async function refreshBoard() {
  try {
    const data = watchingAll()
      ? await api('/dev/supplier/board')
      : await api('/v1/supplier/board', { token: token() });
    renderBoard(data);
  } catch (error) {
    if (error.status === 401 && !watchingAll()) {
      signOut();
      return;
    }
    const conn = document.getElementById('conn');
    if (conn) {
      conn.textContent = 'холболт тасарсан';
      conn.dataset.stale = '1';
    }
  }
}

/* ── the stall ───────────────────────────────────────────────────── */

/**
 * The supplier's own listings, edited here and nowhere else. Twenty sheep
 * becoming fifteen sold is a fact only they know; ops does not edit numbers
 * on a phone. Drawn separately from the board so a poll never wipes a form
 * somebody is typing into.
 */
function renderStall(listings) {
  const stall = document.getElementById('stall');
  if (!stall) return;
  stall.replaceChildren(el('<h2>Миний зар</h2>'));

  const rows = el('<div class="rows"></div>');
  if (!listings.length) rows.append(el('<div class="row">Зар алга. Доор нэмнэ үү.</div>'));
  for (const l of listings) rows.append(renderRow(l));
  stall.append(rows);
  stall.append(newForm());
}

/**
 * What the supplier is owed and what has been sent: one line per order,
 * with the rate and the account the contract names. The list is ops's to
 * act on; here it is the supplier's to check.
 */
async function renderMoney() {
  const box = document.getElementById('money');
  if (!box) return;
  let data;
  try {
    data = await api('/v1/supplier/money', { token: token() });
  } catch {
    box.replaceChildren(el('<div class="row">Тооцоо ачаалж чадсангүй.</div>'));
    return;
  }
  const due = data.settlements.filter((t) => t.state !== 'paid');
  const owed = due.reduce((sum, t) => sum + t.amount_mnt, 0);
  box.replaceChildren(
    el(`<div class="row" id="terms">
          <div class="name">Гэрээний нөхцөл<small>Шимтгэл ${data.commission_pct ?? '—'}% (махны үнээс; хүргэлтийн төлбөрөөс авахгүй) · Олголт хүлээлгэн өгснөөс хойш нэг хоногт<br>Данс: ${
            data.bank_account ? `${esc(data.bank_name)} ${esc(data.bank_account)} · ${esc(data.bank_holder)}` : 'бүртгэгдээгүй — Basu-д хэлнэ үү'
          }</small></div>
          <span class="chip" data-s="${owed ? 'PAID' : 'READY'}">${owed ? `Хүлээгдэж буй ${mnt(owed)}` : 'Өр алга'}</span>
        </div>`),
  );
  if (!data.settlements.length) {
    box.append(el('<div class="row">Хүлээлгэн өгсөн захиалга бүр энд гарна.</div>'));
    return;
  }
  for (const t of data.settlements) {
    box.append(
      el(`<div class="row" data-settlement="${t.id}">
            <div class="name">№${esc(t.order_code)} · ${esc(t.memo)}<small>${
              t.state === 'paid' ? `Шилжүүлсэн ${when(t.paid_at)}${t.reference ? ` · ${esc(t.reference)}` : ''}` : `Үүссэн ${when(t.created_at)} · Basu шилжүүлнэ`
            }</small></div>
            <span class="chip" data-s="${t.state === 'paid' ? 'READY' : 'PAID'}">${mnt(t.amount_mnt)}</span>
          </div>`),
    );
  }
}

/** «9/8 14:05» for a timestamp the supplier reads across a list. */
function when(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function renderRow(l) {
  const row = el(`
    <div class="row"${l.active ? '' : ' data-off'} data-listing="${l.id}">
      <div class="name">${esc(l.title)}<small>${KIND[l.kind]} · ${l.unit === 'whole' ? `бүтэн, ~${l.approx_kg} кг` : `кг, доод ${l.min_qty}`} · ${esc(l.origin)} · ${dayLabel(l.ready_from)}-нөөс${l.delivers ? ` · хүргэлт ${mnt(l.delivery_fee_mnt)}` : ''}</small></div>
      <div class="num"><small>үнэ</small>${mnt(l.price_mnt)}</div>
      <div class="num"><small>зарагдсан</small>${l.sold} / ${l.quantity}</div>
      <div class="btns">
        <button class="btn" type="button" data-a="edit">Засах</button>
        <button class="btn" type="button" data-a="toggle">${l.active ? 'Зогсоох' : 'Идэвхжүүлэх'}</button>
      </div>
    </div>`);

  const patch = async (body) => {
    try {
      const { listing } = await api(`/v1/supplier/listings/${l.id}`, {
        method: 'PATCH',
        token: token(),
        body,
      });
      row.replaceWith(renderRow(listing));
    } catch (error) {
      toast(error.message, 'bad');
    }
  };

  row.querySelector('[data-a="toggle"]').addEventListener('click', () => patch({ active: !l.active }));
  row.querySelector('[data-a="edit"]').addEventListener('click', () => {
    const form = el(`
      <div class="row" data-editing>
        <div class="name">${esc(l.title)}</div>
        <label class="num"><small>үнэ ₮</small><input type="number" name="price" value="${l.price_mnt}" min="1"></label>
        <label class="num"><small>нийт тоо</small><input type="number" name="quantity" value="${l.quantity}" min="${l.sold}"></label>
        <label class="num"><small>бэлэн болох</small><input type="date" name="ready" value="${l.ready_from}"></label>
        <div class="btns">
          <button class="btn" data-v="primary" type="button" data-a="save">Хадгалах</button>
          <button class="btn" type="button" data-a="back">Болих</button>
        </div>
      </div>`);
    form.querySelector('[data-a="back"]').addEventListener('click', () => form.replaceWith(renderRow(l)));
    form.querySelector('[data-a="save"]').addEventListener('click', async () => {
      const body = {
        price_mnt: Number(form.querySelector('[name="price"]').value),
        quantity: Number(form.querySelector('[name="quantity"]').value),
        ready_from: form.querySelector('[name="ready"]').value,
      };
      try {
        const { listing } = await api(`/v1/supplier/listings/${l.id}`, {
          method: 'PATCH',
          token: token(),
          body,
        });
        form.replaceWith(renderRow(listing));
        toast('Хадгалагдлаа');
      } catch (error) {
        toast(error.message, 'bad');
      }
    });
    row.replaceWith(form);
  });
  return row;
}

function newForm() {
  const plusWeek = (() => {
    const d = new Date(`${today}T12:00:00+08:00`);
    d.setUTCDate(d.getUTCDate() + 7);
    return d.toISOString().slice(0, 10);
  })();
  const form = el(`
    <div class="new">
      <h3>Шинэ зар</h3>
      <div class="grid">
        <label>Мал<select name="kind">${Object.entries(KIND).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
        <label>Нэгж<select name="unit"><option value="whole">Бүтэн мал</option><option value="kg">Кг-аар</option></select></label>
        <label class="wide">Гарчиг<input name="title" placeholder="Хонь, залуу ирэг"></label>
        <label>Үнэ ₮ (толгой / кг)<input name="price_mnt" type="number" min="1" placeholder="460000"></label>
        <label data-for="whole">Ойролцоо жин, кг<input name="approx_kg" type="number" min="1" placeholder="38"></label>
        <label data-for="kg" hidden>Доод захиалга, кг<input name="min_qty" type="number" min="1" placeholder="10"></label>
        <label>Хэдэн толгой / кг<input name="quantity" type="number" min="0" placeholder="20"></label>
        <label class="wide">Гарал<input name="origin" placeholder="Архангай, Их тамир"></label>
        <label>Бэлэн болох өдөр<input name="ready_from" type="date" value="${plusWeek}"></label>
        <label class="check"><input name="delivers" type="checkbox" checked>Хүргэлт хийнэ</label>
        <label>Хүргэлтийн төлбөр ₮<input name="delivery_fee_mnt" type="number" min="0" value="0"></label>
        <label class="wide">Тайлбар<textarea name="note" placeholder="Толгой, дотор мөнтэйгээ…"></textarea></label>
      </div>
      <div class="foot"><button class="btn" data-v="primary" type="button" id="add">Зар нэмэх</button></div>
    </div>`);

  const unit = form.querySelector('[name="unit"]');
  const sync = () => {
    form.querySelector('[data-for="whole"]').hidden = unit.value !== 'whole';
    form.querySelector('[data-for="kg"]').hidden = unit.value !== 'kg';
  };
  unit.addEventListener('change', sync);
  sync();

  form.querySelector('#add').addEventListener('click', async () => {
    const v = (name) => form.querySelector(`[name="${name}"]`).value;
    const body = {
      kind: v('kind'),
      unit: v('unit'),
      title: v('title'),
      price_mnt: Number(v('price_mnt')),
      quantity: Number(v('quantity')),
      origin: v('origin'),
      ready_from: v('ready_from'),
      delivers: form.querySelector('[name="delivers"]').checked,
      delivery_fee_mnt: Number(v('delivery_fee_mnt') || 0),
      note: v('note'),
    };
    if (body.unit === 'whole') body.approx_kg = Number(v('approx_kg'));
    else body.min_qty = Number(v('min_qty') || 1);
    try {
      await api('/v1/supplier/listings', { method: 'POST', token: token(), body });
      toast('Зар нэмэгдлээ');
      const { listings } = await api('/v1/supplier/listings', { token: token() });
      renderStall(listings);
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  return form;
}

/* ── the module ──────────────────────────────────────────────────── */

const TABS = [
  { key: 'today', label: 'Өнөөдөр' },
  { key: 'orders', label: 'Захиалга' },
  { key: 'stall', label: 'Зар' },
  { key: 'money', label: 'Мөнгө' },
  { key: 'profile', label: 'Профайл' },
];
let tab = 'today';

/**
 * The supplier's own app: five tabs on a phone, a sidebar on a computer,
 * the same page in both. A demo watching every supplier at once gets only
 * the board — the rest is one supplier's own.
 */
function openModule() {
  const all = watchingAll();
  const frame = el(`
    <div class="shell">
      <div class="top">
        <h1 id="supplier">${all ? 'Бүх нийлүүлэгч' : '…'}</h1>
        <span class="conn" id="conn">холбогдсон</span>
        <span class="day mn" id="today"></span>
        <button class="swap" type="button" id="out">${all ? 'Солих' : 'Гарах'}</button>
      </div>
      <nav class="tabs" aria-label="Хэсгүүд">
        ${(all ? TABS.slice(0, 1) : TABS).map((t) => `<button type="button" data-tab="${t.key}">${t.label}</button>`).join('')}
      </nav>
      <main class="view" id="view"></main>
    </div>`);
  frame.querySelector('#out').addEventListener('click', () => (all ? (store.supplierToken = null, boot()) : signOut()));
  frame.querySelector('.tabs').addEventListener('click', (e) => {
    const button = e.target.closest('button[data-tab]');
    if (button) show(button.dataset.tab);
  });
  root.replaceChildren(frame);
  show(all ? 'today' : tab);
}

function show(key) {
  tab = key;
  onActed = null;
  for (const b of document.querySelectorAll('.tabs button')) b.toggleAttribute('data-on', b.dataset.tab === key);
  const view = document.getElementById('view');
  view.replaceChildren();
  ({ today: renderToday, orders: renderOrders, stall: renderStallTab, money: renderMoneyTab, profile: renderProfile })[key]?.(view);
}

/* ── today: the numbers, then the work ── */

async function renderToday(view) {
  view.append(el('<div class="home" id="home"></div>'), el('<div class="board" id="board"></div>'));
  if (!watchingAll()) void renderHome();
  void refreshBoard();
}

async function renderHome() {
  const box = document.getElementById('home');
  if (!box) return;
  let h;
  try {
    h = await api('/v1/supplier/home', { token: token() });
  } catch {
    return;
  }
  if (!document.getElementById('home')) return;
  const todo = h.lanes.paid + h.lanes.preparing + h.lanes.ready + h.lanes.dispatched;
  const k = (n, unit) => `${n} ${unit === 'kg' ? 'кг' : 'толгой'}`;
  box.replaceChildren(
    el(`<section class="cards">
          <div class="card" data-tone="${h.overdue ? 'stop' : todo ? 'accent' : 'ready'}">
            <span class="lab">Өнөөдөр</span>
            <b>${todo}</b><small>ажилтай захиалга</small>
            <p>${[
              h.lanes.paid ? `${h.lanes.paid} бэлтгэж эхлэх` : '',
              h.lanes.preparing ? `${h.lanes.preparing} бэлэн болгох` : '',
              h.lanes.ready ? `${h.lanes.ready} өгөх` : '',
              h.lanes.dispatched ? `${h.lanes.dispatched} замд` : '',
              h.due_today ? `<b>${h.due_today} өнөөдөр ирнэ</b>` : '',
              h.overdue ? `<b class="warn">${h.overdue} зочин ирээгүй</b>` : '',
            ].filter(Boolean).join(' · ') || 'Хийх ажил алга'}</p>
          </div>
          <div class="card">
            <span class="lab">Энэ улирал</span>
            <b>${h.season.handed}</b><small>хүлээлгэн өгсөн</small>
            <p>${h.season.by_kind.map((b) => `${KIND[b.kind] ?? b.kind} ${k(b.qty, b.unit)}`).join(' · ') || 'одоогоор алга'}</p>
          </div>
          <div class="card">
            <span class="lab">Орлого</span>
            <b>${mnt(h.season.payout_mnt)}</b><small>танд очих (борлуулалт ${mnt(h.season.revenue_mnt)})</small>
            <p>${h.season.cancelled ? `${h.season.cancelled} цуцлагдсан${h.season.forfeit_mnt ? `, суутгал ${mnt(h.season.forfeit_mnt)}` : ''}` : 'цуцлалт алга'}</p>
          </div>
        </section>`),
  );
}

/* ── orders: the list, searched; one order, with its story ── */

let orderQuery = { scope: 'live', q: '' };

function renderOrders(view) {
  view.append(el(`
    <section class="orders">
      <div class="tools">
        <input type="search" id="q" placeholder="Код, утас, нэр, мах…" value="${esc(orderQuery.q)}" autocomplete="off">
        <div class="chips">
          ${[['live', 'Идэвхтэй'], ['done', 'Дууссан'], ['all', 'Бүгд']]
            .map(([k, l]) => `<button type="button" data-scope="${k}"${orderQuery.scope === k ? ' data-on' : ''}>${l}</button>`)
            .join('')}
        </div>
      </div>
      <div class="rows" id="orders"><div class="none">…</div></div>
    </section>`));
  let timer;
  view.querySelector('#q').addEventListener('input', (e) => {
    orderQuery.q = e.target.value;
    clearTimeout(timer);
    timer = setTimeout(loadOrders, 250);
  });
  view.querySelector('.chips').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-scope]');
    if (!b) return;
    orderQuery.scope = b.dataset.scope;
    for (const c of view.querySelectorAll('.chips button')) c.toggleAttribute('data-on', c === b);
    void loadOrders();
  });
  void loadOrders();
}

async function loadOrders() {
  const box = document.getElementById('orders');
  if (!box) return;
  let data;
  try {
    data = await api(`/v1/supplier/orders?scope=${orderQuery.scope}&q=${encodeURIComponent(orderQuery.q)}`, { token: token() });
  } catch (error) {
    if (error.status === 401) return signOut();
    box.replaceChildren(el('<div class="none">Ачаалж чадсангүй.</div>'));
    return;
  }
  if (!document.getElementById('orders')) return;
  box.replaceChildren();
  if (!data.orders.length) box.append(el('<div class="none">Захиалга алга.</div>'));
  for (const o of data.orders) {
    const row = el(`
      <button class="row order" type="button" data-order="${o.id}">
        <div class="name">№${o.code} · ${esc(o.title)} ×${o.qty}${o.unit === 'kg' ? ' кг' : ''}<small>${
          [o.guest, o.guest_phone, o.receive === 'delivery' ? 'хүргэлт' : 'өөрөө авна', dayLabel(o.receive_on)].filter(Boolean).map(esc).join(' · ')
        }</small></div>
        <span class="chip" data-s="${o.state}">${STATE_WORD[o.state] ?? o.state}</span>
        <span class="num">${mnt(o.state === 'CANCELLED' || o.state === 'REFUNDED' ? o.forfeit_mnt ?? 0 : o.payout_mnt)}<small>танд</small></span>
      </button>`);
    row.addEventListener('click', () => openOrder(o.id));
    box.append(row);
  }
}

const STATE_WORD = {
  PAID: 'Төлсөн', PREPARING: 'Бэлтгэж байна', READY: 'Бэлэн', DISPATCHED: 'Замд',
  HANDED: 'Өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан', REFUNDED: 'Буцаасан',
};
const EVENT_WORD = {
  CREATED: 'Захиалга үүссэн', PAID: 'Төлсөн', PREPARING: 'Бэлтгэж эхэлсэн', READY: 'Бэлэн болсон',
  DISPATCHED: 'Замд гарсан', HANDED: 'Хүлээлгэн өгсөн', CLOSED: 'Хаагдсан', CANCELLED: 'Цуцлагдсан',
  REFUND_DUE: 'Буцаалт үүссэн', REFUNDED: 'Буцаалт шилжүүлсэн',
};
const ACTOR_WORD = (a) =>
  a.startsWith('guest:') ? 'зочин' : a.startsWith('supplier:owner:') ? 'та (утас)' : a.startsWith('supplier:') ? 'дэлгэц' : a.startsWith('ops') ? 'Basu' : 'систем';

async function openOrder(id) {
  const view = document.getElementById('view');
  let data;
  try {
    data = await api(`/v1/supplier/orders/${id}`, { token: token() });
  } catch (error) {
    toast(error.message, 'bad');
    return;
  }
  const o = data.order;
  const lane = { PAID: 'paid', PREPARING: 'preparing', READY: 'ready', DISPATCHED: 'dispatched' }[o.state];
  today = today ?? o.receive_on;
  view.replaceChildren(
    el(`<section class="order-page">
          <button class="back" type="button" id="back">‹ Захиалгууд</button>
          <div class="order-head">
            <h2>№${o.code} <span class="chip" data-s="${o.state}">${STATE_WORD[o.state] ?? o.state}</span></h2>
            <div class="what">${esc(o.title)} ×${o.qty}${o.unit === 'kg' ? ' кг' : ''} · ${mnt(o.total_mnt)}</div>
          </div>
          <div class="facts">
            <div><span class="lab">Зочин</span><b>${esc(o.guest ?? '—')}</b>${o.guest_phone ? `<a href="tel:${esc(o.guest_phone)}">${esc(o.guest_phone)}</a>` : ''}</div>
            <div><span class="lab">${o.receive === 'delivery' ? 'Хүргэх' : 'Авах'}</span><b>${dayLabel(o.receive_on)}</b>${o.receive === 'delivery' ? `${esc(o.address)}<br>${esc(o.address_phone)}` : 'Өөрөө ирж авна'}</div>
            <div><span class="lab">Танд очих</span><b>${mnt(o.payout_mnt)}</b>${o.delivery_fee_mnt ? `хүргэлт ${mnt(o.delivery_fee_mnt)} орсон` : 'шимтгэл хассан'}</div>
            ${o.cancel_reason ? `<div><span class="lab">Цуцлалт</span><b>${REASON_SHORT[o.cancel_reason] ?? o.cancel_reason}</b>зочинд ${mnt(o.refund_mnt ?? 0)} буцна${o.forfeit_mnt ? `, танд ${mnt(o.forfeit_mnt)}` : ''}</div>` : ''}
          </div>
          <div id="act"></div>
          <h3>Явц</h3>
          <ol class="story">
            ${data.events.map((e) => `<li><span class="t">${when(e.at)}</span><b>${EVENT_WORD[e.type] ?? e.type}</b><small>${ACTOR_WORD(e.actor)}${e.payload?.reason ? ` · ${REASON_SHORT[e.payload.reason] ?? e.payload.reason}` : ''}</small></li>`).join('')}
          </ol>
        </section>`),
  );
  view.querySelector('#back').addEventListener('click', () => show('orders'));
  if (lane) {
    view.querySelector('#act').append(renderTicket(o, lane));
    onActed = () => openOrder(id);
  }
}

const REASON_SHORT = {
  guest_asked: 'зочин хүссэн', vet: 'мал эмнэлэг', cannot_fulfil: 'биелүүлж чадаагүй',
  no_show: 'зочин ирээгүй', unreachable: 'хаяг дээр холбогдоогүй', draft_expired: 'төлөгдөөгүй',
};

/* ── the stall and the money, each on its own tab ── */

async function renderStallTab(view) {
  view.append(el('<div class="stall" id="stall"><h2>Миний зар</h2><div class="rows"><div class="row">…</div></div></div>'));
  try {
    const { listings } = await api('/v1/supplier/listings', { token: token() });
    if (document.getElementById('stall')) renderStall(listings);
  } catch (error) {
    if (error.status === 401) signOut();
  }
}

function renderMoneyTab(view) {
  view.append(el('<div class="stall"><h2>Миний мөнгө</h2><div class="rows" id="money"><div class="row">…</div></div></div>'));
  void renderMoney();
}

/* ── the profile: how they are found, where the money goes ── */

async function renderProfile(view) {
  let p;
  try {
    p = await api('/v1/supplier/profile', { token: token() });
  } catch (error) {
    if (error.status === 401) return signOut();
    view.append(el('<div class="none">Ачаалж чадсангүй.</div>'));
    return;
  }
  const form = el(`
    <section class="new profile">
      <h3>${esc(p.name)}</h3>
      <p class="hint">Утас <b>${esc(p.phone)}</b> · ${p.merchant_tin ? `ТТД ${esc(p.merchant_tin)}` : 'ТТД алга'} · шимтгэл ${p.commission_pct}% — гэрээний нөхцөл, Basu өөрчилнө.</p>
      <div class="grid">
        <label class="wide">Нэр<input name="name" value="${esc(p.name)}"></label>
        <label class="wide">Хотод мах авах цэг<input name="address" value="${esc(p.pickup_address)}"></label>
        <label class="wide">Юу зарах вэ, хаанаас<textarea name="about">${esc(p.about ?? '')}</textarea></label>
        <label>Банк<input name="bank_name" list="banks" value="${esc(p.bank_name ?? '')}"></label>
        <datalist id="banks">${BANKS.map((b) => `<option value="${b}">`).join('')}</datalist>
        <label>Данс<input name="bank_account" inputmode="numeric" value="${esc(p.bank_account ?? '')}"></label>
        <label>Данс эзэмшигч<input name="bank_holder" value="${esc(p.bank_holder ?? '')}"></label>
      </div>
      <div class="foot"><button class="btn" data-v="primary" type="button" id="save">Хадгалах</button></div>
    </section>`);
  form.querySelector('#save').addEventListener('click', async () => {
    const v = (name) => form.querySelector(`[name="${name}"]`).value.trim();
    try {
      await api('/v1/supplier/profile', {
        method: 'PATCH',
        token: token(),
        body: { name: v('name'), address: v('address'), about: v('about'), bank_name: v('bank_name'), bank_account: v('bank_account'), bank_holder: v('bank_holder') },
      });
      toast('Хадгалагдлаа.');
      const name = document.getElementById('supplier');
      if (name) name.textContent = v('name');
    } catch (error) {
      toast(error.message, 'bad');
    }
  });
  view.append(form);
}

/* ── boot ────────────────────────────────────────────────────────── */

/**
 * Three ways this page is opened: by a screen paired with a code, by a
 * person signed in with their phone — from the app's tile, or a browser on
 * a computer — and by somebody who is neither yet.
 */
async function boot() {
  root.replaceChildren();
  if (store.supplierToken) {
    openModule();
    return;
  }
  if (store.guestToken) {
    try {
      const { supplier } = await api('/v1/supplier/me', { token: store.guestToken });
      if (supplier?.state === 'contracted') {
        openModule();
        return;
      }
      showApply();
      return;
    } catch (error) {
      if (error.status === 401) store.guestToken = null;
      else {
        toast(error.message, 'bad');
        return;
      }
    }
  }
  showLanding();
}

boot();

const poll = setInterval(() => {
  if (!document.hidden && document.getElementById('board')) void refreshBoard();
}, 3000);
addEventListener('pagehide', () => clearInterval(poll));
</script>
</body>
</html>
