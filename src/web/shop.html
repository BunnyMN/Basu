<!doctype html>
<html lang="mn" data-theme="light" data-site>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Өвлийн идэш — Basu</title>
<meta name="description" content="Хонь, ямаа, үхэр, адууны махыг гэрээт нийлүүлэгчээс эцсийн үнээр захиална. Мал төлбөр орсны дараа нядлагдана.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Basu">
<meta property="og:locale" content="mn_MN">
<meta property="og:title" content="Өвлийн идэш — Basu">
<meta property="og:description" content="Хонь, ямаа, үхэр, адууны махыг гэрээт нийлүүлэгчээс эцсийн үнээр захиална.">
<meta property="og:image" content="https://basu.burzai.cloud/brand/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/brand/favicon.png">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/site.css">
<style>
/* The market, for a browser: every stall on one screen as a card with its
   picture and its price, a filter by animal, and a stall's own page with the
   order beside it — on a phone, right under the picture, with a bar at the
   foot that carries the total and the way to it. Open to anybody; paying
   asks who you are. */

.sh-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px 40px}
.sh-trust{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.sh-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding:0 0 20px;border-bottom:1px solid var(--line);margin-bottom:28px}
.sh-tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.sh-check{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-size:.9375rem;color:var(--ink-2);cursor:pointer}
.sh-check input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
.sh-sort{min-height:40px;padding:0 40px 0 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface) var(--chev) no-repeat right 14px center/16px;font:inherit;font-size:.9375rem;color:var(--ink);-webkit-appearance:none;appearance:none;cursor:pointer}
/* on a touch screen 16px: below that iOS zooms the page in when the select is tapped */
@media (pointer:coarse){.sh-sort{min-height:44px;font-size:1rem}}
.sh-count{font-size:.875rem;color:var(--ink-3)}
@media (max-width:760px){
  /* the animals in one row that slides, so the cards start higher */
  .sh-bar{gap:12px}
  /* 4px inside the slider, given back outside it: a chip's focus ring is not clipped, nothing moves */
  .sh-bar .s-chips{flex-wrap:nowrap;width:calc(100% + 2 * var(--s-gutter));margin:-2px calc(-1 * var(--s-gutter));padding:4px var(--s-gutter);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .sh-bar .s-chips::-webkit-scrollbar{display:none}
  .sh-tools{width:100%;justify-content:space-between}
}

.sh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px 22px}
.sh-grid > .s-empty{grid-column:1/-1}
.sh-card{display:flex;flex-direction:column;height:100%;color:inherit;text-decoration:none;border-radius:16px;-webkit-tap-highlight-color:transparent}
.sh-card .ph{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.sh-card .ph img{width:100%;height:100%;object-fit:cover;transition:transform 700ms var(--ease)}
@media (hover:hover){.sh-card:hover .ph img{transform:scale(1.04)}}
.sh-card:active .ph img{transform:scale(1.02)}
.sh-card .tags{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;gap:6px}
.sh-card .tags .s-pill{border-color:transparent;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sh-card .tags .s-pill[data-tone="hi"]{background:var(--hi-soft);color:var(--hi-ink)}
/* the paid tiers: VIP two columns wide with a honey ring, Онцгой a pine ring */
.sh-card[data-tier="vip"] .ph{box-shadow:0 0 0 3px var(--hi)}
.sh-card[data-tier="featured"] .ph{box-shadow:0 0 0 2px var(--accent)}
@media (min-width:600px){.sh-card[data-tier="vip"]{grid-column:span 2}.sh-card[data-tier="vip"] .ph{aspect-ratio:8/3}}
.sh-card[data-gone] .ph::after{content:"Дууссан";position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.72);background:color-mix(in srgb,var(--surface) 72%,transparent);font-weight:600;color:var(--ink)}
.sh-card .bd{flex:1;display:flex;flex-direction:column;padding:14px 2px 0}
.sh-card b{font-size:1.0625rem;font-weight:600;line-height:1.35}
.sh-card .who{margin-top:3px;font-size:.875rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-meta{margin-top:6px;font-size:.8125rem;line-height:1.45;color:var(--ink-3)}
/* the price at the foot of every card, level across a row; under it what the price is for —
   a whole animal's rough weight and what that makes a kilo, so two stalls compare at a glance */
.sh-card .buy{margin-top:auto;padding-top:10px}
.sh-card .price{display:block;font-size:1.25rem}
.sh-card .price small{font-family:var(--sans);font-size:.8125rem;font-weight:500;color:var(--ink-3)}
.sh-card .per{display:block;margin-top:2px;font-size:.8125rem;line-height:1.45;color:var(--ink-2)}
.sh-skel .ph{display:block;aspect-ratio:4/3;border-radius:16px}
.sh-skel .l1{height:18px;margin-top:16px;width:70%}
.sh-skel .l2{height:14px;margin-top:10px;width:45%}
.sh-skel .l3{height:20px;margin-top:14px;width:35%}
/* while the market loads the filter bar keeps its place, its chips drawn as shapes: nothing jumps when they come */
.sh-bar .s-chips .s-skel{flex:none;width:76px;height:40px;border-radius:999px}
.sh-bar .s-chips .s-skel:first-child{width:92px}
@media (pointer:coarse){.sh-bar .s-chips .s-skel{height:44px}}

/* Payments closed: said calmly, before anybody fills a form or signs in, with what can be done meanwhile.
   Neutral, not the stop colour — nothing went wrong on the person's side. */
.sh-closed{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);font-size:.875rem;line-height:1.55;color:var(--ink-2)}
.sh-closed svg{width:20px;height:20px;flex:none;margin-top:1px;color:var(--ink-3)}
.sh-closed b{display:block;margin-bottom:2px;font-size:.9375rem;font-weight:600;line-height:1.4;color:var(--ink)}
.sh-closed a{color:var(--ink);font-weight:500;text-decoration:underline;text-underline-offset:.2em;overflow-wrap:anywhere}
.sh-grid > .sh-closed{grid-column:1/-1;margin-bottom:-6px}

/* a stall's own page: the picture and its facts, the order box beside them, what to know under them */
.sd-title{margin:4px 0 0}
.sd-title h1{margin:0;font-size:clamp(1.75rem,3vw,2.5rem);line-height:1.1;letter-spacing:-.03em}
.sd-who{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;font-size:1rem;color:var(--ink-2)}
.sd{display:grid;grid-template-columns:minmax(0,7fr) minmax(340px,5fr);grid-template-areas:"media buy" "info buy";gap:28px 40px;align-items:start;margin-top:24px}
.sd-media{grid-area:media}
.sd-info{grid-area:info}
.sd-buy{grid-area:buy;position:sticky;top:calc(var(--s-bar) + var(--safe-t) + 20px);padding:24px}
.sd-photo{position:relative;margin:0;border-radius:20px;overflow:hidden;background:var(--surface-2)}
/* the photos are Basu's, not this supplier's meat: said on the picture, quietly */
.sd-photo figcaption{position:absolute;left:12px;bottom:12px;padding:4px 10px;border-radius:999px;background:rgba(18,26,21,.55);color:#fff;font-size:.75rem;font-weight:500;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sd-photo img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover}
.sd-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:20px 0 0;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface)}
.sd-facts div{padding:16px 18px}
.sd-facts div + div{border-left:1px solid var(--line)}
.sd-facts > div > span{display:block;font-size:.8125rem;color:var(--ink-3)}
.sd-facts b{display:block;margin-top:4px;font-size:1.0625rem;font-weight:600}
.sd-facts b small{display:block;font-family:var(--sans);font-size:.8125rem;font-weight:500;color:var(--ink-3)}
.sd-note{margin:0;font-size:1rem;line-height:1.7;color:var(--ink-2);white-space:pre-line;max-width:66ch}
.sd-list{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.sd-note + .sd-list{margin-top:22px}
.sd-list li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.sd-list svg{width:22px;height:22px;color:var(--ink-2)}
.sd-list b{display:block;font-weight:600}
.sd-list span{display:block;margin-top:2px;font-size:.9375rem;line-height:1.55;color:var(--ink-2)}
@media (max-width:960px){
  .sd{grid-template-columns:minmax(0,1fr);grid-template-areas:"media" "buy" "info";gap:24px}
  .sd-buy{position:static}
  /* on a phone the order box says all of it, right under the picture */
  .sd-facts{display:none}
  .sd-photo img{aspect-ratio:4/3}
}
@media (max-width:620px){
  .sd-facts{grid-template-columns:1fr 1fr}
  .sd-facts div:nth-child(3){border-left:0}
  .sd-facts div:nth-child(n+3){border-top:1px solid var(--line)}
  .sd-facts div{padding:14px 16px}
  .sd-buy{padding:20px}
}

/* the order box */
.sd-price{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 8px}
.sd-price .s-money{font-size:1.75rem;line-height:1.1}
.sd-price small{font-size:.9375rem;font-weight:500;color:var(--ink-3)}
.sd-sub{margin:6px 0 0;font-size:.875rem;line-height:1.5;color:var(--ink-2)}
.sd-form{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.sd-q{margin:0 0 20px}
.sd-q > span:first-child{display:block;margin-bottom:10px;font-size:.875rem;font-weight:600}
.sd-qty{display:flex;align-items:center;gap:6px;width:max-content;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--surface)}
.sd-qty button{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--accent-ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.sd-qty button svg{width:18px;height:18px}
.sd-qty button:disabled{color:var(--ink-3);opacity:.4;cursor:default}
@media (hover:hover){.sd-qty button:not(:disabled):hover{background:var(--surface-2)}}
.sd-qty output{min-width:88px;text-align:center;font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.sd-qty output small{font-family:var(--sans);font-weight:500;color:var(--ink-3)}
.sd-ways{display:grid;gap:10px}
.sd-way{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;padding:14px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);color:var(--ink);font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color var(--dur),background var(--dur)}
.sd-way:disabled{background:var(--surface-2);border-color:var(--line);cursor:default}
.sd-way:disabled b,.sd-way:disabled em{color:var(--ink-3)}
.sd-way i{width:20px;height:20px;margin-top:1px;border:1.5px solid var(--line-2);border-radius:50%;transition:border-width var(--dur)}
.sd-way[aria-checked="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.sd-way[aria-checked="true"] i{border:6px solid var(--accent)}
.sd-way b{display:block;font-weight:600}
.sd-way small{display:block;margin-top:2px;font-size:.8125rem;line-height:1.45;color:var(--ink-2)}
.sd-way em{font-style:normal;font-size:.875rem;font-weight:600;white-space:nowrap}
.sd-way em .s-money{font-weight:600}
.sd-sum{margin:6px 0 0;padding:14px 0 0;border-top:1px solid var(--line)}
.sd-sum div{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:.9375rem;color:var(--ink-2)}
.sd-sum div.total{margin-top:6px;padding-top:12px;border-top:1px solid var(--line);font-size:1.0625rem;font-weight:600;color:var(--ink)}
.sd-sum div.total .s-money{font-size:1.375rem}
.sd-fine{margin:14px 0 0;font-size:.8125rem;line-height:1.55;color:var(--ink-3)}
.sd-fine a{color:var(--ink-2);text-decoration:underline;text-underline-offset:.2em}
.sd-review h2{margin:0;font-size:1.25rem;letter-spacing:-.015em}
/* where the focus is put when the box changes step (the box itself, the review's heading): a place to read from, not a control — no ring */
.sd-review h2:focus,.sd-buy:focus{outline:none}
.sd-review .sd-sub{margin-bottom:16px}
.sd-review dl{margin:0 0 6px;border-top:1px solid var(--line)}
.sd-review .sd-sum{margin-top:0;border-top:0}
.sd-review dl div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9375rem}
.sd-review dt{color:var(--ink-3)}
.sd-review dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.sd-review dd small{display:block;font-weight:400;color:var(--ink-2)}
/* the courier's number is read in one go: never broken over two lines */
.sd-review .sd-tel{white-space:nowrap}
.sd-actions{display:grid;gap:10px;margin-top:18px}
/* why the button above is grey, right under it */
.sd-why{margin:0;font-size:.8125rem;line-height:1.5;color:var(--ink-2);text-align:center}
.sd-why[hidden]{display:none}
.sd-buy .sh-closed{margin-top:16px}
.sd-wallet{margin:12px 0 0;font-size:.875rem;line-height:1.5;color:var(--ink-2)}
.sd-review .sh-closed,.sd-review .sd-wallet{margin:0 0 16px}
.sd-after{margin:16px 0 0;padding:0;list-style:none}
.sd-after li{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:4px 0;font-size:.875rem;line-height:1.5;color:var(--ink-2)}
.sd-after svg{width:16px;height:16px;margin-top:2px;color:var(--ready)}
.sd-gone{display:grid;gap:12px;justify-items:start}
.sd-gone b{font-size:1.0625rem}
.sd-gone p{margin:0;color:var(--ink-2);line-height:1.55}

/* a stall while it loads: at least a screen tall, so the foot never starts on screen and then jumps away */
.sd-wait{padding-top:8px;min-height:calc(100vh - var(--s-bar) - 60px);min-height:calc(100svh - var(--s-bar) - 60px)}
.sd-wait .t{height:40px;width:min(420px,70%)}
.sd-wait .w{height:20px;width:min(320px,55%);margin-top:16px}
.sd-wait .g{display:grid;grid-template-columns:minmax(0,7fr) minmax(340px,5fr);gap:40px;margin-top:24px}
.sd-wait .p{aspect-ratio:16/10;border-radius:20px}
.sd-wait .b{height:440px;border-radius:18px}
@media (max-width:960px){.sd-wait .g{grid-template-columns:1fr;gap:24px}.sd-wait .p{aspect-ratio:4/3}.sd-wait .b{height:320px}}

/* on a phone: the total and the way to the order box, at the thumb, until the box itself is on screen */
.sd-dock{display:none}
@media (max-width:960px){
  html[data-dock]{--s-dock:76px}
  .sd-dock{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;gap:16px;min-height:76px;padding:12px var(--s-gutter) calc(12px + var(--safe-b));background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-top:1px solid var(--line);box-shadow:var(--shadow-sheet);transition:transform var(--dur-sheet) var(--ease),visibility var(--dur-sheet)}
  .sd-dock[data-away]{transform:translateY(110%);visibility:hidden}
  .sd-dock[hidden]{display:none}
  .sd-dock .what{flex:1;min-width:0}
  .sd-dock .what .s-money{display:block;font-size:1.1875rem;line-height:1.2}
  .sd-dock .what small{display:block;margin-top:2px;font-size:.8125rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sd-dock .s-btn{flex:none;min-width:148px}
  .sd-dock[data-closed] .what small{color:var(--ink)}
}
</style>
</head>
<body>
<main class="s-main">
  <div class="s-wrap" id="page"></div>
</main>

<script type="module">
import { api, store, mnt, KIND, dayLabel, whatWentWrong, phoneText, phoneInput } from '/api.js';
import { mountFrame, authed, loginUrl, esc, el, siteEmpty, howToBuy, tugrik } from '/site.js';

// Open to anybody: the stalls are shown to all, and only paying asks who you are.
void mountFrame('shop');
const page = document.getElementById('page');

const PHOTO = (kind) => `/brand/meat/${['sheep', 'goat', 'beef', 'horse'].includes(kind) ? kind : 'sheep'}.webp`;
/**
 * The same photo at the widths it is shown at, so a phone's card does not
 * fetch the 960 a desk's stall needs: the copies sit beside it as
 * `sheep-480.webp` and `sheep-720.webp`.
 */
const SRCSET = (kind) => {
  const at = PHOTO(kind).slice(0, -'.webp'.length);
  return `${at}-480.webp 480w, ${at}-720.webp 720w, ${at}.webp 960w`;
};
/** A card's width: one column up to 588px, two up to 895, three up to 1185, then four of the page's 1120. */
const CARD_SIZES = '(max-width: 588px) calc(100vw - 40px), (max-width: 895px) calc(50vw - 42px), (max-width: 1185px) calc(33vw - 40px), 265px';
/** A VIP card is two of them wide from 600px. */
const VIP_SIZES = '(max-width: 599px) calc(100vw - 40px), (max-width: 895px) calc(100vw - 60px), (max-width: 1185px) calc(67vw - 50px), 552px';
/** A stall's photo: the whole page on a phone, seven twelfths of it beside the order box on a desk. */
const STALL_SIZES = '(max-width: 960px) calc(100vw - 40px), (max-width: 1200px) calc(58vw - 50px), 630px';
const unitWord = (l) => (l.unit === 'whole' ? 'толгой' : 'кг');
const MARK = {
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.4"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v5h5"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>',
  truck: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  truckSm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.5h.01"/></svg>',
};

let market = { today: null, listings: [] };
/** The market's answer is in: before it, a filter changed only waits for it. */
let loaded = false;
/** An animal's name as the owner of a thing: «Хонины зар». */
const OF_KIND = { sheep: 'Хонины', goat: 'Ямааны', beef: 'Үхрийн', horse: 'Адууны' };

/* ── whether money can be taken ───────────────────────────────────── */

/**
 * Whether this server can take money now (`payments_open`, on the market's
 * answer and on every stall's), and, while it cannot, what the signed-in
 * person holds in their Basu wallet — the one way an order is still paid for
 * then (the server sells to a wallet that covers the whole order). Said
 * before anybody fills in the form or signs in: it used to be learnt at the
 * last press of «Төлөх», after signing in, five minutes in.
 */
const pay = { open: true, wallet: null };
const canPay = (amount) => pay.open || (pay.wallet !== null && pay.wallet >= amount);
const CLOSED = 'Онлайн төлбөр одоогоор хаалттай байна.';

/** The calm word on it, with what can be done meanwhile: no dates, nothing promised. */
function closedNote() {
  return el(`<div class="sh-closed" role="note">${MARK.info}<div><b>${CLOSED}</b>Одоохондоо зарыг үзэж, харьцуулж болно. Асуух зүйл байвал <a href="mailto:basuappmn@gmail.com">basuappmn@gmail.com</a> хаягаар бичээрэй.</div></div>`);
}

/** While payments are closed, the signed-in person's wallet: what it holds, or nothing known. */
async function lookAtWallet() {
  pay.wallet = null;
  const token = store.guestToken;
  if (pay.open || !token) return;
  try {
    pay.wallet = (await api('/v1/wallet', { token })).balance_mnt ?? null;
  } catch {
    // Not known: the order waits for payments to open, as anybody's does.
  }
}

/* ── the way back to the market ────────────────────────────────────── */

/**
 * «‹ Бүх зар» goes back to the market as the person left it: its address
 * (the animal, delivery, the order) and how far down they were, kept for the
 * tab when a card is opened. It used to be the whole market from its top.
 */
const BACK = 'basu.shop.back';
function keptBack() {
  try {
    const kept = JSON.parse(sessionStorage.getItem(BACK) ?? 'null');
    // Only the market's own address is ever followed from storage.
    return kept && typeof kept.url === 'string' && /^\/shop(\?[a-z0-9=&]*)?$/.test(kept.url) ? kept : null;
  } catch {
    return null;
  }
}
function keepBack(extra = {}) {
  try {
    sessionStorage.setItem(BACK, JSON.stringify({ url: location.pathname + location.search, y: Math.round(window.scrollY || 0), ...extra }));
  } catch {
    // Without storage the way back is the whole market, from its top.
  }
}
/** The crumb on a stall's page, to the market it was opened from. */
function crumb() {
  const kept = keptBack();
  const link = el(`<a class="s-crumb" href="${esc(kept?.url ?? '/shop')}">${MARK.back}Бүх зар</a>`);
  link.addEventListener('click', () => {
    const now = keptBack();
    if (!now) return;
    try {
      sessionStorage.setItem(BACK, JSON.stringify({ ...now, go: true }));
    } catch {
      // nothing kept
    }
  });
  return link;
}
/** Back on the market from a stall (the crumb, or the browser's back): where the person was. */
function comeBack() {
  const kept = keptBack();
  if (!kept || kept.url !== location.pathname + location.search) return;
  const how = performance.getEntriesByType?.('navigation')?.[0]?.type;
  if (!kept.go && how !== 'back_forward') return;
  try {
    sessionStorage.setItem(BACK, JSON.stringify({ ...kept, go: false }));
  } catch {
    // nothing kept
  }
  if (kept.y > 0) window.scrollTo(0, kept.y);
}

/* ── the market ────────────────────────────────────────────────────── */

// The animal can come in the address (the front page's four photos link to their own) —
// one of the four by name, never whatever an object answers to («?kind=constructor»).
// So do the delivery filter and the order, so the way back from a stall finds them.
const SORTS = ['suggested', 'soon', 'cheap', 'dear'];
const query = new URLSearchParams(location.search);
const asked = query.get('kind');
const view = {
  kind: asked && Object.hasOwn(KIND, asked) ? asked : 'all',
  sort: SORTS.includes(query.get('sort')) ? query.get('sort') : 'suggested',
  delivers: query.get('delivery') === '1',
};
/** The market's address for what it shows, so a reload, a shared link and «‹ Бүх зар» show the same. */
function showInAddress() {
  const q = new URLSearchParams();
  if (view.kind !== 'all') q.set('kind', view.kind);
  if (view.delivers) q.set('delivery', '1');
  if (view.sort !== 'suggested') q.set('sort', view.sort);
  const said = q.toString();
  history.replaceState(null, '', said ? `/shop?${said}` : '/shop');
}

function drawMarket() {
  page.replaceChildren(
    el(`<section class="s-head sh-head">
          <div><h1>Өвлийн идэш</h1><p>Гэрээт нийлүүлэгчээс, таны захиалгаар нядална. Зар дээрх үнэ эцсийнх.</p></div>
          <ul class="sh-trust" aria-label="Баталгаа">
            <li class="s-pill">${MARK.shield}Гэрээт нийлүүлэгч</li>
            <li class="s-pill">${MARK.tag}Үнэ эцсийн</li>
            <li class="s-pill">${MARK.undo}Нядлахаас өмнө бүтэн буцаалт</li>
          </ul>
        </section>`),
    el(`<div class="sh-bar" id="sh-bar">
          <div class="s-chips" id="kinds" role="group" aria-label="Малын төрөл">${'<span class="s-skel" aria-hidden="true"></span>'.repeat(5)}</div>
          <div class="sh-tools">
            <label class="sh-check"><input type="checkbox" id="delivers"${view.delivers ? ' checked' : ''}>Хүргэлттэй</label>
            <select class="sh-sort" id="sort" aria-label="Эрэмбэ">
              <option value="suggested">Санал болгох</option>
              <option value="soon">Эрт бэлэн болох</option>
              <option value="cheap">Үнэ: багаас их</option>
              <option value="dear">Үнэ: ихээс бага</option>
            </select>
          </div>
          <p class="s-sr" id="sh-said" role="status"></p>
        </div>`),
    el('<div class="sh-grid" id="grid" aria-busy="true"></div>'),
  );
  document.getElementById('sort').value = view.sort;
  document.getElementById('sort').addEventListener('change', (e) => {
    view.sort = e.target.value;
    showInAddress();
    if (loaded) paintGrid();
  });
  document.getElementById('delivers').addEventListener('change', (e) => {
    view.delivers = e.target.checked;
    showInAddress();
    if (loaded) paintGrid(true);
  });
  const grid = document.getElementById('grid');
  // A card opened: where the market was, for the way back.
  grid.addEventListener('click', (event) => {
    if (event.target.closest('.sh-card')) keepBack();
  });
  for (let i = 0; i < 6; i++) {
    grid.append(el('<div class="sh-skel" aria-hidden="true"><span class="s-skel ph"></span><span class="s-skel l1"></span><span class="s-skel l2"></span><span class="s-skel l3"></span></div>'));
  }
}

function paintKinds() {
  const box = document.getElementById('kinds');
  const count = (k) => market.listings.filter((l) => k === 'all' || l.kind === k).length;
  box.replaceChildren();
  for (const [key, label] of [['all', 'Бүгд'], ...Object.entries(KIND)]) {
    if (key !== 'all' && key !== view.kind && !count(key)) continue;
    const button = el(`<button type="button" data-kind="${key}" aria-pressed="${view.kind === key}">${label}<small>${count(key)}</small></button>`);
    button.addEventListener('click', () => {
      view.kind = key;
      // The choice is in the address, so a shared or reloaded link shows the same.
      showInAddress();
      paintKinds();
      paintGrid(true);
      // The chip pressed was drawn anew: the focus stays on it, not lost to the page's top.
      document.querySelector(`#kinds [data-kind="${key}"]`)?.focus();
    });
    box.append(button);
  }
}

function shown() {
  const list = market.listings.filter((l) => (view.kind === 'all' || l.kind === view.kind) && (!view.delivers || l.delivers));
  const open = (l) => (l.remaining > 0 ? 0 : 1);
  // A tier a supplier paid for holds in every order: VIP, then Онцгой, then the rest.
  const rank = (l) => (l.tier === 'vip' ? 0 : l.tier === 'featured' ? 1 : 2);
  const first = (a, b) => open(a) - open(b) || rank(a) - rank(b);
  if (view.sort === 'cheap') list.sort((a, b) => first(a, b) || a.price_mnt - b.price_mnt);
  else if (view.sort === 'dear') list.sort((a, b) => first(a, b) || b.price_mnt - a.price_mnt);
  else if (view.sort === 'soon') list.sort((a, b) => first(a, b) || a.ready_from.localeCompare(b.ready_from));
  else list.sort(first);
  return list;
}

/**
 * The cards for the filter as it stands. `announce` when a filter was just
 * changed: how many there are now is said to a screen reader in one short
 * line (#sh-said) — not every card read out again.
 */
function paintGrid(announce = false) {
  const grid = document.getElementById('grid');
  grid.removeAttribute('aria-busy');
  grid.replaceChildren();
  const said = document.getElementById('sh-said');
  if (said) said.textContent = '';
  // Nothing for sale yet: no filters for nothing, and what to do meanwhile.
  document.getElementById('sh-bar').hidden = !market.listings.length;
  if (!market.listings.length) {
    grid.append(
      siteEmpty({
        icon: 'shop',
        title: 'Анхны зарууд удахгүй гарна',
        text: 'Нийлүүлэгчид бүртгүүлж, Basu тэднийг шалгаж байна. Зар гармагц энд харагдана — үнэ, жин, бэлэн болох өдөртэйгөө.',
        actions: [['Хэдэн хонь хэрэгтэйг бодох', '/#calc'], ['Мах нийлүүлдэг үү? Бүртгүүлэх', '/dashboard']],
        card: true,
      }),
    );
    return;
  }
  // Payments closed: said over the cards, before a stall is opened.
  if (!pay.open) grid.append(closedNote());
  const list = shown();
  if (!list.length) {
    const none = el(`<div class="s-empty s-card">
        <span class="s-mark" aria-hidden="true">${MARK.tag}</span>
        <b>${view.kind !== 'all' ? `${OF_KIND[view.kind]} зар одоогоор алга` : 'Энэ шүүлтүүрт зар алга'}</b>
        <p>${view.delivers ? 'Хүргэлттэй зар алга — өөрөө очиж авах зарууд бий.' : 'Өөр төрөл сонгоод үзээрэй.'}</p>
        <div class="s-acts"><button class="s-btn s-btn-line" type="button" data-all>Бүх зарыг харах</button></div>
      </div>`);
    none.querySelector('[data-all]').addEventListener('click', () => {
      view.kind = 'all';
      view.delivers = false;
      document.getElementById('delivers').checked = false;
      showInAddress();
      paintKinds();
      paintGrid(true);
      // The button pressed is gone with the empty card: the focus goes to the filter it set, «Бүгд».
      document.querySelector('#kinds [data-kind="all"]')?.focus();
    });
    grid.append(none);
    if (announce && said) said.textContent = none.querySelector('b').textContent;
    return;
  }
  if (announce && said) said.textContent = `${list.length} зар`;
  for (const [i, l] of list.entries()) {
    const gone = l.remaining === 0;
    // Under the price, what it is for: a whole animal's rough weight and what
    // that makes a kilo — two stalls compare without opening either — or the
    // least a stall sells by the kilo.
    const kg = Number(l.approx_kg);
    const per = l.unit === 'whole'
      ? kg > 0 ? `≈${kg} кг · ≈${mnt(Math.round(l.price_mnt / kg / 100) * 100)}/кг` : ''
      : `доод тал нь ${l.min_qty} кг`;
    grid.append(
      el(`<a class="sh-card" href="/shop/${esc(l.id)}" data-id="${esc(l.id)}" data-kind="${esc(l.kind)}"${l.tier ? ` data-tier="${esc(l.tier)}"` : ''}${gone ? ' data-gone' : ''}>
            <span class="ph"><img src="${PHOTO(l.kind)}" srcset="${SRCSET(l.kind)}" sizes="${l.tier === 'vip' ? VIP_SIZES : CARD_SIZES}" alt="" loading="${i < 4 ? 'eager' : 'lazy'}"${i === 0 ? ' fetchpriority="high"' : ''} decoding="async" width="960" height="720">
              <span class="tags">${
                l.tier ? `<span class="s-pill" data-tone="${l.tier === 'vip' ? 'vip' : 'pine'}">${l.tier === 'vip' ? '★ VIP' : `${MARK.check}Онцгой`}</span>` : '<span></span>'
              }${l.delivers ? `<span class="s-pill" data-tone="hi">${MARK.truckSm}Хүргэлттэй</span>` : ''}</span></span>
            <span class="bd">
              <b>${esc(l.title)}</b>
              <span class="who">${esc(l.supplier.name)} · ${esc(l.origin)}</span>
              <span class="sh-meta">${dayLabel(l.ready_from)}-нөөс бэлэн · ${gone ? 'дууссан' : `${l.remaining} ${unitWord(l)} үлдсэн`}</span>
              <span class="buy"><span class="price s-money">${tugrik(l.price_mnt)}<small> / ${unitWord(l)}</small></span>${per ? `<span class="per">${per}</span>` : ''}</span>
            </span>
          </a>`),
    );
  }
}

/* ── a stall ───────────────────────────────────────────────────────── */

const earliest = (l) => (l.ready_from > market.today ? l.ready_from : market.today);

/**
 * One attempt at buying from a stall: this order, answer for answer, and a
 * random nonce its two calls go under — making the order, then paying for
 * it. Pressing «Төлөх» again after the network lost an answer is the same
 * attempt, sends the same keys, and gets the same order and the same
 * payment back — never a second animal. The key used to be made afresh on
 * every press, and a retry after a lost answer was a second order — a
 * second payment, when the lost answer was the payment's. Another quantity,
 * day, way or address is another attempt: a key's order is handed back
 * whatever the retry asks for, so a changed order must not go under it.
 *
 * An attempt is over when it hands the person to its order's own page,
 * which is where a bought order is seen — not when the payment goes
 * through. Until then a press is a retry of it. A page the browser keeps
 * and shows again on the way back from the order buys the same order
 * again as a second animal somebody meant.
 */
/**
 * Kept in the tab's own storage as well as here: a page reloaded after a lost
 * answer, or come back to from QPay's page, is the same attempt — the same
 * order, never a second animal. It used to live only here, and a reload made
 * a new one.
 */
const ATTEMPT = 'basu.shop.attempt';
let attempt = (() => {
  try {
    return JSON.parse(sessionStorage.getItem(ATTEMPT) ?? 'null');
  } catch {
    return null;
  }
})();
function keepAttempt() {
  try {
    if (attempt) sessionStorage.setItem(ATTEMPT, JSON.stringify(attempt));
    else sessionStorage.removeItem(ATTEMPT);
  } catch {
    // Without storage the attempt lives as long as the page, as it always did.
  }
}

function currentAttempt(body) {
  const what = JSON.stringify(body);
  if (attempt?.what !== what) {
    const nonce = [...crypto.getRandomValues(new Uint8Array(16))].map((b) => b.toString(16).padStart(2, '0')).join('');
    attempt = { what, nonce, order: null };
  }
  return attempt;
}

/**
 * One purchase at a time. The answer to a press can be slow in coming, and
 * while it is, «Засах» leads back to the form and on to a review with a
 * «Төлөх» of its own. A press there is not a second purchase: it waits for
 * the one on its way, and an animal that one bought is the one bought.
 * Before, it went ahead beside the first. A changed order was another
 * attempt and made an order of its own; the same order went under the same
 * key while the first was still at the server, before any answer was kept
 * to hand back, and made a second one all the same. Both were paid for.
 */
let buying = null;

/** Buy this order, or be handed the animal the purchase already on its way buys. */
async function purchase(body) {
  // Every press made meanwhile waits. After a failure the first of them goes
  // ahead alone, and the rest wait for it in turn.
  while (buying) {
    const bought = await buying.catch(() => null);
    if (bought) return bought;
  }
  const run = buyOnce(body);
  buying = run;
  try {
    return await run;
  } finally {
    if (buying === run) buying = null;
    keepAttempt();
  }
}

/**
 * Make the order and pay for it under the attempt's keys: the order bought,
 * and the order it was bought as (the attempt's `what`).
 *
 * An attempt that knows its order goes by what became of that order, not by
 * the answer kept for the order's key. That answer is kept for the session
 * that asked, for a day, and only if keeping it did not fail; a press after
 * that was handed nothing under the same key, made a second order with it
 * and paid for that too. So the order is looked at. Paid for, it is the
 * animal bought and the page goes on to it, whatever this press asks for:
 * somebody who changes the order after a failure means it instead of that
 * one, not beside it. Still a draft and asked for as it was, it is the one
 * paid for now. Changed, given back, or not this person's (somebody else
 * signed in on this browser since), the attempt is over and this press is a
 * new one. Only an attempt with no order yet sends one.
 */
async function buyOnce(body) {
  const what = JSON.stringify(body);
  if (attempt?.order) {
    let last = null;
    try {
      last = await authed(`/v1/idesh/${attempt.order}`);
    } catch (error) {
      if (error.code !== 'NOT_FOUND') throw error;
    }
    if (last?.paid_at) return { id: last.id, what: attempt.what };
    if (!last || last.state !== 'DRAFT' || attempt.what !== what) attempt = null;
  }
  const current = currentAttempt(body);
  if (!current.order) {
    // A connection that drops an answer is retried; the same key must not sell a second animal.
    const order = await authed('/v1/idesh', { method: 'POST', idempotencyKey: `idesh-${current.nonce}`, body });
    current.order = order.id;
    keepAttempt();
  }
  const id = current.order;
  try {
    // Paying can lose its answer too. Under the attempt's own key the retry
    // is handed the payment already made, rather than told the order is paid
    // for and left in front of «Төлөх» for it.
    const answer = await authed(`/v1/idesh/${id}/pay`, { method: 'POST', idempotencyKey: `pay-${current.nonce}` });
    // Not covered by the wallet: QPay's invoice for it, paid on QPay's own page (202). The order waits as it is.
    if (answer?.state === 'AWAITING_PAYMENT') return { id, what: current.what, invoice: answer.invoice };
  } catch (error) {
    if (error.code !== 'WRONG_STATE') throw error;
    // The order has left its draft without this press. Paid for by a press
    // whose answer never came, it is the animal bought. Given back after half
    // an hour unpaid, it has spent the attempt: the next press is a new one,
    // not the lapsed order handed back again.
    if ((await authed(`/v1/idesh/${id}`)).paid_at) return { id, what: current.what };
    attempt = null;
    throw error;
  }
  return { id, what: current.what };
}

function drawStall(l) {
  document.title = `${l.title} — Basu`;
  // A form filled before signing in comes back filled after it.
  const kept = (() => {
    try {
      return JSON.parse(sessionStorage.getItem(`basu.shop.${l.id}`) ?? 'null');
    } catch {
      return null;
    }
  })();
  // Back from signing in to pay (`review` was kept with the form): straight to the review it left, as its page said.
  const resume = Boolean(kept?.review && store.guestToken);
  if (kept) delete kept.review;
  const form = { qty: l.min_qty, receive: 'pickup', receiveOn: earliest(l), address: '', phone: '', ...(kept ?? {}) };
  const step = l.unit === 'whole' ? 1 : 5;
  const total = () => l.price_mnt * form.qty + (form.receive === 'delivery' ? l.delivery_fee_mnt : 0);
  const gone = l.remaining === 0;
  const whole = l.unit === 'whole';
  const unit = unitWord(l);
  /**
   * Why the order cannot go on, said under the grey button: online payment is
   * closed — and when the person's Basu wallet holds something but not this
   * total, that too, with how much of it the wallet does reach (in the
   * stall's own steps, the delivery fee counted), so one fewer head is a
   * choice they can see. `short` for the bar at the foot.
   */
  const notNow = (closedWords) => {
    if (!pay.wallet || pay.wallet <= 0) return { why: closedWords, short: 'Онлайн төлбөр хаалттай' };
    const fee = form.receive === 'delivery' ? l.delivery_fee_mnt : 0;
    const steps = Math.floor(((pay.wallet - fee) / l.price_mnt - l.min_qty) / step);
    const reach = steps >= 0 ? Math.min(l.min_qty + steps * step, l.remaining) : 0;
    return {
      why: reach
        ? `Basu түрийвч тань ${reach} ${whole ? 'толгойд' : 'кг-д'} л хүрэлцэнэ — онлайн төлбөр хаалттай.`
        : 'Basu түрийвч тань энэ захиалгад хүрэлцэхгүй — онлайн төлбөр хаалттай.',
      short: 'Түрийвч хүрэлцэхгүй',
    };
  };

  page.replaceChildren(
    crumb(),
    el(`<div class="sd-title">
          <h1>${esc(l.title)}</h1>
          <div class="sd-who">${l.tier ? `<span class="s-pill" data-tone="${l.tier === 'vip' ? 'vip' : 'pine'}">${l.tier === 'vip' ? '★ VIP' : 'Онцгой'}</span>` : ''}${l.supplier.contracted ? `<span class="s-pill" data-tone="brand">${MARK.check}Гэрээт нийлүүлэгч</span>` : ''}<span>${esc(l.supplier.name)} · ${esc(l.origin)}</span></div>
        </div>`),
    el(`<div class="sd">
          <div class="sd-media">
            <figure class="sd-photo"><img src="${PHOTO(l.kind)}" srcset="${SRCSET(l.kind)}" sizes="${STALL_SIZES}" fetchpriority="high" decoding="async" alt="${esc(KIND[l.kind] ?? '')} — жишээ зураг" width="960" height="720"><figcaption>Жишээ зураг</figcaption></figure>
            <div class="sd-facts">
              <div><span>Үнэ</span><b class="s-money">${tugrik(l.price_mnt)}<small>/ ${unit}</small></b></div>
              <div><span>${whole ? 'Ойролцоо жин' : 'Доод захиалга'}</span><b>${whole ? `≈${l.approx_kg} кг` : `${l.min_qty} кг`}</b></div>
              <div><span>Бэлэн болох</span><b>${dayLabel(l.ready_from)}</b></div>
              <div><span>Үлдсэн</span><b>${l.remaining} ${unit}</b></div>
            </div>
          </div>
          <aside class="sd-buy s-card" id="buy" aria-label="Захиалах"></aside>
          <div class="sd-info">
            ${l.note ? `<p class="sd-note">${esc(l.note)}</p>` : ''}
            <ul class="sd-list">
              <li>${MARK.pin}<div><b>Авах цэг</b><span>${esc(l.supplier.pickup_address)}</span></div></li>
              <li>${MARK.truck}<div><b>${l.delivers ? 'Хүргэлттэй' : 'Хүргэлтгүй'}</b><span>${
                l.delivers ? `Нийлүүлэгч таны хаяг руу хүргэнэ · ${mnt(l.delivery_fee_mnt)}` : 'Энэ нийлүүлэгчээс өөрөө очиж авна.'
              }</span></div></li>
              <li>${MARK.tag}<div><b>Үнэ эцсийн</b><span>Мал нядалсны дараа жин нь зөрсөн ч нэмж төлөхгүй, зөрүү ч буцаагдахгүй.</span></div></li>
              <li>${MARK.undo}<div><b>Цуцлах, буцаалт</b><span>Нядлахаас өмнө цуцлагдвал мөнгө бүтнээрээ буцна. Нядалсны дараа таны хүсэлтээр бол 10% суутгана.</span></div></li>
            </ul>
          </div>
        </div>`),
  );

  const buy = document.getElementById('buy');

  /* On a phone the box sits under the picture; until it is on screen, a bar
     at the foot carries the total and takes the thumb to it. */
  document.querySelector('.sd-dock')?.remove();
  const dock = el(`<div class="sd-dock" hidden>
      <div class="what"><span class="s-money" data-total></span><small data-what></small></div>
      <button class="s-btn s-btn-dark" type="button">Захиалах</button>
    </div>`);
  document.body.append(dock);
  /** The bar at the foot: the total, a line under it, the way on — grey, with the reason as that line, while there is none. */
  const dockSays = (what, label, shut = false) => {
    dock.querySelector('[data-total]').innerHTML = tugrik(total());
    dock.querySelector('[data-what]').textContent = what;
    const button = dock.querySelector('button');
    button.textContent = label;
    button.disabled = shut;
    dock.toggleAttribute('data-closed', shut);
  };
  const toBox = () => {
    const top = buy.getBoundingClientRect().top + window.scrollY - (document.querySelector('.s-bar')?.offsetHeight ?? 0) - 12;
    window.scrollTo({ top, behavior: window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  };
  // The bar hides once the box is on screen: the focus goes into the box with the eye, not left on a bar that is gone.
  buy.tabIndex = -1;
  dock.querySelector('button').addEventListener('click', () => {
    toBox();
    buy.focus({ preventScroll: true });
  });
  if (!gone) {
    dock.hidden = false;
    document.documentElement.setAttribute('data-dock', '');
    if ('IntersectionObserver' in window) {
      // Away once the box reaches the upper half of the screen; back when it has gone above it.
      new IntersectionObserver(([seen]) => dock.toggleAttribute('data-away', seen.isIntersecting), { rootMargin: '0px 0px -50% 0px' }).observe(buy);
    }
  }
  // After a step changes the box, its top is brought back into view if it went above the screen.
  const keepInView = () => {
    if (buy.getBoundingClientRect().top < 0) toBox();
  };

  function paintForm() {
    if (gone) {
      buy.replaceChildren(
        el(`<div class="sd-gone">
              <b>Энэ зар дууссан</b>
              <p>Нийлүүлэгч дахин нэмбэл энд гарна. Одоо байгаа бусад ${esc(OF_KIND[l.kind]?.toLowerCase() ?? '')} зарыг үзээрэй.</p>
              <a class="s-btn s-btn-line" href="/shop?kind=${esc(l.kind)}">Бусад зар</a>
            </div>`),
      );
      return;
    }
    buy.replaceChildren(
      el(`<div>
            <div class="sd-price"><span class="s-money">${tugrik(l.price_mnt)}</span><small>/ ${unit}</small></div>
            <p class="sd-sub">${whole ? `Нэг толгой ойролцоогоор ${l.approx_kg} кг` : `Доод тал нь ${l.min_qty} кг`} · ${l.remaining} ${unit} үлдсэн</p>
            <div id="closed-slot"></div>
            <div class="sd-form">
              <div class="sd-q">
                <span id="qty-label">${whole ? 'Хэдэн толгой' : 'Хэдэн кг'}</span>
                <div class="sd-qty" role="group" aria-labelledby="qty-label">
                  <button type="button" data-d="-1" aria-label="Хасах">${MARK.minus}</button>
                  <output id="qty" aria-live="polite"></output>
                  <button type="button" data-d="1" aria-label="Нэмэх">${MARK.plus}</button>
                </div>
                ${whole ? '' : `<p class="s-help">${step} кг-аар нэмэгдэнэ.</p>`}
              </div>
              <div class="sd-q">
                <span id="way-label">Хэрхэн авах</span>
                <div class="sd-ways" role="radiogroup" aria-labelledby="way-label">
                  <button class="sd-way" type="button" role="radio" data-r="pickup"><i></i><span><b>Өөрөө очиж авна</b><small>${esc(l.supplier.pickup_address)}</small></span><em>Үнэгүй</em></button>
                  <button class="sd-way" type="button" role="radio" data-r="delivery"${l.delivers ? '' : ' disabled'}><i></i><span><b>Хүргүүлнэ</b><small>${l.delivers ? 'Нийлүүлэгч таны хаяг руу хүргэнэ' : 'Энэ нийлүүлэгч хүргэдэггүй'}</small></span><em>${l.delivers ? `+<span class="s-money">${tugrik(l.delivery_fee_mnt)}</span>` : ''}</em></button>
                </div>
              </div>
              <label class="s-field"><span id="when-label">Очиж авах өдөр</span><input class="s-input" type="date" id="when" min="${esc(earliest(l))}" value="${esc(form.receiveOn)}" aria-describedby="when-help"><small class="s-help" id="when-help">Хамгийн эрт ${dayLabel(earliest(l))}</small></label>
              <div id="where" hidden>
                <label class="s-field"><span>Хүргэх хаяг</span><textarea class="s-input" id="address" rows="3" autocomplete="street-address" placeholder="Дүүрэг, хороо, байр, орц, тоот">${esc(form.address)}</textarea></label>
                <label class="s-field"><span>Хүргэгчийн залгах утас</span><span class="s-affix"><i>+976</i><input class="s-input" id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="9911 2233" value="${esc(form.phone)}"></span></label>
              </div>
              <div class="sd-sum" id="sum"></div>
              <span class="s-error" id="form-error" role="alert"></span>
              <div class="sd-actions"><button class="s-btn s-btn-dark s-btn-lg s-btn-block" type="button" id="next" aria-describedby="next-why">Захиалах</button><p class="sd-why" id="next-why" hidden></p></div>
              <p class="sd-fine">Мах бэлэн болсон өдөр нийлүүлэгч утсаар холбогдож цагаа тохирно.</p>
            </div>
          </div>`),
    );
    const paint = () => {
      buy.querySelector('#qty').innerHTML = `${form.qty}<small> ${unit}</small>`;
      buy.querySelector('[data-d="-1"]').disabled = form.qty - step < l.min_qty;
      buy.querySelector('[data-d="1"]').disabled = form.qty + step > l.remaining;
      // A radio group is one stop for Tab — the way chosen; the arrow keys move between them.
      for (const way of buy.querySelectorAll('.sd-way')) {
        way.setAttribute('aria-checked', String(way.dataset.r === form.receive));
        way.tabIndex = way.dataset.r === form.receive ? 0 : -1;
      }
      buy.querySelector('#where').hidden = form.receive !== 'delivery';
      buy.querySelector('#when-label').textContent = form.receive === 'delivery' ? 'Хүргүүлэх өдөр' : 'Очиж авах өдөр';
      buy.querySelector('#sum').innerHTML = `
        <div><span>${form.qty} ${unit} × ${mnt(l.price_mnt)}</span><span class="s-money">${tugrik(l.price_mnt * form.qty)}</span></div>
        ${form.receive === 'delivery' ? `<div><span>Хүргэлт</span><span class="s-money">${tugrik(l.delivery_fee_mnt)}</span></div>` : ''}
        <div class="total"><span>Нийт</span><span class="s-money">${tugrik(total())}</span></div>`;
      // Payments closed: said at the top of the box, before anything is filled
      // in, and the button grey with its reason under it. A wallet that covers
      // this total still pays, so the box says that instead.
      const able = canPay(total());
      const slot = buy.querySelector('#closed-slot');
      if (pay.open) slot.replaceChildren();
      else if (able) slot.replaceChildren(el('<p class="sd-wallet">Онлайн төлбөр одоогоор хаалттай ч Basu түрийвч тань энэ захиалгад хүрэлцэнэ — түүнээсээ төлнө.</p>'));
      else if (!slot.querySelector('.sh-closed')) slot.replaceChildren(closedNote());
      buy.querySelector('#next').disabled = !able;
      const why = buy.querySelector('#next-why');
      const not = able ? null : notNow('Онлайн төлбөр хаалттай тул одоохондоо захиалах боломжгүй.');
      why.hidden = able;
      why.textContent = not?.why ?? '';
      if (able) dockSays(`${form.qty} ${unit} · ${form.receive === 'delivery' ? 'хүргүүлнэ' : 'очиж авна'}`, 'Захиалах');
      else dockSays(not.short, 'Захиалах', true);
    };
    /**
     * What stops the order going on, said under the field it is about: the
     * field in the stop colour, the words right after it, the focus on it.
     * One line for the whole box (`#form-error`), moved to where it belongs.
     */
    const showProblem = (problem) => {
      const box = buy.querySelector('#form-error');
      for (const marked of buy.querySelectorAll('[aria-invalid]')) marked.removeAttribute('aria-invalid');
      if (!problem) {
        box.textContent = '';
        return;
      }
      const [field, text] = problem;
      (field.closest('.s-affix') ?? field).after(box);
      box.textContent = text;
      field.setAttribute('aria-invalid', 'true');
      field.focus();
    };
    const typed = (event) => {
      if (event.target.hasAttribute('aria-invalid')) showProblem(null);
    };
    buy.querySelector('.sd-qty').addEventListener('click', (event) => {
      const b = event.target.closest('button');
      if (!b || b.disabled) return;
      form.qty = Math.min(l.remaining, Math.max(l.min_qty, form.qty + Number(b.dataset.d) * step));
      paint();
    });
    buy.querySelector('.sd-ways').addEventListener('click', (event) => {
      const b = event.target.closest('.sd-way');
      if (!b || b.disabled) return;
      form.receive = b.dataset.r;
      showProblem(null);
      paint();
    });
    // A radio group answers the arrow keys: the next way that can be chosen, chosen and focused.
    buy.querySelector('.sd-ways').addEventListener('keydown', (event) => {
      const by = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[event.key];
      if (!by) return;
      event.preventDefault();
      const ways = [...buy.querySelectorAll('.sd-way:not([disabled])')];
      const at = ways.findIndex((w) => w.dataset.r === form.receive);
      const next = ways[(at + by + ways.length) % ways.length];
      form.receive = next.dataset.r;
      showProblem(null);
      paint();
      next.focus();
    });
    buy.querySelector('#when').addEventListener('change', (e) => {
      form.receiveOn = e.target.value;
      typed(e);
    });
    buy.querySelector('#address').addEventListener('input', (e) => {
      form.address = e.target.value;
      typed(e);
    });
    // «9911 2233» as it is typed, after the +976 in front of it; sent without the space.
    phoneInput(buy.querySelector('#phone'));
    buy.querySelector('#phone').addEventListener('input', (e) => {
      form.phone = e.target.value;
      typed(e);
    });
    buy.querySelector('#next').addEventListener('click', () => {
      if (!canPay(total())) return;
      const problem = !form.receiveOn || form.receiveOn < earliest(l)
        ? [buy.querySelector('#when'), `Өдрөө сонгоно уу — хамгийн эрт ${dayLabel(earliest(l))}.`]
        : form.receive === 'delivery' && !form.address.trim()
          ? [buy.querySelector('#address'), 'Хүргэх хаягаа бичнэ үү.']
          : form.receive === 'delivery' && form.phone.replace(/\D/g, '').length < 8
            ? [buy.querySelector('#phone'), 'Хүргэгчийн залгах утсаа 8 оронтойгоор бичнэ үү.']
            : null;
      showProblem(problem);
      if (problem) return;
      paintReview();
      keepInView();
      // The button pressed is gone with the form: the focus goes to the review's heading, where its reading starts.
      buy.querySelector('.sd-review h2')?.focus({ preventScroll: true });
    });
    paint();
  }

  /** Before any money moves, the whole order once. */
  function paintReview() {
    const delivery = form.receive === 'delivery';
    // Back at the review after signing in while payments are closed, and the
    // wallet short of the total: said here too, and «Төлөх» grey with its reason.
    const able = canPay(total());
    const not = able ? null : notNow('Онлайн төлбөр хаалттай тул одоохондоо төлөх боломжгүй.');
    buy.replaceChildren(
      el(`<div class="sd-review">
            <h2 tabindex="-1">Захиалгаа шалгана уу</h2>
            <p class="sd-sub">Төлөхөөс өмнө нэг харна уу.</p>
            ${pay.open ? '' : able ? '<p class="sd-wallet">Онлайн төлбөр одоогоор хаалттай тул Basu түрийвчнээсээ төлнө.</p>' : '<div id="closed-slot"></div>'}
            <dl>
              <div><dt>Зар</dt><dd>${esc(l.title)}<small>${esc(l.supplier.name)}</small></dd></div>
              <div><dt>Хэмжээ</dt><dd>${form.qty} ${unit}</dd></div>
              <div><dt>Авах арга</dt><dd>${delivery ? 'Хүргүүлнэ' : 'Өөрөө очиж авна'}<small>${delivery ? `${esc(form.address)} · <span class="sd-tel">${esc(phoneText(form.phone))}</span>` : esc(l.supplier.pickup_address)}</small></dd></div>
              <div><dt>Өдөр</dt><dd>${dayLabel(form.receiveOn)}</dd></div>
            </dl>
            <div class="sd-sum">
              <div><span>${form.qty} ${unit} × ${mnt(l.price_mnt)}</span><span class="s-money">${tugrik(l.price_mnt * form.qty)}</span></div>
              ${delivery ? `<div><span>Хүргэлт</span><span class="s-money">${tugrik(l.delivery_fee_mnt)}</span></div>` : ''}
              <div class="total"><span>Нийт төлөх</span><span class="s-money">${tugrik(total())}</span></div>
            </div>
            <p class="s-error" id="pay-error" role="alert"></p>
            <div class="sd-actions">
              <button class="s-btn s-btn-dark s-btn-lg s-btn-block" type="button" id="pay"${able ? '' : ' disabled aria-describedby="pay-why"'}>${store.guestToken ? `Төлөх · ${mnt(total())}` : 'Нэвтэрч төлөх →'}</button>
              ${able ? '' : `<p class="sd-why" id="pay-why">${esc(not.why)}</p>`}
              <button class="s-btn s-btn-line s-btn-block" type="button" id="edit">Засах</button>
            </div>
            ${store.guestToken ? '' : '<p class="sd-fine">Нэвтэрмэгц энэ захиалга руугаа буцна — сонголт тань хадгалагдана.</p>'}
            <ul class="sd-after">
              <li>${MARK.check}<span>Төлбөр орсны дараа нийлүүлэгч малыг нядалж бэлтгэнэ.</span></li>
              <li>${MARK.check}<span>Нийлүүлэгчийн утас захиалга дээр тань гарна.</span></li>
              <li>${MARK.check}<span>Нядлахаас өмнө цуцлагдвал мөнгө бүтнээрээ буцна.</span></li>
            </ul>
            <p class="sd-fine">Төлснөөр <a href="/terms" target="_blank" rel="noopener">үйлчилгээний нөхцөл</a>-ийг зөвшөөрнө.</p>
          </div>`),
    );
    buy.querySelector('#closed-slot')?.replaceChildren(closedNote());
    dockSays(able ? 'Нийт төлөх' : not.short, 'Төлөх', !able);
    buy.querySelector('#edit').addEventListener('click', () => {
      paintForm();
      keepInView();
      // Back on the form, the focus on its first control rather than lost with the button pressed.
      buy.querySelector('.sd-form :is(button,input,textarea):not(:disabled):not([tabindex="-1"])')?.focus({ preventScroll: true });
    });
    buy.querySelector('#pay').addEventListener('click', async (event) => {
      // Nothing to pay with: never on to a sign-in that ends at «хаалттай».
      if (!canPay(total())) return;
      // Somebody browsing without an account signs in here, and comes back to this order.
      if (!store.guestToken) {
        try {
          sessionStorage.setItem(`basu.shop.${l.id}`, JSON.stringify({ ...form, review: true }));
        } catch {
          // Without storage the form is filled again, that is all.
        }
        // `for=pay`: the door says «to pay» for this press alone, not for the header's «Нэвтрэх» on the same stall.
        location.href = `${loginUrl(`/shop/${l.id}`)}&for=pay`;
        return;
      }
      const button = event.currentTarget;
      if (button.hasAttribute('data-busy')) return;
      button.setAttribute('data-busy', '');
      buy.querySelector('#pay-error').textContent = '';
      const body = {
        listing_id: l.id,
        qty: form.qty,
        receive: form.receive,
        receive_on: form.receiveOn,
        ...(delivery ? { address: form.address.trim(), address_phone: form.phone.replace(/\s+/g, '') } : {}),
      };
      try {
        let bought = await purchase(body);
        // QPay's invoice, still being raised by a press a moment earlier: asked again, once it has its page.
        for (let tries = 0; bought.invoice && !bought.invoice.action_url && tries < 4; tries++) {
          await new Promise((done) => setTimeout(done, 1500));
          bought = await purchase(body);
        }
        if (bought.invoice) {
          // To QPay's page, in this tab: paid there, it sends the person to the order's page, which asks until
          // the payment is confirmed. The attempt is kept, so coming back here is the same order, not a second.
          if (!bought.invoice.action_url) throw new Error('QPay-ийн нэхэмжлэл үүсгэж чадсангүй. Дахин оролдоно уу.');
          button.textContent = 'QPay руу шилжиж байна…';
          location.href = bought.invoice.action_url;
          return;
        }
        try {
          sessionStorage.removeItem(`basu.shop.${l.id}`);
        } catch {
          // nothing kept
        }
        // Bought: the button stays busy, and the attempt ends with the way to
        // the order. An order from before a change, bought by a press whose
        // answer was slow or lost, is the one gone to, and its page says so.
        attempt = null;
        keepAttempt();
        location.href = `/orders/${bought.id}?new=1${bought.what === JSON.stringify(body) ? '' : '&earlier=1'}`;
      } catch (error) {
        // A review drawn again since this press has a press of its own to
        // speak for; this one's words go over its own button, if it is there —
        // where the eye is, as on /idesh, not under «Засах» where it went unread.
        if (!button.isConnected) return;
        button.removeAttribute('data-busy');
        buy.querySelector('#pay-error').textContent = whatWentWrong(error);
      }
    });
  }

  paintForm();
  if (resume) {
    // Only an order that still holds goes straight to its review: enough left, a day still to come, an address for a delivery.
    const holds = !gone && form.qty >= l.min_qty && form.qty <= l.remaining && form.receiveOn >= earliest(l)
      && (form.receive !== 'delivery' || (l.delivers && form.address.trim() && form.phone.replace(/\D/g, '').length >= 8));
    if (holds) {
      paintReview();
      // On a phone the review sits under the picture: bring it up, it is what the person came back for.
      if (buy.getBoundingClientRect().top > window.innerHeight / 2) toBox();
    }
    try {
      sessionStorage.setItem(`basu.shop.${l.id}`, JSON.stringify(form));
    } catch {
      // nothing kept
    }
  }
}

/* ── which page this is ────────────────────────────────────────────── */

async function load() {
  market = await api('/v1/idesh/listings');
  pay.open = market.payments_open !== false;
}

/** What a page that could not be drawn says, with the way to try again. On a stall's page, where nothing else is, its title is the page's heading. */
const couldNot = (error, again, heading = 0) =>
  siteEmpty({ icon: 'alert', title: 'Зарыг ачаалж чадсангүй', text: whatWentWrong(error), actions: [['Дахин ачаалах', again, 'dark']], card: true, heading });

const stallId = location.pathname.match(/^\/shop\/([0-9a-f-]{36})$/)?.[1];
if (stallId) {
  // While it comes: blocks in the shape of the page, so nothing jumps when it lands.
  page.replaceChildren(
    crumb(),
    el(`<div class="sd-wait" role="status" aria-busy="true" aria-label="Зар ачаалж байна"><span class="s-skel t"></span><span class="s-skel w"></span><div class="g"><span class="s-skel p"></span><span class="s-skel b"></span></div></div>`),
  );
  try {
    // The stall's own answer says the day and whether money can be taken: the whole market is not asked for that.
    const { listing, today, payments_open: open } = await api(`/v1/idesh/listings/${stallId}`);
    market.today = today;
    pay.open = open !== false;
    await lookAtWallet();
    drawStall(listing);
  } catch (error) {
    page.replaceChildren(
      crumb(),
      error.status === 404 || error.status === 400
        ? siteEmpty({
            icon: 'shop',
            title: 'Зар олдсонгүй',
            text: 'Энэ зар устгагдсан эсвэл нуугдсан байж магадгүй. Одоо байгаа зарыг үзээрэй.',
            actions: [['Бүх зар', '/shop', 'dark']],
            card: true,
            heading: 1,
          })
        : couldNot(error, location.pathname, 1),
    );
  }
} else {
  drawMarket();
  try {
    await load();
    loaded = true;
    paintKinds();
    paintGrid();
    // How it goes, under the cards, its paying step said from the market's own answer — not asked for a second time.
    document.getElementById('grid').after(howToBuy({ paymentsOpen: pay.open }));
    comeBack();
  } catch (error) {
    // Nothing to filter: the bar that held its place goes with the skeleton.
    document.getElementById('sh-bar').hidden = true;
    const grid = document.getElementById('grid');
    grid.removeAttribute('aria-busy');
    grid.replaceChildren(couldNot(error, location.pathname + location.search));
  }
}
</script>
</body>
</html>
